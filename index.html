<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>KDR AI | System Procedur</title>
    <style>
        :root {
            --bg: #020617;
            --bg2: #08101e;
            --panel: rgba(15, 23, 42, 0.92);
            --text: #f8fafc;
            --muted: #94a3b8;
            --line: #1e293b;
            --warn: #eab308;
            --ok: #10b981;
            --ok-soft: rgba(16, 185, 129, 0.14);
            --accent: #ef4444;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(220, 38, 38, 0.16), transparent 34%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg) 45%, var(--bg2) 100%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body { padding: 8px; }

        .app-shell {
            max-width: 920px;
            margin: 0 auto;
            min-height: calc(100vh - 16px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header {
            border-bottom: 1px solid var(--line);
            padding-bottom: 6px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            font-style: italic;
            color: var(--accent);
        }

        .version {
            font-size: 0.54rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.08em;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn,
        .search-btn {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.92);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .toolbar-btn.install-ready {
            border-color: var(--ok);
            color: #6ee7b7;
            background: var(--ok-soft);
        }

        .api-status-card {
            min-width: 0;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            display: grid;
            gap: 3px;
            font-size: 12px;
            line-height: 1.35;
        }

        .api-status-card small {
            color: #94a3b8;
            overflow-wrap: anywhere;
        }

        .manual-input {
            width: 100%;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            outline: none;
        }

        .manual-input::placeholder {
            color: #64748b;
        }

        #debug-console {
            margin-top: 8px;
            height: 160px;
            overflow-y: auto;
            border-radius: 10px;
            padding: 6px 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10px;
            line-height: 1.35;
            background: rgba(0, 0, 0, 0.36);
            border-left: 3px solid var(--accent);
            color: #facc15;
        }

        .debug-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .debug-line.error { color: #f87171; }
        .debug-line.info { color: #facc15; }
        .debug-line.success { color: #6ee7b7; }
        .debug-line.warning { color: #fdba74; }
        .debug-line.load-status {
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .manual-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .status-line {
            min-height: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .output-wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 6px 2px 18px;
            border-top: 1px solid rgba(30, 41, 59, 0.6);
        }

        #procedure-output {
            text-align: center;
            font-weight: 900;
            line-height: 1.15;
            font-size: clamp(1.4rem, 4.5vw, 3rem);
        }

        .empty-state {
            margin-top: 48px;
            color: #475569;
            font-style: italic;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .source-badge {
            display: inline-block;
            margin-bottom: 10px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid var(--ok);
            background: var(--ok-soft);
            color: #6ee7b7;
        }

        .procedure-prefix {
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 12px;
            font-style: italic;
            font-weight: 600;
        }

        .procedure-card {
            text-align: left;
            border-top: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.42), rgba(15, 23, 42, 0.18));
            border-radius: 16px;
            padding: 18px;
        }

        .procedure-line {
            display: block;
            margin-bottom: 10px;
            font-size: clamp(0.98rem, 2vw, 1.2rem);
            line-height: 1.45;
            font-weight: 700;
        }

        .step-no { color: var(--warn); }

        .procedure-list {
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .proc-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: start;
            padding: 6px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.45);
        }

        .proc-row:last-child { border-bottom: none; }

        .proc-name {
            color: #e2e8f0;
            text-align: left;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 600;
        }

        .proc-open {
            border: 0;
            background: transparent;
            color: #e2e8f0;
            text-align: left;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 700;
            padding: 0;
            cursor: pointer;
        }

        .proc-open:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .search-results-card {
            display: grid;
            gap: 10px;
            text-align: left;
        }

        .search-result-btn {
            width: 100%;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: left;
        }

        .search-result-btn:hover {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.95);
        }

        .search-result-title {
            display: block;
            font-size: 0.95rem;
            line-height: 1.35;
            font-weight: 800;
        }

        .search-result-meta {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
            font-size: 0.72rem;
            line-height: 1.4;
        }

        .full-document-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #334155;
        }

        .full-document-link,
        .full-document-disabled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
        }

        .full-document-link {
            border: 1px solid #10b981;
            background: rgba(16, 185, 129, 0.14);
            color: #6ee7b7;
        }

        .full-document-disabled {
            border: 1px solid #475569;
            background: rgba(71, 85, 105, 0.16);
            color: #94a3b8;
            cursor: not-allowed;
        }

        .full-document-source {
            display: block;
            margin-top: 8px;
            color: #64748b;
            font-size: 0.7rem;
            line-height: 1.4;
        }

        .full-document-heading {
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 0.76rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .full-document-item + .full-document-item {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #334155;
        }

        .full-document-meta {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
            font-size: 0.68rem;
            line-height: 1.4;
        }

        .full-document-status {
            display: inline-block;
            margin-left: 6px;
            color: #6ee7b7;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .footer {
            position: static;
            display: flex;
            justify-content: center;
            margin-top: 8px;
            padding: 6px 0 4px;
        }

        .footer-inner {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mic-btn,
        .reset-btn {
            width: min(28vw, 112px);
            height: min(28vw, 112px);
            border-radius: 999px;
            border: 4px solid #334155;
            background: rgba(2, 6, 23, 0.92);
            color: #e2e8f0;
            font-size: 0.86rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .reset-btn {
            display: none;
            color: #facc15;
            border-color: #eab308;
        }

        .mic-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hidden { display: none !important; }

        /* ===== v19.3.0: stan, ustawienia, ekran startowy, podpowiedzi ===== */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-right: auto;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #334155;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            flex: 0 0 auto;
        }
        .status-pill.success .status-dot { background: var(--ok); }
        .status-pill.warning .status-dot { background: var(--warn); }
        .status-pill.error .status-dot { background: var(--accent); }
        .status-pill.error { color: #fca5a5; border-color: #7f1d1d; }

        .toolbar-btn.active {
            border-color: #38bdf8;
            color: #bae6fd;
        }

        .settings-panel {
            margin-top: 8px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            background: var(--panel);
        }
        .settings-group { display: grid; gap: 8px; align-content: start; }
        .settings-title {
            margin: 0;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .setting-toggle {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .setting-toggle input {
            width: 18px;
            height: 18px;
            margin-top: 1px;
            flex: 0 0 auto;
            accent-color: var(--ok);
        }
        .setting-toggle small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-weight: 500;
            font-size: 11px;
            line-height: 1.35;
        }
        .debug-details summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
        }

        .status-line.notice {
            color: #fdba74;
            font-style: normal;
            text-transform: none;
            font-size: 12px;
            letter-spacing: 0;
        }

        .search-wrap { position: relative; min-width: 0; }
        .suggest-list {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            z-index: 20;
            display: grid;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            background: #0b1324;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }
        .suggest-item {
            display: grid;
            gap: 2px;
            text-align: left;
            border: 0;
            border-bottom: 1px solid #1e293b;
            background: transparent;
            color: var(--text);
            padding: 10px 12px;
            cursor: pointer;
        }
        .suggest-item:last-child { border-bottom: 0; }
        .suggest-item:hover,
        .suggest-item.active { background: #1e293b; }
        .suggest-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
        .suggest-meta { font-size: 11px; color: var(--muted); }

        .home { display: grid; gap: 16px; text-align: left; }
        .home-section { display: grid; gap: 8px; }
        .home-title {
            margin: 0;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 8px;
        }
        .tile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            min-height: 58px;
            border: 1px solid #334155;
            border-left: 4px solid var(--accent);
            background: rgba(15, 23, 42, 0.92);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
        }
        .tile:hover { border-color: #475569; background: #111c33; }
        .tile-label { font-size: 13px; font-weight: 800; line-height: 1.25; }
        .tile-count {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }
        .tile-edu { border-left-color: #38bdf8; }

        .empty-state.searching { animation: pulse 1.2s infinite; }
        .home + .empty-state, .empty-state + .home { margin-top: 16px; }

        .card-head {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .group-badge {
            display: inline-block;
            margin-bottom: 10px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .group-badge.group-edu,
        .list-group-title.group-edu { color: #7dd3fc; border-color: #0369a1; }
        .card-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .card-action {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }
        .card-action.is-on { border-color: var(--warn); color: #fde68a; }

        .v2-box, .v2-section { margin-bottom: 14px; }
        .v2-box { border-radius: 12px; padding: 10px 12px; border-left: 4px solid; }
        .v2-first { border-left-color: var(--accent); background: rgba(239, 68, 68, 0.12); }
        .v2-dont { border-left-color: var(--warn); background: rgba(234, 179, 8, 0.12); }
        .v2-support { border-left-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .v2-title {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--warn);
        }
        .v2-first .v2-title { color: #fca5a5; }
        .v2-support .v2-title { color: #7dd3fc; }
        .v2-list { margin: 0; padding-left: 20px; }
        .v2-list li {
            margin-bottom: 6px;
            font-size: clamp(0.98rem, 2vw, 1.15rem);
            line-height: 1.4;
            font-weight: 700;
        }
        .v2-page { color: var(--muted); font-size: 0.7em; font-weight: 600; white-space: nowrap; }
        .v2-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 6px;
            margin-bottom: 14px;
        }
        .v2-param {
            display: grid;
            gap: 2px;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 10px;
        }
        .v2-param-wide { grid-column: 1 / -1; }
        .v2-param-name { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .v2-param-value { font-size: 1rem; font-weight: 900; }
        body.large-text .v2-list li { font-size: 1.35rem; }

        .card-freshness {
            margin: -6px 0 12px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }
        .card-freshness.is-warn { color: #fdba74; }
        .full-document-status.status-warn { color: #fdba74; }
        .full-document-status.status-info { color: #93c5fd; }

        .procedure-line.line-critical,
        .procedure-line.line-warning {
            padding: 8px 10px;
            border-radius: 10px;
            border-left: 4px solid;
        }
        .procedure-line.line-critical {
            border-left-color: var(--accent);
            background: rgba(239, 68, 68, 0.12);
        }
        .procedure-line.line-warning {
            border-left-color: var(--warn);
            background: rgba(234, 179, 8, 0.12);
        }

        .list-group-title {
            margin: 14px 0 4px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fca5a5;
        }
        .list-group-title:first-child { margin-top: 0; }
        .list-group-title span { color: var(--muted); }
        .result-edu { border-left: 3px solid #38bdf8; }

        body.large-text .procedure-line { font-size: 1.35rem; line-height: 1.5; }
        body.large-text .procedure-prefix { font-size: 15px; }
        body.large-text .search-result-title { font-size: 1.15rem; }
        body.large-text .proc-open,
        body.large-text .tile-label { font-size: 15px; }

        body.high-contrast {
            --text: #ffffff;
            --muted: #cbd5e1;
            --line: #64748b;
        }
        body.high-contrast,
        html:has(body.high-contrast) { background: #000; }
        body.high-contrast .procedure-card,
        body.high-contrast .search-result-btn,
        body.high-contrast .tile,
        body.high-contrast .chip,
        body.high-contrast .toolbar-btn,
        body.high-contrast .manual-input,
        body.high-contrast .settings-panel {
            background: #000;
            border-color: #94a3b8;
        }
        body.high-contrast .proc-open,
        body.high-contrast .proc-name { color: #fff; }

        .listening {
            animation: pulse 1s infinite;
            background: rgba(127, 29, 29, 0.92) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.35);
        }

        .helper {
            color: #64748b;
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
        }

        body.result-mode .mic-btn,
        body.result-mode .reset-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 108px;
            height: 42px;
            padding: 0 16px;
            border-width: 2px;
            border-radius: 999px;
            font-size: 0.82rem;
            box-shadow: 0 0 26px rgba(0, 0, 0, 0.18);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.985); }
        }

        @media (max-width: 640px) {
            .manual-panel { grid-template-columns: 1fr; }

            .search-btn { width: 100%; }
            .toolbar .toolbar-btn { flex: 1 1 0; padding: 9px 6px; }
            .status-pill { flex: 1 1 100%; }
            .settings-panel .toolbar-btn { width: 100%; }

            #debug-console { height: 160px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="header">
            <div class="header-row">
                <h1 class="title">KDR AI SYSTEM</h1>
                <span class="version">v19.19.0 ENERGETYKA PSE</span>
            </div>

            <div class="toolbar">
                <span id="status-pill" class="status-pill" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="status-text">Uruchamianie…</span>
                </span>
                <button id="voice-help-btn" class="toolbar-btn" type="button">Wszystkie procedury</button>
                <button id="settings-btn" class="toolbar-btn" type="button" aria-expanded="false" aria-controls="settings-panel">Ustawienia</button>

 2020","str":3},{"t":"Płomień wolno ugasić tylko, gdy ogrzewa płaszcz tej butli, inne butle lub materiały grożące eskalacją.","zr":"SZP C2H2 2020","str":3},{"t":"Gaz się nie pali — mierz stężenie (zagrożenie wybuchem), usuń źródła zapłonu.","zr":"SZP C2H2 2020","str":3}]},{"etykieta":"Test zwilżania","punkty":[{"t":"Przerwij chłodzenie; obserwuj, czy nad butlą unosi się para (lornetka, kamera termowizyjna, oświetlenie).","zr":"SZP C2H2 2020","str":4},{"t":"Para albo powierzchnia wysycha w założonym czasie (np. do 10 min) — chłodź kolejną 1 h i powtórz test.","zr":"SZP C2H2 2020","str":4},{"t":"Nie wysycha — sprawdź organoleptycznie, czy cała powierzchnia jest zimna; ciepłe miejsca = chłodź min. 1 h i powtórz.","zr":"SZP C2H2 2020","str":4},{"t":"Cała zimna — sprawdź szczelność z bliska (dźwięk, bąbelki, uszkodzenia; eksplozymetr, spryskiwacz).","zr":"SZP C2H2 2020","str":4}]},{"etykieta":"Po teście","punkty":[{"t":"Zimna i szczelna — można przenieść do zbiornika z wodą (krótka droga, małe zagrożenie dla otoczenia) i kontynuować 24 h.","zr":"SZP C2H2 2020","str":4},{"t":"Nieszczelna — zalecane dalsze chłodzenie prądami wody; zbiornik tylko przy nieznacznym ryzyku pożarowo-wybuchowym.","zr":"SZP C2H2 2020","str":4}]}],"nie_rob":[{"t":"Nie przerywaj chłodzenia przed testem zwilżania; nie ignoruj pary ani szybkiego wysychania.","zr":"SZP C2H2 2020","str":4},{"t":"Ogranicz liczbę ratowników w strefie do niezbędnego minimum.","zr":"SZP C2H2 2020","str":3}],"tagi_wspolne":["acetylen","butla acetylenowa","pozar","butla po pozarze","butla podgrzana"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":3,"sekcja":"Karta Z1 (s. 3–4), algorytm — załącznik nr 1 (s. 11)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa zagrożenia — zalecany promień min. 200 m; ewakuuj ludzi, ostrzeż ratowników. Nie zbliżaj się do butli i jej nie przemieszczaj. Chłodź prądami wody (zalecane rozproszone) ze stanowisk bezobsługowych (działka, ustabilizowane prądownice), zza osłon. Bez zagrożenia życia ludzi i bez możliwości stanowisk bezobsługowych lub osłon — rozważ pozostawienie butli bez chłodzenia.\n2. PARAMETRY: Strefa — min. 200 m; mniejsza za osłonami; w obiekcie o solidnej konstrukcji granicą mogą być jego ściany; Ochrona w promieniu 30 m — ochrona dróg oddechowych + ochrona oczu przed błyskiem (przyłbice, okulary metalizowane); Czas chłodzenia — min. 1 h (cała powierzchnia mokra); min. 3 h, gdy woda dociera do < ok. 50% powierzchni; Proces łączny — 24 h chłodzenia\n3. BUTLA NIESZCZELNA: Gaz się pali — chłodź do opróżnienia butli, nie gasząc płomienia (szczególnie w obiekcie). Płomień wolno ugasić tylko, gdy ogrzewa płaszcz tej butli, inne butle lub materiały grożące eskalacją. Gaz się nie pali — mierz stężenie (zagrożenie wybuchem), usuń źródła zapłonu.\n4. TEST ZWILŻANIA: Przerwij chłodzenie; obserwuj, czy nad butlą unosi się para (lornetka, kamera termowizyjna, oświetlenie). Para albo powierzchnia wysycha w założonym czasie (np. do 10 min) — chłodź kolejną 1 h i powtórz test. Nie wysycha — sprawdź organoleptycznie, czy cała powierzchnia jest zimna; ciepłe miejsca = chłodź min. 1 h i powtórz. Cała zimna — sprawdź szczelność z bliska (dźwięk, bąbelki, uszkodzenia; eksplozymetr, spryskiwacz).\n5. PO TEŚCIE: Zimna i szczelna — można przenieść do zbiornika z wodą (krótka droga, małe zagrożenie dla otoczenia) i kontynuować 24 h. Nieszczelna — zalecane dalsze chłodzenie prądami wody; zbiornik tylko przy nieznacznym ryzyku pożarowo-wybuchowym.\n6. NIE RÓB: Nie przerywaj chłodzenia przed testem zwilżania; nie ignoruj pary ani szybkiego wysychania. Ogranicz liczbę ratowników w strefie do niezbędnego minimum."},{"id":"KARTA-ACETYLEN-Z2","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem butli z acetylenem, wydanie II, 13.03.2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"nieszczelna butla acetylen wewnatrz obiektu","keywords":["wyciek acetylen na dróg oddechowych + ochrona oczu przed błyskiem","zr":"SZP C2H2 2020","str":6},{"nazwa":"Sprzęt w strefie","wartosc":"nieiskrzący, przeciwwybuchowy co najmniej EEx IIC T2","zr":"SZP C2H2 2020","str":6}],"sekcje":[{"etykieta":"Działania","punkty":[{"t":"Ratowników w strefie osłaniaj rozproszonym prądem wody; narzędzia nieiskrzące, urządzenia przeciwwybuchowe (co najmniej EEx IIC T2).","zr":"SZP C2H2 2020","str":6},{"t":"Bez zagrożenia wybuchem — spróbuj zakręcić zawór.","zr":"SZP C2H2 2020","str":6},{"t":"Po zakręceniu: butla ciepła — karta Z1; cała zimna — można przenieść w bezpieczniejsze miejsce.","zr":"SZP C2H2 2020","str":6}]}],"nie_rob":[{"t":"Ogranicz liczbę ratowników w strefie do niezbędnego minimum.","zr":"SZP C2H2 2020","str":6}],"tagi_wspolne":["acetylen","butla acetylenowa","wyciek"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":6,"sekcja":"Karta Z3 (s. 6)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Promień strefy wg wskazań przyrządów pomiarowych, nie mniej niż 30 m; ewakuuj ludzi. Usuń źródła zapłonu; mierz zasięg mieszaniny wybuchowej.\n2. PARAMETRY: Strefa — wg pomiarów, min. 30 m; Ochrona w strefie — ochrona dróg oddechowych + ochrona oczu przed błyskiem; Sprzęt w strefie — nieiskrzący, przeciwwybuchowy co najmniej EEx IIC T2\n3. DZIAŁANIA: Ratowników w strefie osłaniaj rozproszonym prądem wody; narzędzia nieiskrzące, urządzenia przeciwwybuchowe (co najmniej EEx IIC T2). Bez zagrożenia wybuchem — spróbuj zakręcić zawór. Po zakręceniu: butla ciepła — karta Z1; cała zimna — można przenieść w bezpieczniejsze miejsce.\n4. NIE RÓB: Ogranicz liczbę ratowników w strefie do niezbędnego minimum."},{"id":"KARTA-ACETYLEN-Z4","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem butli z acetylenem, wydanie II, 13.03.2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"szczelna butla acetylen","keywords":["butla acetylen nieuszkodzona","zimna butla acetylen","karta z4 acetylen"],"aliasy":["butla acetylen nieuszkodzona","zimna butla acetylen","karta z4 acetylen"],"prefix":"Acetylen Z4 — butla szczelna, niepoddana działaniu ognia/ciepła: sprawdzenie temperatury i szczelności (SZP KG PSP 2020).","najpierw":[{"t":"Sprawdź organoleptycznie, czy cała powierzchnia butli jest zimna; ciepła (całość lub część) — karta Z1.","zr":"SZP C2H2 2020","str":7},{"t":"Temperatura płaszcza jak otoczenia — sprawdź szczelność z bliska: zapach, dźwięk gazu, bąbelki, uszkodzenia (przyrząd, spryskiwacz).","zr":"SZP C2H2 2020","str":7}],"parametry":[],"sekcje":[{"etykieta":"Dalej","punkty":[{"t":"Nieszczelna — karta Z2 (wewnątrz obiektu) lub Z3 (na zewnątrz).","zr":"SZP C2H2 2020","str":7},{"t":"Szczelna, ale grozi jej ogień, ciepło lub upadek z wysokości — przenieś w bezpieczne miejsce.","zr":"SZP C2H2 2020","str":7}]}],"tagi_wspolne":["acetylen","butla acetylenowa","butla szczelna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":7,"sekcja":"Karta Z4 (s. 7)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Sprawdź organoleptycznie, czy cała powierzchnia butli jest zimna; ciepła (całość lub część) — karta Z1. Temperatura płaszcza jak otoczenia — sprawdź szczelność z bliska: zapach, dźwięk gazu, bąbelki, uszkodzenia (przyrząd, spryskiwacz).\n2. DALEJ: Nieszczelna — karta Z2 (wewnątrz obiektu) lub Z3 (na zewnątrz). Szczelna, ale grozi jej ogień, ciepło lub upadek z wysokości — przenieś w bezpieczne miejsce."},{"id":"KARTA-ACETYLEN-PRZEKAZANIE","wzorzec":2,"kategoria":"organizacja","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem butli z acetylenem, wydanie II, 13.03.2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"przekazanie miejsca zdarzenia acetylen","keywords":["przekazanie butli acetylenowej","udt tdt wdt acetylen","zakonczenie dzialan acetylen","przekazanie po chlodzeniu butli","protokol przekazania acetylen","po akcji butla acetylenowa","przekazanie acetylen"],"aliasy":["przekazanie butli acetylenowej","udt tdt wdt acetylen","zakonczenie dzialan acetylen","przekazanie po chlodzeniu butli","protokol przekazania acetylen","po akcji butla acetylenowa","przekazanie acetylen"],"prefix":"Przekazanie miejsca zdarzenia po działaniach z butlami acetylenowymi — warunki dla Z1–Z4, UDT/TDT/WDT (SZP KG PSP 2020).","najpierw":[{"t":"Z1 — przekaż po zakończeniu 24 h chłodzenia; powiadom UDT, TDT lub WDT.","zr":"SZP C2H2 2020","str":8},{"t":"W potwierdzeniu przekazania wpisz czas rozpoczęcia i zakończenia chłodzenia, powiadomienia oraz zakaz użytkowania butli do dopuszczenia przez UDT/TDT/WDT.","zr":"SZP C2H2 2020","str":8}],"parametry":[],"sekcje":[{"etykieta":"Z1 — szczegóły","punkty":[{"t":"Butla zanurzona w zbiorniku przed upływem 24 h — wpisz czas rozpoczęcia chłodzenia i wymagany czas kontynuacji.","zr":"SZP C2H2 2020","str":8},{"t":"Dzierżawca butli — powiadom też firmę-właściciela (dane na naklejkach lub wybite w górnej części płaszcza).","zr":"SZP C2H2 2020","str":8},{"t":"Brak kontaktu z UDT/TDT/WDT — przekaż informację najszybciej, jak to możliwe, i odnotuj w informacji ze zdarzenia.","zr":"SZP C2H2 2020","str":8}]},{"etykieta":"Z2, Z3, Z4","punkty":[{"t":"Z2 — po zakręceniu zaworu i potwierdzeniu, że butla jest zimna, albo po opróżnieniu butli.","zr":"SZP C2H2 2020","str":8},{"t":"Z3 — po zakręceniu zaworu albo po opróżnieniu butli.","zr":"SZP C2H2 2020","str":9},{"t":"Opróżnienie butli wpisz do dokumentu — zwłaszcza gdy nie pozostało ciśnienie resztkowe.","zr":"SZP C2H2 2020","str":9},{"t":"Z4 — gdy butle są w miejscu bezpiecznym.","zr":"SZP C2H2 2020","str":9}]},{"etykieta":"Kontakty","punkty":[{"t":"Dane producentów i dystrybutorów butli (Air Products, Eurogaz, Linde, Messer) — tabela w SZP; SK KP/KM powinno mieć kontakty lokalne.","zr":"SZP C2H2 2020","str":10}]}],"tagi_wspolne":["acetylen","butla acetylenowa","przekazanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":8,"sekcja":"Przekazanie miejsca zdarzenia (s. 8–9), informacje dodatkowe (s. 10)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Z1 — przekaż po zakończeniu 24 h chłodzenia; powiadom UDT, TDT lub WDT. W potwierdzeniu przekazania wpisz czas rozpoczęcia i zakończenia chłodzenia, powiadomienia oraz zakaz użytkowania butli do dopuszczenia przez UDT/TDT/WDT.\n2. Z1 — SZCZEGÓŁY: Butla zanurzona w zbiorniku przed upływem 24 h — wpisz czas rozpoczęcia chłodzenia i wymagany czas kontynuacji. Dzierżawca butli — powiadom też firmę-właściciela (dane na naklejkach lub wybite w górnej części płaszcza). Brak kontaktu z UDT/TDT/WDT — przekaż informację najszybciej, jak to możliwe, i odnotuj w informacji ze zdarzenia.\n3. Z2, Z3, Z4: Z2 — po zakręceniu zaworu i potwierdzeniu, że butla jest zimna, albo po opróżnieniu butli. Z3 — po zakręceniu zaworu albo po opróżnieniu butli. Opróżnienie butli wpisz do dokumentu — zwłaszcza gdy nie pozostało ciśnienie resztkowe. Z4 — gdy butle są w miejscu bezpiecznym.\n4. KONTAKTY: Dane producentów i dystrybutorów butli (Air Products, Eurogaz, Linde, Messer) — tabela w SZP; SK KP/KM powinno mieć kontakty lokalne."},{"id":"KARTA-ACETYLEN-ROZPOZNANIE","wzorzec":2,"kategoria":"rozpoznanie","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem butli z acetylenem, wydanie II, 13.03.2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"rozpoznanie butli acetylen","keywords":["jak rozpoznac butle z acetylenem","czy butla acetylen jest szczelna","ocena butli acetylen","podejrzenie rozkladu acetylenu","rozpoznanie acetylen"],"aliasy":["jak rozpoznac butle z acetylenem","czy butla acetylen jest szczelna","ocena butli acetylen","podejrzenie rozkladu acetylenu","rozpoznanie acetylen"],"prefix":"Butle z acetylenem — rozpoznanie i kwalifikacja do kart Z1–Z4 (SZP KG PSP 2020).","najpierw":[{"t":"Nie zbliżaj się do butli i jej nie przemieszczaj.","zr":"SZP C2H2 2020","str":2},{"t":"Nie znasz stanu butli — jak najszybciej podaj rozproszony prąd wody na całą powierzchnię i obserwuj parowanie; para = kontynuuj chłodzenie.","zr":"SZP C2H2 2020","str":2},{"t":"Brak pewnej informacji o stanie butli — maksymalne środki ochrony i działania wg karty Z1.","zr":"SZP C2H2 2020","str":2}],"parametry":[{"nazwa":"UN / nr zagrożenia","wartosc":"UN 1001 lub 3374 · 239","zr":"SZP C2H2 2020","str":1},{"nazwa":"Granice wybuchowości","wartosc":"2,3–82% obj. w powietrzu; gaz lżejszy od powietrza","zr":"SZP C2H2 2020","str":1},{"nazwa":"Powyżej 65°C w butli","wartosc":"brak przestrzeni parowej — gwałtowny wzrost ciśnienia, rozerwanie hydrauliczne","zr":"SZP C2H2 2020","str":1},{"nazwa":"Zawartość butli","wartosc":"8 kg (40 dm³) / 10 kg (50 dm³)","zr":"SZP C2H2 2020","str":1}],"sekcje":[{"etykieta":"Oznaki zagrożenia","punkty":[{"t":"Obserwuj z dystansu (lornetka, aparat, kamera z zoomem); pomocniczo kamera termowizyjna lub pirometr.","zr":"SZP C2H2 2020","str":2},{"t":"Okopcenie, złuszczona farba, przebarwienia, nadpalone naklejki, spalone opony wózka, przewody uszkodzone termicznie, zawirowanie powietrza = możliwy rozkład acetylenu lub działanie ognia/ciepła.","zr":"SZP C2H2 2020","str":2},{"t":"Płomień intensywny — zwiększone ciśnienie; żółty lub kopcący — zmniejszone ciśnienie; sadza, ciemny dym, nierówny strumień — rozkład acetylenu.","zr":"SZP C2H2 2020","str":2},{"t":"Szczelność oceniaj wzrokowo z odległości i z informacji personelu oraz świadków.","zr":"SZP C2H2 2020","str":2}]},{"etykieta":"Kwalifikacja","punkty":[{"t":"Z1 — butla poddana działaniu ognia, ciepła lub wielokrotnym uderzeniom (szczelna lub nie).","zr":"SZP C2H2 2020","str":2},{"t":"Z2 — niepoddana, nieszczelna, wewnątrz obiektu · Z3 — niepoddana, nieszczelna, na zewnątrz · Z4 — niepoddana, szczelna.","zr":"SZP C2H2 2020","str":2}]},{"etykieta":"Zagrożenia","punkty":[{"t":"Wybuch możliwy z dostępem i bez dostępu powietrza; groźny także po usunięciu źródła ciepła, przy upadku z wysokości i wycieku w pomieszczeniu.","zr":"SZP C2H2 2020","str":1},{"t":"Dla ratowników: fala ciśnienia, odłamki, kula ognia, uszkodzenie konstrukcji, uduszenie (mało tlenu w pomieszczeniu).","zr":"SZP C2H2 2020","str":1}]}],"tagi_wspolne":["acetylen","butla acetylenowa","rozpoznanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":2,"sekcja":"Charakterystyka (s. 1), rozpoznanie (s. 2)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Nie zbliżaj się do butli i jej nie przemieszczaj. Nie znasz stanu butli — jak najszybciej podaj rozproszony prąd wody na całą powierzchnię i obserwuj parowanie; para = kontynuuj chłodzenie. Brak pewnej informacji o stanie butli — maksymalne środki ochrony i działania wg karty Z1.\n2. PARAMETRY: UN / nr zagrożenia — UN 1001 lub 3374 · 239; Granice wybuchowości — 2,3–82% obj. w powietrzu; gaz lżejszy od powietrza; Powyżej 65°C w butli — brak przestrzeni parowej — gwałtowny wzrost ciśnienia, rozerwanie hydrauliczne; Zawartość butli — 8 kg (40 dm³) / 10 kg (50 dm³)\n3. OZNAKI ZAGROŻENIA: Obserwuj z dystansu (lornetka, aparat, kamera z zoomem); pomocniczo kamera termowizyjna lub pirometr. Okopcenie, złuszczona farba, przebarwienia, nadpalone naklejki, spalone opony wózka, przewody uszkodzone termicznie, zawirowanie powietrza = możliwy rozkład acetylenu lub działanie ognia/ciepła. Płomień intensywny — zwiększone ciśnienie; żółty lub kopcący — zmniejszone ciśnienie; sadza, ciemny dym, nierówny strumień — rozkład acetylenu. Szczelność oceniaj wzrokowo z odległości i z informacji personelu oraz świadków.\n4. KWALIFIKACJA: Z1 — butla poddana działaniu ognia, ciepła lub wielokrotnym uderzeniom (szczelna lub nie). Z2 — niepoddana, nieszczelna, wewnątrz obiektu · Z3 — niepoddana, nieszczelna, na zewnątrz · Z4 — niepoddana, szczelna.\n5. ZAGROŻENIA: Wybuch możliwy z dostępem i bez dostępu powietrza; groźny także po usunięciu źródła ciepła, przy upadku z wysokości i wycieku w pomieszczeniu. Dla ratowników: fala ciśnienia, odłamki, kula ognia, uszkodzenie konstrukcji, uduszenie (mało tlenu w pomieszczeniu)."},{"id":"KARTA-BUD-BEZPIECZENSTWO-DZIALAN-GRUZOWISKO","wzorzec":2,"kategoria":"dzialania","zrodlo":"KG PSP: Zasady organizacji działań poszukiwawczo-ratowniczych w KSRG (2023, nowelizacja grudzień 2023) z załącznikami","data_aktualizacji":"2026-10-27","slowo_kluczowe":"bezpieczenstwo dzialan na gruzowisku","keywords":["gejzer","cisza na gruzowisku","obszar zamknięty gruzowisko","oficer bezpieczeństwa","sygnały alarmowe na gruzowisku","oznakowanie poszkodowanych w gruzowisku"],"aliasy":["gejzer","cisza na gruzowisku","obszar zamknięty gruzowisko","oficer bezpieczeństwa","sygnały alarmowe na gruzowisku","oznakowanie poszkodowanych w gruzowisku"],"prefix":"Bezpieczeństwo działań podczas katastrofy budowlanej — strefa, obszary zamknięte, sygnały, monitorowanie (Metodyka KG PSP 2023).","najpierw":[{"t":"O strefie zagrożenia decyduje KDR (wspierany przez dowódcę SGPR i oficera bezpieczeństwa); granica ≥ 3–5 m od brzegu gruzowiska.","zr":"Metodyka bezp.","str":2},{"t":"Niestabilne elementy pionowe: obszar zamknięty na co najmniej 1,5 wysokości elementu.","zr":"Metodyka bezp.","str":2},{"t":"Wyznacz obserwatorów stabilności, zapewnij niezależną łączność i sygnał alarmowy, drogi ewakuacji i strefę bezpieczną.","zr":"Metodyka bezp.","str":3},{"t":"W strefie tylko ratownicy skierowani do zadań — po zarejestrowaniu wejścia.","zr":"Metodyka bezp.","str":4}],"parametry":[{"nazwa":"„GEJZER” — natychmiastowa ewakuacja","wartosc":"3 sygnały po 1 s (powtarzane); radio i megafon: „GEJZER”","zr":"Metodyka bezp.","str":10},{"nazwa":"„OMEGA” / „CISZA NA GRUZOWISKU”","wartosc":"1 sygnał 3 s","zr":"Metodyka bezp.","str":10},{"nazwa":"„WZNÓW DZIAŁANIA”","wartosc":"sygnał 3 s + sygnał 1 s","zr":"Metodyka bezp.","str":10},{"nazwa":"Ryzyko III / IV","wartosc":"III — wyznacz obszar zamknięty · IV — sytuacja krytyczna, całkowity zakaz dostępu","zr":"Metodyka bezp.","str":8},{"nazwa":"Kolory oznakowania","wartosc":"czerwony — zagrożenie · pomarańczowy — informacja · niebieski — monitorowanie · zielony — bezpieczna droga","zr":"Metodyka bezp.","str":14}],"sekcje":[{"etykieta":"Postępowanie z zagrożeniem","punkty":[{"t":"Unikanie — nie wprowadzaj ratowników, jeśli to zbędne; usuwanie — bez naruszania stabilności gruzowiska; ograniczenie — wejście do obszaru zamkniętego tylko z pełnym monitorowaniem; monitorowanie.","zr":"Metodyka bezp.","str":4},{"t":"Kontroluj, czy stosowane techniki ratownicze nie pogarszają stabilności gruzowiska.","zr":"Metodyka bezp.","str":3},{"t":"Zagrożenia dodatkowe: pożar, zadymienie, wyciek materiałów niebezpiecznych, media (woda, prąd, gaz), butle z gazem.","zr":"Metodyka bezp.","str":3}]},{"etykieta":"Po alarmowej ewakuacji","punkty":[{"t":"W strefie bezpiecznej sprawdź stan osobowy — czy wszyscy się wycofali i czy ktoś nie potrzebuje pomocy.","zr":"Metodyka bezp.","str":4}]},{"etykieta":"Monitorowanie","punkty":[{"t":"Początkowe — ratownicy obserwatorzy (bez przyrządów); specjalistyczne — oficerowie bezpieczeństwa SGPR poziomu C; zaawansowane — konstruktorzy, rzeczoznawcy, nadzór budowlany.","zr":"Metodyka bezp.","str":8}]},{"etykieta":"Oznakowanie poszkodowanych","punkty":[{"t":"Oznacz miejsce, gdy dotarcie lub ewakuacja nie nastąpi od razu: duże „V” ok. 50 cm, jaskrawy kolor, strzałka dokładnie do miejsca, jak najbliżej poszkodowanego.","zr":"DPR 2023","str":98},{"t":"Oznakowanie INSARAG stosują wyłącznie SGPR poziomu C (USAR).","zr":"DPR 2023","str":98}]}],"nie_rob":[{"t":"Nie wchodź do obszaru zamkniętego bez wyznaczonego sposobu działania i monitorowania.","zr":"Metodyka bezp.","str":4}],"tagi_wspolne":["katastrofa budowlana","bezpieczenstwo ratownikow"],"dokumenty_zrodlowe":[{"dokument_id":"doc-dpr-2023-zal12","strona":1,"sekcja":"Metodyka bezpieczeństwa działań podczas katastrof budowlanych (s. 1–14)"},{"dokument_id":"doc-dpr-2023","strona":97,"sekcja":"Zał. 11 — oznakowanie terenu działań i obiektów (s. 97–98)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: O strefie zagrożenia decyduje KDR (wspierany przez dowódcę SGPR i oficera bezpieczeństwa); granica ≥ 3–5 m od brzegu gruzowiska. Niestabilne elementy pionowe: obszar zamknięty na co najmniej 1,5 wysokości elementu. Wyznacz obserwatorów stabilności, zapewnij niezależną łączność i sygnał alarmowy, drogi ewakuacji i strefę bezpieczną. W strefie tylko ratownicy skierowani do zadań — po zarejestrowaniu wejścia.\n2. PARAMETRY: „GEJZER” — natychmiastowa ewakuacja — 3 sygnały po 1 s (powtarzane); radio i megafon: „GEJZER”; „OMEGA” / „CISZA NA GRUZOWISKU” — 1 sygnał 3 s; „WZNÓW DZIAŁANIA” — sygnał 3 s + sygnał 1 s; Ryzyko III / IV — III — wyznacz obszar zamknięty · IV — sytuacja krytyczna, całkowity zakaz dostępu; Kolory oznakowania — czerwony — zagrożenie · pomarańczowy — informacja · niebieski — monitorowanie · zielony — bezpieczna droga\n3. POSTĘPOWANIE Z ZAGROŻENIEM: Unikanie — nie wprowadzaj ratowników, jeśli to zbędne; usuwanie — bez naruszania stabilności gruzowiska; ograniczenie — wejście do obszaru zamkniętego tylko z pełnym monitorowaniem; monitorowanie. Kontroluj, czy stosowane techniki ratownicze nie pogarszają stabilności gruzowiska. Zagrożenia dodatkowe: pożar, zadymienie, wyciek materiałów niebezpiecznych, media (woda, prąd, gaz), butle z gazem.\n4. PO ALARMOWEJ EWAKUACJI: W strefie bezpiecznej sprawdź stan osobowy — czy wszyscy się wycofali i czy ktoś nie potrzebuje pomocy.\n5. MONITOROWANIE: Początkowe — ratownicy obserwatorzy (bez przyrządów); specjalistyczne — oficerowie bezpieczeństwa SGPR poziomu C; zaawansowane — konstruktorzy, rzeczoznawcy, nadzór budowlany.\n6. OZNAKOWANIE POSZKODOWANYCH: Oznacz miejsce, gdy dotarcie lub ewakuacja nie nastąpi od razu: duże „V” ok. 50 cm, jaskrawy kolor, strzałka dokładnie do miejsca, jak najbliżej poszkodowanego. Oznakowanie INSARAG stosują wyłącznie SGPR poziomu C (USAR).\n7. NIE RÓB: Nie wchodź do obszaru zamkniętego bez wyznaczonego sposobu działania i monitorowania."},{"id":"KARTA-BUD-DPR-WSPOLPRACA-SGPR","wzorzec":2,"kategoria":"dzialania","zrodlo":"KG PSP: Zasady organizacji działań poszukiwawczo-ratowniczych w KSRG (2023, nowelizacja grudzień 2023) z załącznikami","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wspolpraca kdr z sgpr","keywords":["sgpr","grupa poszukiwawczo-ratownicza","psy ratownicze gruzowisko","geofon","dowódca sgpr","kiedy wezwać sgpr"],"aliasy":["sgpr","grupa poszukiwawczo-ratownicza","psy ratownicze gruzowisko","geofon","dowódca sgpr","kiedy wezwać sgpr"],"prefix":"Współpraca KDR ze specjalistyczną grupą poszukiwawczo-ratowniczą (SGPR) — poziomy A, B, C i dowodzenie (Zasady KG PSP 2023).","najpierw":[{"t":"Dowódca SGPR melduje się w sztabie lub u KDR: liczba ratowników, psów, urządzeń lokalizacyjnych i czas do pełnej gotowości.","zr":"DPR 2023","str":31},{"t":"Wyznacz z nim miejsce rozlokowania SGPR.","zr":"DPR 2023","str":31},{"t":"Psy wprowadź na gruzowisko jak najwcześniej — po rozpoznaniu, ocenie stabilności i likwidacji zagrożeń wtórnych (pożar, gaz, prąd).","zr":"DPR 2023","str":31},{"t":"Zapewnij SGPR niezbędne warunki do podjęcia działań.","zr":"DPR 2023","str":17}],"parametry":[{"nazwa":"Poziom A","wartosc":"lokalizacja przyrządowa (geofon, kamera wziernikowa) i KPP · min. 3 strażaków · alarmowanie niezwłoczne","zr":"DPR 2023","str":9},{"nazwa":"Poziom B","wartosc":"poszukiwanie z psami ratowniczymi i KPP · min. 3 ratowników z 2 psami · alarmowanie ≤ 90 min","zr":"DPR 2023","str":9},{"nazwa":"Poziom C","wartosc":"zakres podstawowy + A + B + cięcie, przebicia, podnoszenie elementów do 20 t, stabilizacja, techniki alpinistyczne · min. 8 ratowników (+4 w ≤ 180 min) · alarmowanie ≤ 90 min","zr":"DPR 2023","str":9}],"sekcje":[{"etykieta":"Dowodzenie","punkty":[{"t":"Przy podziale na odcinki dowódca SGPR jest dowódcą odcinka specjalistycznego (lokalizacja, dostęp, ewakuacja w strefie zagrożenia).","zr":"DPR 2023","str":32},{"t":"KDR wydaje polecenia dowódcy SGPR; dowódca decyduje, jak grupa wykona zadanie.","zr":"DPR 2023","str":32},{"t":"Przy więcej niż jednej SGPR dowodzącego działaniami SGPR wyznacza KDR.","zr":"DPR 2023","str":17},{"t":"Dowodzący SGPR może powiększyć skład lub zgłosić KDR potrzebę kolejnej SGPR; do wsparcia można dysponować SGRT.","zr":"DPR 2023","str":16},{"t":"Po działaniach dowodzący SGPR przekazuje KDR „Informację o działaniach ratowniczych” grupy.","zr":"DPR 2023","str":17}]},{"etykieta":"Uprawnienia dowódcy SGPR","punkty":[{"t":"Określa strefę zagrożenia i obszary zamknięte, dzieli teren na sektory, ustala kolejność metod poszukiwania.","zr":"DPR 2023","str":32},{"t":"Może żądać wyłączenia maszyn, wycofania ekip i obserwatorów oraz wstrzymania ruchu — dla pracy psów i urządzeń nasłuchowych.","zr":"DPR 2023","str":33},{"t":"Może wstrzymać poszukiwania przy zbyt dużym zagrożeniu lub zmęczeniu bądź kontuzji psów.","zr":"DPR 2023","str":33}]},{"etykieta":"Gdy SGPR wspiera inne służby","punkty":[{"t":"Poszukiwania w terenie i na akwenach — dowódca z ramienia Policji; kopalnia — Kierownik Akcji Ratowniczej; góry i lawiny — GOPR / TOPR; tereny MON — Wojsko Polskie.","zr":"DPR 2023","str":32}]},{"etykieta":"Wsparcie SGPR przez jednostki podstawowe","punkty":[{"t":"Poszukiwania bezprzyrządowe lub przyrządowe, dostęp sprzętem podstawowym, ręczne odgruzowywanie.","zr":"DPR 2023","str":33},{"t":"Obsługa sprzętu (drabina, podnośnik, dźwig), ewakuacja i transport poszkodowanych, wsparcie logistyczne.","zr":"DPR 2023","str":33}]}],"tagi_wspolne":["katastrofa budowlana","poszukiwania","SGPR"],"dokumenty_zrodlowe":[{"dokument_id":"doc-dpr-2023","strona":9,"sekcja":"Część 3 — SGPR (s. 9–17), zał. 5 — zadania SGPR i współdziałanie (s. 31–33)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Dowódca SGPR melduje się w sztabie lub u KDR: liczba ratowników, psów, urządzeń lokalizacyjnych i czas do pełnej gotowości. Wyznacz z nim miejsce rozlokowania SGPR. Psy wprowadź na gruzowisko jak najwcześniej — po rozpoznaniu, ocenie stabilności i likwidacji zagrożeń wtórnych (pożar, gaz, prąd). Zapewnij SGPR niezbędne warunki do podjęcia działań.\n2. PARAMETRY: Poziom A — lokalizacja przyrządowa (geofon, kamera wziernikowa) i KPP · min. 3 strażaków · alarmowanie niezwłoczne; Poziom B — poszukiwanie z psami ratowniczymi i KPP · min. 3 ratowników z 2 psami · alarmowanie ≤ 90 min; Poziom C — zakres podstawowy + A + B + cięcie, przebicia, podnoszenie elementów do 20 t, stabilizacja, techniki alpinistyczne · min. 8 ratowników (+4 w ≤ 180 min) · alarmowanie ≤ 90 min\n3. DOWODZENIE: Przy podziale na odcinki dowódca SGPR jest dowódcą odcinka specjalistycznego (lokalizacja, dostęp, ewakuacja w strefie zagrożenia). KDR wydaje polecenia dowódcy SGPR; dowódca decyduje, jak grupa wykona zadanie. Przy więcej niż jednej SGPR dowodzącego działaniami SGPR wyznacza KDR. Dowodzący SGPR może powiększyć skład lub zgłosić KDR potrzebę kolejnej SGPR; do wsparcia można dysponować SGRT. Po działaniach dowodzący SGPR przekazuje KDR „Informację o działaniach ratowniczych” grupy.\n4. UPRAWNIENIA DOWÓDCY SGPR: Określa strefę zagrożenia i obszary zamknięte, dzieli teren na sektory, ustala kolejność metod poszukiwania. Może żądać wyłączenia maszyn, wycofania ekip i obserwatorów oraz wstrzymania ruchu — dla pracy psów i urządzeń nasłuchowych. Może wstrzymać poszukiwania przy zbyt dużym zagrożeniu lub zmęczeniu bądź kontuzji psów.\n5. GDY SGPR WSPIERA INNE SŁUŻBY: Poszukiwania w terenie i na akwenach — dowódca z ramienia Policji; kopalnia — Kierownik Akcji Ratowniczej; góry i lawiny — GOPR / TOPR; tereny MON — Wojsko Polskie.\n6. WSPARCIE SGPR PRZEZ JEDNOSTKI PODSTAWOWE: Poszukiwania bezprzyrządowe lub przyrządowe, dostęp sprzętem podstawowym, ręczne odgruzowywanie. Obsługa sprzętu (drabina, podnośnik, dźwig), ewakuacja i transport poszkodowanych, wsparcie logistyczne."},{"id":"KARTA-BUD-DPR-ZAKRES-PODSTAWOWY","wzorzec":2,"kategoria":"dzialania","zrodlo":"KG PSP: Zasady organizacji działań poszukiwawczo-ratowniczych w KSRG (2023, nowelizacja grudzień 2023) z załącznikami","data_aktualizacji":"2026-10-27","slowo_kluczowe":"dzialania poszukiwawczo-ratownicze zakres podstawowy","keywords":["działania poszukiwawczo-ratownicze","lokalizacja osób zasypanych","osoby zasypane w gruzowisku","dpr zakres podstawowy","poszukiwania pod gruzami"],"aliasy":["działania poszukiwawczo-ratownicze","lokalizacja osób zasypanych","osoby zasypane w gruzowisku","dpr zakres podstawowy","poszukiwania pod gruzami"],"prefix":"Działania poszukiwawczo-ratownicze — zakres podstawowy JRG i OSP (Zasady KG PSP 2023).","najpierw":[{"t":"Rozpoznaj zagrożenia i określ wielkość strefy zagrożenia.","zr":"DPR 2023","str":6},{"t":"Wstępnie ustal liczbę osób zaginionych.","zr":"DPR 2023","str":6},{"t":"Zabezpiecz i oświetl miejsce zdarzenia.","zr":"DPR 2023","str":6},{"t":"Gdy potrzebna jest lokalizacja przyrządowa, psy ratownicze lub działania specjalistyczne — zgłoś do SK potrzebę SGPR.","zr":"DPR 2023","str":8}],"parametry":[{"nazwa":"Kto realizuje","wartosc":"wszystkie JRG PSP; OSP i inne podmioty, które zadeklarowały tę zdolność","zr":"DPR 2023","str":5},{"nazwa":"Gotowość","wartosc":"min. 6 strażaków, niezwłoczny czas alarmowania","zr":"DPR 2023","str":6},{"nazwa":"Lokalizacja w zakresie podstawowym","wartosc":"bez metody przyrządowej i bez psów ratowniczych","zr":"DPR 2023","str":6}],"sekcje":[{"etykieta":"Zadania zakresu podstawowego","punkty":[{"t":"Lokalizuj osoby w miejscach niedostępnych, docieraj do poszkodowanych posiadanym sprzętem, udzielaj KPP, ewakuuj ze strefy zagrożenia.","zr":"DPR 2023","str":6},{"t":"Zabezpiecz konstrukcję w zakresie niezbędnym dla bezpieczeństwa ratowników i ewakuacji poszkodowanych.","zr":"DPR 2023","str":6},{"t":"Zabezpiecz instalacje techniczne w obiekcie i związane z obiektem.","zr":"DPR 2023","str":6},{"t":"Wykonuj dostęp do zlokalizowanych poszkodowanych; ewakuuj zwierzęta i mienie; współdziałaj z innymi podmiotami.","zr":"DPR 2023","str":6}]},{"etykieta":"Współdziałanie z SGPR","punkty":[{"t":"SGPR wspiera lokalizację osób zasypanych metodą przyrządową i psami ratowniczymi oraz działania specjalistyczne.","zr":"DPR 2023","str":8},{"t":"Do działań z psami dysponowani są wyłącznie przewodnicy z psami z ważną specjalnością gruzowiskową.","zr":"DPR 2023","str":8},{"t":"Gdy SGPR jest dysponowana śmigłowcem — jednostka zakresu podstawowego przygotowuje lądowisko.","zr":"DPR 2023","str":8}]}],"wsparcie":[{"t":"Szczegóły współpracy z SGPR — karta „Współpraca KDR z SGPR”; bezpieczeństwo na gruzowisku — karta „Bezpieczeństwo działań na gruzowisku”.","zr":"DPR 2023","str":8}],"tagi_wspolne":["katastrofa budowlana","poszukiwania"],"dokumenty_zrodlowe":[{"dokument_id":"doc-dpr-2023","strona":5,"sekcja":"Część 2 — zakres podstawowy (s. 5–8)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznaj zagrożenia i określ wielkość strefy zagrożenia. Wstępnie ustal liczbę osób zaginionych. Zabezpiecz i oświetl miejsce zdarzenia. Gdy potrzebna jest lokalizacja przyrządowa, psy ratownicze lub działania specjalistyczne — zgłoś do SK potrzebę SGPR.\n2. PARAMETRY: Kto realizuje — wszystkie JRG PSP; OSP i inne podmioty, które zadeklarowały tę zdolność; Gotowość — min. 6 strażaków, niezwłoczny czas alarmowania; Lokalizacja w zakresie podstawowym — bez metody przyrządowej i bez psów ratowniczych\n3. ZADANIA ZAKRESU PODSTAWOWEGO: Lokalizuj osoby w miejscach niedostępnych, docieraj do poszkodowanych posiadanym sprzętem, udzielaj KPP, ewakuuj ze strefy zagrożenia. Zabezpiecz konstrukcję w zakresie niezbędnym dla bezpieczeństwa ratowników i ewakuacji poszkodowanych. Zabezpiecz instalacje techniczne w obiekcie i związane z obiektem. Wykonuj dostęp do zlokalizowanych poszkodowanych; ewakuuj zwierzęta i mienie; współdziałaj z innymi podmiotami.\n4. WSPÓŁDZIAŁANIE Z SGPR: SGPR wspiera lokalizację osób zasypanych metodą przyrządową i psami ratowniczymi oraz działania specjalistyczne. Do działań z psami dysponowani są wyłącznie przewodnicy z psami z ważną specjalnością gruzowiskową. Gdy SGPR jest dysponowana śmigłowcem — jednostka zakresu podstawowego przygotowuje lądowisko.\n5. WEZWIJ WSPARCIE, GDY: Szczegóły współpracy z SGPR — karta „Współpraca KDR z SGPR”; bezpieczeństwo na gruzowisku — karta „Bezpieczeństwo działań na gruzowisku”."},{"id":"KARTA-BUD-INFORMACJE-DODATKOWE-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"informacje","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"katastrofa budowlana informacje dodatkowe","keywords":["zawalenie budynku","typy zawalen","gruzowisko","zawalony obiekt","niebezpieczenstwa zawalenia","budowlane"],"aliasy":["zawalenie budynku","typy zawalen","gruzowisko","zawalony obiekt","niebezpieczenstwa zawalenia","budowlane"],"prefix":"Katastrofa budowlana — typy zawaleń i zagrożenia (SZP KG PSP 2020).","najpierw":[{"t":"Najgroźniejsze: niestabilne i ruchome części budynku grożące dalszym zawaleniem, odpadnięciem lub osunięciem.","zr":"SZP KB 2020","str":1},{"t":"Uszkodzone media: gaz (mieszaniny wybuchowe), prąd, woda — także gorąca — mogąca zalać przestrzenie z ludźmi.","zr":"SZP KB 2020","str":1}],"parametry":[{"nazwa":"Typ 1","wartosc":"zawalenie kondygnacji do wewnątrz obiektu","zr":"SZP KB 2020","str":1},{"nazwa":"Typ 2","wartosc":"zawalenie warstwowe, opadnięcie stropów","zr":"SZP KB 2020","str":1},{"nazwa":"Typ 3","wartosc":"zawalenie całkowite — rumowisko","zr":"SZP KB 2020","str":1},{"nazwa":"Typ 4","wartosc":"zawalenie w wyniku przemieszczenia obiektu lub jego części","zr":"SZP KB 2020","str":1},{"nazwa":"Typ 5","wartosc":"zawalenie części obiektu z wiszącymi elementami i zagruzowaniem","zr":"SZP KB 2020","str":1}],"sekcje":[{"etykieta":"Zagrożenia","punkty":[{"t":"Duże obciążenia i ciężar elementów; nieznana nośność i wytrzymałość gruzowiska.","zr":"SZP KB 2020","str":1},{"t":"Materiały pirotechniczne.","zr":"SZP KB 2020","str":1},{"t":"Zależnie od obiektu: substancje chemiczne (zatrucia, poparzenia), biologiczne (np. szpitale), radiacyjne (pracownie RTG).","zr":"SZP KB 2020","str":1},{"t":"Dzikie lub egzotyczne zwierzęta.","zr":"SZP KB 2020","str":1}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":1,"sekcja":"Typy zawaleń i zagrożenia (s. 1)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Najgroźniejsze: niestabilne i ruchome części budynku grożące dalszym zawaleniem, odpadnięciem lub osunięciem. Uszkodzone media: gaz (mieszaniny wybuchowe), prąd, woda — także gorąca — mogąca zalać przestrzenie z ludźmi.\n2. PARAMETRY: Typ 1 — zawalenie kondygnacji do wewnątrz obiektu; Typ 2 — zawalenie warstwowe, opadnięcie stropów; Typ 3 — zawalenie całkowite — rumowisko; Typ 4 — zawalenie w wyniku przemieszczenia obiektu lub jego części; Typ 5 — zawalenie części obiektu z wiszącymi elementami i zagruzowaniem\n3. ZAGROŻENIA: Duże obciążenia i ciężar elementów; nieznana nośność i wytrzymałość gruzowiska. Materiały pirotechniczne. Zależnie od obiektu: substancje chemiczne (zatrucia, poparzenia), biologiczne (np. szpitale), radiacyjne (pracownie RTG). Dzikie lub egzotyczne zwierzęta."},{"id":"KARTA-BUD-ORGANIZACJA-DZIALAN-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"organizacja","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"organizacja dzialan katastrofa budowlana","keywords":["gruzowisko organizacja akcji","katastrofa budowlana organizacja","rotacja ratownikow gruzowisko","sztab katastrofa budowlana"],"aliasy":["gruzowisko organizacja akcji","katastrofa budowlana organizacja","rotacja ratownikow gruzowisko","sztab katastrofa budowlana"],"prefix":"Katastrofa budowlana — organizacja działań: priorytety, przeszukanie, bezpieczeństwo ratowników, zmiany do 6 h, sztab (SZP KG PSP 2020).","najpierw":[{"t":"Ogranicz liczbę ratowników w strefie do niezbędnego minimum.","zr":"SZP KB 2020","str":4},{"t":"Najpierw przeszukanie przez strażaków nawołujących (megafon), z ciszą na gruzowisku przed każdym nawoływaniem.","zr":"SZP KB 2020","str":4},{"t":"Brak sygnałów z gruzowiska nie oznacza braku poszkodowanych; niepewna liczba osób — czekaj na SGPR.","zr":"SZP KB 2020","str":4},{"t":"Przy wejściu do strefy zespół zdolny udzielić pomocy medycznej poszkodowanym i rannym ratownikom.","zr":"SZP KB 2020","str":4}],"parametry":[{"nazwa":"Czas zmiany w strefie","wartosc":"max 6 h; w trudnych warunkach (upał, mróz, wiatr, ulewa) 4 lub nawet 2 h","zr":"SZP KB 2020","str":5},{"nazwa":"Odgruzowywanie — SOI","wartosc":"maseczki przeciwpyłowe, ochrona oczu","zr":"SZP KB 2020","str":4},{"nazwa":"Przestrzenie ograniczone","wartosc":"stała kontrola tlenu, napowietrzanie; w miarę możliwości ODO","zr":"SZP KB 2020","str":4}],"sekcje":[{"etykieta":"Priorytety i przeszukanie","punkty":[{"t":"Ewakuuj zlokalizowanych; zabezpiecz niestabilne elementy i otwory komunikacyjne; szukaj tam, gdzie mogli być ludzie; oznacz miejsca, gdzie nie możesz działać.","zr":"SZP KB 2020","str":4},{"t":"Przygotuj teren dla SGPR; przekaż jej dowódcy i koordynatorowi przewodników psów obszary poszukiwań i zagrożenia.","zr":"SZP KB 2020","str":4},{"t":"Na każdym etapie niestabilne elementy zabezpiecz, usuń lub ustabilizuj — albo oznacz i omijaj.","zr":"SZP KB 2020","str":4},{"t":"Po wydobyciu wszystkich zlokalizowanych powtórz przeszukanie bezprzyrządowe.","zr":"SZP KB 2020","str":4},{"t":"Sprzęt do kontroli stabilności nie gwarantuje bezpieczeństwa ani nie zapobiega wtórnemu zawaleniu — wspiera oficera bezpieczeństwa.","zr":"SZP KB 2020","str":4}]},{"etykieta":"Zaplecze i rotacja","punkty":[{"t":"Składowisko sprzętu poza strefą: obsługa, tankowanie, drobne naprawy; nie może zakłócać działań.","zr":"SZP KB 2020","str":4},{"t":"Przy wyjściu ze strefy dekontaminacja ratowników i sprzętu; odwód taktyczny do podmiany, z dala od działań.","zr":"SZP KB 2020","str":5}]},{"etykieta":"Kierowanie","punkty":[{"t":"Zespoły (odcinki bojowe) z zadaniem i dowódcą; po przybyciu SGPR/SGRT odcinkiem specjalistycznym dowodzi dowódca grupy.","zr":"SZP KB 2020","str":5},{"t":"Kierowanie taktyczne: sztab, SDŁ i namiot, szef sztabu, kontrola wejść do sztabu, oznakowanie funkcji i miejsc (PPSiS, media, wsparcie psychologiczne, ewakuacja).","zr":"SZP KB 2020","str":5},{"t":"Schemat łączności i czas meldunków; bieżące informowanie SK KP/KM.","zr":"SZP KB 2020","str":5},{"t":"Ciężki sprzęt (dźwigi, koparki, ładowarki teleskopowe) w porozumieniu z zarządzaniem kryzysowym — najpierw ustal zasady finansowania.","zr":"SZP KB 2020","str":5},{"t":"Media tylko przez wyznaczonego oficera prasowego.","zr":"SZP KB 2020","str":5}]}],"nie_rob":[{"t":"Nie dopuszczaj osób zbędnych na teren akcji.","zr":"SZP KB 2020","str":5}],"tagi_wspolne":["katastrofa budowlana","zawalenie","organizacja dzialan"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":4,"sekcja":"Organizacja działań ratowniczych (s. 4–5)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ogranicz liczbę ratowników w strefie do niezbędnego minimum. Najpierw przeszukanie przez strażaków nawołujących (megafon), z ciszą na gruzowisku przed każdym nawoływaniem. Brak sygnałów z gruzowiska nie oznacza braku poszkodowanych; niepewna liczba osób — czekaj na SGPR. Przy wejściu do strefy zespół zdolny udzielić pomocy medycznej poszkodowanym i rannym ratownikom.\n2. PARAMETRY: Czas zmiany w strefie — max 6 h; w trudnych warunkach (upał, mróz, wiatr, ulewa) 4 lub nawet 2 h; Odgruzowywanie — SOI — maseczki przeciwpyłowe, ochrona oczu; Przestrzenie ograniczone — stała kontrola tlenu, napowietrzanie; w miarę możliwości ODO\n3. PRIORYTETY I PRZESZUKANIE: Ewakuuj zlokalizowanych; zabezpiecz niestabilne elementy i otwory komunikacyjne; szukaj tam, gdzie mogli być ludzie; oznacz miejsca, gdzie nie możesz działać. Przygotuj teren dla SGPR; przekaż jej dowódcy i koordynatorowi przewodników psów obszary poszukiwań i zagrożenia. Na każdym etapie niestabilne elementy zabezpiecz, usuń lub ustabilizuj — albo oznacz i omijaj. Po wydobyciu wszystkich zlokalizowanych powtórz przeszukanie bezprzyrządowe. Sprzęt do kontroli stabilności nie gwarantuje bezpieczeństwa ani nie zapobiega wtórnemu zawaleniu — wspiera oficera bezpieczeństwa.\n4. ZAPLECZE I ROTACJA: Składowisko sprzętu poza strefą: obsługa, tankowanie, drobne naprawy; nie może zakłócać działań. Przy wyjściu ze strefy dekontaminacja ratowników i sprzętu; odwód taktyczny do podmiany, z dala od działań.\n5. KIEROWANIE: Zespoły (odcinki bojowe) z zadaniem i dowódcą; po przybyciu SGPR/SGRT odcinkiem specjalistycznym dowodzi dowódca grupy. Kierowanie taktyczne: sztab, SDŁ i namiot, szef sztabu, kontrola wejść do sztabu, oznakowanie funkcji i miejsc (PPSiS, media, wsparcie psychologiczne, ewakuacja). Schemat łączności i czas meldunków; bieżące informowanie SK KP/KM. Ciężki sprzęt (dźwigi, koparki, ładowarki teleskopowe) w porozumieniu z zarządzaniem kryzysowym — najpierw ustal zasady finansowania. Media tylko przez wyznaczonego oficera prasowego.\n6. NIE RÓB: Nie dopuszczaj osób zbędnych na teren akcji."},{"id":"KARTA-BUD-PRIORYTETY-TYPOW-ZAWALEN","wzorzec":2,"kategoria":"informacje","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"priorytety typow zawalen","keywords":["typy zawalen priorytety","zawalenie typ 1","zawalenie typ 2","zawalenie typ 3","zawalenie typ 4","zawalenie typ 5"],"aliasy":["typy zawalen priorytety","zawalenie typ 1","zawalenie typ 2","zawalenie typ 3","zawalenie typ 4","zawalenie typ 5"],"prefix":"Katastrofa budowlana — dodatkowe priorytety dla typów zawaleń 1–5 (SZP KG PSP 2020).","najpierw":[{"t":"We wszystkich typach: psy ratownicze i urządzenia elektroniczne do lokalizacji żywych oraz monitorowanie stabilności.","zr":"SZP KB 2020","str":6}],"parametry":[],"sekcje":[{"etykieta":"Typy zawaleń","punkty":[{"t":"Typ 1 (kondygnacje do wewnątrz): stabilizacja gruzowiska, wejścia do obiektu ograniczone do minimum, strefa wg wysokości obiektu.","zr":"SZP KB 2020","str":6},{"t":"Typ 2 (warstwowe, stropy): ciężki sprzęt i siłowniki pneumatyczne/hydrauliczne; małe przestrzenie — krótki czas; poszkodowani wyżej — podnośniki, techniki alpinistyczne.","zr":"SZP KB 2020","str":6},{"t":"Typ 3 (rumowisko): małe przestrzenie — krótki czas; napowietrzanie ciasnych przestrzeni i tuneli; odgruzowywanie ręczne lub dźwigami.","zr":"SZP KB 2020","str":6},{"t":"Typ 4 (przemieszczenie): możliwe nagłe pogorszenie — utrzymuj drożne drogi ewakuacji; strefa wg wysokości obiektu.","zr":"SZP KB 2020","str":6},{"t":"Typ 5 (wiszące elementy): drożne drogi ewakuacji, stabilizacja elementów, strefa wg wysokości; poszkodowani wyżej — podnośniki, alpinistyka.","zr":"SZP KB 2020","str":6}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie","typy zawalen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":6,"sekcja":"Dodatkowe priorytety dla typów zawaleń (s. 6)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: We wszystkich typach: psy ratownicze i urządzenia elektroniczne do lokalizacji żywych oraz monitorowanie stabilności.\n2. TYPY ZAWALEŃ: Typ 1 (kondygnacje do wewnątrz): stabilizacja gruzowiska, wejścia do obiektu ograniczone do minimum, strefa wg wysokości obiektu. Typ 2 (warstwowe, stropy): ciężki sprzęt i siłowniki pneumatyczne/hydrauliczne; małe przestrzenie — krótki czas; poszkodowani wyżej — podnośniki, techniki alpinistyczne. Typ 3 (rumowisko): małe przestrzenie — krótki czas; napowietrzanie ciasnych przestrzeni i tuneli; odgruzowywanie ręczne lub dźwigami. Typ 4 (przemieszczenie): możliwe nagłe pogorszenie — utrzymuj drożne drogi ewakuacji; strefa wg wysokości obiektu. Typ 5 (wiszące elementy): drożne drogi ewakuacji, stabilizacja elementów, strefa wg wysokości; poszkodowani wyżej — podnośniki, alpinistyka."},{"id":"KARTA-BUD-PRZEKAZANIE-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"organizacja","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"przekazanie miejsca zdarzenia katastrofa budowlana","keywords":["przekazanie gruzowisko","po akcji katastrofa budowlana","przekazanie zawalony budynek","przekazanie katastrofa budowlana"],"aliasy":["przekazanie gruzowisko","po akcji katastrofa budowlana","przekazanie zawalony budynek","przekazanie katastrofa budowlana"],"prefix":"Katastrofa budowlana — przekazanie miejsca zdarzenia właścicielowi, użytkownikowi lub Policji (SZP KG PSP 2020).","najpierw":[{"t":"Przekaż właścicielowi, użytkownikowi lub Policji — „Potwierdzenie przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.","zr":"SZP KB 2020","str":8}],"parametry":[],"sekcje":[{"etykieta":"Przekaż informacje o","punkty":[{"t":"Aktualnej sytuacji, miejscach niebezpiecznych, elementach konstrukcji wyniesionych poza obrys, stanie mediów.","zr":"SZP KB 2020","str":8},{"t":"Tym, że stabilizacja gruzowiska służyła tylko działaniom ratowniczym i nie gwarantuje bezpieczeństwa.","zr":"SZP KB 2020","str":8},{"t":"Ustalonym dalszym postępowaniu z obiektem (inne służby, właściciel).","zr":"SZP KB 2020","str":8}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie","przekazanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":8,"sekcja":"Przekazanie miejsca zdarzenia (s. 8)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Przekaż właścicielowi, użytkownikowi lub Policji — „Potwierdzenie przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.\n2. PRZEKAŻ INFORMACJE O: Aktualnej sytuacji, miejscach niebezpiecznych, elementach konstrukcji wyniesionych poza obrys, stanie mediów. Tym, że stabilizacja gruzowiska służyła tylko działaniom ratowniczym i nie gwarantuje bezpieczeństwa. Ustalonym dalszym postępowaniu z obiektem (inne służby, właściciel)."},{"id":"KARTA-BUD-ROZPOZNANIE-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"dzialania","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"rozpoznanie katastrofa budowlana","keywords":["rozpoznanie zawalenie","gruzowisko rozpoznanie","katastrofa budowlana rozpoznanie","zawalony budynek rozpoznanie"],"aliasy":["rozpoznanie zawalenie","gruzowisko rozpoznanie","katastrofa budowlana rozpoznanie","zawalony budynek rozpoznanie"],"prefix":"Katastrofa budowlana — rozpoznanie: wywiad, oględziny, wyciszenie gruzowiska, dysponowanie SGPR i służb (SZP KG PSP 2020).","najpierw":[{"t":"Nie podejmuj działań w strefie zagrożenia do czasu zabezpieczenia miejsca działań i ratowników.","zr":"SZP KB 2020","str":2},{"t":"Oględziny ze wszystkich stron; do rozpoznania zawsze min. 2 ratowników z przyrządami pomiarowymi i łącznością.","zr":"SZP KB 2020","str":2},{"t":"Wycisz gruzowisko i przeszukaj je metodą nawoływania i nasłuchiwania.","zr":"SZP KB 2020","str":2},{"t":"Media podłączone i nieodłączone — wezwij służby, szczególna ostrożność przy wejściu na gruzowisko.","zr":"SZP KB 2020","str":2}],"parametry":[{"nazwa":"Dysponuj","wartosc":"SGPR poziomu A, B, C i SGRT; pogotowie gazowe i energetyczne, zarządzanie kryzysowe, PINB; rozważ pirotechników Policji, SGRChem","zr":"SZP KB 2020","str":2},{"nazwa":"Psy ratownicze","wartosc":"tylko zespoły z aktualnym egzaminem klasy I; przewodnik z zaświadczeniem o ważności specjalności","zr":"SZP KB 2020","str":2}],"sekcje":[{"etykieta":"Ustal","punkty":[{"t":"Charakter obiektu, liczbę kondygnacji (także podziemnych), godzinę zdarzenia.","zr":"SZP KB 2020","str":2},{"t":"Czy i gdzie przebywały osoby, czy mogą tam nadal być, czy był z nimi kontakt — jak i kiedy; oznacz to miejsce.","zr":"SZP KB 2020","str":2},{"t":"Przyczynę zawalenia i ryzyko kolejnych uszkodzeń; media, także własne źródła energii; plan obiektu.","zr":"SZP KB 2020","str":2}]},{"etykieta":"Dalej","punkty":[{"t":"Wykonaj szkic z miejscami niebezpiecznymi i priorytetami ratowniczymi.","zr":"SZP KB 2020","str":2},{"t":"Określ potrzeby PRM; przy LPR przygotuj lądowisko.","zr":"SZP KB 2020","str":2},{"t":"Punkt przyjęcia sił — funkcjonariusz z radiotelefonem; ustal sposób i częstotliwość meldowania o przybyłych SIS.","zr":"SZP KB 2020","str":2}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie","rozpoznanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":2,"sekcja":"Rozpoznanie (s. 2)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Nie podejmuj działań w strefie zagrożenia do czasu zabezpieczenia miejsca działań i ratowników. Oględziny ze wszystkich stron; do rozpoznania zawsze min. 2 ratowników z przyrządami pomiarowymi i łącznością. Wycisz gruzowisko i przeszukaj je metodą nawoływania i nasłuchiwania. Media podłączone i nieodłączone — wezwij służby, szczególna ostrożność przy wejściu na gruzowisko.\n2. PARAMETRY: Dysponuj — SGPR poziomu A, B, C i SGRT; pogotowie gazowe i energetyczne, zarządzanie kryzysowe, PINB; rozważ pirotechników Policji, SGRChem; Psy ratownicze — tylko zespoły z aktualnym egzaminem klasy I; przewodnik z zaświadczeniem o ważności specjalności\n3. USTAL: Charakter obiektu, liczbę kondygnacji (także podziemnych), godzinę zdarzenia. Czy i gdzie przebywały osoby, czy mogą tam nadal być, czy był z nimi kontakt — jak i kiedy; oznacz to miejsce. Przyczynę zawalenia i ryzyko kolejnych uszkodzeń; media, także własne źródła energii; plan obiektu.\n4. DALEJ: Wykonaj szkic z miejscami niebezpiecznymi i priorytetami ratowniczymi. Określ potrzeby PRM; przy LPR przygotuj lądowisko. Punkt przyjęcia sił — funkcjonariusz z radiotelefonem; ustal sposób i częstotliwość meldowania o przybyłych SIS."},{"id":"KARTA-BUD-STREFA-I-EWAKUACJA-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"dzialania","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"strefa zagrozenia katastrofa budowlana","keywords":["ewakuacja gruzowisko","katastrofa budowlana ewakuacja","strefa zawalenie budynku","wyznacz strefe gruzowisko"],"aliasy":["ewakuacja gruzowisko","katastrofa budowlana ewakuacja","strefa zawalenie budynku","wyznacz strefe gruzowisko"],"prefix":"Katastrofa budowlana — strefa zagrożenia (3–5 m, 150% wysokości), alarm „GEJZER”, kontrola wejść, ewakuacja (SZP KG PSP 2020).","najpierw":[{"t":"Strefa: min. 3–5 m od brzegu gruzowiska; przy niestabilnych elementach — min. 150% wysokości najwyższego z nich.","zr":"SZP KB 2020","str":3},{"t":"Alarmowe opuszczenie strefy: okólnik radiowy „GEJZER”; 3 krótkie sygnały dźwiękowe po 1 s, powtarzane do opuszczenia strefy.","zr":"SZP KB 2020","str":3},{"t":"Wyznacz strażaka do monitorowania stabilności konstrukcji i miejsce, z którego obserwuje.","zr":"SZP KB 2020","str":3},{"t":"Wyznacz osobę kontrolującą wejścia i wyjścia oraz liczbę osób w strefie.","zr":"SZP KB 2020","str":3}],"parametry":[{"nazwa":"Obszary zamknięte","wartosc":"niestabilne elementy (do 150% ich wysokości), elementy grożące upadkiem, załamania i otwory w stropach, media, pożar","zr":"SZP KB 2020","str":3},{"nazwa":"Wejście/wyjście","wartosc":"oznacz taśmą biało-czerwoną; w miarę możliwości jedno miejsce","zr":"SZP KB 2020","str":3},{"nazwa":"Ewidencja wejść","wartosc":"identyfikatory imienne lub karty z numerami — do czasu przyjazdu SGPR poziomu C","zr":"SZP KB 2020","str":3},{"nazwa":"Monitoring stabilności","wartosc":"do przyjazdu tachimetru: obserwacja, nasłuch, laser kątowy, taśma malarska na pęknięciach","zr":"SZP KB 2020","str":3}],"sekcje":[{"etykieta":"Organizacja strefy","punkty":[{"t":"Wyznacz drogę dojazdu dla kolejnych SIS, miejsce zbiórki ratowników po ewakuacji i kierunki ewakuacji.","zr":"SZP KB 2020","str":3},{"t":"Zapoznaj wchodzących z zagrożeniami — pokaż je na gruzowisku.","zr":"SZP KB 2020","str":3}]},{"etykieta":"Ewakuacja","punkty":[{"t":"Przeszukaj niezawalone części obiektu i obiekty przyległe; ewakuuj ludzi do punktu w bezpiecznej strefie.","zr":"SZP KB 2020","str":3},{"t":"Niestabilne części — podpory budowlane; brak sprzętu = miejsce niebezpieczne do czasu stabilizacji przez SGPR.","zr":"SZP KB 2020","str":3},{"t":"Warunki dla ewakuowanych (namioty, autobus), ewidencja z wywiadem.","zr":"SZP KB 2020","str":3},{"t":"Z nadzorem budowlanym lub specjalistą budownictwa określ warunki wejścia ratowników na gruzowisko.","zr":"SZP KB 2020","str":3}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie","strefa zagrozenia","ewakuacja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":3,"sekcja":"Strefa zagrożenia i ewakuacja (s. 3)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa: min. 3–5 m od brzegu gruzowiska; przy niestabilnych elementach — min. 150% wysokości najwyższego z nich. Alarmowe opuszczenie strefy: okólnik radiowy „GEJZER”; 3 krótkie sygnały dźwiękowe po 1 s, powtarzane do opuszczenia strefy. Wyznacz strażaka do monitorowania stabilności konstrukcji i miejsce, z którego obserwuje. Wyznacz osobę kontrolującą wejścia i wyjścia oraz liczbę osób w strefie.\n2. PARAMETRY: Obszary zamknięte — niestabilne elementy (do 150% ich wysokości), elementy grożące upadkiem, załamania i otwory w stropach, media, pożar; Wejście/wyjście — oznacz taśmą biało-czerwoną; w miarę możliwości jedno miejsce; Ewidencja wejść — identyfikatory imienne lub karty z numerami — do czasu przyjazdu SGPR poziomu C; Monitoring stabilności — do przyjazdu tachimetru: obserwacja, nasłuch, laser kątowy, taśma malarska na pęknięciach\n3. ORGANIZACJA STREFY: Wyznacz drogę dojazdu dla kolejnych SIS, miejsce zbiórki ratowników po ewakuacji i kierunki ewakuacji. Zapoznaj wchodzących z zagrożeniami — pokaż je na gruzowisku.\n4. EWAKUACJA: Przeszukaj niezawalone części obiektu i obiekty przyległe; ewakuuj ludzi do punktu w bezpiecznej strefie. Niestabilne części — podpory budowlane; brak sprzętu = miejsce niebezpiec
