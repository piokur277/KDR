<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>KDR AI | System Procedur</title>
    <style>
        :root {
            --bg: #020617;
            --bg2: #08101e;
            --panel: rgba(15, 23, 42, 0.92);
            --text: #f8fafc;
            --muted: #94a3b8;
            --line: #1e293b;
            --warn: #eab308;
            --ok: #10b981;
            --ok-soft: rgba(16, 185, 129, 0.14);
            --accent: #ef4444;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(220, 38, 38, 0.16), transparent 34%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg) 45%, var(--bg2) 100%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body { padding: 8px; }

        .app-shell {
            max-width: 920px;
            margin: 0 auto;
            min-height: calc(100vh - 16px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header {
            border-bottom: 1px solid var(--line);
            padding-bottom: 6px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            font-style: italic;
            color: var(--accent);
        }

        .version {
            font-size: 0.54rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.08em;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn,
        .search-btn {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.92);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .toolbar-btn.install-ready {
            border-color: var(--ok);
            color: #6ee7b7;
            background: var(--ok-soft);
        }

        .api-status-card {
            min-width: 0;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            display: grid;
            gap: 3px;
            font-size: 12px;
            line-height: 1.35;
        }

        .api-status-card small {
            color: #94a3b8;
            overflow-wrap: anywhere;
        }

        .manual-input {
            width: 100%;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            outline: none;
        }

        .manual-input::placeholder {
            color: #64748b;
        }

        #debug-console {
            margin-top: 8px;
            height: 160px;
            overflow-y: auto;
            border-radius: 10px;
            padding: 6px 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10px;
            line-height: 1.35;
            background: rgba(0, 0, 0, 0.36);
            border-left: 3px solid var(--accent);
            color: #facc15;
        }

        .debug-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .debug-line.error { color: #f87171; }
        .debug-line.info { color: #facc15; }
        .debug-line.success { color: #6ee7b7; }
        .debug-line.warning { color: #fdba74; }
        .debug-line.load-status {
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .manual-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .status-line {
            min-height: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .output-wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 6px 2px 18px;
            border-top: 1px solid rgba(30, 41, 59, 0.6);
        }

        #procedure-output {
            text-align: center;
            font-weight: 900;
            line-height: 1.15;
            font-size: clamp(1.4rem, 4.5vw, 3rem);
        }

        .empty-state {
            margin-top: 48px;
            color: #475569;
            font-style: italic;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .source-badge {
            display: inline-block;
            margin-bottom: 10px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid var(--ok);
            background: var(--ok-soft);
            color: #6ee7b7;
        }

        .procedure-prefix {
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 12px;
            font-style: italic;
            font-weight: 600;
        }

        .procedure-card {
            text-align: left;
            border-top: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.42), rgba(15, 23, 42, 0.18));
            border-radius: 16px;
            padding: 18px;
        }

        .procedure-line {
            display: block;
            margin-bottom: 10px;
            font-size: clamp(0.98rem, 2vw, 1.2rem);
            line-height: 1.45;
            font-weight: 700;
        }

        .step-no { color: var(--warn); }

        .procedure-list {
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .proc-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-items: start;
            padding: 6px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.45);
        }

        .proc-row:last-child { border-bottom: none; }

        .proc-name {
            color: #e2e8f0;
            text-align: left;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 600;
        }

        .proc-open {
            border: 0;
            background: transparent;
            color: #e2e8f0;
            text-align: left;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 700;
            padding: 0;
            cursor: pointer;
        }

        .proc-open:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .search-results-card {
            display: grid;
            gap: 10px;
            text-align: left;
        }

        .search-result-btn {
            width: 100%;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: left;
        }

        .search-result-btn:hover {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.95);
        }

        .search-result-title {
            display: block;
            font-size: 0.95rem;
            line-height: 1.35;
            font-weight: 800;
        }

        .search-result-meta {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
            font-size: 0.72rem;
            line-height: 1.4;
        }

        .full-document-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #334155;
        }

        .full-document-link,
        .full-document-disabled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
        }

        .full-document-link {
            border: 1px solid #10b981;
            background: rgba(16, 185, 129, 0.14);
            color: #6ee7b7;
        }

        .full-document-disabled {
            border: 1px solid #475569;
            background: rgba(71, 85, 105, 0.16);
            color: #94a3b8;
            cursor: not-allowed;
        }

        .full-document-source {
            display: block;
            margin-top: 8px;
            color: #64748b;
            font-size: 0.7rem;
            line-height: 1.4;
        }

        .full-document-heading {
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 0.76rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .full-document-item + .full-document-item {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #334155;
        }

        .full-document-meta {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
            font-size: 0.68rem;
            line-height: 1.4;
        }

        .full-document-status {
            display: inline-block;
            margin-left: 6px;
            color: #6ee7b7;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .footer {
            position: static;
            display: flex;
            justify-content: center;
            margin-top: 8px;
            padding: 6px 0 4px;
        }

        .footer-inner {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mic-btn,
        .reset-btn {
            width: min(28vw, 112px);
            height: min(28vw, 112px);
            border-radius: 999px;
            border: 4px solid #334155;
            background: rgba(2, 6, 23, 0.92);
            color: #e2e8f0;
            font-size: 0.86rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .reset-btn {
            display: none;
            color: #facc15;
            border-color: #eab308;
        }

        .mic-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hidden { display: none !important; }

        /* ===== v19.3.0: stan, ustawienia, ekran startowy, podpowiedzi ===== */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-right: auto;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #334155;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            flex: 0 0 auto;
        }
        .status-pill.success .status-dot { background: var(--ok); }
        .status-pill.warning .status-dot { background: var(--warn); }
        .status-pill.error .status-dot { background: var(--accent); }
        .status-pill.error { color: #fca5a5; border-color: #7f1d1d; }

        .toolbar-btn.active {
            border-color: #38bdf8;
            color: #bae6fd;
        }

        .settings-panel {
            margin-top: 8px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            background: var(--panel);
        }
        .settings-group { display: grid; gap: 8px; align-content: start; }
        .settings-title {
            margin: 0;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .setting-toggle {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .setting-toggle input {
            width: 18px;
            height: 18px;
            margin-top: 1px;
            flex: 0 0 auto;
            accent-color: var(--ok);
        }
        .setting-toggle small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-weight: 500;
            font-size: 11px;
            line-height: 1.35;
        }
        .debug-details summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
        }

        .status-line.notice {
            color: #fdba74;
            font-style: normal;
            text-transform: none;
            font-size: 12px;
            letter-spacing: 0;
        }

        .search-wrap { position: relative; min-width: 0; }
        .suggest-list {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            z-index: 20;
            display: grid;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            background: #0b1324;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }
        .suggest-item {
            display: grid;
            gap: 2px;
            text-align: left;
            border: 0;
            border-bottom: 1px solid #1e293b;
            background: transparent;
            color: var(--text);
            padding: 10px 12px;
            cursor: pointer;
        }
        .suggest-item:last-child { border-bottom: 0; }
        .suggest-item:hover,
        .suggest-item.active { background: #1e293b; }
        .suggest-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
        .suggest-meta { font-size: 11px; color: var(--muted); }

        .home { display: grid; gap: 16px; text-align: left; }
        .home-section { display: grid; gap: 8px; }
        .home-title {
            margin: 0;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 8px;
        }
        .tile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            min-height: 58px;
            border: 1px solid #334155;
            border-left: 4px solid var(--accent);
            background: rgba(15, 23, 42, 0.92);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
        }
        .tile:hover { border-color: #475569; background: #111c33; }
        .tile-label { font-size: 13px; font-weight: 800; line-height: 1.25; }
        .tile-count {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }
        .tile-edu { border-left-color: #38bdf8; }

        .empty-state.searching { animation: pulse 1.2s infinite; }
        .home + .empty-state, .empty-state + .home { margin-top: 16px; }

        .card-head {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .group-badge {
            display: inline-block;
            margin-bottom: 10px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .group-badge.group-edu,
        .list-group-title.group-edu { color: #7dd3fc; border-color: #0369a1; }
        .card-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .card-action {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }
        .card-action.is-on { border-color: var(--warn); color: #fde68a; }

        .v2-box, .v2-section { margin-bottom: 14px; }
        .v2-box { border-radius: 12px; padding: 10px 12px; border-left: 4px solid; }
        .v2-first { border-left-color: var(--accent); background: rgba(239, 68, 68, 0.12); }
        .v2-dont { border-left-color: var(--warn); background: rgba(234, 179, 8, 0.12); }
        .v2-support { border-left-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .v2-title {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--warn);
        }
        .v2-first .v2-title { color: #fca5a5; }
        .v2-support .v2-title { color: #7dd3fc; }
        .v2-list { margin: 0; padding-left: 20px; }
        .v2-list li {
            margin-bottom: 6px;
            font-size: clamp(0.98rem, 2vw, 1.15rem);
            line-height: 1.4;
            font-weight: 700;
        }
        .v2-page { color: var(--muted); font-size: 0.7em; font-weight: 600; white-space: nowrap; }
        .v2-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 6px;
            margin-bottom: 14px;
        }
        .v2-param {
            display: grid;
            gap: 2px;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 10px;
        }
        .v2-param-wide { grid-column: 1 / -1; }
        .v2-param-name { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .v2-param-value { font-size: 1rem; font-weight: 900; }
        body.large-text .v2-list li { font-size: 1.35rem; }

        .card-freshness {
            margin: -6px 0 12px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }
        .card-freshness.is-warn { color: #fdba74; }
        .full-document-status.status-warn { color: #fdba74; }
        .full-document-status.status-info { color: #93c5fd; }

        .procedure-line.line-critical,
        .procedure-line.line-warning {
            padding: 8px 10px;
            border-radius: 10px;
            border-left: 4px solid;
        }
        .procedure-line.line-critical {
            border-left-color: var(--accent);
            background: rgba(239, 68, 68, 0.12);
        }
        .procedure-line.line-warning {
            border-left-color: var(--warn);
            background: rgba(234, 179, 8, 0.12);
        }

        .list-group-title {
            margin: 14px 0 4px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fca5a5;
        }
        .list-group-title:first-child { margin-top: 0; }
        .list-group-title span { color: var(--muted); }
        .result-edu { border-left: 3px solid #38bdf8; }

        body.large-text .procedure-line { font-size: 1.35rem; line-height: 1.5; }
        body.large-text .procedure-prefix { font-size: 15px; }
        body.large-text .search-result-title { font-size: 1.15rem; }
        body.large-text .proc-open,
        body.large-text .tile-label { font-size: 15px; }

        body.high-contrast {
            --text: #ffffff;
            --muted: #cbd5e1;
            --line: #64748b;
        }
        body.high-contrast,
        html:has(body.high-contrast) { background: #000; }
        body.high-contrast .procedure-card,
        body.high-contrast .search-result-btn,
        body.high-contrast .tile,
        body.high-contrast .chip,
        body.high-contrast .toolbar-btn,
        body.high-contrast .manual-input,
        body.high-contrast .settings-panel {
            background: #000;
            border-color: #94a3b8;
        }
        body.high-contrast .proc-open,
        body.high-contrast .proc-name { color: #fff; }

        .listening {
            animation: pulse 1s infinite;
            background: rgba(127, 29, 29, 0.92) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.35);
        }

        .helper {
            color: #64748b;
            text-align: center;
            font-size: 11px;
            line-height: 1.45;
        }

        body.result-mode .mic-btn,
        body.result-mode .reset-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 108px;
            height: 42px;
            padding: 0 16px;
            border-width: 2px;
            border-radius: 999px;
            font-size: 0.82rem;
            box-shadow: 0 0 26px rgba(0, 0, 0, 0.18);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.985); }
        }

        @media (max-width: 640px) {
            .manual-panel { grid-template-columns: 1fr; }

            .search-btn { width: 100%; }
            .toolbar .toolbar-btn { flex: 1 1 0; padding: 9px 6px; }
            .status-pill { flex: 1 1 100%; }
            .settings-panel .toolbar-btn { width: 100%; }

            #debug-console { height: 160px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="header">
            <div class="header-row">
                <h1 class="title">KDR AI SYSTEM</h1>
                <span class="version">v19.6.10 ENERGETYKA PSE</span>
            </div>

            <div class="toolbar">
                <span id="status-pill" class="status-pill" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="status-text">Uruchamianie…</span>
                </span>
                <button id="voice-help-btn" class="toolbar-btn" type="button">Wszystkie procedury</button>
                <button id="settings-btn" class="toolbar-btn" type="button" aria-expanded="false" aria-controls="settings-panel">Ustawienia</button>

        // Awaryjna baza wbudowana w index.html.

        const EMBEDDED_PROCEDURES = [{"id":"KARTA-ACETYLEN-Z1","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"butla acetylen po pozarze","keywords":["butla acetylen podgrzana","butla acetylen po uderzeniu","chlodzenie butli acetylen 24h","test zwilzania acetylen"],"prefix":"Karta Z1 - Butle poddane dzialaniu ognia/ciepla lub poddane wielokrotnym uderzeniom, szczelne lub nieszczelne.","content":"1. KOD / NAZWA: Z1 - butle z acetylenem poddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom, szczelne lub nieszczelne.\n2. ROZPOZNANIE: ostrzez ratownikow, nie zblizaj sie do butli i jej nie przemieszczaj. Traktuj butle jako potencjalnie niestabilna do czasu zakonczenia skutecznego chlodzenia i oceny jej stanu.\n3. STREFA: wyznacz strefe zagrozenia o minimalnym zalecanym promieniu 200 m i przeprowadz ewakuacje. Ogranicz liczbe ratownikow w strefie do niezbednego minimum.\n4. SOI: w promieniu 30 m stosuj ochrone drog oddechowych i oczu.\n5. DZIALANIA KRYTYCZNE: rozpocznij chlodzenie butli rozproszonymi pradami wody, najlepiej ze stanowisk bezobslugowych i z wykorzystaniem dostepnych oslon.\n6. PROCEDURA SZCZEGOLOWA: prowadz chlodzenie co najmniej 1 godzine, a przy utrudnionym dostepie do okolo 50% powierzchni co najmniej 3 godziny. Gdy butla jest nieszczelna i uwalniany acetylen sie spala, prowadz chlodzenie do momentu jej oproznienia, nie gas plomienia palacego sie gazu, monitoruj stezenie gazu w powietrzu oraz zagrozenie wybuchem i eliminuj zrodla zaplonu. Jezeli nie wystepuje zagrozenie zycia ludzkiego, a sytuacja uniemozliwia bezpieczne zastosowanie stanowisk bezobslugowych lub oslon, rozwaz pozostawienie butli w miejscu zdarzenia bez podejmowania dzialan chlodzacych. Po przerwaniu chlodzenia przeprowadz test zwilzania; gdy nad butla unosi sie para wodna albo powierzchnia szybko wysycha, kontynuuj chlodzenie przez kolejna godzine i powtorz test. Gdy powierzchnia pozostaje zimna, sprawdz szczelnosc; butle zimna i szczelna mozna przeniesc do zbiornika z woda dla kontynuacji 24-godzinnego procesu chlodzenia, a butle nieszczelna zaleca sie dalej chlodzic pradami wody lub przeniesc do zbiornika z woda, gdy ryzyko pozarowo-wybuchowe zwiazane z uwalnianiem gazu jest nieznaczne.\n7. CO MOZE POJSC NIE TAK: najwiekszym bledem jest zblizenie sie do butli bez oslon, przedwczesne przerwanie chlodzenia, zgaszenie plomienia uwalnianego acetylenu oraz zignorowanie dodatniego wyniku testu zwilzania.\n8. UWAGI OPERACYJNE: karta obejmuje zarowno butle szczelne, jak i nieszczelne, jesli byly poddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom.","tagi_wspolne":["acetylen","butla acetylenowa","pozar","butla po pozarze","butla podgrzana"],"aliasy":["butla acetylen podgrzana","butla acetylen po uderzeniu","chlodzenie butli acetylen 24h","test zwilzania acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":3,"sekcja":"Karta Z1 - butle poddane działaniu ognia, ciepła lub uderzeniom"}]},{"id":"KARTA-ACETYLEN-Z2","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"nieszczelna butla acetylen wewnatrz obiektu","keywords":["wyciek acetylenu w budynku","acetylen wewnatrz obiektu","karta z2 acetylen"],"prefix":"Karta Z2 - Butle niepoddane dzialaniu ognia/ciepla lub wielokrotnym uderzeniom - nieszczelne, znajdujace sie wewnatrz obiektu.","content":"1. KOD / NAZWA: Z2 - butle z acetylenem niepoddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom, nieszczelne, znajdujace sie wewnatrz obiektu.\n2. ROZPOZNANIE: potwierdz, ze butla jest nieszczelna i znajduje sie wewnatrz obiektu. Monitoruj obszar wystepowania mieszaniny wybuchowej.\n3. STREFA: przyjmij granice strefy zagrozenia co najmniej jako sciany zewnetrzne obiektu lub pomieszczenia; w zaleznosci od okolicznosci zdarzenia rozwaz jej zwiekszenie i ewakuuj osoby ze strefy.\n4. SOI: ogranicz liczbe ratownikow w strefie do minimum i stosuj ochrone drog oddechowych oraz oczu.\n5. DZIALANIA KRYTYCZNE: wyeliminuj potencjalne zrodla zaplonu, ratownikow zabezpiecz rozproszonym pradem wody, stosuj narzedzia nieiskrzace i urzadzenia w wykonaniu przeciwwybuchowym. Jezeli nie wystepuje potrzeba ratowania zycia ludzkiego, nie wchodz do strefy zagrozenia wybuchem.\n6. PROCEDURA SZCZEGOLOWA: stosuj maksymalnie bezpieczna wentylacje pomieszczen. Gdy nie wystepuje zagrozenie wybuchem, podejmij probe zakrecenia zaworu na butli w celu zatrzymania wycieku gazu. Po zakreceniu zaworu sprawdz, czy cala powierzchnia butli pozostaje zimna; jesli nie, przejdz do dzialan z karty Z1, a jesli pozostaje zimna, dopuszcza sie przeniesienie butli w inne miejsce, np. na zewnatrz budynku, trzymajac ja za plaszcz i nie trzymajac za zawor lub kolpak.\n7. CO MOZE POJSC NIE TAK: najwiekszym bledem jest wejscie do strefy zagrozenia wybuchem bez bezwzglednej potrzeby, niedostateczne usuniecie zrodel zaplonu oraz chwytanie butli za zawor albo kolpak podczas przenoszenia.\n8. UWAGI OPERACYJNE: karta dotyczy butli nieszczelnych wewnatrz obiektu, ale tylko wtedy, gdy nie byly poddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom.","tagi_wspolne":["acetylen","butla acetylenowa","wyciek"],"aliasy":["wyciek acetylenu w budynku","acetylen wewnatrz obiektu","karta z2 acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":5,"sekcja":"Karta Z2 - butla nieszczelna wewnątrz obiektu"}]},{"id":"KARTA-ACETYLEN-Z3","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"nieszczelna butla acetylen na zewnatrz","keywords":["wyciek acetylenu na zewnatrz","acetylen poza budynkiem","karta z3 acetylen"],"prefix":"Karta Z3 - Butle niepoddane dzialaniu ognia/ciepla lub wielokrotnym uderzeniom - nieszczelne, znajdujace sie na zewnatrz obiektu.","content":"1. KOD / NAZWA: Z3 - butle z acetylenem niepoddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom, nieszczelne, znajdujace sie na zewnatrz obiektu.\n2. ROZPOZNANIE: potwierdz, ze butla jest nieszczelna i znajduje sie na zewnatrz obiektu. Monitoruj obszar wystepowania mieszaniny wybuchowej.\n3. STREFA: wyznacz promien strefy zagrozenia na podstawie wskazan urzadzen pomiarowych, lecz nie mniejszy niz 30 m, i przeprowadz ewakuacje osob ze strefy.\n4. SOI: ogranicz liczbe ratownikow w strefie do minimum i stosuj ochrone drog oddechowych oraz oczu.\n5. DZIALANIA KRYTYCZNE: wyeliminuj potencjalne zrodla zaplonu, ratownikow przebywajacych w strefie zabezpiecz rozproszonym pradem wody, korzystaj z narzedzi nieiskrzacych i urzadzen w wykonaniu przeciwwybuchowym.\n6. PROCEDURA SZCZEGOLOWA: gdy nie wystepuje zagrozenie wybuchem, podejmij probe zakrecenia zaworu na butli w celu zatrzymania wycieku gazu. Po zakreceniu zaworu sprawdz, czy cala powierzchnia butli pozostaje zimna; jesli nie, przejdz do dzialan z karty Z1, a jesli pozostaje zimna, dopuszcza sie jej przeniesienie w inne bezpieczniejsze miejsce.\n7. CO MOZE POJSC NIE TAK: najwiekszym bledem jest niedoszacowanie strefy, pozostawienie aktywnych zrodel zaplonu oraz przenoszenie butli bez potwierdzenia, ze cala powierzchnia pozostaje zimna.\n8. UWAGI OPERACYJNE: karta dotyczy butli nieszczelnych na zewnatrz obiektu, ale tylko wtedy, gdy nie byly poddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom.","tagi_wspolne":["acetylen","butla acetylenowa","wyciek"],"aliasy":["wyciek acetylenu na zewnatrz","acetylen poza budynkiem","karta z3 acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":6,"sekcja":"Karta Z3 - butla nieszczelna na zewnątrz obiektu"}]},{"id":"KARTA-ACETYLEN-Z4","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"szczelna butla acetylen","keywords":["butla acetylen nieuszkodzona","zimna butla acetylen","karta z4 acetylen"],"prefix":"Karta Z4 - Butle niepoddane dzialaniu ognia/ciepla lub wielokrotnym uderzeniom - szczelne.","content":"1. KOD / NAZWA: Z4 - butle z acetylenem niepoddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom, szczelne.\n2. ROZPOZNANIE: sprawdz organoleptycznie, czy cala powierzchnia butli pozostaje zimna. Jezeli cala powierzchnia lub jej czesc pozostaje ciepla, przejdz do dzialan z karty Z1.\n3. STREFA: w przekazanej procedurze nie podano osobnego promienia strefy; kluczowe jest potwierdzenie, ze butla jest zimna i szczelna, zanim zostana podjete dalsze czynnosci.\n4. SOI: w przekazanej procedurze nie wskazano odrebnego zestawu SOI dla tej karty.\n5. DZIALANIA KRYTYCZNE: gdy temperatura plaszcza jest porownywalna do temperatury otoczenia, sprawdz szczelnosc ocena z bliska lub sprzetem pomiarowym.\n6. PROCEDURA SZCZEGOLOWA: jezeli butla jest nieszczelna, przejdz do karty Z2, gdy butla lub butle znajduja sie wewnatrz obiektu, albo do karty Z3, gdy znajduja sie na zewnatrz obiektu. W przypadku gdy butla lub butle sa szczelne oraz istnieje prawdopodobienstwo, ze w czasie zdarzenia mogly zostac poddane oddzialywaniu ognia, ciepla lub wystepuje zagrozenie zwiazane z ich upadkiem z wysokosci, przenies je w bezpieczne miejsce.\n7. CO MOZE POJSC NIE TAK: najwiekszym bledem jest uznanie butli za bezpieczna mimo cieplej powierzchni albo potwierdzonej nieszczelnosci i pozostawienie jej bez przekwalifikowania do Z1, Z2 lub Z3.\n8. UWAGI OPERACYJNE: karta dotyczy wylacznie butli szczelnych i niepoddanych dzialaniu ognia, ciepla lub wielokrotnym uderzeniom.","tagi_wspolne":["acetylen","butla acetylenowa","butla szczelna"],"aliasy":["butla acetylen nieuszkodzona","zimna butla acetylen","karta z4 acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":7,"sekcja":"Karta Z4 - butla szczelna"}]},{"id":"KARTA-ACETYLEN-PRZEKAZANIE","kategoria":"organizacja","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"przekazanie miejsca zdarzenia acetylen","keywords":["przekazanie butli acetylenowej","udt tdt wdt acetylen","zakonczenie dzialan acetylen","przekazanie po chlodzeniu butli","protokol przekazania acetylen","po akcji butla acetylenowa","przekazanie acetylen"],"prefix":"Przekazanie miejsca zdarzenia po dzialaniach z udzialem butli z acetylenem.","content":"1. KOD / NAZWA: przekazanie miejsca zdarzenia po dzialaniach z udzialem butli z acetylenem.\n2. Z1 - PO ZAKONCZENIU CHLODZENIA: po zakonczeniu 24-godzinnego procesu chlodzenia przekaz miejsce zdarzenia wlascicielowi lub uzytkownikowi, sporzadzajac dokument przekazania. Powiadom miejscowy UDT, TDT lub WDT i wpisz do dokumentu czas rozpoczecia oraz zakonczenia chlodzenia, informacje o powiadomieniu oraz zakazie uzytkowania butli do czasu dopuszczenia do eksploatacji.\n3. Z1 - PRZED UKONCZENIEM 24 GODZIN: gdy po dzialaniach butla zostala zanurzona w zbiorniku z woda, przekaz miejsce zdarzenia z wpisaniem czasu rozpoczecia chlodzenia oraz wymaganego czasu jego kontynuacji. Pozostale informacje przekaz jak dla Z1 po zakonczeniu chlodzenia.\n4. Z2 - WARUNKI PRZEKAZANIA: przekaz miejsce zdarzenia po zatrzymaniu wycieku przez zakrecenie zaworu i potwierdzeniu, ze butla jest zimna, albo po oproznieniu butli. W dokumencie podaj informacje o oproznieniu butli, szczegolnie gdy nie pozostalo wymagane cisnienie resztkowe.\n5. Z3 - WARUNKI PRZEKAZANIA: przekaz miejsce zdarzenia po zatrzymaniu wycieku przez zakrecenie zaworu albo po oproznieniu butli. W dokumencie podaj informacje o oproznieniu butli, szczegolnie gdy nie pozostalo wymagane cisnienie resztkowe.\n6. Z4 - WARUNKI PRZEKAZANIA: przekaz miejsce zdarzenia, gdy butle znajduja sie w miejscu bezpiecznym.\n7. UWAGI OPERACYJNE: dokument przekazania powinien odzwierciedlac stan butli i wykonane czynnosci, a w przypadku Z1 rowniez formalne powiadomienie miejscowego UDT, TDT lub WDT.","tagi_wspolne":["acetylen","butla acetylenowa","przekazanie"],"aliasy":["przekazanie butli acetylenowej","udt tdt wdt acetylen","zakonczenie dzialan acetylen","przekazanie po chlodzeniu butli","protokol przekazania acetylen","po akcji butla acetylenowa","przekazanie acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":8,"sekcja":"Przekazanie miejsca zdarzenia"}]},{"id":"KARTA-ACETYLEN-ROZPOZNANIE","kategoria":"rozpoznanie","zrodlo":"Standardowe zasady postepowania podczas zdarzen z udzialem butli z acetylenem, KG PSP","data_aktualizacji":"2020-03-13","slowo_kluczowe":"rozpoznanie butli acetylen","keywords":["jak rozpoznac butle z acetylenem","czy butla acetylen jest szczelna","ocena butli acetylen","podejrzenie rozkladu acetylenu","rozpoznanie acetylen"],"prefix":"Rozpoznanie - butle z acetylenem.","content":"1. KOD / NAZWA: rozpoznanie butli z acetylenem.\n2. ROZPOZNANIE WSTEPNE: pozyskaj od personelu, uczestnikow i swiadkow jak najwiecej informacji o okolicznosciach zdarzenia. Nie zblizaj sie do butli i jej nie przemieszczaj.\n3. OZNAKI ZAGROZENIA: ocen stan butli po oznakach zewnetrznych i otoczeniu; oznaki ogrzania, uszkodzen, plomienia, odglosu wyplywu gazu lub kopcacego plomienia wskazuja na zagrozenie i potrzebe rozpoczecia chlodzenia.\n4. DZIALANIA KRYTYCZNE: gdy nie jestes pewien stanu butli, podaj jak najszybciej rozproszony prad wody na cala powierzchnie i obserwuj parowanie; jesli wystepuje para nad plaszczem, kontynuuj chlodzenie.\n5. KWALIFIKACJA: ocen, czy butla jest szczelna. Butle poddane dzialaniu ognia, ciepla lub wielokrotnym uderzeniom kwalifikuj do Z1. Butle niepoddane tym oddzialywaniom, ale nieszczelne wewnatrz obiektu kwalifikuj do Z2. Butle niepoddane tym oddzialywaniom, ale nieszczelne na zewnatrz obiektu kwalifikuj do Z3. Butle niepoddane tym oddzialywaniom i szczelne kwalifikuj do Z4.\n6. UWAGI OPERACYJNE: przy braku pewnej informacji o stanie butli przyjmij najbardziej niebezpieczny przypadek i prowadz dzialania jak dla karty Z1.","tagi_wspolne":["acetylen","butla acetylenowa","rozpoznanie"],"aliasy":["jak rozpoznac butle z acetylenem","czy butla acetylen jest szczelna","ocena butli acetylen","podejrzenie rozkladu acetylenu","rozpoznanie acetylen"],"dokumenty_zrodlowe":[{"dokument_id":"doc-acetylen-szp-2020","strona":2,"sekcja":"Rozpoznanie"}]},{"id":"KARTA-BUD-INFORMACJE-DODATKOWE-KATASTROFA-BUDOWLANA","kategoria":"informacje","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"katastrofa budowlana informacje dodatkowe","keywords":["zawalenie budynku","typy zawalen","gruzowisko","zawalony obiekt","niebezpieczenstwa zawalenia","budowlane"],"prefix":"Katastrofa budowlana - typy zawalen obiektow i podstawowe zagrozenia.","content":"1. KOD / NAZWA: katastrofa budowlana - informacje dodatkowe o typach zawalen i zagrozeniach.\n2. TYPY ZAWALEN: dokument wskazuje piec podstawowych typow zawalen obiektow budowlanych: typ 1 - zawalenie kondygnacji do wewnatrz obiektu, typ 2 - zawalenie warstwowe i opadniecie stropow, typ 3 - zawalenie calkowite zwane rumowiskiem, typ 4 - zawalenie w wyniku przemieszczenia obiektu lub jego czesci, typ 5 - zawalenie czesci obiektu z wiszacymi elementami i zagruzowaniem.\n3. GLOWNE ZAGROZENIA: naruszona konstrukcja budowlana niesie zagrozenia zwiazane z uszkodzeniem konstrukcji, mediow znajdujacych sie w obiekcie oraz materialow obecnych pod gruzowiskiem.\n4. ZAGROZENIA KONSTRUKCYJNE: niestabilne i ruchome czesci budynku grozace dalszym zawaleniem, odpadnieciem lub osunieciem, duze obciazenia i ciezar elementow budowlanych oraz nieznana nosnosc i wytrzymalosc elementow gruzowiska.\n5. ZAGROZENIA INSTALACYJNE: uwolnienie gazu mogacego tworzyc mieszaniny wybuchowe lub ulec zapaleniu, porazenie pradem elektrycznym oraz wyciek z uszkodzonych instalacji wodnych, ktory moze zalac przestrzenie z osobami.\n6. ZAGROZENIA DODATKOWE: materialy pirotechniczne, substancje chemiczne mogace szkodzic poszkodowanym, zagrozenia biologiczne i radiacyjne zalezne od specyfiki obiektu oraz dzikie lub egzotyczne zwierzeta.\n7. UWAGI OPERACYJNE: karta ma charakter orientacyjny i sluzy do szybkiej identyfikacji typu zawalenia oraz najbardziej prawdopodobnych zagrozen przed rozpoczeciem dzialan szczegolowych.","tagi_wspolne":["katastrofa budowlana","zawalenie"],"aliasy":["zawalenie budynku","typy zawalen","gruzowisko","zawalony obiekt","niebezpieczenstwa zawalenia","budowlane"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":1,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-ORGANIZACJA-DZIALAN-KATASTROFA-BUDOWLANA","kategoria":"organizacja","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"organizacja dzialan katastrofa budowlana","keywords":["gruzowisko organizacja akcji","katastrofa budowlana organizacja","rotacja ratownikow gruzowisko","sztab katastrofa budowlana"],"prefix":"Katastrofa budowlana - organizacja dzialan ratowniczych na gruzowisku.","content":"1. KOD / NAZWA: katastrofa budowlana - organizacja dzialan ratowniczych.\n2. ORGANIZACJA WSTEPNA: ogranicz liczbe ratownikow w strefie zagrozenia do niezbednego minimum. Wyznacz miejsce na organizacje punktu przyjecia SIS oraz osobe odpowiedzialna za jego obsluge. Po ewakuacji okresl priorytety ratownicze i zaznacz miejsca lokalizacji osob zywych albo miejsc, gdzie prawdopodobnie moga przebywac osoby w chwili zdarzenia.\n3. PRZESZUKANIE: przystap do przeszukania obiektu z wykorzystaniem dostepnych metod i sprzetu, zachowujac zasady BHP. W pierwszej kolejnosci wykorzystuj strazakow nawotujacych osoby pod gruzami, megafony, psy ratownicze oraz informacje od przewodnikow psow. Kazdorazowo przed nawolywaniem oglaszaj cisze na gruzowisku.\n4. KONTROLA MIEJSC NIEBEZPIECZNYCH: na kazdym etapie przeszukiwania obiektu upewnij sie, ze niestabilne elementy zostaly wlasciwie zabezpieczone, usuniete lub ustabilizowane, a w razie braku takiej mozliwosci miejsca te zostaly oznaczone i omijane. Przeszukanie wszystkich zlokalizowanych poszkodowanych nalezy powtarzac bezprzyrzadowo.\n5. ZABEZPIECZENIE RATOWNIKOW: podczas odgruzowywania zapewnij ratownikom sprzet ochronny osobistej, a w razie potrzeby takze oddechowej. Upewnij sie, ze przy wejsciu do strefy zagrozenia znajduja sie zespoly zdolne udzielic pomocy odnalezionym lub ewakuowanym poszkodowanym.\n6. ROTACJA I ODWOD: przy wyjsciu ze strefy zagrozenia zapewnij mozliwosc dekontaminacji ratownikow i sprzetu dla osob konczacych zmiane robocza. Zapewnij odwod taktyczny do podmiany pracujacych ratownikow oraz bezpieczna odleglosc od prowadzonych dzialan. Unikaj obecnosci osob zbednych na terenie akcji.\n7. CZAS PRACY: organizuj rotacyjna prace ratownikow, przyjmujac nie wiecej niz 6 godzin pracy w strefie i w warunkach szczegolnie trudnych odpowiednio krotszy czas zmiany, do 4 lub nawet 2 godzin.\n8. SZTAB I ODCINKI: w razie potrzeby utworz zespoly ratownikow z okreslonym zadaniem, wyznacz miejsce dla kierowania taktycznego oraz zorganizuj sztab. Zadysponuj SDC, namiot do pracy sztabu, wyznacz szefa sztabu i osoby odpowiedzialne za kontrole wejsc i wyjsc. Zadbaj o oznakowanie osob funkcyjnych, miejsca obslugi mediow, wsparcia psychologicznego, PPSiS, sztabu oraz miejsca tymczasowej ewakuacji poszkodowanych.\n9. WSPOLDZIALANIE: po dojezdzie SGPR albo SGRT podziel teren akcji na odcinki bojowe, wyznacz dowodce odcinka specjalistycznego oraz grupe ratownicza. Opracuj schemat lacznosci akcji i czas skladania meldunkow. Na biezaco informuj wlasciwe terenowo stanowisko kierowania PSP. W porozumieniu z przedstawicielami zarzadzania kryzysowego zadysponuj ciezki sprzet budowlany oraz do odgruzowywania zniszczonego obiektu.\n10. CO MOZE POJSC NIE TAK: brak ustalenia zasad finansowania moze opoznic wykorzystanie sprzetu. Upewnij sie, ze zasady finansowania uzycia sprzetu zostaly ustalone przed jego uruchomieniem. Informowanie mediow powinno odbywac sie wyłącznie przez wyznaczonego oficera prasowego lub osobe odpowiedzialna za kontakt z mediami.\n11. UWAGI OPERACYJNE: w razie koniecznosci wyznacz osobe do obslugi sprzetu specjalistycznego poza strefa zagrozenia, miejsce skladowania sprzetu oraz osobe do jego obslugi, a przy pracach na wyzszych kondygnacjach uwzglednij mozliwosc wykorzystania podnosnikow lub technik alpinistycznych.","tagi_wspolne":["katastrofa budowlana","zawalenie","organizacja dzialan"],"aliasy":["gruzowisko organizacja akcji","katastrofa budowlana organizacja","rotacja ratownikow gruzowisko","sztab katastrofa budowlana"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":4,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-PRIORYTETY-TYPOW-ZAWALEN","kategoria":"informacje","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"priorytety typow zawalen","keywords":["typy zawalen priorytety","zawalenie typ 1","zawalenie typ 2","zawalenie typ 3","zawalenie typ 4","zawalenie typ 5"],"prefix":"Katastrofa budowlana - dodatkowe priorytety organizacji dzialan dla roznych typow zawalen.","content":"1. KOD / NAZWA: katastrofa budowlana - dodatkowe priorytety dzialan dla typow zawalen.\n2. TYP 1 - ZAWALENIE KONDYGNACJI DO WEWNATRZ OBIEKTU: priorytetem jest uzycie psow ratowniczych i elektroniki do lokalizacji osob zywych, stabilizacja naruszonych elementow gruzowiska, monitorowanie stabilnosci oraz ograniczenie wejscia do minimum. Nalezy uwzglednic wysokosc obiektu przy wyznaczaniu granic strefy niebezpiecznej.\n3. TYP 2 - ZAWALENIE WARSTWOWE, OPADNIECIE STROPOW: priorytetem jest uzycie psow ratowniczych i elektroniki, ocena mozliwosci przezycia w malych przestrzeniach, monitorowanie stabilnosci, wykorzystanie ciezkiego sprzetu do unoszenia elementow konstrukcji oraz podnosnikow lub technik alpinistycznych do ewakuacji z wyzszych kondygnacji.\n4. TYP 3 - ZAWALENIE CALKOWITE, RUMOWISKO: priorytetem jest uzycie psow ratowniczych i elektroniki do lokalizacji osob zywych, reczne albo zmechanizowane odgruzowywanie, monitorowanie stabilnosci obiektu, napowietrzanie ciasnych przestrzeni i tuneli oraz bardzo krotki czas na uratowanie poszkodowanych.\n5. TYP 4 - ZAWALENIE W WYNIKU PRZEMIESZCZENIA OBIEKTU LUB JEGO CZESCI: priorytetem jest uzycie psow ratowniczych i elektroniki do lokalizacji osob zywych, monitorowanie stabilnosci obiektu oraz utrzymania droznosci drog ewakuacyjnych, przy jednoczesnym uwzglednieniu wysokosci obiektu przy wyznaczaniu strefy niebezpiecznej.\n6. TYP 5 - ZAWALENIE CZESCI OBIEKTU Z WISZACYMI ELEMENTAMI I ZAGRUZOWANIEM: priorytetem jest uzycie psow ratowniczych i elektroniki do lokalizacji osob zywych, monitorowanie stabilnosci obiektu, przygotowanie stabilizacji naruszonych elementow, zwrocenie uwagi na wysokosc obiektu przy wyznaczaniu granic strefy niebezpiecznej oraz uwzglednienie mozliwosci obecnosci poszkodowanych na wyzszych kondygnacjach.\n7. UWAGI OPERACYJNE: karta ma sluzyc szybkiemu doborowi priorytetow taktycznych zalezenie od dominujacego typu zawalenia i nie zastępuje podstawowych zasad rozpoznania, wyznaczania stref i organizacji akcji.","tagi_wspolne":["katastrofa budowlana","zawalenie","typy zawalen"],"aliasy":["typy zawalen priorytety","zawalenie typ 1","zawalenie typ 2","zawalenie typ 3","zawalenie typ 4","zawalenie typ 5"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":6,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-PRZEKAZANIE-KATASTROFA-BUDOWLANA","kategoria":"organizacja","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"przekazanie miejsca zdarzenia katastrofa budowlana","keywords":["przekazanie gruzowisko","po akcji katastrofa budowlana","przekazanie zawalony budynek","przekazanie katastrofa budowlana"],"prefix":"Katastrofa budowlana - przekazanie miejsca zdarzenia po zakonczeniu dzialan.","content":"1. KOD / NAZWA: katastrofa budowlana - przekazanie miejsca zdarzenia.\n2. DOKUMENTACJA: przekaz miejsce zdarzenia wlascicielowi, uzytkownikowi albo Policji zgodnie z obowiazujacymi zasadami, sporzadzajac wlasciwy dokument przekazania. Dokumentem wskazanym w procedurze jest potwierdzenie przekazania terenu, obiektu lub mienia objetego dzialaniem ratowniczym.\n3. INFORMACJE DLA PRZEJMUJACEGO: przekaz osobie przejmujacej informacje o prowadzonych dzialaniach ratowniczych oraz potencjalnych zagrozeniach, w szczegolnosci o aktualnej sytuacji na terenie akcji, miejscach niebezpiecznych lub mogacych stanowic zagrozenie, elementach konstrukcji i obiektu ewakuowanymi poza obrys obiektu oraz stanie mediow w obiekcie.\n4. OGRANICZENIA I OSTRZEZENIA: zwroc uwage, ze elementy stabilizacji gruzowiska byly wykonywane tylko na potrzebe dzialan ratowniczych i po ich zakonczeniu nie daja gwarancji bezpieczenstwa.\n5. DALSZE POSTEPOWANIE: ustal sposob dalszego postepowania w stosunku do obiektu przez inne sluzby, wlasciciela albo powiadom o tym osobe przejmujaca miejsce zdarzenia.\n6. UWAGI OPERACYJNE: karta konczy faze ratownicza i powinna jasno okreslac stan obiektu, zakres wykonanych zabezpieczen oraz pozostale ograniczenia zwiazane z mozliwoscia dalszego przebywania na terenie katastrofy budowlanej.","tagi_wspolne":["katastrofa budowlana","zawalenie","przekazanie"],"aliasy":["przekazanie gruzowisko","po akcji katastrofa budowlana","przekazanie zawalony budynek","przekazanie katastrofa budowlana"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":8,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-ROZPOZNANIE-KATASTROFA-BUDOWLANA","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"rozpoznanie katastrofa budowlana","keywords":["rozpoznanie zawalenie","gruzowisko rozpoznanie","katastrofa budowlana rozpoznanie","zawalony budynek rozpoznanie"],"prefix":"Katastrofa budowlana - rozpoznanie miejsca zdarzenia.","content":"1. KOD / NAZWA: katastrofa budowlana - rozpoznanie miejsca zdarzenia.\n2. ROZPOZNANIE WSTEPNE: pozyskaj od personelu obiektu, uczestnikow i swiadkow zdarzenia jak najwiecej informacji o charakterze i przeznaczeniu obiektu, liczbie kondygnacji nadziemnych i podziemnych, przypuszczalnej godzinie zdarzenia, liczbie osob przebywajacych w obiekcie w chwili zdarzenia, mozliwym kontakcie z poszkodowanymi, mediach oraz potencjalnych przyczynach zawalenia.\n3. OCENA OBIEKTU: ustal, czy w obiekcie byly podlaczone media i czy zostaly juz odlaczone. Jezeli media nie zostaly odlaczone albo nie ma pewnosci co do ich stanu, wezwij odpowiednie sluzby i zachowaj szczegolna ostroznosc przy wprowadzaniu ludzi na gruzowisko.\n4. OGLADZINY: dokonaj ogledzin obiektu z kazdej strony zgodnie z zasadami bezpieczenstwa i przy zachowaniu szczegolnej uwagi na niestabilne, uszkodzone elementy konstrukcji i budowlane. Do rozpoznania wysylaj minimum dwoch ratownikow wyposazonych w sprzet pomiarowy i lacznosc.\n5. SZKIC I PRZESZUKANIE: wykonaj szkic obiektu z zaznaczeniem szczegolnych miejsc z punktu widzenia bezpieczenstwa oraz priorytetow ratowniczych. Wykonaj wstepne przeszukanie gruzowiska i jego przesluchanie metoda nawolywania i nasluchiwania.\n6. DYSPOZYCJE DODATKOWE: w przypadku prawdopodobienstwa znajdowania sie osob pod gruzami albo znacznego uszkodzenia obiektu zadysponuj dodatkowe SIS, w szczegolnosci SGPR poziomu A, B i C oraz SGRT, a stosownie do sytuacji inne sluzby i przedstawicieli zarzadzania kryzysowego, pogotowie gazowe i energetyczne, przedstawicieli gminy, miasta lub powiatu, Powiatowego Inspektora Nadzoru Budowlanego, a w razie potrzeby zespol rozpoznania pirotechnicznego Policji albo SGRChem.\n7. ZABEZPIECZENIE DZIALAN: okresl zapotrzebowanie na zespoly PRM. W przypadku zadysponowania smiglowca LPR okresl i przygotuj miejsce do ladowania. Wyznacz punkt przyjecia sil i srodkow oraz przydziel do niego funkcjonariusza wyposazonego w radiotelefon w celu przekazywania informacji o przybylych SIS.\n8. CO MOZE POJSC NIE TAK: nie podejmuj zadnych dzialan ratowniczych w strefie zagrozenia do czasu wlasciwego zabezpieczenia miejsca dzialan oraz ratownikow. W dzialaniach poszukiwawczych z wykorzystaniem psow ratowniczych mozna wykorzystywac tylko zespoly z aktualnym egzaminem klasy I zgodnie z obowiazujacymi przepisami, a przewodnik psa powinien legitymowac sie wlasciwym dokumentem.\n9. UWAGI OPERACYJNE: karta obejmuje rozpoznanie przed wprowadzeniem ratownikow do strefy dzialan i powinna stanowic podstawe do dalszego wyznaczenia stref oraz organizacji akcji.","tagi_wspolne":["katastrofa budowlana","zawalenie","rozpoznanie"],"aliasy":["rozpoznanie zawalenie","gruzowisko rozpoznanie","katastrofa budowlana rozpoznanie","zawalony budynek rozpoznanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":2,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-STREFA-I-EWAKUACJA-KATASTROFA-BUDOWLANA","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"strefa zagrozenia katastrofa budowlana","keywords":["ewakuacja gruzowisko","katastrofa budowlana ewakuacja","strefa zawalenie budynku","wyznacz strefe gruzowisko"],"prefix":"Katastrofa budowlana - wyznaczanie strefy zagrozenia i ewakuacja ludzi.","content":"1. KOD / NAZWA: katastrofa budowlana - wyznaczanie strefy zagrozenia i ewakuacja ludzi.\n2. STREFA DLA RATOWNIKOW: przed wprowadzeniem strazakow do dzialan opracuj zasady bezpieczenstwa. Wyznacz strefe zagrozenia, w ktorej beda prowadzone dzialania ratownicze, korzystajac z zasady minimum 3-5 m od brzegu gruzowiska albo, w przypadku niestabilnych elementow, odleglosci rownej co najmniej 150 procent wysokosci najwyzszego niestabilnego elementu obiektu.\n3. OBSZARY NIEBEZPIECZNE: wyznacz jako obszary zamkniete miejsca niestabilne, uszkodzone lub grozace upadkiem elementy, miejsca wystepowania zagrozen mediami lub pozarem oraz inne niebezpieczne strefy.\n4. OZNAKOWANIE I ORGANIZACJA: okresl wejscie i wyjscie do strefy zagrozenia oraz oznacz je czytelnie, wyznacz droge dojazdu dla kolejnych SIS, miejsce zbiorki ratownikow po ewakuacji i sposoby oglaszania alarmowego opuszczenia strefy. Zalecane haslo radiowe to okrzyk radiowy \"gesi zer\", a sygnal dzwiekowy to 3 krotkie sygnaly powtarzane az do opuszczenia strefy przez uczestnikow akcji.\n5. MONITOROWANIE STABILNOSCI: wyznacz strazaka do monitorowania stabilnosci uszkodzonej konstrukcji i wskaz mu miejsce, z ktorego bedzie mogl obserwowac elementy budynku do czasu przybycia specjalistycznego sprzetu. Jezeli nie ma tachimetru, wykorzystaj proste techniki obserwacji wzrokowej i nasluchiwania pekniec.\n6. WEJSCIA I WYJSCIA: wyznacz strazaka odpowiedzialnego za monitorowanie wejsc i wyjsc ze strefy. Przy poziomie C uzyj identyfikatorow imiennych lub innego systemu sledzenia, wyznacz osobe odpowiedzialna za stala kontrole liczby osob w strefie i, o ile to mozliwe, stosuj jedno miejsce wejscia i wyjscia.\n7. EWAKUACJA I PODPORY: po wyznaczeniu strefy przeszukaj niezawalona czesc obiektu i ewakuuj ludnosc do bezpiecznej strefy. W razie koniecznosci wykorzystaj podpory niestabilnych czesci obiektu poprzez ich stabilizacje przy uzyciu podporek budowlanych. W przypadku braku takiego sprzetu uznaj to miejsce za niebezpieczne i zakaz zblizania sie do czasu ustabilizowania przez ratownikow SGPR.\n8. EWIDENCJA I NADZOR: zapewnij odpowiednie warunki dla osob ewakuowanych i prowadz ewidencje ewakuowanych, jezeli to mozliwe. Wyznacz przedstawiciela nadzoru budowlanego lub specjaliste od dziedziny budownictwa do porozumienia i okreslenia warunkow bezpiecznego wprowadzenia ratownikow.\n9. CO MOZE POJSC NIE TAK: brak sygnalow z gruzowiska nie oznacza braku osob poszkodowanych w gruzowisku. Jezeli nie masz pewnosci co do liczby osob, czekaj na przybycie SGPR. Sprzet i narzedzia do kontroli stabilnosci nie daja gwarancji bezpieczenstwa dzialan i nie zapobiegaja wtornemu zawaleniu; moga jedynie wspomoc oficera bezpieczenstwa w monitorowaniu i ostrzeganiu ratownikow pracujacych na gruzowisku.\n10. UWAGI OPERACYJNE: po ewakuacji okresl priorytety ratownicze, zaznacz miejsca lokalizacji poszkodowanych i wyznacz miejsce organizacji punktu przyjecia SIS oraz osoby odpowiedzialnej za jego obsluge.","tagi_wspolne":["katastrofa budowlana","zawalenie","strefa zagrozenia","ewakuacja"],"aliasy":["ewakuacja gruzowisko","katastrofa budowlana ewakuacja","strefa zawalenie budynku","wyznacz strefe gruzowisko"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":3,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-BUD-ZABEZPIECZENIE-LOGISTYCZNE-KATASTROFA-BUDOWLANA","kategoria":"organizacja","zrodlo":"Standardowe zasady postepowania podczas katastrofy budowlanej po wystapieniu katastrofy budowlanej, KG PSP","data_aktualizacji":"2020-09-07","slowo_kluczowe":"zabezpieczenie logistyczne katastrofa budowlana","keywords":["logistyka gruzowisko","katastrofa budowlana logistyka","zaplecze katastrofa budowlana"],"prefix":"Katastrofa budowlana - zabezpieczenie logistyczne dzialan.","content":"1. KOD / NAZWA: katastrofa budowlana - zabezpieczenie logistyczne dzialan.\n2. DOJAZD I TEREN AKCJI: bezposrednio po dojezdzie do zdarzenia zapewnij wlasciwe kierowanie ruchem, zachowujac swobodny dostep do strefy zagrozenia, ciezkiego sprzetu burzacego i budowlanego. Zapewnij odpowiednia przestrzen dla terenu akcji i przewiduj duza ilosc SIS oraz srodkow ratowniczych.\n3. ORGANIZACJA ZAPLECZA: wyznacz miejsce do organizacji PPSiS, zadysponuj SDC oraz namiot pneumatyczny z wyposazeniem, wyznacz miejsce oczekiwania SIS do wprowadzenia, miejsca do parkowania pojazdow ratowniczych i innych sluzb wspomagajacych, ladowisko dla smiglowcow LPR, miejsce dla sztabu taktycznego i miejsce do obslugi mediow.\n4. ZABEZPIECZENIE MATERIAŁOWE: wyznacz miejsca do tymczasowej opieki medycznej poszkodowanych, skladowania materialow niezbednych do prowadzenia dzialan, a takze miejsce bezpieczne przy granicy strefy zagrozenia na szybkie uzupelnianie plynow i kalorii przez ratownikow oraz do przekazywania narad dotyczacych dzialan w strefie.\n5. ZABEZPIECZENIE LUDZI: w miejscu oczekiwania SIS zapewnij ratownikom odpowiedni komfort cieplny albo chlodzenie stosownie do warunkow pogodowych. W przypadku upalow zapewnij schronienie przed sloncem i chlodne napoje, a w przypadku niskich temperatur ogrzewane namioty oraz gorace napoje. W porozumieniu z zarzadzaniem kryzysowym zorganizuj wyzywienie w postaci cieplych posilkow po 6 godzinach prowadzonych dzialan oraz zapewnij staly dostep do wody pitnej butelkowanej - minimum 3 litry na osobe na dzien.\n6. CO MOZE POJSC NIE TAK: niewlasciwie zorganizowane zaplecze moze spowolnic rotacje sil, wydluzyc czas wejscia do strefy i pogorszyc warunki bezpieczenstwa ratownikow oraz poszkodowanych.\n7. UWAGI OPERACYJNE: zabezpieczenie logistyczne powinno byc organizowane rownolegle z dzialaniami rozpoznawczymi i ratowniczymi, a jego uklad powinien uwzgledniac mozliwosc dalszej rozbudowy akcji.","tagi_wspolne":["katastrofa budowlana","zawalenie","logistyka"],"aliasy":["logistyka gruzowisko","katastrofa budowlana logistyka","zaplecze katastrofa budowlana"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":7,"sekcja":"Odpowiednia karta SZP katastrofy budowlanej"}]},{"id":"KARTA-CHEM-Z1-LNG-POZAR-ZEW","kategoria":"dzialania","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2025-12","slowo_kluczowe":"pozar zewnetrzny cysterny lng","keywords":["pozar cysterny lng","pozar zewnetrzny lng","ogrzewanie cysterny","pali sie obok cysterny","pozar gazu","cysterna z gazem","bleve lng","chlodzenie cysterny lng","skroplony gaz ziemny"],"prefix":"Karta Z1 - Pozar zewnetrzny podgrzewajacy cysterne LNG bez wycieku gazu.","content":"1. KOD / NAZWA: LNG Z1 - pozar zewnetrzny podgrzewajacy cysterne LNG bez wycieku gazu.\n2. ROZPOZNANIE: dokonaj rozpoznania zza tarczy balistycznej, oceniajac wskazania aparatury oraz widoczne uszkodzenia cysterny.\n3. STREFA: wyznacz strefe ewakuacji dla osob postronnych 1,5 km oraz strefe zagrozenia dla ratownikow 300 m.\n4. SOI: w przekazanej procedurze nie wskazano osobnego zestawu SOI; kluczowe jest prowadzenie rozpoznania zza oslony i utrzymywanie bezpiecznego dystansu.\n5. DZIALANIA KRYTYCZNE: natychmiast rozpocznij intensywne chlodzenie bezobslugowymi pradami wody o wydajnosci co najmniej 10 l/min/m2, ale tylko wtedy, gdy powloka cysterny jest nienaruszona.\n6. PROCEDURA SZCZEGOLOWA: chlodzenie uznaje sie za skuteczne, gdy podawana woda nie odparowuje z powierzchni. Kontroluj temperature plaszcza pirometrem lub kamera termowizyjna. Jezeli widoczne sa uszkodzenia armatury, uszczelnij wyciek przy uzyciu klinow lub wlokniny i wezwij SPOT do przepompowania LNG. Pozar zewnetrzny gas po ustabilizowaniu sytuacji, a po zgasnieciu plomienia kontynuuj chlodzenie cysterny jeszcze przez 10-15 minut.\n7. CO MOZE POJSC NIE TAK: jesli woda odparowuje z powierzchni, widoczne sa odksztalcenia, slychac dudnienie lub syczenie albo zadzialal zawor bezpieczenstwa, oznacza to krytyczny wzrost zagrozenia.\n8. UWAGI OPERACYJNE: w sytuacji krytycznej natychmiast wycofaj ratownikow na bezpieczna odleglosc, pozostawiajac dzialka bezobslugowe.","tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"aliasy":["pozar cysterny lng","pozar zewnetrzny lng","ogrzewanie cysterny","pali sie obok cysterny","pozar gazu","cysterna z gazem","bleve lng","chlodzenie cysterny lng","skroplony gaz ziemny"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":5,"sekcja":"Karta LNG"}]},{"id":"KARTA-CHEM-Z2-LNG-POZAR-STRUM","kategoria":"dzialania","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2025-12","slowo_kluczowe":"pozar strumieniowy lng","keywords":["jet fire","wyciek i pozar lng","pozar zaworu lng","pali sie wyciek lng","ogien z cysterny lng","palnik lng"],"prefix":"Karta Z2 - Pozar strumieniowy z wycieku cysterny LNG (Jet Fire).","content":"1. KOD / NAZWA: LNG Z2 - pozar strumieniowy z wycieku cysterny LNG (Jet Fire).\n2. ROZPOZNANIE: dokonaj rozpoznania zza oslony balistycznej i uwzglednij bardzo silne promieniowanie cieplne, znacznie wyzsze niz przy pozarach benzyny.\n3. STREFA: wyznacz strefe zagrozenia dla ratownikow 300 m.\n4. SOI: stosuj pelne ubranie specjalne z kapturem, ODO i rekawice kriogeniczne.\n5. DZIALANIA KRYTYCZNE: rozstaw kurtyny i prady rozproszone do ograniczenia promieniowania cieplnego oraz prowadz bezobslugowe chlodzenie zbiornika woda z wydajnoscia 10 l/min/m2.\n6. PROCEDURA SZCZEGOLOWA: nie ugaszaj pozaru strumieniowego, jesli nie masz pewnosci, ze odetniesz wyplyw gazu. Nie podawaj wody na zawory bezpieczenstwa ani do wnetrza rozszczelnienia. Prowadz kontrolowane wypalanie ulatniajacego sie gazu i stale kontroluj temperature pozostalej czesci plaszcza.\n7. CO MOZE POJSC NIE TAK: ugaszenie plomienia bez odciecia wyplywu grozi wybuchem chmury. Nieprawidlowe podawanie wody moze podwyzszyc temperature miejsc, ktore same schladzaja sie przez rozprezajacy sie gaz.\n8. UWAGI OPERACYJNE: zwracaj uwage, aby pradem wody nie ogrzewac powierzchni cysterny schladzanej przez wyplywajacy gaz.","tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"aliasy":["jet fire","wyciek i pozar lng","pozar zaworu lng","pali sie wyciek lng","ogien z cysterny lng","palnik lng"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":7,"sekcja":"Karta LNG"}]},{"id":"KARTA-CHEM-Z3-LNG-POZAR-ROZLEWISKA","kategoria":"dzialania","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2025-12","slowo_kluczowe":"pozar rozlewiska lng","keywords":["pool fire","pali sie kaluza lng","rozlane lng plonie","plonacy gaz na ziemi","piana na lng","proszek lng"],"prefix":"Karta Z3 - Pozar rozlewiska skroplonego gazu ziemnego LNG (Pool Fire).","content":"1. KOD / NAZWA: LNG Z3 - pozar rozlewiska skroplonego gazu ziemnego LNG (Pool Fire).\n2. ROZPOZNANIE: rozpoznaj, czy pozar dotyczy samego rozlewiska, czy zagrozone sa tez sasiednie obiekty i korpus cysterny.\n3. STREFA: w przekazanej procedurze nie wskazano jednej liczbowej strefy; kluczowe jest zabezpieczenie otoczenia i kontrola stezen wybuchowych poza widoczna chmura.\n4. SOI: w przekazanej procedurze nie wskazano osobnego zestawu SOI.\n5. DZIALANIA KRYTYCZNE: bezwzglednie nie podawaj wody na rozlewisko LNG. Wode stosuj tylko do schladzania sasiednich obiektow i korpusu cysterny pradami rozproszonymi.\n6. PROCEDURA SZCZEGOLOWA: zalecane jest podanie piany lekkiej 500:1 bezposrednio na rozlewisko z wydajnoscia 10 l/min/m2; podaz uzupelniaj co 1 minute przez 30 sekund. Dopuszczalne jest tez uzycie proszku gasniczego, czesto w kombinacji z piana lekka. Po ewentualnym ugaszeniu monitoruj okolice eksplozymetrem i rozstaw kurtyny wodne.\n7. CO MOZE POJSC NIE TAK: podanie wody bezposrednio na rozlewisko natychmiast spoteguje odparowanie i gwaltownie zwiekszy pozar. Uzycie piany ciezkiej jest zabronione. Ugaszenie rozlewiska proszkiem lub piana wiaze sie z duzym ryzykiem ponownego zaplonu.\n8. UWAGI OPERACYJNE: na powierzchni rozlewiska po podaniu piany lekkiej moze utworzyc sie lod i kominy, co zmniejsza intensywnosc pozaru.","tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"aliasy":["pool fire","pali sie kaluza lng","rozlane lng plonie","plonacy gaz na ziemi","piana na lng","proszek lng"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":8,"sekcja":"Karta LNG"}]},{"id":"KARTA-CHEM-Z4-LNG-WYCIEK","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zakres":"podstawowy","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2026-10-25","slowo_kluczowe":"wyciek lng bez pozaru","keywords":["wyciek lng","gaz ucieka z cysterny","nieszczelna cysterna lng","biala chmura z cysterny","wyciek skroplonego gazu","chmura gazu ziemnego","cieknie lng"],"aliasy":["wyciek lng","gaz ucieka z cysterny","nieszczelna cysterna lng","biala chmura z cysterny","wyciek skroplonego gazu","chmura gazu ziemnego","cieknie lng"],"prefix":"Karta Z4 — wyciek LNG z cysterny bez pożaru.","najpierw":[{"t":"Wyznacz strefę zagrożenia 150 m wokół cysterny lub zbiornika.","str":10},{"t":"Wyeliminuj ze strefy wszystkie źródła zapłonu.","str":10},{"t":"Rozpoznanie prowadź zza osłony tarczy balistycznej.","str":10},{"t":"Sprawiaj kurtyny wodne prostopadle do kierunku wiatru, od strony zawietrznej.","str":10},{"t":"Mierz eksplozymetrem stężenie metanu — także poza widoczną chmurą.","str":10}],"parametry":[{"nazwa":"Strefa zagrożenia","wartosc":"150 m","str":10},{"nazwa":"Bezpieczne stężenie","wartosc":"do 50% DGW = 2,5%","str":10},{"nazwa":"Zakres palności","wartosc":"DGW 5% – GGW 15%","str":10},{"nazwa":"Piana lekka na rozlewisko","wartosc":"500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s","str":10}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Oceń uszkodzenia cysterny.","str":10},{"t":"Odczytaj przyrządy na cysternie: poziomowskaz, ciśnieniomierz, temperaturę fazy ciekłej oraz tabliczkę znamionową.","str":10},{"t":"Uwzględnij warunki meteorologiczne i terenowe.","str":10}]},{"etykieta":"Ograniczenie chmury gazu","punkty":[{"t":"Kurtyny i stacjonarne prądy rozproszone rozcieńczają gaz i tworzą barierę.","str":10},{"t":"Blisko wycieku gaz ściele się nisko; dalej unosi się (powyżej −107°C jest lżejszy od powietrza).","str":10},{"t":"Zorganizuj zaopatrzenie wodne odpowiednie do liczby prądów i kurtyn.","str":10},{"t":"W razie potrzeby rozcieńczaj chmurę wentylatorami w wykonaniu Ex.","str":10}]},{"etykieta":"Pomiary","punkty":[{"t":"Stężenia palne mogą występować na obrzeżach i poza widoczną chmurą.","str":10},{"t":"Sprawdzaj przestrzenie zamknięte i częściowo zamknięte — tam może dojść do wybuchu.","str":10}]},{"etykieta":"Rozlewisko","punkty":[{"t":"Ogranicz odparowanie pianą lekką położoną na powierzchnię wycieku.","str":10},{"t":"Na LNG tworzy się tafla lodu i „kominy lodowe”; piana się degraduje — uzupełniaj ją regularnie.","str":10}]},{"etykieta":"Likwidacja wycieku","punkty":[{"t":"Użyj przycisku awaryjnego — jest po obu stronach cysterny i odcina wypływ, jeśli odbywa się przez zawór.","str":10},{"t":"Zakręć zawór awaryjny.","str":10},{"t":"Uszczelnianie (kołki, kliny, włóknina, opaska dociskowa) to poziom specjalistyczny: sprzęt Ex i ochrona przed cieczami kriogenicznymi, np. rękawice kriogeniczne.","str":11}]},{"etykieta":"Po opanowaniu wycieku","punkty":[{"t":"Spróbuj przepompować LNG do zapasowej cysterny przystosowanej do przewozu LNG — przewodami kriogenicznymi.","str":11}]}],"wsparcie":[{"t":"Uszczelnienie wymaga poziomu specjalistycznego.","str":11},{"t":"Przepompowanie — środki firmy transportowej lub SPOT.","str":11}],"nie_rob":[{"t":"Nie podawaj na rozlewisko wody ani piany ciężkiej — ogrzewają LNG i przyspieszają odparowanie.","str":10},{"t":"Nie uznawaj granicy widocznej chmury za granicę zagrożenia.","str":10}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","wyciek"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":10,"sekcja":"Karta LNG"}],"content":"1. NAJPIERW: Wyznacz strefę zagrożenia 150 m wokół cysterny lub zbiornika. Wyeliminuj ze strefy wszystkie źródła zapłonu. Rozpoznanie prowadź zza osłony tarczy balistycznej. Sprawiaj kurtyny wodne prostopadle do kierunku wiatru, od strony zawietrznej. Mierz eksplozymetrem stężenie metanu — także poza widoczną chmurą.\n2. PARAMETRY: Strefa zagrożenia — 150 m; Bezpieczne stężenie — do 50% DGW = 2,5%; Zakres palności — DGW 5% – GGW 15%; Piana lekka na rozlewisko — 500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s\n3. ROZPOZNANIE: Oceń uszkodzenia cysterny. Odczytaj przyrządy na cysternie: poziomowskaz, ciśnieniomierz, temperaturę fazy ciekłej oraz tabliczkę znamionową. Uwzględnij warunki meteorologiczne i terenowe.\n4. OGRANICZENIE CHMURY GAZU: Kurtyny i stacjonarne prądy rozproszone rozcieńczają gaz i tworzą barierę. Blisko wycieku gaz ściele się nisko; dalej unosi się (powyżej −107°C jest lżejszy od powietrza). Zorganizuj zaopatrzenie wodne odpowiednie do liczby prądów i kurtyn. W razie potrzeby rozcieńczaj chmurę wentylatorami w wykonaniu Ex.\n5. POMIARY: Stężenia palne mogą występować na obrzeżach i poza widoczną chmurą. Sprawdzaj przestrzenie zamknięte i częściowo zamknięte — tam może dojść do wybuchu.\n6. ROZLEWISKO: Ogranicz odparowanie pianą lekką położoną na powierzchnię wycieku. Na LNG tworzy się tafla lodu i „kominy lodowe”; piana się degraduje — uzupełniaj ją regularnie.\n7. LIKWIDACJA WYCIEKU: Użyj przycisku awaryjnego — jest po obu stronach cysterny i odcina wypływ, jeśli odbywa się przez zawór. Zakręć zawór awaryjny. Uszczelnianie (kołki, kliny, włóknina, opaska dociskowa) to poziom specjalistyczny: sprzęt Ex i ochrona przed cieczami kriogenicznymi, np. rękawice kriogeniczne.\n8. PO OPANOWANIU WYCIEKU: Spróbuj przepompować LNG do zapasowej cysterny przystosowanej do przewozu LNG — przewodami kriogenicznymi.\n9. WEZWIJ WSPARCIE, GDY: Uszczelnienie wymaga poziomu specjalistycznego. Przepompowanie — środki firmy transportowej lub SPOT.\n10. NIE RÓB: Nie podawaj na rozlewisko wody ani piany ciężkiej — ogrzewają LNG i przyspieszają odparowanie. Nie uznawaj granicy widocznej chmury za granicę zagrożenia."},{"id":"KARTA-CHEM-Z5-LNG-ZAWORY","kategoria":"dzialania","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2025-12","slowo_kluczowe":"zrzut cisnienia lng","keywords":["gwizda z cysterny","syk z cysterny","wyrzut z zaworu bezpieczenstwa","zawor zrzutowy lng","puszcza cisnienie lng","emisja z zaworow lng","nadcisnienie lng"],"prefix":"Karta Z5 - Emisja gazu LNG przez zawory bezpieczenstwa (Zrzut cisnienia).","content":"1. KOD / NAZWA: LNG Z5 - emisja gazu LNG przez zawory bezpieczenstwa (zrzut cisnienia).\n2. ROZPOZNANIE: sytuacja moze dotyczyc samoczynnego okresowego wzrostu cisnienia, wyrzucanego przez kominy na dachu cysterny. Oceniaj, czy emisja ma charakter typowego zrzutu, czy przechodzi w regularny wyciek.\n3. STREFA: wyznacz strefe 150 m i usun wszystkie zrodla iskrzenia i zaplonu.\n4. SOI: w przekazanej procedurze nie wskazano osobnego zestawu SOI.\n5. DZIALANIA KRYTYCZNE: stale monitoruj atmosfere eksplozymetrem i sprawdz cala cysterne kamera termowizyjna.\n6. PROCEDURA SZCZEGOLOWA: alarmuj przy 2,5% objetosci. Jezeli widoczne jest nagle miejscowe wychlodzenie plaszcza, traktuj to jako oznake rozszczelnienia powloki prozniowej. Jezeli emisja nie ustepuje, wdroz dzialania jak przy regularnym wycieku i przejdz do procedury Z4, stosujac m.in. kurtyny wodne i wentylatory Ex. Jezeli oprocz wyrzutu gazu z zaworu obserwujesz wyciek fazy plynnej, natychmiast wdroz procedure Z4.\n7. CO MOZE POJSC NIE TAK: bledna ocena samoczynnego zrzutu cisnienia jako zjawiska niegroznego moze opoznic wdrozenie procedury wycieku.\n8. UWAGI OPERACYJNE: kluczowe znaczenie ma rozroznienie miedzy okresowym zrzutem cisnienia a utrzymujacym sie wyciekiem gazu lub fazy plynnej.","tagi_wspolne":["lng","gaz skroplony","cysterna lng","zawory","zrzut cisnienia"],"aliasy":["gwizda z cysterny","syk z cysterny","wyrzut z zaworu bezpieczenstwa","zawor zrzutowy lng","puszcza cisnienie lng","emisja z zaworow lng","nadcisnienie lng"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":12,"sekcja":"Karta LNG"}]},{"id":"KARTA-CHEM-ZAKRES-PODSTAWOWY-KDR","kategoria":"dzialania","zrodlo":"KG PSP: Zasady organizacji ratownictwa chemicznego i ekologicznego w KSRG, Warszawa, styczeń 2025 r.; Załącznik nr 11 - Karta graficzna SGRChem; ujednolicony program szkolenia doskonalącego z ratownictwa chemicznego i ekologicznego w zakresie podstawowym.","data_aktualizacji":"2025-01","slowo_kluczowe":"ratownictwo chemiczne zakres podstawowy","keywords":["zdarzenie chemiczne","ratownictwo chemiczno ekologiczne","pierwsze działania chemia","pierwsze działania kdr chemia","zakres podstawowy chemia","nieznana substancja","substancja niebezpieczna","wyciek chemiczny","rozlewisko chemiczne","opary nieznanej substancji","dziwny zapach","beczka z ostrym zapachem","strefa i gorąca","strefa ii chłodna","strefa zagrożenia chemicznego","dekontaminacja wstępna chemia","pomiary chemiczne","sg rchem","sgrchem","sgrchem eko","kurtyna wodna chemia","materiał niebezpieczny","hazmat"],"prefix":"Ratownictwo chemiczne i ekologiczne - pierwsze działania KDR w zakresie podstawowym (KSRG 2025).","content":"1. KOD / NAZWA: ratownictwo chemiczne i ekologiczne - pierwsze działania KDR w zakresie podstawowym.\n2. PRIORYTET I GRANICE DZIAŁAŃ: priorytetem jest ratowanie życia i zdrowia. Zakres wykonywanych czynności zawsze dostosuj do wyszkolenia, kwalifikacji ratowników oraz posiadanego sprzętu. Nie podejmuj czynności specjalistycznych przekraczających realne możliwości zastępów.\n3. ROZPOZNANIE: zbieraj i analizuj informacje już w czasie dojazdu i po przybyciu. Ustal okoliczności zdarzenia, rodzaj środka transportu i jego oznakowanie ADR/RID, numery UN, dokumenty przewozowe, oznakowanie opakowań i zbiorników wg ADR/CLP, oznakowanie butli i rurociągów oraz objawy u osób narażonych. Nie opieraj decyzji na jednej przesłance; potwierdzaj rozpoznanie dostępnymi źródłami i pomiarami.\n4. STREFY: wyznacz i zabezpiecz strefę zagrożenia. Strefa I (gorąca) obejmuje m.in. obszar wstępnie nierozpoznany, zagrożony wybuchem, odłamkowaniem lub nagłym pożarem, obszar z niebezpiecznym stężeniem tlenu albo toksycznych gazów, par lub aerozoli, a także inne obszary wymagające dodatkowych ochron. Strefa II (chłodna) znajduje się poza strefą I i obejmuje również zaplecze logistyczne. Miejsce dekontaminacji organizuj na granicy stref I i II.\n5. MINIMALNY ZAKRES PODSTAWOWY: rozpoznaj i zabezpiecz miejsce zdarzenia; ewakuuj zagrożonych ludzi i zwierzęta poza strefę; ostrzegaj i informuj o zasadach zachowania; prowadź pomiary dostępnymi przyrządami; ograniczaj skutki emisji materiałów niebezpiecznych, w tym z użyciem kurtyn wodnych, oraz skutki wycieków substancji ropopochodnych; prowadź dekontaminację wstępną i KPP; współdziałaj z innymi podmiotami i wspieraj SGRChem.\n6. DEKONTAMINACJA WSTĘPNA: rozpocznij ją możliwie szybko, na granicy stref. Wobec osoby skażonej obejmuje ona ograniczenie skażenia odsłoniętych części ciała, usunięcie i zabezpieczenie skażonej odzieży oraz zastosowanie ubioru zastępczego. Kolejność działań wobec poszkodowanych: wyznaczenie strefy, ewakuacja ze strefy I do miejsca dekontaminacji, segregacja pierwotna, dekontaminacja, KPP i przekazanie zespołom medycznym.\n7. SGRChem I ORGANIZACJA: jeżeli zakres zdarzenia wymaga wsparcia specjalistycznego, zapewnij współdziałanie z SGRChem. Po jej przybyciu przekaż ocenę sytuacji i posiadaną dokumentację, zorganizuj przyjęcie sił i środków, łączność oraz zaplecze logistyczne zgodnie z organizacją działań przyjętą przez KDR.\n8. ZAKOŃCZENIE I PRZEKAZANIE: decyzję o zakończeniu działań podejmuje KDR po likwidacji bezpośredniego zagrożenia. Teren, obiekt lub mienie przekaż właściwemu właścicielowi, zarządcy, użytkownikowi albo uprawnionemu organowi zgodnie z obowiązującą dokumentacją KSRG.\n9. POWIĄZANE KARTY: jeżeli rozpoznasz konkretną substancję lub scenariusz, przejdź do karty szczegółowej, np. NH3/amoniak, HCl/chlorowodór, LNG, acetylen, MSA Altair 4X, podejrzana przesyłka albo procedury radiacyjne R1/R2.\n10. UWAGA: starszy materiał szkoleniowy dołączony do tej karty ma wyłącznie charakter pomocniczy. Wartości liczbowe stref, NDS/NDSCh
