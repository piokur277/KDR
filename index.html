i inne dane z tego materiału nie są podstawą niniejszej karty; pierwszeństwo mają aktualne Zasady KG PSP z 2025 r. oraz bieżące dane właściwe dla konkretnej substancji i zdarzenia.","tagi_wspolne":["ratownictwo chemiczne","ratownictwo ekologiczne","zakres podstawowy","zdarzenie chemiczne","substancja niebezpieczna","strefa zagrożenia","dekontaminacja wstępna","SGRChem"],"aliasy":["chemia","zdarzenie chemiczne","ratownictwo chemiczno ekologiczne","pierwsze działania chemia","pierwsze działania kdr chemia","zakres podstawowy chemia","nieznana substancja","substancja niebezpieczna","wyciek chemiczny","rozlewisko chemiczne","opary nieznanej substancji","dziwny zapach","beczka z ostrym zapachem","strefa chemiczna","strefa zagrożenia chemicznego","dekontaminacja wstępna chemia","pomiary chemiczne","sgrchem","sgrchem eko","hazmat"],"dokumenty_zrodlowe":[{"dokument_id":"doc-chem-eko-zasady-2025-online","strona":9,"sekcja":"Rozdziały 2, 5 i 6 - zakres podstawowy, organizacja działań oraz dekontaminacja (styczeń 2025)"},{"dokument_id":"doc-chem-eko-karta-graficzna-2025-online","strona":2,"sekcja":"Załącznik nr 11 - karta graficzna, zakres podstawowy"},{"dokument_id":"doc-chem-eko-material-szkoleniowy-user","strona":4,"sekcja":"Materiał szkoleniowy pomocniczy - starsze opracowanie; nie stanowi podstawy wartości liczbowych karty 2025"}]},{"id":"KARTA-CHEM-B1-ZAGROZENIE-BIOLOGICZNE-GR3-GR4","kategoria":"dzialania","zrodlo":"Zalacznik nr B.1. Zasady postepowania jednostek organizacyjnych PSP w przypadku podejrzenia zagrozenia chorobami szczegolnie niebezpiecznymi i wysoce zakaznymi","data_aktualizacji":"","slowo_kluczowe":"zagrozenie biologiczne grupa 3","keywords":["zagrozenie biologiczne grupa 4","choroby szczegolnie niebezpieczne","choroby wysoce zakazne","dekontaminacja biologiczna","patogen grupa 3","patogen grupa 4","pis psp biologiczne","odpady biologiczne psp"],"prefix":"Zalacznik B1 - Zasady postepowania PSP przy podejrzeniu zagrozenia chorobami szczegolnie niebezpiecznymi i wysoce zakaznymi.","content":"1. KOD / NAZWA: B1 - postepowanie PSP przy podejrzeniu zagrozenia biologicznego grupy 3 lub 4.\n2. DYSPONOWANIE: do zdarzen z grupa 3 dysponuje sie SGRChem, JRG PSP w zakresie wsparcia i ratownikow medycznych z odpowiednimi uprawnieniami; do grupy 4 dysponuje sie SGRChem posiadajace przeszkolenie i wyposazenie.\n3. NADZOR: nadzor nad dzialaniami prowadzi Panstwowa Inspekcja Sanitarna, ktora ustala z dowodca SGRChem miejsce dekontaminacji, nadzoruje jego przygotowanie, prowadzi imienne listy uczestnikow dzialan i nadzor epidemiologiczny po zakonczeniu akcji.\n4. ROZPOZNANIE: rozpoznanie i ocene miejsca zdarzenia prowadzi PIS we wspolpracy z PSP i Policja, a przygotowanie miejsca dzialan, w tym ciagu dekontaminacyjnego, odbywa sie zgodnie z uzgodnieniami z PIS.\n5. DZIALANIA KRYTYCZNE: zapewnij przeplyw informacji pomiedzy sluzbami, przygotuj miejsce dzialan i ciag dekontaminacyjny zgodnie z decyzjami PIS oraz uwzglednij mozliwosc kwarantanny ratownikow narazonych na kontakt z patogenem grupy 3 lub 4.\n6. PROCEDURA SZCZEGOLOWA: dekontaminacje miejsc wskazanych przez PIS prowadzi sie pod jej nadzorem. Male powierzchnie bez widocznych zanieczyszczen przemywa sie jednorazowymi sciereczkami do dezynfekcji, a pomieszczenia poddaje zamglawianiu. Powierzchnie i pomieszczenia zanieczyszczone materialem biologicznym najpierw oczyszcza sie, potem dezynfekuje, a zebrany material i sprzet po kontakcie pakuje kolejno w dwa czerwone worki, dekontaminuje, umieszcza w twardosciennym pojemniku, oznakowuje i sklada w wyznaczonym miejscu do czasu odbioru. Dla powierzchni otwartych zbiera sie widoczne zanieczyszczenia, pakuje material i nanosi preparat dekontaminacyjny na duze powierzchnie. Prowadzi sie tez dekontaminacje ratownikow, sil i srodkow oraz sprzetu sluzb.\n7. CO MOZE POJSC NIE TAK: brak uzgodnien z PIS, nieprawidlowe zabezpieczenie odpadow lub pominięcie nadzoru epidemiologicznego po akcji.\n8. UWAGI OPERACYJNE: utylizacji podlega wyposazenie jednorazowe, sprzet uszkodzony oraz elementy wskazane przez PIS. Proces zabezpieczania odpadow nadzoruje PIS.","tagi_wspolne":["cbrne","zagrozenie biologiczne","biologia"],"aliasy":["zagrozenie biologiczne grupa 4","choroby szczegolnie niebezpieczne","choroby wysoce zakazne","dekontaminacja biologiczna","patogen grupa 3","patogen grupa 4","pis psp biologiczne","odpady biologiczne psp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-b1-choroby-zakazne","strona":1,"sekcja":"Załącznik B.1"}]},{"id":"KARTA-CHEM-B22-PODEJRZANA-PRZESYLKA-CBR","kategoria":"dzialania","zrodlo":"Zalacznik nr B.2.2. Algorytm postepowania i wspoldzialania w przypadku otrzymania niezidentyfikowanej przesylki, mogacej stanowic zagrozenie chemiczne, biologiczne lub radiacyjne","data_aktualizacji":"","slowo_kluczowe":"podejrzana przesylka","keywords":["niezidentyfikowana przesylka","przesylka chemiczna","przesylka biologiczna","przesylka radiacyjna","brudna bomba","material niezidentyfikowany","algorytm b22","podejrzana paczka","checklista przesylka","checklista podejrzana przesylka","checklista niebezpieczna przesylka","niebezpieczna przesylka checklista"],"prefix":"Zalacznik B2.2 - Algorytm postepowania przy otrzymaniu niezidentyfikowanej przesylki mogacej stanowic zagrozenie chemiczne, biologiczne lub radiacyjne.","content":"1. KOD / NAZWA: B2.2 - postepowanie przy otrzymaniu niezidentyfikowanej przesylki mogacej stanowic zagrozenie chemiczne, biologiczne lub radiacyjne.\n2. ROZPOZNANIE: rozpoznanie przesylki prowadzi Policja lub PSP wedlug wlasciwosci i rownoczesnie powiadamia pozostale sluzby i instytucje zgodnie z potrzebami.\n3. MATERIAL WYBUCHOWY: dzialania prowadzi Policja, transport realizuje Policja, a dalsze postepowanie obejmuje dzialania minersko-pirotechniczne, zniszczenie albo przekazanie probki do CLKP lub LK KWP.\n4. MATERIAL PROMIENIOTWORCZY: dzialania prowadza PSP i Ekipa Dozymetryczna Prezesa PAA, transport realizuje Ekipa Dozymetryczna Prezesa PAA lub ZUOP, a probke przekazuje sie do Ekipy Dozymetrycznej Prezesa PAA.\n5. MATERIAL CHEMICZNY: dzialania prowadza PSP i Policja, transport realizuje PSP lub Policja, a probke przekazuje sie do wlasciwego laboratorium CLKP, LK KWP lub BBK ABW.\n6. MATERIAL BIOLOGICZNY: dzialania prowadza PIS i PSP, transport realizuje PIS albo PSP, a probke przekazuje sie do laboratorium.\n7. BRUDNA BOMBA I MATERIAL NIEZIDENTYFIKOWANY: brudna bombe traktuje sie jako polaczenie urzadzenia wybuchowego z materialem chemicznym, biologicznym lub promieniotworczym i wlacza odpowiednie sluzby. Jezeli material pozostaje niezidentyfikowany, ale wykluczono urzadzenie wybuchowe i material promieniotworczy, dzialania prowadza PSP, PIS oraz wlasciwe laboratorium, a transport probki realizuje PSP.\n8. UWAGI OPERACYJNE: w razie potrzeby do pilotowania pojazdow przewozacych przesylke mozna wykorzystac Policje. Do wyboru laboratorium i organizacji wsparcia wykorzystuje sie zasoby CLKP, LK KWP oraz BBK ABW zgodnie z algorytmem.","tagi_wspolne":["cbrne","podejrzana przesylka"],"aliasy":["niezidentyfikowana przesylka","przesylka chemiczna","przesylka biologiczna","przesylka radiacyjna","brudna bomba","material niezidentyfikowany","algorytm b22","podejrzana paczka","checklista przesylka","checklista podejrzana przesylka","checklista niebezpieczna przesylka","niebezpieczna przesylka checklista"],"dokumenty_zrodlowe":[{"dokument_id":"doc-b22-przesylka","strona":1,"sekcja":"Algorytm B.2.2"},{"dokument_id":"doc-b2-przesylka","strona":1,"sekcja":"Zasady działań PSP - Załącznik B.2"},{"dokument_id":"doc-b21-przesylka","strona":1,"sekcja":"Procedura dla instytucji - Załącznik B.2.1"},{"dokument_id":"doc-checklista-niebezpieczna-przesylka","strona":1,"sekcja":"Checklista - zadania dla pierwszych PSP i rozpoznanie przesyłki"}]},{"id":"KARTA-CHEM-R1-OCHRONA-RADIOLOGICZNA","kategoria":"informacja","zrodlo":"Zalacznik nr R.1. Ochrona radiologiczna oraz dzialania podczas zdarzen radiacyjnych - podstawowe informacje","data_aktualizacji":"","slowo_kluczowe":"zasady ochrony radiologicznej","keywords":["ochrona radiologiczna","informacje o zdarzeniu radiacyjnym","strefa goraca promieniowanie","promieniowanie alfa beta gamma neutronowe","transport materialow promieniotworczych","wskaznik transportowy ti","wzorcowanie dozymetrow","skazenie promieniotworcze","moc dawki"],"prefix":"Zalacznik R1 - Ochrona radiologiczna oraz podstawowe informacje o dzialaniach podczas zdarzen radiacyjnych.","content":"1. KOD / NAZWA: R1 - ochrona radiologiczna oraz podstawowe informacje o dzialaniach podczas zdarzen radiacyjnych.\n2. ROZPOZNANIE ZAGROZENIA: zdarzenie radiacyjne to nietypowa sytuacja zwiazana ze zrodlem promieniowania jonizujacego, wymagajaca pilnych dzialan interwencyjnych w celu ograniczenia skutkow dla ludzi, mienia lub srodowiska.\n3. STREFA: strefa I (goraca) obejmuje teren, na ktorym moze wystepowac skazenie promieniotworcze i/lub moc dawki przekracza 100 uSv/h. Przy skazeniu 1000 Bq/cm2 dla izotopow gamma i beta, 100 Bq/cm2 dla izotopow alfa lub mocy dawki powyzej 100 uSv/h nalezy niezwlocznie usunac osoby poszkodowane i postronne.\n4. RODZAJE PROMIENIOWANIA: promieniowanie alfa jest slabo przenikliwe i stanowi glownie zagrozenie wewnetrzne; beta jest zagrozeniem zewnetrznym i wewnetrznym; gamma jest bardzo przenikliwe i stanowi zagrozenie zewnetrzne i wewnetrzne; neutronowe jest bardzo przenikliwe i stanowi zagrozenie zewnetrzne.\n5. SOI I OCHRONA: podstawowe zasady zmniejszenia narazenia to skrocenie czasu przebywania w poblizu zrodla, zwiekszenie odleglosci i stosowanie odpowiednich oslon. Przy promieniowaniu alfa, beta i gamma nalezy bezwzglednie stosowac filtrujacy sprzet ochrony ukladu oddechowego oraz minimum ubranie specjalne spelniajace PN-EN 469; przy neutronowym minimum ubranie specjalne spelniajace PN-EN 469.\n6. LIMITY NARAZENIA: dawka pochlonieta przez funkcjonariusza podczas dzialan ratowniczych nie moze przekroczyc 1 mSv rocznie; dopuszcza sie przekroczenie do 5 mSv pod warunkiem zachowania sredniej 1 mSv/rok w kolejnych 5 latach.\n7. TRANSPORT I OZNAKOWANIE: w transporcie materialow promieniotworczych pojazd oznakowuje sie tablicami barwy pomaranczowej oraz nalepkami ostrzegawczymi klasy 7D. Sztuki przesylki klasyfikuje sie do kategorii I-BIALA, II-ZOLTA lub III-ZOLTA w zaleznosci od mocy dawki na powierzchni i wskaznika transportowego.\n8. SPRZET I POMIARY: wskaznik transportowy TI to najwyzszy poziom promieniowania zmierzony w odleglosci 1 metra od zewnetrznych powierzchni sztuki przesylki. Sprzet dozymetryczny musi byc wzorcowany przez akredytowane laboratorium co 12 miesiecy bez kontrolnego zrodla albo co 24 miesiace przy kontrolnym zrodle promieniotworczym.\n9. UWAGI OPERACYJNE: karta ma charakter podstawowej informacji ochronnej i sluzy do szybkiego przypomnienia zasad ograniczania narazenia oraz podstaw oznakowania i pomiarow.","tagi_wspolne":["cbrne","radiacja","zdarzenie radiacyjne"],"aliasy":["ochrona radiologiczna","informacje o zdarzeniu radiacyjnym","strefa goraca promieniowanie","promieniowanie alfa beta gamma neutronowe","transport materialow promieniotworczych","wskaznik transportowy ti","wzorcowanie dozymetrow","skazenie promieniotworcze","moc dawki"],"dokumenty_zrodlowe":[{"dokument_id":"doc-r1-radiologia","strona":1,"sekcja":"Ochrona radiologiczna - podstawowe informacje"}]},{"id":"KARTA-CHEM-R2-ZDARZENIA-RADIACYJNE-ZAKRES-PODSTAWOWY","kategoria":"dzialania","zrodlo":"Zalacznik nr R.2. Ochrona radiologiczna oraz dzialania podczas zdarzen radiacyjnych - zakres podstawowy","data_aktualizacji":"","slowo_kluczowe":"dzialania podstawowe zdarzenie radiacyjne","keywords":["zdarzenie radiacyjne zakres podstawowy","promieniowanie zakres podstawowy psp","rozpoznanie radiacyjne","pozar material promieniotworczy","ewidencja dawek promieniowanie","strefa goraca radiacja","r2 radiologiczne","material promieniotworczy psp","pozar materialu promieniotworczego","pozar z materialem promieniotworczym"],"prefix":"Zalacznik R2 - Dzialania podczas zdarzen radiacyjnych w zakresie podstawowym.","content":"1. KOD / NAZWA: R2 - dzialania podczas zdarzen radiacyjnych w zakresie podstawowym.\n2. ROZPOZNANIE: zakres podstawowy KSRG obejmuje weryfikacje zgloszenia na miejscu, wykonanie pomiarow dozymetrycznych, wyznaczenie strefy I, zabezpieczenie instalacji i mediow, ewakuacje i ratowanie ludzi oraz zwierzat, dostosowanie technik i sprzetu do rodzaju zagrozenia oraz prowadzenie dekontaminacji wstepnej.\n3. STREFA: wyznacz strefe I wokol miejsca zdarzenia, a w obiektach za jej granice przyjmij sciany pomieszczenia lub budynku. Wyznacz tez strefe II dla punktu dowodzenia, zbiorki osob ewakuowanych i kwalifikowanej pierwszej pomocy. Minimalny zalecany promien strefy to 3 m, chyba ze pomiary na granicy wskazuja ponad 100 uSv/h - wtedy strefe nalezy powiekszac.\n4. SOI: przy uwolnieniu materialu promieniotworczego stosuj maksymalne srodki ochrony, minimum odziez zgodna z PN-EN 469 oraz filtrujacy sprzet ochrony ukladu oddechowego. Do strefy potencjalnie niebezpiecznej wprowadzaj minimalna liczbe ratownikow.\n5. DZIALANIA KRYTYCZNE: uruchom miernik mocy dawki i dawkomierz indywidualny przed zblizeniem, prowadz rozpoznanie z wiatrem, nie dotykaj ani nie przemieszczaj uszkodzonego pojemnika, wyznacz strefy i ewakuuj ludzi poza obszar narazenia.\n6. PROCEDURA SZCZEGOLOWA: osoby ewakuowane lub poszkodowane, ktore moga byc skazone promieniotworczo, nalezy rozebrac z odziezy, obuwia, bielizny i bizuterii, zabezpieczyc odziez w podwojnym worku i pozostawic w oznakowanym miejscu strefy kontrolowanej. Rejestruj czas przebywania ratownikow w strefie I oraz moc dawki, wykonuj dokumentacje fotograficzna i traktuj odziez oraz sprzet jako potencjalnie skazony odpad promieniotworczy do czasu oceny przez SGRChem. Przy pozarze wyznacz strefe zagrozenia o minimalnym promieniu 30 m; w pomieszczeniach zamknietych wprowadzaj jedna rote, a w obiektach otwartych rozwaz jednego ratownika z asekuracja. Preferuj proszek lub piane srednia/ciezka, a prady rozproszone wody stosuj tylko w szczegolnych przypadkach z bezpiecznej odleglosci.\n7. DAWKI I EWIDENCJA: do oszacowania dawki skutecznej stosuj wzor Dp = D x t, gdzie D jest moca dawki, a t czasem przebywania ratownika w polu promieniowania. Kazdy funkcjonariusz musi posiadac indywidualna karte ewidencyjna narazenia i prowadzic ewidencje dawek w uSv. Przy dawce jednorazowej lub sumarycznej 1000 uSv nalezy wdrozyc procedure medycyny pracy i powiadomien.\n8. CO MOZE POJSC NIE TAK: zbyt bliskie podejscie bez uruchomionego sprzetu dozymetrycznego, ewakuacja w miejsce stacjonowania sil i srodkow, wprowadzenie zbyt licznej obsady do strefy i uzycie zwartych pradow wody przy pozarze materialu promieniotworczego.\n9. UWAGI OPERACYJNE: przy pozarze pojazdu przewozacego materialy promieniotworcze czas pracy ratownika w strefie zagrozenia nie moze przekroczyc 30 minut. Weryfikacji oszacowanej dawki dokonuje dowodca SGRChem.","tagi_wspolne":["cbrne","radiacja","zdarzenie radiacyjne","pozar"],"aliasy":["zdarzenie radiacyjne zakres podstawowy","promieniowanie zakres podstawowy psp","rozpoznanie radiacyjne","pozar material promieniotworczy","ewidencja dawek promieniowanie","strefa goraca radiacja","r2 radiologiczne","material promieniotworczy psp","pozar materialu promieniotworczego","pozar z materialem promieniotworczym"],"dokumenty_zrodlowe":[{"dokument_id":"doc-r2-radiologia","strona":1,"sekcja":"Załącznik R.2 - zakres podstawowy"}]},{"id":"DEZ-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"dezaktywacja samochodu elektrycznego","keywords":["dezaktywacja ev","odlaczenie wysokiego napiecia","jak wylaczyc elektryka","petla ratownicza ev","rozlaczenie baterii trakcyjnej","odciecie 12v","wylaczenie samochodu elektrycznego","dezaktywacja tesli","wylaczenie wysokiego napiecia ev"],"aliasy":["dezaktywacja ev","odlaczenie wysokiego napiecia","jak wylaczyc elektryka","petla ratownicza ev","rozlaczenie baterii trakcyjnej","odciecie 12v","wylaczenie samochodu elektrycznego","dezaktywacja tesli","wylaczenie wysokiego napiecia ev"],"prefix":"Dezaktywacja i zabezpieczenie samochodu elektrycznego lub hybrydowego — kolejność wg SZP KG PSP (2023).","najpierw":[{"t":"Do pełnej identyfikacji zakładaj, że pojazd ma napęd elektryczny.","zr":"SZP EV","str":4},{"t":"Przed zablokowaniem ruchu nie stój przed ani za pojazdem — pracującego silnika elektrycznego nie słychać.","zr":"SZP EV","str":5},{"t":"Pozyskaj kartę ratowniczą modelu (RescueCode, Euro Rescue, Crash Recovery System, kod QR, karta w pojeździe).","zr":"SZP EV","str":3}],"parametry":[{"nazwa":"Napięcie ogniw (DC)","wartosc":"200–950 V","zr":"SZP EV","str":2},{"nazwa":"Napięcie silnika (AC)","wartosc":"400–650 V","zr":"SZP EV","str":2},{"nazwa":"Prąd po wyłączeniu WN","wartosc":"utrzymuje się kilka–kilkanaście minut","zr":"SZP EV","str":7}],"sekcje":[{"etykieta":"Działania obowiązkowe — kolejno","punkty":[{"t":"Zablokuj ruch pojazdu do przodu i do tyłu (kliny); dodatkowo włóż do gniazda niepodłączoną wtyczkę kabla ładowania.","zr":"SZP EV","str":5},{"t":"Gdy świeci „READY” / „POWER ON” — wyłącz silnik przyciskiem lub kluczykiem.","zr":"SZP EV","str":5},{"t":"Ustaw „N” lub „P”, zaciągnij hamulec postojowy.","zr":"SZP EV","str":6},{"t":"Na końcu odłącz akumulator 12 V: najpierw biegun ujemny; zabezpiecz przewody przed zwarciem.","zr":"SZP EV","str":6}]},{"etykieta":"Uwaga przy 12 V","punkty":[{"t":"Za wczesne odłączenie 12 V może uniemożliwić otwarcie drzwi i bagażnika, przesunięcie fotela, kierownicy oraz obsługę hamulca postojowego.","zr":"SZP EV","str":6},{"t":"W niektórych pojazdach odłączenie 12 V nie wyłącza układu WN — pojazd może nadal ruszyć.","zr":"SZP EV","str":6}]},{"etykieta":"Działania alternatywne (wg karty ratowniczej)","punkty":[{"t":"Wyjmij wyłącznik awaryjny WN („zwora”, rozłącznik serwisowy) albo przetnij wskazaną pętlę w dwóch miejscach (wytnij odcinek).","zr":"SZP EV","str":7},{"t":"Przy tej czynności: hełm z opuszczoną przyłbicą i rękawice dielektryczne — ryzyko łuku elektrycznego.","zr":"SZP EV","str":7},{"t":"Jeśli karta ratownicza tak wskazuje — wyjmij bezpiecznik układu WN (może być w kilku miejscach).","zr":"SZP EV","str":8}]},{"etykieta":"Kluczyk lub karta","punkty":[{"t":"Odsuń kluczyk na wskazaną odległość (zwykle 5 m) tylko, gdy karta ratownicza na to pozwala; przy wątpliwościach zaniechaj.","zr":"SZP EV","str":5},{"t":"Bez rozpoznania kluczyka system bezkluczykowy może zamknąć drzwi, szyby lub dach.","zr":"SZP EV","str":5}]}],"nie_rob":[{"t":"Nie utożsamiaj pomarańczowych przewodów WN z pętlą do przecięcia (zwykle czerwona).","zr":"SZP EV","str":7},{"t":"Nie demontuj, nie przecinaj, nie zgniataj elementów WN i akumulatora, nie otwieraj obudowy.","zr":"SZP EV","str":4}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","dezaktywacja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":5,"sekcja":"Dezaktywacja i zabezpieczenie samochodu (s. 5–8)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Do pełnej identyfikacji zakładaj, że pojazd ma napęd elektryczny. Przed zablokowaniem ruchu nie stój przed ani za pojazdem — pracującego silnika elektrycznego nie słychać. Pozyskaj kartę ratowniczą modelu (RescueCode, Euro Rescue, Crash Recovery System, kod QR, karta w pojeździe).\n2. PARAMETRY: Napięcie ogniw (DC) — 200–950 V; Napięcie silnika (AC) — 400–650 V; Prąd po wyłączeniu WN — utrzymuje się kilka–kilkanaście minut\n3. DZIAŁANIA OBOWIĄZKOWE — KOLEJNO: Zablokuj ruch pojazdu do przodu i do tyłu (kliny); dodatkowo włóż do gniazda niepodłączoną wtyczkę kabla ładowania. Gdy świeci „READY” / „POWER ON” — wyłącz silnik przyciskiem lub kluczykiem. Ustaw „N” lub „P”, zaciągnij hamulec postojowy. Na końcu odłącz akumulator 12 V: najpierw biegun ujemny; zabezpiecz przewody przed zwarciem.\n4. UWAGA PRZY 12 V: Za wczesne odłączenie 12 V może uniemożliwić otwarcie drzwi i bagażnika, przesunięcie fotela, kierownicy oraz obsługę hamulca postojowego. W niektórych pojazdach odłączenie 12 V nie wyłącza układu WN — pojazd może nadal ruszyć.\n5. DZIAŁANIA ALTERNATYWNE (WG KARTY RATOWNICZEJ): Wyjmij wyłącznik awaryjny WN („zwora”, rozłącznik serwisowy) albo przetnij wskazaną pętlę w dwóch miejscach (wytnij odcinek). Przy tej czynności: hełm z opuszczoną przyłbicą i rękawice dielektryczne — ryzyko łuku elektrycznego. Jeśli karta ratownicza tak wskazuje — wyjmij bezpiecznik układu WN (może być w kilku miejscach).\n6. KLUCZYK LUB KARTA: Odsuń kluczyk na wskazaną odległość (zwykle 5 m) tylko, gdy karta ratownicza na to pozwala; przy wątpliwościach zaniechaj. Bez rozpoznania kluczyka system bezkluczykowy może zamknąć drzwi, szyby lub dach.\n7. NIE RÓB: Nie utożsamiaj pomarańczowych przewodów WN z pętlą do przecięcia (zwykle czerwona). Nie demontuj, nie przecinaj, nie zgniataj elementów WN i akumulatora, nie otwieraj obudowy."},{"id":"KARTA-PV-INFORMACJE-DODATKOWE","kategoria":"informacje","zrodlo":"Standardowe zasady postepowania podczas zdarzen w obrebie instalacji fotowoltaicznych, KG PSP","data_aktualizacji":"2022-03","slowo_kluczowe":"informacje dodatkowe pv","keywords":["ostroznosc pv","hot stick pv","prad staly pv","moduly pv ostroznosc","bezpieczenstwo fotowoltaika"],"prefix":"Informacje dodatkowe i srodki ostroznosci przy dzialaniach w obrebie instalacji fotowoltaicznych.","content":"1. KOD / NAZWA: instalacja fotowoltaiczna PV - informacje dodatkowe i srodki ostroznosci.\n2. SRODKI OSTROZNOSCI: obowiazuje zakaz wchodzenia i poruszania sie po powierzchni modulow PV.\n3. NAPIECIE DC: po rozlaczeniu napiecia po stronie AC nadal moze wystepowac niebezpieczne napiecie po stronie DC pomiedzy modulami a falownikiem.\n4. ROZLACZANIE MODULOW: jezeli zachodzi koniecznosc rozlaczenia modulow, nalezy uprzednio wylaczyc falownik, w przeciwnym razie w zamknietym obwodzie moze dojsc do powstania luku elektrycznego.\n5. MAGAZYN ENERGII: jezeli instalacja PV wyposazona jest w magazyn energii, nalezy zawsze wylaczac falownik.\n6. OGRANICZENIA SPRZETU: detektor typu Hot Stick nie wykrywa pradu stalego generowanego przez moduly fotowoltaiczne.\n7. OZNACZENIA I PLANOWANIE: informacje o zakonczeniu robot budowlanych polegajacych na instalowaniu urzadzen fotowoltaicznych o mocy powyzej 6,5 kW sa przekazywane do wlasciwych miejscowo KP lub KM PSP miedzy innymi na potrzeby planowania dzialan ratowniczo-gasniczych.\n8. CO MOZE POJSC NIE TAK: dzialania polegajace na zaslanianiu modulow przed promieniowaniem slonecznym, w tym zakrywanie plandekami lub pokrywanie piana sprezona, nie stanowia gwarancji zabezpieczenia przed porazeniem pradem.\n9. UWAGI OPERACYJNE: systemy PV moga pracowac pod napieciem do 1500 V DC, a ryzyko porazenia pradem nalezy traktowac jako jedno z podstawowych zagrozen podczas dzialan w ich obrebie.","tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna"],"aliasy":["ostroznosc pv","hot stick pv","prad staly pv","moduly pv ostroznosc","bezpieczenstwo fotowoltaika"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":16,"sekcja":"Odpowiednia część SZP instalacji PV"}]},{"id":"KARTA-PV-Z1-POZAR","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen w obrebie instalacji fotowoltaicznych, KG PSP","data_aktualizacji":"2022-03","slowo_kluczowe":"pozar fotowoltaiki","keywords":["pozar pv","pozar instalacji pv","gaszenie pv","gaszenie fotowoltaiki","moduly pv pozar","magazyn energii pozar","fotowoltaika plonie"],"prefix":"Karta Z1 - Dzialania ratownicze przy pozarze w obrebie instalacji fotowoltaicznej.","content":"1. KOD / NAZWA: PV Z1 - pozar w obrebie instalacji fotowoltaicznej.\n2. ROZPOZNANIE: ustal, czy podzespoly instalacji PV sa objete pozarem lub bezposrednio zagrozone. Jezeli nie sa, postepuj zgodnie ze standardowa taktyka gaszenia pozarow. Oceniaj stan instalacji i otoczenia, w tym okopcenie modulow, przebarwienia oraz uszkodzenia termiczne zlacz i przewodow.\n3. STREFA: wyznacz strefe zagrozenia i w przypadku bezposredniego zagrozenia zycia przeprowadz natychmiastowa ewakuacje osob znajdujacych sie w obiekcie.\n4. SOI: w sytuacji braku odpowiednich informacji o stanie instalacji PV stosuj srodki ochrony indywidualnej wlasciwe do dzialan przy urzadzeniach pod napieciem oraz sprzet ochrony ukladu oddechowego.\n5. DZIALANIA KRYTYCZNE: ostrzez ratownikow o zagrozeniu, odlacz doplyw pradu elektrycznego do budynku, a jezeli instalacja wyposazona jest w magazyn energii - wylacz falownik. Przystap do redukcji zagrozenia od instalacji zgodnie z karta rozpoznania i dzialan zabezpieczajacych.\n6. PROCEDURA SZCZEGOLOWA: jezeli nie jest to konieczne, nie dotykaj elementow instalacji PV ani innych elementow przewodzacych prad. W przypadku koniecznosci demontazu modulow zachowaj szczegolna ostroznosc i zabezpieczaj luzne zlacza oraz przewody. W razie potrzeby zadysponuj odpowiednie sluzby. Po zakonczeniu dzialan uniemozliw ponowne uruchomienie uszkodzonej instalacji.\n7. GASZENIE POZARU: do gaszenia pozaru lub dzialan w obronie mozna stosowac wode, wode z dodatkami, piane sprezona, proszki gasnicze i gazy gasnicze. Nie nalezy stosowac klasycznej piany ciezkiej, sredniej lub lekkiej. Przy pradzie rozproszonym wody zachowaj minimalny kat rozproszenia 30 stopni i odleglosc 1 m. Przy pradzie zwartym do 250 l/min zachowaj minimum 5 m, a powyzej 250 l/min minimum 10 m. Dla piany CAFS o maksymalnej wydajnosci wodnej 250 l/min zachowaj 1 m dla pradu rozproszonego i 5 m dla pradu zwartego. Dla proszkow i gazow gasniczych zachowaj co najmniej 1 m lub wieksza odleglosc wskazana przez producenta.\n8. MAGAZYN ENERGII: pozary akumulatorow i baterii stanowiacych element magazynu energii wymagaja stosowania srodka gasniczego o dzialaniu chlodzacym, czyli wody. Proszki i gazy gasnicze moga byc w tym przypadku nieskuteczne. Efekty gaszenia kontroluj kamera termowizyjna albo pirometrem, a ugaszone akumulatory i baterie zabezpiecz oraz zalec dozor przez co najmniej 24 godziny ze wzgledu na ryzyko samoistnego nawrotu palenia.\n9. CO MOZE POJSC NIE TAK: detektor typu Hot Stick nie wykrywa pradu stalego generowanego przez moduly PV. Nawet po uszkodzeniu lub przecieciu przewodu fragment od modulow do miejsca przeciecia moze pozostawac pod napieciem.\n10. UWAGI OPERACYJNE: zachowuj minimalne odleglosci podczas podawania srodkow gasniczych od elementow instalacji mogacych znajdowac sie pod napieciem.","tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","pozar"],"aliasy":["pozar pv","pozar instalacji pv","gaszenie pv","gaszenie fotowoltaiki","moduly pv pozar","magazyn energii pozar","fotowoltaika plonie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":12,"sekcja":"Odpowiednia część SZP instalacji PV"}]},{"id":"KARTA-PV-Z2-MIEJSCOWE-ZAGROZENIE","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen w obrebie instalacji fotowoltaicznych, KG PSP","data_aktualizacji":"2022-03","slowo_kluczowe":"miejscowe zagrozenie pv","keywords":["uszkodzona fotowoltaika","uszkodzona instalacja pv","awaria pv","fotowoltaika uszkodzenie","miejscowe zagrozenie fotowoltaika","mechaniczne uszkodzenie pv"],"prefix":"Karta Z2 - Dzialania ratownicze przy miejscowym zagrozeniu w obrebie instalacji fotowoltaicznej.","content":"1. KOD / NAZWA: PV Z2 - miejscowe zagrozenie w obrebie instalacji fotowoltaicznej.\n2. ROZPOZNANIE: okresl stan techniczny instalacji PV na podstawie oznak zewnetrznych oraz ustal zagrozenia ze strony uszkodzonej instalacji. Jezeli instalacja zostala uszkodzona mechanicznie, ocen mozliwosc ewentualnego powstania pozaru.\n3. STREFA: wyznacz strefe zagrozenia i w przypadku bezposredniego zagrozenia zycia przeprowadz natychmiastowa ewakuacje osob znajdujacych sie w obiekcie.\n4. SOI: w sytuacji braku odpowiednich informacji o stanie instalacji PV stosuj srodki ochrony indywidualnej wlasciwe do dzialan przy urzadzeniach pod napieciem.\n5. DZIALANIA KRYTYCZNE: ostrzez ratownikow o wystepujacym zagrozeniu, odlacz doplyw pradu elektrycznego do budynku, a jezeli instalacja PV wyposazona jest w magazyn energii - wylacz falownik. Przystap do redukcji zagrozenia zgodnie z karta rozpoznania i dzialan zabezpieczajacych.\n6. PROCEDURA SZCZEGOLOWA: jezeli nie jest to konieczne, nie dotykaj elementow instalacji PV ani innych elementow przewodzacych prad. W przypadku koniecznosci demontazu modulow zachowaj szczegolna ostroznosc i zabezpieczaj luzne zlacza oraz przewody. W razie potrzeby zadysponuj odpowiednie sluzby. Po zakonczeniu dzialan zapewnij bezpieczne warunki przez uniemozliwienie ponownego uruchomienia uszkodzonej instalacji oraz jej zabezpieczenie.\n7. CO MOZE POJSC NIE TAK: detektor typu Hot Stick nie wykrywa pradu stalego generowanego przez moduly fotowoltaiczne. Uszkodzona mechanicznie instalacja moze stwarzac zagrozenie pojawienia sie napiecia na elementach przewodzacych oraz wtorny pozar.\n8. UWAGI OPERACYJNE: karta dotyczy miejscowego zagrozenia, ale wymaga traktowania instalacji jak potencjalnie znajdujacej sie pod napieciem.","tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","miejscowe zagrozenie","uszkodzenie"],"aliasy":["uszkodzona fotowoltaika","uszkodzona instalacja pv","awaria pv","fotowoltaika uszkodzenie","miejscowe zagrozenie fotowoltaika","mechaniczne uszkodzenie pv"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":14,"sekcja":"Odpowiednia część SZP instalacji PV"}]},{"id":"KARTA-PV-PRZEKAZANIE","kategoria":"organizacja","zrodlo":"Standardowe zasady postepowania podczas zdarzen w obrebie instalacji fotowoltaicznych, KG PSP","data_aktualizacji":"2022-03","slowo_kluczowe":"przekazanie miejsca zdarzenia pv","keywords":["przekazanie fotowoltaika","zakonczenie dzialan pv","uszkodzona instalacja pv po akcji","przekazanie instalacji fotowoltaicznej","dozor magazynu energii","przekazanie pv"],"prefix":"Przekazanie miejsca zdarzenia po dzialaniach w obrebie instalacji fotowoltaicznej.","content":"1. KOD / NAZWA: przekazanie miejsca zdarzenia po dzialaniach w obrebie instalacji fotowoltaicznej.\n2. DOKUMENTACJA: przekaz miejsce zdarzenia zgodnie z obowiazujacymi zasadami, sporzadzajac dokument przekazania terenu, obiektu lub mienia objetego dzialaniem ratowniczym.\n3. INFORMACJA O DZIALANIACH: przekaz osobie przejmujacej informacje o fakcie prowadzenia dzialan ratowniczych w obrebie instalacji PV oraz o potencjalnych zagrozeniach i sposobie postepowania.\n4. ZALECENIA PODSTAWOWE: poinformuj o koniecznosci zachowania bezpiecznej odleglosci oraz zakazie dotykania elementow instalacji PV.\n5. DOZOR: poinformuj o koniecznosci dozoru uszkodzonej instalacji PV do czasu jej sprawdzenia oraz o koniecznosci dozoru magazynow energii, jezeli wystepuja, z uwagi na mozliwosc samoistnego nawrotu palenia.\n6. SPRAWDZENIA I UPRAWNIENIA: zalec sprawdzenie instalacji PV przez firme posiadajaca stosowne uprawnienia w zakresie montazu i serwisowania instalacji PV przed powtornym zalaczeniem zasilania do obiektu. Zalec takze sprawdzenie instalacji elektrycznej w obiekcie przez osobe lub firme posiadajaca stosowne uprawnienia przed przywroceniem zasilania.\n7. DODATKOWE RYZYKA: poinformuj o mozliwosci wycieku elektrolitu z uszkodzonego magazynu energii, jezeli wystepuje.\n8. UTYLIZACJA I ODTWORZENIE: wskaz koniecznosc utylizacji zniszczonego lub uszkodzonego magazynu energii albo modulu PV przez wyspecjalizowana firme oraz koniecznosc ponownego montazu i uruchomienia zdemontowanych elementow przez osobe lub firme posiadajaca stosowne uprawnienia.\n9. CO MOZE POJSC NIE TAK: przedwczesne przywrocenie zasilania lub pozostawienie uszkodzonej instalacji bez dozoru moze doprowadzic do ponownego zagrozenia.\n10. UWAGI OPERACYJNE: przekazanie powinno jednoznacznie wskazywac, ze dzialania byly prowadzone w obrebie instalacji fotowoltaicznej oraz czy w obiekcie wystepuje magazyn energii.","tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","przekazanie"],"aliasy":["przekazanie fotowoltaika","zakonczenie dzialan pv","uszkodzona instalacja pv po akcji","przekazanie instalacji fotowoltaicznej","dozor magazynu energii","przekazanie pv"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":15,"sekcja":"Odpowiednia część SZP instalacji PV"}]},{"id":"KARTA-PV-ROZPOZNANIE-I-ZABEZPIECZENIE","kategoria":"dzialania","zrodlo":"Standardowe zasady postepowania podczas zdarzen w obrebie instalacji fotowoltaicznych, KG PSP","data_aktualizacji":"2022-03","slowo_kluczowe":"rozpoznanie fotowoltaika","keywords":["instalacja pv","rozpoznanie pv","zabezpieczenie pv","falownik pv","magazyn energii pv","moduly fotowoltaiczne"],"prefix":"Rozpoznanie i dzialania zabezpieczajace przy zdarzeniach w obrebie instalacji fotowoltaicznych.","content":"1. KOD / NAZWA: instalacja fotowoltaiczna PV - rozpoznanie i dzialania zabezpieczajace.\n2. ROZPOZNANIE: ustaw pojazdy od strony nawietrznej, zachowujac bezpieczna odleglosc. Pozyskaj od wlasciciela, zarzadcy, personelu lub swiadkow jak najwiecej informacji o instalacji. Sprawdz, czy obiekt jest oznakowany znakiem bezpieczenstwa informujacym o obecnosci instalacji PV.\n3. USTALENIA KLUCZOWE: ustal lokalizacje modulow PV, pozostalych elementow instalacji, skrzynki przylaczeniowej sieci, magazynow energii oraz planu instalacji dla ekip ratowniczych. O ile to mozliwe ustal, w jakie zabezpieczenia wyposazona jest instalacja.\n4. TRASY I TYP INSTALACJI: ustal przebieg tras kablowych pradu stalego DC od modulow do falownika oraz od falownika do rozdzielni. Zweryfikuj, czy na obiekcie jest instalacja PV, a nie instalacja cieczowych kolektorow termicznych.\n5. OCENA USZKODZEN: ocen stan instalacji na podstawie oznak zewnetrznych. Okopcenie modulow, pekniecia, przebarwienia, uszkodzenia termiczne zlacz i przewodow moga swiadczyc o uszkodzeniu i wystepowaniu niebezpiecznego napiecia na metalowych elementach instalacji i budynku.\n6. SOI: podczas rozpoznania i dzialan stosuj srodki ochrony indywidualnej, w tym sprzet elektroizolacyjny, odpowiednio do rodzaju zdarzenia.\n7. DZIALANIA KRYTYCZNE: podejmij probe rozlaczenia doplywu energii elektrycznej do obiektu, uwzgledniajac mozliwosc wystepowania zasilania zapasowego. Jezeli instalacja wyposazona jest w magazyn energii, podejmij probe ustawienia wylacznika glownego falownika w pozycji zero lub Off. Jezeli obiekt ma przeciwpozarowy wylacznik pradu, wykorzystaj go.\n8. PROCEDURA SZCZEGOLOWA: w instalacjach ze stacja transformatorowa podejmij probe kontaktu z dyspozytorem operatora sieci dystrybucyjnej i popros o zdalne odlaczenie zasilania stacji. Co do zasady nie ingeruj w instalacje PV po stronie pradu stalego DC. Jezeli konieczny jest demontaz modulow, stosuj szczegolne srodki ostroznosci, w tym sprzet elektroizolacyjny, dedykowane klucze do rozpinania zlacz oraz zabezpieczaj luzne zlacza i przewody.\n9. CO MOZE POJSC NIE TAK: po odlaczeniu zasilania po stronie AC nadal moze wystepowac wysokie napiecie po stronie DC pomiedzy modulami a rozlacznikiem lub bezpiecznikami. Zaslanianie modulow plandekami albo pokrywanie piana sprezona nie daje gwarancji zabezpieczenia przed porazeniem pradem.\n10. UWAGI OPERACYJNE: nie dotykaj elementow instalacji PV, jezeli nie jest to konieczne. Jezeli jakikolwiek element budynku lub instalacji wykonany jest z materialow przewodzacych prad, zawsze zakladaj, ze moze byc pod napieciem. Detektor typu Hot Stick nie wykrywa pradu stalego generowanego przez moduly fotowoltaiczne.","tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","rozpoznanie"],"aliasy":["instalacja pv","rozpoznanie pv","zabezpieczenie pv","falownik pv","magazyn energii pv","moduly fotowoltaiczne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":8,"sekcja":"Odpowiednia część SZP instalacji PV"}]},{"id":"KARTA-KPP-AMPUTACJA-URAZOWA","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 6","data_aktualizacji":"","slowo_kluczowe":"amputacja urazowa kpp","keywords":["kikut kpp","amputowana czesc ciala kpp","procedura 6 kpp","amputacja czesciowa kpp"],"prefix":"KPP - amputacja urazowa.","content":"1. KOD / NAZWA: Procedura 6 - amputacja urazowa.\n2. START: wykonaj rozpoznanie miejsca zdarzenia oraz sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. AMPUTACJA CZESCIOWA: zaloz opatrunek jalowy zwilzony sola fizjologiczna i unieruchom konczyne.\n4. KIKUT I KRWAWIENIE: jezeli rana krwawi, postepuj zgodnie z procedura 5 dotyczaca ran krwawiacych.\n5. ODNALEZIONA AMPUTOWANA CZESC CIALA: owin ja w sucha gaze jalowa, umiesc w szczelnym worku plastikowym, wycisnij powietrze, a nastepnie umiesc worek w pojemniku wypelnionym zimna woda, w miare mozliwosci z dodatkiem lodu.\n6. PRZEKAZANIE: amputowana czesc ciala powinna zostac przekazana Zespolowi Ratownictwa Medycznego.\n7. UWAGI OPERACYJNE: karta rozroznia amputacje calkowita i czesciowa, ale w obu przypadkach kluczowe jest opanowanie krwawienia i zabezpieczenie amputowanej czesci ciala.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","amputacja","uraz"],"aliasy":["kikut kpp","amputowana czesc ciala kpp","procedura 6 kpp","amputacja czesciowa kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-06","strona":1,"sekcja":"Procedura nr 6 - Amputacja urazowa"}]},{"id":"KARTA-KPP-KOBIETA-W-CIAZY-ZAGROZENIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 19","data_aktualizacji":"","slowo_kluczowe":"kobieta w ciazy kpp","keywords":["ciaza zagrozenie zycia kpp","procedura 19 kpp","resuscytacja ciaza kpp"],"prefix":"KPP - kobieta w widocznej ciazy w stanie zagrozenia zycia lub zdrowia.","content":"1. KOD / NAZWA: Procedura 19 - kobieta w widocznej ciazy w stanie zagrozenia zycia lub zdrowia.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. PRZYTOMNA: uloz poszkodowana w pozycji wygodnej dla niej.\n4. CIALO OBCE W DROGACH ODDECHOWYCH: zachecaj do kaszlu. Jezeli kaszel jest nieefektywny, wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli dalej sa nieefektywne - do 5 ucisniec klatki piersiowej.\n5. URAZOWY MECHANIZM ZDARZENIA LUB WSKAZANIA DO RESUSCYTACJI: uloz poszkodowana na wznak z uniesieniem biodra prawego albo z przesunieciem brzucha w lewa strone. Resuscytacje prowadz w tej pozycji.\n6. NIEPRZYTOMNA BEZ WSKAZAN DO RESUSCYTACJI I BEZ URAZOWEGO MECHANIZMU: uloz poszkodowana na lewym boku.\n7. UWAGI OPERACYJNE: procedura laczy postepowanie urazowe i nieurazowe oraz uwzglednia odrebne ulozenie w czasie resuscytacji.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","kobieta w ciazy"],"aliasy":["ciaza zagrozenie zycia kpp","procedura 19 kpp","resuscytacja ciaza kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-19","strona":1,"sekcja":"Procedura nr 19 - Kobieta w widocznej ciąży w stanie zagrożenia życia lub zdrowia"}]},{"id":"KARTA-KPP-OBRAZENIA-BRZUCHA","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 10","data_aktualizacji":"","slowo_kluczowe":"obrazenia brzucha kpp","keywords":["rana brzucha kpp","wytrzewienie kpp","procedura 10 kpp"],"prefix":"KPP - obrazenia i podejrzenie obrazen brzucha.","content":"1. KOD / NAZWA: Procedura 10 - obrazenia i podejrzenie obrazen brzucha.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. RANA BRZUCHA Z WYTRZEWIENIEM: zaloz wilgotny opatrunek oslaniajacy i przykryj go folia.\n4. RANA BRZUCHA BEZ WYTRZEWIENIA: zaloz opatrunek oslaniajacy.\n5. POZYCJA: uloz poszkodowanego w pozycji lezacej z nogami ugietymi w kolanach.\n6. WYJATEK: jezeli jednoczesnie wystepuja obrazenia miednicy i lub konczyn dolnych, poszkodowanego nalezy ulozyc w pozycji lezacej na plasko.\n7. UWAGI OPERACYJNE: w tej karcie kluczowe jest rozroznienie, czy wystepuje wytrzewienie.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["rana brzucha kpp","wytrzewienie kpp","procedura 10 kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-10","strona":1,"sekcja":"Procedura nr 10 - Obrażenia i podejrzenie obrażeń brzucha"}]},{"id":"KARTA-KPP-OBRAZENIA-GLOWY","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 7","data_aktualizacji":"","slowo_kluczowe":"obrazenia glowy kpp","keywords":["podejrzenie obrazen glowy kpp","procedura 7 kpp","stabilizacja szyjnego kpp"],"prefix":"KPP - obrazenia i podejrzenie obrazen glowy.","content":"1. KOD / NAZWA: Procedura 7 - obrazenia i podejrzenie obrazen glowy.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. STABILIZACJA: zastosuj stabilizacje odcinka szyjnego kregoslupa.\n4. RANA GLOWY: jezeli wystepuje rana glowy, zaloz opatrunek oslaniajacy.\n5. EWAKUACJA: w razie koniecznosci ewakuacji unieruchom poszkodowanego na noszach.\n6. USTAWIENIE NOSZY: podczas ewakuacji nosze nalezy uniesc od strony glowy.\n7. UWAGI OPERACYJNE: karta laczy postepowanie z rana glowy z podejrzeniem obrazen odcinka szyjnego kregoslupa.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["podejrzenie obrazen glowy kpp","procedura 7 kpp","stabilizacja szyjnego kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-07","strona":1,"sekcja":"Procedura nr 7 - Obrażenia i podejrzenie obrażeń głowy"}]},{"id":"KARTA-KPP-OBRAZENIA-KLATKI-PIERSIOWEJ","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 9","data_aktualizacji":"","slowo_kluczowe":"obrazenia klatki piersiowej kpp","keywords":["rana drazaca klatki piersiowej","wiotka klatka piersiowa","procedura 9 kpp"],"prefix":"KPP - obrazenia i podejrzenie obrazen klatki piersiowej.","content":"1. KOD / NAZWA: Procedura 9 - obrazenia i podejrzenie obrazen klatki piersiowej.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. RANA DRAZACA KLATKI PIERSIOWEJ: zaloz opatrunek zastawkowy.\n4. WIOTKA KLATKA PIERSIOWA: zastosuj stabilizacje klatki piersiowej, reczna albo plastrowa.\n5. POZYCJA: uloz poszkodowanego w pozycji polsiedzacej.\n6. WYJATEK: jezeli jednoczesnie podejrzewasz obrazenia glowy lub odcinka szyjnego kregoslupa, a poszkodowany zostal unieruchomiony na noszach i nie wystepuja objawy wstrzasu hipowolemicznego, nosze nalezy uniesc od strony glowy.\n7. UWAGI OPERACYJNE: karta skupia sie na dwoch kluczowych zagrozeniach - ranie drazacej i wiotkiej klatce piersiowej.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["rana drazaca klatki piersiowej","wiotka klatka piersiowa","procedura 9 kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-09","strona":1,"sekcja":"Procedura nr 9 - Obrażenia i podejrzenie obrażeń klatki piersiowej"}]},{"id":"KARTA-KPP-OBRAZENIA-KREGOSLUPA","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 8","data_aktualizacji":"","slowo_kluczowe":"obrazenia kregoslupa kpp","keywords":["podejrzenie obrazen kregoslupa","procedura 8 kpp","stabilizacja kregoslupa kpp"],"prefix":"KPP - obrazenia i podejrzenie obrazen kregoslupa.","content":"1. KOD / NAZWA: Procedura 8 - obrazenia i podejrzenie obrazen kregoslupa.\n2. START: wykonaj rozpoznanie miejsca zdarzenia oraz sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. STABILIZACJA: zastosuj stabilizacje odcinka szyjnego kregoslupa.\n4. BEZ KONIECZNOSCI EWAKUACJI: utrzymuj stabilizacje w pozycji zastanej.\n5. KONIECZNOSC EWAKUACJI: w miare mozliwosci unieruchom poszkodowanego na noszach.\n6. PONOWNA OCENA: po ewakuacji ponownie przeprowadz sekwencje medycznych dzialan ratowniczych.\n7. UWAGI OPERACYJNE: karta rozroznia postepowanie bez koniecznosci ewakuacji i z koniecznoscia ewakuacji.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["podejrzenie obrazen kregoslupa","procedura 8 kpp","stabilizacja kregoslupa kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-08","strona":1,"sekcja":"Procedura nr 8 - Obrażenia i podejrzenie obrażeń kręgosłupa"}]},{"id":"KARTA-KPP-OBRAZENIA-MIEDNICY","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 11","data_aktualizacji":"","slowo_kluczowe":"obrazenia miednicy kpp","keywords":["miednica kpp","procedura 11 kpp","nosze podbierakowe miednica"],"prefix":"KPP - obrazenia i podejrzenie obrazen miednicy.","content":"1. KOD / NAZWA: Procedura 11 - obrazenia i podejrzenie obrazen miednicy.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. STABILIZACJA: rozwaz stabilizacje miednicy.\n4. TRANSPORT NA NOSZACH: preferowane jest uzycie noszy podbierakowych.\n5. JEZELI BRAK NOSZY PODBIERAKOWYCH: zastosuj technike wielu rak.\n6. UNIERUCHOMIENIE: po przeniesieniu unieruchom poszkodowanego na noszach.\n7. UWAGI OPERACYJNE: karta skupia sie na jak najmniej urazowym przeniesieniu i stabilizacji.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["miednica kpp","procedura 11 kpp","nosze podbierakowe miednica"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-11","strona":1,"sekcja":"Procedura nr 11 - Obrażenia i podejrzenie obrażeń miednicy"}]},{"id":"KARTA-KPP-OBRAZENIA-NARZADU-RUCHU","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 12","data_aktualizacji":"","slowo_kluczowe":"obrazenia narzadu ruchu kpp","keywords":["konczyna kpp","zlamanie kpp","procedura 12 kpp","wyciag delikatny kpp"],"prefix":"KPP - obrazenia i podejrzenie obrazen narzadu ruchu.","content":"1. KOD / NAZWA: Procedura 12 - obrazenia i podejrzenie obrazen narzadu ruchu.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. STABILIZACJA WSTEPNA: zastosuj reczna stabilizacje konczyny i ocen odniesione obrazenia.\n4. OCENA DYSTALNA: ocen krazenie i czucie ponizej miejsca uszkodzenia.\n5. ZNIEKSZTALCENIE OBRYSU KONCZYNY: rozwaz zastosowanie delikatnego wyciagu.\n6. OPOR PODCZAS WYCIAGU: jezeli podczas stosowania wyciagu pojawia sie opor, przerwij wyciag i unieruchom konczyne w pozycji zastanej.\n7. RANA: jezeli wystepuje przerwanie ciaglosci skory, zaloz opatrunek jalowy oslaniajacy na rane.\n8. UNIERUCHOMIENIE: jezeli nie ma oporu podczas delikatnego wyciagu i warunki na to pozwalaja, unieruchom konczyne w pozycji zblizonej do fizjologicznej. W przeciwnym razie unieruchom w pozycji zastanej.\n9. PONOWNA OCENA: po unieruchomieniu ponownie ocen krazenie i czucie ponizej miejsca uszkodzenia.\n10. UWAGI OPERACYJNE: karta laczy decyzje dotyczace delikatnego wyciagu, rany i wyboru pozycji unieruchomienia.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"aliasy":["konczyna kpp","zlamanie kpp","procedura 12 kpp","wyciag delikatny kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-12","strona":1,"sekcja":"Procedura nr 12 - Obrażenia i podejrzenie obrażeń narządu ruchu"}]},{"id":"KARTA-KPP-OPARZENIE-CHEMICZNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 14","data_aktualizacji":"","slowo_kluczowe":"oparzenie chemiczne kpp","keywords":["procedura 14 kpp","plynna substancja oparzenie kpp","stala substancja oparzenie kpp"],"prefix":"KPP - oparzenie chemiczne.","content":"1. KOD / NAZWA: Procedura 14 - oparzenie chemiczne.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2. Zwracaj uwage na objawy wychlodzenia.\n3. PIERWSZY KROK: usun skazona odziez i bizuterie z oparzonej powierzchni.\n4. SUBSTANCJA STALA: jezeli to mozliwe, mechanicznie usun substancje z powierzchni skory.\n5. PLYNNA LUB PO USUNIECIU SUBSTANCJI STALEJ: prowadz bezpieczne plukanie biezaca woda do czasu zmniejszenia bolu lub oczyszczenia skory.\n6. OPATRUNEK HYDROZELOWY: jezeli jest dostepny, zastosuj opatrunek hydrozelowy.\n7. JEZELI BRAK OPATRUNKU HYDROZELOWEGO: zaloz suchy jalowy opatrunek.\n8. UWAGI OPERACYJNE: w trakcie plukania i dalszego postepowania stale kontroluj ryzyko wychlodzenia.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","oparzenie"],"aliasy":["procedura 14 kpp","plynna substancja oparzenie kpp","stala substancja oparzenie kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-14","strona":1,"sekcja":"Procedura nr 14 - Oparzenie chemiczne"}]},{"id":"KARTA-KPP-OPARZENIE-TERMICZNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 13","data_aktualizacji":"","slowo_kluczowe":"oparzenie termiczne kpp","keywords":["procedura 13 kpp","hydrozel oparzenie kpp","schladzanie oparzenia kpp"],"prefix":"KPP - oparzenie termiczne.","content":"1. KOD / NAZWA: Procedura 13 - oparzenie termiczne.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2. Zwracaj uwage na objawy wychlodzenia.\n3. PIERWSZY KROK: usun odziez oraz bizuterie z oparzonej powierzchni.\n4. OPATRUNEK HYDROZELOWY: jezeli jest dostepny, zastosuj opatrunek hydrozelowy.\n5. JEZELI BRAK OPATRUNKU HYDROZELOWEGO: schladzaj oparzenie sola fizjologiczna lub czysta woda.\n6. CZAS SCHLADZANIA: przez 5-10 minut, jezeli powierzchnia oparzenia jest ponizej 10% powierzchni ciala, albo przez 1-2 minuty, jezeli powierzchnia oparzenia przekracza 10% powierzchni ciala.\n7. ZAKONCZENIE: zaloz jalowy suchy opatrunek.\n8. UWAGI OPERACYJNE: podczas calego postepowania kontroluj ryzyko wychlodzenia poszkodowanego.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","oparzenie"],"aliasy":["procedura 13 kpp","hydrozel oparzenie kpp","schladzanie oparzenia kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-13","strona":1,"sekcja":"Procedura nr 13 - Oparzenie termiczne"}]},{"id":"KARTA-KPP-RANY","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 5","data_aktualizacji":"","slowo_kluczowe":"rany kpp","keywords":["rana krwawiaca kpp","opaska zaciskowa kpp","procedura 5 kpp","opatrunek uciskowy kpp"],"prefix":"KPP - postepowanie przy ranach.","content":"1. KOD / NAZWA: Procedura 5 - rany.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2, a nastepnie uwidocznij rane.\n3. RANA NIEKRWAWIACA: zaloz opatrunek oslaniajacy.\n4. RANA KRWAWIACA: zaloz opatrunek uciskowy, niezaleznie od tego, czy rana znajduje sie na konczynie, czy w innej okolicy ciala.\n5. JEZELI KRWOTOK NIE USTAJE: zastosuj opaske zaciskowa.\n6. JEZELI BRAK OPASKI ZACISKOWEJ: wykonaj miejscowe ucisniecie rany oraz ucisk na duza tetnice.\n7. DODATKOWO: w miare mozliwosci unieruchom uszkodzona okolice.\n8. UWAGI OPERACYJNE: najwazniejsze jest szybkie rozroznienie, czy rana krwawi, i niezwloczne przejscie do tamowania krwotoku.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","rany","uraz"],"aliasy":["rana krwawiaca kpp","opaska zaciskowa kpp","procedura 5 kpp","opatrunek uciskowy kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-05","strona":1,"sekcja":"Procedura nr 5 - Rany"}]},{"id":"KARTA-KPP-RKO-DOROSLI","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 3","data_aktualizacji":"","slowo_kluczowe":"kpp rko dorosli","keywords":["rko dorosly kpp","zatrzymanie krazenia dorosly","procedura 3 kpp","aed dorosly"],"prefix":"KPP - zatrzymanie krazenia u doroslych.","content":"1. KOD / NAZWA: Procedura 3 - zatrzymanie krazenia u doroslych.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i przejdz przez sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. ROZPOZNANIE: jezeli stwierdzasz brak prawidlowego oddechu, rozpocznij resuscytacje.\n4. RKO: prowadz resuscytacje krazeniowo-oddechowa w schemacie 30:2 albo asynchronicznie, gdy zastosowano wymagany dostepny sprzet nadglosniowy do udroznienia drog oddechowych.\n5. AED: podlacz defibrylator AED i po jego uruchomieniu stosuj sie do polecen urzadzenia.\n6. UWAGI OPERACYJNE: karta dotyczy doroslych i zaklada wykorzystanie dostepnego AED oraz sprzetu nadglosniowego, jesli jest dostepny.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","rko","resuscytacja"],"aliasy":["rko dorosly kpp","zatrzymanie krazenia dorosly","procedura 3 kpp","aed dorosly"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-03","strona":1,"sekcja":"Procedura nr 3 - Zatrzymanie krążenia u dorosłych (RKO)"}]},{"id":"KARTA-KPP-RKO-DZIECI-NIEMOWLETA-NOWORODKI","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 4","data_aktualizacji":"","slowo_kluczowe":"kpp rko dzieci","keywords":["rko niemowle kpp","rko noworodek kpp","procedura 4 kpp","aed dziecko"],"prefix":"KPP - zatrzymanie krazenia u dzieci, niemowlat i noworodkow zaraz po urodzeniu.","content":"1. KOD / NAZWA: Procedura 4 - zatrzymanie krazenia u dzieci, niemowlat i noworodkow zaraz po urodzeniu.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i przejdz przez sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. ROZPOZNANIE: przy braku prawidlowego oddechu wykonaj 5 oddechow ratowniczych.\n4. DZIECI I NIEMOWLETA: jezeli nadal brak oznak zycia, prowadz resuscytacje krazeniowo-oddechowa w schemacie 15:2 albo asynchronicznie, gdy zastosowano wymagany dostepny sprzet nadglosniowy do udroznienia drog oddechowych.\n5. NOWORODKI ZARAZ PO URODZENIU: prowadz resuscytacje krazeniowo-oddechowa w schemacie 3:1.\n6. AED: uzyj AED zgodnie z zaleceniami producenta i po uruchomieniu stosuj sie do polecen urzadzenia.\n7. UWAGI OPERACYJNE: karta rozroznia dzieci i niemowleta od noworodkow bezposrednio po urodzeniu, dla ktorych stosuje sie odrebny schemat ucisniec i oddechow.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","rko","resuscytacja"],"aliasy":["rko niemowle kpp","rko noworodek kpp","procedura 4 kpp","aed dziecko"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-04","strona":1,"sekcja":"Procedura nr 4 - Zatrzymanie krążenia u dzieci i noworodków (RKO)"}]},{"id":"KARTA-KPP-SCHEMAT-BADANIA-ABCDE","kategoria":"dzialania","zrodlo":"ALS Provider Course, Schemat badania ABCDE, strony 1-2","data_aktualizacji":"2026-07-17","slowo_kluczowe":"schemat badania abcde","keywords":["badanie abcde","abcde poszkodowany","ocena abcde","algorytm abcde","abcde kpp","badanie pierwotne abcde"],"prefix":"KPP - schemat badania ABCDE.","content":"1. KOD / NAZWA: Schemat badania ABCDE - szybka i uporządkowana ocena poszkodowanego.\n2. ZASADA NADRZĘDNA: Na każdym etapie rozpoznaj i usuń bezpośrednie zagrożenie życia przed przejściem do następnej litery. Po wykonanej interwencji oceń jej efekt, wróć do początku schematu i wcześnie wezwij dodatkową pomoc.\n3. A - AIRWAY / DROŻNOŚĆ DRÓG ODDECHOWYCH: Oceń, czy poszkodowany mówi i czy drogi oddechowe są drożne. Zwróć uwagę na ciała obce, wydzielinę i nieprawidłowe dźwięki oddechowe. Udrożnij i oczyść drogi oddechowe metodą odpowiednią do sytuacji i posiadanego wyposażenia. Przy urazie zabezpieczaj odcinek szyjny kręgosłupa.\n4. B - BREATHING / ODDYCHANIE: Oceń częstość, głębokość i jakość oddechu, wysiłek oddechowy, symetrię ruchów klatki piersiowej, tor oddechowy, zabarwienie skóry oraz widoczne obrażenia klatki piersiowej. Jeżeli jest dostępny sprzęt, wykonaj pulsoksymetrię i kapnometrię. Wdróż tlenoterapię, wentylację lub zabezpieczenie obrażeń zgodnie ze wskazaniami i zakresem uprawnień.\n5. C - CIRCULATION / KRĄŻENIE: Oceń tętno - jego obecność, częstość i jakość. Oceń kolor, wilgotność i temperaturę skóry, nawrót kapilarny, ciśnienie tętnicze, krwawienia i objawy wstrząsu. Natychmiast tamuj masywne krwotoki. W przypadku zatrzymania krążenia rozpocznij RKO i użyj AED zgodnie z właściwą procedurą.\n6. D - DISABILITY / STAN ŚWIADOMOŚCI I OCENA NEUROLOGICZNA: Oceń świadomość w skali AVPU lub GCS, źrenice, orientację, mowę oraz symetrię siły i ruchów. Zmierz glikemię, jeżeli jest to możliwe i zgodne z zakresem działań. Zwróć uwagę na drgawki, niedowłady i nagłą zmianę zachowania.\n7. E - EXPOSURE / EKSPOZYCJA I OGLĄDANIE: Odsłoń tylko tyle ciała, ile jest konieczne do pełnej oceny. Obejrzyj poszkodowanego z przodu i z tyłu, oceń urazy, wysypki, obrzęki i inne nieprawidłowości. Oceń brzuch oraz temperaturę ciała. Chroń prywatność i natychmiast zapobiegaj wychłodzeniu.\n8. SAMPLE - WYWIAD: S - symptomy, A - alergie, M - medykamenty, P - przebyte choroby, L - ostatni posiłek, E - okoliczności zdarzenia lub początku dolegliwości. Wywiad zbieraj możliwie wcześnie, bez opóźniania działań ratujących życie.\n9. OCENA PONOWNA: Powtarzaj ABCDE po każdej zmianie stanu, wykonanej interwencji, przed przekazaniem poszkodowanego i podczas oczekiwania na ZRM.\n10. UWAGA KOMPETENCYJNA: Dokument źródłowy ALS zawiera także czynności zaawansowane i lekarskie. W ramach KPP wykonuj wyłącznie działania zgodne z posiadanymi kwalifikacjami, obowiązującymi procedurami oraz dostępnym sprzętem.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","ocena poszkodowanego","abcde"],"aliasy":["badanie abcde","abcde poszkodowany","ocena abcde","algorytm abcde","abcde kpp","badanie pierwotne abcde"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-abcde-als","strona":1,"sekcja":"Schemat badania ABCDE - strony 1-2"}]},{"id":"KARTA-KPP-SEKWENCJA-MEDYCZNYCH-DZIALAN-RATOWNICZYCH","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 2","data_aktualizacji":"","slowo_kluczowe":"kpp sekwencja","keywords":["procedura 2 kpp","kpp abc","kpp ocena poszkodowanego","kwalifikowana pierwsza pomoc sekwencja"],"prefix":"KPP - sekwencja medycznych dzialan ratowniczych.","content":"1. KOD / NAZWA: Procedura 2 - sekwencja medycznych dzialan ratowniczych w KPP.\n2. START: ocen ogolne wrazenie i od poczatku zapewniaj wsparcie psychiczne poszkodowanemu.\n3. KROK 1 - RANA KRAWIACA LUB DRGAWKI: jezeli wystepuje rana krwawiaca, przejdz do procedury 5. Jezeli wystepuja drgawki, zabezpiecz poszkodowanego przed obrazeniami wtornymi, szczegolnie glowy.\n4. KROK 2 - SWIADOMOSC: ocen stan swiadomosci.\n5. KROK 3 - DROZNOSC DROG ODDECHOWYCH A: ocen droznosc drog oddechowych i w razie koniecznosci je udroznij, dobierajac sposob udroznienia do mechanizmu zdarzenia.\n6. KROK 4 - ODDECH B: ocen oddech. Jezeli brak prawidlowego oddechu, rozpocznij RKO wedlug procedury 3 lub 4. Jezeli oddech jest obecny, prowadz tlenoterapie wedlug wskazan.\n7. KROK 5 - KRAZENIE C: ocen krazenie.\n8. KROK 6 - WYWIAD I BADANIE: zbierz wywiad ratowniczy oraz ocen poszkodowanego pod katem istniejacych obrazen i dolegliwosci.\n9. KROK 7 - POSTEPOWANIE CELOWANE: wdroz postepowanie adekwatne do dolegliwosci i obrazen stwierdzonych u poszkodowanego.\n10. KROK 8 - WSTRZAS I TERMOIZOLACJA: przy objawach wstrzasu hipowolemicznego uloz poszkodowanego w pozycji lezacej na plasko. Zastosuj termoizolacje.\n11. KROK 9 - PONOWNA OCENA: regularnie oceniaj funkcje zyciowe i dostosowuj postepowanie do aktualnego stanu poszkodowanego.\n12. UWAGI OPERACYJNE: ta karta jest procedura nadrzedna i stanowi punkt wyjscia do kolejnych kart szczegolowych, m.in. RKO, ran, obrazen oraz stanow nieurazowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","sekwencja medyczna"],"aliasy":["procedura 2 kpp","kpp abc","kpp ocena poszkodowanego","kwalifikowana pierwsza pomoc sekwencja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-02","strona":1,"sekcja":"Procedura nr 2 - Sekwencja medycznych działań ratowniczych"}]},{"id":"KARTA-KPP-SEKWENCJA-ZALOZEN-TAKTYCZNYCH","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 1","data_aktualizacji":"","slowo_kluczowe":"kpp taktyczne","keywords":["sekwencja zalozen taktycznych","procedura 1 kpp","rozpoznanie miejsca zdarzenia kpp","kpp dotarcie do poszkodowanego"],"prefix":"KPP - sekwencja zalozen taktycznych w ratownictwie medycznym.","content":"1. KOD / NAZWA: Procedura 1 - sekwencja zalozen taktycznych w ratownictwie medycznym.\n2. PRZYBYCIE NA MIEJSCE: rozpocznij od przybycia na miejsce zdarzenia i wykonania rozpoznania.\n3. ROZPOZNANIE MIEJSCA ZDARZENIA: uwzglednij zabezpieczenie ratownikow, identyfikacje zagrozen, liczbe poszkodowanych, potrzebne dodatkowe sily i srodki oraz mechanizm zdarzenia.\n4. DOTARCIE DO POSZKODOWANEGO: po ocenie sytuacji podejmij probe bezpiecznego dotarcia do poszkodowanego.\n5. DOSTEP LUB EWAKUACJA: jezeli jest to konieczne, wykonaj dostep do poszkodowanego, a nastepnie podejmij medyczne dzialania ratownicze. Jezeli warunki na to pozwalaja, podejmij medyczne dzialania ratownicze i przygotuj poszkodowanego do ewakuacji.\n6. BRAK MOZLIWOSCI DZIALANIA: gdy medyczne dzialania ratownicze nie moga zostac podjete, postepuj zgodnie z zasadami organizacji ratownictwa medycznego w ksrg wskazanymi w zalaczniku nr 10.\n7. MELDUNEK: na kazdym kluczowym etapie zloz meldunek do Kierujacego Dzialaniem Ratowniczym.\n8. UWAGI OPERACYJNE: karta porzadkuje decyzje taktyczne przed rozpoczeciem szczegolowych medycznych dzialan ratowniczych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","zalozenia taktyczne"],"aliasy":["sekwencja zalozen taktycznych","procedura 1 kpp","rozpoznanie miejsca zdarzenia kpp","kpp dotarcie do poszkodowanego"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-01","strona":1,"sekcja":"Procedura nr 1 - Sekwencja założeń taktycznych w ratownictwie medycznym"}]},{"id":"KARTA-KPP-TONIECIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 16","data_aktualizacji":"","slowo_kluczowe":"toniecie kpp","keywords":["procedura 16 kpp","5 oddechow toniecie","wentylacja toniecie kpp"],"prefix":"KPP - toniecie.","content":"1. KOD / NAZWA: Procedura 16 - toniecie.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2. Oceniaj takze obecne objawy wychlodzenia.\n3. TLENOTERAPIA LUB WENTYLACJA: niezwlocznie rozpocznij tlenoterapie albo wentylacje.\n4. ZATRZYMANIE KRAZENIA: jezeli dojdzie do zatrzymania krazenia, RKO rozpoczyna sie od 5 oddechow ratowniczych, a nastepnie przechodzi do ucisniec klatki piersiowej zgodnie z procedura 3 lub 4.\n5. UWAGI OPERACYJNE: w tej procedurze od poczatku nalezy pamietac o wspolistniejacym ryzyku wychlodzenia.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","toniecie"],"aliasy":["procedura 16 kpp","5 oddechow toniecie","wentylacja toniecie kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-16","strona":1,"sekcja":"Procedura nr 16 - Tonięcie"}]},{"id":"KARTA-KPP-WSPARCIE-PSYCHICZNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 20","data_aktualizacji":"","slowo_kluczowe":"wsparcie psychiczne kpp","keywords":["procedura 20 kpp","psychologiczne wsparcie kpp","kontakt z poszkodowanym kpp"],"prefix":"KPP - zasady udzielania wsparcia psychicznego i psychologicznego.","content":"1. KOD / NAZWA: Procedura 20 - zasady udzielania wsparcia psychicznego i psychologicznego osobom uczestniczacym w dzialaniach ratowniczych.\n2. ORGANIZACJA DZIALANIA: rozpoznaj sytuacje i zaplanuj kolejnosc podejmowanych dzialan. Dbaj o bezpieczenstwo wlasne, kolegow i pozostalych uczestnikow. Chron siebie, kolegow i innych przed zbednymi obciazeniami.\n3. KONTAKT Z POSZKODOWANYM: nawiaz i utrzymuj kontakt z osoba poszkodowana. Przedstaw sie z imienia i funkcji, mow spokojnym tonem, utrzymuj kontakt wzrokowy, przed podjeciem dzialania powiedz co zamierzasz zrobic i pomagaj poszkodowanemu zorientowac sie w sytuacji. Poszukaj ostroznego kontaktu dotykowego.\n4. PRYWATNOSC I INFORMACJA: chron prywatnosc osoby poszkodowanej, zaslon ja przed gapiami, udzielaj informacji waznych dla poszkodowanego i nie przekazuj informacji, ktore moga jej zaszkodzic. Unikaj zbednych komentarzy, pochopnych diagnoz i ocen.\n5. WSPARCIE OTOCZENIA: organizuj wsparcie, wykorzystuj obecnosc innych osob, w tym rodziny, przyjaciol, sasiadow i osob bedacych na miejscu zdarzenia. Nie zostawiaj poszkodowanego samego.\n6. POSTAWA RATOWNIKA: obserwuj zachowania ludzi, badz czujny i wrazliwy, zachowaj spokoj i badz zdecydowany w dzialaniu.\n7. UWAGI OPERACYJNE: karta ma charakter wspierajacy i powinna byc stosowana rownolegle z medycznymi dzialaniami ratowniczymi.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","wsparcie psychiczne"],"aliasy":["procedura 20 kpp","psychologiczne wsparcie kpp","kontakt z poszkodowanym kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-20","strona":1,"sekcja":"Procedura nr 20 - Zasady udzielania wsparcia psychicznego i psychologicznego"}]},{"id":"KARTA-KPP-WYCHLODZENIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 17","data_aktualizacji":"","slowo_kluczowe":"wychlodzenie kpp","keywords":["procedura 17 kpp","termoizolacja kpp","ocena oddechu 60 sekund"],"prefix":"KPP - wychlodzenie.","content":"1. KOD / NAZWA: Procedura 17 - wychlodzenie.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych, uwzgledniajac ocene oddechu i tetna przez 60 sekund.\n3. EWAKUACJA: ewakuuj poszkodowanego.\n4. MOKRA ODZIEZ: usun mokre elementy odziezy przez rozciecie oraz osusz skore, nie narazajac dodatkowo poszkodowanego na wychlodzenie i ruch.\n5. TERMOIZOLACJA: zastosuj termoizolacje.\n6. POZYCJA: uloz poszkodowanego w pozycji poziomej.\n7. UWAGI OPERACYJNE: w procedurze podkreslono ostrozne obchodzenie sie z poszkodowanym i wydluzona ocene funkcji zyciowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","wychlodzenie"],"aliasy":["procedura 17 kpp","termoizolacja kpp","ocena oddechu 60 sekund"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-17","strona":1,"sekcja":"Procedura nr 17 - Wychłodzenie"}]},{"id":"KARTA-KPP-STANY-NIEURAZOWE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 18","data_aktualizacji":"","slowo_kluczowe":"stany nieurazowe kpp","keywords":["zaburzenia krazeniowo oddechowe kpp","cialo obce kpp","procedura 18 kpp","pozycja polsiedzaca kpp"],"prefix":"KPP - zaburzenia krazeniowo-oddechowe w stanach nieurazowych.","content":"1. KOD / NAZWA: Procedura 18 - zaburzenia krazeniowo-oddechowe w stanach nieurazowych.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. BOL BRZUCHA: uloz poszkodowanego w pozycji lezacej z nogami ugietymi w kolanach.\n4. BOL W KLATCE PIERSIOWEJ LUB DUSZNOSC: uloz poszkodowanego w pozycji polsiedzacej.\n5. UTRATA SWIADOMOSCI: uloz poszkodowanego w pozycji bocznej ustalonej, czyli bezpiecznej.\n6. CIALO OBCE W DROGACH ODDECHOWYCH: najpierw zachecaj do kaszlu.\n7. KASZEL NIEEFEKTYWNY U DOROSLYCH I DZIECI: wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli sa nieefektywne - do 5 ucisniec nadbrzusza.\n8. KASZEL NIEEFEKTYWNY U NIEMOWLAT: wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli sa nieefektywne - do 5 ucisniec klatki piersiowej.\n9. UWAGI OPERACYJNE: karta laczy postepowanie w kilku typowych stanach nieurazowych i zawiera uproszczony schemat przy ciele obcym w drogach oddechowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","stany nieurazowe"],"aliasy":["zaburzenia krazeniowo oddechowe kpp","cialo obce kpp","procedura 18 kpp","pozycja polsiedzaca kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-18","strona":1,"sekcja":"Procedura nr 18 - Zaburzenia krążeniowo-oddechowe w stanach nieurazowych"}]},{"id":"KARTA-KPP-ZATRUCIE-WZIEWNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 15","data_aktualizacji":"","slowo_kluczowe":"zatrucie wziewne kpp","keywords":["procedura 15 kpp","ewakuacja ze strefy zagrozenia kpp","5 oddechow zatrucie wziewne"],"prefix":"KPP - zatrucie wziewne.","content":"1. KOD / NAZWA: Procedura 15 - zatrucie wziewne.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. EWAKUACJA: ewakuuj poszkodowanego ze strefy zagrozenia, w miare mozliwosci z izolacja drog oddechowych.\n4. ODDECH: prowadz stala kontrole oddechu.\n5. TLENOTERAPIA LUB WENTYLACJA: niezwlocznie rozpocznij tlenoterapie albo wentylacje.\n6. ZATRZYMANIE KRAZENIA: jezeli dojdzie do zatrzymania krazenia, RKO rozpoczyna sie od 5 oddechow ratowniczych, a nastepnie przechodzi do ucisniec klatki piersiowej zgodnie z procedura 3 lub 4.\n7. UWAGI OPERACYJNE: dokument wskazuje rowniez rozwazenie mozliwosci uzycia dostepnego sprzetu nadglosniowego do udroznienia drog oddechowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","zatrucie","zatrucie wziewne"],"aliasy":["procedura 15 kpp","ewakuacja ze strefy zagrozenia kpp","5 oddechow zatrucie wziewne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-15","strona":1,"sekcja":"Procedura nr 15 - Zatrucie wziewne"}]},{"id":"KARTA-LOT-BSP-POCHODZENIA-MILITARNEGO","kategoria":"dzialania","zrodlo":"Załącznik nr 1: Wytyczne podczas zdarzeń z bezzałogowymi statkami powietrznymi pochodzenia militarnego - materiał przekazany przez użytkownika","data_aktualizacji":"2026-07-22","status_zrodla":"materiał przekazany w postaci dwóch fotografii; na przekazanych stronach brak widocznej daty i oznaczenia organu wydającego","slowo_kluczowe":"dron militarny","keywords":["bsp pochodzenia militarnego","bezzałogowy statek powietrzny militarny","dron wojskowy","znaleziony dron wojskowy","rozbity dron wojskowy","obiekt pochodzenia militarnego","dron z materiałami wybuchowymi","strefa 150 metrów dron","nie dotykaj drona militarnego","mz lotnicze dron"],"prefix":"BSP pochodzenia militarnego - zabezpieczenie miejsca zdarzenia, rozpoznanie z dystansu i przekazanie służbie właściwej.","content":"1. KOD / NAZWA: zdarzenie z bezzałogowym statkiem powietrznym (BSP) o możliwym pochodzeniu militarnym.\n2. STANOWISKO KIEROWANIA: każde zgłoszenie niezwłocznie przekaż do nadrzędnego stanowiska kierowania PSP. W SWD PSP oznacz zdarzenie flagą „Do wiadomości KG” i przypisz podrodzaj „MZ - Lotnicze”.\n3. ZAŁOŻENIE WSTĘPNE: jeżeli jednostka ochrony przeciwpożarowej jest pierwszą służbą na miejscu, przyjmij, że obiekt może mieć charakter militarny, zawierać materiały wybuchowe i system autodestrukcji, np. zapalnik czasowy.\n4. ZASADA BEZWZGLĘDNA: nie dotykaj, nie ruszaj, nie przenoś. Wyklucz jakąkolwiek manipulację, poruszanie i demontaż elementów. Zgodnie z wytycznymi również użycie telefonu komórkowego w bezpośrednim sąsiedztwie może spowodować detonację.\n5. INNE ZAGROŻENIA: uwzględnij możliwość występowania bojowych środków trujących lub innych substancji niebezpiecznych dla życia i zdrowia ludzi.\n6. BEZPIECZNY DYSTANS: gdy nie ma bezpośredniego zagrożenia życia i zdrowia osób postronnych, ratownicy nie powinni zbliżać się do obiektu. Stosuj zasadę: „Jeżeli Ty widzisz bombę - bomba widzi Ciebie”.\n7. STREFA I EWAKUACJA: niezwłocznie wyznacz strefę niebezpieczną o promieniu co najmniej 150 m od obiektu i ewakuuj osoby z tego obszaru.\n8. ROZPOZNANIE: prowadź wyłącznie z bezpiecznej odległości, korzystając z lornetki, lunety, kamery z przybliżeniem, telefonu z funkcją zoom lub BSP będącego na wyposażeniu jednostki ochrony przeciwpożarowej.\n9. DOKUMENTACJA: zdjęcia i materiały wideo wykonuj wyłącznie w celach służbowych. Przekazuj je tylko przez służbową pocztę elektroniczną. Nie publikuj ani nie wysyłaj przez media społecznościowe, prywatne komunikatory lub inne nieautoryzowane kanały.\n10. PRZEKAZANIE MIEJSCA: po przybyciu Policji lub przedstawicieli Sił Zbrojnych RP jednostki ochrony przeciwpożarowej przestają pełnić rolę służby wiodącej. Formalnie przekaż miejsce zdarzenia właściwemu organowi.\n11. RATOWANIE ŻYCIA: nadrzędnym priorytetem pozostaje ratowanie życia i zdrowia ludzi. Przy bezpośrednim zagrożeniu osób poszkodowanych wytyczne dopuszczają działania wykraczające poza ramowy schemat, z zachowaniem wszelkich możliwych środków ostrożności. Przy zbliżaniu korzystaj w miarę możliwości z naturalnych osłon albo dostępnych tarcz balistycznych.\n12. UWAGA ORGANIZACYJNA: wytyczne mogą być doprecyzowane i rozszerzone na poziomie wojewódzkim lub powiatowym, stosownie do lokalnych procedur i dostępnych sił oraz środków.\n13. UWAGA ŹRÓDŁOWA: na przekazanych stronach nie ma widocznej daty ani oznaczenia organu wydającego. Przed wykorzystaniem operacyjnym należy potwierdzić obowiązywanie materiału oraz lokalne doprecyzowania.","tagi_wspolne":["bsp militarny","dron wojskowy","zagrożenie wybuchowe","mz lotnicze","strefa niebezpieczna 150 m"],"aliasy":["bsp pochodzenia militarnego","bezzałogowy statek powietrzny militarny","dron wojskowy","znaleziony dron wojskowy","rozbity dron wojskowy","obiekt pochodzenia militarnego","dron z materiałami wybuchowymi","strefa 150 metrów dron","nie dotykaj drona militarnego","mz lotnicze dron"],"dokumenty_zrodlowe":[{"dokument_id":"doc-bsp-pochodzenia-militarnego","strona":1,"sekcja":"Wytyczne podczas zdarzeń z BSP pochodzenia militarnego - strony 1-2"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-04-LEKI_HIGIENA","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Przygotuj siebie i najbliższych; Poradnik bezpieczeństwa - Higiena w kryzysie; Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc leki i higiena na kryzys","keywords":["apteczka i leki na 72 godziny","środki higieny podczas kryzysu","dokumentacja medyczna i alergie kryzys"],"prefix":"OLiOC - grudzień: leki, zdrowie i higiena w domowych zapasach.","content":"1. Zgromadź stale przyjmowane leki, podstawową apteczkę oraz listę dawkowania, chorób i alergii.\n2. Dokumentację medyczną i recepty przechowuj w jednym miejscu, dostępnym dla zaufanej osoby.\n3. Przygotuj środki higieny osobistej, dezynfekcji, rękawiczki, papier, worki i artykuły menstruacyjne.\n4. Uwzględnij okulary, baterie do aparatów słuchowych, sensory, sprzęt stomijny i inne urządzenia wspomagające.\n5. Kontroluj temperaturę oraz warunki przechowywania leków; nie używaj produktów po terminie.\n6. Nie gromadź leków na receptę bez uzgodnienia z lekarzem lub farmaceutą.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","leki","higiena","zdrowie"],"aliasy":["apteczka i leki na 72 godziny","środki higieny podczas kryzysu","dokumentacja medyczna i alergie kryzys"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-przygotuj-siebie","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-higiena","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-06-ROTACJA_ZAPASOW","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Plan na kryzys; Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout)","slowo_kluczowe":"olioc kontrola i rotacja zapasów","keywords":["jak sprawdzać domowe zapasy kryzysowe","terminy ważności zapasów 72 godziny","lista kontrolna zestawu awaryjnego"],"prefix":"OLiOC - grudzień: przechowywanie, kontrola i rotacja zapasów.","content":"1. Sporządź listę zapasów z ilością, miejscem przechowywania i terminem ważności.\n2. Kontroluj zestaw co najmniej dwa razy w roku oraz po każdym użyciu.\n3. Produkty z najkrótszym terminem zużywaj na co dzień i od razu zastępuj nowymi.\n4. Sprawdzaj baterie, powerbanki, latarki, radio, gaśnicę, czujki i stan pojemników.\n5. Przechowuj zapasy w suchym, chłodnym miejscu, zabezpieczonym przed dziećmi, wilgocią i szkodnikami.\n6. Raz w roku przeprowadź rodzinny trening 24 godzin z ograniczonym dostępem do prądu, wody i internetu.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","rotacja zapasów","lista kontrolna"],"aliasy":["jak sprawdzać domowe zapasy kryzysowe","terminy ważności zapasów 72 godziny","lista kontrolna zestawu awaryjnego"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-05-SZCZEGOLNE_POTRZEBY_ZAPASY","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Osoby potrzebujące szczególnej pomocy; Poradnik bezpieczeństwa - Zadbaj o zwierzęta","slowo_kluczowe":"olioc zapasy dla dzieci seniorów zwierząt","keywords":["specjalne potrzeby zapasy kryzysowe","żywność niemowlęca i pieluchy kryzys","karma leki zwierzęta 72 godziny"],"prefix":"OLiOC - grudzień: zapasy dla dzieci, seniorów, osób zależnych i zwierząt.","content":"1. Dla niemowląt przygotuj żywność, wodę do jej przygotowania, pieluchy, środki pielęgnacji i ubrania.\n2. Dla seniorów i osób chorych uwzględnij leki, dietę, baterie, sprzęt pomocniczy i plan transportu.\n3. Przygotuj kartę z kontaktem do opiekuna i najważniejszymi informacjami medycznymi.\n4. Dla zwierząt przygotuj karmę, wodę, leki, transporter, smycz, dokumentację i dane właściciela.\n5. Zapasy i plecak osoby zależnej omów z nią oraz z opiekunem - nie zakładaj potrzeb bez konsultacji.\n6. Powiadom zaufane osoby, gdzie znajdują się zapasy i jak udzielić wsparcia.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","dzieci","seniorzy","zwierzęta","szczególne potrzeby"],"aliasy":["specjalne potrzeby zapasy kryzysowe","żywność niemowlęca i pieluchy kryzys","karma leki zwierzęta 72 godziny"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-szczegolna-pomoc","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-zwierzeta","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-02-ZAPAS_WODY","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout); Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc zapas wody 3 litry","keywords":["ile wody na osobę na dobę kryzys","woda na 72 godziny","przechowywanie wody awaryjnej"],"prefix":"OLiOC - grudzień: zapas wody dla rodziny.","content":"1. Przygotuj co najmniej 3 litry wody na osobę na każdą dobę, czyli minimum 9 litrów na 72 godziny.\n2. Dodaj wodę dla zwierząt oraz większy zapas przy upałach, chorobach i szczególnych potrzebach.\n3. Przechowuj wodę w szczelnych, czystych pojemnikach przeznaczonych do żywności, z dala od słońca i chemikaliów.\n4. Oznacz datę zakupu lub napełnienia i stosuj rotację zgodnie z terminem producenta.\n5. Oddziel wodę pitną od wody technicznej do mycia i spłukiwania.\n6. Po komunikacie o skażeniu lub zakazie spożycia korzystaj wyłącznie ze źródeł wskazanych przez władze i sanepid.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","zapas wody","woda na kryzys"],"aliasy":["ile wody na osobę na dobę kryzys","woda na 72 godziny","przechowywanie wody awaryjnej"],
