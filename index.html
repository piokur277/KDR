cydujesz o liczbie odcinków bojowych. Koordynuj czynności podstawowe i specjalistyczne z innymi podmiotami i służbami na miejscu zdarzenia.\n4. CO ROBI SGRT (POZIOM A I B): Wszystkie zadania zakresu podstawowego oraz rozpoznanie i identyfikację zagrożenia. Wyznacza i oznakowuje strefę zagrożenia. Włącza lub wyłącza instalacje, urządzenia i media wpływające na bezpieczeństwo — zaworami i bezpiecznikami instalacji obiektu. Priorytetowo wykonuje dostęp do poszkodowanych, KPP lub ewakuację oraz drogi ewakuacji. Stabilizuje, tnie, rozpiera, podnosi i przenosi konstrukcje, urządzenia i przeszkody. Oświetla i zabezpiecza miejsce zdarzenia; ocenia rozmiar zagrożenia i prognozuje jego rozwój. Poziom C wspiera grupy A i B dodatkowym sprzętem, w szczególności żurawiem samojezdnym.\n5. DOWODZENIE NA ODCINKU SGRT: Dowódca działań SGRT odpowiada za zadanie, które mu powierzysz. Dowódca działań SGRT decyduje o technikach, zakresie działań, użyciu sprzętu grupy i zadaniach jej członków. Po przybyciu ocenia: rodzaj zagrożenia i wyniki rozpoznania, zabezpieczenie miejsca, KPP i ewakuację poszkodowanych, potrzebne siły i środki, sposób dotarcia. Udział podmiotów spoza KSRG (np. firmy z ciężkim sprzętem) — tylko w porozumieniu z dowódcą działań SGRT; on nadzoruje bezpieczeństwo tych osób. Zabezpieczenie medyczne: gotowość do podjęcia medycznych działań ratowniczych.\n6. ZAKOŃCZENIE: Decyzję o zakończeniu podejmuje KDR — dopiero po likwidacji bezpośredniego zagrożenia. Teren, obiekt lub mienie przekaż na podstawie „Potwierdzenia przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.\n7. WEZWIJ WSPARCIE, GDY: Dowódca działań SGRT wnioskuje o powiększenie składu lub kolejną grupę. Ratujesz życie — przy dysponowaniu uwzględnij najszybszy transport grupy. Przebieg akcji tego wymaga — rozważ zabezpieczenie medyczne działań.\n8. NIE RÓB: Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów. Nie dopuszczaj do obsługi urządzeń osób bez uprawnień wymaganych przepisami o dozorze technicznym. Nie kończ działań SGRT przed likwidacją bezpośredniego zagrożenia."},{"id":"KARTA-RT-ZDARZENIA-NA-DROGACH","wzorzec":2,"kategoria":"dzialania","grupa":"rt","zrodlo":"KG PSP: Zasady postępowania jednostek ochrony przeciwpożarowej w związku ze zdarzeniami na drogach, Warszawa, listopad 2012","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zdarzenia na drogach","keywords":["zdarzenie na drodze","współpraca z zarządcą drogi","zarządca drogi","przekazanie terenu zarządcy drogi","odmowa przejęcia terenu","plama oleju na jezdni","zabezpieczenie i oznakowanie miejsca zdarzenia","kto sprząta drogę po wypadku","gddkia"],"aliasy":["zdarzenie na drodze","współpraca z zarządcą drogi","zarządca drogi","przekazanie terenu zarządcy drogi","odmowa przejęcia terenu","plama oleju na jezdni","zabezpieczenie i oznakowanie miejsca zdarzenia","kto sprząta drogę po wypadku","gddkia"],"prefix":"Zdarzenia na drogach — tryb działania KDR wobec zarządcy drogi i Policji, przekazanie terenu (Zasady KG PSP 2012).","najpierw":[{"t":"W rozpoznaniu wstępnym zidentyfikuj zagrożenia dla życia, zdrowia, środowiska i mienia.","zr":"Zasady 2012","str":9},{"t":"Ustal: czy na miejscu są zarządca drogi, Policja lub straż gminna oraz czy potrzebne są działania ratownicze, czy tylko zabezpieczenie i oznakowanie.","zr":"Zasady 2012","str":10},{"t":"Każdą decyzję — także o powrocie do miejsca stacjonowania — zgłoś do SK KP/KM PSP.","zr":"Zasady 2012","str":10}],"parametry":[{"nazwa":"Są służby + działania ratownicze","wartosc":"prowadź działania ratownicze (gaszenie, RT, RChem/REko, KPP)","zr":"Zasady 2012","str":10},{"nazwa":"Są służby + tylko zabezpieczenie","wartosc":"wskaż, że to zadanie zarządcy drogi lub Policji; poinformuj SK; wracaj","zr":"Zasady 2012","str":10},{"nazwa":"Brak służb + działania ratownicze","wartosc":"prowadź działania; SK wzywa zarządcę drogi lub Policję","zr":"Zasady 2012","str":11},{"nazwa":"Brak służb + tylko zabezpieczenie","wartosc":"ostrzeż użytkowników drogi; SK wzywa zarządcę drogi lub Policję","zr":"Zasady 2012","str":11},{"nazwa":"Nic nie jest potrzebne","wartosc":"poinformuj SK; wracaj","zr":"Zasady 2012","str":11}],"sekcje":[{"etykieta":"Kto za co odpowiada","punkty":[{"t":"KDR może wstrzymać ruch drogowy i zakazać przebywania osób w rejonie działań.","zr":"Zasady 2012","str":6},{"t":"Przejezdność drogi zapewnia zarządca drogi; PSP nie wykonuje robót porządkowych ani utrzymaniowych.","zr":"Zasady 2012","str":7},{"t":"Substancja zagraża życiu, zdrowiu lub środowisku — to ratownictwo chemiczne lub ekologiczne PSP; usuwanie odpadów tylko dla bezpieczeństwa ruchu — zarządca drogi.","zr":"Zasady 2012","str":7},{"t":"Policja: kieruje ruchem, usuwa pojazdy utrudniające akcję, wprowadza ograniczenia i objazdy.","zr":"Zasady 2012","str":7},{"t":"Zarządca drogi: zamyka drogi, wyznacza objazdy, wykonuje roboty interwencyjne; jest posiadaczem odpadów w pasie drogowym.","zr":"Zasady 2012","str":8},{"t":"Zarządcy: krajowe i autostrady — GDDKiA (lub spółka); wojewódzkie — zarząd województwa; powiatowe — zarząd powiatu; gminne — wójt, burmistrz lub prezydent; w miastach na prawach powiatu (poza A i S) — prezydent miasta.","zr":"Zasady 2012","str":8}]},{"etykieta":"Pomoc innym podmiotom","punkty":[{"t":"Możesz użyć sił do pomocy innym podmiotom na miejscu — poinformuj SK; jeśli prowadzono działania ratownicze, najpierw przekaż teren.","zr":"Zasady 2012","str":11},{"t":"Pomoc nie może obniżyć gotowości operacyjnej powiatu — np. zostaw tylko część sił albo wnioskuj o OSP.","zr":"Zasady 2012","str":11},{"t":"Siły pozostawione do pomocy SK może w każdej chwili zadysponować.","zr":"Zasady 2012","str":12}]},{"etykieta":"Przekazanie terenu","punkty":[{"t":"Po działaniach przekaż teren właścicielowi, zarządcy, przedstawicielowi administracji, Policji lub straży gminnej; gdy ich brak — zgłoś to do SK.","zr":"Zasady 2012","str":12},{"t":"Jest przedstawiciel zarządcy drogi — przekaż teren jemu.","zr":"Zasady 2012","str":12},{"t":"Gdy było tylko zabezpieczenie i oznakowanie — przekazanie następuje z chwilą przybycia odpowiedzialnych za bezpieczeństwo ruchu.","zr":"Zasady 2012","str":12}]},{"etykieta":"Odmowa przejęcia terenu","punkty":[{"t":"Zgłoś odmowę do SK i odnotuj ją w informacji ze zdarzenia.","zr":"Zasady 2012","str":12},{"t":"Teren bez zagrożeń — wracasz; teren może stwarzać zagrożenia — dalszy tryb ustalasz z SK (ewentualnie z PCZK lub WCZK).","zr":"Zasady 2012","str":13},{"t":"SK wzywa kolejno: zarządcę drogi, Policję, pozostałe podmioty.","zr":"Zasady 2012","str":13},{"t":"Zarządca odmawia przybycia przy zagrożeniu ruchu — SK informuje go o odpowiedzialności z art. 72 Kodeksu wykroczeń.","zr":"Zasady 2012","str":15}]}],"nie_rob":[{"t":"Nie wykonuj robót porządkowych ani utrzymaniowych drogi — to zadanie zarządcy drogi.","zr":"Zasady 2012","str":7},{"t":"Nie pozostawiaj sił do pomocy innym podmiotom kosztem gotowości operacyjnej powiatu.","zr":"Zasady 2012","str":11}],"tagi_wspolne":["ratownictwo techniczne","zdarzenia drogowe"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zasady-drogi-2012","strona":9,"sekcja":"Kompetencje (s. 6–9), tryb KDR (s. 9–12), przekazanie terenu (s. 12–13), informacje dodatkowe (s. 15)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: W rozpoznaniu wstępnym zidentyfikuj zagrożenia dla życia, zdrowia, środowiska i mienia. Ustal: czy na miejscu są zarządca drogi, Policja lub straż gminna oraz czy potrzebne są działania ratownicze, czy tylko zabezpieczenie i oznakowanie. Każdą decyzję — także o powrocie do miejsca stacjonowania — zgłoś do SK KP/KM PSP.\n2. PARAMETRY: Są służby + działania ratownicze — prowadź działania ratownicze (gaszenie, RT, RChem/REko, KPP); Są służby + tylko zabezpieczenie — wskaż, że to zadanie zarządcy drogi lub Policji; poinformuj SK; wracaj; Brak służb + działania ratownicze — prowadź działania; SK wzywa zarządcę drogi lub Policję; Brak służb + tylko zabezpieczenie — ostrzeż użytkowników drogi; SK wzywa zarządcę drogi lub Policję; Nic nie jest potrzebne — poinformuj SK; wracaj\n3. KTO ZA CO ODPOWIADA: KDR może wstrzymać ruch drogowy i zakazać przebywania osób w rejonie działań. Przejezdność drogi zapewnia zarządca drogi; PSP nie wykonuje robót porządkowych ani utrzymaniowych. Substancja zagraża życiu, zdrowiu lub środowisku — to ratownictwo chemiczne lub ekologiczne PSP; usuwanie odpadów tylko dla bezpieczeństwa ruchu — zarządca drogi. Policja: kieruje ruchem, usuwa pojazdy utrudniające akcję, wprowadza ograniczenia i objazdy. Zarządca drogi: zamyka drogi, wyznacza objazdy, wykonuje roboty interwencyjne; jest posiadaczem odpadów w pasie drogowym. Zarządcy: krajowe i autostrady — GDDKiA (lub spółka); wojewódzkie — zarząd województwa; powiatowe — zarząd powiatu; gminne — wójt, burmistrz lub prezydent; w miastach na prawach powiatu (poza A i S) — prezydent miasta.\n4. POMOC INNYM PODMIOTOM: Możesz użyć sił do pomocy innym podmiotom na miejscu — poinformuj SK; jeśli prowadzono działania ratownicze, najpierw przekaż teren. Pomoc nie może obniżyć gotowości operacyjnej powiatu — np. zostaw tylko część sił albo wnioskuj o OSP. Siły pozostawione do pomocy SK może w każdej chwili zadysponować.\n5. PRZEKAZANIE TERENU: Po działaniach przekaż teren właścicielowi, zarządcy, przedstawicielowi administracji, Policji lub straży gminnej; gdy ich brak — zgłoś to do SK. Jest przedstawiciel zarządcy drogi — przekaż teren jemu. Gdy było tylko zabezpieczenie i oznakowanie — przekazanie następuje z chwilą przybycia odpowiedzialnych za bezpieczeństwo ruchu.\n6. ODMOWA PRZEJĘCIA TERENU: Zgłoś odmowę do SK i odnotuj ją w informacji ze zdarzenia. Teren bez zagrożeń — wracasz; teren może stwarzać zagrożenia — dalszy tryb ustalasz z SK (ewentualnie z PCZK lub WCZK). SK wzywa kolejno: zarządcę drogi, Policję, pozostałe podmioty. Zarządca odmawia przybycia przy zagrożeniu ruchu — SK informuje go o odpowiedzialności z art. 72 Kodeksu wykroczeń.\n7. NIE RÓB: Nie wykonuj robót porządkowych ani utrzymaniowych drogi — to zadanie zarządcy drogi. Nie pozostawiaj sił do pomocy innym podmiotom kosztem gotowości operacyjnej powiatu."},{"id":"KARTA-WOD-WSPOLPRACA-SGRWN-SGS","wzorzec":2,"kategoria":"dzialania","grupa":"wod","zrodlo":"KG PSP: Zasady organizacji ratownictwa wodno-nurkowego w KSRG, Warszawa, 12.08.2026 (zastępują zasady ratownictwa wodnego z 2020 r.)","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wspolpraca kdr z sgrw-n","keywords":["sgrw-n","grupa wodno-nurkowa","nurkowie psp","sgs","grupa sonarowa","sonar","wypadek nurkowy"],"aliasy":["sgrw-n","grupa wodno-nurkowa","nurkowie psp","sgs","grupa sonarowa","sonar","wypadek nurkowy"],"prefix":"Współpraca KDR ze specjalistyczną grupą wodno-nurkową (SGRW-N) i sonarową (SGS) — poziomy, zadania KDR, dowodzenie (Zasady KG PSP 2026).","najpierw":[{"t":"Przed przybyciem SGRW-N: rozpoznanie, oznakowanie miejsca zdarzenia na wodzie, wskazanie miejsca wodowania łodzi.","zr":"RW-N 2026","str":45},{"t":"Zapewnij grupie strefę pracy i dostęp do akwenu; nadzoruj bezpieczeństwo miejsca do jej przybycia.","zr":"RW-N 2026","str":45},{"t":"Przy ratowaniu życia SK uwzględnia najszybszy transport grupy (także lotniczy).","zr":"RW-N 2026","str":61},{"t":"SGRW-N i SGS tworzą odrębny odcinek bojowy.","zr":"RW-N 2026","str":60}],"parametry":[{"nazwa":"Status działań ratowniczych","wartosc":"człowiek pod wodą bez dostępu powietrza do 120 min; później — działania wspomagające (niepilne)","zr":"RW-N 2026","str":60},{"nazwa":"SGRW-N poziom A","wartosc":"ratowanie życia: tonący, wypadki na wodzie, pod lodem · min. 2 ratowników + kierowca · niezwłocznie","zr":"RW-N 2026","str":16},{"nazwa":"SGRW-N AB / ABC / ABCchem","wartosc":"+ ratownictwo techniczne pod wodą, lokalizacja obiektów · ABC: min. 5 ratowników, ≤ 60 min · ABCchem: wody skażone","zr":"RW-N 2026","str":16},{"nazwa":"SGS","wartosc":"A — sonar holowany · B — sonar dookólny, naprowadzanie nurka · C — pojazd podwodny ROV · min. 3 ratowników","zr":"RW-N 2026","str":17}],"sekcje":[{"etykieta":"Dowodzenie","punkty":[{"t":"Pracami podwodnymi przy ratowaniu życia kieruje dowodzący działaniami SGRW-N (DDR), podległy KDR poziomu taktycznego.","zr":"RW-N 2026","str":60},{"t":"Kilka SGRW-N na jednym odcinku — dowodzi nurek o najwyższych kwalifikacjach; przy równych kwalifikacjach wyznacza go KDR.","zr":"RW-N 2026","str":62},{"t":"DDR SGRW-N analizuje ryzyko i decyduje o podjęciu lub odstąpieniu od prac podwodnych; może powiększyć skład lub zgłosić potrzebę kolejnej grupy.","zr":"RW-N 2026","str":62},{"t":"Prace ratownicze: min. 2 młodszych nurków; jeden pełni funkcję DDR lub nurka asekuracyjnego.","zr":"RW-N 2026","str":62}]},{"etykieta":"Po upływie czasu ratowniczego","punkty":[{"t":"Gdy działania nurkowe tracą status ratowniczych — KDR uzyskuje od SK, które dysponowało grupę, zgodę na kontynuację jako poszukiwawczych.","zr":"RW-N 2026","str":61}]},{"etykieta":"Wypadek nurkowy","punkty":[{"t":"Zabezpieczenie medyczne prac podwodnych: zestaw R-1, min. 1500 l tlenu, AED.","zr":"RW-N 2026","str":63},{"t":"O transporcie do komory dekompresyjnej decyduje kierownik ZRM; przy transporcie lotniczym lądowisko przygotowuje KDR.","zr":"RW-N 2026","str":63},{"t":"Konsultacje: Krajowy Ośrodek Medycyny Hiperbarycznej w Gdyni, tel. całodobowy (58) 622 51 63.","zr":"RW-N 2026","str":63}]}],"tagi_wspolne":["ratownictwo wodne","SGRW-N"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rwn-2026","strona":15,"sekcja":"Część 3 — SGRW-N i SGS (s. 15–19), zał. 2 (s. 45), zał. 11 — prace podwodne (s. 60–63)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Przed przybyciem SGRW-N: rozpoznanie, oznakowanie miejsca zdarzenia na wodzie, wskazanie miejsca wodowania łodzi. Zapewnij grupie strefę pracy i dostęp do akwenu; nadzoruj bezpieczeństwo miejsca do jej przybycia. Przy ratowaniu życia SK uwzględnia najszybszy transport grupy (także lotniczy). SGRW-N i SGS tworzą odrębny odcinek bojowy.\n2. PARAMETRY: Status działań ratowniczych — człowiek pod wodą bez dostępu powietrza do 120 min; później — działania wspomagające (niepilne); SGRW-N poziom A — ratowanie życia: tonący, wypadki na wodzie, pod lodem · min. 2 ratowników + kierowca · niezwłocznie; SGRW-N AB / ABC / ABCchem — + ratownictwo techniczne pod wodą, lokalizacja obiektów · ABC: min. 5 ratowników, ≤ 60 min · ABCchem: wody skażone; SGS — A — sonar holowany · B — sonar dookólny, naprowadzanie nurka · C — pojazd podwodny ROV · min. 3 ratowników\n3. DOWODZENIE: Pracami podwodnymi przy ratowaniu życia kieruje dowodzący działaniami SGRW-N (DDR), podległy KDR poziomu taktycznego. Kilka SGRW-N na jednym odcinku — dowodzi nurek o najwyższych kwalifikacjach; przy równych kwalifikacjach wyznacza go KDR. DDR SGRW-N analizuje ryzyko i decyduje o podjęciu lub odstąpieniu od prac podwodnych; może powiększyć skład lub zgłosić potrzebę kolejnej grupy. Prace ratownicze: min. 2 młodszych nurków; jeden pełni funkcję DDR lub nurka asekuracyjnego.\n4. PO UPŁYWIE CZASU RATOWNICZEGO: Gdy działania nurkowe tracą status ratowniczych — KDR uzyskuje od SK, które dysponowało grupę, zgodę na kontynuację jako poszukiwawczych.\n5. WYPADEK NURKOWY: Zabezpieczenie medyczne prac podwodnych: zestaw R-1, min. 1500 l tlenu, AED. O transporcie do komory dekompresyjnej decyduje kierownik ZRM; przy transporcie lotniczym lądowisko przygotowuje KDR. Konsultacje: Krajowy Ośrodek Medycyny Hiperbarycznej w Gdyni, tel. całodobowy (58) 622 51 63."},{"id":"KARTA-WOD-ZAKRES-PODSTAWOWY","wzorzec":2,"kategoria":"dzialania","grupa":"wod","zrodlo":"KG PSP: Zasady organizacji ratownictwa wodno-nurkowego w KSRG, Warszawa, 12.08.2026 (zastępują zasady ratownictwa wodnego z 2020 r.)","data_aktualizacji":"2026-10-27","slowo_kluczowe":"ratownictwo wodne zakres podstawowy","keywords":["ratownictwo lodowe","tonący","człowiek pod lodem","załamanie lodu","ratownictwo powodziowe","woda szybkopłynąca","nurkowanie na wstrzymanym oddechu"],"aliasy":["ratownictwo lodowe","tonący","człowiek pod lodem","załamanie lodu","ratownictwo powodziowe","woda szybkopłynąca","nurkowanie na wstrzymanym oddechu"],"prefix":"Ratownictwo wodne i lodowe — zakres podstawowy JRG i OSP oraz zasady bezpieczeństwa ratowników (Zasady KG PSP 2026).","najpierw":[{"t":"Ratownik na lodzie: suchy skafander, urządzenie wypornościowe, kask, lina asekuracyjna zamocowana trwale; zabiera sprzęt do ratownictwa lodowego.","zr":"RW-N 2026","str":44},{"t":"Ratownik w wodzie: suchy lub neoprenowy skafander, urządzenie wypornościowe (albo boja SP / pas „węgorz”), asekuracja liną z brzegu lub łodzi.","zr":"RW-N 2026","str":44},{"t":"Każdy na wodzie, przy brzegu, na łodzi i na lodzie: środek wypornościowy, sygnalizacja wizualna lub dźwiękowa, nóż ratowniczy.","zr":"RW-N 2026","str":43},{"t":"Oznacz miejsce działań; w miarę możliwości powiadom właściciela drogi wodnej.","zr":"RW-N 2026","str":43}],"parametry":[{"nazwa":"Kto realizuje","wartosc":"wszystkie JRG PSP; OSP wytypowane i spełniające standardy","zr":"RW-N 2026","str":9},{"nazwa":"Gotowość","wartosc":"min. 6 ratowników, w tym ≥ 2 z kwalifikacjami ratownictwa wodnego; wyposażenie osobiste dla ≥ 2","zr":"RW-N 2026","str":9},{"nazwa":"Szczególne warunki","wartosc":"noc, zła pogoda, prąd > 0,5 m/s, przestrzenie zamknięte — sprzęt i łączność odpowiednie do zagrożeń","zr":"RW-N 2026","str":43},{"nazwa":"Lina asekuracyjna na lodzie","wartosc":"mocowana na brzegu, na lodzie nośnym (śruba lodowa) albo do sań lodowych lub trapu","zr":"RW-N 2026","str":44}],"sekcje":[{"etykieta":"Zadania zakresu podstawowego","punkty":[{"t":"Rozpoznanie i ocena zagrożenia dla życia, zdrowia, mienia i środowiska.","zr":"RW-N 2026","str":9},{"t":"Pomoc tonącym (także na lodzie) i ludziom na wodach powodziowych: dotarcie, ewakuacja ze strefy, medyczne działania ratownicze, przekazanie ZRM.","zr":"RW-N 2026","str":9},{"t":"Asekuracja ratowników działających na wodzie, lodzie i na brzegu; ewakuacja zwierząt; ograniczanie zagrożeń dla środowiska wodnego.","zr":"RW-N 2026","str":10},{"t":"Na morzu działania prowadzi i koordynuje Morska Służba Poszukiwania i Ratownictwa (SAR) — KSRG wspiera na wezwanie.","zr":"RW-N 2026","str":10}]},{"etykieta":"Bezpieczeństwo w wodzie","punkty":[{"t":"Na rzekach ratownik w wodzie zakłada kask; w wodzie szybkopłynącej i powodziowej — obowiązkowo urządzenie wypornościowe.","zr":"RW-N 2026","str":44},{"t":"Łódź: środki wypornościowe dla każdej osoby; za bezpieczeństwo łodzi i osób odpowiada prowadzący jednostkę.","zr":"RW-N 2026","str":43},{"t":"Przy powodzi zapewnij oświetlenie terenu, sprzęt nawigacyjny, łączność, rezerwę suchej odzieży, odpoczynek i zmiany strażaków.","zr":"RW-N 2026","str":43}]},{"etykieta":"Nurkowanie na wstrzymanym oddechu","punkty":[{"t":"Tylko ratownik przeszkolony, na wodzie bez lodu, bez ryzyka uwięzienia, z liną asekuracyjną i boją SP / pasem „węgorz”.","zr":"RW-N 2026","str":45},{"t":"Przerwij przy wyczerpaniu ratownika, gdy głębokość przekracza jego możliwości albo gdy KDR lub ratownik oceni zagrożenie życia.","zr":"RW-N 2026","str":45}]}],"wsparcie":[{"t":"Potrzebny nurek, sonar lub działania pod wodą — karta „Współpraca KDR z SGRW-N i SGS”.","zr":"RW-N 2026","str":45}],"nie_rob":[{"t":"Nie wykonuj zadań samowolnie ani bez wymaganych zabezpieczeń.","zr":"RW-N 2026","str":43},{"t":"Nie nurkuj na wstrzymanym oddechu pod lodem.","zr":"RW-N 2026","str":45}],"tagi_wspolne":["ratownictwo wodne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rwn-2026","strona":9,"sekcja":"Część 2 (s. 9–14), zał. 2 — zasady bezpieczeństwa (s. 43–45)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ratownik na lodzie: suchy skafander, urządzenie wypornościowe, kask, lina asekuracyjna zamocowana trwale; zabiera sprzęt do ratownictwa lodowego. Ratownik w wodzie: suchy lub neoprenowy skafander, urządzenie wypornościowe (albo boja SP / pas „węgorz”), asekuracja liną z brzegu lub łodzi. Każdy na wodzie, przy brzegu, na łodzi i na lodzie: środek wypornościowy, sygnalizacja wizualna lub dźwiękowa, nóż ratowniczy. Oznacz miejsce działań; w miarę możliwości powiadom właściciela drogi wodnej.\n2. PARAMETRY: Kto realizuje — wszystkie JRG PSP; OSP wytypowane i spełniające standardy; Gotowość — min. 6 ratowników, w tym ≥ 2 z kwalifikacjami ratownictwa wodnego; wyposażenie osobiste dla ≥ 2; Szczególne warunki — noc, zła pogoda, prąd > 0,5 m/s, przestrzenie zamknięte — sprzęt i łączność odpowiednie do zagrożeń; Lina asekuracyjna na lodzie — mocowana na brzegu, na lodzie nośnym (śruba lodowa) albo do sań lodowych lub trapu\n3. ZADANIA ZAKRESU PODSTAWOWEGO: Rozpoznanie i ocena zagrożenia dla życia, zdrowia, mienia i środowiska. Pomoc tonącym (także na lodzie) i ludziom na wodach powodziowych: dotarcie, ewakuacja ze strefy, medyczne działania ratownicze, przekazanie ZRM. Asekuracja ratowników działających na wodzie, lodzie i na brzegu; ewakuacja zwierząt; ograniczanie zagrożeń dla środowiska wodnego. Na morzu działania prowadzi i koordynuje Morska Służba Poszukiwania i Ratownictwa (SAR) — KSRG wspiera na wezwanie.\n4. BEZPIECZEŃSTWO W WODZIE: Na rzekach ratownik w wodzie zakłada kask; w wodzie szybkopłynącej i powodziowej — obowiązkowo urządzenie wypornościowe. Łódź: środki wypornościowe dla każdej osoby; za bezpieczeństwo łodzi i osób odpowiada prowadzący jednostkę. Przy powodzi zapewnij oświetlenie terenu, sprzęt nawigacyjny, łączność, rezerwę suchej odzieży, odpoczynek i zmiany strażaków.\n5. NURKOWANIE NA WSTRZYMANYM ODDECHU: Tylko ratownik przeszkolony, na wodzie bez lodu, bez ryzyka uwięzienia, z liną asekuracyjną i boją SP / pasem „węgorz”. Przerwij przy wyczerpaniu ratownika, gdy głębokość przekracza jego możliwości albo gdy KDR lub ratownik oceni zagrożenie życia.\n6. WEZWIJ WSPARCIE, GDY: Potrzebny nurek, sonar lub działania pod wodą — karta „Współpraca KDR z SGRW-N i SGS”.\n7. NIE RÓB: Nie wykonuj zadań samowolnie ani bez wymaganych zabezpieczeń. Nie nurkuj na wstrzymanym oddechu pod lodem."},{"id":"WYP-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wypadek samochodu elektrycznego","keywords":["wypadek ev","kolizja ev","samochod elektryczny po wypadku","auto elektryczne po dachowaniu","zderzenie auta elektrycznego","rozbity elektryk","uszkodzony pojazd elektryczny","kolizja samochodu elektrycznego","wypadek tesli","uszkodzona bateria trakcyjna po kolizji"],"aliasy":["wypadek ev","kolizja ev","samochod elektryczny po wypadku","auto elektryczne po dachowaniu","zderzenie auta elektrycznego","rozbity elektryk","uszkodzony pojazd elektryczny","kolizja samochodu elektrycznego","wypadek tesli","uszkodzona bateria trakcyjna po kolizji"],"prefix":"Wypadek komunikacyjny samochodu elektrycznego lub hybrydowego — karta Z1 SZP KG PSP (2023).","najpierw":[{"t":"Ustaw pojazdy ratownicze tak, by zabezpieczyć miejsce działań; wyznacz strefę zagrożenia.","zr":"SZP EV","str":9},{"t":"Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast.","zr":"SZP EV","str":9},{"t":"Brak pewności co do napędu = zakładaj instalację wysokiego napięcia.","zr":"SZP EV","str":9},{"t":"Załóż, że automatyczna dezaktywacja (poduszki, napinacze) nie zadziałała — wykonaj ją ręcznie (karta „Dezaktywacja”).","zr":"SZP EV","str":9},{"t":"Przygotuj linię gaśniczą lub gaśnicę oraz kamerę termowizyjną lub pirometr.","zr":"SZP EV","str":9}],"parametry":[{"nazwa":"Chłodzenie akumulatora","wartosc":"> 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar","zr":"SZP EV","str":10},{"nazwa":"Kontrola po chłodzeniu","wartosc":"30 min; ponów przy wzroście temperatury","zr":"SZP EV","str":10}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Duże zniszczenia mogą oznaczać uszkodzenie akumulatora lub układu WN — ryzyko porażenia przez karoserię.","zr":"SZP EV","str":9},{"t":"Kontroluj temperaturę akumulatora w wielu miejscach; możliwy wyciek płynu chłodzącego i elektrolitu (drażniący, palny, żrący).","zr":"SZP EV","str":9},{"t":"Odłącz pojazd od stacji ładowania (wyłącznik bezpieczeństwa lub dyspozytor stacji).","zr":"SZP EV","str":3}]},{"etykieta":"Działania ratownicze","punkty":[{"t":"Techniki, kierunki ewakuacji i dostęp — jak dla standardowego samochodu osobowego.","zr":"SZP EV","str":9},{"t":"Przy dostępie unikaj cięcia i rozpierania w pobliżu przewodów, komponentów i akumulatora — położenie z karty ratowniczej.","zr":"SZP EV","str":9},{"t":"Stosuj SOI chroniące przed porażeniem; sprzęt z certyfikatem elektroizolacyjności (np. rękawice).","zr":"SZP EV","str":9},{"t":"Wycieki z akumulatora usuwaj standardowym sorbentem.","zr":"SZP EV","str":10},{"t":"Przy podnoszeniu wybierz punkty podparcia omijające akumulator i elementy WN.","zr":"SZP EV","str":10}]},{"etykieta":"Przekazanie","punkty":[{"t":"Przekaż na „Potwierdzeniu przekazania terenu…” i poinformuj o: dozorze, odstawieniu ≥ 5 m od pojazdów, materiałów palnych i budynków, bezpiecznym holowaniu modelu.","zr":"SZP EV","str":14},{"t":"Przy uszkodzonym akumulatorze dodatkowo: wentylacja wnętrza, ochrona przed wyciekiem elektrolitu, SOI, utylizacja przez wyspecjalizowaną firmę.","zr":"SZP EV","str":14}]}],"nie_rob":[{"t":"Nie dotykaj, nie demontuj i nie ingeruj w uszkodzone elementy układu WN.","zr":"SZP EV","str":9}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","wypadek"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":9,"sekcja":"Karta Z1 — wypadek komunikacyjny (s. 9–10), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ustaw pojazdy ratownicze tak, by zabezpieczyć miejsce działań; wyznacz strefę zagrożenia. Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast. Brak pewności co do napędu = zakładaj instalację wysokiego napięcia. Załóż, że automatyczna dezaktywacja (poduszki, napinacze) nie zadziałała — wykonaj ją ręcznie (karta „Dezaktywacja”). Przygotuj linię gaśniczą lub gaśnicę oraz kamerę termowizyjną lub pirometr.\n2. PARAMETRY: Chłodzenie akumulatora — > 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; Kontrola po chłodzeniu — 30 min; ponów przy wzroście temperatury\n3. ROZPOZNANIE: Duże zniszczenia mogą oznaczać uszkodzenie akumulatora lub układu WN — ryzyko porażenia przez karoserię. Kontroluj temperaturę akumulatora w wielu miejscach; możliwy wyciek płynu chłodzącego i elektrolitu (drażniący, palny, żrący). Odłącz pojazd od stacji ładowania (wyłącznik bezpieczeństwa lub dyspozytor stacji).\n4. DZIAŁANIA RATOWNICZE: Techniki, kierunki ewakuacji i dostęp — jak dla standardowego samochodu osobowego. Przy dostępie unikaj cięcia i rozpierania w pobliżu przewodów, komponentów i akumulatora — położenie z karty ratowniczej. Stosuj SOI chroniące przed porażeniem; sprzęt z certyfikatem elektroizolacyjności (np. rękawice). Wycieki z akumulatora usuwaj standardowym sorbentem. Przy podnoszeniu wybierz punkty podparcia omijające akumulator i elementy WN.\n5. PRZEKAZANIE: Przekaż na „Potwierdzeniu przekazania terenu…” i poinformuj o: dozorze, odstawieniu ≥ 5 m od pojazdów, materiałów palnych i budynków, bezpiecznym holowaniu modelu. Przy uszkodzonym akumulatorze dodatkowo: wentylacja wnętrza, ochrona przed wyciekiem elektrolitu, SOI, utylizacja przez wyspecjalizowaną firmę.\n6. NIE RÓB: Nie dotykaj, nie demontuj i nie ingeruj w uszkodzone elementy układu WN."},{"id":"WYP-MAS-01","wzorzec":2,"zrodlo":"KG PSP: Zasady organizacji ratownictwa medycznego w KSRG (czerwiec 2021) – dokument główny, zał. 2 i 7","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wypadek masowy","keywords":["autobus i elektryk","duzo poszkodowanych","karambol","masowe zdarzenie drogowe","wiele ofiar","mci","zdarzenie masowe","wielu poszkodowanych","triage","segregacja medyczna","wypadek autobusu","karambol wielu poszkodowanych","masowka","segregacja start","jumpstart","kierujący akcją medyczną","kmdr","mobilna baza sprzętu medycznego"],"aliasy":["autobus i elektryk","duzo poszkodowanych","karambol","masowe zdarzenie drogowe","wiele ofiar","mci","zdarzenie masowe","wielu poszkodowanych","triage","segregacja medyczna","wypadek autobusu","karambol wielu poszkodowanych","masowka"],"prefix":"Zdarzenie masowe (wielu poszkodowanych) — segregacja START, współpraca KDR z KAM, transport i zakończenie.","najpierw":[{"t":"Oceń liczbę poszkodowanych segregacją wstępną (START) już w rozpoznaniu.","zr":"RM zał. 2","str":1},{"t":"Przekaż SK PSP: liczbę poszkodowanych, możliwości ZRM na miejscu i — w porozumieniu z KAM — potrzebne siły, w tym mobilną bazę sprzętu medycznego.","zr":"RM zał. 2","str":7},{"t":"Do przybycia ZRM wskaż Koordynatora Medycznych Działań Ratowniczych (KMDR): lekarz, pielęgniarka lub ratownik medyczny.","zr":"RM zał. 7","str":4}],"parametry":[{"nazwa":"Zdarzenie masowe","wartosc":"potrzeby z segregacji przekraczają siły i środki obecne na miejscu","zr":"RM","str":11},{"nazwa":"I – czerwony","wartosc":"oddech > 30/min · brak tętna na t. promieniowej · nawrót kapilarny > 2 s · nie wykonuje poleceń · oddycha dopiero po udrożnieniu","zr":"RM zał. 2","str":2},{"nazwa":"II – żółty","wartosc":"nie chodzi, oddech < 30/min, krążenie wydolne, wykonuje polecenia","zr":"RM zał. 2","str":2},{"nazwa":"III – zielony","wartosc":"chodzi samodzielnie","zr":"RM zał. 2","str":2},{"nazwa":"IV – czarny","wartosc":"nie oddycha mimo udrożnienia dróg oddechowych","zr":"RM zał. 2","str":2},{"nazwa":"Dzieci 1–8 lat","wartosc":"JumpSTART; dziecko < 1 roku z obrażeniami: zielony → żółty","zr":"RM zał. 2","str":3},{"nazwa":"CBRNE","wartosc":"segregacja SIEVE","zr":"RM zał. 2","str":1}],"sekcje":[{"etykieta":"Segregacja","punkty":[{"t":"Cel: uratować jak największą liczbę poszkodowanych.","zr":"RM zał. 2","str":1},{"t":"W segregacji wstępnej wykonuj tylko czynności ratujące życie: udrożnienie dróg oddechowych, pozycja boczna bezpieczna, zatamowanie krwotoku.","zr":"RM zał. 2","str":1},{"t":"Brak tętna na tętnicy promieniowej — zatamuj krwotok i oznacz jako I.","zr":"RM zał. 2","str":2},{"t":"U małych dzieci ocena chodzenia jest zawodna; nawrót kapilarny oceniaj na mostku lub czole.","zr":"RM zał. 2","str":3},{"t":"Segregację wtórną (pełne badanie, kolejność transportu) prowadzi najbardziej doświadczony personel medyczny.","zr":"RM zał. 2","str":6}]},{"etykieta":"Współpraca z KAM","punkty":[{"t":"Po przybyciu pierwszego ZRM koordynację medyczną przejmuje KAM; jego dane i sposób łączności przekazuje Ci SK PSP.","zr":"RM zał. 7","str":4},{"t":"KAM organizuje segregację medyczną, punkt lub obszar pomocy medycznej i transport pacjentów.","zr":"RM zał. 7","str":6},{"t":"KMDR z ratownikami KSRG działa w strefach zagrożenia dla ZRM i przekazuje informację o wykonaniu dostępu do poszkodowanych.","zr":"RM zał. 7","str":6},{"t":"Wymieniaj z KAM informacje o zagrożeniach, czasie wykonania dostępu i konieczności wycofania ZRM ze strefy.","zr":"RM zał. 7","str":5}]},{"etykieta":"Transport i zakończenie","punkty":[{"t":"Sprzętem KSRG przemieszczaj poszkodowanych tylko do miejsca, gdzie PRM może podjąć czynności.","zr":"RM zał. 7","str":7},{"t":"Transport sprzętem KSRG w stanie wyższej konieczności — decyduje wyłącznie KDR; powiadom SK i wpisz uzasadnienie w informacji ze zdarzenia.","zr":"RM zał. 7","str":8},{"t":"Sprzęt przekazany z poszkodowanym uzupełnij na miejscu „sztuka za sztukę”.","zr":"RM zał. 7","str":8}]}],"wsparcie":[{"t":"Potrzebujesz dodatkowych sił — przekaż to przez SDM do SK KP/KM PSP albo do dyspozytora medycznego.","zr":"RM zał. 7","str":2},{"t":"Mobilna baza sprzętu medycznego — wnioskuj przez SK PSP w porozumieniu z KAM.","zr":"RM zał. 2","str":7},{"t":"Grupa Ratownictwa Medycznego (GRMed) — na wniosek KDR przez SK KW PSP.","zr":"RM","str":29},{"t":"Na miejscu są pojazdy elektryczne lub hybrydowe — równolegle zastosuj karty „Wypadek pojazdu elektrycznego po kolizji drogowej” i „Dezaktywacja awaryjna pojazdu elektrycznego”."}],"nie_rob":[{"t":"Nie dopuść do niekontrolowanej ewakuacji poszkodowanych — nie przenoś katastrofy do szpitala.","zr":"RM zał. 2","str":6}],"tagi_wspolne":["wypadek","zdarzenie masowe","wielu poszkodowanych","segregacja medyczna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zorm-2021-zal2","strona":1,"sekcja":"RM zał. 2 — Segregacja poszkodowanych w zdarzeniach masowych (s. 1–7)"},{"dokument_id":"doc-zorm-2021-zal7","strona":4,"sekcja":"RM zał. 7 — Współpraca z PRM: KMDR, KAM, transport (s. 2–8)"},{"dokument_id":"doc-zorm-2021","strona":11,"sekcja":"RM — def. zdarzenia masowego (s. 11), GRMed (s. 29)"}],"data_przegladu":"2026-10-27","pelna_procedura":{"tytul":"Zasady organizacji ratownictwa medycznego w KSRG — zał. 2 Segregacja poszkodowanych w zdarzeniach masowych","plik":"dokumenty/kpp/zorm-2021/zal-02-segregacja-zdarzenia-masowe.pdf","strona":1},"grupa":"kpp","content":"1. NAJPIERW: Oceń liczbę poszkodowanych segregacją wstępną (START) już w rozpoznaniu. Przekaż SK PSP: liczbę poszkodowanych, możliwości ZRM na miejscu i — w porozumieniu z KAM — potrzebne siły, w tym mobilną bazę sprzętu medycznego. Do przybycia ZRM wskaż Koordynatora Medycznych Działań Ratowniczych (KMDR): lekarz, pielęgniarka lub ratownik medyczny.\n2. PARAMETRY: Zdarzenie masowe — potrzeby z segregacji przekraczają siły i środki obecne na miejscu; I – czerwony — oddech > 30/min · brak tętna na t. promieniowej · nawrót kapilarny > 2 s · nie wykonuje poleceń · oddycha dopiero po udrożnieniu; II – żółty — nie chodzi, oddech < 30/min, krążenie wydolne, wykonuje polecenia; III – zielony — chodzi samodzielnie; IV – czarny — nie oddycha mimo udrożnienia dróg oddechowych; Dzieci 1–8 lat — JumpSTART; dziecko < 1 roku z obrażeniami: zielony → żółty; CBRNE — segregacja SIEVE\n3. SEGREGACJA: Cel: uratować jak największą liczbę poszkodowanych. W segregacji wstępnej wykonuj tylko czynności ratujące życie: udrożnienie dróg oddechowych, pozycja boczna bezpieczna, zatamowanie krwotoku. Brak tętna na tętnicy promieniowej — zatamuj krwotok i oznacz jako I. U małych dzieci ocena chodzenia jest zawodna; nawrót kapilarny oceniaj na mostku lub czole. Segregację wtórną (pełne badanie, kolejność transportu) prowadzi najbardziej doświadczony personel medyczny.\n4. WSPÓŁPRACA Z KAM: Po przybyciu pierwszego ZRM koordynację medyczną przejmuje KAM; jego dane i sposób łączności przekazuje Ci SK PSP. KAM organizuje segregację medyczną, punkt lub obszar pomocy medycznej i transport pacjentów. KMDR z ratownikami KSRG działa w strefach zagrożenia dla ZRM i przekazuje informację o wykonaniu dostępu do poszkodowanych. Wymieniaj z KAM informacje o zagrożeniach, czasie wykonania dostępu i konieczności wycofania ZRM ze strefy.\n5. TRANSPORT I ZAKOŃCZENIE: Sprzętem KSRG przemieszczaj poszkodowanych tylko do miejsca, gdzie PRM może podjąć czynności. Transport sprzętem KSRG w stanie wyższej konieczności — decyduje wyłącznie KDR; powiadom SK i wpisz uzasadnienie w informacji ze zdarzenia. Sprzęt przekazany z poszkodowanym uzupełnij na miejscu „sztuka za sztukę”.\n6. WEZWIJ WSPARCIE, GDY: Potrzebujesz dodatkowych sił — przekaż to przez SDM do SK KP/KM PSP albo do dyspozytora medycznego. Mobilna baza sprzętu medycznego — wnioskuj przez SK PSP w porozumieniu z KAM. Grupa Ratownictwa Medycznego (GRMed) — na wniosek KDR przez SK KW PSP. Na miejscu są pojazdy elektryczne lub hybrydowe — równolegle zastosuj karty „Wypadek pojazdu elektrycznego po kolizji drogowej” i „Dezaktywacja awaryjna pojazdu elektrycznego”.\n7. NIE RÓB: Nie dopuść do niekontrolowanej ewakuacji poszkodowanych — nie przenoś katastrofy do szpitala."},{"id":"KARTA-WYS-RATOWNICTWO-WYSOKOSCIOWE","wzorzec":2,"kategoria":"dzialania","grupa":"wys","zrodlo":"KG PSP: Zasady organizacji ratownictwa wysokościowego w KSRG, Warszawa, 12.04.2024","data_aktualizacji":"2026-10-27","slowo_kluczowe":"ratownictwo wysokosciowe","keywords":["ratownictwo wysokościowe zakres podstawowy","sgrw","grupa ratownictwa wysokościowego","techniki linowe","ewakuacja z wysokości","ewakuacja z kolejki linowej","ewakuacja z drzewa"],"aliasy":["ratownictwo wysokościowe zakres podstawowy","sgrw","grupa ratownictwa wysokościowego","techniki linowe","ewakuacja z wysokości","ewakuacja z kolejki linowej","ewakuacja z drzewa"],"prefix":"Ratownictwo wysokościowe — zakres podstawowy i współpraca KDR z SGRW (Zasady KG PSP 2024).","najpierw":[{"t":"Dotarcie do miejsca działań tylko z asekuracją i środkami ograniczającymi spadanie (sprzęt z zał. 3 i 3a).","zr":"RWys 2024","str":7},{"t":"Zabezpiecz poszkodowanego przed upadkiem: lina, pętla do asekuracji, uprząż ewakuacyjna.","zr":"RWys 2024","str":7},{"t":"Kolej linowa, drzewo, konstrukcja — techniki dedykowane tylko przez ratowników z dodatkowym szkoleniem; w innym razie wezwij SGRW.","zr":"RWys 2024","str":7}],"parametry":[{"nazwa":"Zakres podstawowy","wartosc":"wszystkie JRG PSP; OSP spełniające standardy · min. 3 ratowników, niezwłocznie","zr":"RWys 2024","str":7},{"nazwa":"SGRW poziom A","wartosc":"min. 3 ratowników (w tym dowódca) · niezwłocznie","zr":"RWys 2024","str":12},{"nazwa":"SGRW poziom B","wartosc":"min. 5 ratowników (w tym dowódca) · niezwłocznie","zr":"RWys 2024","str":12},{"nazwa":"Poziom S (AS / BS)","wartosc":"działania z pokładu śmigłowca; skład może być mniejszy, min. 1 ratownik śmigłowcowy — operator","zr":"RWys 2024","str":13}],"sekcje":[{"etykieta":"Zadania zakresu podstawowego","punkty":[{"t":"Praca w podparciu i środki ograniczające poruszanie się ratownika.","zr":"RWys 2024","str":7},{"t":"Ewakuacja osób, zwierząt i mienia: wyciągnięcie, opuszczenie, wyprowadzenie lub zejście.","zr":"RWys 2024","str":7}]},{"etykieta":"Współpraca z SGRW","punkty":[{"t":"SGRW wykonuje zadania zakresu podstawowego i wykraczające poza niego technikami linowymi; poziom S — z pokładu śmigłowca.","zr":"RWys 2024","str":11},{"t":"Przy działaniach różnych pododdziałów SGRW tworzy odrębny odcinek bojowy podległy KDR.","zr":"RWys 2024","str":20},{"t":"Dowodzący SGRW określa skład grupy, może go powiększyć lub polecić zadysponowanie kolejnej grupy.","zr":"RWys 2024","str":20},{"t":"Czynności podstawowe i specjalistyczne koordynuje na miejscu KDR, a w systemie — SK PSP.","zr":"RWys 2024","str":20}]},{"etykieta":"Sprzęt","punkty":[{"t":"Sprzęt do ratownictwa wysokościowego: normy PN/EN, CE, przechowywany jako zestaw w worach, przegląd co najmniej raz na 12 miesięcy.","zr":"RWys 2024","str":8}]}],"nie_rob":[{"t":"Nie stosuj technik ewakuacji z kolei linowych, drzew i konstrukcji bez wymaganego szkolenia.","zr":"RWys 2024","str":8}],"tagi_wspolne":["wysokości","asekuracja linowa"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rwys-2024","strona":6,"sekcja":"Część 2 (s. 6–10), część 3 — SGRW (s. 10–20)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Dotarcie do miejsca działań tylko z asekuracją i środkami ograniczającymi spadanie (sprzęt z zał. 3 i 3a). Zabezpiecz poszkodowanego przed upadkiem: lina, pętla do asekuracji, uprząż ewakuacyjna. Kolej linowa, drzewo, konstrukcja — techniki dedykowane tylko przez ratowników z dodatkowym szkoleniem; w innym razie wezwij SGRW.\n2. PARAMETRY: Zakres podstawowy — wszystkie JRG PSP; OSP spełniające standardy · min. 3 ratowników, niezwłocznie; SGRW poziom A — min. 3 ratowników (w tym dowódca) · niezwłocznie; SGRW poziom B — min. 5 ratowników (w tym dowódca) · niezwłocznie; Poziom S (AS / BS) — działania z pokładu śmigłowca; skład może być mniejszy, min. 1 ratownik śmigłowcowy — operator\n3. ZADANIA ZAKRESU PODSTAWOWEGO: Praca w podparciu i środki ograniczające poruszanie się ratownika. Ewakuacja osób, zwierząt i mienia: wyciągnięcie, opuszczenie, wyprowadzenie lub zejście.\n4. WSPÓŁPRACA Z SGRW: SGRW wykonuje zadania zakresu podstawowego i wykraczające poza niego technikami linowymi; poziom S — z pokładu śmigłowca. Przy działaniach różnych pododdziałów SGRW tworzy odrębny odcinek bojowy podległy KDR. Dowodzący SGRW określa skład grupy, może go powiększyć lub polecić zadysponowanie kolejnej grupy. Czynności podstawowe i specjalistyczne koordynuje na miejscu KDR, a w systemie — SK PSP.\n5. SPRZĘT: Sprzęt do ratownictwa wysokościowego: normy PN/EN, CE, przechowywany jako zestaw w worach, przegląd co najmniej raz na 12 miesięcy.\n6. NIE RÓB: Nie stosuj technik ewakuacji z kolei linowych, drzew i konstrukcji bez wymaganego szkolenia."},{"id":"ZAT-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zatopienie samochodu elektrycznego","keywords":["zatopienie ev","elektryk w wodzie","zalany samochod elektryczny","pojazd ev w rzece","auto elektryczne w wodzie","podtopiony elektryk","zalany pojazd elektryczny","samochod elektryczny w wodzie"],"aliasy":["zatopienie ev","elektryk w wodzie","zalany samochod elektryczny","pojazd ev w rzece","auto elektryczne w wodzie","podtopiony elektryk","zalany pojazd elektryczny","samochod elektryczny w wodzie"],"prefix":"Samochód elektryczny lub hybrydowy zatopiony w wodzie — karta Z3 SZP KG PSP (2023).","najpierw":[{"t":"Postępuj jak przy standardowym samochodzie spalinowym.","zr":"SZP EV","str":13},{"t":"Zatopiony samochód elektryczny nie stwarza zagrożenia porażenia prądem ani zwiększonego zanieczyszczenia wody.","zr":"SZP EV","str":13},{"t":"Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast; gdy ewakuacja niemożliwa — wyciągnij samochód z osobami.","zr":"SZP EV","str":13}],"parametry":[{"nazwa":"Oznaka zwarcia akumulatora","wartosc":"parowanie wody","zr":"SZP EV","str":13}],"sekcje":[{"etykieta":"Działania","punkty":[{"t":"Zabezpiecz wycieki płynów eksploatacyjnych przed rozprzestrzenianiem się na wodzie.","zr":"SZP EV","str":13},{"t":"Przy wydobyciu wyznacz punkty mocowania omijające akumulator i elementy WN.","zr":"SZP EV","str":13}]},{"etykieta":"Po wydobyciu","punkty":[{"t":"Wykonaj dezaktywację i zabezpieczenie (karta „Dezaktywacja”).","zr":"SZP EV","str":13},{"t":"Kontroluj temperaturę akumulatora (kamera termowizyjna, pirometr) i bądź gotowy na pożar akumulatora (karta „Pożar”).","zr":"SZP EV","str":13},{"t":"Przekaż z informacją o dozorze, odstawieniu ≥ 5 m od pojazdów i budynków i bezpiecznym holowaniu modelu.","zr":"SZP EV","str":14}]}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","zatopienie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":13,"sekcja":"Karta Z3 — zatopienie (s. 13), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Postępuj jak przy standardowym samochodzie spalinowym. Zatopiony samochód elektryczny nie stwarza zagrożenia porażenia prądem ani zwiększonego zanieczyszczenia wody. Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast; gdy ewakuacja niemożliwa — wyciągnij samochód z osobami.\n2. PARAMETRY: Oznaka zwarcia akumulatora — parowanie wody\n3. DZIAŁANIA: Zabezpiecz wycieki płynów eksploatacyjnych przed rozprzestrzenianiem się na wodzie. Przy wydobyciu wyznacz punkty mocowania omijające akumulator i elementy WN.\n4. PO WYDOBYCIU: Wykonaj dezaktywację i zabezpieczenie (karta „Dezaktywacja”). Kontroluj temperaturę akumulatora (kamera termowizyjna, pirometr) i bądź gotowy na pożar akumulatora (karta „Pożar”). Przekaż z informacją o dozorze, odstawieniu ≥ 5 m od pojazdów i budynków i bezpiecznym holowaniu modelu."},{"id":"KARTA-ZA-CEL-ZAKRES-MONITOROWANIA","wzorzec":2,"kategoria":"organizacja","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"zlota alga monitoring","keywords":["prymnesium parvum monitoring","procedura zlota alga","cel procedury zlota alga","zakres procedury zlota alga","zasada metody zlota alga"],"aliasy":["prymnesium parvum monitoring","procedura zlota alga","cel procedury zlota alga","zakres procedury zlota alga","zasada metody zlota alga"],"prefix":"Złota alga — po co i jak GIOŚ prowadzi monitoring interwencyjny (wyd. 4, 2025).","najpierw":[{"t":"Przy pomiarach terenowych i poborze próbek w punktach monitoringu interwencyjnego stosuj maseczkę ochronną i rękawice.","zr":"Proc.","str":5}],"parametry":[{"nazwa":"Odpowiada","wartosc":"GIOŚ: pomiary terenowe, próbki, badania laboratoryjne, analizy i raporty","zr":"Proc.","str":4},{"nazwa":"Ilości zakwitowe","wartosc":"> 10 mln komórek/l","zr":"Proc.","str":6},{"nazwa":"Toksyczność zakwitu","wartosc":"> 50–100 mln komórek/l","zr":"Proc.","str":6}],"sekcje":[{"etykieta":"Cel i zakres","punkty":[{"t":"Cel: wykryć ryzyko zakwitu złotej algi i poinformować właściwe służby.","zr":"Proc.","str":4},{"t":"Procedura określa badane wskaźniki, częstotliwość badań, poziomy alarmowe, postępowanie z próbkami, czasy, odpowiedzialność i drogę informowania służb.","zr":"Proc.","str":4},{"t":"Metody i aparatura — według metod referencyjnych (rozporządzenie MI z 13.07.2021, Dz.U. 2021 poz. 1576) i procedury PB-01/KLRW.","zr":"Proc.","str":4}]},{"etykieta":"Punkty monitoringu","punkty":[{"t":"Punkt może leżeć na rzece, starorzeczu, kanale lub zbiorniku; wyznacza go DMŚ GIOŚ, także na rekomendację Zespołu ds. Odry.","zr":"Proc.","str":5},{"t":"Pierwszorzędne — kluczowe ogniska rozwoju algi i Odra poniżej Kanału Gliwickiego/Kłodnicy.","zr":"Proc.","str":5},{"t":"Drugorzędne — wspomagające; trzeciorzędne (kaskadowe) — uruchamiane po przekroczeniu stopnia ostrzegawczego w punktach 1. i 2. rzędu.","zr":"Proc.","str":5},{"t":"Czwartorzędne — zagrożenie lokalne z wdrożonymi zabezpieczeniami (np. siatki); pięciorzędne — obecność algi tylko podejrzewana.","zr":"Proc.","str":5},{"t":"Wykaz lokalizacji to załącznik nr 4 — aktualizowany osobno przez GIOŚ.","zr":"Proc.","str":5}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","monitoring"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":4,"sekcja":"Proc. pkt 1–5 (s. 4–6)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Przy pomiarach terenowych i poborze próbek w punktach monitoringu interwencyjnego stosuj maseczkę ochronną i rękawice.\n2. PARAMETRY: Odpowiada — GIOŚ: pomiary terenowe, próbki, badania laboratoryjne, analizy i raporty; Ilości zakwitowe — > 10 mln komórek/l; Toksyczność zakwitu — > 50–100 mln komórek/l\n3. CEL I ZAKRES: Cel: wykryć ryzyko zakwitu złotej algi i poinformować właściwe służby. Procedura określa badane wskaźniki, częstotliwość badań, poziomy alarmowe, postępowanie z próbkami, czasy, odpowiedzialność i drogę informowania służb. Metody i aparatura — według metod referencyjnych (rozporządzenie MI z 13.07.2021, Dz.U. 2021 poz. 1576) i procedury PB-01/KLRW.\n4. PUNKTY MONITORINGU: Punkt może leżeć na rzece, starorzeczu, kanale lub zbiorniku; wyznacza go DMŚ GIOŚ, także na rekomendację Zespołu ds. Odry. Pierwszorzędne — kluczowe ogniska rozwoju algi i Odra poniżej Kanału Gliwickiego/Kłodnicy. Drugorzędne — wspomagające; trzeciorzędne (kaskadowe) — uruchamiane po przekroczeniu stopnia ostrzegawczego w punktach 1. i 2. rzędu. Czwartorzędne — zagrożenie lokalne z wdrożonymi zabezpieczeniami (np. siatki); pięciorzędne — obecność algi tylko podejrzewana. Wykaz lokalizacji to załącznik nr 4 — aktualizowany osobno przez GIOŚ."},{"id":"KARTA-ZA-CZYNNIKI-RYZYKA","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"czynniki ryzyka zlota alga","keywords":["zlota alga temperatura","zlota alga ph","zlota alga tlen","zlota alga zasolenie","zlota alga n p","prymnesium parvum ryzyko"],"aliasy":["zlota alga temperatura","zlota alga ph","zlota alga tlen","zlota alga zasolenie","zlota alga n p","prymnesium parvum ryzyko"],"prefix":"Złota alga — warunki sprzyjające zakwitowi i toksyczności (wyd. 4, 2025).","parametry":[{"nazwa":"Temperatura","wartosc":"25–28,8°C przy zasoleniu 20–25 psu; przy niższym zasoleniu optimum spada","zr":"Proc.","str":6},{"nazwa":"Przewodność (20°C)","wartosc":"ryzyko zakwitu > 1350 µS/cm; zakwity notowano już przy ok. 900","zr":"Proc.","str":7},{"nazwa":"Chlorki","wartosc":"228 mg/l Cl — poniżej brak ryzyka; zakwit notowano przy ok. 170","zr":"Proc.","str":8},{"nazwa":"Odczyn pH","wartosc":"> 8,5 wyraźnie wyższa toksyczność; > 8,9 znaczny przyrost algi","zr":"Proc.","str":8},{"nazwa":"Stosunek N:P","wartosc":"12–20: więcej komórek, mniejsza toksyczność; < 3 decyduje o wzroście algi","zr":"Proc.","str":6},{"nazwa":"Fosfor ogólny","wartosc":"> 0,75 mg/l przy maksimach algi, potem alga ulega degradacji","zr":"Proc.","str":7}],"sekcje":[{"etykieta":"Jak czytać wskaźniki","punkty":[{"t":"Niedobór składników odżywczych zwiększa toksyczność — w takich warunkach Prymnesium parvum dominuje.","zr":"Proc.","str":6},{"t":"Wyraźny spadek azotu ogólnego świadczy o rozwoju złotej algi.","zr":"Proc.","str":6},{"t":"Wzrost azotu Kjeldahla prawdopodobnie hamuje rozwój algi — dane wstępne, wymagają potwierdzenia.","zr":"Proc.","str":7},{"t":"Zasolenie (przewodność) jest kluczowym prekursorem toksycznego zakwitu.","zr":"Proc.","str":7},{"t":"Podwyższony tlen rozpuszczony i pH w ciągu dnia mogą wynikać z fotosyntezy podczas zakwitu.","zr":"Proc.","str":8}]}],"nie_rob":[{"t":"Nie oceniaj ryzyka po jednym wskaźniku — o stopniu decyduje liczebność algi, a także zmiana parametrów w czasie.","zr":"Proc.","str":10}],"tagi_wspolne":["zlota alga","prymnesium parvum","czynniki ryzyka"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":6,"sekcja":"Proc. pkt 5.1–5.5 (s. 6–8)"}],"data_przegladu":"2026-10-25","content":"1. PARAMETRY: Temperatura — 25–28,8°C przy zasoleniu 20–25 psu; przy niższym zasoleniu optimum spada; Przewodność (20°C) — ryzyko zakwitu > 1350 µS/cm; zakwity notowano już przy ok. 900; Chlorki — 228 mg/l Cl — poniżej brak ryzyka; zakwit notowano przy ok. 170; Odczyn pH — > 8,5 wyraźnie wyższa toksyczność; > 8,9 znaczny przyrost algi; Stosunek N:P — 12–20: więcej komórek, mniejsza toksyczność; < 3 decyduje o wzroście algi; Fosfor ogólny — > 0,75 mg/l przy maksimach algi, potem alga ulega degradacji\n2. JAK CZYTAĆ WSKAŹNIKI: Niedobór składników odżywczych zwiększa toksyczność — w takich warunkach Prymnesium parvum dominuje. Wyraźny spadek azotu ogólnego świadczy o rozwoju złotej algi. Wzrost azotu Kjeldahla prawdopodobnie hamuje rozwój algi — dane wstępne, wymagają potwierdzenia. Zasolenie (przewodność) jest kluczowym prekursorem toksycznego zakwitu. Podwyższony tlen rozpuszczony i pH w ciągu dnia mogą wynikać z fotosyntezy podczas zakwitu.\n3. NIE RÓB: Nie oceniaj ryzyka po jednym wskaźniku — o stopniu decyduje liczebność algi, a także zmiana parametrów w czasie."},{"id":"KARTA-ZA-POSTEPOWANIE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"postepowanie zlota alga","keywords":["zlota alga etapy","zlota alga postepowanie","prymnesium parvum procedura","zlota alga etap i ii iii","zlota alga informacja na zewnatrz"],"aliasy":["zlota alga etapy","zlota alga postepowanie","prymnesium parvum procedura","zlota alga etap i ii iii","zlota alga informacja na zewnatrz"],"prefix":"Złota alga — etapy monitoringu, czasy i kogo informuje GIOŚ (wyd. 4, 2025).","najpierw":[{"t":"Informację o przypisanym stopniu GIOŚ przekazuje m.in. do właściwego WCZK, WIOŚ, CZK MKiŚ, Wód Polskich, GDOŚ i GIG — w ciągu 1 h od analizy.","zr":"Proc.","str":11}],"parametry":[{"nazwa":"I.1 Pomiary i próbki","wartosc":"wyniki w formularzu do 9:00 następnego dnia","zr":"Proc.","str":10},{"nazwa":"I.2 Laboratorium","wartosc":"maks. 48 h od pobrania próbek","zr":"Proc.","str":10},{"nazwa":"II Analiza stopnia","wartosc":"4 h od zatwierdzonych wyników (KLRW)","zr":"Proc.","str":11},{"nazwa":"III Informacja na zewnątrz","wartosc":"1 h od informacji z KLRW","zr":"Proc.","str":11}],"sekcje":[{"etykieta":"Etapy","punkty":[{"t":"I.1 — CLB wykonuje pomiary terenowe i pobiera próbki metodami referencyjnymi; same wyniki terenowe nie są przekazywane dalej.","zr":"Proc.","str":10},{"t":"I.2 — CLB wykonuje badania laboratoryjne, podaje liczebność Prymnesium cf. parvum i organizmy dominujące.","zr":"Proc.","str":10},{"t":"II — KLRW przypisuje stopień ostrzegawczy lub zagrożenia, opiniuje go DMŚ, potem informacja trafia do Wydziału ds. Bezpieczeństwa GIOŚ.","zr":"Proc.","str":10},{"t":"Gdy wskaźniki wskazują III stopień, ale alga nie dominuje — przypisuje się najwyżej II stopień.","zr":"Proc.","str":10},{"t":"III — Wydział ds. Bezpieczeństwa GIOŚ informuje instytucje i zleca dalsze badania z częstotliwością z załącznika nr 3.","zr":"Proc.","str":11}]},{"etykieta":"Częstotliwość badań","punkty":[{"t":"Zależy od typu punktu, przypisanego stopnia i pory roku (okres wegetacyjny: kwiecień–październik).","zr":"Proc.","str":11},{"t":"Punkty pierwszorzędne w okresie wegetacyjnym: 2× w tygodniu; przy II lub III stopniu — dodatkowy trzeci pobór w tygodniu.","zr":"Zał. 3","str":1},{"t":"Wzrost o kolejny poziom alarmowy wymusza częstotliwość nowego stopnia; spadek o co najmniej jeden poziom w pierwszym badaniu tygodnia pozwala ją zmniejszyć.","zr":"Proc.","str":11},{"t":"Wynik pierwszego badania w tygodniu jest punktem wyjścia do dalszego postępowania.","zr":"Proc.","str":11}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","postepowanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":9,"sekcja":"Proc. pkt 8 (s. 9–11)"},{"dokument_id":"doc-zlota-alga-w4-zal3","strona":1,"sekcja":"Zał. 3 — częstotliwość"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Informację o przypisanym stopniu GIOŚ przekazuje m.in. do właściwego WCZK, WIOŚ, CZK MKiŚ, Wód Polskich, GDOŚ i GIG — w ciągu 1 h od analizy.\n2. PARAMETRY: I.1 Pomiary i próbki — wyniki w formularzu do 9:00 następnego dnia; I.2 Laboratorium — maks. 48 h od pobrania próbek; II Analiza stopnia — 4 h od zatwierdzonych wyników (KLRW); III Informacja na zewnątrz — 1 h od informacji z KLRW\n3. ETAPY: I.1 — CLB wykonuje pomiary terenowe i pobiera próbki metodami referencyjnymi; same wyniki terenowe nie są przekazywane dalej. I.2 — CLB wykonuje badania laboratoryjne, podaje liczebność Prymnesium cf. parvum i organizmy dominujące. II — KLRW przypisuje stopień ostrzegawczy lub zagrożenia, opiniuje go DMŚ, potem informacja trafia do Wydziału ds. Bezpieczeństwa GIOŚ. Gdy wskaźniki wskazują III stopień, ale alga nie dominuje — przypisuje się najwyżej II stopień. III — Wydział ds. Bezpieczeństwa GIOŚ informuje instytucje i zleca dalsze badania z częstotliwością z załącznika nr 3.\n4. CZĘSTOTLIWOŚĆ BADAŃ: Zależy od typu punktu, przypisanego stopnia i pory roku (okres wegetacyjny: kwiecień–październik). Punkty pierwszorzędne w okresie wegetacyjnym: 2× w tygodniu; przy II lub III stopniu — dodatkowy trzeci pobór w tygodniu. Wzrost o kolejny poziom alarmowy wymusza częstotliwość nowego stopnia; spadek o co najmniej jeden poziom w pierwszym badaniu tygodnia pozwala ją zmniejszyć. Wynik pierwszego badania w tygodniu jest punktem wyjścia do dalszego postępowania."},{"id":"KARTA-ZA-POZIOMY-ALARMOWE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"poziomy alarmowe zlota alga","keywords":["zlota alga poziomy alarmowe","prymnesium parvum progi","zlota alga stopien zagrozenia","zlota alga rzeki starorzecza","zlota alga kanaly zbiorniki"],"aliasy":["zlota alga poziomy alarmowe","prymnesium parvum progi","zlota alga stopien zagrozenia","zlota alga rzeki starorzecza","zlota alga kanaly zbiorniki"],"prefix":"Złota alga — stopnie ostrzegawcze i stopnie zagrożenia (wyd. 4, 2025, zał. 2).","najpierw":[{"t":"Stopień zagrożenia przypisuje się według liczebności Prymnesium cf. parvum; pH, tlen, fosfor i N:P tylko ilustrują intensywność zakwitu.","zr":"Zał. 2","str":2}],"parametry":[{"nazwa":"Ostrzegawczy**","wartosc":"zasolenie: przewodność ≥ 2400 µS/cm (kanały, zbiorniki) · ≥ 1350 µS/cm (rzeki, starorzecza)","zr":"Zał. 2","str":2},{"nazwa":"Ostrzegawczy*","wartosc":"kanały, zbiorniki ≥ 3 mln os./l · rzeki ≥ 1 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"I stopień — średni zakwit","wartosc":"kanały, zbiorniki ≥ 10 mln · rzeki ≥ 10 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"II stopień — duży zakwit","wartosc":"kanały, zbiorniki ≥ 100 mln · rzeki ≥ 50 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"III stopień — bardzo duży","wartosc":"kanały, zbiorniki ≥ 300 mln · rzeki ≥ 100 mln os./l","zr":"Zał. 2","str":2}],"sekcje":[{"etykieta":"Ryzyko przy stopniach","punkty":[{"t":"Ostrzegawczy** — ryzyko pojawienia się algi z powodu zasolenia; także w punktach bez stwierdzonej algi.","zr":"Proc.","str":9},{"t":"Ostrzegawczy* — ryzyko zakwitu z powodu obecności algi.","zr":"Proc.","str":9},{"t":"I / II / III stopień — średnie / wysokie / bardzo wysokie ryzyko śnięcia ryb.","zr":"Proc.","str":9}]},{"etykieta":"Wskaźniki pomocnicze (I / II / III)","punkty":[{"t":"pH: ≥ 7,9 / ≥ 8,4 / ≥ 8,9 (obie grupy wód).","zr":"Zał. 2","str":2},{"t":"Tlen rozpuszczony: kanały, zbiorniki ≥ 12 / ≥ 14 / ≥ 16 mg/l; rzeki ≥ 12 / ≥ 13 / ≥ 14 mg/l.","zr":"Zał. 2","str":2},{"t":"Fosfor ogólny: ≥ 0,40 / ≥ 0,55 / ≥ 0,70 mg/l P (obie grupy wód).","zr":"Zał. 2","str":2},{"t":"N:P: kanały, zbiorniki ≤ 12 / ≤ 3 / ≤ 1,5; rzeki ≤ 23 / ≤ 12 / ≤ 3.","zr":"Zał. 2","str":2}]}],"nie_rob":[{"t":"Nie przypisuj stopnia zagrożenia na podstawie samych wskaźników fizyko-chemicznych.","zr":"Zał. 2","str":2}],"tagi_wspolne":["zlota alga","prymnesium parvum","poziomy alarmowe"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-zal2","strona":2,"sekcja":"Zał. 2 — poziomy alarmowe (s. 2–3)"},{"dokument_id":"doc-zlota-alga-w4-2025","strona":9,"sekcja":"Proc. pkt 7 (s. 8–9)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Stopień zagrożenia przypisuje się według liczebności Prymnesium cf. parvum; pH, tlen, fosfor i N:P tylko ilustrują intensywność zakwitu.\n2. PARAMETRY: Ostrzegawczy** — zasolenie: przewodność ≥ 2400 µS/cm (kanały, zbiorniki) · ≥ 1350 µS/cm (rzeki, starorzecza); Ostrzegawczy* — kanały, zbiorniki ≥ 3 mln os./l · rzeki ≥ 1 mln os./l; I stopień — średni zakwit — kanały, zbiorniki ≥ 10 mln · rzeki ≥ 10 mln os./l; II stopień — duży zakwit — kanały, zbiorniki ≥ 100 mln · rzeki ≥ 50 mln os./l; III stopień — bardzo duży — kanały, zbiorniki ≥ 300 mln · rzeki ≥ 100 mln os./l\n3. RYZYKO PRZY STOPNIACH: Ostrzegawczy** — ryzyko pojawienia się algi z powodu zasolenia; także w punktach bez stwierdzonej algi. Ostrzegawczy* — ryzyko zakwitu z powodu obecności algi. I / II / III stopień — średnie / wysokie / bardzo wysokie ryzyko śnięcia ryb.\n4. WSKAŹNIKI POMOCNICZE (I / II / III): pH: ≥ 7,9 / ≥ 8,4 / ≥ 8,9 (obie grupy wód). Tlen rozpuszczony: kanały, zbiorniki ≥ 12 / ≥ 14 / ≥ 16 mg/l; rzeki ≥ 12 / ≥ 13 / ≥ 14 mg/l. Fosfor ogólny: ≥ 0,40 / ≥ 0,55 / ≥ 0,70 mg/l P (obie grupy wód). N:P: kanały, zbiorniki ≤ 12 / ≤ 3 / ≤ 1,5; rzeki ≤ 23 / ≤ 12 / ≤ 3.\n5. NIE RÓB: Nie przypisuj stopnia zagrożenia na podstawie samych wskaźników fizyko-chemicznych."},{"id":"KARTA-ZA-WSKAZNIKI-BADANE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"wskazniki badane zlota alga","keywords":["zlota alga wskazniki","zlota alga pomiary terenowe","zlota alga badania laboratoryjne","prymnesium parvum wskazniki","wskazniki fizykochemiczne zlota alga"],"aliasy":["zlota alga wskazniki","zlota alga pomiary terenowe","zlota alga badania laboratoryjne","prymnesium parvum wskazniki","wskazniki fizykochemiczne zlota alga"],"prefix":"Złota alga — wskaźniki badane w monitoringu interwencyjnym (wyd. 4, 2025, zał. 1).","parametry":[{"nazwa":"Pomiary terenowe","wartosc":"temperatura · przewodność w 20°C · pH · tlen rozpuszczony · nasycenie tlenem","zr":"Zał. 1","str":1},{"nazwa":"Fizyko-chemiczne","wartosc":"chlorki · azot azotanowy, azotynowy, amonowy, Kjeldahla, ogólny · fosfor ogólny","zr":"Zał. 1","str":1},{"nazwa":"Biologiczne","wartosc":"fitoplankton — liczebność Prymnesium cf. parvum","zr":"Zał. 1","str":1}],"sekcje":[{"etykieta":"Ocena ryzyka","punkty":[{"t":"Do oceny ryzyka służą tylko: przewodność, pH, tlen, fosfor ogólny, stosunek N:P i liczebność algi.","zr":"Zał. 2","str":1},{"t":"Temperatura, chlorki i formy azotu są badane, by sprawdzić ich związek z toksycznością — nie wpływają na stopień.","zr":"Zał. 2","str":3},{"t":"Siarczanów nie bada się — w polskich wodach nie zaobserwowano ich wpływu na rozwój algi.","zr":"Proc.","str":8},{"t":"Zakres badań (zał. 1) może zmienić GIOŚ w uzgodnieniu z MKiŚ.","zr":"Proc.","str":8}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","wskazniki"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-zal1","strona":1,"sekcja":"Zał. 1 — wskaźniki badane"},{"dokument_id":"doc-zlota-alga-w4-zal2","strona":1,"sekcja":"Zał. 2 — wskaźniki objęte oceną"},{"dokument_id":"doc-zlota-alga-w4-2025","strona":8,"sekcja":"Proc. pkt 5.3.2, 6"}],"data_przegladu":"2026-10-25","content":"1. PARAMETRY: Pomiary terenowe — temperatura · przewodność w 20°C · pH · tlen rozpuszczony · nasycenie tlenem; Fizyko-chemiczne — chlorki · azot azotanowy, azotynowy, amonowy, Kjeldahla, ogólny · fosfor ogólny; Biologiczne — fitoplankton — liczebność Prymnesium cf. parvum\n2. OCENA RYZYKA: Do oceny ryzyka służą tylko: przewodność, pH, tlen, fosfor ogólny, stosunek N:P i liczebność algi. Temperatura, chlorki i formy azotu są badane, by sprawdzić ich związek z toksycznością — nie wpływają na stopień. Siarczanów nie bada się — w polskich wodach nie zaobserwowano ich wpływu na rozwój algi. Zakres badań (zał. 1) może zmienić GIOŚ w uzgodnieniu z MKiŚ."}];

        function safeStorageGet(key) {
            try {
                return localStorage.getItem(key) || "";
            } catch (error) {
                return "";
            }
        }

        function safeStorageSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (error) {
                return false;
            }
        }

        function safeStorageRemove(key) {
            try {

            } catch (error) {}

        // Dziennik techniczny trafia do Ustawien (zwiniety). Komunikaty
        // waznych dla uzytkownika bledow (mikrofon, AI) pokazujemy pod polem
        // wyszukiwania, bo konsola nie jest juz widoczna na ekranie glownym.
        const DEBUG_MAX_LINES = 80;

        function log(message, isError = false) {
            if (debugConsole) {
                const line = document.createElement("div");
                line.className = `debug-line${isError ? " error" : ""}`;
                line.textContent = `> ${message}`;
                debugConsole.appendChild(line);
                while (debugConsole.children && debugConsole.children.length > DEBUG_MAX_LINES) {
                    debugConsole.removeChild(debugConsole.firstChild);
                }
                debugConsole.scrollTop = debugConsole.scrollHeight;
            }

            if (isError) showNotice(message);
        }

        function showNotice(message) {
            if (!userInputDisplay) return;
            userInputDisplay.textContent = message;
            userInputDisplay.classList.add("notice");
        }

        function clearNotice() {
            if (!userInputDisplay) return;
            userInputDisplay.classList.remove("notice");
        }
