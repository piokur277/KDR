zne do czasu stabilizacji przez SGPR. Warunki dla ewakuowanych (namioty, autobus), ewidencja z wywiadem. Z nadzorem budowlanym lub specjalistą budownictwa określ warunki wejścia ratowników na gruzowisko."},{"id":"KARTA-BUD-ZABEZPIECZENIE-LOGISTYCZNE-KATASTROFA-BUDOWLANA","wzorzec":2,"kategoria":"organizacja","grupa":"bud","zrodlo":"KG PSP: Standardowe zasady postępowania po wystąpieniu katastrofy budowlanej, wydanie I, 2020.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zabezpieczenie logistyczne katastrofa budowlana","keywords":["logistyka gruzowisko","katastrofa budowlana logistyka","zaplecze katastrofa budowlana"],"aliasy":["logistyka gruzowisko","katastrofa budowlana logistyka","zaplecze katastrofa budowlana"],"prefix":"Katastrofa budowlana — zabezpieczenie logistyczne: ruch, PPSiS, sztab, lądowisko, wyżywienie i woda (SZP KG PSP 2020).","najpierw":[{"t":"Z Policją zapewnij kierowanie ruchem i swobodny dojazd do strefy, także ciężkiego sprzętu.","zr":"SZP KB 2020","str":7},{"t":"Zaplanuj dużo miejsca — spodziewaj się dużej ilości sił i środków.","zr":"SZP KB 2020","str":7}],"parametry":[{"nazwa":"Woda pitna","wartosc":"butelkowana, min. 3 l na osobę na dzień","zr":"SZP KB 2020","str":7},{"nazwa":"Posiłki","wartosc":"ciepłe, dwudaniowe — po 6 h działań (z zarządzaniem kryzysowym)","zr":"SZP KB 2020","str":7}],"sekcje":[{"etykieta":"Wyznacz miejsca","punkty":[{"t":"PPSiS z SDŁ i namiotem pneumatycznym; oczekiwanie SIS i parking pojazdów.","zr":"SZP KB 2020","str":7},{"t":"Lądowisko LPR, sztab taktyczny, obsługa mediów, tymczasowa opieka medyczna (namiot).","zr":"SZP KB 2020","str":7},{"t":"Składowisko materiałów poza strefą (drewno do stabilizacji, podpory, sprzęt do cięcia).","zr":"SZP KB 2020","str":7},{"t":"Na granicy strefy — szybkie uzupełnianie płynów i kalorii, krótkie odprawy.","zr":"SZP KB 2020","str":7}]},{"etykieta":"Ludzie","punkty":[{"t":"Komfort cieplny w miejscu oczekiwania: mróz — ogrzewane namioty, gorące napoje; deszcz — suszenie ubrań; upał — cień, chłodne napoje.","zr":"SZP KB 2020","str":7},{"t":"Z zarządzaniem kryzysowym zapewnij schronienie ewakuowanej ludności.","zr":"SZP KB 2020","str":7}]}],"tagi_wspolne":["katastrofa budowlana","zawalenie","logistyka"],"dokumenty_zrodlowe":[{"dokument_id":"doc-katastrofa-budowlana-2020","strona":7,"sekcja":"Zabezpieczenie logistyczne (s. 7)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Z Policją zapewnij kierowanie ruchem i swobodny dojazd do strefy, także ciężkiego sprzętu. Zaplanuj dużo miejsca — spodziewaj się dużej ilości sił i środków.\n2. PARAMETRY: Woda pitna — butelkowana, min. 3 l na osobę na dzień; Posiłki — ciepłe, dwudaniowe — po 6 h działań (z zarządzaniem kryzysowym)\n3. WYZNACZ MIEJSCA: PPSiS z SDŁ i namiotem pneumatycznym; oczekiwanie SIS i parking pojazdów. Lądowisko LPR, sztab taktyczny, obsługa mediów, tymczasowa opieka medyczna (namiot). Składowisko materiałów poza strefą (drewno do stabilizacji, podpory, sprzęt do cięcia). Na granicy strefy — szybkie uzupełnianie płynów i kalorii, krótkie odprawy.\n4. LUDZIE: Komfort cieplny w miejscu oczekiwania: mróz — ogrzewane namioty, gorące napoje; deszcz — suszenie ubrań; upał — cień, chłodne napoje. Z zarządzaniem kryzysowym zapewnij schronienie ewakuowanej ludności."},{"id":"KARTA-CHEM-Z1-LNG-POZAR-ZEW","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar zewnetrzny cysterny lng","keywords":["pozar cysterny lng","pozar zewnetrzny lng","ogrzewanie cysterny","pali sie obok cysterny","pozar gazu","cysterna z gazem","bleve lng","chlodzenie cysterny lng","skroplony gaz ziemny"],"aliasy":["pozar cysterny lng","pozar zewnetrzny lng","ogrzewanie cysterny","pali sie obok cysterny","pozar gazu","cysterna z gazem","bleve lng","chlodzenie cysterny lng","skroplony gaz ziemny"],"prefix":"LNG Z1 — pożar zewnętrzny podgrzewający cysternę LNG (bez spalania LNG): strefy 1,5 km i 300 m, chłodzenie 10 l/min/m² (SZP KG PSP 2025).","najpierw":[{"t":"Strefa ewakuacji osób postronnych 1,5 km; strefa zagrożenia dla ratowników 300 m.","zr":"SZP LNG 2025","str":5},{"t":"Równocześnie z rozpoznaniem intensywnie chłodź zbiornik dużą ilością wody ze stanowisk bezobsługowych.","zr":"SZP LNG 2025","str":5},{"t":"Rozpoznanie zza tarczy balistycznej: miejsce i faza wycieku, możliwość odcięcia wypływu, poziomowskaz, ciśnieniomierz, temperatura fazy ciekłej, tabliczka znamionowa, pogoda i teren.","zr":"SZP LNG 2025","str":5}],"parametry":[{"nazwa":"BLEVE / fireball","wartosc":"możliwy po ok. 45 min podgrzewania (przy sprawnych zaworach bezpieczeństwa); mało prawdopodobny dzięki izolacji","zr":"SZP LNG 2025","str":5},{"nazwa":"Chłodzenie","wartosc":"10 l/min na m² zbiornika — tylko gdy powłoka zewnętrzna jest nienaruszona, a ciepło pochodzi z zewnątrz","zr":"SZP LNG 2025","str":5},{"nazwa":"Skuteczne chłodzenie","wartosc":"woda nie odparowuje z powierzchni zbiornika","zr":"SZP LNG 2025","str":5},{"nazwa":"Po zgaszeniu","wartosc":"chłodź cysternę jeszcze ok. 10–15 min","zr":"SZP LNG 2025","str":6}],"sekcje":[{"etykieta":"Kontrola chłodzenia","punkty":[{"t":"Kontroluj temperaturę powłoki zewnętrznej pirometrem lub kamerą termowizyjną.","zr":"SZP LNG 2025","str":5},{"t":"Ścianka sucha (nad poziomem cieczy) nagrzewa się szybciej; stal traci wytrzymałość powyżej 400°C.","zr":"SZP LNG 2025","str":5},{"t":"Zawór bezpieczeństwa w strefie fazy ciekłej wyrzuca ciecz.","zr":"SZP LNG 2025","str":5}]},{"etykieta":"Chłodzenie nieskuteczne — wycofaj ratowników","punkty":[{"t":"Oznaki: woda odparowuje, odkształcenia płaszcza, drgania cysterny, dudnienie lub syczenie, zadziałanie zaworu bezpieczeństwa.","zr":"SZP LNG 2025","str":5},{"t":"Rozważ wycofanie ratowników i dalsze chłodzenie prądami bezobsługowymi (działka).","zr":"SZP LNG 2025","str":5}]},{"etykieta":"Gaszenie i dalej","punkty":[{"t":"Przy skutecznym chłodzeniu rozważ ugaszenie pożaru prądami wody.","zr":"SZP LNG 2025","str":5},{"t":"Przygotuj kurtyny wodne i wentylatory Ex na wypadek zadziałania zaworu po ugaszeniu.","zr":"SZP LNG 2025","str":6},{"t":"Wyciek z armatury — kołki, kliny, włóknina zwilżona wodą, opaska dociskowa.","zr":"SZP LNG 2025","str":6},{"t":"Po likwidacji wycieku — przepompowanie do zapasowej cysterny lub kontrolowane wypalenie w pochodni (firma transportowa lub SPOT).","zr":"SZP LNG 2025","str":6}]}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":5,"sekcja":"Karta Z1 — pożar zewnętrzny (s. 5–6)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa ewakuacji osób postronnych 1,5 km; strefa zagrożenia dla ratowników 300 m. Równocześnie z rozpoznaniem intensywnie chłodź zbiornik dużą ilością wody ze stanowisk bezobsługowych. Rozpoznanie zza tarczy balistycznej: miejsce i faza wycieku, możliwość odcięcia wypływu, poziomowskaz, ciśnieniomierz, temperatura fazy ciekłej, tabliczka znamionowa, pogoda i teren.\n2. PARAMETRY: BLEVE / fireball — możliwy po ok. 45 min podgrzewania (przy sprawnych zaworach bezpieczeństwa); mało prawdopodobny dzięki izolacji; Chłodzenie — 10 l/min na m² zbiornika — tylko gdy powłoka zewnętrzna jest nienaruszona, a ciepło pochodzi z zewnątrz; Skuteczne chłodzenie — woda nie odparowuje z powierzchni zbiornika; Po zgaszeniu — chłodź cysternę jeszcze ok. 10–15 min\n3. KONTROLA CHŁODZENIA: Kontroluj temperaturę powłoki zewnętrznej pirometrem lub kamerą termowizyjną. Ścianka sucha (nad poziomem cieczy) nagrzewa się szybciej; stal traci wytrzymałość powyżej 400°C. Zawór bezpieczeństwa w strefie fazy ciekłej wyrzuca ciecz.\n4. CHŁODZENIE NIESKUTECZNE — WYCOFAJ RATOWNIKÓW: Oznaki: woda odparowuje, odkształcenia płaszcza, drgania cysterny, dudnienie lub syczenie, zadziałanie zaworu bezpieczeństwa. Rozważ wycofanie ratowników i dalsze chłodzenie prądami bezobsługowymi (działka).\n5. GASZENIE I DALEJ: Przy skutecznym chłodzeniu rozważ ugaszenie pożaru prądami wody. Przygotuj kurtyny wodne i wentylatory Ex na wypadek zadziałania zaworu po ugaszeniu. Wyciek z armatury — kołki, kliny, włóknina zwilżona wodą, opaska dociskowa. Po likwidacji wycieku — przepompowanie do zapasowej cysterny lub kontrolowane wypalenie w pochodni (firma transportowa lub SPOT)."},{"id":"KARTA-CHEM-Z2-LNG-POZAR-STRUM","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar strumieniowy lng","keywords":["jet fire","wyciek i pozar lng","pozar zaworu lng","pali sie wyciek lng","ogien z cysterny lng","palnik lng"],"aliasy":["jet fire","wyciek i pozar lng","pozar zaworu lng","pali sie wyciek lng","ogien z cysterny lng","palnik lng"],"prefix":"LNG Z2 — pożar strumieniowy (jet fire) z wycieku cysterny: strefa 300 m, kontrolowane wypalanie, chłodzenie bezobsługowe (SZP KG PSP 2025).","najpierw":[{"t":"Strefa zagrożenia dla ratowników 300 m; po ugaszeniu kontroluj ją przyrządami.","zr":"SZP LNG 2025","str":7},{"t":"Pełne ubranie specjalne z kapturem przeciwogniowym, ODO i rękawice kriogeniczne.","zr":"SZP LNG 2025","str":7},{"t":"Rozpoznanie zza tarczy balistycznej: miejsce i faza wycieku, możliwość odcięcia wypływu, przyrządy na cysternie, tabliczka znamionowa.","zr":"SZP LNG 2025","str":7}],"parametry":[{"nazwa":"Promieniowanie cieplne","wartosc":"średnio 220 kW/m² — 157% pożaru benzyny (140 kW/m²)","zr":"SZP LNG 2025","str":7},{"nazwa":"Chłodzenie zbiornika","wartosc":"10 l/(m²·min) — zaopatrzenie wodne pod tę intensywność","zr":"SZP LNG 2025","str":7},{"nazwa":"Wybuch","wartosc":"w otwartej przestrzeni mało prawdopodobny; możliwy w przestrzeniach zamkniętych i półzamkniętych","zr":"SZP LNG 2025","str":7}],"sekcje":[{"etykieta":"Działania","punkty":[{"t":"Kurtyny wodne i stacjonarne prądy rozproszone ograniczają promieniowanie cieplne.","zr":"SZP LNG 2025","str":7},{"t":"Chłodzenie bezobsługowe prądami rozproszonymi tak, by nie ogrzewać miejsc chłodzonych przez rozprężający się gaz.","zr":"SZP LNG 2025","str":7},{"t":"Kontroluj temperaturę zbiornika (pirometr, kamera) i odczyty przyrządów na cysternie.","zr":"SZP LNG 2025","str":7},{"t":"Prowadź kontrolowane wypalanie ulatniającego się gazu.","zr":"SZP LNG 2025","str":7},{"t":"Ewentualnie wentylatory Ex do rozcieńczania gazu.","zr":"SZP LNG 2025","str":7}]}],"nie_rob":[{"t":"Nie gaś pożaru, jeśli nie da się odciąć wypływu gazu.","zr":"SZP LNG 2025","str":7},{"t":"Nie podawaj wody na zawory bezpieczeństwa ani do wnętrza zbiornika.","zr":"SZP LNG 2025","str":7}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":7,"sekcja":"Karta Z2 — pożar strumieniowy (s. 7)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa zagrożenia dla ratowników 300 m; po ugaszeniu kontroluj ją przyrządami. Pełne ubranie specjalne z kapturem przeciwogniowym, ODO i rękawice kriogeniczne. Rozpoznanie zza tarczy balistycznej: miejsce i faza wycieku, możliwość odcięcia wypływu, przyrządy na cysternie, tabliczka znamionowa.\n2. PARAMETRY: Promieniowanie cieplne — średnio 220 kW/m² — 157% pożaru benzyny (140 kW/m²); Chłodzenie zbiornika — 10 l/(m²·min) — zaopatrzenie wodne pod tę intensywność; Wybuch — w otwartej przestrzeni mało prawdopodobny; możliwy w przestrzeniach zamkniętych i półzamkniętych\n3. DZIAŁANIA: Kurtyny wodne i stacjonarne prądy rozproszone ograniczają promieniowanie cieplne. Chłodzenie bezobsługowe prądami rozproszonymi tak, by nie ogrzewać miejsc chłodzonych przez rozprężający się gaz. Kontroluj temperaturę zbiornika (pirometr, kamera) i odczyty przyrządów na cysternie. Prowadź kontrolowane wypalanie ulatniającego się gazu. Ewentualnie wentylatory Ex do rozcieńczania gazu.\n4. NIE RÓB: Nie gaś pożaru, jeśli nie da się odciąć wypływu gazu. Nie podawaj wody na zawory bezpieczeństwa ani do wnętrza zbiornika."},{"id":"KARTA-CHEM-Z3-LNG-POZAR-ROZLEWISKA","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar rozlewiska lng","keywords":["pool fire","pali sie kaluza lng","rozlane lng plonie","plonacy gaz na ziemi","piana na lng","proszek lng"],"aliasy":["pool fire","pali sie kaluza lng","rozlane lng plonie","plonacy gaz na ziemi","piana na lng","proszek lng"],"prefix":"LNG Z3 — pożar rozlewiska (pool fire): strefa 300 m, piana lekka 500:1, proszek, zakaz wody i piany ciężkiej (SZP KG PSP 2025).","najpierw":[{"t":"Strefa zagrożenia dla ratowników 300 m; rozpoznanie zza tarczy balistycznej.","zr":"SZP LNG 2025","str":8},{"t":"Wody na rozlewisko LNG nie podawaj — zwiększa parowanie i pożar.","zr":"SZP LNG 2025","str":8},{"t":"Na rozlewisko piana lekka; środki gaśnicze podawaj zgodnie z kierunkiem wiatru.","zr":"SZP LNG 2025","str":8}],"parametry":[{"nazwa":"Piana lekka","wartosc":"500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s","zr":"SZP LNG 2025","str":9},{"nazwa":"Efekt piany lekkiej","wartosc":"promieniowanie cieplne mniejsze o ok. 90% w 60 s; tworzy się lód i „kominy lodowe”","zr":"SZP LNG 2025","str":9},{"nazwa":"Zakres palności","wartosc":"DGW 5% – GGW 15%; stężenia palne także poza widoczną chmurą","zr":"SZP LNG 2025","str":9},{"nazwa":"Promieniowanie cieplne","wartosc":"średnio 220 kW/m² — 157% pożaru benzyny","zr":"SZP LNG 2025","str":8}],"sekcje":[{"etykieta":"Środki gaśnicze","punkty":[{"t":"Woda tylko do chłodzenia korpusu cysterny bez wycieku; kontakt z LNG zwiększy pożar.","zr":"SZP LNG 2025","str":8},{"t":"Brak piany lekkiej — piana średnia (mniej skuteczna), podawana łagodnie pośrednio na przeszkodę.","zr":"SZP LNG 2025","str":9},{"t":"Proszek zalecany tylko, gdy zaraz po ugaszeniu można położyć pianę lekką — duże ryzyko ponownego zapłonu.","zr":"SZP LNG 2025","str":9},{"t":"Przy proszku wyznacz obserwatora skuteczności — operator działka może mieć ograniczoną widoczność.","zr":"SZP LNG 2025","str":9},{"t":"Rekomendowane łączenie piany lekkiej i proszku.","zr":"SZP LNG 2025","str":9}]},{"etykieta":"Obrona i chłodzenie","punkty":[{"t":"Prądy rozproszone na obiekty w pobliżu — ograniczenie promieniowania.","zr":"SZP LNG 2025","str":9},{"t":"Chłodzenie zbiornika bezobsługowe, bez wody na zawory i do wnętrza zbiornika; kontrolowane wypalanie gazu.","zr":"SZP LNG 2025","str":8}]},{"etykieta":"Po ugaszeniu","punkty":[{"t":"Mierz stężenie LNG w powietrzu, rozstaw kurtyny wodne; dalej jak przy wycieku bez pożaru (Z4).","zr":"SZP LNG 2025","str":9}]}],"nie_rob":[{"t":"Nie używaj piany ciężkiej.","zr":"SZP LNG 2025","str":9},{"t":"Nie podawaj wody na rozlewisko.","zr":"SZP LNG 2025","str":8}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":8,"sekcja":"Karta Z3 — pożar rozlewiska (s. 8–9)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa zagrożenia dla ratowników 300 m; rozpoznanie zza tarczy balistycznej. Wody na rozlewisko LNG nie podawaj — zwiększa parowanie i pożar. Na rozlewisko piana lekka; środki gaśnicze podawaj zgodnie z kierunkiem wiatru.\n2. PARAMETRY: Piana lekka — 500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s; Efekt piany lekkiej — promieniowanie cieplne mniejsze o ok. 90% w 60 s; tworzy się lód i „kominy lodowe”; Zakres palności — DGW 5% – GGW 15%; stężenia palne także poza widoczną chmurą; Promieniowanie cieplne — średnio 220 kW/m² — 157% pożaru benzyny\n3. ŚRODKI GAŚNICZE: Woda tylko do chłodzenia korpusu cysterny bez wycieku; kontakt z LNG zwiększy pożar. Brak piany lekkiej — piana średnia (mniej skuteczna), podawana łagodnie pośrednio na przeszkodę. Proszek zalecany tylko, gdy zaraz po ugaszeniu można położyć pianę lekką — duże ryzyko ponownego zapłonu. Przy proszku wyznacz obserwatora skuteczności — operator działka może mieć ograniczoną widoczność. Rekomendowane łączenie piany lekkiej i proszku.\n4. OBRONA I CHŁODZENIE: Prądy rozproszone na obiekty w pobliżu — ograniczenie promieniowania. Chłodzenie zbiornika bezobsługowe, bez wody na zawory i do wnętrza zbiornika; kontrolowane wypalanie gazu.\n5. PO UGASZENIU: Mierz stężenie LNG w powietrzu, rozstaw kurtyny wodne; dalej jak przy wycieku bez pożaru (Z4).\n6. NIE RÓB: Nie używaj piany ciężkiej. Nie podawaj wody na rozlewisko."},{"id":"KARTA-CHEM-Z4-LNG-WYCIEK","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zakres":"podstawowy","zrodlo":"Zasady postepowania podczas zdarzen z LNG, KG PSP","data_aktualizacji":"2026-10-25","slowo_kluczowe":"wyciek lng bez pozaru","keywords":["wyciek lng","gaz ucieka z cysterny","nieszczelna cysterna lng","biala chmura z cysterny","wyciek skroplonego gazu","chmura gazu ziemnego","cieknie lng"],"aliasy":["wyciek lng","gaz ucieka z cysterny","nieszczelna cysterna lng","biala chmura z cysterny","wyciek skroplonego gazu","chmura gazu ziemnego","cieknie lng"],"prefix":"Karta Z4 — wyciek LNG z cysterny bez pożaru.","najpierw":[{"t":"Wyznacz strefę zagrożenia 150 m wokół cysterny lub zbiornika.","str":10},{"t":"Wyeliminuj ze strefy wszystkie źródła zapłonu.","str":10},{"t":"Rozpoznanie prowadź zza osłony tarczy balistycznej.","str":10},{"t":"Sprawiaj kurtyny wodne prostopadle do kierunku wiatru, od strony zawietrznej.","str":10},{"t":"Mierz eksplozymetrem stężenie metanu — także poza widoczną chmurą.","str":10}],"parametry":[{"nazwa":"Strefa zagrożenia","wartosc":"150 m","str":10},{"nazwa":"Bezpieczne stężenie","wartosc":"do 50% DGW = 2,5%","str":10},{"nazwa":"Zakres palności","wartosc":"DGW 5% – GGW 15%","str":10},{"nazwa":"Piana lekka na rozlewisko","wartosc":"500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s","str":10}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Oceń uszkodzenia cysterny.","str":10},{"t":"Odczytaj przyrządy na cysternie: poziomowskaz, ciśnieniomierz, temperaturę fazy ciekłej oraz tabliczkę znamionową.","str":10},{"t":"Uwzględnij warunki meteorologiczne i terenowe.","str":10}]},{"etykieta":"Ograniczenie chmury gazu","punkty":[{"t":"Kurtyny i stacjonarne prądy rozproszone rozcieńczają gaz i tworzą barierę.","str":10},{"t":"Blisko wycieku gaz ściele się nisko; dalej unosi się (powyżej −107°C jest lżejszy od powietrza).","str":10},{"t":"Zorganizuj zaopatrzenie wodne odpowiednie do liczby prądów i kurtyn.","str":10},{"t":"W razie potrzeby rozcieńczaj chmurę wentylatorami w wykonaniu Ex.","str":10}]},{"etykieta":"Pomiary","punkty":[{"t":"Stężenia palne mogą występować na obrzeżach i poza widoczną chmurą.","str":10},{"t":"Sprawdzaj przestrzenie zamknięte i częściowo zamknięte — tam może dojść do wybuchu.","str":10}]},{"etykieta":"Rozlewisko","punkty":[{"t":"Ogranicz odparowanie pianą lekką położoną na powierzchnię wycieku.","str":10},{"t":"Na LNG tworzy się tafla lodu i „kominy lodowe”; piana się degraduje — uzupełniaj ją regularnie.","str":10}]},{"etykieta":"Likwidacja wycieku","punkty":[{"t":"Użyj przycisku awaryjnego — jest po obu stronach cysterny i odcina wypływ, jeśli odbywa się przez zawór.","str":10},{"t":"Zakręć zawór awaryjny.","str":10},{"t":"Uszczelnianie (kołki, kliny, włóknina, opaska dociskowa) to poziom specjalistyczny: sprzęt Ex i ochrona przed cieczami kriogenicznymi, np. rękawice kriogeniczne.","str":11}]},{"etykieta":"Po opanowaniu wycieku","punkty":[{"t":"Spróbuj przepompować LNG do zapasowej cysterny przystosowanej do przewozu LNG — przewodami kriogenicznymi.","str":11}]}],"wsparcie":[{"t":"Uszczelnienie wymaga poziomu specjalistycznego.","str":11},{"t":"Przepompowanie — środki firmy transportowej lub SPOT.","str":11}],"nie_rob":[{"t":"Nie podawaj na rozlewisko wody ani piany ciężkiej — ogrzewają LNG i przyspieszają odparowanie.","str":10},{"t":"Nie uznawaj granicy widocznej chmury za granicę zagrożenia.","str":10}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","wyciek"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":10,"sekcja":"Karta LNG"}],"content":"1. NAJPIERW: Wyznacz strefę zagrożenia 150 m wokół cysterny lub zbiornika. Wyeliminuj ze strefy wszystkie źródła zapłonu. Rozpoznanie prowadź zza osłony tarczy balistycznej. Sprawiaj kurtyny wodne prostopadle do kierunku wiatru, od strony zawietrznej. Mierz eksplozymetrem stężenie metanu — także poza widoczną chmurą.\n2. PARAMETRY: Strefa zagrożenia — 150 m; Bezpieczne stężenie — do 50% DGW = 2,5%; Zakres palności — DGW 5% – GGW 15%; Piana lekka na rozlewisko — 500:1 (±50) · 10 l/(min·m²) · warstwa 1,2 m · co 1 min przez 30 s\n3. ROZPOZNANIE: Oceń uszkodzenia cysterny. Odczytaj przyrządy na cysternie: poziomowskaz, ciśnieniomierz, temperaturę fazy ciekłej oraz tabliczkę znamionową. Uwzględnij warunki meteorologiczne i terenowe.\n4. OGRANICZENIE CHMURY GAZU: Kurtyny i stacjonarne prądy rozproszone rozcieńczają gaz i tworzą barierę. Blisko wycieku gaz ściele się nisko; dalej unosi się (powyżej −107°C jest lżejszy od powietrza). Zorganizuj zaopatrzenie wodne odpowiednie do liczby prądów i kurtyn. W razie potrzeby rozcieńczaj chmurę wentylatorami w wykonaniu Ex.\n5. POMIARY: Stężenia palne mogą występować na obrzeżach i poza widoczną chmurą. Sprawdzaj przestrzenie zamknięte i częściowo zamknięte — tam może dojść do wybuchu.\n6. ROZLEWISKO: Ogranicz odparowanie pianą lekką położoną na powierzchnię wycieku. Na LNG tworzy się tafla lodu i „kominy lodowe”; piana się degraduje — uzupełniaj ją regularnie.\n7. LIKWIDACJA WYCIEKU: Użyj przycisku awaryjnego — jest po obu stronach cysterny i odcina wypływ, jeśli odbywa się przez zawór. Zakręć zawór awaryjny. Uszczelnianie (kołki, kliny, włóknina, opaska dociskowa) to poziom specjalistyczny: sprzęt Ex i ochrona przed cieczami kriogenicznymi, np. rękawice kriogeniczne.\n8. PO OPANOWANIU WYCIEKU: Spróbuj przepompować LNG do zapasowej cysterny przystosowanej do przewozu LNG — przewodami kriogenicznymi.\n9. WEZWIJ WSPARCIE, GDY: Uszczelnienie wymaga poziomu specjalistycznego. Przepompowanie — środki firmy transportowej lub SPOT.\n10. NIE RÓB: Nie podawaj na rozlewisko wody ani piany ciężkiej — ogrzewają LNG i przyspieszają odparowanie. Nie uznawaj granicy widocznej chmury za granicę zagrożenia."},{"id":"KARTA-CHEM-Z5-LNG-ZAWORY","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zrzut cisnienia lng","keywords":["gwizda z cysterny","syk z cysterny","wyrzut z zaworu bezpieczenstwa","zawor zrzutowy lng","puszcza cisnienie lng","emisja z zaworow lng","nadcisnienie lng"],"aliasy":["gwizda z cysterny","syk z cysterny","wyrzut z zaworu bezpieczenstwa","zawor zrzutowy lng","puszcza cisnienie lng","emisja z zaworow lng","nadcisnienie lng"],"prefix":"LNG Z5 — emisja gazu przez zawory bezpieczeństwa (zrzut ciśnienia) w transporcie lub przy regazyfikacji (SZP KG PSP 2025).","najpierw":[{"t":"Strefa zagrożenia 150 m wokół cysterny lub zbiornika; usuń źródła zapłonu.","zr":"SZP LNG 2025","str":12},{"t":"Sprawdź zbiornik kamerą termowizyjną — miejscowe wychłodzenie = rozszczelnienie zbiornika wewnętrznego.","zr":"SZP LNG 2025","str":12},{"t":"Mierz stężenie metanu eksplozymetrem, także poza widoczną chmurą i w przestrzeniach zamkniętych.","zr":"SZP LNG 2025","str":12}],"parametry":[{"nazwa":"Bezpieczne stężenie","wartosc":"do 50% DGW = 2,5% obj.","zr":"SZP LNG 2025","str":12},{"nazwa":"Zakres palności","wartosc":"DGW 5% – GGW 15%","zr":"SZP LNG 2025","str":12}],"sekcje":[{"etykieta":"Kiedy przejść do Z4","punkty":[{"t":"Dodatkowy wyciek fazy ciekłej — działania z karty Z4.","zr":"SZP LNG 2025","str":12},{"t":"Zjawisko nie ustępuje — traktuj jako wyciek fazy gazowej (Z4).","zr":"SZP LNG 2025","str":12}]},{"etykieta":"Rozpoznanie","punkty":[{"t":"Uszkodzenia cysterny, poziomowskaz, ciśnieniomierz, temperatura fazy ciekłej, tabliczka znamionowa, pogoda i teren.","zr":"SZP LNG 2025","str":12}]}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng","zawory","zrzut cisnienia"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":12,"sekcja":"Emisja z zaworów bezpieczeństwa (s. 12)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa zagrożenia 150 m wokół cysterny lub zbiornika; usuń źródła zapłonu. Sprawdź zbiornik kamerą termowizyjną — miejscowe wychłodzenie = rozszczelnienie zbiornika wewnętrznego. Mierz stężenie metanu eksplozymetrem, także poza widoczną chmurą i w przestrzeniach zamkniętych.\n2. PARAMETRY: Bezpieczne stężenie — do 50% DGW = 2,5% obj.; Zakres palności — DGW 5% – GGW 15%\n3. KIEDY PRZEJŚĆ DO Z4: Dodatkowy wyciek fazy ciekłej — działania z karty Z4. Zjawisko nie ustępuje — traktuj jako wyciek fazy gazowej (Z4).\n4. ROZPOZNANIE: Uszkodzenia cysterny, poziomowskaz, ciśnieniomierz, temperatura fazy ciekłej, tabliczka znamionowa, pogoda i teren."},{"id":"KARTA-CHEM-LNG-PRZEKAZANIE","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"przekazanie miejsca zdarzenia lng","keywords":["przekazanie cysterny lng","dozor cysterny lng","po akcji lng"],"aliasy":["przekazanie cysterny lng","dozor cysterny lng","po akcji lng"],"prefix":"LNG — przekazanie miejsca zdarzenia po pożarze lub wycieku: dozór, pomiary, odległości 5 m i 20 m, przepompowanie (SZP KG PSP 2025).","najpierw":[{"t":"Przekaż właścicielowi lub użytkownikowi cysterny, zarządcy drogi, Policji lub innej instytucji — „Potwierdzenie przekazania terenu, obiektu lub mienia”.","zr":"SZP LNG 2025","str":13},{"t":"Poinformuj o działaniach z udziałem LNG, zagrożeniach i sposobie postępowania.","zr":"SZP LNG 2025","str":13}],"parametry":[{"nazwa":"Cysterna od rowów, zagłębień, studzienek, odpływów","wartosc":"min. 5 m, na otwartej przestrzeni","zr":"SZP LNG 2025","str":13},{"nazwa":"Cysterna od pojazdów, materiałów palnych, budynków","wartosc":"min. 20 m","zr":"SZP LNG 2025","str":13}],"sekcje":[{"etykieta":"Przekaż informacje o","punkty":[{"t":"Dozorze cysterny i pomiarach atmosfery (metan, eksplozymetr) — możliwe niewidoczne uszkodzenia, utrata próżni, nieszczelna armatura.","zr":"SZP LNG 2025","str":13},{"t":"Kontroli temperatury powłoki zewnętrznej (pirometr, kamera).","zr":"SZP LNG 2025","str":13},{"t":"Zabezpieczeniu miejsca przed osobami postronnymi.","zr":"SZP LNG 2025","str":13},{"t":"Przepompowaniu gazu do zapasowej cysterny lub wypaleniu w pochodni (firma transportowa lub SPOT).","zr":"SZP LNG 2025","str":13}]},{"etykieta":"Dodatkowo po wycieku (Z4, Z5)","punkty":[{"t":"Sprawdzeniu zagłębień, odpływów i studzienek — LNG zamknięty pod lodem, zalegające pary.","zr":"SZP LNG 2025","str":14},{"t":"Stosowaniu środków ochrony osobistej adekwatnych do zagrożenia.","zr":"SZP LNG 2025","str":14}]}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":13,"sekcja":"Przekazanie miejsca zdarzenia (s. 13–14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Przekaż właścicielowi lub użytkownikowi cysterny, zarządcy drogi, Policji lub innej instytucji — „Potwierdzenie przekazania terenu, obiektu lub mienia”. Poinformuj o działaniach z udziałem LNG, zagrożeniach i sposobie postępowania.\n2. PARAMETRY: Cysterna od rowów, zagłębień, studzienek, odpływów — min. 5 m, na otwartej przestrzeni; Cysterna od pojazdów, materiałów palnych, budynków — min. 20 m\n3. PRZEKAŻ INFORMACJE O: Dozorze cysterny i pomiarach atmosfery (metan, eksplozymetr) — możliwe niewidoczne uszkodzenia, utrata próżni, nieszczelna armatura. Kontroli temperatury powłoki zewnętrznej (pirometr, kamera). Zabezpieczeniu miejsca przed osobami postronnymi. Przepompowaniu gazu do zapasowej cysterny lub wypaleniu w pochodni (firma transportowa lub SPOT).\n4. DODATKOWO PO WYCIEKU (Z4, Z5): Sprawdzeniu zagłębień, odpływów i studzienek — LNG zamknięty pod lodem, zalegające pary. Stosowaniu środków ochrony osobistej adekwatnych do zagrożenia."},{"id":"KARTA-CHEM-ZAKRES-PODSTAWOWY-KDR","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Zasady organizacji ratownictwa chemicznego i ekologicznego w KSRG, Warszawa, styczeń 2025 r., wraz z Załącznikiem nr 11 — Karta graficzna SGRChem-Eko.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"ratownictwo chemiczne zakres podstawowy","keywords":["zdarzenie chemiczne","ratownictwo chemiczno ekologiczne","pierwsze działania chemia","pierwsze działania kdr chemia","zakres podstawowy chemia","nieznana substancja","substancja niebezpieczna","wyciek chemiczny","rozlewisko chemiczne","opary nieznanej substancji","dziwny zapach","beczka z ostrym zapachem","strefa i gorąca","strefa ii chłodna","strefa zagrożenia chemicznego","dekontaminacja wstępna chemia","pomiary chemiczne","sg rchem","sgrchem","sgrchem eko","kurtyna wodna chemia","materiał niebezpieczny","hazmat"],"aliasy":["chemia","zdarzenie chemiczne","ratownictwo chemiczno ekologiczne","pierwsze działania chemia","pierwsze działania kdr chemia","zakres podstawowy chemia","nieznana substancja","substancja niebezpieczna","wyciek chemiczny","rozlewisko chemiczne","opary nieznanej substancji","dziwny zapach","beczka z ostrym zapachem","strefa chemiczna","strefa zagrożenia chemicznego","dekontaminacja wstępna chemia","pomiary chemiczne","sgrchem","sgrchem eko","hazmat"],"prefix":"Ratownictwo chemiczne i ekologiczne — pierwsze działania KDR w zakresie podstawowym: dojazd, odległości, strefy, dekontaminacja wstępna, SGRChem (Zasady KG PSP 2025).","najpierw":[{"t":"Dojeżdżaj i ustawiaj pojazdy w miarę możliwości z wiatrem i w górnych partiach terenu, z możliwością wycofania sił.","zr":"RChE 2025","str":29},{"t":"Ratowanie zagrożonych ludzi ma absolutne pierwszeństwo.","zr":"RChE 2025","str":29},{"t":"Rozpoznaj materiał i miejsce zdarzenia; wyznacz strefy I i II dostępnymi przyrządami detekcyjnymi.","zr":"RChE 2025","str":29},{"t":"Zakres czynności dostosuj do kwalifikacji, wyszkolenia i wyposażenia ratowników.","zr":"RChE 2025","str":9}],"parametry":[{"nazwa":"Odległość — zagrożenie wybuchem","wartosc":"min. 150 m od miejsca zdarzenia","zr":"RChE 2025","str":29},{"nazwa":"Odległość — promieniowanie jonizujące","wartosc":"nie mniej niż wstępny promień strefy I z załączników R","zr":"RChE 2025","str":29},{"nazwa":"Odległość — pozostałe materiały","wartosc":"min. 50 m; uwzględnij pogodę, teren, infrastrukturę i dynamikę zdarzenia","zr":"RChE 2025","str":29},{"nazwa":"Strefa I (gorąca)","wartosc":"obszar nierozpoznany, wybuch/odłamki/nagły pożar, za mało lub za dużo tlenu, toksyczne gazy, pary, aerozole, patogeny, moc dawki > 100 µSv/h lub skażenie","zr":"RChE 2025","str":7},{"nazwa":"Strefa II (chłodna)","wartosc":"działania służb poza strefą I i zaplecze logistyczne; dekontaminacja na granicy stref I i II","zr":"RChE 2025","str":7},{"nazwa":"Skład w strefie I","wartosc":"min. 2 ratowników z asekuracją; 1 dopuszczalny przy zagrożeniu wybuchem lub skażeniem promieniotwórczym","zr":"RChE 2025","str":30}],"sekcje":[{"etykieta":"Minimalny zakres podstawowy","punkty":[{"t":"Rozpoznanie i zabezpieczenie miejsca zdarzenia, wyznaczenie stref; ewakuacja ludzi i zwierząt poza strefę.","zr":"RChE 2025","str":9},{"t":"Ostrzeganie, alarmowanie i informowanie ludzi o zasadach zachowania.","zr":"RChE 2025","str":9},{"t":"Pomiary przyrządami, w tym moc dawki promieniowania i szacowanie dawki efektywnej.","zr":"RChE 2025","str":9},{"t":"Ograniczanie emisji (kurtyny wodne) i skutków wycieku substancji ropopochodnych.","zr":"RChE 2025","str":10},{"t":"Dekontaminacja wstępna i KPP; współdziałanie i czynności pomocnicze, w tym wsparcie SGRChem.","zr":"RChE 2025","str":10}]},{"etykieta":"Bezpieczeństwo w strefie I","punkty":[{"t":"Sprzęt ochrony dobierz do atmosfery wybuchowej, stężenia tlenu i toksyn, mocy dawki, pola elektromagnetycznego, właściwości materiału i odporności chemicznej.","zr":"RChE 2025","str":29},{"t":"Asekuracja gotowa do natychmiastowej ewakuacji, stała łączność, kontrola czasu pracy w strefie I.","zr":"RChE 2025","str":30},{"t":"„Reguła 10 minut”: zdarzenie może nagle zmienić charakter (pożar, wybuch, reakcja) — przewiduj rozwój z wyprzedzeniem.","zr":"RChE 2025","str":30},{"t":"Przy wysokim ryzyku — manipulacja zdalna, tarcze balistyczne, drony.","zr":"RChE 2025","str":30},{"t":"Unikaj zbędnej i wtórnej kontaminacji; zapewnij zabezpieczenie medyczne.","zr":"RChE 2025","str":30}]},{"etykieta":"Dekontaminacja wstępna","punkty":[{"t":"Kluczowy jest czas — prowadzą ją pierwsze zastępy, na granicy strefy, dostępnym sprzętem.","zr":"RChE 2025","str":37},{"t":"Wobec osoby: umycie lub przetarcie odsłoniętych części ciała, usunięcie i zabezpieczenie odzieży, ubiór zastępczy.","zr":"RChE 2025","str":7},{"t":"Kolejność: strefa → ewakuacja ze strefy I do miejsca dekontaminacji → segregacja pierwotna → dekontaminacja → KPP → przekazanie ZRM.","zr":"RChE 2025","str":37},{"t":"Dekontaminacja właściwa nie jest czynnością ratowniczą — po przekazaniu poszkodowanych organizuje ją ochrona zdrowia.","zr":"RChE 2025","str":37}]},{"etykieta":"Współpraca z SGRChem","punkty":[{"t":"Potrzebę SGRChem zgłasza KDR; SK dysponuje grupę po konsultacji z jej dowódcą.","zr":"RChE 2025","str":31},{"t":"KDR: punkt przyjęcia sił, przekazanie oceny sytuacji i dokumentacji dowódcy działań SGRChem, odcinki bojowe, ewentualnie sztab.","zr":"RChE 2025","str":31},{"t":"Odcinkiem ratownictwa specjalistycznego dowodzi dowódca działań SGRChem.","zr":"RChE 2025","str":31},{"t":"Łączność: 2 kanały KRG — pierwszy dla strefy I i asekuracji, drugi dla strefy II.","zr":"RChE 2025","str":32},{"t":"KDR rozwija zaplecze logistyczne, zapewnia neutralizatory i sorbenty.","zr":"RChE 2025","str":32},{"t":"Poziomy SGRChem: A zabezpieczenie chemiczne (min. 8), B rozpoznanie (4), C rozpoznanie specjalne, D dekontaminacja, L laboratorium.","zr":"Zał. 11 RChE","str":1}]},{"etykieta":"Zakończenie","punkty":[{"t":"O zakończeniu decyduje KDR; SGRChem przekazuje mu „Informację o działaniach ratowniczych”.","zr":"RChE 2025","str":32},{"t":"Teren przekaż właścicielowi, zarządcy, użytkownikowi, organowi, Policji lub straży gminnej — „Potwierdzeniem przekazania”.","zr":"RChE 2025","str":32}]}],"nie_rob":[{"t":"Czynności specjalistycznych w strefie I nie prowadzą ratownicy bez odpowiedniego przeszkolenia.","zr":"RChE 2025","str":30},{"t":"Nie wprowadzaj do strefy I nadmiernej liczby ratowników.","zr":"RChE 2025","str":30}],"tagi_wspolne":["ratownictwo chemiczne","ratownictwo ekologiczne","zakres podstawowy","zdarzenie chemiczne","substancja niebezpieczna","strefa zagrożenia","dekontaminacja wstępna","SGRChem"],"dokumenty_zrodlowe":[{"dokument_id":"doc-chem-eko-2025","strona":9,"sekcja":"Rozdz. 1 definicje (s. 7), rozdz. 2 zakres podstawowy (s. 9–10), rozdz. 5 zasady bezpieczeństwa i organizacja (s. 29–32), rozdz. 6 dekontaminacja (s. 36–37)"},{"dokument_id":"doc-chem-eko-2025-zal11","strona":1,"sekcja":"Załącznik nr 11 — karta graficzna: poziomy gotowości SGRChem-Eko (s. 1–3)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Dojeżdżaj i ustawiaj pojazdy w miarę możliwości z wiatrem i w górnych partiach terenu, z możliwością wycofania sił. Ratowanie zagrożonych ludzi ma absolutne pierwszeństwo. Rozpoznaj materiał i miejsce zdarzenia; wyznacz strefy I i II dostępnymi przyrządami detekcyjnymi. Zakres czynności dostosuj do kwalifikacji, wyszkolenia i wyposażenia ratowników.\n2. PARAMETRY: Odległość — zagrożenie wybuchem — min. 150 m od miejsca zdarzenia; Odległość — promieniowanie jonizujące — nie mniej niż wstępny promień strefy I z załączników R; Odległość — pozostałe materiały — min. 50 m; uwzględnij pogodę, teren, infrastrukturę i dynamikę zdarzenia; Strefa I (gorąca) — obszar nierozpoznany, wybuch/odłamki/nagły pożar, za mało lub za dużo tlenu, toksyczne gazy, pary, aerozole, patogeny, moc dawki > 100 µSv/h lub skażenie; Strefa II (chłodna) — działania służb poza strefą I i zaplecze logistyczne; dekontaminacja na granicy stref I i II; Skład w strefie I — min. 2 ratowników z asekuracją; 1 dopuszczalny przy zagrożeniu wybuchem lub skażeniem promieniotwórczym\n3. MINIMALNY ZAKRES PODSTAWOWY: Rozpoznanie i zabezpieczenie miejsca zdarzenia, wyznaczenie stref; ewakuacja ludzi i zwierząt poza strefę. Ostrzeganie, alarmowanie i informowanie ludzi o zasadach zachowania. Pomiary przyrządami, w tym moc dawki promieniowania i szacowanie dawki efektywnej. Ograniczanie emisji (kurtyny wodne) i skutków wycieku substancji ropopochodnych. Dekontaminacja wstępna i KPP; współdziałanie i czynności pomocnicze, w tym wsparcie SGRChem.\n4. BEZPIECZEŃSTWO W STREFIE I: Sprzęt ochrony dobierz do atmosfery wybuchowej, stężenia tlenu i toksyn, mocy dawki, pola elektromagnetycznego, właściwości materiału i odporności chemicznej. Asekuracja gotowa do natychmiastowej ewakuacji, stała łączność, kontrola czasu pracy w strefie I. „Reguła 10 minut”: zdarzenie może nagle zmienić charakter (pożar, wybuch, reakcja) — przewiduj rozwój z wyprzedzeniem. Przy wysokim ryzyku — manipulacja zdalna, tarcze balistyczne, drony. Unikaj zbędnej i wtórnej kontaminacji; zapewnij zabezpieczenie medyczne.\n5. DEKONTAMINACJA WSTĘPNA: Kluczowy jest czas — prowadzą ją pierwsze zastępy, na granicy strefy, dostępnym sprzętem. Wobec osoby: umycie lub przetarcie odsłoniętych części ciała, usunięcie i zabezpieczenie odzieży, ubiór zastępczy. Kolejność: strefa → ewakuacja ze strefy I do miejsca dekontaminacji → segregacja pierwotna → dekontaminacja → KPP → przekazanie ZRM. Dekontaminacja właściwa nie jest czynnością ratowniczą — po przekazaniu poszkodowanych organizuje ją ochrona zdrowia.\n6. WSPÓŁPRACA Z SGRCHEM: Potrzebę SGRChem zgłasza KDR; SK dysponuje grupę po konsultacji z jej dowódcą. KDR: punkt przyjęcia sił, przekazanie oceny sytuacji i dokumentacji dowódcy działań SGRChem, odcinki bojowe, ewentualnie sztab. Odcinkiem ratownictwa specjalistycznego dowodzi dowódca działań SGRChem. Łączność: 2 kanały KRG — pierwszy dla strefy I i asekuracji, drugi dla strefy II. KDR rozwija zaplecze logistyczne, zapewnia neutralizatory i sorbenty. Poziomy SGRChem: A zabezpieczenie chemiczne (min. 8), B rozpoznanie (4), C rozpoznanie specjalne, D dekontaminacja, L laboratorium.\n7. ZAKOŃCZENIE: O zakończeniu decyduje KDR; SGRChem przekazuje mu „Informację o działaniach ratowniczych”. Teren przekaż właścicielowi, zarządcy, użytkownikowi, organowi, Policji lub straży gminnej — „Potwierdzeniem przekazania”.\n8. NIE RÓB: Czynności specjalistycznych w strefie I nie prowadzą ratownicy bez odpowiedniego przeszkolenia. Nie wprowadzaj do strefy I nadmiernej liczby ratowników."},{"id":"KARTA-CHEM-LNG-ROZPOZNANIE","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z udziałem skroplonego gazu ziemnego (LNG), wydanie I, grudzień 2025.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"rozpoznanie lng","keywords":["rozpoznanie cysterny lng","un 1972","oznakowanie cysterny lng","dojazd do cysterny lng","wlasciwosci lng"],"aliasy":["rozpoznanie cysterny lng","un 1972","oznakowanie cysterny lng","dojazd do cysterny lng","wlasciwosci lng"],"prefix":"LNG — rozpoznanie i dojazd do zdarzenia z cysterną skroplonego gazu ziemnego; właściwości i zagrożenia (SZP KG PSP 2025).","najpierw":[{"t":"Zatrzymaj pojazdy w bezpiecznej odległości — co najmniej 150 m (zagrożenie wybuchem).","zr":"SZP LNG 2025","str":3},{"t":"Dojeżdżaj w miarę możliwości z wiatrem; zapewnij możliwość wycofania sił.","zr":"SZP LNG 2025","str":3},{"t":"Widoczna chmura nie jest granicą strefy niebezpiecznej — ta jest znacznie większa.","zr":"SZP LNG 2025","str":2},{"t":"Planuj rozwój sytuacji na najbliższe 10 minut.","zr":"SZP LNG 2025","str":4}],"parametry":[{"nazwa":"Oznakowanie","wartosc":"UN 1972 — schłodzony, skroplony gaz ziemny o wysokiej zawartości metanu","zr":"SZP LNG 2025","str":3},{"nazwa":"Transport","wartosc":"ok. −162°C, ok. 2 bar; zbiornik dwupłaszczowy z próżnią","zr":"SZP LNG 2025","str":2},{"nazwa":"Ciecz → gaz","wartosc":"1 m³ LNG = 600 m³ gazu","zr":"SZP LNG 2025","str":1},{"nazwa":"Granice wybuchowości","wartosc":"ok. 4,3–16,2% obj.","zr":"SZP LNG 2025","str":1},{"nazwa":"Pary","wartosc":"zimne pary cięższe od powietrza (ścielą się, zalegają w zagłębieniach); powyżej ok. −112°C lżejsze","zr":"SZP LNG 2025","str":2}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Przed dojazdem zbierz informacje o substancji; poproś o karty charakterystyki.","zr":"SZP LNG 2025","str":3},{"t":"Uwzględnij pogodę, ukształtowanie terenu i infrastrukturę.","zr":"SZP LNG 2025","str":3},{"t":"Zbierz informacje od personelu, uczestników i świadków.","zr":"SZP LNG 2025","str":3},{"t":"Oceń stan zbiorników z dystansu (lornetka, aparat); szukaj źródeł ognia w pobliżu.","zr":"SZP LNG 2025","str":3},{"t":"Kamera termowizyjna: miejscowe obniżenie temperatury cysterny = możliwe rozszczelnienie zbiornika wewnętrznego.","zr":"SZP LNG 2025","str":4}]},{"etykieta":"Zagrożenia","punkty":[{"t":"Odmrożenia, poparzenia, wybuch, uduszenie; LNG wypiera tlen — ODO i tlenomierze.","zr":"SZP LNG 2025","str":2},{"t":"Kontakt z cieczą lub wychłodzonymi elementami — ubranie specjalne i rękawice kriogeniczne.","zr":"SZP LNG 2025","str":2},{"t":"Rollover oraz gwałtowne przejście fazowe przy kontakcie LNG z wodą (RPT).","zr":"SZP LNG 2025","str":2},{"t":"Ogrzanie cysterny powoduje gwałtowny wzrost ciśnienia.","zr":"SZP LNG 2025","str":2}]}],"tagi_wspolne":["lng","gaz skroplony","cysterna lng"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lng-2025","strona":1,"sekcja":"Właściwości i niebezpieczeństwa (s. 1–2), rozpoznanie (s. 3–4)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Zatrzymaj pojazdy w bezpiecznej odległości — co najmniej 150 m (zagrożenie wybuchem). Dojeżdżaj w miarę możliwości z wiatrem; zapewnij możliwość wycofania sił. Widoczna chmura nie jest granicą strefy niebezpiecznej — ta jest znacznie większa. Planuj rozwój sytuacji na najbliższe 10 minut.\n2. PARAMETRY: Oznakowanie — UN 1972 — schłodzony, skroplony gaz ziemny o wysokiej zawartości metanu; Transport — ok. −162°C, ok. 2 bar; zbiornik dwupłaszczowy z próżnią; Ciecz → gaz — 1 m³ LNG = 600 m³ gazu; Granice wybuchowości — ok. 4,3–16,2% obj.; Pary — zimne pary cięższe od powietrza (ścielą się, zalegają w zagłębieniach); powyżej ok. −112°C lżejsze\n3. ROZPOZNANIE: Przed dojazdem zbierz informacje o substancji; poproś o karty charakterystyki. Uwzględnij pogodę, ukształtowanie terenu i infrastrukturę. Zbierz informacje od personelu, uczestników i świadków. Oceń stan zbiorników z dystansu (lornetka, aparat); szukaj źródeł ognia w pobliżu. Kamera termowizyjna: miejscowe obniżenie temperatury cysterny = możliwe rozszczelnienie zbiornika wewnętrznego.\n4. ZAGROŻENIA: Odmrożenia, poparzenia, wybuch, uduszenie; LNG wypiera tlen — ODO i tlenomierze. Kontakt z cieczą lub wychłodzonymi elementami — ubranie specjalne i rękawice kriogeniczne. Rollover oraz gwałtowne przejście fazowe przy kontakcie LNG z wodą (RPT). Ogrzanie cysterny powoduje gwałtowny wzrost ciśnienia."},{"id":"KARTA-CHEM-B1-ZAGROZENIE-BIOLOGICZNE-GR3-GR4","wzorzec":2,"kategoria":"dzialania","grupa":"bio","zrodlo":"KG PSP: Załącznik nr B.1 do Zasad organizacji ratownictwa chemicznego i ekologicznego w KSRG (KG PSP, 2025) — postępowanie PSP przy podejrzeniu chorób szczególnie niebezpiecznych i wysoce zakaźnych.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zagrozenie biologiczne grupa 3","keywords":["zagrozenie biologiczne grupa 4","choroby szczegolnie niebezpieczne","choroby wysoce zakazne","dekontaminacja biologiczna","patogen grupa 3","patogen grupa 4","pis psp biologiczne","odpady biologiczne psp"],"aliasy":["zagrozenie biologiczne grupa 4","choroby szczegolnie niebezpieczne","choroby wysoce zakazne","dekontaminacja biologiczna","patogen grupa 3","patogen grupa 4","pis psp biologiczne","odpady biologiczne psp"],"prefix":"Zagrożenie biologiczne grupy 3 lub 4 (choroby szczególnie niebezpieczne) — dysponowanie, nadzór PIS, dekontaminacja, odpady (zał. B.1).","najpierw":[{"t":"Działania PSP prowadzone są pod nadzorem Państwowej Inspekcji Sanitarnej.","zr":"Zał. B.1","str":1},{"t":"Miejsce dekontaminacji ustala PIS w uzgodnieniu z dowódcą SGRChem; przygotowanie pod nadzorem PIS.","zr":"Zał. B.1","str":1},{"t":"Rozpoznanie i ocenę miejsca prowadzi PIS we współpracy z PSP i Policją.","zr":"Zał. B.1","str":2}],"parametry":[{"nazwa":"Grupa 3 — dysponuj","wartosc":"SGRChem z przeszkoleniem i wyposażeniem; JRG PSP do wsparcia; ratownicy medyczni z uprawnieniami","zr":"Zał. B.1","str":1},{"nazwa":"Grupa 4 — dysponuj","wartosc":"wyłącznie SGRChem z przeszkoleniem i wyposażeniem","zr":"Zał. B.1","str":1},{"nazwa":"Kwarantanna ratownika","wartosc":"decyduje PIS (np. po rozszczelnieniu kombinezonu)","zr":"Zał. B.1","str":2}],"sekcje":[{"etykieta":"Nadzór epidemiologiczny","punkty":[{"t":"PIS tworzy imienne listy uczestników działań i prowadzi nadzór epidemiologiczny po akcji — także wobec rodzin i osób z codziennego kontaktu.","zr":"Zał. B.1","str":1}]},{"etykieta":"Dekontaminacja miejsc wskazanych przez PIS","punkty":[{"t":"Bez widocznych zanieczyszczeń: małe powierzchnie — jednorazowe ściereczki dezynfekcyjne; pomieszczenie — zamgławianie.","zr":"Zał. B.1","str":2},{"t":"Zanieczyszczone materiałem biologicznym: zebrać ściereczkami higroskopijnymi, zdezynfekować powierzchnię, pomieszczenie — fumigacja.","zr":"Zał. B.1","str":2},{"t":"Odpady: czerwony worek → zamknąć, dekontaminować → drugi czerwony worek → dekontaminować → twardościenny pojemnik, oznakowany.","zr":"Zał. B.1","str":2},{"t":"Odpady złożyć w miejscu uzgodnionym z zarządcą, pod nadzorem lub w zamkniętym pomieszczeniu, do odbioru.","zr":"Zał. B.1","str":2},{"t":"Powierzchnie otwarte — po zebraniu zanieczyszczeń preparat dekontaminacyjny na duże powierzchnie.","zr":"Zał. B.1","str":3}]},{"etykieta":"Po działaniach","punkty":[{"t":"Dekontaminacja ratowników (zał. D.3), sił i środków (zał. D.2) i sprzętu (zał. D.3).","zr":"Zał. B.1","str":3},{"t":"Utylizacji podlega sprzęt jednorazowy, uszkodzony i wskazany przez PIS; zabezpieczanie odpadów nadzoruje PIS.","zr":"Zał. B.1","str":3}]}],"tagi_wspolne":["cbrne","zagrozenie biologiczne","biologia"],"dokumenty_zrodlowe":[{"dokument_id":"doc-b1-choroby-zakazne","strona":1,"sekcja":"Załącznik B.1 (s. 1–3)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Działania PSP prowadzone są pod nadzorem Państwowej Inspekcji Sanitarnej. Miejsce dekontaminacji ustala PIS w uzgodnieniu z dowódcą SGRChem; przygotowanie pod nadzorem PIS. Rozpoznanie i ocenę miejsca prowadzi PIS we współpracy z PSP i Policją.\n2. PARAMETRY: Grupa 3 — dysponuj — SGRChem z przeszkoleniem i wyposażeniem; JRG PSP do wsparcia; ratownicy medyczni z uprawnieniami; Grupa 4 — dysponuj — wyłącznie SGRChem z przeszkoleniem i wyposażeniem; Kwarantanna ratownika — decyduje PIS (np. po rozszczelnieniu kombinezonu)\n3. NADZÓR EPIDEMIOLOGICZNY: PIS tworzy imienne listy uczestników działań i prowadzi nadzór epidemiologiczny po akcji — także wobec rodzin i osób z codziennego kontaktu.\n4. DEKONTAMINACJA MIEJSC WSKAZANYCH PRZEZ PIS: Bez widocznych zanieczyszczeń: małe powierzchnie — jednorazowe ściereczki dezynfekcyjne; pomieszczenie — zamgławianie. Zanieczyszczone materiałem biologicznym: zebrać ściereczkami higroskopijnymi, zdezynfekować powierzchnię, pomieszczenie — fumigacja. Odpady: czerwony worek → zamknąć, dekontaminować → drugi czerwony worek → dekontaminować → twardościenny pojemnik, oznakowany. Odpady złożyć w miejscu uzgodnionym z zarządcą, pod nadzorem lub w zamkniętym pomieszczeniu, do odbioru. Powierzchnie otwarte — po zebraniu zanieczyszczeń preparat dekontaminacyjny na duże powierzchnie.\n5. PO DZIAŁANIACH: Dekontaminacja ratowników (zał. D.3), sił i środków (zał. D.2) i sprzętu (zał. D.3). Utylizacji podlega sprzęt jednorazowy, uszkodzony i wskazany przez PIS; zabezpieczanie odpadów nadzoruje PIS."},{"id":"KARTA-CHEM-B22-PODEJRZANA-PRZESYLKA-CBR","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Załączniki nr B.2, B.2.1 i B.2.2 do Zasad organizacji ratownictwa chemicznego i ekologicznego w KSRG (KG PSP, 2025) — niezidentyfikowana przesyłka; pomocniczo checklista przekazana przez użytkownika.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"podejrzana przesylka","keywords":["niezidentyfikowana przesylka","przesylka chemiczna","przesylka biologiczna","przesylka radiacyjna","brudna bomba","material niezidentyfikowany","algorytm b22","podejrzana paczka","checklista przesylka","checklista podejrzana przesylka","checklista niebezpieczna przesylka","niebezpieczna przesylka checklista"],"aliasy":["niezidentyfikowana przesylka","przesylka chemiczna","przesylka biologiczna","przesylka radiacyjna","brudna bomba","material niezidentyfikowany","algorytm b22","podejrzana paczka","checklista przesylka","checklista podejrzana przesylka","checklista niebezpieczna przesylka","niebezpieczna przesylka checklista"],"prefix":"Niezidentyfikowana (podejrzana) przesyłka CBR — działania PSP, kto prowadzi i przewozi, pakowanie, pierwsze zastępy (zał. B.2, B.2.1, B.2.2).","najpierw":[{"t":"SK PSP dysponuje SGRChem poziomu A i B; pozostałe jednostki wspierają SGRChem lub Policję.","zr":"Zał. B.2","str":1},{"t":"Przesyłki nie otwieraj pod żadnym pozorem.","zr":"Zał. B.2","str":6},{"t":"Kolejność sprawdzeń: urządzenie wybuchowe — Policja; zagrożenie radiacyjne i chemiczne — PSP; biologiczne — PSP z PIS (bez kontaktu z materiałem).","zr":"Zał. B.2","str":2},{"t":"Pierwsze zastępy: odgrodź miejsce, odseparuj osoby po kontakcie i dozoruj je, zamknij okna, wyłącz wentylację i klimatyzację, czekaj na SGRChem.","zr":"Checklista (mat. użytk.)","str":1}],"parametry":[{"nazwa":"Materiał wybuchowy lub „brudna bomba”","wartosc":"działania i transport: Policja; dalej saperzy, zniszczenie lub laboratorium CLKP/LK KWP","zr":"Zał. B.2.2","str":1},{"nazwa":"Materiał promieniotwórczy","wartosc":"PSP + Ekipa Dozymetryczna Prezesa PAA; transport Ekipa PAA lub ZUOP","zr":"Zał. B.2.2","str":1},{"nazwa":"Materiał chemiczny","wartosc":"PSP + Policja; transport PSP lub Policja; laboratorium CLKP, LK KWP lub BBK ABW","zr":"Zał. B.2.2","str":1},{"nazwa":"Materiał biologiczny","wartosc":"PIS + PSP; transport PIS (PSP, gdy PIS nie może); laboratorium","zr":"Zał. B.2.2","str":1},{"nazwa":"Materiał niezidentyfikowany","wartosc":"(wykluczone urządzenie wybuchowe i materiał promieniotwórczy) PSP, PIS, laboratorium; transport PSP","zr":"Zał. B.2.2","str":1}],"sekcje":[{"etykieta":"Pakowanie przesyłki (3 poziomy)","punkty":[{"t":"I: przezroczysty worek foliowy → dekontaminacja (zalecane zdjęcia) → drugi worek → dekontaminacja; w razie potrzeby trzeci.","zr":"Zał. B.2","str":6},{"t":"II: opakowanie środkowe twardościenne, szczelne, najdłuższy bok do 20 cm; przy cieczy materiał chłonny; oznaczenia „MATERIAŁ ZAKAŹNY” 6, strzałki, UN 2814.","zr":"Zał. B.2","str":6},{"t":"III: opakowanie zewnętrzne (skrzynia) unieruchomione w pojeździe, oznaczone jak wyżej.","zr":"Zał. B.2","str":7},{"t":"Duża przesyłka — sposób transportu (całość lub próbki) uzgodnij z inspektorem sanitarnym i Laboratorium PSP.","zr":"Zał. B.2","str":6}]},{"etykieta":"Transport i laboratorium","punkty":[{"t":"Nieotwarta przesyłka bez zagrożenia wybuchem i istotnego zagrożenia chemicznego — do CLKP, BBK ABW lub LK KWP; decyduje Policja z PIS i PSP.","zr":"Zał. B.2","str":2},{"t":"Transport do Laboratorium PSP: na zlecenie inspektora sanitarnego, po protokole (zał. B.2.4) wypełnionym przez dowódcę SGRChem z PIS.","zr":"Zał. B.2","str":3},{"t":"Gotowość Laboratorium PSP: dowódca → SK KP/KM → SK KW → SK KG PSP; dysponuje i odwołuje tylko SK KG PSP.","zr":"Zał. B.2","str":4}]},{"etykieta":"Kwalifikacja i dokumentacja","punkty":[{"t":"Nie jest „niezidentyfikowaną przesyłką”: rozsypany proszek lub rozlana ciecz, porzucone pojemniki, przesyłki rozszczelnione przez nieuwagę obsługi, podrzucone przedmioty.","zr":"Zał. B.2","str":8},{"t":"Podejrzenie ładunku wybuchowego z materiałem CBR — „przypuszczalne podłożenie ładunku wybuchowego”.","zr":"Zał. B.2","str":8},{"t":"Informacja ze zdarzenia: MZ chemiczne, nr ONZ 0000, kod 33 — akcje terrorystyczne.","zr":"Zał. B.2","str":7},{"t":"Działania PSP są wspomagające — możliwe czynności procesowe; uwzględnij zadania innych służb.","zr":"Zał. B.2","str":8}]},{"etykieta":"Cechy podejrzanej przesyłki","punkty":[{"t":"Nieoczekiwany nadawca lub stempel, brak nadawcy, uszkodzenie, nakłucia, nacięcia, plamy, wysypujący się proszek lub wyciek.","zr":"Zał. B.2.1","str":2},{"t":"Rozmowa z osobą po kontakcie: pozostać na miejscu, nie dotykać, zamknąć okna, przejść do innego pomieszczenia (najlepiej z łazienką), umyć ręce.","zr":"Checklista (mat. użytk.)","str":2}]}],"nie_rob":[{"t":"Nie otwieraj przesyłki.","zr":"Zał. B.2","str":6}],"tagi_wspolne":["cbrne","podejrzana przesylka"],"dokumenty_zrodlowe":[{"dokument_id":"doc-b2-przesylka","strona":1,"sekcja":"Załącznik B.2 — zasady działań PSP (s. 1–8)"},{"dokument_id":"doc-b22-przesylka","strona":1,"sekcja":"Załącznik B.2.2 — algorytm (s. 1)"},{"dokument_id":"doc-b21-przesylka","strona":2,"sekcja":"Załącznik B.2.1 — cechy przesyłki (s. 2)"},{"dokument_id":"doc-checklista-niebezpieczna-przesylka","strona":1,"sekcja":"Materiał pomocniczy użytkownika (s. 1–2)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: SK PSP dysponuje SGRChem poziomu A i B; pozostałe jednostki wspierają SGRChem lub Policję. Przesyłki nie otwieraj pod żadnym pozorem. Kolejność sprawdzeń: urządzenie wybuchowe — Policja; zagrożenie radiacyjne i chemiczne — PSP; biologiczne — PSP z PIS (bez kontaktu z materiałem). Pierwsze zastępy: odgrodź miejsce, odseparuj osoby po kontakcie i dozoruj je, zamknij okna, wyłącz wentylację i klimatyzację, czekaj na SGRChem.\n2. PARAMETRY: Materiał wybuchowy lub „brudna bomba” — działania i transport: Policja; dalej saperzy, zniszczenie lub laboratorium CLKP/LK KWP; Materiał promieniotwórczy — PSP + Ekipa Dozymetryczna Prezesa PAA; transport Ekipa PAA lub ZUOP; Materiał chemiczny — PSP + Policja; transport PSP lub Policja; laboratorium CLKP, LK KWP lub BBK ABW; Materiał biologiczny — PIS + PSP; transport PIS (PSP, gdy PIS nie może); laboratorium; Materiał niezidentyfikowany — (wykluczone urządzenie wybuchowe i materiał promieniotwórczy) PSP, PIS, laboratorium; transport PSP\n3. PAKOWANIE PRZESYŁKI (3 POZIOMY): I: przezroczysty worek foliowy → dekontaminacja (zalecane zdjęcia) → drugi worek → dekontaminacja; w razie potrzeby trzeci. II: opakowanie środkowe twardościenne, szczelne, najdłuższy bok do 20 cm; przy cieczy materiał chłonny; oznaczenia „MATERIAŁ ZAKAŹNY” 6, strzałki, UN 2814. III: opakowanie zewnętrzne (skrzynia) unieruchomione w pojeździe, oznaczone jak wyżej. Duża przesyłka — sposób transportu (całość lub próbki) uzgodnij z inspektorem sanitarnym i Laboratorium PSP.\n4. TRANSPORT I LABORATORIUM: Nieotwarta przesyłka bez zagrożenia wybuchem i istotnego zagrożenia chemicznego — do CLKP, BBK ABW lub LK KWP; decyduje Policja z PIS i PSP. Transport do Laboratorium PSP: na zlecenie inspektora sanitarnego, po protokole (zał. B.2.4) wypełnionym przez dowódcę SGRChem z PIS. Gotowość Laboratorium PSP: dowódca → SK KP/KM → SK KW → SK KG PSP; dysponuje i odwołuje tylko SK KG PSP.\n5. KWALIFIKACJA I DOKUMENTACJA: Nie jest „niezidentyfikowaną przesyłką”: rozsypany proszek lub rozlana ciecz, porzucone pojemniki, przesyłki rozszczelnione przez nieuwagę obsługi, podrzucone przedmioty. Podejrzenie ładunku wybuchowego z materiałem CBR — „przypuszczalne podłożenie ładunku wybuchowego”. Informacja ze zdarzenia: MZ chemiczne, nr ONZ 0000, kod 33 — akcje terrorystyczne. Działania PSP są wspomagające — możliwe czynności procesowe; uwzględnij zadania innych służb.\n6. CECHY PODEJRZANEJ PRZESYŁKI: Nieoczekiwany nadawca lub stempel, brak nadawcy, uszkodzenie, nakłucia, nacięcia, plamy, wysypujący się proszek lub wyciek. Rozmowa z osobą po kontakcie: pozostać na miejscu, nie dotykać, zamknąć okna, przejść do innego pomieszczenia (najlepiej z łazienką), umyć ręce.\n7. NIE RÓB: Nie otwieraj przesyłki."},{"id":"KARTA-CHEM-R1-OCHRONA-RADIOLOGICZNA","wzorzec":2,"kategoria":"informacja","grupa":"cbrn","zrodlo":"KG PSP: Załącznik nr R.1 do Zasad organizacji ratownictwa chemicznego i ekologicznego w KSRG (KG PSP, 2025) — ochrona radiologiczna, podstawowe informacje.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zasady ochrony radiologicznej","keywords":["ochrona radiologiczna","informacje o zdarzeniu radiacyjnym","strefa goraca promieniowanie","promieniowanie alfa beta gamma neutronowe","transport materialow promieniotworczych","wskaznik transportowy ti","wzorcowanie dozymetrow","skazenie promieniotworcze","moc dawki"],"aliasy":["ochrona radiologiczna","informacje o zdarzeniu radiacyjnym","strefa goraca promieniowanie","promieniowanie alfa beta gamma neutronowe","transport materialow promieniotworczych","wskaznik transportowy ti","wzorcowanie dozymetrow","skazenie promieniotworcze","moc dawki"],"prefix":"Ochrona radiologiczna — strefa I (100 µSv/h), rodzaje promieniowania i osłony, limity dawek, transport (zał. R.1).","najpierw":[{"t":"Strefa I (gorąca): możliwe skażenie promieniotwórcze lub moc dawki > 100 µSv/h.","zr":"Zał. R.1","str":1},{"t":"Czas, odległość, osłona: 2× dalej = 4× bezpieczniej; dawka rośnie proporcjonalnie do czasu.","zr":"Zał. R.1","str":2},{"t":"Alfa, beta, gamma: bezwzględnie filtrujący sprzęt OUO i min. ubranie specjalne PN-EN 469.","zr":"Zał. R.1","str":3}],"parametry":[{"nazwa":"Usuń ludzi z terenu, gdy","wartosc":"≥ 1000 Bq/cm² (gamma, beta) · ≥ 100 Bq/cm² (alfa) · moc dawki > 100 µSv/h","zr":"Zał. R.1","str":1},{"nazwa":"Dawka funkcjonariusza","wartosc":"max 1 mSv/rok; do 5 mSv przy średniej 1 mSv/rok w kolejnych 5 latach","zr":"Zał. R.1","str":3},{"nazwa":"Wzorcowanie przyrządów","wartosc":"co 12 mies. (bez źródła kontrolnego) / 24 mies. (ze źródłem); akredytowane laboratorium","zr":"Zał. R.1","str":6}],"sekcje":[{"etykieta":"Rodzaje promieniowania","punkty":[{"t":"Alfa: zasięg do 10 cm, zatrzyma naskórek lub kartka — groźne wewnętrznie (wdychanie, połknięcie).","zr":"Zał. R.1","str":2},{"t":"Beta: zasięg do 10 m; osłony — tworzywa, aluminium, zabudowa; nie stosuj ołowiu (promieniowanie hamowania).","zr":"Zał. R.1","str":2},{"t":"Gamma i neutronowe: nieograniczony zasięg; osłony — beton, ołów, żelazo, zabudowa (tylko osłabiają).","zr":"Zał. R.1","str":2},{"t":"Najgroźniejsze jest narażenie wewnętrzne; maska chroni przed aerozolami, nie przed promieniowaniem zewnętrznym.","zr":"Zał. R.1","str":3}]},{"etykieta":"Transport (ADR rozdz. 7)","punkty":[{"t":"Pojazd: 2 tablice pomarańczowe, 3 nalepki 7D (boki i tył).","zr":"Zał. R.1","str":4},{"t":"Kategorie sztuk przesyłki: I-BIAŁA, II-ŻÓŁTA, III-ŻÓŁTA wg mocy dawki na powierzchni i wskaźnika TI.","zr":"Zał. R.1","str":5},{"t":"TI — najwyższa moc dawki 1 m od powierzchni sztuki przesyłki (µSv/h ÷ 10).","zr":"Zał. R.1","str":5}]}],"nie_rob":[{"t":"Nie osłaniaj promieniowania beta ołowiem.","zr":"Zał. R.1","str":2}],"tagi_wspolne":["cbrne","radiacja","zdarzenie radiacyjne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-r1-radiologia","strona":1,"sekcja":"Załącznik R.1 (s. 1–8)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Strefa I (gorąca): możliwe skażenie promieniotwórcze lub moc dawki > 100 µSv/h. Czas, odległość, osłona: 2× dalej = 4× bezpieczniej; dawka rośnie proporcjonalnie do czasu. Alfa, beta, gamma: bezwzględnie filtrujący sprzęt OUO i min. ubranie specjalne PN-EN 469.\n2. PARAMETRY: Usuń ludzi z terenu, gdy — ≥ 1000 Bq/cm² (gamma, beta) · ≥ 100 Bq/cm² (alfa) · moc dawki > 100 µSv/h; Dawka funkcjonariusza — max 1 mSv/rok; do 5 mSv przy średniej 1 mSv/rok w kolejnych 5 latach; Wzorcowanie przyrządów — co 12 mies. (bez źródła kontrolnego) / 24 mies. (ze źródłem); akredytowane laboratorium\n3. RODZAJE PROMIENIOWANIA: Alfa: zasięg do 10 cm, zatrzyma naskórek lub kartka — groźne wewnętrznie (wdychanie, połknięcie). Beta: zasięg do 10 m; osłony — tworzywa, aluminium, zabudowa; nie stosuj ołowiu (promieniowanie hamowania). Gamma i neutronowe: nieograniczony zasięg; osłony — beton, ołów, żelazo, zabudowa (tylko osłabiają). Najgroźniejsze jest narażenie wewnętrzne; maska chroni przed aerozolami, nie przed promieniowaniem zewnętrznym.\n4. TRANSPORT (ADR ROZDZ. 7): Pojazd: 2 tablice pomarańczowe, 3 nalepki 7D (boki i tył). Kategorie sztuk przesyłki: I-BIAŁA, II-ŻÓŁTA, III-ŻÓŁTA wg mocy dawki na powierzchni i wskaźnika TI. TI — najwyższa moc dawki 1 m od powierzchni sztuki przesyłki (µSv/h ÷ 10).\n5. NIE RÓB: Nie osłaniaj promieniowania beta ołowiem."},{"id":"KARTA-CHEM-R2-ZDARZENIA-RADIACYJNE-ZAKRES-PODSTAWOWY","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"KG PSP: Załącznik nr R.2 do Zasad organizacji ratownictwa chemicznego i ekologicznego w KSRG (KG PSP, 2025) — działania podczas zdarzeń radiacyjnych, zakres podstawowy.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"dzialania podstawowe zdarzenie radiacyjne","keywords":["zdarzenie radiacyjne zakres podstawowy","promieniowanie zakres podstawowy psp","rozpoznanie radiacyjne","pozar material promieniotworczy","ewidencja dawek promieniowanie","strefa goraca radiacja","r2 radiologiczne","material promieniotworczy psp","pozar materialu promieniotworczego","pozar z materialem promieniotworczym"],"aliasy":["zdarzenie radiacyjne zakres podstawowy","promieniowanie zakres podstawowy psp","rozpoznanie radiacyjne","pozar material promieniotworczy","ewidencja dawek promieniowanie","strefa goraca radiacja","r2 radiologiczne","material promieniotworczy psp","pozar materialu promieniotworczego","pozar z materialem promieniotworczym"],"prefix":"Zdarzenie radiacyjne — zakres podstawowy: rozpoznanie, strefa 3 m / 100 µSv/h, pożar 30 m, dawki ratowników (zał. R.2).","najpierw":[{"t":"Dojazd z wiatrem; siły i środki min. 50 m od miejsca zdarzenia.","zr":"Zał. R.2","str":2},{"t":"Nie zbliżaj się bez włączonego miernika mocy dawki; uruchom dawkomierz indywidualny.","zr":"Zał. R.2","str":2},{"t":"Nie wiesz, czy materiał się uwolnił — przyjmij, że tak (pesymizacja): PN-EN 469 i min. filtrujący OUO.","zr":"Zał. R.2","str":2},{"t":"Nie dotykaj i nie przemieszczaj uszkodzonego pojemnika.","zr":"Zał. R.2","str":3}],"parametry":[{"nazwa":"Strefa I","wartosc":"min. 3 m; zwiększ, aż na granicy będzie ≤ 100 µSv/h; w budynku — ściany pomieszczenia","zr":"Zał. R.2","str":3},{"nazwa":"100 µSv/h dalej niż 1 m","wartosc":"nie podchodź do pojemnika","zr":"Zał. R.2","str":4},{"nazwa":"Pożar","wartosc":"strefa min. 30 m; pożar pojazdu — max 30 min pracy w strefie","zr":"Zał. R.2","str":4},{"nazwa":"Dawka 1000 µSv","wartosc":"jednorazowo: badania lekarskie i odsunięcie od strefy I do końca roku; zgłoszenie do KCKR w 3 dni","zr":"Zał. R.2","str":6}],"sekcje":[{"etykieta":"Strefy i ewakuacja","punkty":[{"t":"Strefa II (z uwzględnieniem wiatru): punkt dowodzenia, zbiórka ewakuowanych, KPP.","zr":"Zał. R.2","str":1},{"t":"Nigdy nie ewakuuj ludzi w miejsce stacjonowania sił i środków.","zr":"Zał. R.2","str":3},{"t":"Ewakuowanych przekaż ZRM z informacją o podejrzeniu skażenia i pobycie w strefie > 100 µSv/h.","zr":"Zał. R.2","str":2},{"t":"Oznaki skażenia — zdejmij całe ubranie z butami i biżuterią; podwójny worek, oznakowane miejsce.","zr":"Zał. R.2","str":2}]},{"etykieta":"Pomiary","punkty":[{"t":"Dawkomierz na wysokości klatki piersiowej, przed pomiarem wskazuje zero.","zr":"Zał. R.2","str":3},{"t":"Miernik włącz przy tle naturalnym, odczekaj min. 10 s; wskazanie nigdy nie może wynosić 0.","zr":"Zał. R.2","str":4},{"t":"Rejestruj czas ratowników w strefie I i moc dawki; dawka = moc dawki × czas (Dp = D × t).","zr":"Zał. R.2","str":5}]},{"etykieta":"Pożar","punkty":[{"t":"W pomieszczeniach zamkniętych tylko 1 rota; w otwartych rozważ 1 ratownika z asekuracją.","zr":"Zał. R.2","str":4},{"t":"Proszek lub piana średnia/ciężka; prądy rozproszone wody tylko wyjątkowo, z bezpiecznej odległości; środków jak najmniej.","zr":"Zał. R.2","str":4},{"t":"Po działaniach ratownicy zdejmują SOI i są wyłączeni do oceny skażenia; skażenie mierzy tylko SGRChem.","zr":"Zał. R.2","str":4}]}],"nie_rob":[{"t":"Nie stosuj zwartych prądów wody.","zr":"Zał. R.2","str":4},{"t":"Nie prowadź ewakuacji w miejsce stacjonowania sił.","zr":"Zał. R.2","str":3}],"tagi_wspolne":["cbrne","radiacja","zdarzenie radiacyjne","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-r2-radiologia","strona":1,"sekcja":"Załącznik R.2 (s. 1–6)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Dojazd z wiatrem; siły i środki min. 50 m od miejsca zdarzenia. Nie zbliżaj się bez włączonego miernika mocy dawki; uruchom dawkomierz indywidualny. Nie wiesz, czy materiał się uwolnił — przyjmij, że tak (pesymizacja): PN-EN 469 i min. filtrujący OUO. Nie dotykaj i nie przemieszczaj uszkodzonego pojemnika.\n2. PARAMETRY: Strefa I — min. 3 m; zwiększ, aż na granicy będzie ≤ 100 µSv/h; w budynku — ściany pomieszczenia; 100 µSv/h dalej niż 1 m — nie podchodź do pojemnika; Pożar — strefa min. 30 m; pożar pojazdu — max 30 min pracy w strefie; Dawka 1000 µSv — jednorazowo: badania lekarskie i odsunięcie od strefy I do końca roku; zgłoszenie do KCKR w 3 dni\n3. STREFY I EWAKUACJA: Strefa II (z uwzględnieniem wiatru): punkt dowodzenia, zbiórka ewakuowanych, KPP. Nigdy nie ewakuuj ludzi w miejsce stacjonowania sił i środków. Ewakuowanych przekaż ZRM z informacją o podejrzeniu skażenia i pobycie w strefie > 100 µSv/h. Oznaki skażenia — zdejmij całe ubranie z butami i biżuterią; podwójny worek, oznakowane miejsce.\n4. POMIARY: Dawkomierz na wysokości klatki piersiowej, przed pomiarem wskazuje zero. Miernik włącz przy tle naturalnym, odczekaj min. 10 s; wskazanie nigdy nie może wynosić 0. Rejestruj czas ratowników w strefie I i moc dawki; dawka = moc dawki × czas (Dp = D × t).\n5. POŻAR: W pomieszczeniach zamkniętych tylko 1 rota; w otwartych rozważ 1 ratownika z asekuracją. Proszek lub piana średnia/ciężka; prądy rozproszone wody tylko wyjątkowo, z bezpiecznej odległości; środków jak najmniej. Po działaniach ratownicy zdejmują SOI i są wyłączeni do oceny skażenia; skażenie mierzy tylko SGRChem.\n6. NIE RÓB: Nie stosuj zwartych prądów wody. Nie prowadź ewakuacji w miejsce stacjonowania sił."},{"id":"DEZ-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"dezaktywacja samochodu elektrycznego","keywords":["dezaktywacja ev","odlaczenie wysokiego napiecia","jak wylaczyc elektryka","petla ratownicza ev","rozlaczenie baterii trakcyjnej","odciecie 12v","wylaczenie samochodu elektrycznego","dezaktywacja tesli","wylaczenie wysokiego napiecia ev"],"aliasy":["dezaktywacja ev","odlaczenie wysokiego napiecia","jak wylaczyc elektryka","petla ratownicza ev","rozlaczenie baterii trakcyjnej","odciecie 12v","wylaczenie samochodu elektrycznego","dezaktywacja tesli","wylaczenie wysokiego napiecia ev"],"prefix":"Dezaktywacja i zabezpieczenie samochodu elektrycznego lub hybrydowego — kolejność wg SZP KG PSP (2023).","najpierw":[{"t":"Do pełnej identyfikacji zakładaj, że pojazd ma napęd elektryczny.","zr":"SZP EV","str":4},{"t":"Przed zablokowaniem ruchu nie stój przed ani za pojazdem — pracującego silnika elektrycznego nie słychać.","zr":"SZP EV","str":5},{"t":"Pozyskaj kartę ratowniczą modelu (RescueCode, Euro Rescue, Crash Recovery System, kod QR, karta w pojeździe).","zr":"SZP EV","str":3}],"parametry":[{"nazwa":"Napięcie ogniw (DC)","wartosc":"200–950 V","zr":"SZP EV","str":2},{"nazwa":"Napięcie silnika (AC)","wartosc":"400–650 V","zr":"SZP EV","str":2},{"nazwa":"Prąd po wyłączeniu WN","wartosc":"utrzymuje się kilka–kilkanaście minut","zr":"SZP EV","str":7}],"sekcje":[{"etykieta":"Działania obowiązkowe — kolejno","punkty":[{"t":"Zablokuj ruch pojazdu do przodu i do tyłu (kliny); dodatkowo włóż do gniazda niepodłączoną wtyczkę kabla ładowania.","zr":"SZP EV","str":5},{"t":"Gdy świeci „READY” / „POWER ON” — wyłącz silnik przyciskiem lub kluczykiem.","zr":"SZP EV","str":5},{"t":"Ustaw „N” lub „P”, zaciągnij hamulec postojowy.","zr":"SZP EV","str":6},{"t":"Na końcu odłącz akumulator 12 V: najpierw biegun ujemny; zabezpiecz przewody przed zwarciem.","zr":"SZP EV","str":6}]},{"etykieta":"Uwaga przy 12 V","punkty":[{"t":"Za wczesne odłączenie 12 V może uniemożliwić otwarcie drzwi i bagażnika, przesunięcie fotela, kierownicy oraz obsługę hamulca postojowego.","zr":"SZP EV","str":6},{"t":"W niektórych pojazdach odłączenie 12 V nie wyłącza układu WN — pojazd może nadal ruszyć.","zr":"SZP EV","str":6}]},{"etykieta":"Działania alternatywne (wg karty ratowniczej)","punkty":[{"t":"Wyjmij wyłącznik awaryjny WN („zwora”, rozłącznik serwisowy) albo przetnij wskazaną pętlę w dwóch miejscach (wytnij odcinek).","zr":"SZP EV","str":7},{"t":"Przy tej czynności: hełm z opuszczoną przyłbicą i rękawice dielektryczne — ryzyko łuku elektrycznego.","zr":"SZP EV","str":7},{"t":"Jeśli karta ratownicza tak wskazuje — wyjmij bezpiecznik układu WN (może być w kilku miejscach).","zr":"SZP EV","str":8}]},{"etykieta":"Kluczyk lub karta","punkty":[{"t":"Odsuń kluczyk na wskazaną odległość (zwykle 5 m) tylko, gdy karta ratownicza na to pozwala; przy wątpliwościach zaniechaj.","zr":"SZP EV","str":5},{"t":"Bez rozpoznania kluczyka system bezkluczykowy może zamknąć drzwi, szyby lub dach.","zr":"SZP EV","str":5}]}],"nie_rob":[{"t":"Nie utożsamiaj pomarańczowych przewodów WN z pętlą do przecięcia (zwykle czerwona).","zr":"SZP EV","str":7},{"t":"Nie demontuj, nie przecinaj, nie zgniataj elementów WN i akumulatora, nie otwieraj obudowy.","zr":"SZP EV","str":4}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","dezaktywacja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":5,"sekcja":"Dezaktywacja i zabezpieczenie samochodu (s. 5–8)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Do pełnej identyfikacji zakładaj, że pojazd ma napęd elektryczny. Przed zablokowaniem ruchu nie stój przed ani za pojazdem — pracującego silnika elektrycznego nie słychać. Pozyskaj kartę ratowniczą modelu (RescueCode, Euro Rescue, Crash Recovery System, kod QR, karta w pojeździe).\n2. PARAMETRY: Napięcie ogniw (DC) — 200–950 V; Napięcie silnika (AC) — 400–650 V; Prąd po wyłączeniu WN — utrzymuje się kilka–kilkanaście minut\n3. DZIAŁANIA OBOWIĄZKOWE — KOLEJNO: Zablokuj ruch pojazdu do przodu i do tyłu (kliny); dodatkowo włóż do gniazda niepodłączoną wtyczkę kabla ładowania. Gdy świeci „READY” / „POWER ON” — wyłącz silnik przyciskiem lub kluczykiem. Ustaw „N” lub „P”, zaciągnij hamulec postojowy. Na końcu odłącz akumulator 12 V: najpierw biegun ujemny; zabezpiecz przewody przed zwarciem.\n4. UWAGA PRZY 12 V: Za wczesne odłączenie 12 V może uniemożliwić otwarcie drzwi i bagażnika, przesunięcie fotela, kierownicy oraz obsługę hamulca postojowego. W niektórych pojazdach odłączenie 12 V nie wyłącza układu WN — pojazd może nadal ruszyć.\n5. DZIAŁANIA ALTERNATYWNE (WG KARTY RATOWNICZEJ): Wyjmij wyłącznik awaryjny WN („zwora”, rozłącznik serwisowy) albo przetnij wskazaną pętlę w dwóch miejscach (wytnij odcinek). Przy tej czynności: hełm z opuszczoną przyłbicą i rękawice dielektryczne — ryzyko łuku elektrycznego. Jeśli karta ratownicza tak wskazuje — wyjmij bezpiecznik układu WN (może być w kilku miejscach).\n6. KLUCZYK LUB KARTA: Odsuń kluczyk na wskazaną odległość (zwykle 5 m) tylko, gdy karta ratownicza na to pozwala; przy wątpliwościach zaniechaj. Bez rozpoznania kluczyka system bezkluczykowy może zamknąć drzwi, szyby lub dach.\n7. NIE RÓB: Nie utożsamiaj pomarańczowych przewodów WN z pętlą do przecięcia (zwykle czerwona). Nie demontuj, nie przecinaj, nie zgniataj elementów WN i akumulatora, nie otwieraj obudowy."},{"id":"KARTA-PV-INFORMACJE-DODATKOWE","wzorzec":2,"kategoria":"informacje","grupa":"pv","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń w obrębie instalacji fotowoltaicznych (SZP nr 6), wydanie I, marzec 2022.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"informacje dodatkowe pv","keywords":["ostroznosc pv","hot stick pv","prad staly pv","moduly pv ostroznosc","bezpieczenstwo fotowoltaika"],"aliasy":["ostroznosc pv","hot stick pv","prad staly pv","moduly pv ostroznosc","bezpieczenstwo fotowoltaika"],"prefix":"Instalacja fotowoltaiczna (PV) — zagrożenia i środki ostrożności (SZP KG PSP 2022).","najpierw":[{"t":"Nie wchodź i nie poruszaj się po modułach PV.","zr":"SZP PV 2022","str":16},{"t":"Po rozłączeniu AC nadal może być niebezpieczne napięcie DC między modułami a falownikiem.","zr":"SZP PV 2022","str":16},{"t":"Przed rozłączeniem modułów wyłącz falownik — inaczej w zamkniętym obwodzie powstanie łuk.","zr":"SZP PV 2022","str":16},{"t":"Jest magazyn energii — zawsze wyłączaj falownik.","zr":"SZP PV 2022","str":16}],"parametry":[{"nazwa":"Napięcie systemów PV","wartosc":"do 1500 V DC","zr":"SZP PV 2022","str":7},{"nazwa":"Hot Stick","wartosc":"nie wykrywa prądu stałego z modułów PV","zr":"SZP PV 2022","str":16},{"nazwa":"Zgłoszenie do KP/KM PSP","wartosc":"instalacje powyżej 6,5 kW — informacja o zakończeniu robót (do planowania działań)","zr":"SZP PV 2022","str":16}],"sekcje":[{"etykieta":"Zagrożenia","punkty":[{"t":"Łuk elektryczny przy rozłączaniu pod napięciem — np. uderzenie toporem w przewód; po przecięciu odcinek od modułów nadal jest pod napięciem.","zr":"SZP PV 2022","str":6},{"t":"Napięcie DC także po zmierzchu — moduły pracują przy świetle płomienia i oświetleniu miejsca działań.","zr":"SZP PV 2022","str":6},{"t":"Jeden uszkodzony moduł, złącze lub przewód może dać napięcie na konstrukcji i metalowych elementach obiektu.","zr":"SZP PV 2022","str":6},{"t":"Upadek z wysokości, spadające elementy (zwłaszcza moduły na elewacji), balast betonowy na dachach płaskich.","zr":"SZP PV 2022","str":6},{"t":"Toksyczne produkty spalania: tellurek kadmu, arsenek galu, fosfor, chlorowodór z izolacji.","zr":"SZP PV 2022","str":6}]}],"nie_rob":[{"t":"Nie niszcz ani nie przecinaj przewodów zasilających instalacji PV.","zr":"SZP PV 2022","str":6},{"t":"Zakrycie modułów plandeką lub pianą sprężoną nie gwarantuje ochrony przed porażeniem.","zr":"SZP PV 2022","str":16}],"tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":6,"sekcja":"Zagrożenia (s. 6–7), informacje dodatkowe (s. 16)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Nie wchodź i nie poruszaj się po modułach PV. Po rozłączeniu AC nadal może być niebezpieczne napięcie DC między modułami a falownikiem. Przed rozłączeniem modułów wyłącz falownik — inaczej w zamkniętym obwodzie powstanie łuk. Jest magazyn energii — zawsze wyłączaj falownik.\n2. PARAMETRY: Napięcie systemów PV — do 1500 V DC; Hot Stick — nie wykrywa prądu stałego z modułów PV; Zgłoszenie do KP/KM PSP — instalacje powyżej 6,5 kW — informacja o zakończeniu robót (do planowania działań)\n3. ZAGROŻENIA: Łuk elektryczny przy rozłączaniu pod napięciem — np. uderzenie toporem w przewód; po przecięciu odcinek od modułów nadal jest pod napięciem. Napięcie DC także po zmierzchu — moduły pracują przy świetle płomienia i oświetleniu miejsca działań. Jeden uszkodzony moduł, złącze lub przewód może dać napięcie na konstrukcji i metalowych elementach obiektu. Upadek z wysokości, spadające elementy (zwłaszcza moduły na elewacji), balast betonowy na dachach płaskich. Toksyczne produkty spalania: tellurek kadmu, arsenek galu, fosfor, chlorowodór z izolacji.\n4. NIE RÓB: Nie niszcz ani nie przecinaj przewodów zasilających instalacji PV. Zakrycie modułów plandeką lub pianą sprężoną nie gwarantuje ochrony przed porażeniem."},{"id":"KARTA-PV-Z1-POZAR","wzorzec":2,"kategoria":"dzialania","grupa":"pv","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń w obrębie instalacji fotowoltaicznych (SZP nr 6), wydanie I, marzec 2022.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar fotowoltaiki","keywords":["pozar pv","pozar instalacji pv","gaszenie pv","gaszenie fotowoltaiki","moduly pv pozar","magazyn energii pozar","fotowoltaika plonie"],"aliasy":["pozar pv","pozar instalacji pv","gaszenie pv","gaszenie fotowoltaiki","moduly pv pozar","magazyn energii pozar","fotowoltaika plonie"],"prefix":"PV Z1 — pożar instalacji fotowoltaicznej i magazynu energii: ocena, działania, minimalne odległości podawania środków gaśniczych (SZP KG PSP 2022).","najpierw":[{"t":"Podzespoły PV nie są objęte ani zagrożone pożarem — stosuj standardową taktykę gaszenia.","zr":"SZP PV 2022","str":12},{"t":"Wyznacz strefę zagrożenia; przy bezpośrednim zagrożeniu życia — natychmiastowa ewakuacja.","zr":"SZP PV 2022","str":12},{"t":"Ostrzeż ratowników, odłącz prąd do budynku; jest magazyn energii — wyłącz falownik.","zr":"SZP PV 2022","str":12},{"t":"Bez informacji o stanie instalacji — SOI do pracy przy urządzeniach pod napięciem oraz ochrona układu oddechowego.","zr":"SZP PV 2022","str":12}],"parametry":[{"nazwa":"Woda, prąd rozproszony","wartosc":"min. 1 m, kąt rozproszenia min. 30° — tylko prądownice PWT Ø52 „Turbo”","zr":"SZP PV 2022","str":12},{"nazwa":"Woda, prąd zwarty","wartosc":"≤ 250 l/min: min. 5 m · > 250 l/min: min. 10 m — tylko prądownice PWT Ø52 „Turbo”","zr":"SZP PV 2022","str":12},{"nazwa":"Piana CAFS (max 250 l/min)","wartosc":"rozproszony 1 m · zwarty 5 m — tylko prądownice dopuszczone do urządzeń pod napięciem (PWT „Turbo” lub pyszczek do 25 mm)","zr":"SZP PV 2022","str":12},{"nazwa":"Proszki i gazy gaśnicze","wartosc":"min. 1 m lub więcej, jeśli tak wskazano na urządzeniu","zr":"SZP PV 2022","str":13}],"sekcje":[{"etykieta":"Ocena sytuacji","punkty":[{"t":"Oceń stan instalacji z zewnątrz, np. kamerą termowizyjną: okopcenie, przebarwienia, uszkodzone złącza = możliwe napięcie na metalu.","zr":"SZP PV 2022","str":12},{"t":"Hot Stick nie wykrywa prądu stałego generowanego przez moduły.","zr":"SZP PV 2022","str":12}]},{"etykieta":"Gaszenie","punkty":[{"t":"Dozwolone: woda (także ze zwilżaczami), piana sprężona, proszki, gazy gaśnicze.","zr":"SZP PV 2022","str":12},{"t":"Magazyn energii — gaś wodą (chłodzenie); proszki i gazy mogą być nieskuteczne. Kontroluj kamerą termowizyjną lub pirometrem.","zr":"SZP PV 2022","str":13},{"t":"Ugaszone akumulatory zabezpiecz; poinformuj właściciela o dozorze min. 24 h (ryzyko samoistnego nawrotu palenia).","zr":"SZP PV 2022","str":13}]},{"etykieta":"Działania","punkty":[{"t":"Redukuj zagrożenie wg karty „Rozpoznanie i działania zabezpieczające”.","zr":"SZP PV 2022","str":12},{"t":"Demontaż modułów — szczególna ostrożność, zabezpiecz luźne złącza i przewody; w razie potrzeby zadysponuj odpowiednie służby.","zr":"SZP PV 2022","str":12},{"t":"Po działaniach uniemożliw ponowne uruchomienie uszkodzonej instalacji.","zr":"SZP PV 2022","str":12}]}],"nie_rob":[{"t":"Nie stosuj klasycznej piany ciężkiej, średniej ani lekkiej.","zr":"SZP PV 2022","str":12},{"t":"Nie dotykaj elementów PV ani innych elementów przewodzących, jeśli nie jest to konieczne.","zr":"SZP PV 2022","str":12}],"tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":12,"sekcja":"Karta Z1 — pożar (s. 12–13), tabela 2"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Podzespoły PV nie są objęte ani zagrożone pożarem — stosuj standardową taktykę gaszenia. Wyznacz strefę zagrożenia; przy bezpośrednim zagrożeniu życia — natychmiastowa ewakuacja. Ostrzeż ratowników, odłącz prąd do budynku; jest magazyn energii — wyłącz falownik. Bez informacji o stanie instalacji — SOI do pracy przy urządzeniach pod napięciem oraz ochrona układu oddechowego.\n2. PARAMETRY: Woda, prąd rozproszony — min. 1 m, kąt rozproszenia min. 30° — tylko prądownice PWT Ø52 „Turbo”; Woda, prąd zwarty — ≤ 250 l/min: min. 5 m · > 250 l/min: min. 10 m — tylko prądownice PWT Ø52 „Turbo”; Piana CAFS (max 250 l/min)
