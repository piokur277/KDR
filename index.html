i przy odpowiedniej wentylacji ogolnej oraz miejscowej; instalacje powinny byc szczelne i regularnie sprawdzane. Detektory nalezy stosowac tam, gdzie moze dojsc do uwolnienia gazu toksycznego. W razie pozaru preferowana jest kontrola przez odciecie zrodla gazu; stosowac mgle wodna lub drobno rozproszony strumien wody, suchy proszek albo CO2. Nie stosowac silnego strumienia wody. Nie gasic plomienia wyplywajacego gazu, jezeli nie mozna bezpiecznie zahamowac wycieku. Chlodzic zagrozone pojemniki strumieniem rozpylonej wody z bezpiecznego miejsca.\n7. WARTOSCI GRANICZNE I PARAMETRY: NDS 7 mg/m3; NDSCh 14 mg/m3. DGW 3,9% obj.; GGW 45,5% obj.; temperatura samozaplonu 270 C; wzgledna gestosc pary 1,2.\n8. GLOWNE ZAGROZENIA: wdychanie grozi smiercia, moze powodowac podraznienie drog oddechowych, uszkodzenie centralnego ukladu nerwowego przy narazeniu powtarzanym oraz bardzo toksyczne oddzialywanie na organizmy wodne. Narazenie na ogien moze spowodowac rozerwanie lub wybuch pojemnika.\n9. CO MOZE POJSC NIE TAK: oparcie rozpoznania tylko na zapachu, wejscie bez izolujacego aparatu oddechowego, dopuszczenie do nagromadzenia gazu w obnieniach, gaszenie plomienia bez zatrzymania wycieku oraz uzycie silnego strumienia wody.\n10. UWAGI OPERACYJNE: w przypadku dostania sie do drog oddechowych wyprowadzic poszkodowanego na swieze powietrze, zapewnic warunki do odpoczynku i natychmiast uzyskac pomoc lekarska. W przypadku zaniku oddechu prowadzic resuscytacje. Kontakt z ciecza moze powodowac poparzenia zimnem i odmrozenia.","tagi_wspolne":["siarkowodor","h2s","substancja chemiczna"],"aliasy":["h2s","wartosci graniczne h2s","stezenie siarkowodoru","nds h2s","ndsch h2s","ppm h2s","toksycznosc h2s","zgnile jaja","porazenie wechu","ciezszy od powietrza","wybuchowosc h2s","un 1053","adr 263","2tf"],"dokumenty_zrodlowe":[{"dokument_id":"doc-sds-h2s-4-1","strona":1,"sekcja":"Karta charakterystyki H2S"}]},{"id":"KARTA-ORG-HCN-WARTOSCI-GRANICZNE","wzorzec":2,"kategoria":"substancja","zrodlo":"ILO/WHO: Międzynarodowa Karta Bezpieczeństwa Chemicznego ICSC 0492 – Cyjanowodór, skroplony (maj 2018; wersja polska: IMP Łódź, 2018)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"cyjanowodor","keywords":["hcn","kwas pruski","wartosci graniczne hcn","ppm hcn","dym pozarowy hcn","cyjanowodor pozar","oksydaza cytochromowa","idlh hcn","toksycznosc hcn","cas 74-90-8","h224","h330","h410","ndsp hcn","cyjanki","zatrucie cyjankami"],"aliasy":["hcn","kwas pruski","wartosci graniczne hcn","ppm hcn","dym pozarowy hcn","cyjanowodor pozar","oksydaza cytochromowa","idlh hcn","toksycznosc hcn","cas 74-90-8","h224","h330","h410","ndsp hcn","cyjanki","zatrucie cyjankami"],"prefix":"HCN — cyjanowodór (kwas pruski), CAS 74-90-8, UN 1051: skrajnie łatwopalny, bardzo toksyczny, wchłania się przez skórę.","najpierw":[{"t":"UNIKAJ WSZELKIEGO KONTAKTU — do strefy tylko w kombinezonie gazoszczelnym z aparatem izolującym.","zr":"ICSC","str":1},{"t":"Usuń źródła zapłonu, ewakuuj zagrożony teren, skonsultuj się z ekspertem.","zr":"ICSC","str":1},{"t":"Poszkodowanego: świeże powietrze, tlen, pozycja półsiedząca, odpoczynek; natychmiast pomoc medyczna.","zr":"ICSC","str":1},{"t":"Nie prowadź sztucznego oddychania metodą usta-usta.","zr":"ICSC","str":1},{"t":"Pierwszej pomocy udzielaj w rękawicach ochronnych.","zr":"ICSC","str":1}],"parametry":[{"nazwa":"Granice wybuchowości","wartosc":"5,6–40 % obj.","zr":"ICSC","str":3},{"nazwa":"Temperatura wrzenia","wartosc":"26°C — szybko paruje","zr":"ICSC","str":3},{"nazwa":"Temperatura zapłonu","wartosc":"−18°C","zr":"ICSC","str":3},{"nazwa":"Temperatura samozapłonu","wartosc":"538°C","zr":"ICSC","str":3},{"nazwa":"Gęstość par (powietrze = 1)","wartosc":"0,94","zr":"ICSC","str":3},{"nazwa":"EU-OEL","wartosc":"1 mg/m³ (TWA) · 5 mg/m³ (STEL) · wchłanianie przez skórę","zr":"ICSC","str":3},{"nazwa":"Transport","wartosc":"UN 1051 · klasa 6.1, ryzyko dodatkowe 3","zr":"ICSC","str":1}],"sekcje":[{"etykieta":"Pożar","punkty":[{"t":"Odetnij dopływ gazu; jeśli to niemożliwe i nie ma zagrożenia dla otoczenia — pozwól się wypalić.","zr":"ICSC","str":1},{"t":"Gaś proszkiem, rozproszonymi prądami wody, pianą odporną na alkohol lub CO₂.","zr":"ICSC","str":1},{"t":"Chłodź butle zraszaniem wodą; działaj z osłoniętych stanowisk.","zr":"ICSC","str":1},{"t":"Spalanie wydziela toksyczne i żrące gazy, w tym tlenki azotu.","zr":"ICSC","str":3}]},{"etykieta":"Wyciek","punkty":[{"t":"Wentyluj; nie dopuść substancji do środowiska; pozostałość zaabsorbuj piaskiem lub obojętnym sorbentem.","zr":"ICSC","str":1},{"t":"Niestabilizowany HCN może gwałtownie polimeryzować (ciepło, zasady, powyżej 2% wody) — ryzyko pożaru i wybuchu.","zr":"ICSC","str":3}]},{"etykieta":"Poszkodowany","punkty":[{"t":"Objawy: dezorientacja, senność, ból głowy, nudności, duszność, drgawki, utrata przytomności, zatrzymanie oddechu i krążenia.","zr":"ICSC","str":1},{"t":"Skóra: zdejmij skażoną odzież, spłucz dużą ilością wody lub prysznic.","zr":"ICSC","str":1},{"t":"Oczy: płucz dużą ilością wody przez kilka minut, potem pomoc medyczna.","zr":"ICSC","str":1},{"t":"Połknięcie: wypłucz usta, nie wywołuj wymiotów.","zr":"ICSC","str":1},{"t":"Wymagane leczenie swoiste — zabezpiecz odtrutki z instrukcją; poszkodowany wymaga obserwacji medycznej.","zr":"ICSC","str":3},{"t":"Skażoną odzież zapakuj i szczelnie zamknij w workach.","zr":"ICSC","str":3}]}],"nie_rob":[{"t":"Nie kieruj strumienia wody na ciekły HCN.","zr":"ICSC","str":1},{"t":"Nie polegaj na zapachu — przy przekroczeniu normatywów nie jest wystarczającym ostrzeżeniem.","zr":"ICSC","str":3},{"t":"Nie pracuj w strefie w pojedynkę.","zr":"ICSC","str":3}],"tagi_wspolne":["cyjanowodor","hcn","substancja chemiczna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-icsc-0492-hcn","strona":1,"sekcja":"ICSC 0492 — zagrożenia, pierwsza pomoc, wycieki (s. 1), właściwości i normatywy (s. 3)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: UNIKAJ WSZELKIEGO KONTAKTU — do strefy tylko w kombinezonie gazoszczelnym z aparatem izolującym. Usuń źródła zapłonu, ewakuuj zagrożony teren, skonsultuj się z ekspertem. Poszkodowanego: świeże powietrze, tlen, pozycja półsiedząca, odpoczynek; natychmiast pomoc medyczna. Nie prowadź sztucznego oddychania metodą usta-usta. Pierwszej pomocy udzielaj w rękawicach ochronnych.\n2. PARAMETRY: Granice wybuchowości — 5,6–40 % obj.; Temperatura wrzenia — 26°C — szybko paruje; Temperatura zapłonu — −18°C; Temperatura samozapłonu — 538°C; Gęstość par (powietrze = 1) — 0,94; EU-OEL — 1 mg/m³ (TWA) · 5 mg/m³ (STEL) · wchłanianie przez skórę; Transport — UN 1051 · klasa 6.1, ryzyko dodatkowe 3\n3. POŻAR: Odetnij dopływ gazu; jeśli to niemożliwe i nie ma zagrożenia dla otoczenia — pozwól się wypalić. Gaś proszkiem, rozproszonymi prądami wody, pianą odporną na alkohol lub CO₂. Chłodź butle zraszaniem wodą; działaj z osłoniętych stanowisk. Spalanie wydziela toksyczne i żrące gazy, w tym tlenki azotu.\n4. WYCIEK: Wentyluj; nie dopuść substancji do środowiska; pozostałość zaabsorbuj piaskiem lub obojętnym sorbentem. Niestabilizowany HCN może gwałtownie polimeryzować (ciepło, zasady, powyżej 2% wody) — ryzyko pożaru i wybuchu.\n5. POSZKODOWANY: Objawy: dezorientacja, senność, ból głowy, nudności, duszność, drgawki, utrata przytomności, zatrzymanie oddechu i krążenia. Skóra: zdejmij skażoną odzież, spłucz dużą ilością wody lub prysznic. Oczy: płucz dużą ilością wody przez kilka minut, potem pomoc medyczna. Połknięcie: wypłucz usta, nie wywołuj wymiotów. Wymagane leczenie swoiste — zabezpiecz odtrutki z instrukcją; poszkodowany wymaga obserwacji medycznej. Skażoną odzież zapakuj i szczelnie zamknij w workach.\n6. NIE RÓB: Nie kieruj strumienia wody na ciekły HCN. Nie polegaj na zapachu — przy przekroczeniu normatywów nie jest wystarczającym ostrzeżeniem. Nie pracuj w strefie w pojedynkę."},{"id":"KARTA-EL-PSE-LINIE-STACJE-NN","kategoria":"dzialania","zrodlo":"Polskie Sieci Elektroenergetyczne S.A.: „Bezpieczeństwo prowadzenia działań ratowniczo-gaśniczych na stacjach i w pobliżu linii elektroenergetycznych najwyższych napięć”, 31.08.2026 r. - źródło podstawowe; „Zagrożenia elektryczne”, Kraków 2014 - materiał pomocniczy do pojęć napięcia krokowego, dotykowego i łuku elektrycznego.","data_aktualizacji":"2026-08-31","slowo_kluczowe":"linia najwyższego napięcia stacja PSE","keywords":["pse","linia nn","linia najwyższego napięcia","linia najwyzszych napiec","linia wysokiego napięcia","220 kv","400 kv","stacja elektroenergetyczna","stacja pse","pożar stacji elektroenergetycznej","pożar transformatora","transformator 400 kv","transformator 220 kv","przewód na ziemi","zerwany przewód energetyczny","opadnięty przewód","słup energetyczny","słup pse","napięcie krokowe","napięcie dotykowe","łuk elektryczny","porażenie prądem","sf6","sześciofluorek siarki","olej transformatorowy","centrum nadzoru pse","rcn pse","cn pse","gaszenie pod linią","pożar pod linią 400 kv","wypadek pod linią 400 kv"],"prefix":"Linie i stacje elektroenergetyczne najwyższych napięć (PSE) - bezpieczne działania PSP.","content":"1. ROZPOZNANIE I IDENTYFIKACJA: ustal, czy zdarzenie dotyczy stacji PSE lub linii przesyłowej najwyższych napięć. Na stacji odczytaj tablicę informacyjną na bramie. Przy linii zidentyfikuj numer słupa i relację linii z tablic umieszczonych na konstrukcji. Określ, czy występują: pożar, uszkodzenie konstrukcji, opadnięcie przewodów, porażenie, eksplozja aparatury, wyciek oleju lub uszkodzenie urządzeń z SF6.\n2. ZASADA PODSTAWOWA: do czasu uzyskania informacji od służb PSE oraz przygotowania miejsca przez służby eksploatacyjne traktuj linię i urządzenia jak CZYNNE I ZNAJDUJĄCE SIĘ POD NAPIĘCIEM. Samoczynne wyłączenie po zwarciu nie oznacza trwałego braku napięcia - linie NN mogą posiadać automatykę samoczynnego ponownego załączenia (SPZ).\n3. STREFA PRZY LINII NN: bez uzgodnienia warunków bezpieczeństwa z CN/RCN nie zbliżaj ludzi, sprzętu ani strumienia środka gaśniczego na odległość mniejszą niż 30 m od przewodu linii NN, również przewodu leżącego na ziemi. Odległość oceniaj w poziomie od rzutu pionowego skrajnego przewodu. Bez uzgodnienia z RCN nie przecinaj przewodów leżących na ziemi i nie wchodź na konstrukcję słupa.\n4. POŻAR POD LINIĄ: nie przejeżdżaj samochodem pożarniczym pod przewodami linii NN do czasu uzyskania z CN/RCN informacji o zapewnieniu bezpieczeństwa. Pożar może obniżyć wytrzymałość dielektryczną powietrza, zmniejszyć odległości przewodów od ziemi i doprowadzić do ich opadnięcia albo odkształcenia konstrukcji słupa.\n5. KONTAKT Z PSE: przekaż do Centrum Nadzoru (CN) albo właściwego Regionalnego Centrum Nadzoru (RCN): lokalizację, charakter zdarzenia, numer słupa/oznaczenie stacji, widoczne uszkodzenia i zakres prowadzonych działań. CN/RCN przekazuje warunki bezpieczeństwa prowadzenia działań. Aktualne numery kontaktowe z materiału PSE z 31.08.2026 znajdują się na stronie 30 dołączonego dokumentu.\n6. SKUTECZNE POZBAWIENIE LINII NN NAPIĘCIA: wymaga obustronnego wyłączenia i odłączenia linii w stacjach końcowych oraz jej uziemienia. Gdy istnieje ryzyko zbliżenia lub dotknięcia przewodu roboczego - także pośrednio, np. strumieniem wody - może być konieczne dodatkowe uziemienie w miejscu działań. Uziemienia wykonują służby PSE. Bez widocznego uziemienia nie dotykaj przewodów bezpośrednio ani pośrednio.\n7. DZIAŁANIA NA STACJI: wjazd sił PSP na teren ruchu energetycznego odbywa się pod nadzorem obsługi stacji po przygotowaniu strefy. Urządzenia w rejonie działań muszą zostać WYŁĄCZONE, ODŁĄCZONE (widoczna przerwa w obwodzie) i UZIEMIONE. Dopiero po wykonaniu tych czynności obsługa stacji przekazuje zagrożony rejon dowódcy PSP.\n8. NAPIĘCIE KROKOWE I DOTYKOWE: przy zwarciu doziemnym, uszkodzonym kablu, uziomie, powalonym słupie lub przewodzie na ziemi może wystąpić przepływ prądu przez grunt. Jeżeli ratownik znajdzie się w obszarze podejrzenia napięcia krokowego, powinien złączyć stopy i opuszczać obszar bardzo małymi krokami, przesuwając stopy po podłożu, bez szerokiego kroku i bez podpierania się rękami.\n9. ŁUK ELEKTRYCZNY: przy urządzeniach NN do porażenia może dojść bez dotknięcia przewodu - przez przeskok łuku. Nie zbliżaj się do części czynnych na podstawie oceny wzrokowej. Odległości i warunki pracy ustalaj z PSE/CN/RCN.\n10. ZAGROŻENIA DODATKOWE NA STACJI: uwzględnij możliwość eksplozji aparatury, ostrych odłamków izolatorów porcelanowych, gorącego oleju transformatorowego w dużych ilościach oraz produktów rozpadu SF6. Po wystąpieniu łuku lub uszkodzeniu urządzeń z SF6 możliwe są toksyczne i kwaśne produkty rozpadu; SF6 może także wypierać tlen.\n11. WYJĄTEK - DZIAŁANIA NIEGAŚNICZE POD CZYNNĄ LINIĄ: materiał PSE 2026 dopuszcza niektóre działania ratownicze bez zgłoszenia do RCN wyłącznie wtedy, gdy jednocześnie: używany jest tylko sprzęt ręczny; nie ma oznak uszkodzenia linii; nie jest potrzebna drabina, dźwig, HDS ani inny sprzęt zmechanizowany; nie ma ryzyka operowania ciałem lub narzędziem powyżej 4 m nad gruntem. NIE DOTYCZY TO GASZENIA POŻARÓW. W razie wątpliwości przyjmij wariant bardziej zachowawczy i skontaktuj się z CN/RCN.\n12. POSZKODOWANI: ratowanie życia pozostaje priorytetem, ale wejście do strefy zagrożenia elektrycznego wymaga warunków umożliwiających bezpieczne dotarcie do poszkodowanego. Po bezpiecznym wydobyciu prowadź KPP/ABCDE zgodnie ze stanem poszkodowanego.\n13. UWAGA O ŹRÓDŁACH: materiał PSE z 31.08.2026 stanowi źródło podstawowe dla tej karty. Materiał „Zagrożenia elektryczne, Kraków 2014” wykorzystano wyłącznie pomocniczo do objaśnienia napięcia krokowego/dotykowego i łuku. Nie przeniesiono z niego starych wartości napięć bezpiecznych jako kryteriów operacyjnych KDR.","tagi_wspolne":["elektryka","PSE","linia NN","stacja elektroenergetyczna","porażenie prądem","napięcie krokowe","łuk elektryczny","transformator","SF6"],"aliasy":["pse","linia nn","linia najwyższego napięcia","linia najwyzszych napiec","linia wysokiego napięcia","linia 220 kv","linia 400 kv","stacja pse","stacja elektroenergetyczna","pożar stacji elektroenergetycznej","pożar transformatora","transformator 400 kv","przewód na ziemi","zerwany przewód energetyczny","zerwany kabel energetyczny","opadnięty przewód","powalony słup energetyczny","słup pse","napięcie krokowe","napięcie dotykowe","łuk elektryczny","porażenie prądem","sf6","sześciofluorek siarki","olej transformatorowy","centrum nadzoru pse","rcn pse","cn pse","gaszenie pod linią","pożar pod linią 400 kv","wypadek pod linią wysokiego napięcia"],"pelna_procedura":{"tytul":"PSE - Bezpieczeństwo prowadzenia działań ratowniczo-gaśniczych na stacjach i w pobliżu linii NN (31.08.2026)","plik":"dokumenty/elektryka/pse-bezpieczenstwo-dzialan-nn-2026.pdf","strona":18},"dokumenty_zrodlowe":[{"dokument_id":"doc-pse-bezpieczenstwo-dzialan-nn-2026","strona":18,"sekcja":"Źródło podstawowe: zagrożenia, organizacja strefy działań, warunki bezpieczeństwa, kontakt CN/RCN"},{"dokument_id":"doc-zagrozenia-elektryczne-krakow-2014","strona":10,"sekcja":"Materiał pomocniczy: napięcie dotykowe i krokowe, skutki porażenia, łuk elektryczny"}]},{"id":"KARTA-ORG-METODYKA-ORGANIZACJI-LACZNOSCI-KDR","wzorzec":2,"kategoria":"organizacja","zrodlo":"KG PSP: Metodyka postępowania podczas organizacji łączności na potrzeby KDR (13.04.2016, niepublikowana; opis: „Przegląd Pożarniczy” 4/2014); Rozkaz nr 8 KG PSP z 05.04.2019 – Instrukcja w sprawie organizacji łączności radiowej","data_aktualizacji":"2026-10-25","slowo_kluczowe":"organizacja lacznosci kdr","keywords":["lacznosc na potrzeby kdr","metodyka lacznosci kdr","psk msk lacznosc","ppsis lacznosc","kanaly radiowe kdr","interwencyjny lacznosc","taktyczny lacznosc","sztab lacznosc","odcinek bojowy lacznosc"],"aliasy":["lacznosc na potrzeby kdr","metodyka lacznosci kdr","psk msk lacznosc","ppsis lacznosc","kanaly radiowe kdr","interwencyjny lacznosc","taktyczny lacznosc","sztab lacznosc","odcinek bojowy lacznosc"],"prefix":"Organizacja łączności na potrzeby KDR — od poziomu interwencyjnego do sztabu. Nazwy stanowisk kierowania wg rozkazu KG PSP nr 8/2019.","najpierw":[{"t":"W drodze uzgodnij z SK KP/KM kanał ratowniczo-gaśniczy (KRG) — powinien być przydzielony przed przyjazdem.","zr":"PP 4/2014","str":1},{"t":"W sieci powiatowej (PR) z macierzystym stanowiskiem kierowania pracuje tylko KDR.","zr":"PP 4/2014","str":2},{"t":"Siły spoza powiatu zgłaszają przyjazd w sieci KSW do SK KP/KM właściwego dla miejsca działań lub do PPSiŚ.","zr":"Rozkaz 8/2019","str":8},{"t":"Używaj kryptonimów — nie imion, nazwisk ani funkcji (wyjątek: kanały KRG).","zr":"PP 4/2014","str":1}],"parametry":[{"nazwa":"PR — sieć powiatowa","wartosc":"SK KP/KM ↔ pojazdy w powiecie","zr":"Rozkaz 8/2019","str":8},{"nazwa":"KSW — współdziałanie i alarmowanie","wartosc":"nasłuch wszystkich SK; zgłaszanie przyjazdu sił spoza powiatu","zr":"Rozkaz 8/2019","str":8},{"nazwa":"KRG — ratowniczo-gaśnicza","wartosc":"łączność na miejscu akcji; dysponent w powiecie SK KP/KM, nadzór KDR","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KDW — dowodzenia i współdziałania","wartosc":"uruchamiana doraźnie; dysponent SK KW, nadzór KDR","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KO — operacyjny kierunek radiowy","wartosc":"SK KP/KM ↔ sztab KDR; dysponent SK KG","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KSWL — statki powietrzne","wartosc":"kanał U02 — podstawowy do współpracy z zespołem HEMS","zr":"PP 4/2014","str":1}],"sekcje":[{"etykieta":"Odcinki bojowe (poziom taktyczny)","punkty":[{"t":"Zgłoś do SK KP/KM potrzebę kanałów KRG dla odcinków bojowych.","zr":"PP 4/2014","str":2},{"t":"SK uruchamia przez SK KW sieć KDW i informuje Cię o przydziale KDW i KRG.","zr":"PP 4/2014","str":2},{"t":"KDR ↔ dowódcy odcinków: kanał KDW; dowódcy odcinków ↔ podległe siły: kanały KRG.","zr":"PP 4/2014","str":2},{"t":"Gdy korespondencja blokuje sieć powiatową — uruchom przez SK kierunek KO i zwolnij PR dla innych zdarzeń.","zr":"PP 4/2014","str":2},{"t":"Informacje ważne dla całego terenu (podział na odcinki, zmiany kanałów) podawaj okólnikiem.","zr":"PP 4/2014","str":1}]},{"etykieta":"Punkt przyjęcia sił i środków (PPSiŚ)","punkty":[{"t":"Stały nasłuch trzech sieci: KSW, przydzielonego KDW i jednego KRG do dysponowania sił z rejonu koncentracji.","zr":"PP 4/2014","str":2},{"t":"Siły czekające w rejonie koncentracji prowadzą nasłuch na wskazanym KRG.","zr":"PP 4/2014","str":2}]},{"etykieta":"Sztab akcji","punkty":[{"t":"Sztab pozyskuje i uruchamia kierunek KO, aby nie blokować sieci PR i PW.","zr":"PP 4/2014","str":2},{"t":"Na zapotrzebowanie KDR sztab zgłasza do SK potrzebę KRG; SK uruchamia KDW i informuje sztab o przydziale.","zr":"PP 4/2014","str":2},{"t":"Od uruchomienia KDW prowadź dokumentację łączności: sieci, kanały i kryptonimy przydzielone siłom.","zr":"Rozkaz 8/2019","str":32}]},{"etykieta":"Statki powietrzne","punkty":[{"t":"Zapewnij sprawną wymianę informacji między SK KW, SK KP/KM, KDR i sztabem — statek szybko pokonuje duże odległości.","zr":"PP 4/2014","str":2},{"t":"Sieć KSWL: dysponent komendant wojewódzki PSP, na miejscu działań nadzór sprawuje KDR.","zr":"Rozkaz 8/2019","str":9}]}],"nie_rob":[{"t":"Nie zastępuj KSW siecią powiatową przy współpracy z siłami z własnego powiatu w PPSiŚ — wymaga to nasłuchu czwartej sieci.","zr":"PP 4/2014","str":2},{"t":"Nie używaj alternatywnych środków łączności, dopóki działa łączność radiowa UKF.","zr":"PP 4/2014","str":1}],"tagi_wspolne":["lacznosc","organizacja lacznosci"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lacznosc-kdr-2014","strona":1,"sekcja":"Opis Metodyki (karty A, B, C) — s. 1–2"},{"dokument_id":"doc-rozkaz-8-2019-lacznosc","strona":8,"sekcja":"Struktura sieci radiowych (s. 8–9), dokumentacja łączności (s. 32)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: W drodze uzgodnij z SK KP/KM kanał ratowniczo-gaśniczy (KRG) — powinien być przydzielony przed przyjazdem. W sieci powiatowej (PR) z macierzystym stanowiskiem kierowania pracuje tylko KDR. Siły spoza powiatu zgłaszają przyjazd w sieci KSW do SK KP/KM właściwego dla miejsca działań lub do PPSiŚ. Używaj kryptonimów — nie imion, nazwisk ani funkcji (wyjątek: kanały KRG).\n2. PARAMETRY: PR — sieć powiatowa — SK KP/KM ↔ pojazdy w powiecie; KSW — współdziałanie i alarmowanie — nasłuch wszystkich SK; zgłaszanie przyjazdu sił spoza powiatu; KRG — ratowniczo-gaśnicza — łączność na miejscu akcji; dysponent w powiecie SK KP/KM, nadzór KDR; KDW — dowodzenia i współdziałania — uruchamiana doraźnie; dysponent SK KW, nadzór KDR; KO — operacyjny kierunek radiowy — SK KP/KM ↔ sztab KDR; dysponent SK KG; KSWL — statki powietrzne — kanał U02 — podstawowy do współpracy z zespołem HEMS\n3. ODCINKI BOJOWE (POZIOM TAKTYCZNY): Zgłoś do SK KP/KM potrzebę kanałów KRG dla odcinków bojowych. SK uruchamia przez SK KW sieć KDW i informuje Cię o przydziale KDW i KRG. KDR ↔ dowódcy odcinków: kanał KDW; dowódcy odcinków ↔ podległe siły: kanały KRG. Gdy korespondencja blokuje sieć powiatową — uruchom przez SK kierunek KO i zwolnij PR dla innych zdarzeń. Informacje ważne dla całego terenu (podział na odcinki, zmiany kanałów) podawaj okólnikiem.\n4. PUNKT PRZYJĘCIA SIŁ I ŚRODKÓW (PPSIŚ): Stały nasłuch trzech sieci: KSW, przydzielonego KDW i jednego KRG do dysponowania sił z rejonu koncentracji. Siły czekające w rejonie koncentracji prowadzą nasłuch na wskazanym KRG.\n5. SZTAB AKCJI: Sztab pozyskuje i uruchamia kierunek KO, aby nie blokować sieci PR i PW. Na zapotrzebowanie KDR sztab zgłasza do SK potrzebę KRG; SK uruchamia KDW i informuje sztab o przydziale. Od uruchomienia KDW prowadź dokumentację łączności: sieci, kanały i kryptonimy przydzielone siłom.\n6. STATKI POWIETRZNE: Zapewnij sprawną wymianę informacji między SK KW, SK KP/KM, KDR i sztabem — statek szybko pokonuje duże odległości. Sieć KSWL: dysponent komendant wojewódzki PSP, na miejscu działań nadzór sprawuje KDR.\n7. NIE RÓB: Nie zastępuj KSW siecią powiatową przy współpracy z siłami z własnego powiatu w PPSiŚ — wymaga to nasłuchu czwartej sieci. Nie używaj alternatywnych środków łączności, dopóki działa łączność radiowa UKF."},{"id":"KARTA-SPRZET-POLON-ALFA-RK-100-2","kategoria":"informacja","zrodlo":"POLON-ALFA: Radiometr RK-100-2, Instrukcja obsługi IO-R120-001, Edycja IV; aktualna strona producenta RK-100-2 zweryfikowana 2026-08-30.","data_aktualizacji":"2026-08-30","slowo_kluczowe":"radiometr rk 100 2","keywords":["polon rk 100","polon rk 100 2","polon-alfa rk-100-2","radiometr rk-100-2","dozymetr rk 100","dozymetr polon","miernik promieniowania polon","obsługa rk 100 2","instrukcja rk 100 2","sonda zewnętrzna rk 100","pomiar skażeń rk 100","pomiar mocy dawki rk 100","sv h rk 100","gy h rk 100","bq cm2 rk 100","imp s rk 100","alarm rk 100","próg rk 100","rnG rk 100","Err rk 100","BAT rk 100","pomiar 100 sekund rk 100","alfa beta gamma rk 100"],"prefix":"Radiometr POLON-ALFA RK-100-2 - obsługa, pomiar dawki i skażeń oraz interpretacja wskazań.","content":"1. URZĄDZENIE I ZASTOSOWANIE: RK-100-2 jest przenośnym radiometrem. Sonda wewnętrzna służy do pomiaru mocy przestrzennego równoważnika dawki i równoważnika dawki (Sv/h, Sv) oraz mocy dawki pochłoniętej i dawki pochłoniętej (Gy/h, Gy) promieniowania X i gamma. Po podłączeniu sondy zewnętrznej przyrząd może służyć do oceny skażeń powierzchni alfa, beta i gamma.\n2. PRZED UŻYCIEM: sprawdź stan mechaniczny, baterie oraz ewentualną sondę zewnętrzną. Sondę zewnętrzną podłączaj i odłączaj wyłącznie przy wyłączonym radiometrze. Po włączeniu urządzenie wykonuje autotest; przez kilka sekund wyświetla wszystkie elementy ekranu i może pokazywać „---” do czasu uzyskania gotowego pomiaru.\n3. KLAWISZE: zasilanie - włączenie/wyłączenie; POMIAR - przełączanie wielkości pomiarowych; przycisk podświetlenia - podświetlenie ekranu i klawiatury; przycisk wyboru funkcji specjalnych - wybór PAMIĘĆ/PRÓG/sygnalizacja/IR; F - aktywacja/obsługa funkcji specjalnej; P - pomiar precyzyjny uśredniony w czasie 100 s.\n4. PODSTAWOWY POMIAR PROMIENIOWANIA: dla oceny mocy przestrzennego równoważnika dawki wybierz przyciskiem POMIAR jednostkę Sv/h. Odczyt jest realizowany przez detektory wewnętrzne i nie zależy od podłączenia sondy zewnętrznej. Zakres sondy wewnętrznej wynosi do 50 mSv/h. Dla mocy dawki pochłoniętej wybierz Gy/h; zakres do 50 mGy/h.\n5. DAWKA SKUMULOWANA: tryby Sv i Gy pokazują dawkę kumulowaną od chwili włączenia lub od skasowania poprzedniego cyklu. Jeżeli podczas pracy wystąpiło przekroczenie zakresu mocy dawki, symbol „E” przy dawce skumulowanej oznacza, że wynik może być zaniżony.\n6. POMIAR 100 s: przy niskich poziomach i dużym rozrzucie wskazań użyj przycisku P. Funkcja uśrednia pomiar przez 100 s i jest dostępna dla mocy dawki, mocy równoważnika dawki oraz pomiarów skażeń.\n7. SONDA ZEWNĘTRZNA - WAŻNE: wskazania z sondy zewnętrznej są prezentowane jako imp/s (s-1) albo Bq/cm2. Założenie filtru gamma nie powoduje automatycznego przeliczenia wskazania na Sv/h. Do pomiaru skażeń nie używaj filtru gamma.\n8. ROZRÓŻNIANIE SKŁADOWYCH SKAŻENIA: bez osłon sonda mierzy alfa+beta+gamma; z osłoną alfa mierzy beta+gamma; z osłoną beta mierzy zasadniczo gamma. Porównanie trzech pomiarów może pomóc ocenić dominujący rodzaj promieniowania.\n9. TRYBY SKAŻEŃ: pomiar względny wskazuje s-1. Przeliczenie na Bq/cm2 wymaga znajomości izotopu, biegu własnego i współczynnika czułości ze świadectwa sprawdzenia. Pomiar bezwzględny Bq/cm2 jest miarodajny tylko wtedy, gdy w pamięci urządzenia wprowadzono właściwy współczynnik dla danego izotopu. Tryb różnicowy odnosi wynik do zapamiętanego tła/poziomu odniesienia.\n10. SYMBOLE I KOMUNIKATY: P - aktywna sonda zewnętrzna; BAT - rozładowane baterie, po stałym zapaleniu wymień je; trójkąt ostrzegawczy - ostrzeżenie/błąd; „Er” po starcie - błąd kanału (0: Gy, 1: Sv, 2: sonda zewnętrzna); „Err” w trakcie pomiaru - błąd detektora; „rnG” - przekroczenie zakresu pomiarowego; „---” - brak sondy zewnętrznej albo pomiar jeszcze niegotowy; PAMIĘĆ - zapis/odczyt pomiaru; PRÓG - ustawienie progu alarmowego; IR - komunikacja podczerwienią; symbol uśredniania - pomiar 100 s; symbol różnicowy - pomiar względem poziomu odniesienia.\n11. ALARMY: przekroczenie wybranego progu uruchamia sygnalizację akustyczną, przy czym radiometr śledzi jednocześnie tylko jeden próg wybrany przez użytkownika. „rnG” oznacza przekroczenie zakresu urządzenia - nie traktuj takiego wskazania jako wartości liczbowej.\n12. OCHRONA SONDY: sonda powierzchniowa jest delikatna. Nie stawiaj jej bez osłon lub tylko z filtrem gamma na trawie, kamieniach ani ostrych powierzchniach. Po pracy przechowuj sondę zewnętrzną z założoną osłoną beta, która chroni ją mechanicznie.\n13. PO PRACY: po pomiarach i ewentualnym odkażeniu umieść radiometr w opakowaniu. Po pracy w wilgoci lub mrozie wytrzyj i osusz powierzchnie. Przy dłuższym magazynowaniu wyjmij baterie.\n14. UWAGA OPERACYJNA PSP: karta opisuje obsługę przyrządu, a nie wyznacza samodzielnie stref ani dopuszczalnego narażenia ratowników. Progi z dodatku A instrukcji producenta mają charakter nastaw urządzenia i nie zastępują aktualnych zasad ochrony radiologicznej oraz kart R1/R2 stosowanych w KSRG.","tagi_wspolne":["radiacja","radiometr","dozymetr","sprzęt pomiarowy","skażenie promieniotwórcze","moc dawki","Polon-Alfa"],"aliasy":["polon rk 100","polon rk 100 2","polon-alfa rk-100-2","rk 100","rk-100","rk 100 2","rk-100-2","radiometr polon","dozymetr polon","dozymetr rk 100","miernik promieniowania polon","obsługa rk 100","obsługa rk 100 2","instrukcja rk 100 2","sonda rk 100","sonda zewnętrzna rk 100","pomiar skażeń rk 100","pomiar mocy dawki rk 100","pomiar promieniowania rk 100","alfa beta gamma rk 100","bq cm2 rk 100","sv h rk 100","gy h rk 100","rnG rk 100","Err rk 100","BAT rk 100","pomiar 100 s rk 100"],"pelna_procedura":{"tytul":"Instrukcja obsługi POLON-ALFA RK-100-2 - Edycja IV","plik":"dokumenty/urzadzenia/polon-alfa-rk-100-2-instrukcja-obslugi.pdf","strona":11},"dokumenty_zrodlowe":[{"dokument_id":"doc-polon-alfa-rk-100-2-manual","strona":11,"sekcja":"Pełna instrukcja obsługi (51 stron): klawiatura, wyświetlacz, sonda zewnętrzna, alarmy, tryby pomiarowe, konserwacja"},{"dokument_id":"doc-polon-alfa-rk-100-2-product","strona":1,"sekcja":"Aktualna strona producenta RK-100-2 i dane techniczne"}]},{"id":"KARTA-ORG-WYTYCZNE-WSPOLDZIALANIA-CBRNE","kategoria":"organizacja","zrodlo":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym, Zalacznik nr 1","data_aktualizacji":"","slowo_kluczowe":"wspoldzialanie cbrne","keywords":["wytyczne cbrne","zdarzenie cbrne","policja psp cbrne","koordynacja cbrne","dekontaminacja cbrne","sztab cbrne","rozpoznanie cbrne"],"prefix":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen CBRN-E.","content":"1. CEL DOKUMENTU: okreslenie zasad wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym.\n2. SLUZBA WIODACA: po uzyskaniu informacji o zdarzeniu zwiazanym z zagrozeniem o charakterze CBRN sluzba wiodaca w zakresie rozpoznania zagrozen czynnikami CBRN jest PSP, z wylaczeniem zdarzen o charakterze kryminalnym lub terrorystycznym. W przypadku zdarzen CBRN-E o charakterze kryminalnym lub terrorystycznym sluzba wiodaca jest Policja, ktora koordynuje wspolprace wszystkich sluzb.\n3. WSPOLPRACA NA MIEJSCU: sluzba koordynujaca dzialania korzysta z sil, wiedzy i srodkow innych przybylych sluzb i instytucji w ramach ich mozliwosci sprzetowych, kwalifikacyjnych i operacyjnych. Zaleca sie wspolprace w zakresie wsparcia technicznego i wykorzystania sprzetu specjalistycznego Policji i PSP oraz prowadzenia polaczonego rozpoznania.\n4. ROZPOZNANIE I SOI: funkcjonariusze wykonujacy rozpoznanie zagrozen na miejscu zdarzenia o charakterze CBRN-E wykonuje czynnosci w srodkach ochrony indywidualnej chroniacych przed tymi czynnikami. Sluzby wzajemnie, w miare potrzeb i mozliwosci, uzyczaja sobie srodkow ochrony indywidualnej.\n5. ORGANIZACJA DZIALAN: po przybyciu na miejsce patrolu Policji lub zastepu PSP i potwierdzeniu zdarzenia nalezy poinformowac wlasciwego miejscowo dyzurnego. Podmiot wiodacy dla osiagniecia efektywnej wspolpracy i wymiany informacji pomiedzy sluzbami wyznacza wspolne miejsce dowodzenia, czyli sztab, z udzialem przedstawicieli sluzb i instytucji bioracych udzial w dzialaniach.\n6. SPRZET I INSTRUKTAZ: rozpoznanie zagrozen prowadzi funkcjonariusz sluzby wiodacej wyposazony w niezbedny sprzet detekcyjny wlasnej jednostki badz udostepniony przez inne sluzby po udzieleniu niezbednego instruktażu z zakresu jego obslugi. Czynnosc instruktażu odnotowuje sie w dokumentacji sluzbowej.\n7. PRIORYTETY: nadrzednym celem sluzb dzialajacych na miejscu zdarzenia jest udzielanie pomocy osobom poszkodowanym znajdujacym sie w strefie zagrozenia, niezaleznie od innych czynnosci prowadzonych rownolegle.\n8. DEKONTAMINACJA I KONTROLA SKAZEN: PSP przygotowuje sciezki dekontaminacji odpowiednio je oznaczajac, a nastepnie przeprowadza dekontaminacje osob i sprzetu. Inne sluzby na miejscu zdarzenia moga prowadzic dekontaminacje w zakresie posiadanych sil i srodkow. Proces dekontaminacji dotyczy rowniez funkcjonariuszy sluzb oraz ich sprzetu i wyposazenia, ktore zostaly wprowadzone do strefy skazonej.\n9. SKAZENIA WTÓRNE: w sytuacji wystapienia skazenia czynnikami CBRN-E nalezy dazyc do jak najwiekszej kontroli nad skazeniami wtornymi. PSP w porozumieniu z Policja wyznaczaja miejsca zbiorki dla osob przeznaczonych do ewakuacji do momentu przeprowadzenia ich przez proces dekontaminacji. Policja prowadzi nadzor nad osobami przed i po dekontaminacji do momentu zakonczenia niezbednych czynnosci.\n10. UWAGI OPERACYJNE: gdy powyzsze wytyczne nie moga byc zrealizowane, sluzby uzgadniaja miedzy soba sposob dzialania alternatywny i adekwatny dla danego zdarzenia. Dzialania nalezy prowadzic w sposob minimalizujacy zniszczenie lub zatarcie materialu dowodowego.","tagi_wspolne":["cbrne","wspoldzialanie"],"aliasy":["wytyczne cbrne","zdarzenie cbrne","policja psp cbrne","koordynacja cbrne","dekontaminacja cbrne","sztab cbrne","rozpoznanie cbrne"],"pelna_procedura":{"tytul":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym, Zalacznik nr 1","plik":"","strona":null},"zrodlo_dostepnosc":"niedostepne_publicznie"},{"id":"KARTA-ORG-ZASADY-ORGANIZOWANIA-DZIALAN-RATOWNICZYCH","kategoria":"organizacja","zrodlo":"Zasady organizowania dzialan ratowniczych, Komenda Glowna Panstwowej Strazy Pozarnej, Warszawa 2013","data_aktualizacji":"2013-03","slowo_kluczowe":"organizacja dzialan ratowniczych","keywords":["zasady organizowania dzialan","kdr organizacja dzialan","uprawnienia kdr","rozpoznanie kdr","ciaglosc dzialan ratowniczych","przejecie kierowania dzialaniem","struktura dowodzenia akcji","odwod akcji","lacznosc alarmowanie"],"prefix":"Zasady organizowania dzialan ratowniczych - karta organizacyjna dla KDR.","content":"1. CEL DOKUMENTU: uporzadkowanie zasad kierowania dzialaniami ratowniczymi na wszystkich poziomach kierowania oraz ujednolicenie sposobu realizacji zadan przez jednostki uczestniczace w dzialaniach.\n2. KIEDY STOSOWAC: podczas organizowania i prowadzenia dzialan ratowniczych na poziomie interwencyjnym i taktycznym, od chwili przybycia pierwszych sil i srodkow do formalnego zakonczenia dzialan.\n3. ZAKRES DZIALAN RATOWNICZYCH: do dzialan w ksrg zalicza sie m.in. ewakuacje ludzi, zwierzat i mienia, ocenianie i prognozowanie zagrozen, oswietlenie miejsca zdarzenia, stabilizowanie i podnoszenie konstrukcji, ograniczanie i neutralizacje substancji niebezpiecznych, zabezpieczenie miejsca wycieku, dekontaminacje wstepna, uruchamianie dodatkowych sil i srodkow oraz oddymianie stref zagrozenia.\n4. POZIOMY REALIZACJI: czynnosci ratownicze prowadzi sie na poziomie podstawowym przez podmioty ksrg w danych dziedzinach ratownictwa oraz na poziomie specjalistycznym przez odpowiednio przeszkolone podmioty i grupy specjalistyczne.\n5. UPRAWNIENIA KDR: KDR moze m.in. zarzadzic ewakuacje ludzi lub mienia, wstrzymac komunikacje, zakazac przebywania w rejonie dzialan, przejac czasowo niezbedne pojazdy, sprzet i srodki, organizowac prace wyburzeniowe i rozbiorkowe, korzystac z informacji od dyzurnych oraz organizowac miejsce prowadzenia dzialan i strefy zagrozenia.\n6. PROWADZENIE DZIALAN: kierowanie dzialaniem ratowniczym polega na rozpoznaniu, ocenie sytuacji, wyborze celu i zamiaru taktycznego, doborze adekwatnych technik, wykorzystaniu dostepnych zasobow oraz stalym monitorowaniu sytuacji i korygowaniu sposobu prowadzenia akcji.\n7. ROZPOZNANIE I CEL: rozpoznanie musi byc prowadzone przez caly czas trwania akcji, a pozyskane dane nalezy stale weryfikowac i wykorzystywac do aktualizacji oceny sytuacji oraz zamiaru taktycznego. Celem glownym jest ratowanie ludzi, zwierzat, srodowiska i mienia przy wykorzystaniu sil i srodkow dostepnych na miejscu.\n8. CIAGLOSC KIEROWANIA: dzialania ratownicze powinny byc realizowane nieprzerwanie do czasu osiagniecia zamierzonych celow, a KDR odpowiada za zapewnienie ciaglosci kierowania na poszczegolnych poziomach.\n9. ORGANIZACJA STRUKTURY DZIALAN: w razie potrzeby KDR organizuje odwod, wyznacza strukture dowodzenia, miejsce koncentracji, zapewnia lacznosc i alarmowanie, moze dzielic teren akcji na odcinki bojowe i powolywac sztab akcji.\n10. UWAGI OPERACYJNE: kierowanie dzialaniem rozpoczyna sie z chwila przybycia pierwszych sil i srodkow i konczy po ustaleniu, ze dzialania ratownicze zostaly zakonczone.","tagi_wspolne":["organizacja dzialan","dzialania ratownicze"],"aliasy":["zasady organizowania dzialan","kdr organizacja dzialan","uprawnienia kdr","rozpoznanie kdr","ciaglosc dzialan ratowniczych","przejecie kierowania dzialaniem","struktura dowodzenia akcji","odwod akcji","lacznosc alarmowanie"],"pelna_procedura":{"tytul":"Zasady organizowania dzialan ratowniczych, Komenda Glowna Panstwowej Strazy Pozarnej, Warszawa 2013","plik":"dokumenty/organizacja/zasady-organizowania-dzialan-ratowniczych-2013-03.pdf","strona":4},"dokumenty_zrodlowe":[{"dokument_id":"doc-zodr-2013","strona":4,"sekcja":"Wstęp pkt 1 (s. 4); zakres działań (s. 7); uprawnienia KDR (s. 9); kierowanie, rozpoznanie, ciągłość (s. 10–12); odwód, odcinki bojowe, sztab (s. 12–13); zakończenie działań (s. 14)"}],"data_przegladu":"2026-10-25"},{"id":"POZ-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar samochodu elektrycznego","keywords":["pozar ev","pozar baterii","plonie elektryk","dym z baterii","thermal runaway","zaplon baterii trakcyjnej","samochod elektryczny sie pali","pozar auta elektrycznego","samochod elektryczny pozar","pozar tesli","pozar baterii trakcyjnej","thermal runaway ev"],"aliasy":["pozar ev","pozar baterii","plonie elektryk","dym z baterii","thermal runaway","zaplon baterii trakcyjnej","samochod elektryczny sie pali","pozar auta elektrycznego","samochod elektryczny pozar","pozar tesli","pozar baterii trakcyjnej","thermal runaway ev"],"prefix":"Pożar samochodu elektrycznego lub hybrydowego — karta Z2 SZP KG PSP (2023).","najpierw":[{"t":"Ustaw sprzęt i działaj od strony nawietrznej; wyznacz strefę zagrożenia.","zr":"SZP EV","str":11},{"t":"SOI: aparat oddechowy, kompletne ubranie specjalne, kominiarka, rękawice, hełm, buty.","zr":"SZP EV","str":11},{"t":"Ewakuuj osoby ze strefy przy bezpośrednim zagrożeniu życia lub zdrowia.","zr":"SZP EV","str":11},{"t":"Gaś wodą (małe pożary: woda lub gaśnice ABC / AB); widoczny pożar akumulatora — woda bezpośrednio na akumulator.","zr":"SZP EV","str":11}],"parametry":[{"nazwa":"Prąd rozproszony (PWT Ø52 Turbo)","wartosc":"kąt ≥ 30°, odległość ≥ 1 m od elementów pod napięciem","zr":"SZP EV","str":11},{"nazwa":"Prąd zwarty (PWT Ø52 Turbo)","wartosc":"≤ 250 l/min: ≥ 5 m · > 250 l/min: ≥ 10 m","zr":"SZP EV","str":11},{"nazwa":"Chłodzenie akumulatora","wartosc":"> 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; kontrola 30 min","zr":"SZP EV","str":12},{"nazwa":"Czas chłodzenia","wartosc":"kilka–kilkanaście godzin (średnio ok. 7 h); nawrót nawet po 20 h","zr":"SZP EV","str":12}],"sekcje":[{"etykieta":"Oznaki zapalenia akumulatora (thermal runaway)","punkty":[{"t":"Syczenie, gwizd, wybuch fizyczny; ciemny aerozol pod ciśnieniem; jasny palny gaz rozkładowy; płomienie 3–5 m.","zr":"SZP EV","str":11},{"t":"Uwolnienia spodziewane od spodu pojazdu (płyta podłogowa) i we wnętrzu (kokpit, bagażnik).","zr":"SZP EV","str":11}]},{"etykieta":"Działania","punkty":[{"t":"W pomieszczeniach zamkniętych użyj wentylatora osiowego i podchodź od jego strony.","zr":"SZP EV","str":11},{"t":"Po ugaszeniu wnętrza sprawdź, czy akumulator nie przechodzi w niestabilność termiczną — pomiary na obudowie przez 30 min.","zr":"SZP EV","str":12},{"t":"Przy pożarze akumulatora zapewnij znacznie więcej wody niż przy aucie spalinowym; otwory w obudowie wykorzystaj do podania wody z bezpiecznej odległości.","zr":"SZP EV","str":12},{"t":"Kontroluj atmosferę czujnikiem wielogazowym (wodór, tlenek węgla).","zr":"SZP EV","str":12},{"t":"Po ugaszeniu: dezaktywacja (jeśli możliwa) i kontrola obudowy akumulatora.","zr":"SZP EV","str":12}]},{"etykieta":"Kontener","punkty":[{"t":"Zatapianie w kontenerze tylko, gdy inne techniki zawiodą; woda najwyżej do górnej krawędzi akumulatora; rozważ suchą kwarantannę.","zr":"SZP EV","str":12},{"t":"Po zalaniu wodą zadysponuj SGRChem (poziom B) do pobrania próbek.","zr":"SZP EV","str":12}]},{"etykieta":"Przekazanie","punkty":[{"t":"Po pożarze akumulatora: duże ryzyko nawrotu — dozór, ≥ 5 m od pojazdów i budynków, wentylacja, ochrona przed elektrolitem, utylizacja akumulatora.","zr":"SZP EV","str":14}]}],"nie_rob":[{"t":"Nie stosuj piany ciężkiej, średniej ani lekkiej — chyba że wymaga tego np. rozlewisko paliwa.","zr":"SZP EV","str":11},{"t":"Nie ingeruj w strukturę akumulatora — grozi porażeniem.","zr":"SZP EV","str":12},{"t":"Nie zatapiaj pojazdu prewencyjnie.","zr":"SZP EV","str":12}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":11,"sekcja":"Karta Z2 — pożar (s. 11–12), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ustaw sprzęt i działaj od strony nawietrznej; wyznacz strefę zagrożenia. SOI: aparat oddechowy, kompletne ubranie specjalne, kominiarka, rękawice, hełm, buty. Ewakuuj osoby ze strefy przy bezpośrednim zagrożeniu życia lub zdrowia. Gaś wodą (małe pożary: woda lub gaśnice ABC / AB); widoczny pożar akumulatora — woda bezpośrednio na akumulator.\n2. PARAMETRY: Prąd rozproszony (PWT Ø52 Turbo) — kąt ≥ 30°, odległość ≥ 1 m od elementów pod napięciem; Prąd zwarty (PWT Ø52 Turbo) — ≤ 250 l/min: ≥ 5 m · > 250 l/min: ≥ 10 m; Chłodzenie akumulatora — > 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; kontrola 30 min; Czas chłodzenia — kilka–kilkanaście godzin (średnio ok. 7 h); nawrót nawet po 20 h\n3. OZNAKI ZAPALENIA AKUMULATORA (THERMAL RUNAWAY): Syczenie, gwizd, wybuch fizyczny; ciemny aerozol pod ciśnieniem; jasny palny gaz rozkładowy; płomienie 3–5 m. Uwolnienia spodziewane od spodu pojazdu (płyta podłogowa) i we wnętrzu (kokpit, bagażnik).\n4. DZIAŁANIA: W pomieszczeniach zamkniętych użyj wentylatora osiowego i podchodź od jego strony. Po ugaszeniu wnętrza sprawdź, czy akumulator nie przechodzi w niestabilność termiczną — pomiary na obudowie przez 30 min. Przy pożarze akumulatora zapewnij znacznie więcej wody niż przy aucie spalinowym; otwory w obudowie wykorzystaj do podania wody z bezpiecznej odległości. Kontroluj atmosferę czujnikiem wielogazowym (wodór, tlenek węgla). Po ugaszeniu: dezaktywacja (jeśli możliwa) i kontrola obudowy akumulatora.\n5. KONTENER: Zatapianie w kontenerze tylko, gdy inne techniki zawiodą; woda najwyżej do górnej krawędzi akumulatora; rozważ suchą kwarantannę. Po zalaniu wodą zadysponuj SGRChem (poziom B) do pobrania próbek.\n6. PRZEKAZANIE: Po pożarze akumulatora: duże ryzyko nawrotu — dozór, ≥ 5 m od pojazdów i budynków, wentylacja, ochrona przed elektrolitem, utylizacja akumulatora.\n7. NIE RÓB: Nie stosuj piany ciężkiej, średniej ani lekkiej — chyba że wymaga tego np. rozlewisko paliwa. Nie ingeruj w strukturę akumulatora — grozi porażeniem. Nie zatapiaj pojazdu prewencyjnie."},{"id":"KARTA-PTASIA-GRYPA-INFORMACJE-I-ZASADY","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ptasia grypa informacje i zasady","keywords":["ptasia grypa informacje","ptasia grypa zasady bezpieczenstwa","informacje o ptasiej grypie","zasady bezpieczenstwa ptasia grypa","grypa ptakow","zjadliwa grypa ptakow","grypa ptakow mswia","wsparcie inspekcji weterynaryjnej"],"aliasy":["ptasia grypa informacje","ptasia grypa zasady bezpieczenstwa","informacje o ptasiej grypie","zasady bezpieczenstwa ptasia grypa","grypa ptakow","zjadliwa grypa ptakow","grypa ptakow mswia","wsparcie inspekcji weterynaryjnej"],"prefix":"Grypa ptaków (HPAI) — ryzyko, kogo nie kierować do działań, zasady higieny (GIS 2025; zasady PSP z wytycznych GIS MSWiA 2017).","najpierw":[{"t":"Nie kieruj do działań strażaków z gorączką, objawami infekcji dróg oddechowych lub bólami mięśni.","zr":"GIS MSWiA 2017","str":2},{"t":"Poinformuj każdego kierowanego do ogniska, że objawy musi zgłosić przełożonemu.","zr":"GIS MSWiA 2017","str":2},{"t":"Przy wsparciu Inspekcji Weterynaryjnej stosuj zasady PSP „BIOHAZARD” (KG PSP, 14.01.2015).","zr":"GIS MSWiA 2017","str":2}],"parametry":[{"nazwa":"Ryzyko — populacja ogólna","wartosc":"niskie","zr":"GIS 2025","str":1},{"nazwa":"Ryzyko — kontakt z chorymi lub martwymi zwierzętami","wartosc":"niskie do umiarkowanego","zr":"GIS 2025","str":1},{"nazwa":"Zakażenie przez","wartosc":"kontakt ze zwierzętami, wydalinami i skażonymi powierzchniami, bioaerozol","zr":"GIS 2025","str":2}],"sekcje":[{"etykieta":"Higiena","punkty":[{"t":"Często i dokładnie myj ręce; nie dotykaj oczu, ust i nosa.","zr":"GIS 2025","str":2},{"t":"Środek do dezynfekcji rąk: co najmniej 60% alkoholu.","zr":"GIS 2025","str":2},{"t":"Odzież robocza oddzielnie od prywatnej; nie wchodź w zabrudzonej odzieży do pomieszczeń socjalnych.","zr":"GIS 2025","str":2},{"t":"Nie przechowuj jedzenia, telefonu ani rzeczy osobistych w miejscach potencjalnie skażonych.","zr":"GIS 2025","str":2}]},{"etykieta":"Kto jest narażony","punkty":[{"t":"M.in. służby podejmujące martwe dzikie ptaki ze zbiorników wodnych oraz służby zwalczające ogniska grypy ptaków.","zr":"GIS 2025","str":1},{"t":"Ryzyko zależy od rodzaju i czasu narażenia oraz konsekwentnego stosowania środków ochrony indywidualnej.","zr":"GIS 2025","str":1}]}],"wsparcie":[{"t":"Szczepienie przeciw grypie sezonowej — zalecane dla osób narażonych; zmniejsza ryzyko ciężkiego przebiegu i reasortacji wirusów.","zr":"GIS 2025","str":5}],"tagi_wspolne":["ptasia grypa","h5n8","informacje","zasady bezpieczenstwa"],"dokumenty_zrodlowe":[{"dokument_id":"doc-hpai-gis-2025","strona":1,"sekcja":"GIS 2025 — ryzyko, osoby narażone, higiena (s. 1–2), szczepienia (s. 5)"},{"dokument_id":"doc-ptasia-grypa-h5n8","strona":2,"sekcja":"GIS MSWiA 2017 — zasady PSP, BIOHAZARD (s. 2–3)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Nie kieruj do działań strażaków z gorączką, objawami infekcji dróg oddechowych lub bólami mięśni. Poinformuj każdego kierowanego do ogniska, że objawy musi zgłosić przełożonemu. Przy wsparciu Inspekcji Weterynaryjnej stosuj zasady PSP „BIOHAZARD” (KG PSP, 14.01.2015).\n2. PARAMETRY: Ryzyko — populacja ogólna — niskie; Ryzyko — kontakt z chorymi lub martwymi zwierzętami — niskie do umiarkowanego; Zakażenie przez — kontakt ze zwierzętami, wydalinami i skażonymi powierzchniami, bioaerozol\n3. HIGIENA: Często i dokładnie myj ręce; nie dotykaj oczu, ust i nosa. Środek do dezynfekcji rąk: co najmniej 60% alkoholu. Odzież robocza oddzielnie od prywatnej; nie wchodź w zabrudzonej odzieży do pomieszczeń socjalnych. Nie przechowuj jedzenia, telefonu ani rzeczy osobistych w miejscach potencjalnie skażonych.\n4. KTO JEST NARAŻONY: M.in. służby podejmujące martwe dzikie ptaki ze zbiorników wodnych oraz służby zwalczające ogniska grypy ptaków. Ryzyko zależy od rodzaju i czasu narażenia oraz konsekwentnego stosowania środków ochrony indywidualnej.\n5. WEZWIJ WSPARCIE, GDY: Szczepienie przeciw grypie sezonowej — zalecane dla osób narażonych; zmniejsza ryzyko ciężkiego przebiegu i reasortacji wirusów."},{"id":"KARTA-PTASIA-GRYPA-NADZOR-EPIDEMIOLOGICZNY","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"nadzor epidemiologiczny ptasia grypa","keywords":["ptasia grypa nadzor","ptasia grypa ekspozycja","ekspozycja na ptasia grype","narazenie na ptasia grype","h5n8 nadzor epidemiologiczny","h5n8 ekspozycja","lista narazonych h5n8","lista funkcjonariuszy narazonych","monitorowanie 10 dni ptasia grypa","obserwacja 10 dni h5n8","objawy po kontakcie z ptasia grypa","postepowanie po narazeniu h5n8"],"aliasy":["ptasia grypa nadzor","ptasia grypa ekspozycja","ekspozycja na ptasia grype","narazenie na ptasia grype","h5n8 nadzor epidemiologiczny","h5n8 ekspozycja","lista narazonych h5n8","lista funkcjonariuszy narazonych","monitorowanie 10 dni ptasia grypa","obserwacja 10 dni h5n8","objawy po kontakcie z ptasia grypa","postepowanie po narazeniu h5n8"],"prefix":"Grypa ptaków — nadzór nad strażakami po bezpośrednim narażeniu (lista do PIS MSWiA; obserwacja objawów).","najpierw":[{"t":"Sporządź listę strażaków z dnia działań w ognisku: imię i nazwisko, adres, jednostka PSP, status szczepienia przeciw grypie.","zr":"GIS MSWiA 2017","str":4},{"t":"Komendant powiatowy (miejski) przekazuje listę Państwowemu Inspektorowi Sanitarnemu MSWiA w województwie — do 2 dni od narażenia.","zr":"GIS MSWiA 2017","str":4}],"parametry":[{"nazwa":"Obserwacja zdrowia","wartosc":"10–14 dni po zakończeniu pracy (GIS 2025; wytyczne 2017: 10 dni)","zr":"GIS 2025","str":5}],"sekcje":[{"etykieta":"Objawy — zgłoś się do lekarza","punkty":[{"t":"Gorączka lub stan podgorączkowy, złe samopoczucie, zmęczenie, bóle głowy, mięśni, stawów.","zr":"GIS 2025","str":5},{"t":"Katar, kaszel, ból gardła, zapalenie spojówek, duszność, biegunka, objawy neurologiczne.","zr":"GIS 2025","str":5},{"t":"Przy objawach: lekarz i informacja do Państwowego Inspektora Sanitarnego MSWiA w województwie.","zr":"GIS MSWiA 2017","str":4},{"t":"Zachorowanie zgłoś też przełożonemu.","zr":"GIS 2025","str":5}]}],"tagi_wspolne":["ptasia grypa","h5n8","nadzor epidemiologiczny","narazenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ptasia-grypa-h5n8","strona":4,"sekcja":"GIS MSWiA 2017 — nadzór epidemiologiczny (s. 4)"},{"dokument_id":"doc-hpai-gis-2025","strona":5,"sekcja":"GIS 2025 — obserwacja objawów (s. 5)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Sporządź listę strażaków z dnia działań w ognisku: imię i nazwisko, adres, jednostka PSP, status szczepienia przeciw grypie. Komendant powiatowy (miejski) przekazuje listę Państwowemu Inspektorowi Sanitarnemu MSWiA w województwie — do 2 dni od narażenia.\n2. PARAMETRY: Obserwacja zdrowia — 10–14 dni po zakończeniu pracy (GIS 2025; wytyczne 2017: 10 dni)\n3. OBJAWY — ZGŁOŚ SIĘ DO LEKARZA: Gorączka lub stan podgorączkowy, złe samopoczucie, zmęczenie, bóle głowy, mięśni, stawów. Katar, kaszel, ból gardła, zapalenie spojówek, duszność, biegunka, objawy neurologiczne. Przy objawach: lekarz i informacja do Państwowego Inspektora Sanitarnego MSWiA w województwie. Zachorowanie zgłoś też przełożonemu."},{"id":"KARTA-PTASIA-GRYPA-SOI-I-DEKONTAMINACJA","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ptasia grypa dekontaminacja","keywords":["dekontaminacja ptasia grypa","ptasia grypa soi","soi ptasia grypa","srodki ochrony indywidualnej ptasia grypa","ochrona osobista h5n8","h5n8 soi","h5n8 ppe","h5n8 dekontaminacja","ffp3 ptasia grypa","maska pelnotwarzowa ptasia grypa","kombinezon ptasia grypa","rekawice nitrylowe ptasia grypa","kalosze ptasia grypa","dezynfekcja ptasia grypa","dekontaminacja ludzi i sprzetu h5n8","kontakt z zakazonym ptactwem","skazony kurnik"],"aliasy":["dekontaminacja ptasia grypa","ptasia grypa soi","soi ptasia grypa","srodki ochrony indywidualnej ptasia grypa","ochrona osobista h5n8","h5n8 soi","h5n8 ppe","h5n8 dekontaminacja","ffp3 ptasia grypa","maska pelnotwarzowa ptasia grypa","kombinezon ptasia grypa","rekawice nitrylowe ptasia grypa","kalosze ptasia grypa","dezynfekcja ptasia grypa","dekontaminacja ludzi i sprzetu h5n8","kontakt z zakazonym ptactwem","skazony kurnik"],"prefix":"Grypa ptaków (HPAI) — środki ochrony indywidualnej, zdejmowanie i dekontaminacja (GIS 2025; procedury PSP z 2017).","najpierw":[{"t":"Ochrona dróg oddechowych: półmaska FFP2/FFP3 (po teście dopasowania), półmaska z filtrami P2/P3 albo maska pełna z filtrem P3.","zr":"GIS 2025","str":3},{"t":"Gogle szczelne (oznaczenie 3 — krople cieczy); półmaska musi szczelnie współpracować z goglami.","zr":"GIS 2025","str":4},{"t":"Po działaniach obowiązkowo dekontaminacja ludzi i sprzętu według procedur PSP dla czynnika biologicznego.","zr":"GIS MSWiA 2017","str":3}],"parametry":[{"nazwa":"Odzież","wartosc":"kombinezon PN-EN 14126: typ 3-B, 4-B lub 6-B (dobór wg ryzyka)","zr":"GIS 2025","str":3},{"nazwa":"Rękawice","wartosc":"podwójne: zewnętrzne gumowe lub tworzywowe (PN-EN ISO 374-5), wewnętrzne medyczne","zr":"GIS 2025","str":4},{"nazwa":"Obuwie","wartosc":"szczelne, całotworzywowe (PN-EN 13832-3), model C, D lub E","zr":"GIS 2025","str":4},{"nazwa":"Obserwacja po narażeniu","wartosc":"10–14 dni","zr":"GIS 2025","str":5}],"sekcje":[{"etykieta":"Zdejmowanie środków ochrony — kolejno","punkty":[{"t":"1) rękawice zewnętrzne, 2) fartuch i ochraniacze na obuwie, 3) wyczyść i zdezynfekuj obuwie, 4) zdejmij obuwie.","zr":"GIS 2025","str":5},{"t":"5) kombinezon, 6) nakrycie głowy, 7) osłona twarzy i gogle, 8) półmaska lub maska.","zr":"GIS 2025","str":5},{"t":"9) rękawice jednorazowe, 10) umyj lub zdezynfekuj ręce, 11) prysznic po zakończeniu pracy.","zr":"GIS 2025","str":5}]},{"etykieta":"Po zdjęciu","punkty":[{"t":"Sprzęt jednorazowy szczelnie zapakuj i przekaż do utylizacji.","zr":"GIS 2025","str":5},{"t":"Sprzęt wielorazowy wstępnie oczyść i odkaź (np. oprysk środkiem wirusobójczym), szczelnie zapakuj do transportu.","zr":"GIS 2025","str":5},{"t":"Na miejscu zapewnij dezynfekcję bieżącą (opryskiwacz lub pojemnik ze środkiem wirusobójczym).","zr":"GIS 2025","str":5},{"t":"Maskę i kalosze myj i dezynfekuj; kombinezon, filtry i rękawice traktuj jako odpad niebezpieczny.","zr":"GIS MSWiA 2017","str":3}]},{"etykieta":"Środki dezynfekcyjne","punkty":[{"t":"Ręce — alkoholowe preparaty wirusobójcze; ciało i włosy — mydło dezynfekujące do chirurgicznego mycia rąk.","zr":"GIS MSWiA 2017","str":3},{"t":"Powierzchnie odporne na korozję — preparaty z podchlorynem sodu lub wapnia.","zr":"GIS MSWiA 2017","str":3},{"t":"Powierzchnie nieodporne na alkohol — złożone preparaty myjąco-dezynfekujące; możliwe zamgławianie.","zr":"GIS MSWiA 2017","str":4}]}],"nie_rob":[{"t":"Nie zostawiaj na miejscu zużytej odzieży, ochraniaczy, rękawic ani innych użytych przedmiotów.","zr":"GIS 2025","str":5},{"t":"Po założeniu środków ochrony nie dotykaj oczu, ust i nosa.","zr":"GIS 2025","str":2}],"tagi_wspolne":["ptasia grypa","h5n8","dekontaminacja","soi"],"dokumenty_zrodlowe":[{"dokument_id":"doc-hpai-gis-2025","strona":3,"sekcja":"GIS 2025 — środki ochrony (s. 3–4), zdejmowanie i postępowanie (s. 5)"},{"dokument_id":"doc-ptasia-grypa-h5n8","strona":3,"sekcja":"GIS MSWiA 2017 — dekontaminacja i środki dezynfekcyjne (s. 3–4)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Ochrona dróg oddechowych: półmaska FFP2/FFP3 (po teście dopasowania), półmaska z filtrami P2/P3 albo maska pełna z filtrem P3. Gogle szczelne (oznaczenie 3 — krople cieczy); półmaska musi szczelnie współpracować z goglami. Po działaniach obowiązkowo dekontaminacja ludzi i sprzętu według procedur PSP dla czynnika biologicznego.\n2. PARAMETRY: Odzież — kombinezon PN-EN 14126: typ 3-B, 4-B lub 6-B (dobór wg ryzyka); Rękawice — podwójne: zewnętrzne gumowe lub tworzywowe (PN-EN ISO 374-5), wewnętrzne medyczne; Obuwie — szczelne, całotworzywowe (PN-EN 13832-3), model C, D lub E; Obserwacja po narażeniu — 10–14 dni\n3. ZDEJMOWANIE ŚRODKÓW OCHRONY — KOLEJNO: 1) rękawice zewnętrzne, 2) fartuch i ochraniacze na obuwie, 3) wyczyść i zdezynfekuj obuwie, 4) zdejmij obuwie. 5) kombinezon, 6) nakrycie głowy, 7) osłona twarzy i gogle, 8) półmaska lub maska. 9) rękawice jednorazowe, 10) umyj lub zdezynfekuj ręce, 11) prysznic po zakończeniu pracy.\n4. PO ZDJĘCIU: Sprzęt jednorazowy szczelnie zapakuj i przekaż do utylizacji. Sprzęt wielorazowy wstępnie oczyść i odkaź (np. oprysk środkiem wirusobójczym), szczelnie zapakuj do transportu. Na miejscu zapewnij dezynfekcję bieżącą (opryskiwacz lub pojemnik ze środkiem wirusobójczym). Maskę i kalosze myj i dezynfekuj; kombinezon, filtry i rękawice traktuj jako odpad niebezpieczny.\n5. ŚRODKI DEZYNFEKCYJNE: Ręce — alkoholowe preparaty wirusobójcze; ciało i włosy — mydło dezynfekujące do chirurgicznego mycia rąk. Powierzchnie odporne na korozję — preparaty z podchlorynem sodu lub wapnia. Powierzchnie nieodporne na alkohol — złożone preparaty myjąco-dezynfekujące; możliwe zamgławianie.\n6. NIE RÓB: Nie zostawiaj na miejscu zużytej odzieży, ochraniaczy, rękawic ani innych użytych przedmiotów. Po założeniu środków ochrony nie dotykaj oczu, ust i nosa."},{"id":"KARTA-RT-ZAKRES-PODSTAWOWY","wzorzec":2,"kategoria":"dzialania","grupa":"rt","zakres":"podstawowy","zrodlo":"KG PSP: Zasady organizacji ratownictwa technicznego w krajowym systemie ratowniczo-gaśniczym, Warszawa, wrzesień 2026 r.","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ratownictwo techniczne zakres podstawowy","keywords":["zakres podstawowy ratownictwo techniczne","co robi zastęp ratownictwo techniczne","uwolnienie uwięzionego","osoba uwięziona","stabilizacja i cięcie konstrukcji","rozpieranie podnoszenie konstrukcji","miejscowe zagrożenie techniczne","kiedy wezwać sgrt","rt zakres podstawowy"],"aliasy":["zakres podstawowy ratownictwo techniczne","co robi zastęp ratownictwo techniczne","uwolnienie uwięzionego","osoba uwięziona","stabilizacja i cięcie konstrukcji","rozpieranie podnoszenie konstrukcji","miejscowe zagrożenie techniczne","kiedy wezwać sgrt","rt zakres podstawowy"],"prefix":"Ratownictwo techniczne — zakres podstawowy zastępów KSRG (Zasady KG PSP, 2026).","najpierw":[{"t":"Rozpoznaj i oceń zagrożenie dla ludzi, zwierząt, środowiska i mienia — życie ludzi to priorytet.","str":8},{"t":"Dotrzyj do uwięzionych, udziel KPP i przekaż poszkodowanych ZRM poza strefą zagrożenia.","str":8},{"t":"Zapewnij asekurację ratowników w strefie zagrożenia i w jej sąsiedztwie.","str":8},{"t":"Ewakuuj ludzi z miejsc zagrożenia życia i zdrowia.","str":8}],"parametry":[{"nazwa":"Gotowość","wartosc":"min. 1 zastęp · 6 ratowników","str":8},{"nazwa":"Strefa zagrożenia","wartosc":"Zasady nie podają wymiarów — wyznacz z rozpoznania","str":6},{"nazwa":"Wsparcie SGRT","wartosc":"A holownik · B rotator · C żuraw samojezdny","str":11}],"sekcje":[{"etykieta":"Działania techniczne","punkty":[{"t":"Stabilizuj, tnij, rozpieraj, podnoś lub przemieszczaj konstrukcje, instalacje, urządzenia i przeszkody — w ramach posiadanego wyposażenia.","str":8},{"t":"Ewakuuj zwierzęta i mienie.","str":8},{"t":"Współdziałaj z podmiotami KSRG i innymi podmiotami zdolnymi do ratownictwa technicznego.","str":8}]},{"etykieta":"Bezpieczeństwo","punkty":[{"t":"KDR stosuje rozporządzenie MSWiA w sprawie warunków BHP strażaków PSP.","str":21},{"t":"Odzież specjalna, SOI i wyposażenie osobiste stosownie do czynności.","str":21},{"t":"Urządzenia obsługują tylko osoby z wymaganymi uprawnieniami (m.in. UDT, hakowy).","str":21},{"t":"W zależności od przebiegu akcji rozważ zabezpieczenie medyczne.","str":21}]}],"wsparcie":[{"t":"Zadanie przekracza sprzęt lub uprawnienia zastępu — zgłoś SK PSP potrzebę SGRT.","str":21}],"nie_rob":[{"t":"Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów.","str":21},{"t":"Nie dopuszczaj do obsługi urządzeń osób bez uprawnień.","str":21},{"t":"Nie pracuj w strefie zagrożenia bez asekuracji.","str":8}],"tagi_wspolne":["ratownictwo techniczne","zakres podstawowy","miejscowe zagrożenie","SGRT"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rt-zasady-2026","strona":8,"sekcja":"Rozdział 2 — zakres podstawowy (ust. 2.1–2.5); Rozdział 6.1 — bezpieczeństwo (s. 21); def. strefy zagrożenia (s. 6)"}],"content":"1. NAJPIERW: Rozpoznaj i oceń zagrożenie dla ludzi, zwierząt, środowiska i mienia — życie ludzi to priorytet. Dotrzyj do uwięzionych, udziel KPP i przekaż poszkodowanych ZRM poza strefą zagrożenia. Zapewnij asekurację ratowników w strefie zagrożenia i w jej sąsiedztwie. Ewakuuj ludzi z miejsc zagrożenia życia i zdrowia.\n2. PARAMETRY: Gotowość — min. 1 zastęp · 6 ratowników; Strefa zagrożenia — Zasady nie podają wymiarów — wyznacz z rozpoznania; Wsparcie SGRT — A holownik · B rotator · C żuraw samojezdny\n3. DZIAŁANIA TECHNICZNE: Stabilizuj, tnij, rozpieraj, podnoś lub przemieszczaj konstrukcje, instalacje, urządzenia i przeszkody — w ramach posiadanego wyposażenia. Ewakuuj zwierzęta i mienie. Współdziałaj z podmiotami KSRG i innymi podmiotami zdolnymi do ratownictwa technicznego.\n4. BEZPIECZEŃSTWO: KDR stosuje rozporządzenie MSWiA w sprawie warunków BHP strażaków PSP. Odzież specjalna, SOI i wyposażenie osobiste stosownie do czynności. Urządzenia obsługują tylko osoby z wymaganymi uprawnieniami (m.in. UDT, hakowy). W zależności od przebiegu akcji rozważ zabezpieczenie medyczne.\n5. WEZWIJ WSPARCIE, GDY: Zadanie przekracza sprzęt lub uprawnienia zastępu — zgłoś SK PSP potrzebę SGRT.\n6. NIE RÓB: Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów. Nie dopuszczaj do obsługi urządzeń osób bez uprawnień. Nie pracuj w strefie zagrożenia bez asekuracji."},{"id":"KARTA-RT-WSPOLPRACA-KDR-SGRT","wzorzec":2,"kategoria":"organizacja","grupa":"rt","zakres":"specjalistyczny","zrodlo":"KG PSP: Zasady organizacji ratownictwa technicznego w krajowym systemie ratowniczo-gaśniczym, Warszawa, wrzesień 2026 r.","data_aktualizacji":"2026-10-25","slowo_kluczowe":"współpraca kdr z sgrt","keywords":["grupa ratownictwa technicznego","dysponowanie sgrt","wezwij sgrt","holownik psp","rotator","żuraw samojezdny psp","poziom a b c sgrt","dowódca działań sgrt","ciężki sprzęt ratownictwo techniczne"],"aliasy":["grupa ratownictwa technicznego","dysponowanie sgrt","wezwij sgrt","holownik psp","rotator","żuraw samojezdny psp","poziom a b c sgrt","dowódca działań sgrt","ciężki sprzęt ratownictwo techniczne"],"prefix":"Współpraca KDR ze specjalistyczną grupą ratownictwa technicznego (SGRT) — Zasady KG PSP 2026.","najpierw":[{"t":"Gdy zadanie przekracza sprzęt lub uprawnienia zakresu podstawowego — zgłoś stanowisku kierowania PSP potrzebę SGRT.","str":21},{"t":"Zorganizuj punkt przyjęcia sił i środków.","str":22},{"t":"Przekaż dowódcy działań SGRT swoją ocenę sytuacji i dokumentację.","str":22},{"t":"Wydziel odcinek bojowy dla SGRT — jego dowódcą jest dowódca działań SGRT.","str":22},{"t":"Zapewnij kanał dowodzenia i współdziałania oraz osobny kanał ratowniczo-gaśniczy dla SGRT.","str":22}],"parametry":[{"nazwa":"Poziom A","wartosc":"holownik · min. 6 ratowników · 2 pojazdy","str":11},{"nazwa":"Poziom B","wartosc":"rotator · min. 6 ratowników · 2 pojazdy","str":11},{"nazwa":"Poziom C","wartosc":"żuraw samojezdny · min. 3 ratowników · 2 pojazdy","str":11},{"nazwa":"Dysponuje","wartosc":"powiat: SK KP/KM PSP · poza powiat: SK KW PSP · poza województwo: SK KG PSP","str":21}],"sekcje":[{"etykieta":"Zadania KDR","punkty":[{"t":"Przejmij kierowanie działaniem ratowniczym.","str":22},{"t":"W razie potrzeby powołaj sztab akcji.","str":22},{"t":"Zapewnij współpracę ze specjalistami z planu ratowniczego powiatu lub województwa.","str":22},{"t":"Rozwiń zaplecze logistyczne akcji.","str":22},{"t":"Przy dwóch lub więcej SGRT to Ty organizujesz teren działań i decydujesz o liczbie odcinków bojowych.","str":23},{"t":"Koordynuj czynności podstawowe i specjalistyczne z innymi podmiotami i służbami na miejscu zdarzenia.","str":23}]},{"etykieta":"Co robi SGRT (poziom A i B)","punkty":[{"t":"Wszystkie zadania zakresu podstawowego oraz rozpoznanie i identyfikację zagrożenia.","str":12},{"t":"Wyznacza i oznakowuje strefę zagrożenia.","str":12},{"t":"Włącza lub wyłącza instalacje, urządzenia i media wpływające na bezpieczeństwo — zaworami i bezpiecznikami instalacji obiektu.","str":12},{"t":"Priorytetowo wykonuje dostęp do poszkodowanych, KPP lub ewakuację oraz drogi ewakuacji.","str":12},{"t":"Stabilizuje, tnie, rozpiera, podnosi i przenosi konstrukcje, urządzenia i przeszkody.","str":12},{"t":"Oświetla i zabezpiecza miejsce zdarzenia; ocenia rozmiar zagrożenia i prognozuje jego rozwój.","str":12},{"t":"Poziom C wspiera grupy A i B dodatkowym sprzętem, w szczególności żurawiem samojezdnym.","str":12}]},{"etykieta":"Dowodzenie na odcinku SGRT","punkty":[{"t":"Dowódca działań SGRT odpowiada za zadanie, które mu powierzysz.","str":22},{"t":"Dowódca działań SGRT decyduje o technikach, zakresie działań, użyciu sprzętu grupy i zadaniach jej członków.","str":23},{"t":"Po przybyciu ocenia: rodzaj zagrożenia i wyniki rozpoznania, zabezpieczenie miejsca, KPP i ewakuację poszkodowanych, potrzebne siły i środki, sposób dotarcia.","str":22},{"t":"Udział podmiotów spoza KSRG (np. firmy z ciężkim sprzętem) — tylko w porozumieniu z dowódcą działań SGRT; on nadzoruje bezpieczeństwo tych osób.","str":23},{"t":"Zabezpieczenie medyczne: gotowość do podjęcia medycznych działań ratowniczych.","str":23}]},{"etykieta":"Zakończenie","punkty":[{"t":"Decyzję o zakończeniu podejmuje KDR — dopiero po likwidacji bezpośredniego zagrożenia.","str":23},{"t":"Teren, obiekt lub mienie przekaż na podstawie „Potwierdzenia przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.","str":23}]}],"wsparcie":[{"t":"Dowódca działań SGRT wnioskuje o powiększenie składu lub kolejną grupę.","str":22},{"t":"Ratujesz życie — przy dysponowaniu uwzględnij najszybszy transport grupy.","str":22},{"t":"Przebieg akcji tego wymaga — rozważ zabezpieczenie medyczne działań.","str":21}],"nie_rob":[{"t":"Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów.","str":21},{"t":"Nie dopuszczaj do obsługi urządzeń osób bez uprawnień wymaganych przepisami o dozorze technicznym.","str":21},{"t":"Nie kończ działań SGRT przed likwidacją bezpośredniego zagrożenia.","str":23}],"tagi_wspolne":["ratownictwo techniczne","zakres specjalistyczny","SGRT","organizacja działań"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rt-zasady-2026","strona":21,"sekcja":"Rozdział 3 (s. 11–12) i Rozdział 6 (s. 21–23)"}],"content":"1. NAJPIERW: Gdy zadanie przekracza sprzęt lub uprawnienia zakresu podstawowego — zgłoś stanowisku kierowania PSP potrzebę SGRT. Zorganizuj punkt przyjęcia sił i środków. Przekaż dowódcy działań SGRT swoją ocenę sytuacji i dokumentację. Wydziel odcinek bojowy dla SGRT — jego dowódcą jest dowódca działań SGRT. Zapewnij kanał dowodzenia i współdziałania oraz osobny kanał ratowniczo-gaśniczy dla SGRT.\n2. PARAMETRY: Poziom A — holownik · min. 6 ratowników · 2 pojazdy; Poziom B — rotator · min. 6 ratowników · 2 pojazdy; Poziom C — żuraw samojezdny · min. 3 ratowników · 2 pojazdy; Dysponuje — powiat: SK KP/KM PSP · poza powiat: SK KW PSP · poza województwo: SK KG PSP\n3. ZADANIA KDR: Przejmij kierowanie działaniem ratowniczym. W razie potrzeby powołaj sztab akcji. Zapewnij współpracę ze specjalistami z planu ratowniczego powiatu lub województwa. Rozwiń zaplecze logistyczne akcji. Przy dwóch lub więcej SGRT to Ty organizujesz teren działań i decydujesz o liczbie odcinków bojowych. Koordynuj czynności podstawowe i specjalistyczne z innymi podmiotami i służbami na miejscu zdarzenia.\n4. CO ROBI SGRT (POZIOM A I B): Wszystkie zadania zakresu podstawowego oraz rozpoznanie i identyfikację zagrożenia. Wyznacza i oznakowuje strefę zagrożenia. Włącza lub wyłącza instalacje, urządzenia i media wpływające na bezpieczeństwo — zaworami i bezpiecznikami instalacji obiektu. Priorytetowo wykonuje dostęp do poszkodowanych, KPP lub ewakuację oraz drogi ewakuacji. Stabilizuje, tnie, rozpiera, podnosi i przenosi konstrukcje, urządzenia i przeszkody. Oświetla i zabezpiecza miejsce zdarzenia; ocenia rozmiar zagrożenia i prognozuje jego rozwój. Poziom C wspiera grupy A i B dodatkowym sprzętem, w szczególności żurawiem samojezdnym.\n5. DOWODZENIE NA ODCINKU SGRT: Dowódca działań SGRT odpowiada za zadanie, które mu powierzysz. Dowódca działań SGRT decyduje o technikach, zakresie działań, użyciu sprzętu grupy i zadaniach jej członków. Po przybyciu ocenia: rodzaj zagrożenia i wyniki rozpoznania, zabezpieczenie miejsca, KPP i ewakuację poszkodowanych, potrzebne siły i środki, sposób dotarcia. Udział podmiotów spoza KSRG (np. firmy z ciężkim sprzętem) — tylko w porozumieniu z dowódcą działań SGRT; on nadzoruje bezpieczeństwo tych osób. Zabezpieczenie medyczne: gotowość do podjęcia medycznych działań ratowniczych.\n6. ZAKOŃCZENIE: Decyzję o zakończeniu podejmuje KDR — dopiero po likwidacji bezpośredniego zagrożenia. Teren, obiekt lub mienie przekaż na podstawie „Potwierdzenia przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.\n7. WEZWIJ WSPARCIE, GDY: Dowódca działań SGRT wnioskuje o powiększenie składu lub kolejną grupę. Ratujesz życie — przy dysponowaniu uwzględnij najszybszy transport grupy. Przebieg akcji tego wymaga — rozważ zabezpieczenie medyczne działań.\n8. NIE RÓB: Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów. Nie dopuszczaj do obsługi urządzeń osób bez uprawnień wymaganych przepisami o dozorze technicznym. Nie kończ działań SGRT przed likwidacją bezpośredniego zagrożenia."},{"id":"WYP-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wypadek samochodu elektrycznego","keywords":["wypadek ev","kolizja ev","samochod elektryczny po wypadku","auto elektryczne po dachowaniu","zderzenie auta elektrycznego","rozbity elektryk","uszkodzony pojazd elektryczny","kolizja samochodu elektrycznego","wypadek tesli","uszkodzona bateria trakcyjna po kolizji"],"aliasy":["wypadek ev","kolizja ev","samochod elektryczny po wypadku","auto elektryczne po dachowaniu","zderzenie auta elektrycznego","rozbity elektryk","uszkodzony pojazd elektryczny","kolizja samochodu elektrycznego","wypadek tesli","uszkodzona bateria trakcyjna po kolizji"],"prefix":"Wypadek komunikacyjny samochodu elektrycznego lub hybrydowego — karta Z1 SZP KG PSP (2023).","najpierw":[{"t":"Ustaw pojazdy ratownicze tak, by zabezpieczyć miejsce działań; wyznacz strefę zagrożenia.","zr":"SZP EV","str":9},{"t":"Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast.","zr":"SZP EV","str":9},{"t":"Brak pewności co do napędu = zakładaj instalację wysokiego napięcia.","zr":"SZP EV","str":9},{"t":"Załóż, że automatyczna dezaktywacja (poduszki, napinacze) nie zadziałała — wykonaj ją ręcznie (karta „Dezaktywacja”).","zr":"SZP EV","str":9},{"t":"Przygotuj linię gaśniczą lub gaśnicę oraz kamerę termowizyjną lub pirometr.","zr":"SZP EV","str":9}],"parametry":[{"nazwa":"Chłodzenie akumulatora","wartosc":"> 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar","zr":"SZP EV","str":10},{"nazwa":"Kontrola po chłodzeniu","wartosc":"30 min; ponów przy wzroście temperatury","zr":"SZP EV","str":10}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Duże zniszczenia mogą oznaczać uszkodzenie akumulatora lub układu WN — ryzyko porażenia przez karoserię.","zr":"SZP EV","str":9},{"t":"Kontroluj temperaturę akumulatora w wielu miejscach; możliwy wyciek płynu chłodzącego i elektrolitu (drażniący, palny, żrący).","zr":"SZP EV","str":9},{"t":"Odłącz pojazd od stacji ładowania (wyłącznik bezpieczeństwa lub dyspozytor stacji).","zr":"SZP EV","str":3}]},{"etykieta":"Działania ratownicze","punkty":[{"t":"Techniki, kierunki ewakuacji i dostęp — jak dla standardowego samochodu osobowego.","zr":"SZP EV","str":9},{"t":"Przy dostępie unikaj cięcia i rozpierania w pobliżu przewodów, komponentów i akumulatora — położenie z karty ratowniczej.","zr":"SZP EV","str":9},{"t":"Stosuj SOI chroniące przed porażeniem; sprzęt z certyfikatem elektroizolacyjności (np. rękawice).","zr":"SZP EV","str":9},{"t":"Wycieki z akumulatora usuwaj standardowym sorbentem.","zr":"SZP EV","str":10},{"t":"Przy podnoszeniu wybierz punkty podparcia omijające akumulator i elementy WN.","zr":"SZP EV","str":10}]},{"etykieta":"Przekazanie","punkty":[{"t":"Przekaż na „Potwierdzeniu przekazania terenu…” i poinformuj o: dozorze, odstawieniu ≥ 5 m od pojazdów, materiałów palnych i budynków, bezpiecznym holowaniu modelu.","zr":"SZP EV","str":14},{"t":"Przy uszkodzonym akumulatorze dodatkowo: wentylacja wnętrza, ochrona przed wyciekiem elektrolitu, SOI, utylizacja przez wyspecjalizowaną firmę.","zr":"SZP EV","str":14}]}],"nie_rob":[{"t":"Nie dotykaj, nie demontuj i nie ingeruj w uszkodzone elementy układu WN.","zr":"SZP EV","str":9}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","wypadek"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":9,"sekcja":"Karta Z1 — wypadek komunikacyjny (s. 9–10), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ustaw pojazdy ratownicze tak, by zabezpieczyć miejsce działań; wyznacz strefę zagrożenia. Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast. Brak pewności co do napędu = zakładaj instalację wysokiego napięcia. Załóż, że automatyczna dezaktywacja (poduszki, napinacze) nie zadziałała — wykonaj ją ręcznie (karta „Dezaktywacja”). Przygotuj linię gaśniczą lub gaśnicę oraz kamerę termowizyjną lub pirometr.\n2. PARAMETRY: Chłodzenie akumulatora — > 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; Kontrola po chłodzeniu — 30 min; ponów przy wzroście temperatury\n3. ROZPOZNANIE: Duże zniszczenia mogą oznaczać uszkodzenie akumulatora lub układu WN — ryzyko porażenia przez karoserię. Kontroluj temperaturę akumulatora w wielu miejscach; możliwy wyciek płynu chłodzącego i elektrolitu (drażniący, palny, żrący). Odłącz pojazd od stacji ładowania (wyłącznik bezpieczeństwa lub dyspozytor stacji).\n4. DZIAŁANIA RATOWNICZE: Techniki, kierunki ewakuacji i dostęp — jak dla standardowego samochodu osobowego. Przy dostępie unikaj cięcia i rozpierania w pobliżu przewodów, komponentów i akumulatora — położenie z karty ratowniczej. Stosuj SOI chroniące przed porażeniem; sprzęt z certyfikatem elektroizolacyjności (np. rękawice). Wycieki z akumulatora usuwaj standardowym sorbentem. Przy podnoszeniu wybierz punkty podparcia omijające akumulator i elementy WN.\n5. PRZEKAZANIE: Przekaż na „Potwierdzeniu przekazania terenu…” i poinformuj o: dozorze, odstawieniu ≥ 5 m od pojazdów, materiałów palnych i budynków, bezpiecznym holowaniu modelu. Przy uszkodzonym akumulatorze dodatkowo: wentylacja wnętrza, ochrona przed wyciekiem elektrolitu, SOI, utylizacja przez wyspecjalizowaną firmę.\n6. NIE RÓB: Nie dotykaj, nie demontuj i nie ingeruj w uszkodzone elementy układu WN."},{"id":"WYP-MAS-01","wzorzec":2,"zrodlo":"KG PSP: Zasady organizacji ratownictwa medycznego w KSRG (czerwiec 2021) – dokument główny, zał. 2 i 7","data_aktualizacji":"2026-10-27","slowo_kluczowe":"wypadek masowy","keywords":["autobus i elektryk","duzo poszkodowanych","karambol","masowe zdarzenie drogowe","wiele ofiar","mci","zdarzenie masowe","wielu poszkodowanych","triage","segregacja medyczna","wypadek autobusu","karambol wielu poszkodowanych","masowka","segregacja start","jumpstart","kierujący akcją medyczną","kmdr","mobilna baza sprzętu medycznego"],"aliasy":["autobus i elektryk","duzo poszkodowanych","karambol","masowe zdarzenie drogowe","wiele ofiar","mci","zdarzenie masowe","wielu poszkodowanych","triage","segregacja medyczna","wypadek autobusu","karambol wielu poszkodowanych","masowka"],"prefix":"Zdarzenie masowe (wielu poszkodowanych) — segregacja START, współpraca KDR z KAM, transport i zakończenie.","najpierw":[{"t":"Oceń liczbę poszkodowanych segregacją wstępną (START) już w rozpoznaniu.","zr":"RM zał. 2","str":1},{"t":"Przekaż SK PSP: liczbę poszkodowanych, możliwości ZRM na miejscu i — w porozumieniu z KAM — potrzebne siły, w tym mobilną bazę sprzętu medycznego.","zr":"RM zał. 2","str":7},{"t":"Do przybycia ZRM wskaż Koordynatora Medycznych Działań Ratowniczych (KMDR): lekarz, pielęgniarka lub ratownik medyczny.","zr":"RM zał. 7","str":4}],"parametry":[{"nazwa":"Zdarzenie masowe","wartosc":"potrzeby z segregacji przekraczają siły i środki obecne na miejscu","zr":"RM","str":11},{"nazwa":"I – czerwony","wartosc":"oddech > 30/min · brak tętna na t. promieniowej · nawrót kapilarny > 2 s · nie wykonuje poleceń · oddycha dopiero po udrożnieniu","zr":"RM zał. 2","str":2},{"nazwa":"II – żółty","wartosc":"nie chodzi, oddech < 30/min, krążenie wydolne, wykonuje polecenia","zr":"RM zał. 2","str":2},{"nazwa":"III – zielony","wartosc":"chodzi samodzielnie","zr":"RM zał. 2","str":2},{"nazwa":"IV – czarny","wartosc":"nie oddycha mimo udrożnienia dróg oddechowych","zr":"RM zał. 2","str":2},{"nazwa":"Dzieci 1–8 lat","wartosc":"JumpSTART; dziecko < 1 roku z obrażeniami: zielony → żółty","zr":"RM zał. 2","str":3},{"nazwa":"CBRNE","wartosc":"segregacja SIEVE","zr":"RM zał. 2","str":1}],"sekcje":[{"etykieta":"Segregacja","punkty":[{"t":"Cel: uratować jak największą liczbę poszkodowanych.","zr":"RM zał. 2","str":1},{"t":"W segregacji wstępnej wykonuj tylko czynności ratujące życie: udrożnienie dróg oddechowych, pozycja boczna bezpieczna, zatamowanie krwotoku.","zr":"RM zał. 2","str":1},{"t":"Brak tętna na tętnicy promieniowej — zatamuj krwotok i oznacz jako I.","zr":"RM zał. 2","str":2},{"t":"U małych dzieci ocena chodzenia jest zawodna; nawrót kapilarny oceniaj na mostku lub czole.","zr":"RM zał. 2","str":3},{"t":"Segregację wtórną (pełne badanie, kolejność transportu) prowadzi najbardziej doświadczony personel medyczny.","zr":"RM zał. 2","str":6}]},{"etykieta":"Współpraca z KAM","punkty":[{"t":"Po przybyciu pierwszego ZRM koordynację medyczną przejmuje KAM; jego dane i sposób łączności przekazuje Ci SK PSP.","zr":"RM zał. 7","str":4},{"t":"KAM organizuje segregację medyczną, punkt lub obszar pomocy medycznej i transport pacjentów.","zr":"RM zał. 7","str":6},{"t":"KMDR z ratownikami KSRG działa w strefach zagrożenia dla ZRM i przekazuje informację o wykonaniu dostępu do poszkodowanych.","zr":"RM zał. 7","str":6},{"t":"Wymieniaj z KAM informacje o zagrożeniach, czasie wykonania dostępu i konieczności wycofania ZRM ze strefy.","zr":"RM zał. 7","str":5}]},{"etykieta":"Transport i zakończenie","punkty":[{"t":"Sprzętem KSRG przemieszczaj poszkodowanych tylko do miejsca, gdzie PRM może podjąć czynności.","zr":"RM zał. 7","str":7},{"t":"Transport sprzętem KSRG w stanie wyższej konieczności — decyduje wyłącznie KDR; powiadom SK i wpisz uzasadnienie w informacji ze zdarzenia.","zr":"RM zał. 7","str":8},{"t":"Sprzęt przekazany z poszkodowanym uzupełnij na miejscu „sztuka za sztukę”.","zr":"RM zał. 7","str":8}]}],"wsparcie":[{"t":"Potrzebujesz dodatkowych sił — przekaż to przez SDM do SK KP/KM PSP albo do dyspozytora medycznego.","zr":"RM zał. 7","str":2},{"t":"Mobilna baza sprzętu medycznego — wnioskuj przez SK PSP w porozumieniu z KAM.","zr":"RM zał. 2","str":7},{"t":"Grupa Ratownictwa Medycznego (GRMed) — na wniosek KDR przez SK KW PSP.","zr":"RM","str":29},{"t":"Na miejscu są pojazdy elektryczne lub hybrydowe — równolegle zastosuj karty „Wypadek pojazdu elektrycznego po kolizji drogowej” i „Dezaktywacja awaryjna pojazdu elektrycznego”."}],"nie_rob":[{"t":"Nie dopuść do niekontrolowanej ewakuacji poszkodowanych — nie przenoś katastrofy do szpitala.","zr":"RM zał. 2","str":6}],"tagi_wspolne":["wypadek","zdarzenie masowe","wielu poszkodowanych","segregacja medyczna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zorm-2021-zal2","strona":1,"sekcja":"RM zał. 2 — Segregacja poszkodowanych w zdarzeniach masowych (s. 1–7)"},{"dokument_id":"doc-zorm-2021-zal7","strona":4,"sekcja":"RM zał. 7 — Współpraca z PRM: KMDR, KAM, transport (s. 2–8)"},{"dokument_id":"doc-zorm-2021","strona":11,"sekcja":"RM — def. zdarzenia masowego (s. 11), GRMed (s. 29)"}],"data_przegladu":"2026-10-27","pelna_procedura":{"tytul":"Zasady organizacji ratownictwa medycznego w KSRG — zał. 2 Segregacja poszkodowanych w zdarzeniach masowych","plik":"dokumenty/kpp/zorm-2021/zal-02-segregacja-zdarzenia-masowe.pdf","strona":1},"grupa":"kpp","content":"1. NAJPIERW: Oceń liczbę poszkodowanych segregacją wstępną (START) już w rozpoznaniu. Przekaż SK PSP: liczbę poszkodowanych, możliwości ZRM na miejscu i — w porozumieniu z KAM — potrzebne siły, w tym mobilną bazę sprzętu medycznego. Do przybycia ZRM wskaż Koordynatora Medycznych Działań Ratowniczych (KMDR): lekarz, pielęgniarka lub ratownik medyczny.\n2. PARAMETRY: Zdarzenie masowe — potrzeby z segregacji przekraczają siły i środki obecne na miejscu; I – czerwony — oddech > 30/min · brak tętna na t. promieniowej · nawrót kapilarny > 2 s · nie wykonuje poleceń · oddycha dopiero po udrożnieniu; II – żółty — nie chodzi, oddech < 30/min, krążenie wydolne, wykonuje polecenia; III – zielony — chodzi samodzielnie; IV – czarny — nie oddyc
