            log(message, false);
        }

        function mergeProcedureDocumentLinks(items, fallbackItems) {
            const incoming = Array.isArray(items) ? items : [];
            const fallback = Array.isArray(fallbackItems) ? fallbackItems : [];

            // Karta oznaczona w bazie online jako {"id": "...", "wycofana": true}
            // znika z aplikacji, takze z kopii wbudowanej w ten plik.
            // Bez tego wycofanej karty nie dalo sie usunac.
            const withdrawnIds = new Set(
                incoming
                    .filter(item => item && item.wycofana === true)
                    .map(item => String(item.id || ""))
                    .filter(Boolean)
            );

            // Lista wycofanych ID jest zapamietywana, aby karta nie wracala
            // z kopii wbudowanej przy kolejnym uruchomieniu bez internetu.
            try {
                const stored = JSON.parse(
                    safeStorageGet(WITHDRAWN_PROCEDURES_KEY) || "[]"
                );
                if (Array.isArray(stored)) {
                    stored.forEach(id => withdrawnIds.add(String(id)));
                }
            } catch (error) {}
            if (withdrawnIds.size) {
                safeStorageSet(
                    WITHDRAWN_PROCEDURES_KEY,
                    JSON.stringify([...withdrawnIds])
                );
            }

            const fallbackById = new Map(
                fallback
                    .filter(validateProcedure)
                    .map(item => [item.id, item])
            );

            const merged = incoming
                .filter(validateProcedure)
                .filter(item => !withdrawnIds.has(item.id))
                .map(item => {
                    const source = fallbackById.get(item.id);
                    if (!source) return item;

                    const result = { ...item };
                    const currentRefs = Array.isArray(result.dokumenty_zrodlowe)
                        ? result.dokumenty_zrodlowe
                        : [];
                    const fallbackRefs = Array.isArray(source.dokumenty_zrodlowe)
                        ? source.dokumenty_zrodlowe
                        : [];

                    if (!currentRefs.length && fallbackRefs.length) {
                        result.dokumenty_zrodlowe = fallbackRefs;
                    }

                    const currentLegacyFile =
                        String(result?.pelna_procedura?.plik || "").trim();
                    const fallbackLegacyFile =
                        String(source?.pelna_procedura?.plik || "").trim();

                    if (!currentLegacyFile && fallbackLegacyFile) {
                        result.pelna_procedura = source.pelna_procedura;
                    }

                    return result;
                });

            const usedIds = new Set(merged.map(item => item.id));
            fallback
                .filter(validateProcedure)
                .filter(item => !usedIds.has(item.id))
                .filter(item => !withdrawnIds.has(item.id))
                .forEach(item => merged.push(item));

            return merged;
        }

        function applyProcedureSet(items) {
            const withProtectedLinks = mergeProcedureDocumentLinks(
                items,
                EMBEDDED_PROCEDURES
            );
            const prepared = dedupeProcedures(
                withProtectedLinks.filter(validateProcedure)
            );

            if (!prepared.length) return false;

            state.procedury = prepared;
            state.procedureFingerprint = computeProcedureFingerprint(prepared);
            state.suggestIndex = null;
            setMicEnabled(true);
            updateApiButton();
            return true;
        }

        function normalizeDocumentRegistry(payload) {
            const source = payload?.dokumenty || payload;

            if (!source || typeof source !== "object" || Array.isArray(source)) {
                return {};
            }

            const prepared = {};

            for (const [key, item] of Object.entries(source)) {
                if (!item || typeof item !== "object") continue;

                const id = String(item.id || key || "").trim();
                const title = String(item.tytul || "").trim();
                const file = String(item.plik || "").trim();

                if (!id || !title || !file) continue;

                prepared[id] = {
                    ...item,
                    id,
                    tytul: title,
                    plik: file
                };
            }

            return prepared;
        }

        function applyDocumentRegistry(payload) {
            const prepared = normalizeDocumentRegistry(payload);
            if (!Object.keys(prepared).length) return false;
            state.documentRegistry = prepared;
            return true;
        }

        function readDocumentRegistryCache() {
            try {
                const raw = localStorage.getItem(DOCUMENT_REGISTRY_CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                return null;
            }
        }

        function saveDocumentRegistryCache(payload) {
            try {
                localStorage.setItem(
                    DOCUMENT_REGISTRY_CACHE_KEY,
                    JSON.stringify(payload)
                );
            } catch (error) {}
        }

        async function refreshDocumentRegistryInBackground() {
            if (!/^https?:$/i.test(location.protocol)) return;

            try {
                const online = await fetchJsonFile(DOCUMENT_REGISTRY_URL);
                if (applyDocumentRegistry(online)) {
                    saveDocumentRegistryCache(online);
                }
            } catch (error) {
                log(`Rejestr dokumentów online niedostępny: ${error.message}`);
            }
        }

        function getDocumentRegistryStamp(payload) {
            const value = String(payload?.zaktualizowano || "").trim();
            const parsed = Date.parse(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function loadDocumentRegistry() {
            const cached = readDocumentRegistryCache();
            const embedded = EMBEDDED_DOCUMENT_REGISTRY;
            const cachedCount = Object.keys(
                normalizeDocumentRegistry(cached)
            ).length;
            const embeddedCount = Object.keys(
                normalizeDocumentRegistry(embedded)
            ).length;
            const cachedStamp = getDocumentRegistryStamp(cached);
            const embeddedStamp = getDocumentRegistryStamp(embedded);

            const selected =
                cachedCount > 0 &&
                cachedStamp > embeddedStamp
                    ? cached
                    : embedded;

            // Przy tej samej dacie wersja wbudowana ma pierwszenstwo.
            // Chroni to przed uzyciem starego cache po aktualizacji aplikacji.
            applyDocumentRegistry(
                Object.keys(normalizeDocumentRegistry(selected)).length
                    ? selected
                    : (cachedCount >= embeddedCount ? cached : embedded)
            );

            refreshDocumentRegistryInBackground();
        }

        function readProcedureCache() {
            try {
                const raw = localStorage.getItem(PROCEDURE_CACHE_KEY);
                if (!raw) return [];

                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];

                return dedupeProcedures(parsed.filter(validateProcedure));
            } catch (error) {
                return [];
            }
        }

        function saveProcedureCache(items) {
            try {
                const serialized = JSON.stringify(items);

                // Standardowy limit localStorage wynosi zwykle około 5 MB.
                // Zostawiamy zapas, aby nie blokować innych ustawień aplikacji.
                if (serialized.length > 4_000_000) {
                    log("Baza jest zbyt duża, aby zapisać ją w pamięci przeglądarki.", true);
                    return;
                }

                localStorage.setItem(PROCEDURE_CACHE_KEY, serialized);
                localStorage.setItem(
                    PROCEDURE_CACHE_META_KEY,
                    JSON.stringify({
                        count: items.length,
                        savedAt: new Date().toISOString()
                    })
                );
            } catch (error) {
                log("Nie udało się zapisać procedur w pamięci urządzenia.", true);
            }
        }

        async function fetchJsonFile(url) {
            const separator = url.includes("?") ? "&" : "?";
            const response = await fetch(
                `${url}${separator}v=${Date.now()}`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return response.json();
        }

        async function loadAggregateProcedures() {
            const json = await fetchJsonFile(FALLBACK_URL);

            if (!Array.isArray(json)) {
                throw new Error("baza.json nie zawiera tablicy procedur");
            }

            const prepared = dedupeProcedures(json.filter(validateProcedure));

            if (!prepared.length) {
                throw new Error("baza.json nie zawiera poprawnych procedur");
            }

            return prepared;
        }

        function setMicEnabled(enabled) {
            micBtn.disabled = !enabled;
        }

        function updateMicPresentation(label = "Rozkaz") {
            micBtn.textContent = label;
        }

        function setResultMode(active) {
            document.body.classList.toggle("result-mode", active);
        }

        async function ensureInitialized() {
            if (state.isInitialized) return;
            state.isInitialized = true;
            await init();
        }

        async function bootstrapApp() {
            // Kod dostepu zostal zlikwidowany (decyzja z 2026-10-25).
            // Czyscimy pozostalosci po nim zapisane na urzadzeniach.
            safeStorageRemove(ACCESS_REMEMBER_KEY);
            safeSessionRemove(ACCESS_SESSION_KEY);
            await ensureInitialized();
        }

        function renderAiDiagnostics() {
            if (!apiDiagnosticsText) return;
            const diagnostics = state.lastAiDiagnostics;

            if (!diagnostics) {
                apiDiagnosticsText.textContent =
                    `Model: ${AI_MODEL_LABEL}. Diagnostyka pojawi się po zapytaniu.`;
                return;
            }

            const parts = [
                `Model: ${diagnostics.model || AI_MODEL_LABEL}`,
                `czas: ${Number(diagnostics.durationMs || 0)} ms`,
                `kandydaci: ${Number(diagnostics.candidateCount || 0)}`
            ];

            if (diagnostics.attempt) parts.push(`próba: ${diagnostics.attempt}`);
            if (Number.isFinite(diagnostics.confidence)) {
                parts.push(`pewność: ${Math.round(diagnostics.confidence * 100)}%`);
            }

            apiDiagnosticsText.textContent = parts.join(" • ");
        }

        function updateApiButton() {
            safeStorageRemove("kdr_ai_api_key");
            safeStorageRemove("kdr_ai_api_model");

            if (aiToggle) aiToggle.checked = state.aiEnabled;

            if (apiEndpointText) apiEndpointText.textContent = AI_PROXY_SEARCH_URL;
            if (apiStatusText && state.aiAvailable) {
                apiStatusText.textContent =
                    "Gotowe — klucz jest chroniony w Cloudflare Worker.";
            }
            renderAiDiagnostics();
        }

        function normalizeText(value) {
            return (value || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\p{L}\p{N}\s-]/gu, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function escapeHtml(value) {
            return (value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function validateProcedure(item) {
            return Boolean(
                item &&
                typeof item.id === "string" &&
                typeof item.prefix === "string" &&
                Array.isArray(item.keywords) &&
                typeof item.content === "string"
            );
        }

        function dedupeProcedures(items) {
            const map = new Map();
            items.filter(validateProcedure).forEach(item => map.set(item.id, item));
            return Array.from(map.values());
        }

        async function refreshProceduresInBackground() {
            if (!/^https?:$/i.test(location.protocol)) {
                setLoadStatus(
                    `Gotowe · ${state.procedury.length} procedur · tryb lokalny`,
                    "success"
                );
                return;
            }

            try {
                const aggregate = await loadAggregateProcedures();

                if (!aggregate.length) {
                    throw new Error("baza.json nie zawiera procedur");
                }

                applyProcedureSet(aggregate);
                saveProcedureCache(state.procedury);

                setLoadStatus(
                    `Gotowe · ${state.procedury.length} procedur`,
                    "success"
                );
                if (state.view === "home") renderHome();
            } catch (error) {
                setLoadStatus(
                    `Gotowe · ${state.procedury.length} procedur · bez aktualizacji online`,
                    "warning"
                );

                // Baza wbudowana nadal działa. Nie pokazujemy czerwonego
                // komunikatu "Failed to fetch" jako błędu krytycznego.
                log(`Aktualizacja online niedostępna: ${error.message}`);
            }
        }

        async function loadProcedures() {
            const cached = readProcedureCache();
            const embedded = dedupeProcedures(
                EMBEDDED_PROCEDURES.filter(validateProcedure)
            );

            const initial =
                cached.length > embedded.length
                    ? cached
                    : embedded;

            if (!applyProcedureSet(initial)) {
                setMicEnabled(false);
                setLoadStatus(
                    "Błąd: wbudowana baza procedur jest nieprawidłowa.",
                    "error"
                );
                return;
            }

            setLoadStatus(
                `Gotowe · ${state.procedury.length} procedur · sprawdzam aktualizacje…`,
                "success"
            );

            // Aktualizacja nie blokuje gotowości aplikacji.
            refreshProceduresInBackground();
        }

        async function init() {
            applyPreferences();
            updateApiButton();
            loadDocumentRegistry();
            await loadProcedures();

            if (!state.procedury.length) {
                setMicEnabled(false);
            }

            renderHome();
        }

        function getRecognitionCtor() {
            return window.SpeechRecognition || window.webkitSpeechRecognition;
        }

        function clearListeningWatchdog() {
            if (!state.listenWatchdogId) return;
            clearTimeout(state.listenWatchdogId);
            state.listenWatchdogId = null;
        }

        function clearIosInputSubmitTimer() {
            if (!state.iosInputSubmitTimer) return;
            clearTimeout(state.iosInputSubmitTimer);
            state.iosInputSubmitTimer = null;
        }

        function resetListeningUi() {
            clearListeningWatchdog();
            state.isListening = false;
            state.isBusy = false;
            micBtn.classList.remove("listening");
            updateMicPresentation("Rozkaz");
            setMicEnabled(true);
        }

        function finishRecognitionCycle() {
            state.recognitionActive = false;
            resetListeningUi();
        }

        // Komunikat (np. brak wynikow) nad ekranem startowym, aby uzytkownik
        // od razu mogl wybrac kategorie zamiast trafic w slepy zaulek.
        function renderEmptyState(message) {
            renderHome();
            state.view = "message";
            procedureOutput.insertAdjacentHTML(
                "afterbegin",
                `<div class="empty-state">${escapeHtml(message)}</div>`
            );
        }

        function buildFullDocumentUrl(info) {
            const file = (info?.plik || "").trim();
            if (!file) return "";

            try {
                const url = new URL(file, location.href);

                if (!["https:", "http:"].includes(url.protocol)) {
                    return "";
                }

                const isWebSource = String(info?.typ || "").toLowerCase() === "url";
                const page = Number(info?.strona);

                if (!isWebSource && Number.isInteger(page) && page > 0) {
                    url.hash = `page=${page}`;
                }

                return url.href;
            } catch (error) {
                return "";
            }
        }

        function getProcedureDocumentReferences(doc) {
            const refs = Array.isArray(doc?.dokumenty_zrodlowe)
                ? doc.dokumenty_zrodlowe
                : [];

            if (refs.length) {
                return refs.map(ref => ({
                    ref,
                    document: state.documentRegistry?.[ref.dokument_id] || null
                }));
            }

            const legacy = doc?.pelna_procedura || {};
            if ((legacy.plik || "").trim()) {
                return [{
                    ref: {
                        strona: legacy.strona,
                        sekcja: ""
                    },
                    document: {
                        id: "legacy",
                        tytul: legacy.tytul || doc.zrodlo || "Pełna procedura",
                        plik: legacy.plik,
                        status_techniczny: "aktywny",
                        wersja: "",
                        data_wydania: ""
                    }
                }];
            }

            return [];
        }

        // Ocena aktualnosci dokumentu na podstawie pola
        // "aktualnosc_merytoryczna" z rejestru (ustawianego po przegladzie).
        function getDocumentFreshness(document) {
            const status = String(document?.aktualnosc_merytoryczna || "");
            const verified = status.match(/zweryfikowano_(\d{4}-\d{2}-\d{2})/);
            if (/zmiana_wykryta/i.test(status)) {
                return { level: "warn", text: "wykryto zmianę źródła — w trakcie weryfikacji" };
            }
            if (/wymaga|do_potwierdzenia/i.test(status)) {
                return { level: "warn", text: "do weryfikacji" };
            }
            if (/pomocniczy/i.test(status)) {
                return { level: "info", text: "materiał pomocniczy" };
            }
            if (verified) {
                return { level: "ok", text: `zweryfikowano ${verified[1]}` };
            }
            return { level: "ok", text: "aktywny" };
        }

        function renderFreshnessLabel(document) {
            const freshness = getDocumentFreshness(document);
            return `<span class="full-document-status status-${freshness.level}">${escapeHtml(freshness.text)}</span>`;
        }

        // Linia pod tytulem karty: data aktualizacji/przegladu karty oraz
        // ostrzezenie, gdy ktorys dokument zrodlowy wymaga weryfikacji.
        function renderCardFreshness(doc) {
            const reviewed = String(doc.data_przegladu || "").trim();
            const updated = String(doc.data_aktualizacji || "").trim();
            const parts = [];
            if (updated) parts.push(`Karta zaktualizowana: ${updated}`);
            if (reviewed) parts.push(`przegląd: ${reviewed}`);
            if (!parts.length) parts.push("Brak daty aktualizacji karty");

            const flagged = getProcedureDocumentReferences(doc)
                .some(({ document }) => document && getDocumentFreshness(document).level === "warn");

            return `
                <div class="card-freshness${flagged ? " is-warn" : ""}">
                    ${escapeHtml(parts.join(" · "))}${flagged ? " · <strong>źródło do weryfikacji — sprawdź dokument poniżej</strong>" : ""}
                </div>
            `;
        }

        function renderProcedureDocuments(doc) {
            const resolved = getProcedureDocumentReferences(doc);

            if (!resolved.length) {
                const fallbackTitle =
                    doc?.pelna_procedura?.tytul ||
                    doc?.zrodlo ||
                    "Pełna procedura";

                return `
                    <div class="full-document-box">
                        <span class="full-document-disabled">
                            ${doc?.zrodlo_dostepnosc === "niedostepne_publicznie"
                                ? "Źródło niedostępne publicznie — brak pliku w aplikacji"
                                : "Pełna procedura — plik niepodłączony"}
                        </span>
                        <span class="full-document-source">
                            ${escapeHtml(fallbackTitle)}
                        </span>
                    </div>
                `;
            }

            const items = resolved.map(({ ref, document }) => {
                if (!document) {
                    return `
                        <div class="full-document-item">
                            <span class="full-document-disabled">
                                Dokument niedostępny w rejestrze
                            </span>
                            <span class="full-document-source">
                                ${escapeHtml(ref.dokument_id || "Brak identyfikatora")}
                            </span>
                        </div>
                    `;
                }

                const url = buildFullDocumentUrl({
                    plik: document.plik,
                    typ: document.typ,
                    strona: ref.strona
                });
                const isActive = document.status_techniczny === "aktywny";
                const section = String(ref.sekcja || "").trim();
                const metadata = [
                    document.rodzaj,
                    document.wersja,
                    document.data_wydania,
                    section
                ].filter(Boolean).join(" | ");
                const page = Number(ref.strona);
                const isWebSource =
                    String(document.typ || "").toLowerCase() === "url";
                const buttonLabel = isWebSource
                    ? "Otwórz oficjalne źródło"
                    : (Number.isInteger(page) && page > 0
                        ? `Otwórz dokument — strona ${page}`
                        : "Otwórz dokument");

                const action = url && isActive
                    ? `
                        <a
                            class="full-document-link"
                            href="${escapeHtml(url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHtml(buttonLabel)}
                        </a>
                    `
                    : `
                        <span class="full-document-disabled">
                            Dokument obecnie nieaktywny
                        </span>
                    `;

                return `
                    <div class="full-document-item">
                        ${action}
                        <span class="full-document-source">
                            ${escapeHtml(document.tytul)}
                            ${renderFreshnessLabel(document)}
                        </span>
                        ${metadata
                            ? `<span class="full-document-meta">${escapeHtml(metadata)}</span>`
                            : ""
                        }
                    </div>
                `;
            }).join("");

            return `
                <div class="full-document-box">
                    <div class="full-document-heading">Dokumenty źródłowe</div>
                    ${items}
                </div>
            `;
        }

        // ===== Grupy (kategorie) procedur =====
        // Grupa wynika z ID karty. Pole "grupa" w karcie (baza.json)
        // ma pierwszenstwo, wiec przypisanie mozna zmienic bez zmiany kodu.
        // Kazda karta musi pasowac do DOKLADNIE jednej grupy — sprawdza to
        // scripts/weryfikacja-kart.mjs przy kazdej budowie bazy.
        const PROCEDURE_GROUPS = [
            { key: "kpp", label: "KPP i zdarzenia masowe", test: id => id.startsWith("KARTA-KPP-") || id.startsWith("WYP-MAS-") },
            { key: "bio", label: "Biologia i środowisko", test: id => /^KARTA-(PTASIA-GRYPA-|ZA-|CHEM-B1-)/.test(id) },
            { key: "cbrn", label: "Chemia i CBRN-E", test: id => /^KARTA-(CHEM-(?!B1-)|ACETYLEN-|LOT-BSP-)/.test(id) || /^KARTA-ORG-(AMONIAK|CHLOROWODOR|CO|H2S|HCN)-/.test(id) || /CBRNE/.test(id) },
            { key: "rt", label: "Ratownictwo techniczne", test: id => id.startsWith("KARTA-RT-") },
            { key: "wod", label: "Ratownictwo wodne i lodowe", test: id => id.startsWith("KARTA-WOD-") },
            { key: "wys", label: "Ratownictwo wysokościowe", test: id => id.startsWith("KARTA-WYS-") },
            { key: "ev", label: "Pojazdy elektryczne", test: id => /^(DEZ|POZ|WYP|ZAT)-EV-/.test(id) },
            { key: "pv", label: "Fotowoltaika", test: id => id.startsWith("KARTA-PV-") },
            { key: "el", label: "Elektroenergetyka (PSE)", test: id => id.startsWith("KARTA-EL-") },
            { key: "bud", label: "Katastrofa budowlana i poszukiwania", test: id => id.startsWith("KARTA-BUD-") },
            { key: "org", label: "Organizacja i łączność", test: id => /^KARTA-ORG-(ZASADY|METODYKA)/.test(id) },
            { key: "sprzet", label: "Sprzęt pomiarowy", test: id => /^KARTA-(ORG-DETEKTOR|SPRZET)-/.test(id) },
            { key: "olioc", label: "Edukacja OLiOC — dla obywateli", test: id => id.startsWith("KARTA-OLIOC-") }
        ];
        const OTHER_GROUP = { key: "inne", label: "Inne" };

        function getProcedureGroup(procedure) {
            const explicit = String(procedure?.grupa || "").trim();
            if (explicit) {
                const found = PROCEDURE_GROUPS.find(group => group.key === explicit);
                if (found) return found;
            }
            const id = String(procedure?.id || "");
            return PROCEDURE_GROUPS.find(group => group.test(id)) || OTHER_GROUP;
        }

        function getGroupProcedures(groupKey) {
            return state.procedury.filter(
                procedure => getProcedureGroup(procedure).key === groupKey
            );
        }

        // ===== Ulubione i ostatnio otwierane =====
        const FAVORITES_KEY = "kdr_ai_favorites_v1";
        const RECENT_KEY = "kdr_ai_recent_v1";
        const RECENT_MAX = 6;

        function readIdList(key) {
            try {
                const parsed = JSON.parse(safeStorageGet(key) || "[]");
                return Array.isArray(parsed) ? parsed.map(String) : [];
            } catch (error) {
                return [];
            }
        }

        function writeIdList(key, ids) {
            safeStorageSet(key, JSON.stringify(ids));
        }

        function isFavorite(id) {
            return readIdList(FAVORITES_KEY).includes(id);
        }

        function toggleFavorite(id) {
            const list = readIdList(FAVORITES_KEY);
            const next = list.includes(id)
                ? list.filter(item => item !== id)
                : [...list, id];
            writeIdList(FAVORITES_KEY, next);
            return next.includes(id);
        }

        function rememberRecent(id) {
            const list = readIdList(RECENT_KEY).filter(item => item !== id);
            writeIdList(RECENT_KEY, [id, ...list].slice(0, RECENT_MAX));
        }

        function idsToProcedures(ids) {
            return ids
                .map(id => state.procedury.find(item => item.id === id))
                .filter(Boolean);
        }

        // ===== Ekran startowy =====
        function renderChipRow(title, procedures) {
            if (!procedures.length) return "";
            const chips = procedures.map(procedure => `
                <button class="chip" type="button" data-open-id="${escapeHtml(procedure.id)}">
                    ${escapeHtml(shortTitle(procedure))}
                </button>
            `).join("");
            return `
                <section class="home-section">
                    <h2 class="home-title">${escapeHtml(title)}</h2>
                    <div class="chip-row">${chips}</div>
                </section>
            `;
        }

        function shortTitle(procedure) {
            const text = String(procedure.prefix || procedure.slowo_kluczowe || procedure.id);
            return text.length > 70 ? `${text.slice(0, 67)}…` : text;
        }

        function renderHome() {
            stopReading();
            state.view = "home";
            state.listViewShown = false;
            state.openedFromList = false;
            state.returnTarget = "";
            setResultMode(false);

            if (!state.procedury.length) {
                procedureOutput.innerHTML =
                    '<div class="empty-state">Ładowanie procedur…</div>';
                return;
            }

            const favorites = idsToProcedures(readIdList(FAVORITES_KEY));
            const recent = idsToProcedures(readIdList(RECENT_KEY))
                .filter(procedure => !favorites.some(fav => fav.id === procedure.id));

            const tiles = [...PROCEDURE_GROUPS, OTHER_GROUP]
                .map(group => ({ group, count: getGroupProcedures(group.key).length }))
                .filter(item => item.count > 0)
                .map(({ group, count }) => `
                    <button class="tile${group.key === "olioc" ? " tile-edu" : ""}" type="button" data-group="${escapeHtml(group.key)}">
                        <span class="tile-label">${escapeHtml(group.label)}</span>
                        <span class="tile-count">${count}</span>
                    </button>
                `).join("");

            procedureOutput.innerHTML = `
                <div class="home">
                    ${renderChipRow("Ulubione", favorites)}
                    ${renderChipRow("Ostatnio otwierane", recent)}
                    <section class="home-section">
                        <h2 class="home-title">Kategorie</h2>
                        <div class="tile-grid">${tiles}</div>
                    </section>
                </div>
            `;
            procedureScrollArea.scrollTop = 0;
        }

        function showGroup(groupKey) {
            const group =
                PROCEDURE_GROUPS.find(item => item.key === groupKey) || OTHER_GROUP;
            const procedures = getGroupProcedures(group.key);
            renderProcedureChoices(
                procedures,
                group.label,
                "Kategoria",
                "",
                { heading: group.label, hideGroup: true }
            );
        }

        // ===== Czytanie na glos (wbudowane w przegladarke, offline) =====
        function canReadAloud() {
            return typeof window.speechSynthesis !== "undefined" &&
                typeof window.SpeechSynthesisUtterance !== "undefined";
        }

        function stopReading() {
            if (!canReadAloud()) return;
            try { window.speechSynthesis.cancel(); } catch (error) {}
            state.isReading = false;
        }

        function readProcedureAloud(procedure, button) {
            if (!canReadAloud()) return;

            if (state.isReading) {
                stopReading();
                if (button) button.textContent = "Czytaj na głos";
                return;
            }

            if (isTemplateV2(procedure)) {
                const parts = [
                    procedure.prefix || "",
                    ...(procedure.najpierw || []).map(pointText),
                    ...(procedure.parametry || []).map(item => `${item.nazwa}: ${item.wartosc}`),
                    ...procedure.sekcje.flatMap(section => [section.etykieta, ...(section.punkty || []).map(pointText)]),
                    ...(procedure.wsparcie || []).map(pointText),
                    ...(procedure.nie_rob || []).map(point => `Nie rób: ${pointText(point)}`)
                ];
                procedure = { ...procedure, content: parts.filter(Boolean).join("\n") };
            }

            const text = [
                procedure.prefix || "",
                ...String(procedure.content || "")
                    .split("\n")
                    .map(line => line.replace(/^\d+\.\s*/, ""))
            ].filter(Boolean).join(". ");

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "pl-PL";
            utterance.rate = 1;
            utterance.onend = () => {
                state.isReading = false;
                if (button) button.textContent = "Czytaj na głos";
            };
            utterance.onerror = utterance.onend;

            state.isReading = true;
            if (button) button.textContent = "Zatrzymaj czytanie";
            window.speechSynthesis.speak(utterance);
        }

        // ===== Karta procedury =====
        // Wyroznienie krokow kluczowych w akcji. Nic nie jest zwijane,
        // aby zadna czesc procedury nie zostala przeoczona.
        function getLineEmphasis(rawLine) {
            const label = normalizeText(
                (rawLine.match(/^\d+\.\s*([^:]{3,60}):/u) || [])[1] || ""
            );
            if (!label) return "";
            if (/(dzialania krytyczne|zasada bezwzgledna)/.test(label)) return " line-critical";
            if (/co moze pojsc nie tak/.test(label)) return " line-warning";
            return "";
        }

        // ===== Wzorzec karty v2 =====
        // Karta v2 ma treść w polach strukturalnych: "najpierw" (pierwsze
        // czynności), "parametry" (liczby do szybkiego odczytu), "sekcje"
        // (krótkie punkty z numerem strony źródła), "nie_rob" i "wsparcie".
        // Pole "content" pozostaje — generowane z sekcji — dla wyszukiwarki,
        // AI i starszych wersji aplikacji.
        function isTemplateV2(doc) {
            return Number(doc?.wzorzec) === 2 && Array.isArray(doc?.sekcje);
        }

        function pageRef(point) {
            const page = Number(point?.str);
            const doc = String(point?.zr || "").trim();
            return Number.isInteger(page) && page > 0
                ? ` <span class="v2-page" title="Strona dokumentu źródłowego">${doc ? escapeHtml(doc) + " " : ""}s. ${page}</span>`
                : "";
        }

        function pointText(point) {
            return typeof point === "string" ? point : String(point?.t || "");
        }

        function renderV2List(points) {
            return `<ul class="v2-list">${(points || []).map(point =>
                `<li>${escapeHtml(pointText(point))}${pageRef(point)}</li>`
            ).join("")}</ul>`;
        }

        function renderTemplateV2(doc) {
            const blocks = [];

            if (Array.isArray(doc.najpierw) && doc.najpierw.length) {
                blocks.push(`
                    <section class="v2-box v2-first">
                        <h3 class="v2-title">Najpierw</h3>
                        ${renderV2List(doc.najpierw)}
                    </section>
                `);
            }

            if (Array.isArray(doc.parametry) && doc.parametry.length) {
                blocks.push(`
                    <section class="v2-params">
                        ${doc.parametry.map(item => `
                            <div class="v2-param${String(item.wartosc || "").length > 40 ? " v2-param-wide" : ""}">
                                <span class="v2-param-name">${escapeHtml(item.nazwa || "")}</span>
                                <span class="v2-param-value">${escapeHtml(item.wartosc || "")}${pageRef(item)}</span>
                            </div>
                        `).join("")}
                    </section>
                `);
            }

            doc.sekcje.forEach(section => {
                blocks.push(`
                    <section class="v2-section">
                        <h3 class="v2-title">${escapeHtml(section.etykieta || "")}</h3>
                        ${renderV2List(section.punkty)}
                    </section>
                `);
            });

            if (Array.isArray(doc.wsparcie) && doc.wsparcie.length) {
                blocks.push(`
                    <section class="v2-box v2-support">
                        <h3 class="v2-title">Wezwij wsparcie, gdy</h3>
                        ${renderV2List(doc.wsparcie)}
                    </section>
                `);
            }

            if (Array.isArray(doc.nie_rob) && doc.nie_rob.length) {
                blocks.push(`
                    <section class="v2-box v2-dont">
                        <h3 class="v2-title">Nie rób</h3>
                        ${renderV2List(doc.nie_rob)}
                    </section>
                `);
            }

            return blocks.join("");
        }

        function renderProcedure(doc, sourceLabel, options = {}) {
            stopReading();
            state.view = "procedure";
            state.currentProcedureId = doc.id;
            rememberRecent(doc.id);

            const lines = isTemplateV2(doc) ? renderTemplateV2(doc) : String(doc.content || "")
                .split("\n")
                .filter(Boolean)
                .map(rawLine => {
                    const emphasis = getLineEmphasis(rawLine);
                    const html = escapeHtml(rawLine)
                        .replace(/^(\d+\.)\s*/u, '<span class="step-no">$1</span> ');
                    return `<span class="procedure-line${emphasis}">${html}</span>`;
                })
                .join("");

            const fullDocumentBlock = renderProcedureDocuments(doc);
            const group = getProcedureGroup(doc);
            const favorite = isFavorite(doc.id);
            const readButton = canReadAloud()
                ? '<button class="card-action" type="button" data-action="read">Czytaj na głos</button>'
                : "";

            procedureOutput.innerHTML = `
                <div class="card-head">
                    <span class="source-badge">${escapeHtml(sourceLabel)}</span>
                    <span class="group-badge${group.key === "olioc" ? " group-edu" : ""}">${escapeHtml(group.label)}</span>
                </div>
                <div class="procedure-prefix">${escapeHtml(doc.prefix)}</div>
                ${renderCardFreshness(doc)}
                <div class="card-actions">
                    <button class="card-action${favorite ? " is-on" : ""}" type="button" data-action="favorite" aria-pressed="${favorite}">
                        ${favorite ? "★ W ulubionych" : "☆ Dodaj do ulubionych"}
                    </button>
                    ${readButton}
                </div>
                <div class="procedure-card">
                    ${lines}
                    ${fullDocumentBlock}
                </div>
            `;

            state.openedFromList = Boolean(options.fromList);
            state.returnTarget = String(options.returnTarget || "");
            state.listViewShown = false;

            if (state.returnTarget === "search-results") {
                resetBtn.textContent = "Powrót do wyników";
            } else if (state.returnTarget === "procedure-list") {
                resetBtn.textContent = "Powrót do listy";
            } else {
                resetBtn.textContent = "Powrót";
            }

            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        function renderProcedureChoices(
            procedures,
            query,
            sourceLabel,
            interpretation = "",
            options = {}
        ) {
            const safeProcedures = Array.isArray(procedures)
                ? procedures.filter(validateProcedure)
                : [];

            if (!safeProcedures.length) {
                renderEmptyState("Brak danych");
                return;
            }

            stopReading();
            state.view = "results";
            state.lastSearchResults = safeProcedures.map(item => item.id);
            state.lastSearchQuery = query || "";
            state.lastSearchSource = sourceLabel || "Wyniki wyszukiwania";
            state.lastSearchInterpretation = interpretation || "";
            state.lastSearchOptions = options;

            const rows = safeProcedures.map((procedure, index) => {
                const group = getProcedureGroup(procedure);
                const tags = (procedure.tagi_wspolne || [])
                    .slice(0, 4)
                    .join(", ");
                const meta = options.hideGroup
                    ? tags
                    : [group.label, tags].filter(Boolean).join(" · ");

                return `
                    <button
                        class="search-result-btn${group.key === "olioc" ? " result-edu" : ""}"
                        type="button"
                        data-search-id="${escapeHtml(procedure.id)}"
                    >
                        <span class="search-result-title">
                            ${index + 1}. ${escapeHtml(procedure.prefix || procedure.id)}
                        </span>
                        <span class="search-result-meta">
                            ${escapeHtml(meta || procedure.kategoria || "")}
                        </span>
                    </button>
                `;
            }).join("");

            const interpretationBlock = interpretation
                ? `<div class="procedure-prefix">${escapeHtml(interpretation)}</div>`
                : "";

            const heading = options.heading
                ? escapeHtml(options.heading)
                : `Zapytanie: ${escapeHtml(query)}`;

            procedureOutput.innerHTML = `
                <div class="source-badge">
                    ${escapeHtml(sourceLabel)} — ${formatResultCount(safeProcedures.length)}
                </div>
                <div class="procedure-prefix">
                    ${heading}
                </div>
                ${interpretationBlock}
                <div class="procedure-card search-results-card">
                    ${rows}
                </div>
            `;

            state.listViewShown = true;
            state.openedFromList = false;
            state.returnTarget = "";
            resetBtn.textContent = "Powrót";
            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        function formatResultCount(count) {
            if (count === 1) return "1 wynik";
            const lastDigit = count % 10;
            const lastTwo = count % 100;
            if (lastDigit >= 2 && lastDigit <= 4 && (lastTwo < 12 || lastTwo > 14)) {
                return `${count} wyniki`;
            }
            return `${count} wyników`;
        }

        function openProcedureFromList(procedureId) {
            const procedure = state.procedury.find(item => item.id === procedureId);
            if (!procedure) {
                renderEmptyState("Brak danych");
                return;
            }
            renderProcedure(
                procedure,
                "Lista procedur",
                {
                    fromList: true,
                    returnTarget: "procedure-list"
                }
            );
        }

        function containsNormalizedPhrase(text, phrase) {
            const normalizedText = normalizeText(text);
            const normalizedPhrase = normalizeText(phrase);
            if (!normalizedPhrase) return false;
            return ` ${normalizedText} `.includes(` ${normalizedPhrase} `);
        }

        function getDirectTerms(procedure) {
            return [
                procedure.id,
                procedure.slowo_kluczowe || "",
                ...(procedure.aliasy || procedure.keywords || [])
            ]
                .map(normalizeText)
                .filter(Boolean);
        }

        function getSharedTags(procedure) {
            return (procedure.tagi_wspolne || [])
                .map(normalizeText)
                .filter(Boolean);
        }

        function simplifyCategoryQuery(value) {
            const ignored = new Set([
                "procedura",
                "procedury",
                "pokaz",
                "pokaz mi",
                "znajdz",
                "wyszukaj",
                "szukaj",
                "dotyczace",
                "dotyczaca",
                "dotyczacy",
                "zagadnienie",
                "zagadnienia",
                "temat",
                "tematy"
            ]);

            const tokens = normalizeText(value)
                .split(" ")
                .filter(Boolean);

            const filtered = tokens.filter(token => !ignored.has(token));
            return filtered.join(" ");
        }

        function findLocalCategoryMatches(query) {
            const normalizedQuery = normalizeText(query);
            const simplifiedQuery = simplifyCategoryQuery(query);

            let rule = LOCAL_CATEGORY_RULES.find(item =>
                item.queries.some(candidate => {
                    const normalizedCandidate = normalizeText(candidate);
                    return (
                        normalizedQuery === normalizedCandidate ||
                        simplifiedQuery === normalizedCandidate
                    );
                })
            );

            if (!rule) {
                const stems = new Set(
                    normalizedQuery
                        .split(" ")
                        .filter(Boolean)
                        .map(normalizeSearchStem)
                );

                let anchor = "";

                if (stems.has("skazen") && stems.has("chem")) {
                    anchor = "chemia";
                } else if (
                    stems.has("skazen") &&
                    stems.has("biolog")
                ) {
                    anchor = "biologia";
                } else if (
                    stems.has("skazen") &&
                    (
                        stems.has("radiac") ||
                        stems.has("radiolog") ||
                        stems.has("promieniow") ||
                        stems.has("promieniotw")
                    )
                ) {
                    anchor = "radiacja";
                }

                if (anchor) {
                    rule = LOCAL_CATEGORY_RULES.find(item =>
                        item.queries.some(candidate =>
                            normalizeText(candidate) === anchor
                        )
                    );
                }
            }

            if (!rule) return [];

            return rule.ids
                .map(id => state.procedury.find(item => item.id === id))
                .filter(Boolean);
        }

        function normalizeSearchStem(token) {
            const value = normalizeText(token);
            if (!value) return "";

            const families = [
                [/^chemi/, "chem"],
                [/^biolog/, "biolog"],
                [/^radiac/, "radiac"],
                [/^radiolog/, "radiolog"],
                [/^promieniow/, "promieniow"],
                [/^promieniotw/, "promieniotw"],
                [/^ewakuac/, "ewakuac"],
                [/^pozar/, "pozar"],
                [/^medycz/, "medycz"],
                [/^oparzen/, "oparzen"],
                [/^zatruc/, "zatruc"],
                [/^wybuch/, "wybuch"],
                [/^skazen/, "skazen"],
                [/^dekontamin/, "dekontamin"],
                [/^alarm/, "alarm"],
                [/^schron/, "schron"]
            ];

            for (const [pattern, stem] of families) {
                if (pattern.test(value)) return stem;
            }

            return value;
        }

        function getComparableTokens(value, stopWords) {
            return new Set(
                normalizeText(value)
                    .split(" ")
                    .filter(token =>
                        token.length > 2 &&
                        !stopWords.has(token)
                    )
                    .map(normalizeSearchStem)
                    .filter(Boolean)
            );
        }

        function scoreLocalProcedure(query, procedure) {
            const normalizedQuery = normalizeText(query);
            const primary = normalizeText(procedure.slowo_kluczowe || "");
            const aliases = (procedure.aliasy || procedure.keywords || [])
                .map(normalizeText)
                .filter(Boolean);
            const tags = getSharedTags(procedure);
            const prefix = normalizeText(procedure.prefix || "");

            const stopWords = new Set([
                "oraz", "lub", "przy", "dla", "bez", "pod", "nad",
                "jak", "czy", "sie", "jest", "jaka", "jakie", "prosze",
                "pokaz", "znajdz", "wyszukaj", "szukaj", "procedura",
                "procedury", "temat", "zagadnienie"
            ]);

            let score = 0;

            if (primary && containsNormalizedPhrase(normalizedQuery, primary)) {
                score += 280;
            }

            aliases.forEach(alias => {
                if (containsNormalizedPhrase(normalizedQuery, alias)) {
                    score += 220;
                }
            });

            tags.forEach(tag => {
                if (containsNormalizedPhrase(normalizedQuery, tag)) {
                    score += 95;
                }
            });

            if (
                normalizedQuery.length >= 5 &&
                containsNormalizedPhrase(prefix, normalizedQuery)
            ) {
                score += 100;
            }

            const queryTokens = getComparableTokens(
                normalizedQuery,
                stopWords
            );

            const procedureTokens = getComparableTokens(
                [primary, prefix, ...aliases, ...tags].join(" "),
                stopWords
            );

            let matchedTokens = 0;

            queryTokens.forEach(token => {
                if (!procedureTokens.has(token)) return;
                matchedTokens += 1;
                score += token.length >= 6 ? 24 : 16;
            });

            if (
                queryTokens.size > 0 &&
                matchedTokens === queryTokens.size
            ) {
                score += 45;
            }

            return score;
        }

        function findLocalMatches(query) {
            const normalizedQuery = normalizeText(query);

            if (!normalizedQuery) {
                return {
                    kind: "none",
                    procedures: [],
                    source: "Brak"
                };
            }

            const categoryMatches = findLocalCategoryMatches(query);

            if (categoryMatches.length) {
                return {
                    kind: "category",
                    procedures: categoryMatches,
                    source: "Kategoria lokalna"
                };
            }

            const exactTagMatches = state.procedury.filter(procedure =>
                getSharedTags(procedure).includes(normalizedQuery)
            );

            if (exactTagMatches.length) {
                return {
                    kind: "tag",
                    procedures: exactTagMatches,
                    source: "Hasło wspólne"
                };
            }

            const exactDirectMatches = state.procedury.filter(procedure =>
                getDirectTerms(procedure).includes(normalizedQuery)
            );

            if (exactDirectMatches.length) {
                return {
                    kind: "direct",
                    procedures: exactDirectMatches,
                    source: "Hasło bezpośrednie"
                };
            }

            const ranked = state.procedury
                .map(procedure => ({
                    procedure,
                    score: scoreLocalProcedure(query, procedure)
                }))
                .filter(result => result.score >= 40)
                .sort((a, b) => b.score - a.score);

            if (!ranked.length) {
                return {
                    kind: "none",
                    procedures: [],
                    source: "Brak"
                };
            }

            const topScore = ranked[0].score;
            const secondScore = ranked[1]?.score || 0;

            // Wyrazny zwyciezca lokalny: wynik wysoki i co najmniej 2x lepszy
            // od drugiego. Wtedy AI nie jest potrzebne (oszczednosc tokenow).
            if (
                topScore >= LOCAL_CONFIDENT_MIN_SCORE &&
                topScore >= secondScore * LOCAL_CONFIDENT_MIN_RATIO
            ) {
                return {
                    kind: "confident",
                    procedures: [ranked[0].procedure],
                    source: "Lokalna baza"
                };
            }

            const selected = ranked
                .filter(result =>
                    result.score >= Math.max(40, topScore * 0.55)
                )
                .slice(0, 8)
                .map(result => result.procedure);

            return {
                kind: selected.length === 1 ? "single" : "multiple",
                procedures: selected,
                source: "Lokalna baza"
            };
        }

        const AI_QUERY_HINTS = [
            {
                pattern: /\b(tesla|nissan leaf|renault zoe|bmw i[0-9]|pojazd elektrycz|samochod elektrycz|auto elektrycz|bateria trakcyj|akumulator trakcyj|ev)\b/i,
                terms: [
