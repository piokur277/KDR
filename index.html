może gwałtownie polimeryzować (ciepło, zasady, powyżej 2% wody) — ryzyko pożaru i wybuchu.\n5. POSZKODOWANY: Objawy: dezorientacja, senność, ból głowy, nudności, duszność, drgawki, utrata przytomności, zatrzymanie oddechu i krążenia. Skóra: zdejmij skażoną odzież, spłucz dużą ilością wody lub prysznic. Oczy: płucz dużą ilością wody przez kilka minut, potem pomoc medyczna. Połknięcie: wypłucz usta, nie wywołuj wymiotów. Wymagane leczenie swoiste — zabezpiecz odtrutki z instrukcją; poszkodowany wymaga obserwacji medycznej. Skażoną odzież zapakuj i szczelnie zamknij w workach.\n6. NIE RÓB: Nie kieruj strumienia wody na ciekły HCN. Nie polegaj na zapachu — przy przekroczeniu normatywów nie jest wystarczającym ostrzeżeniem. Nie pracuj w strefie w pojedynkę."},{"id":"KARTA-EL-PSE-LINIE-STACJE-NN","wzorzec":2,"kategoria":"dzialania","grupa":"el","zrodlo":"Polskie Sieci Elektroenergetyczne S.A.: „Bezpieczeństwo prowadzenia działań ratowniczo-gaśniczych na stacjach i w pobliżu linii elektroenergetycznych najwyższych napięć”, 31.08.2026.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"linia najwyższego napięcia stacja PSE","keywords":["pse","linia nn","linia najwyższego napięcia","linia najwyzszych napiec","linia wysokiego napięcia","220 kv","400 kv","stacja elektroenergetyczna","stacja pse","pożar stacji elektroenergetycznej","pożar transformatora","transformator 400 kv","transformator 220 kv","przewód na ziemi","zerwany przewód energetyczny","opadnięty przewód","słup energetyczny","słup pse","napięcie krokowe","napięcie dotykowe","łuk elektryczny","porażenie prądem","sf6","sześciofluorek siarki","olej transformatorowy","centrum nadzoru pse","rcn pse","cn pse","gaszenie pod linią","pożar pod linią 400 kv","wypadek pod linią 400 kv"],"aliasy":["pse","linia nn","linia najwyższego napięcia","linia najwyzszych napiec","linia wysokiego napięcia","linia 220 kv","linia 400 kv","stacja pse","stacja elektroenergetyczna","pożar stacji elektroenergetycznej","pożar transformatora","transformator 400 kv","przewód na ziemi","zerwany przewód energetyczny","zerwany kabel energetyczny","opadnięty przewód","powalony słup energetyczny","słup pse","napięcie krokowe","napięcie dotykowe","łuk elektryczny","porażenie prądem","sf6","sześciofluorek siarki","olej transformatorowy","centrum nadzoru pse","rcn pse","cn pse","gaszenie pod linią","pożar pod linią 400 kv","wypadek pod linią wysokiego napięcia"],"prefix":"Linie i stacje elektroenergetyczne najwyższych napięć (PSE) — strefa 30 m, kontakt z CN/RCN, napięcie krokowe, działania na stacji (PSE 2026).","najpierw":[{"t":"Do przyjazdu służb PSE traktuj linię jako czynną i pod napięciem.","zr":"PSE 2026","str":20},{"t":"Bez uzgodnienia z RCN nie zbliżaj się — ludźmi, sprzętem ani strumieniem — na mniej niż 30 m do przewodu linii NN, także leżącego na ziemi.","zr":"PSE 2026","str":22},{"t":"Odczytaj numer słupa i relację linii z tablicy 2–3 m nad ziemią.","zr":"PSE 2026","str":9},{"t":"Przekaż CN lub właściwemu RCN informacje o działaniach i numer słupa; CN/RCN poda warunki bezpieczeństwa.","zr":"PSE 2026","str":20}],"parametry":[{"nazwa":"Brak zagrożeń od linii NN","wartosc":"> 30 m w poziomie od rzutu pionowego skrajnego przewodu i bez ryzyka naruszenia tej odległości","zr":"PSE 2026","str":12},{"nazwa":"Automatyka SPZ","wartosc":"po wyłączeniu zwarciowym napięcie wraca po kilku sekundach","zr":"PSE 2026","str":14},{"nazwa":"Olej w autotransformatorze","wartosc":"55–110 t","zr":"PSE 2026","str":17},{"nazwa":"Wysokości na stacji","wartosc":"autotransformator 11 m · aparatura 3–10 m · szyny zbiorcze 8–15 m","zr":"PSE 2026","str":19},{"nazwa":"Telefony CN/RCN","wartosc":"w dokumencie PSE, s. 30","zr":"PSE 2026","str":30}],"sekcje":[{"etykieta":"Linia NN","punkty":[{"t":"Pożar obniża wytrzymałość dielektryczną powietrza; przewody mogą się obniżyć lub opaść, słupy odkształcić.","zr":"PSE 2026","str":11},{"t":"W czasie pożaru nie przejeżdżaj pod przewodami do czasu informacji z RCN.","zr":"PSE 2026","str":22},{"t":"Pozbawienie napięcia: obustronne wyłączenie i odłączenie w stacjach końcowych + uziemienie; przy ryzyku zbliżenia (także strumieniem) — uziemienie w miejscu działań.","zr":"PSE 2026","str":21},{"t":"Bez widocznego uziemienia nie dotykaj przewodów bezpośrednio ani pośrednio; uziemienia wykonuje PSE.","zr":"PSE 2026","str":22},{"t":"Bez zgłoszenia do RCN pod czynną linią tylko działania niegaśnicze (np. wypadek drogowy): sprzęt ręczny, linia nieuszkodzona, bez drabiny, dźwigu, HDS, nic powyżej 4 m.","zr":"PSE 2026","str":23}]},{"etykieta":"Stacja elektroenergetyczna","punkty":[{"t":"Na bramie tablica informacyjna: napięcia, nazwa, adres, telefon, eksploatujący.","zr":"PSE 2026","str":8},{"t":"Wjazd PSP pod nadzorem obsługi, po przygotowaniu strefy: urządzenia wyłączone, odłączone (widoczna przerwa) i uziemione; potem obsługa przekazuje rejon dowódcy PSP.","zr":"PSE 2026","str":18},{"t":"Zagrożenia: eksplozje aparatury, odłamki izolatorów porcelanowych, wyciek i wykipienie gorącego oleju.","zr":"PSE 2026","str":15},{"t":"SF6 po łuku elektrycznym: trujące, kwasowe produkty rozpadu; wypiera tlen — ryzyko uduszenia.","zr":"PSE 2026","str":16}]},{"etykieta":"Porażenie","punkty":[{"t":"Przy urządzeniach NN porażenie następuje bez dotknięcia — przeskok łuku przy zbliżeniu.","zr":"PSE 2026","str":11},{"t":"Napięcie krokowe: złącz stopy, bardzo drobne kroki szurając, nie odrywaj stóp, przykucnij ze złączonymi stopami, nie podpieraj się rękami.","zr":"PSE 2026","str":13},{"t":"Napięcie dotykowe i krokowe pojawia się przy zwarciu, także przy wyładowaniu atmosferycznym.","zr":"PSE 2026","str":14}]}],"nie_rob":[{"t":"Bez uzgodnienia z RCN nie przecinaj przewodów leżących na ziemi i nie wchodź na słup.","zr":"PSE 2026","str":22},{"t":"Nie kieruj strumienia środka gaśniczego w strefę 30 m od przewodu bez uzgodnienia z RCN.","zr":"PSE 2026","str":22}],"tagi_wspolne":["elektryka","PSE","linia NN","stacja elektroenergetyczna","porażenie prądem","napięcie krokowe","łuk elektryczny","transformator","SF6"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pse-bezpieczenstwo-dzialan-nn-2026","strona":20,"sekcja":"Oznakowanie (s. 8–9), zagrożenia (s. 10–17), organizacja strefy działań i warunki bezpieczeństwa (s. 18–23), kontakty CN/RCN (s. 28–30)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Do przyjazdu służb PSE traktuj linię jako czynną i pod napięciem. Bez uzgodnienia z RCN nie zbliżaj się — ludźmi, sprzętem ani strumieniem — na mniej niż 30 m do przewodu linii NN, także leżącego na ziemi. Odczytaj numer słupa i relację linii z tablicy 2–3 m nad ziemią. Przekaż CN lub właściwemu RCN informacje o działaniach i numer słupa; CN/RCN poda warunki bezpieczeństwa.\n2. PARAMETRY: Brak zagrożeń od linii NN — > 30 m w poziomie od rzutu pionowego skrajnego przewodu i bez ryzyka naruszenia tej odległości; Automatyka SPZ — po wyłączeniu zwarciowym napięcie wraca po kilku sekundach; Olej w autotransformatorze — 55–110 t; Wysokości na stacji — autotransformator 11 m · aparatura 3–10 m · szyny zbiorcze 8–15 m; Telefony CN/RCN — w dokumencie PSE, s. 30\n3. LINIA NN: Pożar obniża wytrzymałość dielektryczną powietrza; przewody mogą się obniżyć lub opaść, słupy odkształcić. W czasie pożaru nie przejeżdżaj pod przewodami do czasu informacji z RCN. Pozbawienie napięcia: obustronne wyłączenie i odłączenie w stacjach końcowych + uziemienie; przy ryzyku zbliżenia (także strumieniem) — uziemienie w miejscu działań. Bez widocznego uziemienia nie dotykaj przewodów bezpośrednio ani pośrednio; uziemienia wykonuje PSE. Bez zgłoszenia do RCN pod czynną linią tylko działania niegaśnicze (np. wypadek drogowy): sprzęt ręczny, linia nieuszkodzona, bez drabiny, dźwigu, HDS, nic powyżej 4 m.\n4. STACJA ELEKTROENERGETYCZNA: Na bramie tablica informacyjna: napięcia, nazwa, adres, telefon, eksploatujący. Wjazd PSP pod nadzorem obsługi, po przygotowaniu strefy: urządzenia wyłączone, odłączone (widoczna przerwa) i uziemione; potem obsługa przekazuje rejon dowódcy PSP. Zagrożenia: eksplozje aparatury, odłamki izolatorów porcelanowych, wyciek i wykipienie gorącego oleju. SF6 po łuku elektrycznym: trujące, kwasowe produkty rozpadu; wypiera tlen — ryzyko uduszenia.\n5. PORAŻENIE: Przy urządzeniach NN porażenie następuje bez dotknięcia — przeskok łuku przy zbliżeniu. Napięcie krokowe: złącz stopy, bardzo drobne kroki szurając, nie odrywaj stóp, przykucnij ze złączonymi stopami, nie podpieraj się rękami. Napięcie dotykowe i krokowe pojawia się przy zwarciu, także przy wyładowaniu atmosferycznym.\n6. NIE RÓB: Bez uzgodnienia z RCN nie przecinaj przewodów leżących na ziemi i nie wchodź na słup. Nie kieruj strumienia środka gaśniczego w strefę 30 m od przewodu bez uzgodnienia z RCN."},{"id":"KARTA-ORG-METODYKA-ORGANIZACJI-LACZNOSCI-KDR","wzorzec":2,"kategoria":"organizacja","zrodlo":"KG PSP: Metodyka postępowania podczas organizacji łączności na potrzeby KDR (13.04.2016, niepublikowana; opis: „Przegląd Pożarniczy” 4/2014); Rozkaz nr 8 KG PSP z 05.04.2019 – Instrukcja w sprawie organizacji łączności radiowej","data_aktualizacji":"2026-10-25","slowo_kluczowe":"organizacja lacznosci kdr","keywords":["lacznosc na potrzeby kdr","metodyka lacznosci kdr","psk msk lacznosc","ppsis lacznosc","kanaly radiowe kdr","interwencyjny lacznosc","taktyczny lacznosc","sztab lacznosc","odcinek bojowy lacznosc"],"aliasy":["lacznosc na potrzeby kdr","metodyka lacznosci kdr","psk msk lacznosc","ppsis lacznosc","kanaly radiowe kdr","interwencyjny lacznosc","taktyczny lacznosc","sztab lacznosc","odcinek bojowy lacznosc"],"prefix":"Organizacja łączności na potrzeby KDR — od poziomu interwencyjnego do sztabu. Nazwy stanowisk kierowania wg rozkazu KG PSP nr 8/2019.","najpierw":[{"t":"W drodze uzgodnij z SK KP/KM kanał ratowniczo-gaśniczy (KRG) — powinien być przydzielony przed przyjazdem.","zr":"PP 4/2014","str":1},{"t":"W sieci powiatowej (PR) z macierzystym stanowiskiem kierowania pracuje tylko KDR.","zr":"PP 4/2014","str":2},{"t":"Siły spoza powiatu zgłaszają przyjazd w sieci KSW do SK KP/KM właściwego dla miejsca działań lub do PPSiŚ.","zr":"Rozkaz 8/2019","str":8},{"t":"Używaj kryptonimów — nie imion, nazwisk ani funkcji (wyjątek: kanały KRG).","zr":"PP 4/2014","str":1}],"parametry":[{"nazwa":"PR — sieć powiatowa","wartosc":"SK KP/KM ↔ pojazdy w powiecie","zr":"Rozkaz 8/2019","str":8},{"nazwa":"KSW — współdziałanie i alarmowanie","wartosc":"nasłuch wszystkich SK; zgłaszanie przyjazdu sił spoza powiatu","zr":"Rozkaz 8/2019","str":8},{"nazwa":"KRG — ratowniczo-gaśnicza","wartosc":"łączność na miejscu akcji; dysponent w powiecie SK KP/KM, nadzór KDR","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KDW — dowodzenia i współdziałania","wartosc":"uruchamiana doraźnie; dysponent SK KW, nadzór KDR","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KO — operacyjny kierunek radiowy","wartosc":"SK KP/KM ↔ sztab KDR; dysponent SK KG","zr":"Rozkaz 8/2019","str":9},{"nazwa":"KSWL — statki powietrzne","wartosc":"kanał U02 — podstawowy do współpracy z zespołem HEMS","zr":"PP 4/2014","str":1}],"sekcje":[{"etykieta":"Odcinki bojowe (poziom taktyczny)","punkty":[{"t":"Zgłoś do SK KP/KM potrzebę kanałów KRG dla odcinków bojowych.","zr":"PP 4/2014","str":2},{"t":"SK uruchamia przez SK KW sieć KDW i informuje Cię o przydziale KDW i KRG.","zr":"PP 4/2014","str":2},{"t":"KDR ↔ dowódcy odcinków: kanał KDW; dowódcy odcinków ↔ podległe siły: kanały KRG.","zr":"PP 4/2014","str":2},{"t":"Gdy korespondencja blokuje sieć powiatową — uruchom przez SK kierunek KO i zwolnij PR dla innych zdarzeń.","zr":"PP 4/2014","str":2},{"t":"Informacje ważne dla całego terenu (podział na odcinki, zmiany kanałów) podawaj okólnikiem.","zr":"PP 4/2014","str":1}]},{"etykieta":"Punkt przyjęcia sił i środków (PPSiŚ)","punkty":[{"t":"Stały nasłuch trzech sieci: KSW, przydzielonego KDW i jednego KRG do dysponowania sił z rejonu koncentracji.","zr":"PP 4/2014","str":2},{"t":"Siły czekające w rejonie koncentracji prowadzą nasłuch na wskazanym KRG.","zr":"PP 4/2014","str":2}]},{"etykieta":"Sztab akcji","punkty":[{"t":"Sztab pozyskuje i uruchamia kierunek KO, aby nie blokować sieci PR i PW.","zr":"PP 4/2014","str":2},{"t":"Na zapotrzebowanie KDR sztab zgłasza do SK potrzebę KRG; SK uruchamia KDW i informuje sztab o przydziale.","zr":"PP 4/2014","str":2},{"t":"Od uruchomienia KDW prowadź dokumentację łączności: sieci, kanały i kryptonimy przydzielone siłom.","zr":"Rozkaz 8/2019","str":32}]},{"etykieta":"Statki powietrzne","punkty":[{"t":"Zapewnij sprawną wymianę informacji między SK KW, SK KP/KM, KDR i sztabem — statek szybko pokonuje duże odległości.","zr":"PP 4/2014","str":2},{"t":"Sieć KSWL: dysponent komendant wojewódzki PSP, na miejscu działań nadzór sprawuje KDR.","zr":"Rozkaz 8/2019","str":9}]}],"nie_rob":[{"t":"Nie zastępuj KSW siecią powiatową przy współpracy z siłami z własnego powiatu w PPSiŚ — wymaga to nasłuchu czwartej sieci.","zr":"PP 4/2014","str":2},{"t":"Nie używaj alternatywnych środków łączności, dopóki działa łączność radiowa UKF.","zr":"PP 4/2014","str":1}],"tagi_wspolne":["lacznosc","organizacja lacznosci"],"dokumenty_zrodlowe":[{"dokument_id":"doc-lacznosc-kdr-2014","strona":1,"sekcja":"Opis Metodyki (karty A, B, C) — s. 1–2"},{"dokument_id":"doc-rozkaz-8-2019-lacznosc","strona":8,"sekcja":"Struktura sieci radiowych (s. 8–9), dokumentacja łączności (s. 32)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: W drodze uzgodnij z SK KP/KM kanał ratowniczo-gaśniczy (KRG) — powinien być przydzielony przed przyjazdem. W sieci powiatowej (PR) z macierzystym stanowiskiem kierowania pracuje tylko KDR. Siły spoza powiatu zgłaszają przyjazd w sieci KSW do SK KP/KM właściwego dla miejsca działań lub do PPSiŚ. Używaj kryptonimów — nie imion, nazwisk ani funkcji (wyjątek: kanały KRG).\n2. PARAMETRY: PR — sieć powiatowa — SK KP/KM ↔ pojazdy w powiecie; KSW — współdziałanie i alarmowanie — nasłuch wszystkich SK; zgłaszanie przyjazdu sił spoza powiatu; KRG — ratowniczo-gaśnicza — łączność na miejscu akcji; dysponent w powiecie SK KP/KM, nadzór KDR; KDW — dowodzenia i współdziałania — uruchamiana doraźnie; dysponent SK KW, nadzór KDR; KO — operacyjny kierunek radiowy — SK KP/KM ↔ sztab KDR; dysponent SK KG; KSWL — statki powietrzne — kanał U02 — podstawowy do współpracy z zespołem HEMS\n3. ODCINKI BOJOWE (POZIOM TAKTYCZNY): Zgłoś do SK KP/KM potrzebę kanałów KRG dla odcinków bojowych. SK uruchamia przez SK KW sieć KDW i informuje Cię o przydziale KDW i KRG. KDR ↔ dowódcy odcinków: kanał KDW; dowódcy odcinków ↔ podległe siły: kanały KRG. Gdy korespondencja blokuje sieć powiatową — uruchom przez SK kierunek KO i zwolnij PR dla innych zdarzeń. Informacje ważne dla całego terenu (podział na odcinki, zmiany kanałów) podawaj okólnikiem.\n4. PUNKT PRZYJĘCIA SIŁ I ŚRODKÓW (PPSIŚ): Stały nasłuch trzech sieci: KSW, przydzielonego KDW i jednego KRG do dysponowania sił z rejonu koncentracji. Siły czekające w rejonie koncentracji prowadzą nasłuch na wskazanym KRG.\n5. SZTAB AKCJI: Sztab pozyskuje i uruchamia kierunek KO, aby nie blokować sieci PR i PW. Na zapotrzebowanie KDR sztab zgłasza do SK potrzebę KRG; SK uruchamia KDW i informuje sztab o przydziale. Od uruchomienia KDW prowadź dokumentację łączności: sieci, kanały i kryptonimy przydzielone siłom.\n6. STATKI POWIETRZNE: Zapewnij sprawną wymianę informacji między SK KW, SK KP/KM, KDR i sztabem — statek szybko pokonuje duże odległości. Sieć KSWL: dysponent komendant wojewódzki PSP, na miejscu działań nadzór sprawuje KDR.\n7. NIE RÓB: Nie zastępuj KSW siecią powiatową przy współpracy z siłami z własnego powiatu w PPSiŚ — wymaga to nasłuchu czwartej sieci. Nie używaj alternatywnych środków łączności, dopóki działa łączność radiowa UKF."},{"id":"KARTA-SPRZET-POLON-ALFA-RK-100-2","wzorzec":2,"kategoria":"informacja","grupa":"sprzet","zrodlo":"POLON-ALFA: Radiometr RK-100-2, Instrukcja obsługi IO-R120-001, Edycja IV.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"radiometr rk 100 2","keywords":["polon rk 100","polon rk 100 2","polon-alfa rk-100-2","radiometr rk-100-2","dozymetr rk 100","dozymetr polon","miernik promieniowania polon","obsługa rk 100 2","instrukcja rk 100 2","sonda zewnętrzna rk 100","pomiar skażeń rk 100","pomiar mocy dawki rk 100","sv h rk 100","gy h rk 100","bq cm2 rk 100","imp s rk 100","alarm rk 100","próg rk 100","rnG rk 100","Err rk 100","BAT rk 100","pomiar 100 sekund rk 100","alfa beta gamma rk 100"],"aliasy":["polon rk 100","polon rk 100 2","polon-alfa rk-100-2","rk 100","rk-100","rk 100 2","rk-100-2","radiometr polon","dozymetr polon","dozymetr rk 100","miernik promieniowania polon","obsługa rk 100","obsługa rk 100 2","instrukcja rk 100 2","sonda rk 100","sonda zewnętrzna rk 100","pomiar skażeń rk 100","pomiar mocy dawki rk 100","pomiar promieniowania rk 100","alfa beta gamma rk 100","bq cm2 rk 100","sv h rk 100","gy h rk 100","rnG rk 100","Err rk 100","BAT rk 100","pomiar 100 s rk 100"],"prefix":"Radiometr POLON-ALFA RK-100-2 — obsługa: moc dawki, skażenia sondą zewnętrzną, komunikaty i alarmy (instrukcja producenta).","najpierw":[{"t":"Moc dawki: przyciskiem wyboru ustaw Sv/h — mierzą detektory wewnętrzne, niezależnie od sondy zewnętrznej.","zr":"RK-100-2 IO","str":22},{"t":"Po włączeniu „– – –” przez kilka–kilkanaście sekund = pomiar jeszcze niegotowy.","zr":"RK-100-2 IO","str":20},{"t":"„rnG” = przekroczenie zakresu — nie traktuj jako wartości liczbowej.","zr":"RK-100-2 IO","str":18}],"parametry":[{"nazwa":"Sonda wewnętrzna","wartosc":"moc równoważnika dawki do 50 mSv/h; moc dawki pochłoniętej do 50 mGy/h","zr":"RK-100-2 IO","str":7},{"nazwa":"Sonda zewnętrzna","wartosc":"skażenia α, β, γ; wskazania zawsze w imp/s lub Bq/cm² — filtr γ nie przelicza na Sv/h","zr":"RK-100-2 IO","str":7},{"nazwa":"Pomiar uśredniony","wartosc":"100 s — przy niskim poziomie i rozrzucie wskazań","zr":"RK-100-2 IO","str":28},{"nazwa":"Próg alarmowy","wartosc":"śledzony jest tylko jeden próg wybrany przez użytkownika","zr":"RK-100-2 IO","str":19}],"sekcje":[{"etykieta":"Sonda zewnętrzna","punkty":[{"t":"Podłączaj i odłączaj tylko przy wyłączonym przyrządzie; odłączenie w trakcie = sygnalizacja uszkodzenia.","zr":"RK-100-2 IO","str":14},{"t":"Bez osłon: α+β+γ; osłona z okienkiem foliowym: β+γ; lita osłona aluminiowa: γ — trzy pomiary wskazują dominujące promieniowanie.","zr":"RK-100-2 IO","str":24},{"t":"Pomiarów skażeń nie wykonuj z filtrem γ.","zr":"RK-100-2 IO","str":24},{"t":"Bq/cm² miarodajne tylko z właściwym współczynnikiem izotopu (świadectwo sprawdzenia).","zr":"RK-100-2 IO","str":7},{"t":"Sonda jest delikatna — nie stawiaj jej bez osłon na trawie, kamieniach, ostrych przedmiotach.","zr":"RK-100-2 IO","str":14}]},{"etykieta":"Komunikaty","punkty":[{"t":"„BAT” na stałe — bezwarunkowo wymień baterie; przy dalszym spadku przyrząd się wyłączy.","zr":"RK-100-2 IO","str":17},{"t":"„Er” po włączeniu — błąd kanału; „Err” w trakcie — błąd detektora.","zr":"RK-100-2 IO","str":15},{"t":"Brak lub uszkodzenie sondy zewnętrznej sygnalizowane z opóźnieniem ok. 2 min.","zr":"RK-100-2 IO","str":20}]},{"etykieta":"Uwaga operacyjna","punkty":[{"t":"Instrukcja opisuje obsługę przyrządu — strefy i dopuszczalne dawki wyznaczaj wg kart R1 i R2 (zasady KG PSP).","zr":"RK-100-2 IO","str":7}]}],"tagi_wspolne":["radiacja","radiometr","dozymetr","sprzęt pomiarowy","skażenie promieniotwórcze","moc dawki","Polon-Alfa"],"dokumenty_zrodlowe":[{"dokument_id":"doc-polon-alfa-rk-100-2-manual","strona":7,"sekcja":"Dane techniczne (s. 7), sonda (s. 13–14), sygnalizacje (s. 15–20), pomiary (s. 22–28)"},{"dokument_id":"doc-polon-alfa-rk-100-2-product","strona":1,"sekcja":"Aktualna strona producenta"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Moc dawki: przyciskiem wyboru ustaw Sv/h — mierzą detektory wewnętrzne, niezależnie od sondy zewnętrznej. Po włączeniu „– – –” przez kilka–kilkanaście sekund = pomiar jeszcze niegotowy. „rnG” = przekroczenie zakresu — nie traktuj jako wartości liczbowej.\n2. PARAMETRY: Sonda wewnętrzna — moc równoważnika dawki do 50 mSv/h; moc dawki pochłoniętej do 50 mGy/h; Sonda zewnętrzna — skażenia α, β, γ; wskazania zawsze w imp/s lub Bq/cm² — filtr γ nie przelicza na Sv/h; Pomiar uśredniony — 100 s — przy niskim poziomie i rozrzucie wskazań; Próg alarmowy — śledzony jest tylko jeden próg wybrany przez użytkownika\n3. SONDA ZEWNĘTRZNA: Podłączaj i odłączaj tylko przy wyłączonym przyrządzie; odłączenie w trakcie = sygnalizacja uszkodzenia. Bez osłon: α+β+γ; osłona z okienkiem foliowym: β+γ; lita osłona aluminiowa: γ — trzy pomiary wskazują dominujące promieniowanie. Pomiarów skażeń nie wykonuj z filtrem γ. Bq/cm² miarodajne tylko z właściwym współczynnikiem izotopu (świadectwo sprawdzenia). Sonda jest delikatna — nie stawiaj jej bez osłon na trawie, kamieniach, ostrych przedmiotach.\n4. KOMUNIKATY: „BAT” na stałe — bezwarunkowo wymień baterie; przy dalszym spadku przyrząd się wyłączy. „Er” po włączeniu — błąd kanału; „Err” w trakcie — błąd detektora. Brak lub uszkodzenie sondy zewnętrznej sygnalizowane z opóźnieniem ok. 2 min.\n5. UWAGA OPERACYJNA: Instrukcja opisuje obsługę przyrządu — strefy i dopuszczalne dawki wyznaczaj wg kart R1 i R2 (zasady KG PSP)."},{"id":"KARTA-ORG-WYTYCZNE-WSPOLDZIALANIA-CBRNE","kategoria":"organizacja","zrodlo":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym, Zalacznik nr 1","data_aktualizacji":"","slowo_kluczowe":"wspoldzialanie cbrne","keywords":["wytyczne cbrne","zdarzenie cbrne","policja psp cbrne","koordynacja cbrne","dekontaminacja cbrne","sztab cbrne","rozpoznanie cbrne"],"prefix":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen CBRN-E.","content":"1. CEL DOKUMENTU: okreslenie zasad wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym.\n2. SLUZBA WIODACA: po uzyskaniu informacji o zdarzeniu zwiazanym z zagrozeniem o charakterze CBRN sluzba wiodaca w zakresie rozpoznania zagrozen czynnikami CBRN jest PSP, z wylaczeniem zdarzen o charakterze kryminalnym lub terrorystycznym. W przypadku zdarzen CBRN-E o charakterze kryminalnym lub terrorystycznym sluzba wiodaca jest Policja, ktora koordynuje wspolprace wszystkich sluzb.\n3. WSPOLPRACA NA MIEJSCU: sluzba koordynujaca dzialania korzysta z sil, wiedzy i srodkow innych przybylych sluzb i instytucji w ramach ich mozliwosci sprzetowych, kwalifikacyjnych i operacyjnych. Zaleca sie wspolprace w zakresie wsparcia technicznego i wykorzystania sprzetu specjalistycznego Policji i PSP oraz prowadzenia polaczonego rozpoznania.\n4. ROZPOZNANIE I SOI: funkcjonariusze wykonujacy rozpoznanie zagrozen na miejscu zdarzenia o charakterze CBRN-E wykonuje czynnosci w srodkach ochrony indywidualnej chroniacych przed tymi czynnikami. Sluzby wzajemnie, w miare potrzeb i mozliwosci, uzyczaja sobie srodkow ochrony indywidualnej.\n5. ORGANIZACJA DZIALAN: po przybyciu na miejsce patrolu Policji lub zastepu PSP i potwierdzeniu zdarzenia nalezy poinformowac wlasciwego miejscowo dyzurnego. Podmiot wiodacy dla osiagniecia efektywnej wspolpracy i wymiany informacji pomiedzy sluzbami wyznacza wspolne miejsce dowodzenia, czyli sztab, z udzialem przedstawicieli sluzb i instytucji bioracych udzial w dzialaniach.\n6. SPRZET I INSTRUKTAZ: rozpoznanie zagrozen prowadzi funkcjonariusz sluzby wiodacej wyposazony w niezbedny sprzet detekcyjny wlasnej jednostki badz udostepniony przez inne sluzby po udzieleniu niezbednego instruktażu z zakresu jego obslugi. Czynnosc instruktażu odnotowuje sie w dokumentacji sluzbowej.\n7. PRIORYTETY: nadrzednym celem sluzb dzialajacych na miejscu zdarzenia jest udzielanie pomocy osobom poszkodowanym znajdujacym sie w strefie zagrozenia, niezaleznie od innych czynnosci prowadzonych rownolegle.\n8. DEKONTAMINACJA I KONTROLA SKAZEN: PSP przygotowuje sciezki dekontaminacji odpowiednio je oznaczajac, a nastepnie przeprowadza dekontaminacje osob i sprzetu. Inne sluzby na miejscu zdarzenia moga prowadzic dekontaminacje w zakresie posiadanych sil i srodkow. Proces dekontaminacji dotyczy rowniez funkcjonariuszy sluzb oraz ich sprzetu i wyposazenia, ktore zostaly wprowadzone do strefy skazonej.\n9. SKAZENIA WTÓRNE: w sytuacji wystapienia skazenia czynnikami CBRN-E nalezy dazyc do jak najwiekszej kontroli nad skazeniami wtornymi. PSP w porozumieniu z Policja wyznaczaja miejsca zbiorki dla osob przeznaczonych do ewakuacji do momentu przeprowadzenia ich przez proces dekontaminacji. Policja prowadzi nadzor nad osobami przed i po dekontaminacji do momentu zakonczenia niezbednych czynnosci.\n10. UWAGI OPERACYJNE: gdy powyzsze wytyczne nie moga byc zrealizowane, sluzby uzgadniaja miedzy soba sposob dzialania alternatywny i adekwatny dla danego zdarzenia. Dzialania nalezy prowadzic w sposob minimalizujacy zniszczenie lub zatarcie materialu dowodowego.","tagi_wspolne":["cbrne","wspoldzialanie"],"aliasy":["wytyczne cbrne","zdarzenie cbrne","policja psp cbrne","koordynacja cbrne","dekontaminacja cbrne","sztab cbrne","rozpoznanie cbrne"],"pelna_procedura":{"tytul":"Wytyczne wspoldzialania sluzb interweniujacych na miejscu zdarzen w warunkach zagrozenia czynnikami CBRN-E, w tym o charakterze terrorystycznym, Zalacznik nr 1","plik":"","strona":null},"zrodlo_dostepnosc":"niedostepne_publicznie"},{"id":"KARTA-ORG-ZASADY-KIEROWANIA-DZIALANIEM-RATOWNICZYM","wzorzec":2,"kategoria":"dzialania","grupa":"org","zrodlo":"Rozporządzenie MSWiA z 24.06.2026 w sprawie szczegółowej organizacji KSRG (Dz.U. 2026 poz. 872), rozdział 6 — obowiązuje od 01.07.2026, zastąpiło rozporządzenie z 17.09.2021 (Dz.U. 2021 poz. 1737)","data_aktualizacji":"2026-10-27","slowo_kluczowe":"poziomy kierowania działaniem ratowniczym","keywords":["kierowanie interwencyjne","kierowanie taktyczne","kierowanie strategiczne","kolejność przejmowania kierowania","przejęcie kierowania","kto przejmuje kierowanie","rozporządzenie ksrg 2026","koordynator medycznych działań ratowniczych","dowódca odcinka bojowego"],"aliasy":["kierowanie interwencyjne","kierowanie taktyczne","kiero rzez KP/KM → zastępca KP/KM → KP/KM","zr":"Rozp. KSRG 2026","str":13},{"nazwa":"Kolejność — strategiczny","wartosc":"oficer wyznaczony przez KW → zastępca KW → KW → oficer wyznaczony przez KG → zastępca KG → KG","zr":"Rozp. KSRG 2026","str":13}],"sekcje":[{"etykieta":"Zasady przejmowania","punkty":[{"t":"Brak uprawnionego ratownika JOP — kierowanie interwencyjne przejmuje ratownik podmiotu KSRG niebędącego JOP.","zr":"Rozp. KSRG 2026","str":13},{"t":"Specjalistyczna grupa ratownicza — kierowanie interwencyjne w jej części zadań organizuje jej dowódca.","zr":"Rozp. KSRG 2026","str":13},{"t":"Kilka osób tej samej hierarchii — kierowanie przejmuje osoba, dla której miejsce zdarzenia jest przyporządkowane administracyjnie.","zr":"Rozp. KSRG 2026","str":15},{"t":"Uruchomienie kierowania wyższego poziomu nie zmniejsza obowiązków kierujących na niższym poziomie.","zr":"Rozp. KSRG 2026","str":15},{"t":"Zakłady ze służbą ratowniczą lub strażą zakładową — kierowanie interwencyjne i taktyczne wg planów działań ratowniczych zakładu.","zr":"Rozp. KSRG 2026","str":15}]},{"etykieta":"Kierowanie interwencyjne — zadania","punkty":[{"t":"Rodzaj zagrożeń i strefa zagrożenia; zadania dla rot i pododdziałów; poszukiwanie poszkodowanych i medyczne działania ratownicze.","zr":"Rozp. KSRG 2026","str":14},{"t":"Ewakuacja ludności i zwierząt, dekontaminacja wstępna, kontrola czasu pracy w ubraniach ochronnych i sprzęcie ochrony układu oddechowego.","zr":"Rozp. KSRG 2026","str":14},{"t":"Łączność, zapotrzebowanie na siły i środki, wsparcie logistyczne, meldunki do SK, współdziałanie z KMDR, KAM, mediami i innymi podmiotami.","zr":"Rozp. KSRG 2026","str":14}]},{"etykieta":"Kierowanie taktyczne — zadania","punkty":[{"t":"Prowadzone ze stałego lub ruchomego stanowiska dowodzenia, z którego można ocenić rozwój sytuacji.","zr":"Rozp. KSRG 2026","str":13},{"t":"Podział na odcinki bojowe i zadania dla ich dowódców; oznakowane miejsce kierowania; zmiany sił w strefie; punkty przyjęcia sił i środków.","zr":"Rozp. KSRG 2026","str":14},{"t":"Współdziałanie z mediami albo wyznaczenie oficera prasowego; ograniczanie skutków stresu pourazowego ratowników.","zr":"Rozp. KSRG 2026","str":14}]},{"etykieta":"Sztab","punkty":[{"t":"KDR poziomu interwencyjnego i taktycznego może powołać sztab; na poziomie strategicznym powołanie sztabu należy do zadań kierującego.","zr":"Rozp. KSRG 2026","str":15},{"t":"Nowe zadanie sztabu: zbieranie danych o warunkach ochrony ppoż. obiektu — dojazd, zaopatrzenie w wodę, zabezpieczenia, instrukcja bezpieczeństwa pożarowego, plany i dokumentacja.","zr":"Rozp. KSRG 2026","str":16}]},{"etykieta":"Medyczne działania ratownicze","punkty":[{"t":"Do przybycia ZRM lub LZRM KDR może wskazać koordynatora medycznych działań ratowniczych — osobę z kwalifikacjami do udzielania świadczeń zdrowotnych.","zr":"Rozp. KSRG 2026","str":11},{"t":"Po przybyciu ZRM koordynację przejmuje kierujący akcją medyczną.","zr":"Rozp. KSRG 2026","str":11}]},{"etykieta":"Zmiany od 01.07.2026 (względem 2021)","punkty":[{"t":"Interwencyjny: „strażak ratownik OSP” zamiast „członek OSP”; taktyczny i strategiczny: dodani zastępcy komendantów (KP/KM, KW, KG).","zr":"Rozp. KSRG 2026","str":12},{"t":"Poziom strategiczny dla odwodów operacyjnych dopiero powyżej 1 kompanii.","zr":"Rozp. KSRG 2026","str":12},{"t":"Nowe definicje: odcinek bojowy, dowódca odcinka bojowego, obszar chroniony.","zr":"Rozp. KSRG 2026","str":2},{"t":"Plany ratownicze sporządzone wg rozporządzenia z 2021 r. zachowują ważność 1 rok od ostatniej aktualizacji, nie dłużej niż do 30.06.2027.","zr":"Rozp. KSRG 2026","str":24},{"t":"Dokumentacja KG PSP (m.in. organizowanie działań ratowniczych) wydana na podstawie rozporządzenia z 2021 r. zachowuje ważność do czasu aktualizacji.","zr":"Rozp. KSRG 2026","str":24}]}],"wsparcie":[{"t":"KDR może korzystać z wiedzy ekspertów i specjalistów do spraw ratownictwa wpisanych do wykazu z art. 14fa ustawy o ochronie przeciwpożarowej.","zr":"Rozp. KSRG 2026","str":11}],"nie_rob":[{"t":"Nie stosuj tych zasad kierowania do działań prowadzonych na podstawie prawa lotniczego, morskiego, górniczego ani w ratownictwie górskim i narciarskim.","zr":"Rozp. KSRG 2026","str":16}],"tagi_wspolne":["kierowanie działaniem ratowniczym","KSRG"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rozp-ksrg-2026","strona":12,"sekcja":"Rozdział 6 — Kierowanie działaniem ratowniczym (§ 21–30, s. 12–16); § 2 definicje (s. 2); § 18–19 (s. 11); § 57 (s. 24)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Przejęcie kierowania interwencyjnego, taktycznego lub strategicznego zgłoś do właściwego SK i odnotuj w dokumentacji. Kierujący działaniem ratowniczym musi być oznakowany w sposób widoczny dla innych uczestników działań. Zdarzenie CBRNE: zabezpieczenie dowodów może mieć priorytet przed działaniami niezwiązanymi z bezpośrednim ratowaniem życia — decyzja w uzgodnieniu z kierującym działaniami antyterrorystycznymi. Kierowanie ustaje po przekazaniu poszkodowanych PRM oraz terenu lub obiektu właścicielowi, zarządcy, organowi, Policji lub straży gminnej; gdy nie ma komu — zgłoś to do SK.\n2. PARAMETRY: Interwencyjny — w strefie zagrożenia lub działań · siły do 1 kompanii; Taktyczny — na granicy strefy lub poza nią · siły do 1 batalionu albo z co najmniej jedną specjalistyczną grupą ratowniczą; Strategiczny — siły powyżej 1 batalionu albo odwody operacyjne (wojewódzkie, centralny) powyżej 1 kompanii; Kolejność — interwencyjny — strażak ratownik OSP → komendant gminny (jeśli strażak ratownik OSP) → strażak JOP → dowódca zastępu PSP → dowódca sekcji → zastępca dowódcy zmiany → dowódca zmiany → zastępca dowódcy JRG → dowódca JRG; Kolejność — taktyczny — zastępca dowódcy JRG → dowódca JRG → oficer lub aspirant wyznaczony przez KP/KM → zastępca KP/KM → KP/KM; Kolejność — strategiczny — oficer wyznaczony przez KW → zastępca KW → KW → oficer wyznaczony przez KG → zastępca KG → KG\n3. ZASADY PRZEJMOWANIA: Brak uprawnionego ratownika JOP — kierowanie interwencyjne przejmuje ratownik podmiotu KSRG niebędącego JOP. Specjalistyczna grupa ratownicza — kierowanie interwencyjne w jej części zadań organizuje jej dowódca. Kilka osób tej samej hierarchii — kierowanie przejmuje osoba, dla której miejsce zdarzenia jest przyporządkowane administracyjnie. Uruchomienie kierowania wyższego poziomu nie zmniejsza obowiązków kierujących na niższym poziomie. Zakłady ze służbą ratowniczą lub strażą zakładową — kierowanie interwencyjne i taktyczne wg planów działań ratowniczych zakładu.\n4. KIEROWANIE INTERWENCYJNE — ZADANIA: Rodzaj zagrożeń i strefa zagrożenia; zadania dla rot i pododdziałów; poszukiwanie poszkodowanych i medyczne działania ratownicze. Ewakuacja ludności i zwierząt, dekontaminacja wstępna, kontrola czasu pracy w ubraniach ochronnych i sprzęcie ochrony układu oddechowego. Łączność, zapotrzebowanie na siły i środki, wsparcie logistyczne, meldunki do SK, współdziałanie z KMDR, KAM, mediami i innymi podmiotami.\n5. KIEROWANIE TAKTYCZNE — ZADANIA: Prowadzone ze stałego lub ruchomego stanowiska dowodzenia, z którego można ocenić rozwój sytuacji. Podział na odcinki bojowe i zadania dla ich dowódców; oznakowane miejsce kierowania; zmiany sił w strefie; punkty przyjęcia sił i środków. Współdziałanie z mediami albo wyznaczenie oficera prasowego; ograniczanie skutków stresu pourazowego ratowników.\n6. SZTAB: KDR poziomu interwencyjnego i taktycznego może powołać sztab; na poziomie strategicznym powołanie sztabu należy do zadań kierującego. Nowe zadanie sztabu: zbieranie danych o warunkach ochrony ppoż. obiektu — dojazd, zaopatrzenie w wodę, zabezpieczenia, instrukcja bezpieczeństwa pożarowego, plany i dokumentacja.\n7. MEDYCZNE DZIAŁANIA RATOWNICZE: Do przybycia ZRM lub LZRM KDR może wskazać koordynatora medycznych działań ratowniczych — osobę z kwalifikacjami do udzielania świadczeń zdrowotnych. Po przybyciu ZRM koordynację przejmuje kierujący akcją medyczną.\n8. ZMIANY OD 01.07.2026 (WZGLĘDEM 2021): Interwencyjny: „strażak ratownik OSP” zamiast „członek OSP”; taktyczny i strategiczny: dodani zastępcy komendantów (KP/KM, KW, KG). Poziom strategiczny dla odwodów operacyjnych dopiero powyżej 1 kompanii. Nowe definicje: odcinek bojowy, dowódca odcinka bojowego, obszar chroniony. Plany ratownicze sporządzone wg rozporządzenia z 2021 r. zachowują ważność 1 rok od ostatniej aktualizacji, nie dłużej niż do 30.06.2027. Dokumentacja KG PSP (m.in. organizowanie działań ratowniczych) wydana na podstawie rozporządzenia z 2021 r. zachowuje ważność do czasu aktualizacji.\n9. WEZWIJ WSPARCIE, GDY: KDR może korzystać z wiedzy ekspertów i specjalistów do spraw ratownictwa wpisanych do wykazu z art. 14fa ustawy o ochronie przeciwpożarowej.\n10. NIE RÓB: Nie stosuj tych zasad kierowania do działań prowadzonych na podstawie prawa lotniczego, morskiego, górniczego ani w ratownictwie górskim i narciarskim."},{"id":"KARTA-ORG-ZASADY-ORGANIZACJI-SZTABU","wzorzec":2,"kategoria":"organizacja","zrodlo":"KG PSP: Zasady organizacji sztabu na potrzeby prowadzenia działań ratowniczych, Warszawa, styczeń 2025","data_aktualizacji":"2026-10-27","slowo_kluczowe":"organizacja sztabu","keywords":["sztab akcji","powołanie sztabu","szef sztabu","zespoły sztabu","raport sytuacyjny","karta manipulacyjna","miejsce pracy sztabu","wyposażenie sztabu","obozowisko"],"aliasy":["sztab akcji","powołanie sztabu","szef sztabu","zespoły sztabu","raport sytuacyjny","karta manipulacyjna","miejsce pracy sztabu","wyposażenie sztabu","obozowisko"],"prefix":"Sztab na potrzeby działań ratowniczych — kiedy powołać, struktura, zadania zespołów, miejsce i wyposażenie (Zasady KG PSP, styczeń 2025).","najpierw":[{"t":"Kierowanie strategiczne — sztab powinien być powołany; interwencyjne i taktyczne — może być powołany.","zr":"Sztab 2025","str":4},{"t":"Wyznacz Szefa sztabu; strukturę i skład sztabu określa on w uzgodnieniu z Tobą.","zr":"Sztab 2025","str":7},{"t":"Siły do sztabu dysponuje SK PSP na wniosek Szefa sztabu uzgodniony z KDR.","zr":"Sztab 2025","str":8},{"t":"Miejsce pracy sztabu wybiera Szef sztabu w porozumieniu z KDR — bezpieczne wobec prognozy rozwoju zdarzenia, z łącznością, blisko działań i PPSiŚ.","zr":"Sztab 2025","str":14}],"parametry":[{"nazwa":"Struktura","wartosc":"KDR → Szef sztabu → zespoły: operacyjny (OP), łączności (IT), logistyki (LOG), prasowy (MEDIA); w razie potrzeby kolejne","zr":"Sztab 2025","str":7},{"nazwa":"KMDR","wartosc":"w zespole operacyjnym — koordynuje zabezpieczenie medyczne działań","zr":"Sztab 2025","str":8},{"nazwa":"Zastępstwo Szefa sztabu","wartosc":"zastępca Szefa sztabu lub szef zespołu operacyjnego","zr":"Sztab 2025","str":7},{"nazwa":"Kamizelki","wartosc":"Szef sztabu i szefowie 4 zespołów; przy PPSiŚ / obozowisku także ich szefowie","zr":"Sztab 2025","str":9},{"nazwa":"Wyposażenie — każdy sztab","wartosc":"SLRR, dron, pojazdy do przewozu osób, quad","zr":"Sztab 2025","str":15},{"nazwa":"Działania > 12 h — dodatkowo","wartosc":"SLDł, SDł, moduł sztabowy, SLKw, Starlink","zr":"Sztab 2025","str":15},{"nazwa":"Wg poziomu kierowania","wartosc":"taktyczny: SLDł, SLKw, Starlink · strategiczny: SDł, moduł sztabowy, SLKw, Starlink","zr":"Sztab 2025","str":15}],"sekcje":[{"etykieta":"Zespół operacyjny","punkty":[{"t":"Organizuje teren akcji: struktura dowodzenia, koncepcja odcinków bojowych, PPSiŚ, zaopatrzenie wodne, trasy dojazdu i powrotu.","zr":"Sztab 2025","str":10},{"t":"Koncepcja łączności dla KDR: kanały dowodzenia (także przemienniki mobilne) i współdziałania ze służbami.","zr":"Sztab 2025","str":11},{"t":"Mapy i wizualizacja sytuacji, analizy GIS (także z danych zespołu dronowego).","zr":"Sztab 2025","str":11},{"t":"Raporty sytuacyjne wg wzoru (zał. 1), karta zdarzenia i karta manipulacyjna na bieżąco.","zr":"Sztab 2025","str":11},{"t":"Zespół rozpoznania na miejscu działań w stałym kontakcie ze sztabem.","zr":"Sztab 2025","str":11},{"t":"Analiza i prognoza sytuacji, propozycja zamiaru taktycznego, zapotrzebowanie na wsparcie innych służb.","zr":"Sztab 2025","str":11},{"t":"Ciągłość pracy sztabu (zmiany obsady); ostrzeganie i ewakuacja ludności z Policją.","zr":"Sztab 2025","str":12}]},{"etykieta":"Łączność, logistyka, media","punkty":[{"t":"Łączność (IT): zaplecze teleinformatyczne, SDł z uwzględnieniem zasięgów, programowanie radiotelefonów, schemat łączności, transmisja obrazu z dronów, dostęp do SWD PSP.","zr":"Sztab 2025","str":12},{"t":"Logistyka (LOG): zakwaterowanie lub obozowisko (regulamin — zał. 2), wyżywienie, sanitariaty, paliwa, środki gaśnicze i sorbenty, rezerwy sprzętu, punkt medyczny, dozór nocny.","zr":"Sztab 2025","str":12},{"t":"Prasowy (MEDIA): bezpieczne miejsce dla mediów, cykliczne briefingi, dokumentacja zdjęciowa, monitoring mediów, współpraca z rzecznikami.","zr":"Sztab 2025","str":13}]},{"etykieta":"Tryb pracy","punkty":[{"t":"Podział na zmiany, osoba odpowiedzialna za każde zadanie, kontrola dostępu, cykliczne odprawy.","zr":"Sztab 2025","str":17},{"t":"Obieg informacji: KDR — sztab — dowódcy odcinków — stanowiska kierowania PSP; bieżąca karta manipulacyjna.","zr":"Sztab 2025","str":17},{"t":"W PPSiŚ trzy urządzenia do jednoczesnej łączności radiowej (SLRR z modułem łączności lub SLDł).","zr":"Sztab 2025","str":17}]},{"etykieta":"Dokumentacja","punkty":[{"t":"Korzystaj z planów ratowniczych (np. plany operacyjno-ratownicze zakładów), dokumentacji odwodów i procedur.","zr":"Sztab 2025","str":18},{"t":"Sztab prowadzi: decyzje i protokoły, kartę manipulacyjną (polecenia KDR), zestawienie SiS, informacje z odcinków, wykaz potrzeb, raporty sytuacyjne, mapy sytuacyjne.","zr":"Sztab 2025","str":18}]}],"wsparcie":[{"t":"Do sztabu doraźnego: siły sąsiednich KP/KM i KW PSP (grupy operacyjne), sztaby odwodów, a eksperci z kraju — przez SK Komendanta Głównego PSP.","zr":"Sztab 2025","str":6}],"nie_rob":[{"t":"Nie wybieraj miejsca sztabu bez oceny bezpieczeństwa ratowników wobec prognozowanego rozwoju sytuacji.","zr":"Sztab 2025","str":14}],"tagi_wspolne":["organizacja dzialan","sztab"],"dokumenty_zrodlowe":[{"dokument_id":"doc-sztab-2025","strona":4,"sekcja":"Wprowadzenie (s. 4), struktura (s. 7–9), zadania (s. 10–13), miejsce (s. 14), wyposażenie (s. 15), tryb pracy (s. 17), dokumentacja (s. 18)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Kierowanie strategiczne — sztab powinien być powołany; interwencyjne i taktyczne — może być powołany. Wyznacz Szefa sztabu; strukturę i skład sztabu określa on w uzgodnieniu z Tobą. Siły do sztabu dysponuje SK PSP na wniosek Szefa sztabu uzgodniony z KDR. Miejsce pracy sztabu wybiera Szef sztabu w porozumieniu z KDR — bezpieczne wobec prognozy rozwoju zdarzenia, z łącznością, blisko działań i PPSiŚ.\n2. PARAMETRY: Struktura — KDR → Szef sztabu → zespoły: operacyjny (OP), łączności (IT), logistyki (LOG), prasowy (MEDIA); w razie potrzeby kolejne; KMDR — w zespole operacyjnym — koordynuje zabezpieczenie medyczne działań; Zastępstwo Szefa sztabu — zastępca Szefa sztabu lub szef zespołu operacyjnego; Kamizelki — Szef sztabu i szefowie 4 zespołów; przy PPSiŚ / obozowisku także ich szefowie; Wyposażenie — każdy sztab — SLRR, dron, pojazdy do przewozu osób, quad; Działania > 12 h — dodatkowo — SLDł, SDł, moduł sztabowy, SLKw, Starlink; Wg poziomu kierowania — taktyczny: SLDł, SLKw, Starlink · strategiczny: SDł, moduł sztabowy, SLKw, Starlink\n3. ZESPÓŁ OPERACYJNY: Organizuje teren akcji: struktura dowodzenia, koncepcja odcinków bojowych, PPSiŚ, zaopatrzenie wodne, trasy dojazdu i powrotu. Koncepcja łączności dla KDR: kanały dowodzenia (także przemienniki mobilne) i współdziałania ze służbami. Mapy i wizualizacja sytuacji, analizy GIS (także z danych zespołu dronowego). Raporty sytuacyjne wg wzoru (zał. 1), karta zdarzenia i karta manipulacyjna na bieżąco. Zespół rozpoznania na miejscu działań w stałym kontakcie ze sztabem. Analiza i prognoza sytuacji, propozycja zamiaru taktycznego, zapotrzebowanie na wsparcie innych służb. Ciągłość pracy sztabu (zmiany obsady); ostrzeganie i ewakuacja ludności z Policją.\n4. ŁĄCZNOŚĆ, LOGISTYKA, MEDIA: Łączność (IT): zaplecze teleinformatyczne, SDł z uwzględnieniem zasięgów, programowanie radiotelefonów, schemat łączności, transmisja obrazu z dronów, dostęp do SWD PSP. Logistyka (LOG): zakwaterowanie lub obozowisko (regulamin — zał. 2), wyżywienie, sanitariaty, paliwa, środki gaśnicze i sorbenty, rezerwy sprzętu, punkt medyczny, dozór nocny. Prasowy (MEDIA): bezpieczne miejsce dla mediów, cykliczne briefingi, dokumentacja zdjęciowa, monitoring mediów, współpraca z rzecznikami.\n5. TRYB PRACY: Podział na zmiany, osoba odpowiedzialna za każde zadanie, kontrola dostępu, cykliczne odprawy. Obieg informacji: KDR — sztab — dowódcy odcinków — stanowiska kierowania PSP; bieżąca karta manipulacyjna. W PPSiŚ trzy urządzenia do jednoczesnej łączności radiowej (SLRR z modułem łączności lub SLDł).\n6. DOKUMENTACJA: Korzystaj z planów ratowniczych (np. plany operacyjno-ratownicze zakładów), dokumentacji odwodów i procedur. Sztab prowadzi: decyzje i protokoły, kartę manipulacyjną (polecenia KDR), zestawienie SiS, informacje z odcinków, wykaz potrzeb, raporty sytuacyjne, mapy sytuacyjne.\n7. WEZWIJ WSPARCIE, GDY: Do sztabu doraźnego: siły sąsiednich KP/KM i KW PSP (grupy operacyjne), sztaby odwodów, a eksperci z kraju — przez SK Komendanta Głównego PSP.\n8. NIE RÓB: Nie wybieraj miejsca sztabu bez oceny bezpieczeństwa ratowników wobec prognozowanego rozwoju sytuacji."},{"id":"KARTA-ORG-ZASADY-ORGANIZOWANIA-DZIALAN-RATOWNICZYCH","wzorzec":2,"kategoria":"organizacja","grupa":"org","zrodlo":"KG PSP: Zasady organizowania działań ratowniczych, Warszawa, marzec 2013 (dokumentacja KG PSP — zachowuje ważność do aktualizacji, § 57 ust. 2 rozporządzenia KSRG z 24.06.2026).","data_aktualizacji":"2026-10-27","slowo_kluczowe":"organizacja dzialan ratowniczych","keywords":["zasady organizowania dzialan","kdr organizacja dzialan","uprawnienia kdr","rozpoznanie kdr","ciaglosc dzialan ratowniczych","przejecie kierowania dzialaniem","struktura dowodzenia akcji","odwod akcji","lacznosc alarmowanie"],"aliasy":["zasady organizowania dzialan","kdr organizacja dzialan","uprawnienia kdr","rozpoznanie kdr","ciaglosc dzialan ratowniczych","przejecie kierowania dzialaniem","struktura dowodzenia akcji","odwod akcji","lacznosc alarmowanie"],"prefix":"Zasady organizowania działań ratowniczych — uprawnienia KDR, rozpoznanie, cel i zamiar, ciągłość, struktura dowodzenia, zakończenie (KG PSP 2013).","najpierw":[{"t":"Cel główny w kolejności: ludzie, zwierzęta, środowisko, mienie — osiągalny siłami na terenie akcji.","zr":"ZODR 2013","str":11},{"t":"W rozpoznaniu załóż wystąpienie zagrożenia i dobierz do tego ochronę indywidualną.","zr":"ZODR 2013","str":11},{"t":"Przejęcie kierowania poprzedź zapoznaniem z oceną sytuacji, zamiarem i siłami; zgłoś je do SK PSP.","zr":"ZODR 2013","str":12},{"t":"Zawsze uwzględniaj najbardziej niekorzystny rozwój sytuacji.","zr":"ZODR 2013","str":12}],"parametry":[{"nazwa":"Rozpiętość kierowania","wartosc":"KDR-owi nie powinno podlegać bezpośrednio więcej niż 8 dowódców niższego poziomu","zr":"ZODR 2013","str":13},{"nazwa":"Kierowanie","wartosc":"jednoosobowe; poziom interwencyjny, taktyczny lub strategiczny","zr":"ZODR 2013","str":10},{"nazwa":"Odwód","wartosc":"wielkość i rodzaj sił, dowódca, miejsce koncentracji, łączność i alarmowanie","zr":"ZODR 2013","str":12}],"sekcje":[{"etykieta":"Uprawnienia KDR (pkt 11)","punkty":[{"t":"Ewakuacja ludzi (panika, możliwe odcięcie drogi ewakuacji) i mienia; zakaz przebywania osób postronnych.","zr":"ZODR 2013","str":8},{"t":"Prace wyburzeniowe i rozbiórkowe; wstrzymanie ruchu lądowego.","zr":"ZODR 2013","str":9},{"t":"Przyjęcie w użytkowanie pojazdów, sprzętu, ujęć wody, środków gaśniczych, nieruchomości — z wyjątkiem misji dyplomatycznych i urzędów konsularnych.","zr":"ZODR 2013","str":9},{"t":"Odstąpienie od zasad uznanych za bezpieczne, z dostępnymi zabezpieczeniami, gdy istnieje prawdopodobieństwo uratowania życia (sprzęt zastępczy, siła ratownika, ochotnik).","zr":"ZODR 2013","str":9},{"t":"Uprawnienia ograniczone do stanu wyższej konieczności (art. 26 KK); zarządzenia mogą mieć rygor natychmiastowej wykonalności.","zr":"ZODR 2013","str":10}]},{"etykieta":"Prowadzenie działań","punkty":[{"t":"Wstępna koncepcja możliwa w czasie dojazdu; dane ze zgłoszenia zweryfikuj na miejscu.","zr":"ZODR 2013","str":10},{"t":"Rozpoznanie jest ciągłe przez całą akcję — przechodzi w monitorowanie sytuacji.","zr":"ZODR 2013","str":11},{"t":"Po rozpoznaniu, ocenie i wyborze celu KDR określa zamiar taktyczny i przekazuje go rozkazem bojowym.","zr":"ZODR 2013","str":11},{"t":"Działania prowadź nieprzerwanie do osiągnięcia celów; brak możliwości kierowania = przejęcie przez inną uprawnioną osobę.","zr":"ZODR 2013","str":12}]},{"etykieta":"Organizacja terenu akcji","punkty":[{"t":"Wyznacz strefę zagrożenia i obszar, w którym ratownicy mogą przebywać bez dodatkowej ochrony.","zr":"ZODR 2013","str":13},{"t":"Odcinki bojowe i sztab wg rozporządzenia KSRG; struktura łączności odpowiada strukturze kierowania.","zr":"ZODR 2013","str":13},{"t":"Zadania dla podmiotów współdziałających ustal z ich uprawnionym przedstawicielem (kompetencje, możliwości, gotowość).","zr":"ZODR 2013","str":14}]},{"etykieta":"Zakończenie","punkty":[{"t":"O czasie i formie zakończenia decyduje KDR; kierowanie ustaje po przekazaniu poszkodowanych ZRM i pisemnym przekazaniu terenu.","zr":"ZODR 2013","str":14},{"t":"Brak osoby przejmującej lub odmowa przejęcia — zgłoś to do SK.","zr":"ZODR 2013","str":14}]}],"tagi_wspolne":["organizacja dzialan","dzialania ratownicze"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zodr-2013","strona":4,"sekcja":"Zasady ogólne (s. 4–8), działania ratownicze (s. 8–14), zakończenie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Cel główny w kolejności: ludzie, zwierzęta, środowisko, mienie — osiągalny siłami na terenie akcji. W rozpoznaniu załóż wystąpienie zagrożenia i dobierz do tego ochronę indywidualną. Przejęcie kierowania poprzedź zapoznaniem z oceną sytuacji, zamiarem i siłami; zgłoś je do SK PSP. Zawsze uwzględniaj najbardziej niekorzystny rozwój sytuacji.\n2. PARAMETRY: Rozpiętość kierowania — KDR-owi nie powinno podlegać bezpośrednio więcej niż 8 dowódców niższego poziomu; Kierowanie — jednoosobowe; poziom interwencyjny, taktyczny lub strategiczny; Odwód — wielkość i rodzaj sił, dowódca, miejsce koncentracji, łączność i alarmowanie\n3. UPRAWNIENIA KDR (PKT 11): Ewakuacja ludzi (panika, możliwe odcięcie drogi ewakuacji) i mienia; zakaz przebywania osób postronnych. Prace wyburzeniowe i rozbiórkowe; wstrzymanie ruchu lądowego. Przyjęcie w użytkowanie pojazdów, sprzętu, ujęć wody, środków gaśniczych, nieruchomości — z wyjątkiem misji dyplomatycznych i urzędów konsularnych. Odstąpienie od zasad uznanych za bezpieczne, z dostępnymi zabezpieczeniami, gdy istnieje prawdopodobieństwo uratowania życia (sprzęt zastępczy, siła ratownika, ochotnik). Uprawnienia ograniczone do stanu wyższej konieczności (art. 26 KK); zarządzenia mogą mieć rygor natychmiastowej wykonalności.\n4. PROWADZENIE DZIAŁAŃ: Wstępna koncepcja możliwa w czasie dojazdu; dane ze zgłoszenia zweryfikuj na miejscu. Rozpoznanie jest ciągłe przez całą akcję — przechodzi w monitorowanie sytuacji. Po rozpoznaniu, ocenie i wyborze celu KDR określa zamiar taktyczny i przekazuje go rozkazem bojowym. Działania prowadź nieprzerwanie do osiągnięcia celów; brak możliwości kierowania = przejęcie przez inną uprawnioną osobę.\n5. ORGANIZACJA TERENU AKCJI: Wyznacz strefę zagrożenia i obszar, w którym ratownicy mogą przebywać bez dodatkowej ochrony. Odcinki bojowe i sztab wg rozporządzenia KSRG; struktura łączności odpowiada strukturze kierowania. Zadania dla podmiotów współdziałających ustal z ich uprawnionym przedstawicielem (kompetencje, możliwości, gotowość).\n6. ZAKOŃCZENIE: O czasie i formie zakończenia decyduje KDR; kierowanie ustaje po przekazaniu poszkodowanych ZRM i pisemnym przekazaniu terenu. Brak osoby przejmującej lub odmowa przejęcia — zgłoś to do SK."},{"id":"POZ-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"pozar samochodu elektrycznego","keywords":["pozar ev","pozar baterii","plonie elektryk","dym z baterii","thermal runaway","zaplon baterii trakcyjnej","samochod elektryczny sie pali","pozar auta elektrycznego","samochod elektryczny pozar","pozar tesli","pozar baterii trakcyjnej","thermal runaway ev"],"aliasy":["pozar ev","pozar baterii","plonie elektryk","dym z baterii","thermal runaway","zaplon baterii trakcyjnej","samochod elektryczny sie pali","pozar auta elektrycznego","samochod elektryczny pozar","pozar tesli","pozar baterii trakcyjnej","thermal runaway ev"],"prefix":"Pożar samochodu elektrycznego lub hybrydowego — karta Z2 SZP KG PSP (2023).","najpierw":[{"t":"Ustaw sprzęt i działaj od strony nawietrznej; wyznacz strefę zagrożenia.","zr":"SZP EV","str":11},{"t":"SOI: aparat oddechowy, kompletne ubranie specjalne, kominiarka, rękawice, hełm, buty.","zr":"SZP EV","str":11},{"t":"Ewakuuj osoby ze strefy przy bezpośrednim zagrożeniu życia lub zdrowia.","zr":"SZP EV","str":11},{"t":"Gaś wodą (małe pożary: woda lub gaśnice ABC / AB); widoczny pożar akumulatora — woda bezpośrednio na akumulator.","zr":"SZP EV","str":11}],"parametry":[{"nazwa":"Prąd rozproszony (PWT Ø52 Turbo)","wartosc":"kąt ≥ 30°, odległość ≥ 1 m od elementów pod napięciem","zr":"SZP EV","str":11},{"nazwa":"Prąd zwarty (PWT Ø52 Turbo)","wartosc":"≤ 250 l/min: ≥ 5 m · > 250 l/min: ≥ 10 m","zr":"SZP EV","str":11},{"nazwa":"Chłodzenie akumulatora","wartosc":"> 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; kontrola 30 min","zr":"SZP EV","str":12},{"nazwa":"Czas chłodzenia","wartosc":"kilka–kilkanaście godzin (średnio ok. 7 h); nawrót nawet po 20 h","zr":"SZP EV","str":12}],"sekcje":[{"etykieta":"Oznaki zapalenia akumulatora (thermal runaway)","punkty":[{"t":"Syczenie, gwizd, wybuch fizyczny; ciemny aerozol pod ciśnieniem; jasny palny gaz rozkładowy; płomienie 3–5 m.","zr":"SZP EV","str":11},{"t":"Uwolnienia spodziewane od spodu pojazdu (płyta podłogowa) i we wnętrzu (kokpit, bagażnik).","zr":"SZP EV","str":11}]},{"etykieta":"Działania","punkty":[{"t":"W pomieszczeniach zamkniętych użyj wentylatora osiowego i podchodź od jego strony.","zr":"SZP EV","str":11},{"t":"Po ugaszeniu wnętrza sprawdź, czy akumulator nie przechodzi w niestabilność termiczną — pomiary na obudowie przez 30 min.","zr":"SZP EV","str":12},{"t":"Przy pożarze akumulatora zapewnij znacznie więcej wody niż przy aucie spalinowym; otwory w obudowie wykorzystaj do podania wody z bezpiecznej odległości.","zr":"SZP EV","str":12},{"t":"Kontroluj atmosferę czujnikiem wielogazowym (wodór, tlenek węgla).","zr":"SZP EV","str":12},{"t":"Po ugaszeniu: dezaktywacja (jeśli możliwa) i kontrola obudowy akumulatora.","zr":"SZP EV","str":12}]},{"etykieta":"Kontener","punkty":[{"t":"Zatapianie w kontenerze tylko, gdy inne techniki zawiodą; woda najwyżej do górnej krawędzi akumulatora; rozważ suchą kwarantannę.","zr":"SZP EV","str":12},{"t":"Po zalaniu wodą zadysponuj SGRChem (poziom B) do pobrania próbek.","zr":"SZP EV","str":12}]},{"etykieta":"Przekazanie","punkty":[{"t":"Po pożarze akumulatora: duże ryzyko nawrotu — dozór, ≥ 5 m od pojazdów i budynków, wentylacja, ochrona przed elektrolitem, utylizacja akumulatora.","zr":"SZP EV","str":14}]}],"nie_rob":[{"t":"Nie stosuj piany ciężkiej, średniej ani lekkiej — chyba że wymaga tego np. rozlewisko paliwa.","zr":"SZP EV","str":11},{"t":"Nie ingeruj w strukturę akumulatora — grozi porażeniem.","zr":"SZP EV","str":12},{"t":"Nie zatapiaj pojazdu prewencyjnie.","zr":"SZP EV","str":12}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","pozar"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":11,"sekcja":"Karta Z2 — pożar (s. 11–12), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ustaw sprzęt i działaj od strony nawietrznej; wyznacz strefę zagrożenia. SOI: aparat oddechowy, kompletne ubranie specjalne, kominiarka, rękawice, hełm, buty. Ewakuuj osoby ze strefy przy bezpośrednim zagrożeniu życia lub zdrowia. Gaś wodą (małe pożary: woda lub gaśnice ABC / AB); widoczny pożar akumulatora — woda bezpośrednio na akumulator.\n2. PARAMETRY: Prąd rozproszony (PWT Ø52 Turbo) — kąt ≥ 30°, odległość ≥ 1 m od elementów pod napięciem; Prąd zwarty (PWT Ø52 Turbo) — ≤ 250 l/min: ≥ 5 m · > 250 l/min: ≥ 10 m; Chłodzenie akumulatora — > 50°C lub rośnie: woda 10 min → przerwa 3 min → pomiar; kontrola 30 min; Czas chłodzenia — kilka–kilkanaście godzin (średnio ok. 7 h); nawrót nawet po 20 h\n3. OZNAKI ZAPALENIA AKUMULATORA (THERMAL RUNAWAY): Syczenie, gwizd, wybuch fizyczny; ciemny aerozol pod ciśnieniem; jasny palny gaz rozkładowy; płomienie 3–5 m. Uwolnienia spodziewane od spodu pojazdu (płyta podłogowa) i we wnętrzu (kokpit, bagażnik).\n4. DZIAŁANIA: W pomieszczeniach zamkniętych użyj wentylatora osiowego i podchodź od jego strony. Po ugaszeniu wnętrza sprawdź, czy akumulator nie przechodzi w niestabilność termiczną — pomiary na obudowie przez 30 min. Przy pożarze akumulatora zapewnij znacznie więcej wody niż przy aucie spalinowym; otwory w obudowie wykorzystaj do podania wody z bezpiecznej odległości. Kontroluj atmosferę czujnikiem wielogazowym (wodór, tlenek węgla). Po ugaszeniu: dezaktywacja (jeśli możliwa) i kontrola obudowy akumulatora.\n5. KONTENER: Zatapianie w kontenerze tylko, gdy inne techniki zawiodą; woda najwyżej do górnej krawędzi akumulatora; rozważ suchą kwarantannę. Po zalaniu wodą zadysponuj SGRChem (poziom B) do pobrania próbek.\n6. PRZEKAZANIE: Po pożarze akumulatora: duże ryzyko nawrotu — dozór, ≥ 5 m od pojazdów i budynków, wentylacja, ochrona przed elektrolitem, utylizacja akumulatora.\n7. NIE RÓB: Nie stosuj piany ciężkiej, średniej ani lekkiej — chyba że wymaga tego np. rozlewisko paliwa. Nie ingeruj w strukturę akumulatora — grozi porażeniem. Nie zatapiaj pojazdu prewencyjnie."},{"id":"KARTA-PTASIA-GRYPA-INFORMACJE-I-ZASADY","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ptasia grypa informacje i zasady","keywords":["ptasia grypa informacje","ptasia grypa zasady bezpieczenstwa","informacje o ptasiej grypie","zasady bezpieczenstwa ptasia grypa","grypa ptakow","zjadliwa grypa ptakow","grypa ptakow mswia","wsparcie inspekcji weterynaryjnej"],"aliasy":["ptasia grypa informacje","ptasia grypa zasady bezpieczenstwa","informacje o ptasiej grypie","zasady bezpieczenstwa ptasia grypa","grypa ptakow","zjadliwa grypa ptakow","grypa ptakow mswia","wsparcie inspekcji weterynaryjnej"],"prefix":"Grypa ptaków (HPAI) — ryzyko, kogo nie kierować do działań, zasady higieny (GIS 2025; zasady PSP z wytycznych GIS MSWiA 2017).","najpierw":[{"t":"Nie kieruj do działań strażaków z gorączką, objawami infekcji dróg oddechowych lub bólami mięśni.","zr":"GIS MSWiA 2017","str":2},{"t":"Poinformuj każdego kierowanego do ogniska, że objawy musi zgłosić przełożonemu.","zr":"GIS MSWiA 2017","str":2},{"t":"Przy wsparciu Inspekcji Weterynaryjnej stosuj zasady PSP „BIOHAZARD” (KG PSP, 14.01.2015).","zr":"GIS MSWiA 2017","str":2}],"parametry":[{"nazwa":"Ryzyko — populacja ogólna","wartosc":"niskie","zr":"GIS 2025","str":1},{"nazwa":"Ryzyko — kontakt z chorymi lub martwymi zwierzętami","wartosc":"niskie do umiarkowanego","zr":"GIS 2025","str":1},{"nazwa":"Zakażenie przez","wartosc":"kontakt ze zwierzętami, wydalinami i skażonymi powierzchniami, bioaerozol","zr":"GIS 2025","str":2}],"sekcje":[{"etykieta":"Higiena","punkty":[{"t":"Często i dokładnie myj ręce; nie dotykaj oczu, ust i nosa.","zr":"GIS 2025","str":2},{"t":"Środek do dezynfekcji rąk: co najmniej 60% alkoholu.","zr":"GIS 2025","str":2},{"t":"Odzież robocza oddzielnie od prywatnej; nie wchodź w zabrudzonej odzieży do pomieszczeń socjalnych.","zr":"GIS 2025","str":2},{"t":"Nie przechowuj jedzenia, telefonu ani rzeczy osobistych w miejscach potencjalnie skażonych.","zr":"GIS 2025","str":2}]},{"etykieta":"Kto jest narażony","punkty":[{"t":"M.in. służby podejmujące martwe dzikie ptaki ze zbiorników wodnych oraz służby zwalczające ogniska grypy ptaków.","zr":"GIS 2025","str":1},{"t":"Ryzyko zależy od rodzaju i czasu narażenia oraz konsekwentnego stosowania środków ochrony indywidualnej.","zr":"GIS 2025","str":1}]}],"wsparcie":[{"t":"Szczepienie przeciw grypie sezonowej — zalecane dla osób narażonych; zmniejsza ryzyko ciężkiego przebiegu i reasortacji wirusów.","zr":"GIS 2025","str":5}],"tagi_wspolne":["ptasia grypa","h5n8","informacje","zasady bezpieczenstwa"],"dokumenty_zrodlowe":[{"dokument_id":"doc-hpai-gis-2025","strona":1,"sekcja":"GIS 2025 — ryzyko, osoby narażone, higiena (s. 1–2), szczepienia (s. 5)"},{"dokument_id":"doc-ptasia-grypa-h5n8","strona":2,"sekcja":"GIS MSWiA 2017 — zasady PSP, BIOHAZARD (s. 2–3)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Nie kieruj do działań strażaków z gorączką, objawami infekcji dróg oddechowych lub bólami mięśni. Poinformuj każdego kierowanego do ogniska, że objawy musi zgłosić przełożonemu. Przy wsparciu Inspekcji Weterynaryjnej stosuj zasady PSP „BIOHAZARD” (KG PSP, 14.01.2015).\n2. PARAMETRY: Ryzyko — populacja ogólna — niskie; Ryzyko — kontakt z chorymi lub martwymi zwierzętami — niskie do umiarkowanego; Zakażenie przez — kontakt ze zwierzętami, wydalinami i skażonymi powierzchniami, bioaerozol\n3. HIGIENA: Często i dokładnie myj ręce; nie dotykaj oczu, ust i nosa. Środek do dezynfekcji rąk: co najmniej 60% alkoholu. Odzież robocza oddzielnie od prywatnej; nie wchodź w zabrudzonej odzieży do pomieszczeń socjalnych. Nie przechowuj jedzenia, telefonu ani rzeczy osobistych w miejscach potencjalnie skażonych.\n4. KTO JEST NARAŻONY: M.in. służby podejmujące martwe dzikie ptaki ze zbiorników wodnych oraz służby zwalczające ogniska grypy ptaków. Ryzyko zależy od rodzaju i czasu narażenia oraz konsekwentnego stosowania środków ochrony indywidualnej.\n5. WEZWIJ WSPARCIE, GDY: Szczepienie przeciw grypie sezonowej — zalecane dla osób narażonych; zmniejsza ryzyko ciężkiego przebiegu i reasortacji wirusów."},{"id":"KARTA-PTASIA-GRYPA-NADZOR-EPIDEMIOLOGICZNY","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"nadzor epidemiologiczny ptasia grypa","keywords":["ptasia grypa nadzor","ptasia grypa ekspozycja","ekspozycja na ptasia grype","narazenie na ptasia grype","h5n8 nadzor epidemiologiczny","h5n8 ekspozycja","lista narazonych h5n8","lista funkcjonariuszy narazonych","monitorowanie 10 dni ptasia grypa","obserwacja 10 dni h5n8","objawy po kontakcie z ptasia grypa","postepowanie po narazeniu h5n8"],"aliasy":["ptasia grypa nadzor","ptasia grypa ekspozycja","ekspozycja na ptasia grype","narazenie na ptasia grype","h5n8 nadzor epidemiologiczny","h5n8 ekspozycja","lista narazonych h5n8","lista funkcjonariuszy narazonych","monitorowanie 10 dni ptasia grypa","obserwacja 10 dni h5n8","objawy po kontakcie z ptasia grypa","postepowanie po narazeniu h5n8"],"prefix":"Grypa ptaków — nadzór nad strażakami po bezpośrednim narażeniu (lista do PIS MSWiA; obserwacja objawów).","najpierw":[{"t":"Sporządź listę strażaków z dnia działań w ognisku: imię i nazwisko, adres, jednostka PSP, status szczepienia przeciw grypie.","zr":"GIS MSWiA 2017","str":4},{"t":"Komendant powiatowy (miejski) przekazuje listę Państwowemu Inspektorowi Sanitarnemu MSWiA w województwie — do 2 dni od narażenia.","zr":"GIS MSWiA 2017","str":4}],"parametry":[{"nazwa":"Obserwacja zdrowia","wartosc":"10–14 dni po zakończeniu pracy (GIS 2025; wytyczne 2017: 10 dni)","zr":"GIS 2025","str":5}],"sekcje":[{"etykieta":"Objawy — zgłoś się do lekarza","punkty":[{"t":"Gorączka lub stan podgorączkowy, złe samopoczucie, zmęczenie, bóle głowy, mięśni, stawów.","zr":"GIS 2025","str":5},{"t":"Katar, kaszel, ból gardła, zapalenie spojówek, duszność, biegunka, objawy neurologiczne.","zr":"GIS 2025","str":5},{"t":"Przy objawach: lekarz i informacja do Państwowego Inspektora Sanitarnego MSWiA w województwie.","zr":"GIS MSWiA 2017","str":4},{"t":"Zachorowanie zgłoś też przełożonemu.","zr":"GIS 2025","str":5}]}],"tagi_wspolne":["ptasia grypa","h5n8","nadzor epidemiologiczny","narazenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ptasia-grypa-h5n8","strona":4,"sekcja":"GIS MSWiA 2017 — nadzór epidemiologiczny (s. 4)"},{"dokument_id":"doc-hpai-gis-2025","strona":5,"sekcja":"GIS 2025 — obserwacja objawów (s. 5)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Sporządź listę strażaków z dnia działań w ognisku: imię i nazwisko, adres, jednostka PSP, status szczepienia przeciw grypie. Komendant powiatowy (miejski) przekazuje listę Państwowemu Inspektorowi Sanitarnemu MSWiA w województwie — do 2 dni od narażenia.\n2. PARAMETRY: Obserwacja zdrowia — 10–14 dni po zakończeniu pracy (GIS 2025; wytyczne 2017: 10 dni)\n3. OBJAWY — ZGŁOŚ SIĘ DO LEKARZA: Gorączka lub stan podgorączkowy, złe samopoczucie, zmęczenie, bóle głowy, mięśni, stawów. Katar, kaszel, ból gardła, zapalenie spojówek, duszność, biegunka, objawy neurologiczne. Przy objawach: lekarz i informacja do Państwowego Inspektora Sanitarnego MSWiA w województwie. Zachorowanie zgłoś też przełożonemu."},{"id":"KARTA-PTASIA-GRYPA-SOI-I-DEKONTAMINACJA","wzorzec":2,"kategoria":"dzialania","zrodlo":"Wspólne zalecenia GIS, GLW, IMP i CIOP-PIB z 15.04.2025 (ochrona osób narażonych na HPAI); Wytyczne GIS MSWiA dla służb MSWiA, wersja II z 04.01.2017 (zasady PSP)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ptasia grypa dekontaminacja","keywords":["dekontaminacja ptasia grypa","ptasia grypa soi","soi ptasia grypa","srodki ochrony indywidualnej ptasia grypa","ochrona osobista h5n8","h5n8 soi","h5n8 ppe","h5n8 dekontaminacja","ffp3 ptasia grypa","maska pelnotwarzowa ptasia grypa","kombinezon ptasia grypa","rekawice nitrylowe ptasia grypa","kalosze ptasia grypa","dezynfekcja ptasia grypa","dekontaminacja ludzi i sprzetu h5n8","kontakt z zakazonym ptactwem","skazony kurnik"],"aliasy":["dekontaminacja ptasia grypa","ptasia grypa soi","soi ptasia grypa","srodki ochrony indywidualnej ptasia grypa","ochrona osobista h5n8","h5n8 soi","h5n8 ppe","h5n8 dekontaminacja","ffp3 ptasia grypa","maska pelnotwarzowa ptasia grypa","kombinezon ptasia grypa","rekawice nitrylowe ptasia grypa","kalosze ptasia grypa","dezynfekcja ptasia grypa","dekontaminacja ludzi i sprzetu h5n8","kontakt z zakazonym ptactwem","skazony kurnik"],"prefix":"Grypa ptaków (HPAI) — środki ochrony indywidualnej, zdejmowanie i dekontaminacja (GIS 2025; procedury PSP z 2017).","najpierw":[{"t":"Ochrona dróg oddechowych: półmaska FFP2/FFP3 (po teście dopasowania), półmaska z filtrami P2/P3 albo maska pełna z filtrem P3.","zr":"GIS 2025","str":3},{"t":"Gogle szczelne (oznaczenie 3 — krople cieczy); półmaska musi szczelnie współpracować z goglami.","zr":"GIS 2025","str":4},{"t":"Po działaniach obowiązkowo dekontaminacja ludzi i sprzętu według procedur PSP dla czynnika biologicznego.","zr":"GIS MSWiA 2017","str":3}],"parametry":[{"nazwa":"Odzież","wartosc":"kombinezon PN-EN 14126: typ 3-B, 4-B lub 6-B (dobór wg ryzyka)","zr":"GIS 2025","str":3},{"nazwa":"Rękawice","wartosc":"podwójne: zewnętrzne gumowe lub tworzywowe (PN-EN ISO 374-5), wewnętrzne medyczne","zr":"GIS 2025","str":4},{"nazwa":"Obuwie","wartosc":"szczelne, całotworzywowe (PN-EN 13832-3), model C, D lub E","zr":"GIS 2025","str":4},{"nazwa":"Obserwacja po narażeniu","wartosc":"10–14 dni","zr":"GIS 2025","str":5}],"sekcje":[{"etykieta":"Zdejmowanie środków ochrony — kolejno","punkty":[{"t":"1) rękawice zewnętrzne, 2) fartuch i ochraniacze na obuwie, 3) wyczyść i zdezynfekuj obuwie, 4) zdejmij obuwie.","zr":"GIS 2025","str":5},{"t":"5) kombinezon, 6) nakrycie głowy, 7) osłona twarzy i gogle, 8) półmaska lub maska.","zr":"GIS 2025","str":5},{"t":"9) rękawice jednorazowe, 10) umyj lub zdezynfekuj ręce, 11) prysznic po zakończeniu pracy.","zr":"GIS 2025","str":5}]},{"etykieta":"Po zdjęciu","punkty":[{"t":"Sprzęt jednorazowy szczelnie zapakuj i przekaż do utylizacji.","zr":"GIS 2025","str":5},{"t":"Sprzęt wielorazowy wstępnie oczyść i odkaź (np. oprysk środkiem wirusobójczym), szczelnie zapakuj do transportu.","zr":"GIS 2025","str":5},{"t":"Na miejscu zapewnij dezynfekcję bieżącą (opryskiwacz lub pojemnik ze środkiem wirusobójczym).","zr":"GIS 2025","str":5},{"t":"Maskę i kalosze myj i dezynfekuj; kombinezon, filtry i rękawice traktuj jako odpad niebezpieczny.","zr":"GIS MSWiA 2017","str":3}]},{"etykieta":"Środki dezynfekcyjne","punkty":[{"t":"Ręce — alkoholowe preparaty wirusobójcze; ciało i włosy — mydło dezynfekujące do chirurgicznego mycia rąk.","zr":"GIS MSWiA 2017","str":3},{"t":"Powierzchnie odporne na korozję — preparaty z podchlorynem sodu lub wapnia.","zr":"GIS MSWiA 2017","str":3},{"t":"Powierzchnie nieodporne na alkohol — złożone preparaty myjąco-dezynfekujące; możliwe zamgławianie.","zr":"GIS MSWiA 2017","str":4}]}],"nie_rob":[{"t":"Nie zostawiaj na miejscu zużytej odzieży, ochraniaczy, rękawic ani innych użytych przedmiotów.","zr":"GIS 2025","str":5},{"t":"Po założeniu środków ochrony nie dotykaj oczu, ust i nosa.","zr":"GIS 2025","str":2}],"tagi_wspolne":["ptasia grypa","h5n8","dekontaminacja","soi"],"dokumenty_zrodlowe":[{"dokument_id":"doc-hpai-gis-2025","strona":3,"sekcja":"GIS 2025 — środki ochrony (s. 3–4), zdejmowanie i postępowanie (s. 5)"},{"dokument_id":"doc-ptasia-grypa-h5n8","strona":3,"sekcja":"GIS MSWiA 2017 — dekontaminacja i środki dezynfekcyjne (s. 3–4)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Ochrona dróg oddechowych: półmaska FFP2/FFP3 (po teście dopasowania), półmaska z filtrami P2/P3 albo maska pełna z filtrem P3. Gogle szczelne (oznaczenie 3 — krople cieczy); półmaska musi szczelnie współpracować z goglami. Po działaniach obowiązkowo dekontaminacja ludzi i sprzętu według procedur PSP dla czynnika biologicznego.\n2. PARAMETRY: Odzież — kombinezon PN-EN 14126: typ 3-B, 4-B lub 6-B (dobór wg ryzyka); Rękawice — podwójne: zewnętrzne gumowe lub tworzywowe (PN-EN ISO 374-5), wewnętrzne medyczne; Obuwie — szczelne, całotworzywowe (PN-EN 13832-3), model C, D lub E; Obserwacja po narażeniu — 10–14 dni\n3. ZDEJMOWANIE ŚRODKÓW OCHRONY — KOLEJNO: 1) rękawice zewnętrzne, 2) fartuch i ochraniacze na obuwie, 3) wyczyść i zdezynfekuj obuwie, 4) zdejmij obuwie. 5) kombinezon, 6) nakrycie głowy, 7) osłona twarzy i gogle, 8) półmaska lub maska. 9) rękawice jednorazowe, 10) umyj lub zdezynfekuj ręce, 11) prysznic po zakończeniu pracy.\n4. PO ZDJĘCIU: Sprzęt jednorazowy szczelnie zapakuj i przekaż do utylizacji. Sprzęt wielorazowy wstępnie oczyść i odkaź (np. oprysk środkiem wirusobójczym), szczelnie zapakuj do transportu. Na miejscu zapewnij dezynfekcję bieżącą (opryskiwacz lub pojemnik ze środkiem wirusobójczym). Maskę i kalosze myj i dezynfekuj; kombinezon, filtry i rękawice traktuj jako odpad niebezpieczny.\n5. ŚRODKI DEZYNFEKCYJNE: Ręce — alkoholowe preparaty wirusobójcze; ciało i włosy — mydło dezynfekujące do chirurgicznego mycia rąk. Powierzchnie odporne na korozję — preparaty z podchlorynem sodu lub wapnia. Powierzchnie nieodporne na alkohol — złożone preparaty myjąco-dezynfekujące; możliwe zamgławianie.\n6. NIE RÓB: Nie zostawiaj na miejscu zużytej odzieży, ochraniaczy, rękawic ani innych użytych przedmiotów. Po założeniu środków ochrony nie dotykaj oczu, ust i nosa."},{"id":"KARTA-RT-ZAKRES-PODSTAWOWY","wzorzec":2,"kategoria":"dzialania","grupa":"rt","zakres":"podstawowy","zrodlo":"KG PSP: Zasady organizacji ratownictwa technicznego w krajowym systemie ratowniczo-gaśniczym, Warszawa, wrzesień 2026 r.","data_aktualizacji":"2026-10-25","slowo_kluczowe":"ratownictwo techniczne zakres podstawowy","keywords":["zakres podstawowy ratownictwo techniczne","co robi zastęp ratownictwo techniczne","uwolnienie uwięzionego","osoba uwięziona","stabilizacja i cięcie konstrukcji","rozpieranie podnoszenie konstrukcji","miejscowe zagrożenie techniczne","kiedy wezwać sgrt","rt zakres podstawowy"],"aliasy":["zakres podstawowy ratownictwo techniczne","co robi zastęp ratownictwo techniczne","uwolnienie uwięzionego","osoba uwięziona","stabilizacja i cięcie konstrukcji","rozpieranie podnoszenie konstrukcji","miejscowe zagrożenie techniczne","kiedy wezwać sgrt","rt zakres podstawowy"],"prefix":"Ratownictwo techniczne — zakres podstawowy zastępów KSRG (Zasady KG PSP, 2026).","najpierw":[{"t":"Rozpoznaj i oceń zagrożenie dla ludzi, zwierząt, środowiska i mienia — życie ludzi to priorytet.","str":8},{"t":"Dotrzyj do uwięzionych, udziel KPP i przekaż poszkodowanych ZRM poza strefą zagrożenia.","str":8},{"t":"Zapewnij asekurację ratowników w strefie zagrożenia i w jej sąsiedztwie.","str":8},{"t":"Ewakuuj ludzi z miejsc zagrożenia życia i zdrowia.","str":8}],"parametry":[{"nazwa":"Gotowość","wartosc":"min. 1 zastęp · 6 ratowników","str":8},{"nazwa":"Strefa zagrożenia","wartosc":"Zasady nie podają wymiarów — wyznacz z rozpoznania","str":6},{"nazwa":"Wsparcie SGRT","wartosc":"A holownik · B rotator · C żuraw samojezdny","str":11}],"sekcje":[{"etykieta":"Działania techniczne","punkty":[{"t":"Stabilizuj, tnij, rozpieraj, podnoś lub przemieszczaj konstrukcje, instalacje, urządzenia i przeszkody — w ramach posiadanego wyposażenia.","str":8},{"t":"Ewakuuj zwierzęta i mienie.","str":8},{"t":"Współdziałaj z podmiotami KSRG i innymi podmiotami zdolnymi do ratownictwa technicznego.","str":8}]},{"etykieta":"Bezpieczeństwo","punkty":[{"t":"KDR stosuje rozporządzenie MSWiA w sprawie warunków BHP strażaków PSP.","str":21},{"t":"Odzież specjalna, SOI i wyposażenie osobiste stosownie do czynności.","str":21},{"t":"Urządzenia obsługują tylko osoby z wymaganymi uprawnieniami (m.in. UDT, hakowy).","str":21},{"t":"W zależności od przebiegu akcji rozważ zabezpieczenie medyczne.","str":21}]}],"wsparcie":[{"t":"Zadanie przekracza sprzęt lub uprawnienia zastępu — zgłoś SK PSP potrzebę SGRT.","str":21}],"nie_rob":[{"t":"Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów.","str":21},{"t":"Nie dopuszczaj do obsługi urządzeń osób bez uprawnień.","str":21},{"t":"Nie pracuj w strefie zagrożenia bez asekuracji.","str":8}],"tagi_wspolne":["ratownictwo techniczne","zakres podstawowy","miejscowe zagrożenie","SGRT"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rt-zasady-2026","strona":8,"sekcja":"Rozdział 2 — zakres podstawowy (ust. 2.1–2.5); Rozdział 6.1 — bezpieczeństwo (s. 21); def. strefy zagrożenia (s. 6)"}],"content":"1. NAJPIERW: Rozpoznaj i oceń zagrożenie dla ludzi, zwierząt, środowiska i mienia — życie ludzi to priorytet. Dotrzyj do uwięzionych, udziel KPP i przekaż poszkodowanych ZRM poza strefą zagrożenia. Zapewnij asekurację ratowników w strefie zagrożenia i w jej sąsiedztwie. Ewakuuj ludzi z miejsc zagrożenia życia i zdrowia.\n2. PARAMETRY: Gotowość — min. 1 zastęp · 6 ratowników; Strefa zagrożenia — Zasady nie podają wymiarów — wyznacz z rozpoznania; Wsparcie SGRT — A holownik · B rotator · C żuraw samojezdny\n3. DZIAŁANIA TECHNICZNE: Stabilizuj, tnij, rozpieraj, podnoś lub przemieszczaj konstrukcje, instalacje, urządzenia i przeszkody — w ramach posiadanego wyposażenia. Ewakuuj zwierzęta i mienie. Współdziałaj z podmiotami KSRG i innymi podmiotami zdolnymi do ratownictwa technicznego.\n4. BEZPIECZEŃSTWO: KDR stosuje rozporządzenie MSWiA w sprawie warunków BHP strażaków PSP. Odzież specjalna, SOI i wyposażenie osobiste stosownie do czynności. Urządzenia obsługują tylko osoby z wymaganymi uprawnieniami (m.in. UDT, hakowy). W zależności od przebiegu akcji rozważ zabezpieczenie medyczne.\n5. WEZWIJ WSPARCIE, GDY: Zadanie przekracza sprzęt lub uprawnienia zastępu — zgłoś SK PSP potrzebę SGRT.\n6. NIE RÓB: Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów. Nie dopuszczaj do obsługi urządzeń osób bez uprawnień. Nie pracuj w strefie zagrożenia bez asekuracji."},{"id":"KARTA-RT-WSPOLPRACA-KDR-SGRT","wzorzec":2,"kategoria":"organizacja","grupa":"rt","zakres":"specjalistyczny","zrodlo":"KG PSP: Zasady organizacji ratownictwa technicznego w krajowym systemie ratowniczo-gaśniczym, Warszawa, wrzesień 2026 r.","data_aktualizacji":"2026-10-25","slowo_kluczowe":"współpraca kdr z sgrt","keywords":["grupa ratownictwa technicznego","dysponowanie sgrt","wezwij sgrt","holownik psp","rotator","żuraw samojezdny psp","poziom a b c sgrt","dowódca działań sgrt","ciężki sprzęt ratownictwo techniczne"],"aliasy":["grupa ratownictwa technicznego","dysponowanie sgrt","wezwij sgrt","holownik psp","rotator","żuraw samojezdny psp","poziom a b c sgrt","dowódca działań sgrt","ciężki sprzęt ratownictwo techniczne"],"prefix":"Współpraca KDR ze specjalistyczną grupą ratownictwa technicznego (SGRT) — Zasady KG PSP 2026.","najpierw":[{"t":"Gdy zadanie przekracza sprzęt lub uprawnienia zakresu podstawowego — zgłoś stanowisku kierowania PSP potrzebę SGRT.","str":21},{"t":"Zorganizuj punkt przyjęcia sił i środków.","str":22},{"t":"Przekaż dowódcy działań SGRT swoją ocenę sytuacji i dokumentację.","str":22},{"t":"Wydziel odcinek bojowy dla SGRT — jego dowódcą jest dowódca działań SGRT.","str":22},{"t":"Zapewnij kanał dowodzenia i współdziałania oraz osobny kanał ratowniczo-gaśniczy dla SGRT.","str":22}],"parametry":[{"nazwa":"Poziom A","wartosc":"holownik · min. 6 ratowników · 2 pojazdy","str":11},{"nazwa":"Poziom B","wartosc":"rotator · min. 6 ratowników · 2 pojazdy","str":11},{"nazwa":"Poziom C","wartosc":"żuraw samojezdny · min. 3 ratowników · 2 pojazdy","str":11},{"nazwa":"Dysponuje","wartosc":"powiat: SK KP/KM PSP · poza powiat: SK KW PSP · poza województwo: SK KG PSP","str":21}],"sekcje":[{"etykieta":"Zadania KDR","punkty":[{"t":"Przejmij kierowanie działaniem ratowniczym.","str":22},{"t":"W razie potrzeby powołaj sztab akcji.","str":22},{"t":"Zapewnij współpracę ze specjalistami z planu ratowniczego powiatu lub województwa.","str":22},{"t":"Rozwiń zaplecze logistyczne akcji.","str":22},{"t":"Przy dwóch lub więcej SGRT to Ty organizujesz teren działań i decydujesz o liczbie odcinków bojowych.","str":23},{"t":"Koordynuj czynności podstawowe i specjalistyczne z innymi podmiotami i służbami na miejscu zdarzenia.","str":23}]},{"etykieta":"Co robi SGRT (poziom A i B)","punkty":[{"t":"Wszystkie zadania zakresu podstawowego oraz rozpoznanie i identyfikację zagrożenia.","str":12},{"t":"Wyznacza i oznakowuje strefę zagrożenia.","str":12},{"t":"Włącza lub wyłącza instalacje, urządzenia i media wpływające na bezpieczeństwo — zaworami i bezpiecznikami instalacji obiektu.","str":12},{"t":"Priorytetowo wykonuje dostęp do poszkodowanych, KPP lub ewakuację oraz drogi ewakuacji.","str":12},{"t":"Stabilizuje, tnie, rozpiera, podnosi i przenosi konstrukcje, urządzenia i przeszkody.","str":12},{"t":"Oświetla i zabezpiecza miejsce zdarzenia; ocenia rozmiar zagrożenia i prognozuje jego rozwój.","str":12},{"t":"Poziom C wspiera grupy A i B dodatkowym sprzętem, w szczególności żurawiem samojezdnym.","str":12}]},{"etykieta":"Dowodzenie na odcinku SGRT","punkty":[{"t":"Dowódca działań SGRT odpowiada za zadanie, które mu powierzysz.","str":22},{"t":"Dowódca działań SGRT decyduje o technikach, zakresie działań, użyciu sprzętu grupy i zadaniach jej członków.","str":23},{"t":"Po przybyciu ocenia: rodzaj zagrożenia i wyniki rozpoznania, zabezpieczenie miejsca, KPP i ewakuację poszkodowanych, potrzebne siły i środki, sposób dotarcia.","str":22},{"t":"Udział podmiotów spoza KSRG (np. firmy z ciężkim sprzętem) — tylko w porozumieniu z dowódcą działań SGRT; on nadzoruje bezpieczeństwo tych osób.","str":23},{"t":"Zabezpieczenie medyczne: gotowość do podjęcia medycznych działań ratowniczych.","str":23}]},{"etykieta":"Zakończenie","punkty":[{"t":"Decyzję o zakończeniu podejmuje KDR — dopiero po likwidacji bezpośredniego zagrożenia.","str":23},{"t":"Teren, obiekt lub mienie przekaż na podstawie „Potwierdzenia przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.","str":23}]}],"wsparcie":[{"t":"Dowódca działań SGRT wnioskuje o powiększenie składu lub kolejną grupę.","str":22},{"t":"Ratujesz życie — przy dysponowaniu uwzględnij najszybszy transport grupy.","str":22},{"t":"Przebieg akcji tego wymaga — rozważ zabezpieczenie medyczne działań.","str":21}],"nie_rob":[{"t":"Nie używaj sprzętu niekompletnego, niesprawnego lub bez aktualnych dopuszczeń i przeglądów.","str":21},{"t":"Nie dopuszczaj do obsługi urządzeń osób bez uprawnień wymaganych przepisami o dozorze technicznym.","str":21},{"t":"Nie kończ działań SGRT przed likwidacją bezpośredniego zagrożenia.","str":23}],"tagi_wspolne":["ratownictwo techniczne","zakres specjalistyczny","SGRT","organizacja działań"],"dokumenty_zrodlowe":[{"dokument_id":"doc-rt-zasady-2026","strona":21,"sekcja":"Rozdział 3 (s. 11–12) i Rozdział 6 (s. 21–23)"}],"content":"1. NAJPIERW: Gdy zadanie przekracza sprzęt lub uprawnienia zakresu podstawowego — zgłoś stanowisku kierowania PSP potrzebę SGRT. Zorganizuj punkt przyjęcia sił i środków. Przekaż dowódcy działań SGRT swoją ocenę sytuacji i dokumentację. Wydziel odcinek bojowy dla SGRT — jego dowódcą jest dowódca działań SGRT. Zapewnij kanał dowodzenia i współdziałania oraz osobny kanał ratowniczo-gaśniczy dla SGRT.\n2. PARAMETRY: Poziom A — holownik · min. 6 ratowników · 2 pojazdy; Poziom B — rotator · min. 6 ratowników · 2 pojazdy; Poziom C — żuraw samojezdny · min. 3 ratowników · 2 pojazdy; Dysponuje — powiat: SK KP/KM PSP · poza powiat: SK KW PSP · poza województwo: SK KG PSP\n3. ZADANIA KDR: Przejmij kierowanie działaniem ratowniczym. W razie potrzeby powołaj sztab akcji. Zapewnij współpracę ze specjalistami z planu ratowniczego powiatu lub województwa. Rozwiń zaplecze logistyczne akcji. Przy dwóch lub więcej SGRT to Ty organizujesz teren działań i de
