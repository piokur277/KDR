ha mimo udrożnienia dróg oddechowych; Dzieci 1–8 lat — JumpSTART; dziecko < 1 roku z obrażeniami: zielony → żółty; CBRNE — segregacja SIEVE\n3. SEGREGACJA: Cel: uratować jak największą liczbę poszkodowanych. W segregacji wstępnej wykonuj tylko czynności ratujące życie: udrożnienie dróg oddechowych, pozycja boczna bezpieczna, zatamowanie krwotoku. Brak tętna na tętnicy promieniowej — zatamuj krwotok i oznacz jako I. U małych dzieci ocena chodzenia jest zawodna; nawrót kapilarny oceniaj na mostku lub czole. Segregację wtórną (pełne badanie, kolejność transportu) prowadzi najbardziej doświadczony personel medyczny.\n4. WSPÓŁPRACA Z KAM: Po przybyciu pierwszego ZRM koordynację medyczną przejmuje KAM; jego dane i sposób łączności przekazuje Ci SK PSP. KAM organizuje segregację medyczną, punkt lub obszar pomocy medycznej i transport pacjentów. KMDR z ratownikami KSRG działa w strefach zagrożenia dla ZRM i przekazuje informację o wykonaniu dostępu do poszkodowanych. Wymieniaj z KAM informacje o zagrożeniach, czasie wykonania dostępu i konieczności wycofania ZRM ze strefy.\n5. TRANSPORT I ZAKOŃCZENIE: Sprzętem KSRG przemieszczaj poszkodowanych tylko do miejsca, gdzie PRM może podjąć czynności. Transport sprzętem KSRG w stanie wyższej konieczności — decyduje wyłącznie KDR; powiadom SK i wpisz uzasadnienie w informacji ze zdarzenia. Sprzęt przekazany z poszkodowanym uzupełnij na miejscu „sztuka za sztukę”.\n6. WEZWIJ WSPARCIE, GDY: Potrzebujesz dodatkowych sił — przekaż to przez SDM do SK KP/KM PSP albo do dyspozytora medycznego. Mobilna baza sprzętu medycznego — wnioskuj przez SK PSP w porozumieniu z KAM. Grupa Ratownictwa Medycznego (GRMed) — na wniosek KDR przez SK KW PSP. Na miejscu są pojazdy elektryczne lub hybrydowe — równolegle zastosuj karty „Wypadek pojazdu elektrycznego po kolizji drogowej” i „Dezaktywacja awaryjna pojazdu elektrycznego”.\n7. NIE RÓB: Nie dopuść do niekontrolowanej ewakuacji poszkodowanych — nie przenoś katastrofy do szpitala."},{"id":"ZAT-EV-01","wzorzec":2,"zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń z samochodami z napędem elektrycznym oraz hybrydowym, wydanie drugie, maj 2023","data_aktualizacji":"2026-10-27","slowo_kluczowe":"zatopienie samochodu elektrycznego","keywords":["zatopienie ev","elektryk w wodzie","zalany samochod elektryczny","pojazd ev w rzece","auto elektryczne w wodzie","podtopiony elektryk","zalany pojazd elektryczny","samochod elektryczny w wodzie"],"aliasy":["zatopienie ev","elektryk w wodzie","zalany samochod elektryczny","pojazd ev w rzece","auto elektryczne w wodzie","podtopiony elektryk","zalany pojazd elektryczny","samochod elektryczny w wodzie"],"prefix":"Samochód elektryczny lub hybrydowy zatopiony w wodzie — karta Z3 SZP KG PSP (2023).","najpierw":[{"t":"Postępuj jak przy standardowym samochodzie spalinowym.","zr":"SZP EV","str":13},{"t":"Zatopiony samochód elektryczny nie stwarza zagrożenia porażenia prądem ani zwiększonego zanieczyszczenia wody.","zr":"SZP EV","str":13},{"t":"Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast; gdy ewakuacja niemożliwa — wyciągnij samochód z osobami.","zr":"SZP EV","str":13}],"parametry":[{"nazwa":"Oznaka zwarcia akumulatora","wartosc":"parowanie wody","zr":"SZP EV","str":13}],"sekcje":[{"etykieta":"Działania","punkty":[{"t":"Zabezpiecz wycieki płynów eksploatacyjnych przed rozprzestrzenianiem się na wodzie.","zr":"SZP EV","str":13},{"t":"Przy wydobyciu wyznacz punkty mocowania omijające akumulator i elementy WN.","zr":"SZP EV","str":13}]},{"etykieta":"Po wydobyciu","punkty":[{"t":"Wykonaj dezaktywację i zabezpieczenie (karta „Dezaktywacja”).","zr":"SZP EV","str":13},{"t":"Kontroluj temperaturę akumulatora (kamera termowizyjna, pirometr) i bądź gotowy na pożar akumulatora (karta „Pożar”).","zr":"SZP EV","str":13},{"t":"Przekaż z informacją o dozorze, odstawieniu ≥ 5 m od pojazdów i budynków i bezpiecznym holowaniu modelu.","zr":"SZP EV","str":14}]}],"tagi_wspolne":["pojazd elektryczny","samochod elektryczny","ev","zatopienie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-ev-szp-2023","strona":13,"sekcja":"Karta Z3 — zatopienie (s. 13), przekazanie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Postępuj jak przy standardowym samochodzie spalinowym. Zatopiony samochód elektryczny nie stwarza zagrożenia porażenia prądem ani zwiększonego zanieczyszczenia wody. Poszkodowanych w bezpośrednim zagrożeniu życia ewakuuj natychmiast; gdy ewakuacja niemożliwa — wyciągnij samochód z osobami.\n2. PARAMETRY: Oznaka zwarcia akumulatora — parowanie wody\n3. DZIAŁANIA: Zabezpiecz wycieki płynów eksploatacyjnych przed rozprzestrzenianiem się na wodzie. Przy wydobyciu wyznacz punkty mocowania omijające akumulator i elementy WN.\n4. PO WYDOBYCIU: Wykonaj dezaktywację i zabezpieczenie (karta „Dezaktywacja”). Kontroluj temperaturę akumulatora (kamera termowizyjna, pirometr) i bądź gotowy na pożar akumulatora (karta „Pożar”). Przekaż z informacją o dozorze, odstawieniu ≥ 5 m od pojazdów i budynków i bezpiecznym holowaniu modelu."},{"id":"KARTA-ZA-CEL-ZAKRES-MONITOROWANIA","wzorzec":2,"kategoria":"organizacja","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"zlota alga monitoring","keywords":["prymnesium parvum monitoring","procedura zlota alga","cel procedury zlota alga","zakres procedury zlota alga","zasada metody zlota alga"],"aliasy":["prymnesium parvum monitoring","procedura zlota alga","cel procedury zlota alga","zakres procedury zlota alga","zasada metody zlota alga"],"prefix":"Złota alga — po co i jak GIOŚ prowadzi monitoring interwencyjny (wyd. 4, 2025).","najpierw":[{"t":"Przy pomiarach terenowych i poborze próbek w punktach monitoringu interwencyjnego stosuj maseczkę ochronną i rękawice.","zr":"Proc.","str":5}],"parametry":[{"nazwa":"Odpowiada","wartosc":"GIOŚ: pomiary terenowe, próbki, badania laboratoryjne, analizy i raporty","zr":"Proc.","str":4},{"nazwa":"Ilości zakwitowe","wartosc":"> 10 mln komórek/l","zr":"Proc.","str":6},{"nazwa":"Toksyczność zakwitu","wartosc":"> 50–100 mln komórek/l","zr":"Proc.","str":6}],"sekcje":[{"etykieta":"Cel i zakres","punkty":[{"t":"Cel: wykryć ryzyko zakwitu złotej algi i poinformować właściwe służby.","zr":"Proc.","str":4},{"t":"Procedura określa badane wskaźniki, częstotliwość badań, poziomy alarmowe, postępowanie z próbkami, czasy, odpowiedzialność i drogę informowania służb.","zr":"Proc.","str":4},{"t":"Metody i aparatura — według metod referencyjnych (rozporządzenie MI z 13.07.2021, Dz.U. 2021 poz. 1576) i procedury PB-01/KLRW.","zr":"Proc.","str":4}]},{"etykieta":"Punkty monitoringu","punkty":[{"t":"Punkt może leżeć na rzece, starorzeczu, kanale lub zbiorniku; wyznacza go DMŚ GIOŚ, także na rekomendację Zespołu ds. Odry.","zr":"Proc.","str":5},{"t":"Pierwszorzędne — kluczowe ogniska rozwoju algi i Odra poniżej Kanału Gliwickiego/Kłodnicy.","zr":"Proc.","str":5},{"t":"Drugorzędne — wspomagające; trzeciorzędne (kaskadowe) — uruchamiane po przekroczeniu stopnia ostrzegawczego w punktach 1. i 2. rzędu.","zr":"Proc.","str":5},{"t":"Czwartorzędne — zagrożenie lokalne z wdrożonymi zabezpieczeniami (np. siatki); pięciorzędne — obecność algi tylko podejrzewana.","zr":"Proc.","str":5},{"t":"Wykaz lokalizacji to załącznik nr 4 — aktualizowany osobno przez GIOŚ.","zr":"Proc.","str":5}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","monitoring"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":4,"sekcja":"Proc. pkt 1–5 (s. 4–6)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Przy pomiarach terenowych i poborze próbek w punktach monitoringu interwencyjnego stosuj maseczkę ochronną i rękawice.\n2. PARAMETRY: Odpowiada — GIOŚ: pomiary terenowe, próbki, badania laboratoryjne, analizy i raporty; Ilości zakwitowe — > 10 mln komórek/l; Toksyczność zakwitu — > 50–100 mln komórek/l\n3. CEL I ZAKRES: Cel: wykryć ryzyko zakwitu złotej algi i poinformować właściwe służby. Procedura określa badane wskaźniki, częstotliwość badań, poziomy alarmowe, postępowanie z próbkami, czasy, odpowiedzialność i drogę informowania służb. Metody i aparatura — według metod referencyjnych (rozporządzenie MI z 13.07.2021, Dz.U. 2021 poz. 1576) i procedury PB-01/KLRW.\n4. PUNKTY MONITORINGU: Punkt może leżeć na rzece, starorzeczu, kanale lub zbiorniku; wyznacza go DMŚ GIOŚ, także na rekomendację Zespołu ds. Odry. Pierwszorzędne — kluczowe ogniska rozwoju algi i Odra poniżej Kanału Gliwickiego/Kłodnicy. Drugorzędne — wspomagające; trzeciorzędne (kaskadowe) — uruchamiane po przekroczeniu stopnia ostrzegawczego w punktach 1. i 2. rzędu. Czwartorzędne — zagrożenie lokalne z wdrożonymi zabezpieczeniami (np. siatki); pięciorzędne — obecność algi tylko podejrzewana. Wykaz lokalizacji to załącznik nr 4 — aktualizowany osobno przez GIOŚ."},{"id":"KARTA-ZA-CZYNNIKI-RYZYKA","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"czynniki ryzyka zlota alga","keywords":["zlota alga temperatura","zlota alga ph","zlota alga tlen","zlota alga zasolenie","zlota alga n p","prymnesium parvum ryzyko"],"aliasy":["zlota alga temperatura","zlota alga ph","zlota alga tlen","zlota alga zasolenie","zlota alga n p","prymnesium parvum ryzyko"],"prefix":"Złota alga — warunki sprzyjające zakwitowi i toksyczności (wyd. 4, 2025).","parametry":[{"nazwa":"Temperatura","wartosc":"25–28,8°C przy zasoleniu 20–25 psu; przy niższym zasoleniu optimum spada","zr":"Proc.","str":6},{"nazwa":"Przewodność (20°C)","wartosc":"ryzyko zakwitu > 1350 µS/cm; zakwity notowano już przy ok. 900","zr":"Proc.","str":7},{"nazwa":"Chlorki","wartosc":"228 mg/l Cl — poniżej brak ryzyka; zakwit notowano przy ok. 170","zr":"Proc.","str":8},{"nazwa":"Odczyn pH","wartosc":"> 8,5 wyraźnie wyższa toksyczność; > 8,9 znaczny przyrost algi","zr":"Proc.","str":8},{"nazwa":"Stosunek N:P","wartosc":"12–20: więcej komórek, mniejsza toksyczność; < 3 decyduje o wzroście algi","zr":"Proc.","str":6},{"nazwa":"Fosfor ogólny","wartosc":"> 0,75 mg/l przy maksimach algi, potem alga ulega degradacji","zr":"Proc.","str":7}],"sekcje":[{"etykieta":"Jak czytać wskaźniki","punkty":[{"t":"Niedobór składników odżywczych zwiększa toksyczność — w takich warunkach Prymnesium parvum dominuje.","zr":"Proc.","str":6},{"t":"Wyraźny spadek azotu ogólnego świadczy o rozwoju złotej algi.","zr":"Proc.","str":6},{"t":"Wzrost azotu Kjeldahla prawdopodobnie hamuje rozwój algi — dane wstępne, wymagają potwierdzenia.","zr":"Proc.","str":7},{"t":"Zasolenie (przewodność) jest kluczowym prekursorem toksycznego zakwitu.","zr":"Proc.","str":7},{"t":"Podwyższony tlen rozpuszczony i pH w ciągu dnia mogą wynikać z fotosyntezy podczas zakwitu.","zr":"Proc.","str":8}]}],"nie_rob":[{"t":"Nie oceniaj ryzyka po jednym wskaźniku — o stopniu decyduje liczebność algi, a także zmiana parametrów w czasie.","zr":"Proc.","str":10}],"tagi_wspolne":["zlota alga","prymnesium parvum","czynniki ryzyka"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":6,"sekcja":"Proc. pkt 5.1–5.5 (s. 6–8)"}],"data_przegladu":"2026-10-25","content":"1. PARAMETRY: Temperatura — 25–28,8°C przy zasoleniu 20–25 psu; przy niższym zasoleniu optimum spada; Przewodność (20°C) — ryzyko zakwitu > 1350 µS/cm; zakwity notowano już przy ok. 900; Chlorki — 228 mg/l Cl — poniżej brak ryzyka; zakwit notowano przy ok. 170; Odczyn pH — > 8,5 wyraźnie wyższa toksyczność; > 8,9 znaczny przyrost algi; Stosunek N:P — 12–20: więcej komórek, mniejsza toksyczność; < 3 decyduje o wzroście algi; Fosfor ogólny — > 0,75 mg/l przy maksimach algi, potem alga ulega degradacji\n2. JAK CZYTAĆ WSKAŹNIKI: Niedobór składników odżywczych zwiększa toksyczność — w takich warunkach Prymnesium parvum dominuje. Wyraźny spadek azotu ogólnego świadczy o rozwoju złotej algi. Wzrost azotu Kjeldahla prawdopodobnie hamuje rozwój algi — dane wstępne, wymagają potwierdzenia. Zasolenie (przewodność) jest kluczowym prekursorem toksycznego zakwitu. Podwyższony tlen rozpuszczony i pH w ciągu dnia mogą wynikać z fotosyntezy podczas zakwitu.\n3. NIE RÓB: Nie oceniaj ryzyka po jednym wskaźniku — o stopniu decyduje liczebność algi, a także zmiana parametrów w czasie."},{"id":"KARTA-ZA-POSTEPOWANIE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"postepowanie zlota alga","keywords":["zlota alga etapy","zlota alga postepowanie","prymnesium parvum procedura","zlota alga etap i ii iii","zlota alga informacja na zewnatrz"],"aliasy":["zlota alga etapy","zlota alga postepowanie","prymnesium parvum procedura","zlota alga etap i ii iii","zlota alga informacja na zewnatrz"],"prefix":"Złota alga — etapy monitoringu, czasy i kogo informuje GIOŚ (wyd. 4, 2025).","najpierw":[{"t":"Informację o przypisanym stopniu GIOŚ przekazuje m.in. do właściwego WCZK, WIOŚ, CZK MKiŚ, Wód Polskich, GDOŚ i GIG — w ciągu 1 h od analizy.","zr":"Proc.","str":11}],"parametry":[{"nazwa":"I.1 Pomiary i próbki","wartosc":"wyniki w formularzu do 9:00 następnego dnia","zr":"Proc.","str":10},{"nazwa":"I.2 Laboratorium","wartosc":"maks. 48 h od pobrania próbek","zr":"Proc.","str":10},{"nazwa":"II Analiza stopnia","wartosc":"4 h od zatwierdzonych wyników (KLRW)","zr":"Proc.","str":11},{"nazwa":"III Informacja na zewnątrz","wartosc":"1 h od informacji z KLRW","zr":"Proc.","str":11}],"sekcje":[{"etykieta":"Etapy","punkty":[{"t":"I.1 — CLB wykonuje pomiary terenowe i pobiera próbki metodami referencyjnymi; same wyniki terenowe nie są przekazywane dalej.","zr":"Proc.","str":10},{"t":"I.2 — CLB wykonuje badania laboratoryjne, podaje liczebność Prymnesium cf. parvum i organizmy dominujące.","zr":"Proc.","str":10},{"t":"II — KLRW przypisuje stopień ostrzegawczy lub zagrożenia, opiniuje go DMŚ, potem informacja trafia do Wydziału ds. Bezpieczeństwa GIOŚ.","zr":"Proc.","str":10},{"t":"Gdy wskaźniki wskazują III stopień, ale alga nie dominuje — przypisuje się najwyżej II stopień.","zr":"Proc.","str":10},{"t":"III — Wydział ds. Bezpieczeństwa GIOŚ informuje instytucje i zleca dalsze badania z częstotliwością z załącznika nr 3.","zr":"Proc.","str":11}]},{"etykieta":"Częstotliwość badań","punkty":[{"t":"Zależy od typu punktu, przypisanego stopnia i pory roku (okres wegetacyjny: kwiecień–październik).","zr":"Proc.","str":11},{"t":"Punkty pierwszorzędne w okresie wegetacyjnym: 2× w tygodniu; przy II lub III stopniu — dodatkowy trzeci pobór w tygodniu.","zr":"Zał. 3","str":1},{"t":"Wzrost o kolejny poziom alarmowy wymusza częstotliwość nowego stopnia; spadek o co najmniej jeden poziom w pierwszym badaniu tygodnia pozwala ją zmniejszyć.","zr":"Proc.","str":11},{"t":"Wynik pierwszego badania w tygodniu jest punktem wyjścia do dalszego postępowania.","zr":"Proc.","str":11}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","postepowanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-2025","strona":9,"sekcja":"Proc. pkt 8 (s. 9–11)"},{"dokument_id":"doc-zlota-alga-w4-zal3","strona":1,"sekcja":"Zał. 3 — częstotliwość"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Informację o przypisanym stopniu GIOŚ przekazuje m.in. do właściwego WCZK, WIOŚ, CZK MKiŚ, Wód Polskich, GDOŚ i GIG — w ciągu 1 h od analizy.\n2. PARAMETRY: I.1 Pomiary i próbki — wyniki w formularzu do 9:00 następnego dnia; I.2 Laboratorium — maks. 48 h od pobrania próbek; II Analiza stopnia — 4 h od zatwierdzonych wyników (KLRW); III Informacja na zewnątrz — 1 h od informacji z KLRW\n3. ETAPY: I.1 — CLB wykonuje pomiary terenowe i pobiera próbki metodami referencyjnymi; same wyniki terenowe nie są przekazywane dalej. I.2 — CLB wykonuje badania laboratoryjne, podaje liczebność Prymnesium cf. parvum i organizmy dominujące. II — KLRW przypisuje stopień ostrzegawczy lub zagrożenia, opiniuje go DMŚ, potem informacja trafia do Wydziału ds. Bezpieczeństwa GIOŚ. Gdy wskaźniki wskazują III stopień, ale alga nie dominuje — przypisuje się najwyżej II stopień. III — Wydział ds. Bezpieczeństwa GIOŚ informuje instytucje i zleca dalsze badania z częstotliwością z załącznika nr 3.\n4. CZĘSTOTLIWOŚĆ BADAŃ: Zależy od typu punktu, przypisanego stopnia i pory roku (okres wegetacyjny: kwiecień–październik). Punkty pierwszorzędne w okresie wegetacyjnym: 2× w tygodniu; przy II lub III stopniu — dodatkowy trzeci pobór w tygodniu. Wzrost o kolejny poziom alarmowy wymusza częstotliwość nowego stopnia; spadek o co najmniej jeden poziom w pierwszym badaniu tygodnia pozwala ją zmniejszyć. Wynik pierwszego badania w tygodniu jest punktem wyjścia do dalszego postępowania."},{"id":"KARTA-ZA-POZIOMY-ALARMOWE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"poziomy alarmowe zlota alga","keywords":["zlota alga poziomy alarmowe","prymnesium parvum progi","zlota alga stopien zagrozenia","zlota alga rzeki starorzecza","zlota alga kanaly zbiorniki"],"aliasy":["zlota alga poziomy alarmowe","prymnesium parvum progi","zlota alga stopien zagrozenia","zlota alga rzeki starorzecza","zlota alga kanaly zbiorniki"],"prefix":"Złota alga — stopnie ostrzegawcze i stopnie zagrożenia (wyd. 4, 2025, zał. 2).","najpierw":[{"t":"Stopień zagrożenia przypisuje się według liczebności Prymnesium cf. parvum; pH, tlen, fosfor i N:P tylko ilustrują intensywność zakwitu.","zr":"Zał. 2","str":2}],"parametry":[{"nazwa":"Ostrzegawczy**","wartosc":"zasolenie: przewodność ≥ 2400 µS/cm (kanały, zbiorniki) · ≥ 1350 µS/cm (rzeki, starorzecza)","zr":"Zał. 2","str":2},{"nazwa":"Ostrzegawczy*","wartosc":"kanały, zbiorniki ≥ 3 mln os./l · rzeki ≥ 1 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"I stopień — średni zakwit","wartosc":"kanały, zbiorniki ≥ 10 mln · rzeki ≥ 10 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"II stopień — duży zakwit","wartosc":"kanały, zbiorniki ≥ 100 mln · rzeki ≥ 50 mln os./l","zr":"Zał. 2","str":2},{"nazwa":"III stopień — bardzo duży","wartosc":"kanały, zbiorniki ≥ 300 mln · rzeki ≥ 100 mln os./l","zr":"Zał. 2","str":2}],"sekcje":[{"etykieta":"Ryzyko przy stopniach","punkty":[{"t":"Ostrzegawczy** — ryzyko pojawienia się algi z powodu zasolenia; także w punktach bez stwierdzonej algi.","zr":"Proc.","str":9},{"t":"Ostrzegawczy* — ryzyko zakwitu z powodu obecności algi.","zr":"Proc.","str":9},{"t":"I / II / III stopień — średnie / wysokie / bardzo wysokie ryzyko śnięcia ryb.","zr":"Proc.","str":9}]},{"etykieta":"Wskaźniki pomocnicze (I / II / III)","punkty":[{"t":"pH: ≥ 7,9 / ≥ 8,4 / ≥ 8,9 (obie grupy wód).","zr":"Zał. 2","str":2},{"t":"Tlen rozpuszczony: kanały, zbiorniki ≥ 12 / ≥ 14 / ≥ 16 mg/l; rzeki ≥ 12 / ≥ 13 / ≥ 14 mg/l.","zr":"Zał. 2","str":2},{"t":"Fosfor ogólny: ≥ 0,40 / ≥ 0,55 / ≥ 0,70 mg/l P (obie grupy wód).","zr":"Zał. 2","str":2},{"t":"N:P: kanały, zbiorniki ≤ 12 / ≤ 3 / ≤ 1,5; rzeki ≤ 23 / ≤ 12 / ≤ 3.","zr":"Zał. 2","str":2}]}],"nie_rob":[{"t":"Nie przypisuj stopnia zagrożenia na podstawie samych wskaźników fizyko-chemicznych.","zr":"Zał. 2","str":2}],"tagi_wspolne":["zlota alga","prymnesium parvum","poziomy alarmowe"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-zal2","strona":2,"sekcja":"Zał. 2 — poziomy alarmowe (s. 2–3)"},{"dokument_id":"doc-zlota-alga-w4-2025","strona":9,"sekcja":"Proc. pkt 7 (s. 8–9)"}],"data_przegladu":"2026-10-25","content":"1. NAJPIERW: Stopień zagrożenia przypisuje się według liczebności Prymnesium cf. parvum; pH, tlen, fosfor i N:P tylko ilustrują intensywność zakwitu.\n2. PARAMETRY: Ostrzegawczy** — zasolenie: przewodność ≥ 2400 µS/cm (kanały, zbiorniki) · ≥ 1350 µS/cm (rzeki, starorzecza); Ostrzegawczy* — kanały, zbiorniki ≥ 3 mln os./l · rzeki ≥ 1 mln os./l; I stopień — średni zakwit — kanały, zbiorniki ≥ 10 mln · rzeki ≥ 10 mln os./l; II stopień — duży zakwit — kanały, zbiorniki ≥ 100 mln · rzeki ≥ 50 mln os./l; III stopień — bardzo duży — kanały, zbiorniki ≥ 300 mln · rzeki ≥ 100 mln os./l\n3. RYZYKO PRZY STOPNIACH: Ostrzegawczy** — ryzyko pojawienia się algi z powodu zasolenia; także w punktach bez stwierdzonej algi. Ostrzegawczy* — ryzyko zakwitu z powodu obecności algi. I / II / III stopień — średnie / wysokie / bardzo wysokie ryzyko śnięcia ryb.\n4. WSKAŹNIKI POMOCNICZE (I / II / III): pH: ≥ 7,9 / ≥ 8,4 / ≥ 8,9 (obie grupy wód). Tlen rozpuszczony: kanały, zbiorniki ≥ 12 / ≥ 14 / ≥ 16 mg/l; rzeki ≥ 12 / ≥ 13 / ≥ 14 mg/l. Fosfor ogólny: ≥ 0,40 / ≥ 0,55 / ≥ 0,70 mg/l P (obie grupy wód). N:P: kanały, zbiorniki ≤ 12 / ≤ 3 / ≤ 1,5; rzeki ≤ 23 / ≤ 12 / ≤ 3.\n5. NIE RÓB: Nie przypisuj stopnia zagrożenia na podstawie samych wskaźników fizyko-chemicznych."},{"id":"KARTA-ZA-WSKAZNIKI-BADANE","wzorzec":2,"kategoria":"dzialania","zrodlo":"GIOŚ: Procedura monitorowania interwencyjnego Prymnesium parvum „złotej algi”, wydanie 4 z 04.03.2025 r. (z załącznikami 1–3)","data_aktualizacji":"2026-10-25","slowo_kluczowe":"wskazniki badane zlota alga","keywords":["zlota alga wskazniki","zlota alga pomiary terenowe","zlota alga badania laboratoryjne","prymnesium parvum wskazniki","wskazniki fizykochemiczne zlota alga"],"aliasy":["zlota alga wskazniki","zlota alga pomiary terenowe","zlota alga badania laboratoryjne","prymnesium parvum wskazniki","wskazniki fizykochemiczne zlota alga"],"prefix":"Złota alga — wskaźniki badane w monitoringu interwencyjnym (wyd. 4, 2025, zał. 1).","parametry":[{"nazwa":"Pomiary terenowe","wartosc":"temperatura · przewodność w 20°C · pH · tlen rozpuszczony · nasycenie tlenem","zr":"Zał. 1","str":1},{"nazwa":"Fizyko-chemiczne","wartosc":"chlorki · azot azotanowy, azotynowy, amonowy, Kjeldahla, ogólny · fosfor ogólny","zr":"Zał. 1","str":1},{"nazwa":"Biologiczne","wartosc":"fitoplankton — liczebność Prymnesium cf. parvum","zr":"Zał. 1","str":1}],"sekcje":[{"etykieta":"Ocena ryzyka","punkty":[{"t":"Do oceny ryzyka służą tylko: przewodność, pH, tlen, fosfor ogólny, stosunek N:P i liczebność algi.","zr":"Zał. 2","str":1},{"t":"Temperatura, chlorki i formy azotu są badane, by sprawdzić ich związek z toksycznością — nie wpływają na stopień.","zr":"Zał. 2","str":3},{"t":"Siarczanów nie bada się — w polskich wodach nie zaobserwowano ich wpływu na rozwój algi.","zr":"Proc.","str":8},{"t":"Zakres badań (zał. 1) może zmienić GIOŚ w uzgodnieniu z MKiŚ.","zr":"Proc.","str":8}]}],"tagi_wspolne":["zlota alga","prymnesium parvum","wskazniki"],"dokumenty_zrodlowe":[{"dokument_id":"doc-zlota-alga-w4-zal1","strona":1,"sekcja":"Zał. 1 — wskaźniki badane"},{"dokument_id":"doc-zlota-alga-w4-zal2","strona":1,"sekcja":"Zał. 2 — wskaźniki objęte oceną"},{"dokument_id":"doc-zlota-alga-w4-2025","strona":8,"sekcja":"Proc. pkt 5.3.2, 6"}],"data_przegladu":"2026-10-25","content":"1. PARAMETRY: Pomiary terenowe — temperatura · przewodność w 20°C · pH · tlen rozpuszczony · nasycenie tlenem; Fizyko-chemiczne — chlorki · azot azotanowy, azotynowy, amonowy, Kjeldahla, ogólny · fosfor ogólny; Biologiczne — fitoplankton — liczebność Prymnesium cf. parvum\n2. OCENA RYZYKA: Do oceny ryzyka służą tylko: przewodność, pH, tlen, fosfor ogólny, stosunek N:P i liczebność algi. Temperatura, chlorki i formy azotu są badane, by sprawdzić ich związek z toksycznością — nie wpływają na stopień. Siarczanów nie bada się — w polskich wodach nie zaobserwowano ich wpływu na rozwój algi. Zakres badań (zał. 1) może zmienić GIOŚ w uzgodnieniu z MKiŚ."}];

        function log(message, isError = false) {

                const line = document.createElement("div");
                line.className = `debug-line${isError ? " error" : ""}`;
                line.textContent = `> ${message}`;
                debugConsole.appendChild(line);
                while (debugConsole.children && debugConsole.children.length > DEBUG_MAX_LINES) {
                    debugConsole.removeChild(debugConsole.firstChild);
                }
                debugConsole.scrollTop = debugConsole.scrollHeight;

            if (isError) showNotice(message);

        function mergeProcedureDocumentLinks(items, fallbackItems) {
            const incoming = Array.isArray(items) ? items : [];
            const fallback = Array.isArray(fallbackItems) ? fallbackItems : [];

            // Karta oznaczona w bazie online jako {"id": "...", "wycofana": true}
            // znika z aplikacji, takze z kopii wbudowanej w ten plik.
            // Bez tego wycofanej karty nie dalo sie usunac.
            const withdrawnIds = new Set(
                incoming
                    .filter(item => item && item.wycofana === true)
                    .map(item => String(item.id || ""))
                    .filter(Boolean)
            );

            // Lista wycofanych ID jest zapamietywana, aby karta nie wracala
            // z kopii wbudowanej przy kolejnym uruchomieniu bez internetu.
            try {
                const stored = JSON.parse(
                    safeStorageGet(WITHDRAWN_PROCEDURES_KEY) || "[]"
                );
                if (Array.isArray(stored)) {
                    stored.forEach(id => withdrawnIds.add(String(id)));
                }
            } catch (error) {}
            if (withdrawnIds.size) {
                safeStorageSet(
                    WITHDRAWN_PROCEDURES_KEY,
                    JSON.stringify([...withdrawnIds])
                );
            }

            const fallbackById = new Map(
                fallback
                    .filter(validateProcedure)
                    .map(item => [item.id, item])
            );

            const merged = incoming
                .filter(validateProcedure)
                .filter(item => !withdrawnIds.has(item.id))
                .map(item => {
                    const source = fallbackById.get(item.id);
                    if (!source) return item;

                    const result = { ...item };
                    const currentRefs = Array.isArray(result.dokumenty_zrodlowe)
                        ? result.dokumenty_zrodlowe
                        : [];
                    const fallbackRefs = Array.isArray(source.dokumenty_zrodlowe)
                        ? source.dokumenty_zrodlowe
                        : [];

                    if (!currentRefs.length && fallbackRefs.length) {
                        result.dokumenty_zrodlowe = fallbackRefs;
                    }

                    const currentLegacyFile =
                        String(result?.pelna_procedura?.plik || "").trim();
                    const fallbackLegacyFile =
                        String(source?.pelna_procedura?.plik || "").trim();

                    if (!currentLegacyFile && fallbackLegacyFile) {
                        result.pelna_procedura = source.pelna_procedura;
                    }

                    return result;
                });

            const usedIds = new Set(merged.map(item => item.id));
            fallback
                .filter(validateProcedure)
                .filter(item => !usedIds.has(item.id))
                .filter(item => !withdrawnIds.has(item.id))
                .forEach(item => merged.push(item));

            return merged;
        }

        function applyProcedureSet(items) {
            const withProtectedLinks = mergeProcedureDocumentLinks(
                items,
                EMBEDDED_PROCEDURES
            );
            const prepared = dedupeProcedures(
                withProtectedLinks.filter(validateProcedure)
            );

            if (!prepared.length) return false;

            state.procedury = prepared;
            state.procedureFingerprint = computeProcedureFingerprint(prepared);
            state.suggestIndex = null;
            setMicEnabled(true);
            updateApiButton();
            return true;
        }

        function normalizeDocumentRegistry(payload) {
            const source = payload?.dokumenty || payload;

            if (!source || typeof source !== "object" || Array.isArray(source)) {
                return {};
            }

            const prepared = {};

            for (const [key, item] of Object.entries(source)) {
                if (!item || typeof item !== "object") continue;

                const id = String(item.id || key || "").trim();
                const title = String(item.tytul || "").trim();
                const file = String(item.plik || "").trim();

                if (!id || !title || !file) continue;

                prepared[id] = {
                    ...item,
                    id,
                    tytul: title,
                    plik: file
                };
            }

            return prepared;
        }

        function applyDocumentRegistry(payload) {
            const prepared = normalizeDocumentRegistry(payload);
            if (!Object.keys(prepared).length) return false;
            state.documentRegistry = prepared;
            return true;
        }

        function readDocumentRegistryCache() {
            try {
                const raw = localStorage.getItem(DOCUMENT_REGISTRY_CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {

            }
        }

        function saveDocumentRegistryCache(payload) {
            try {
                localStorage.setItem(
                    DOCUMENT_REGISTRY_CACHE_KEY,
                    JSON.stringify(payload)
                );
            } catch (error) {}
        }

        async function refreshDocumentRegistryInBackground() {
            if (!/^https?:$/i.test(location.protocol)) return;

            try {
                const online = await fetchJsonFile(DOCUMENT_REGISTRY_URL);
                if (applyDocumentRegistry(online)) {
                    saveDocumentRegistryCache(online);
                }
            } catch (error) {
                log(`Rejestr dokumentów online niedostępny: ${error.message}`);
            }
        }

        function getDocumentRegistryStamp(payload) {
            const value = String(payload?.zaktualizowano || "").trim();
            const parsed = Date.parse(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function loadDocumentRegistry() {
            const cached = readDocumentRegistryCache();
            const embedded = EMBEDDED_DOCUMENT_REGISTRY;
            const cachedCount = Object.keys(
                normalizeDocumentRegistry(cached)
            ).length;
            const embeddedCount = Object.keys(
                normalizeDocumentRegistry(embedded)
            ).length;
            const cachedStamp = getDocumentRegistryStamp(cached);
            const embeddedStamp = getDocumentRegistryStamp(embedded);

            const selected =
                cachedCount > 0 &&
                cachedStamp > embeddedStamp
                    ? cached
                    : embedded;

            // Przy tej samej dacie wersja wbudowana ma pierwszenstwo.
            // Chroni to przed uzyciem starego cache po aktualizacji aplikacji.
            applyDocumentRegistry(
                Object.keys(normalizeDocumentRegistry(selected)).length
                    ? selected
                    : (cachedCount >= embeddedCount ? cached : embedded)
            );

            refreshDocumentRegistryInBackground();
        }

        function readProcedureCache() {
            try {
                const raw = localStorage.getItem(PROCEDURE_CACHE_KEY);
                if (!raw) return [];

                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return [];

                return dedupeProcedures(parsed.filter(validateProcedure));
            } catch (error) {
                return [];
            }
        }

        function saveProcedureCache(items) {
            try {
                const serialized = JSON.stringify(items);

                // Standardowy limit localStorage wynosi zwykle około 5 MB.
                // Zostawiamy zapas, aby nie blokować innych ustawień aplikacji.
                if (serialized.length > 4_000_000) {
                    log("Baza jest zbyt duża, aby zapisać ją w pamięci przeglądarki.", true);
                    return;
                }

                localStorage.setItem(PROCEDURE_CACHE_KEY, serialized);
                localStorage.setItem(
                    PROCEDURE_CACHE_META_KEY,
                    JSON.stringify({
                        count: items.length,
                        savedAt: new Date().toISOString()
                    })
                );
            } catch (error) {
                log("Nie udało się zapisać procedur w pamięci urządzenia.", true);
            }
        }

        async function fetchJsonFile(url) {
            const separator = url.includes("?") ? "&" : "?";
            const response = await fetch(
                `${url}${separator}v=${Date.now()}`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return response.json();
        }

        function normalizeText(value) {
            return (value || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\p{L}\p{N}\s-]/gu, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function escapeHtml(value) {
            return (value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function validateProcedure(item) {
            return Boolean(
                item &&
                typeof item.id === "string" &&
                typeof item.prefix === "string" &&
                Array.isArray(item.keywords) &&
                typeof item.content === "string"
            );
        }

        function dedupeProcedures(items) {
            const map = new Map();
            items.filter(validateProcedure).forEach(item => map.set(item.id, item));
            return Array.from(map.values());
        }

        async function refreshProceduresInBackground() {
            if (!/^https?:$/i.test(location.protocol)) {
                setLoadStatus(
                    `Gotowe · ${state.procedury.length} procedur · tryb lokalny`,
                    "success"
                );

            try {

                if (!aggregate.length) {
                    throw new Error("baza.json nie zawiera procedur");

                applyProcedureSet(aggregate);
                saveProcedureCache(state.procedury);

                setLoadStatus(
                    `Gotowe · ${state.procedury.length} procedur`,

                log(`Aktualizacja online niedostępna: ${error.message}`);
            }
        }

        async function loadProcedures() {
            const cached = readProcedureCache();
            const embedded = dedupeProcedures(
                EMBEDDED_PROCEDURES.filter(validateProcedure)
            );

            const initial =
                cached.length > embedded.length
                    ? cached
                    : embedded;

            if (!applyProcedureSet(initial)) {
                setMicEnabled(false);
                setLoadStatus(
                    "Błąd: wbudowana baza procedur jest nieprawidłowa.",
                    "error"
                );
                return;
            }

            setLoadStatus(
                `Gotowe · ${state.procedury.length} procedur · sprawdzam aktualizacje…`,
                "success"
            );

            // Aktualizacja nie blokuje gotowości aplikacji.
            refreshProceduresInBackground();
        }

        function buildFullDocumentUrl(info) {
            const file = (info?.plik || "").trim();
            if (!file) return "";

            try {
                const url = new URL(file, location.href);

                if (!["https:", "http:"].includes(url.protocol)) {
                    return "";
                }

                const isWebSource = String(info?.typ || "").toLowerCase() === "url";
                const page = Number(info?.strona);

                if (!isWebSource && Number.isInteger(page) && page > 0) {
                    url.hash = `page=${page}`;
                }

                return url.href;
            } catch (error) {
                return "";
            }
        }

        function getProcedureDocumentReferences(doc) {
            const refs = Array.isArray(doc?.dokumenty_zrodlowe)
                ? doc.dokumenty_zrodlowe
                : [];

            if (refs.length) {
                return refs.map(ref => ({
                    ref,
                    document: state.documentRegistry?.[ref.dokument_id] || null
                }));
            }

            const legacy = doc?.pelna_procedura || {};
            if ((legacy.plik || "").trim()) {
                return [{
                    ref: {
                        strona: legacy.strona,
                        sekcja: ""
                    },
                    document: {
                        id: "legacy",
                        tytul: legacy.tytul || doc.zrodlo || "Pełna procedura",
                        plik: legacy.plik,
                        status_techniczny: "aktywny",
                        wersja: "",
                        data_wydania: ""
                    }
                }];
            }

            return [];
        }

        // Ocena aktualnosci dokumentu na podstawie pola
        // "aktualnosc_merytoryczna" z rejestru (ustawianego po przegladzie).
        function getDocumentFreshness(document) {
            const status = String(document?.aktualnosc_merytoryczna || "");
            const verified = status.match(/zweryfikowano_(\d{4}-\d{2}-\d{2})/);
            if (/zmiana_wykryta/i.test(status)) {
                return { level: "warn", text: "wykryto zmianę źródła — w trakcie weryfikacji" };
            }
            if (/wymaga|do_potwierdzenia/i.test(status)) {
                return { level: "warn", text: "do weryfikacji" };
            }
            if (/pomocniczy/i.test(status)) {
                return { level: "info", text: "materiał pomocniczy" };
            }
            if (verified) {
                return { level: "ok", text: `zweryfikowano ${verified[1]}` };
            }
            return { level: "ok", text: "aktywny" };
        }

        function renderFreshnessLabel(document) {
            const freshness = getDocumentFreshness(document);
            return `<span class="full-document-status status-${freshness.level}">${escapeHtml(freshness.text)}</span>`;
        }

        // Linia pod tytulem karty: data aktualizacji/przegladu karty oraz
        // ostrzezenie, gdy ktorys dokument zrodlowy wymaga weryfikacji.
        function renderCardFreshness(doc) {
            const reviewed = String(doc.data_przegladu || "").trim();
            const updated = String(doc.data_aktualizacji || "").trim();
            const parts = [];
            if (updated) parts.push(`Karta zaktualizowana: ${updated}`);
            if (reviewed) parts.push(`przegląd: ${reviewed}`);
            if (!parts.length) parts.push("Brak daty aktualizacji karty");

            const flagged = getProcedureDocumentReferences(doc)
                .some(({ document }) => document && getDocumentFreshness(document).level === "warn");

            return `
                <div class="card-freshness${flagged ? " is-warn" : ""}">
                    ${escapeHtml(parts.join(" · "))}${flagged ? " · <strong>źródło do weryfikacji — sprawdź dokument poniżej</strong>" : ""}
                </div>
            `;
        }

        function renderProcedureDocuments(doc) {
            const resolved = getProcedureDocumentReferences(doc);

            if (!resolved.length) {
                const fallbackTitle =
                    doc?.pelna_procedura?.tytul ||
                    doc?.zrodlo ||
                    "Pełna procedura";

                return `
                    <div class="full-document-box">
                        <span class="full-document-disabled">
                            ${doc?.zrodlo_dostepnosc === "niedostepne_publicznie"
                                ? "Źródło niedostępne publicznie — brak pliku w aplikacji"
                                : "Pełna procedura — plik niepodłączony"}
                        </span>
                        <span class="full-document-source">
                            ${escapeHtml(fallbackTitle)}
                        </span>
                    </div>
                `;
            }

            const items = resolved.map(({ ref, document }) => {
                if (!document) {
                    return `
                        <div class="full-document-item">
                            <span class="full-document-disabled">
                                Dokument niedostępny w rejestrze
                            </span>
                            <span class="full-document-source">
                                ${escapeHtml(ref.dokument_id || "Brak identyfikatora")}
                            </span>
                        </div>
                    `;
                }

                const url = buildFullDocumentUrl({
                    plik: document.plik,
                    typ: document.typ,
                    strona: ref.strona
                });
                const isActive = document.status_techniczny === "aktywny";
                const section = String(ref.sekcja || "").trim();
                const metadata = [
                    document.rodzaj,
                    document.wersja,
                    document.data_wydania,
                    section
                ].filter(Boolean).join(" | ");
                const page = Number(ref.strona);
                const isWebSource =
                    String(document.typ || "").toLowerCase() === "url";
                const buttonLabel = isWebSource
                    ? "Otwórz oficjalne źródło"
                    : (Number.isInteger(page) && page > 0
                        ? `Otwórz dokument — strona ${page}`
                        : "Otwórz dokument");

                const action = url && isActive
                    ? `
                        <a
                            class="full-document-link"
                            href="${escapeHtml(url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHtml(buttonLabel)}
                        </a>
                    `
                    : `
                        <span class="full-document-disabled">
                            Dokument obecnie nieaktywny
                        </span>
                    `;

                return `
                    <div class="full-document-item">
                        ${action}
                        <span class="full-document-source">
                            ${escapeHtml(document.tytul)}
                            ${renderFreshnessLabel(document)}
                        </span>
                        ${metadata
                            ? `<span class="full-document-meta">${escapeHtml(metadata)}</span>`
                            : ""
                        }
                    </div>
                `;
            }).join("");

            return `
                <div class="full-document-box">
                    <div class="full-document-heading">Dokumenty źródłowe</div>
                    ${items}
                </div>
            `;
        }

        // ===== Grupy (kategorie) procedur =====
        // Grupa wynika z ID karty. Pole "grupa" w karcie (baza.json)
        // ma pierwszenstwo, wiec przypisanie mozna zmienic bez zmiany kodu.
        // Kazda karta musi pasowac do DOKLADNIE jednej grupy — sprawdza to
        // scripts/weryfikacja-kart.mjs przy kazdej budowie bazy.
        const PROCEDURE_GROUPS = [
            { key: "kpp", label: "KPP i zdarzenia masowe", test: id => id.startsWith("KARTA-KPP-") || id.startsWith("WYP-MAS-") },
            { key: "bio", label: "Biologia i środowisko", test: id => /^KARTA-(PTASIA-GRYPA-|ZA-|CHEM-B1-)/.test(id) },
            { key: "cbrn", label: "Chemia i CBRN-E", test: id => /^KARTA-(CHEM-(?!B1-)|ACETYLEN-|LOT-BSP-)/.test(id) || /^KARTA-ORG-(AMONIAK|CHLOROWODOR|CO|H2S|HCN)-/.test(id) || /CBRNE/.test(id) },
            { key: "rt", label: "Ratownictwo techniczne", test: id => id.startsWith("KARTA-RT-") },
            { key: "ev", label: "Pojazdy elektryczne", test: id => /^(DEZ|POZ|WYP|ZAT)-EV-/.test(id) },
            { key: "pv", label: "Fotowoltaika", test: id => id.startsWith("KARTA-PV-") },
            { key: "el", label: "Elektroenergetyka (PSE)", test: id => id.startsWith("KARTA-EL-") },
            { key: "bud", label: "Katastrofa budowlana", test: id => id.startsWith("KARTA-BUD-") },
            { key: "org", label: "Organizacja i łączność", test: id => /^KARTA-ORG-(ZASADY|METODYKA)/.test(id) },
            { key: "sprzet", label: "Sprzęt pomiarowy", test: id => /^KARTA-(ORG-DETEKTOR|SPRZET)-/.test(id) },
            { key: "olioc", label: "Edukacja OLiOC — dla obywateli", test: id => id.startsWith("KARTA-OLIOC-") }
        ];
        const OTHER_GROUP = { key: "inne", label: "Inne" };

        function getProcedureGroup(procedure) {
            const explicit = String(procedure?.grupa || "").trim();
            if (explicit) {
                const found = PROCEDURE_GROUPS.find(group => group.key === explicit);
                if (found) return found;
            }
            const id = String(procedure?.id || "");
            return PROCEDURE_GROUPS.find(group => group.test(id)) || OTHER_GROUP;
        }

        function getGroupProcedures(groupKey) {
            return state.procedury.filter(
                procedure => getProcedureGroup(procedure).key === groupKey
            );
        }

        // ===== Ulubione i ostatnio otwierane =====
        const FAVORITES_KEY = "kdr_ai_favorites_v1";
        const RECENT_KEY = "kdr_ai_recent_v1";
        const RECENT_MAX = 6;

        function readIdList(key) {
            try {
                const parsed = JSON.parse(safeStorageGet(key) || "[]");
                return Array.isArray(parsed) ? parsed.map(String) : [];
            } catch (error) {
                return [];
            }
        }

        function writeIdList(key, ids) {
            safeStorageSet(key, JSON.stringify(ids));
        }

        function isFavorite(id) {
            return readIdList(FAVORITES_KEY).includes(id);
        }

        function toggleFavorite(id) {
            const list = readIdList(FAVORITES_KEY);
            const next = list.includes(id)
                ? list.filter(item => item !== id)
                : [...list, id];
            writeIdList(FAVORITES_KEY, next);
            return next.includes(id);
        }

        function rememberRecent(id) {
            const list = readIdList(RECENT_KEY).filter(item => item !== id);
            writeIdList(RECENT_KEY, [id, ...list].slice(0, RECENT_MAX));
        }

        function idsToProcedures(ids) {
            return ids
                .map(id => state.procedury.find(item => item.id === id))
                .filter(Boolean);
        }

        // ===== Ekran startowy =====
        function renderChipRow(title, procedures) {
            if (!procedures.length) return "";
            const chips = procedures.map(procedure => `
                <button class="chip" type="button" data-open-id="${escapeHtml(procedure.id)}">
                    ${escapeHtml(shortTitle(procedure))}
                </button>
            `).join("");
            return `
                <section class="home-section">
                    <h2 class="home-title">${escapeHtml(title)}</h2>
                    <div class="chip-row">${chips}</div>
                </section>
            `;
        }

        function shortTitle(procedure) {
            const text = String(procedure.prefix || procedure.slowo_kluczowe || procedure.id);
            return text.length > 70 ? `${text.slice(0, 67)}…` : text;
        }

        function renderHome() {
            stopReading();
            state.view = "home";
            state.listViewShown = false;
            state.openedFromList = false;
            state.returnTarget = "";
            setResultMode(false);

            if (!state.procedury.length) {
                procedureOutput.innerHTML =
                    '<div class="empty-state">Ładowanie procedur…</div>';
                return;
            }

            const favorites = idsToProcedures(readIdList(FAVORITES_KEY));
            const recent = idsToProcedures(readIdList(RECENT_KEY))
                .filter(procedure => !favorites.some(fav => fav.id === procedure.id));

            const tiles = [...PROCEDURE_GROUPS, OTHER_GROUP]
                .map(group => ({ group, count: getGroupProcedures(group.key).length }))
                .filter(item => item.count > 0)
                .map(({ group, count }) => `
                    <button class="tile${group.key === "olioc" ? " tile-edu" : ""}" type="button" data-group="${escapeHtml(group.key)}">
                        <span class="tile-label">${escapeHtml(group.label)}</span>
                        <span class="tile-count">${count}</span>
                    </button>
                `).join("");

            procedureOutput.innerHTML = `
                <div class="home">
                    ${renderChipRow("Ulubione", favorites)}
                    ${renderChipRow("Ostatnio otwierane", recent)}
                    <section class="home-section">
                        <h2 class="home-title">Kategorie</h2>
                        <div class="tile-grid">${tiles}</div>
                    </section>
                </div>
            `;
            procedureScrollArea.scrollTop = 0;
        }

        function showGroup(groupKey) {
            const group =
                PROCEDURE_GROUPS.find(item => item.key === groupKey) || OTHER_GROUP;
            const procedures = getGroupProcedures(group.key);
            renderProcedureChoices(
                procedures,
                group.label,
                "Kategoria",
                "",
                { heading: group.label, hideGroup: true }
            );
        }

        // ===== Czytanie na glos (wbudowane w przegladarke, offline) =====
        function canReadAloud() {
            return typeof window.speechSynthesis !== "undefined" &&
                typeof window.SpeechSynthesisUtterance !== "undefined";
        }

        function stopReading() {
            if (!canReadAloud()) return;
            try { window.speechSynthesis.cancel(); } catch (error) {}
            state.isReading = false;
        }

        function readProcedureAloud(procedure, button) {
            if (!canReadAloud()) return;

            if (state.isReading) {
                stopReading();
                if (button) button.textContent = "Czytaj na głos";
                return;
            }

            if (isTemplateV2(procedure)) {
                const parts = [
                    procedure.prefix || "",
                    ...(procedure.najpierw || []).map(pointText),
                    ...(procedure.parametry || []).map(item => `${item.nazwa}: ${item.wartosc}`),
                    ...procedure.sekcje.flatMap(section => [section.etykieta, ...(section.punkty || []).map(pointText)]),
                    ...(procedure.wsparcie || []).map(pointText),
                    ...(procedure.nie_rob || []).map(point => `Nie rób: ${pointText(point)}`)
                ];
                procedure = { ...procedure, content: parts.filter(Boolean).join("\n") };
            }

            const text = [
                procedure.prefix || "",
                ...String(procedure.content || "")
                    .split("\n")
                    .map(line => line.replace(/^\d+\.\s*/, ""))
            ].filter(Boolean).join(". ");

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "pl-PL";
            utterance.rate = 1;
            utterance.onend = () => {
                state.isReading = false;
                if (button) button.textContent = "Czytaj na głos";
            };
            utterance.onerror = utterance.onend;

            state.isReading = true;
            if (button) button.textContent = "Zatrzymaj czytanie";
            window.speechSynthesis.speak(utterance);
        }

        // ===== Karta procedury =====
        // Wyroznienie krokow kluczowych w akcji. Nic nie jest zwijane,
        // aby zadna czesc procedury nie zostala przeoczona.
        function getLineEmphasis(rawLine) {
            const label = normalizeText(
                (rawLine.match(/^\d+\.\s*([^:]{3,60}):/u) || [])[1] || ""
            );
            if (!label) return "";
            if (/(dzialania krytyczne|zasada bezwzgledna)/.test(label)) return " line-critical";
            if (/co moze pojsc nie tak/.test(label)) return " line-warning";
            return "";
        }

        // ===== Wzorzec karty v2 =====
        // Karta v2 ma treść w polach strukturalnych: "najpierw" (pierwsze
        // czynności), "parametry" (liczby do szybkiego odczytu), "sekcje"
        // (krótkie punkty z numerem strony źródła), "nie_rob" i "wsparcie".
        // Pole "content" pozostaje — generowane z sekcji — dla wyszukiwarki,
        // AI i starszych wersji aplikacji.
        function isTemplateV2(doc) {
            return Number(doc?.wzorzec) === 2 && Array.isArray(doc?.sekcje);
        }

        function pageRef(point) {
            const page = Number(point?.str);
            const doc = String(point?.zr || "").trim();
            return Number.isInteger(page) && page > 0
                ? ` <span class="v2-page" title="Strona dokumentu źródłowego">${doc ? escapeHtml(doc) + " " : ""}s. ${page}</span>`
                : "";
        }

        function pointText(point) {
            return typeof point === "string" ? point : String(point?.t || "");
        }

        function renderV2List(points) {
            return `<ul class="v2-list">${(points || []).map(point =>
                `<li>${escapeHtml(pointText(point))}${pageRef(point)}</li>`
            ).join("")}</ul>`;
        }

        function renderTemplateV2(doc) {
            const blocks = [];

            if (Array.isArray(doc.najpierw) && doc.najpierw.length) {
                blocks.push(`
                    <section class="v2-box v2-first">
                        <h3 class="v2-title">Najpierw</h3>
                        ${renderV2List(doc.najpierw)}
                    </section>
                `);
            }

            if (Array.isArray(doc.parametry) && doc.parametry.length) {
                blocks.push(`
                    <section class="v2-params">
                        ${doc.parametry.map(item => `
                            <div class="v2-param${String(item.wartosc || "").length > 40 ? " v2-param-wide" : ""}">
                                <span class="v2-param-name">${escapeHtml(item.nazwa || "")}</span>
                                <span class="v2-param-value">${escapeHtml(item.wartosc || "")}${pageRef(item)}</span>
                            </div>
                        `).join("")}
                    </section>
                `);
            }

            doc.sekcje.forEach(section => {
                blocks.push(`
                    <section class="v2-section">
                        <h3 class="v2-title">${escapeHtml(section.etykieta || "")}</h3>
                        ${renderV2List(section.punkty)}
                    </section>
                `);
            });

            if (Array.isArray(doc.wsparcie) && doc.wsparcie.length) {
                blocks.push(`
                    <section class="v2-box v2-support">
                        <h3 class="v2-title">Wezwij wsparcie, gdy</h3>
                        ${renderV2List(doc.wsparcie)}
                    </section>
                `);
            }

            if (Array.isArray(doc.nie_rob) && doc.nie_rob.length) {
                blocks.push(`
                    <section class="v2-box v2-dont">
                        <h3 class="v2-title">Nie rób</h3>
                        ${renderV2List(doc.nie_rob)}
                    </section>
                `);
            }

            return blocks.join("");
        }

        function renderProcedure(doc, sourceLabel, options = {}) {
            stopReading();
            state.view = "procedure";
            state.currentProcedureId = doc.id;
            rememberRecent(doc.id);

            const lines = isTemplateV2(doc) ? renderTemplateV2(doc) : String(doc.content || "")
                .split("\n")
                .filter(Boolean)
                .map(rawLine => {
                    const emphasis = getLineEmphasis(rawLine);
                    const html = escapeHtml(rawLine)
                        .replace(/^(\d+\.)\s*/u, '<span class="step-no">$1</span> ');
                    return `<span class="procedure-line${emphasis}">${html}</span>`;
                })
                .join("");

            const fullDocumentBlock = renderProcedureDocuments(doc);
            const group = getProcedureGroup(doc);
            const favorite = isFavorite(doc.id);
            const readButton = canReadAloud()
                ? '<button class="card-action" type="button" data-action="read">Czytaj na głos</button>'
                : "";

            procedureOutput.innerHTML = `
                <div class="card-head">
                    <span class="source-badge">${escapeHtml(sourceLabel)}</span>
                    <span class="group-badge${group.key === "olioc" ? " group-edu" : ""}">${escapeHtml(group.label)}</span>
                </div>
                <div class="procedure-prefix">${escapeHtml(doc.prefix)}</div>
                ${renderCardFreshness(doc)}
                <div class="card-actions">
                    <button class="card-action${favorite ? " is-on" : ""}" type="button" data-action="favorite" aria-pressed="${favorite}">
                        ${favorite ? "★ W ulubionych" : "☆ Dodaj do ulubionych"}
                    </button>
                    ${readButton}
                </div>
                <div class="procedure-card">
                    ${lines}
                    ${fullDocumentBlock}
                </div>
            `;

            state.openedFromList = Boolean(options.fromList);
            state.returnTarget = String(options.returnTarget || "");
            state.listViewShown = false;

            if (state.returnTarget === "search-results") {
                resetBtn.textContent = "Powrót do wyników";
            } else if (state.returnTarget === "procedure-list") {
                resetBtn.textContent = "Powrót do listy";
            } else {
                resetBtn.textContent = "Powrót";
            }

            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        function renderProcedureChoices(
            procedures,
            query,
            sourceLabel,
            interpretation = "",
            options = {}
        ) {
            const safeProcedures = Array.isArray(procedures)
                ? procedures.filter(validateProcedure)
                : [];

            if (!safeProcedures.length) {
                renderEmptyState("Brak danych");
                return;
            }

            stopReading();
            state.view = "results";
            state.lastSearchResults = safeProcedures.map(item => item.id);
            state.lastSearchQuery = query || "";
            state.lastSearchSource = sourceLabel || "Wyniki wyszukiwania";
            state.lastSearchInterpretation = interpretation || "";
            state.lastSearchOptions = options;

            const rows = safeProcedures.map((procedure, index) => {
                const group = getProcedureGroup(procedure);
                const tags = (procedure.tagi_wspolne || [])
                    .slice(0, 4)
                    .join(", ");
                const meta = options.hideGroup
                    ? tags
                    : [group.label, tags].filter(Boolean).join(" · ");

                return `
                    <button
                        class="search-result-btn${group.key === "olioc" ? " result-edu" : ""}"
                        type="button"
                        data-search-id="${escapeHtml(procedure.id)}"
                    >
                        <span class="search-result-title">
                            ${index + 1}. ${escapeHtml(procedure.prefix || procedure.id)}
                        </span>
                        <span class="search-result-meta">
                            ${escapeHtml(meta || procedure.kategoria || "")}
                        </span>
                    </button>
                `;
            }).join("");

            const interpretationBlock = interpretation
                ? `<div class="procedure-prefix">${escapeHtml(interpretation)}</div>`
                : "";

            const heading = options.heading
                ? escapeHtml(options.heading)
                : `Zapytanie: ${escapeHtml(query)}`;

            procedureOutput.innerHTML = `
                <div class="source-badge">
                    ${escapeHtml(sourceLabel)} — ${formatResultCount(safeProcedures.length)}
                </div>
                <div class="procedure-prefix">
                    ${heading}
                </div>
                ${interpretationBlock}
                <div class="procedure-card search-results-card">
                    ${rows}
                </div>
            `;

            state.listViewShown = true;
            state.openedFromList = false;
            state.returnTarget = "";
            resetBtn.textContent = "Powrót";
            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        function formatResultCount(count) {
            if (count === 1) return "1 wynik";
            const lastDigit = count % 10;
            const lastTwo = count % 100;
            if (lastDigit >= 2 && lastDigit <= 4 && (lastTwo < 12 || lastTwo > 14)) {
                return `${count} wyniki`;
            }
            return `${count} wyników`;
        }

        function openProcedureFromList(procedureId) {
            const procedure = state.procedury.find(item => item.id === procedureId);
            if (!procedure) {
                renderEmptyState("Brak danych");
                return;
            }
            renderProcedure(
                procedure,
                "Lista procedur",
                {
                    fromList: true,
                    returnTarget: "procedure-list"
                }
            );
        }

        function containsNormalizedPhrase(text, phrase) {
            const normalizedText = normalizeText(text);
            const normalizedPhrase = normalizeText(phrase);
            if (!normalizedPhrase) return false;
            return ` ${normalizedText} `.includes(` ${normalizedPhrase} `);
        }

        function getDirectTerms(procedure) {
            return [
                procedure.id,
                procedure.slowo_kluczowe || "",
                ...(procedure.aliasy || procedure.keywords || [])
            ]
                .map(normalizeText)
                .filter(Boolean);
        }

        function getSharedTags(procedure) {
            return (procedure.tagi_wspolne || [])
                .map(normalizeText)
                .filter(Boolean);
        }

        const LOCAL_CATEGORY_RULES = [
