— rozproszony 1 m · zwarty 5 m — tylko prądownice dopuszczone do urządzeń pod napięciem (PWT „Turbo” lub pyszczek do 25 mm); Proszki i gazy gaśnicze — min. 1 m lub więcej, jeśli tak wskazano na urządzeniu\n3. OCENA SYTUACJI: Oceń stan instalacji z zewnątrz, np. kamerą termowizyjną: okopcenie, przebarwienia, uszkodzone złącza = możliwe napięcie na metalu. Hot Stick nie wykrywa prądu stałego generowanego przez moduły.\n4. GASZENIE: Dozwolone: woda (także ze zwilżaczami), piana sprężona, proszki, gazy gaśnicze. Magazyn energii — gaś wodą (chłodzenie); proszki i gazy mogą być nieskuteczne. Kontroluj kamerą termowizyjną lub pirometrem. Ugaszone akumulatory zabezpiecz; poinformuj właściciela o dozorze min. 24 h (ryzyko samoistnego nawrotu palenia).\n5. DZIAŁANIA: Redukuj zagrożenie wg karty „Rozpoznanie i działania zabezpieczające”. Demontaż modułów — szczególna ostrożność, zabezpiecz luźne złącza i przewody; w razie potrzeby zadysponuj odpowiednie służby. Po działaniach uniemożliw ponowne uruchomienie uszkodzonej instalacji.\n6. NIE RÓB: Nie stosuj klasycznej piany ciężkiej, średniej ani lekkiej. Nie dotykaj elementów PV ani innych elementów przewodzących, jeśli nie jest to konieczne."},{"id":"KARTA-PV-Z2-MIEJSCOWE-ZAGROZENIE","wzorzec":2,"kategoria":"dzialania","grupa":"pv","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń w obrębie instalacji fotowoltaicznych (SZP nr 6), wydanie I, marzec 2022.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"miejscowe zagrozenie pv","keywords":["uszkodzona fotowoltaika","uszkodzona instalacja pv","awaria pv","fotowoltaika uszkodzenie","miejscowe zagrozenie fotowoltaika","mechaniczne uszkodzenie pv"],"aliasy":["uszkodzona fotowoltaika","uszkodzona instalacja pv","awaria pv","fotowoltaika uszkodzenie","miejscowe zagrozenie fotowoltaika","mechaniczne uszkodzenie pv"],"prefix":"PV Z2 — miejscowe zagrożenie w obrębie instalacji fotowoltaicznej (uszkodzenie mechaniczne) (SZP KG PSP 2022).","najpierw":[{"t":"Wyznacz strefę zagrożenia; przy bezpośrednim zagrożeniu życia — natychmiastowa ewakuacja.","zr":"SZP PV 2022","str":14},{"t":"Ostrzeż ratowników, odłącz prąd do budynku; jest magazyn energii — wyłącz falownik.","zr":"SZP PV 2022","str":14},{"t":"Bez informacji o stanie instalacji — SOI do pracy przy urządzeniach pod napięciem.","zr":"SZP PV 2022","str":14}],"parametry":[{"nazwa":"Hot Stick","wartosc":"nie wykrywa prądu stałego z modułów PV","zr":"SZP PV 2022","str":14}],"sekcje":[{"etykieta":"Ocena sytuacji","punkty":[{"t":"Określ stan techniczny instalacji z oznak zewnętrznych i zagrożenia od uszkodzonej instalacji.","zr":"SZP PV 2022","str":14},{"t":"Uszkodzenie mechaniczne — oceń możliwość powstania pożaru.","zr":"SZP PV 2022","str":14}]},{"etykieta":"Działania","punkty":[{"t":"Redukuj zagrożenie wg karty „Rozpoznanie i działania zabezpieczające”.","zr":"SZP PV 2022","str":14},{"t":"Demontaż modułów — szczególna ostrożność, zabezpiecz luźne złącza i przewody; w razie potrzeby zadysponuj odpowiednie służby.","zr":"SZP PV 2022","str":14},{"t":"Po działaniach zabezpiecz instalację i uniemożliw jej ponowne uruchomienie.","zr":"SZP PV 2022","str":14}]}],"nie_rob":[{"t":"Nie dotykaj elementów PV ani innych elementów przewodzących, jeśli nie jest to konieczne.","zr":"SZP PV 2022","str":14}],"tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","miejscowe zagrozenie","uszkodzenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":14,"sekcja":"Karta Z2 — miejscowe zagrożenie (s. 14)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Wyznacz strefę zagrożenia; przy bezpośrednim zagrożeniu życia — natychmiastowa ewakuacja. Ostrzeż ratowników, odłącz prąd do budynku; jest magazyn energii — wyłącz falownik. Bez informacji o stanie instalacji — SOI do pracy przy urządzeniach pod napięciem.\n2. PARAMETRY: Hot Stick — nie wykrywa prądu stałego z modułów PV\n3. OCENA SYTUACJI: Określ stan techniczny instalacji z oznak zewnętrznych i zagrożenia od uszkodzonej instalacji. Uszkodzenie mechaniczne — oceń możliwość powstania pożaru.\n4. DZIAŁANIA: Redukuj zagrożenie wg karty „Rozpoznanie i działania zabezpieczające”. Demontaż modułów — szczególna ostrożność, zabezpiecz luźne złącza i przewody; w razie potrzeby zadysponuj odpowiednie służby. Po działaniach zabezpiecz instalację i uniemożliw jej ponowne uruchomienie.\n5. NIE RÓB: Nie dotykaj elementów PV ani innych elementów przewodzących, jeśli nie jest to konieczne."},{"id":"KARTA-PV-PRZEKAZANIE","wzorzec":2,"kategoria":"organizacja","grupa":"pv","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń w obrębie instalacji fotowoltaicznych (SZP nr 6), wydanie I, marzec 2022.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"przekazanie miejsca zdarzenia pv","keywords":["przekazanie fotowoltaika","zakonczenie dzialan pv","uszkodzona instalacja pv po akcji","przekazanie instalacji fotowoltaicznej","dozor magazynu energii","przekazanie pv"],"aliasy":["przekazanie fotowoltaika","zakonczenie dzialan pv","uszkodzona instalacja pv po akcji","przekazanie instalacji fotowoltaicznej","dozor magazynu energii","przekazanie pv"],"prefix":"Przekazanie miejsca zdarzenia po działaniach w obrębie instalacji fotowoltaicznej — co przekazać właścicielowi (SZP KG PSP 2022).","najpierw":[{"t":"Sporządź „Potwierdzenie przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”.","zr":"SZP PV 2022","str":15},{"t":"Poinformuj, że działania prowadzono w obrębie instalacji PV, oraz o zagrożeniach i sposobie postępowania.","zr":"SZP PV 2022","str":15}],"parametry":[],"sekcje":[{"etykieta":"Poinformuj przejmującego o","punkty":[{"t":"Bezpiecznej odległości i zakazie dotykania elementów PV.","zr":"SZP PV 2022","str":15},{"t":"Dozorze uszkodzonej instalacji PV i magazynów energii do czasu sprawdzenia — ryzyko nawrotu palenia.","zr":"SZP PV 2022","str":15},{"t":"Sprawdzeniu instalacji PV przez uprawnioną firmę przed ponownym załączeniem zasilania; sprawdzeniu instalacji elektrycznej obiektu.","zr":"SZP PV 2022","str":15},{"t":"Możliwym wycieku elektrolitu z uszkodzonego magazynu energii.","zr":"SZP PV 2022","str":15},{"t":"Utylizacji uszkodzonego magazynu lub modułów przez wyspecjalizowaną firmę.","zr":"SZP PV 2022","str":15},{"t":"Ponownym montażu i uruchomieniu zdemontowanych elementów przez uprawnioną firmę.","zr":"SZP PV 2022","str":15}]}],"tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","przekazanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":15,"sekcja":"Przekazanie miejsca zdarzenia (s. 15)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Sporządź „Potwierdzenie przekazania terenu, obiektu lub mienia objętego działaniem ratowniczym”. Poinformuj, że działania prowadzono w obrębie instalacji PV, oraz o zagrożeniach i sposobie postępowania.\n2. POINFORMUJ PRZEJMUJĄCEGO O: Bezpiecznej odległości i zakazie dotykania elementów PV. Dozorze uszkodzonej instalacji PV i magazynów energii do czasu sprawdzenia — ryzyko nawrotu palenia. Sprawdzeniu instalacji PV przez uprawnioną firmę przed ponownym załączeniem zasilania; sprawdzeniu instalacji elektrycznej obiektu. Możliwym wycieku elektrolitu z uszkodzonego magazynu energii. Utylizacji uszkodzonego magazynu lub modułów przez wyspecjalizowaną firmę. Ponownym montażu i uruchomieniu zdemontowanych elementów przez uprawnioną firmę."},{"id":"KARTA-PV-ROZPOZNANIE-I-ZABEZPIECZENIE","wzorzec":2,"kategoria":"dzialania","grupa":"pv","zrodlo":"KG PSP: Standardowe zasady postępowania podczas zdarzeń w obrębie instalacji fotowoltaicznych (SZP nr 6), wydanie I, marzec 2022.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"rozpoznanie fotowoltaika","keywords":["instalacja pv","rozpoznanie pv","zabezpieczenie pv","falownik pv","magazyn energii pv","moduly fotowoltaiczne"],"aliasy":["instalacja pv","rozpoznanie pv","zabezpieczenie pv","falownik pv","magazyn energii pv","moduly fotowoltaiczne"],"prefix":"Instalacja fotowoltaiczna (PV) — rozpoznanie i działania zabezpieczające: odłączenie AC, falownik, wyłącznik ppoż., strona DC (SZP KG PSP 2022).","najpierw":[{"t":"Ustaw pojazdy od strony nawietrznej, w bezpiecznej odległości.","zr":"SZP PV 2022","str":8},{"t":"Odłącz dopływ energii do obiektu — uwzględnij zasilanie zapasowe.","zr":"SZP PV 2022","str":10},{"t":"Jest magazyn energii — ustaw wyłącznik główny falownika w pozycji „0”/„Off”, niezależnie od odłączenia zasilania budynku.","zr":"SZP PV 2022","str":10},{"t":"Jest przeciwpożarowy wyłącznik prądu — użyj go.","zr":"SZP PV 2022","str":10}],"parametry":[{"nazwa":"Po odłączeniu AC","wartosc":"między modułami a rozłącznikiem/bezpiecznikami nadal może być wysokie napięcie DC","zr":"SZP PV 2022","str":10},{"nazwa":"Napięcie systemów PV","wartosc":"do 1500 V DC","zr":"SZP PV 2022","str":7},{"nazwa":"Hot Stick","wartosc":"nie wykrywa prądu stałego z modułów PV","zr":"SZP PV 2022","str":12}],"sekcje":[{"etykieta":"Rozpoznanie","punkty":[{"t":"Zbierz informacje od zarządcy, właściciela, personelu, świadków; szukaj znaku bezpieczeństwa PV (złącze, miejsce pomiaru, rozdzielnica).","zr":"SZP PV 2022","str":8},{"t":"Ustal położenie modułów, elementów instalacji, skrzynki przyłączeniowej i magazynów energii; poszukaj planu instalacji dla ekip ratowniczych.","zr":"SZP PV 2022","str":8},{"t":"Moduły na dachu — zakładaj, że mogą być ze wszystkich stron, także od północy i na ścianach; sprawdź instalację gruntową w sąsiedztwie.","zr":"SZP PV 2022","str":9},{"t":"Ustal trasy kabli DC (moduły → falownik) i od falownika do rozdzielni.","zr":"SZP PV 2022","str":9},{"t":"Odróżnij PV od kolektorów cieczowych: kolektory są grubsze, po 3–4 w łańcuchu, z przewodami hydraulicznymi 2–3 cm.","zr":"SZP PV 2022","str":9},{"t":"Okopcenie, pęknięcia, przebarwienia, nadtopione złącza i przewody — możliwe napięcie na metalowych elementach instalacji i budynku.","zr":"SZP PV 2022","str":9}]},{"etykieta":"Działania zabezpieczające","punkty":[{"t":"Instalacja ze stacją transformatorową — poproś dyspozytora operatora sieci o zdalne odłączenie stacji (podaj numer lub lokalizację).","zr":"SZP PV 2022","str":10},{"t":"Co do zasady nie ingeruj w stronę DC.","zr":"SZP PV 2022","str":11},{"t":"Demontaż modułów tylko w razie konieczności: rękawice dielektryczne, dedykowane klucze do złączy, zabezpiecz luźne złącza i przewody.","zr":"SZP PV 2022","str":11},{"t":"Elementy przewodzące budynku (pokrycie, belki, rynny) zawsze traktuj jako mogące być pod napięciem.","zr":"SZP PV 2022","str":9}]}],"nie_rob":[{"t":"Nie dotykaj elementów instalacji PV, jeśli nie jest to konieczne.","zr":"SZP PV 2022","str":9},{"t":"Zakrycie modułów plandeką lub pianą sprężoną nie gwarantuje ochrony przed porażeniem.","zr":"SZP PV 2022","str":11}],"tagi_wspolne":["fotowoltaika","pv","instalacja fotowoltaiczna","rozpoznanie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-pv-szp-2022","strona":8,"sekcja":"Rozpoznanie i działania zabezpieczające (s. 8–11)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ustaw pojazdy od strony nawietrznej, w bezpiecznej odległości. Odłącz dopływ energii do obiektu — uwzględnij zasilanie zapasowe. Jest magazyn energii — ustaw wyłącznik główny falownika w pozycji „0”/„Off”, niezależnie od odłączenia zasilania budynku. Jest przeciwpożarowy wyłącznik prądu — użyj go.\n2. PARAMETRY: Po odłączeniu AC — między modułami a rozłącznikiem/bezpiecznikami nadal może być wysokie napięcie DC; Napięcie systemów PV — do 1500 V DC; Hot Stick — nie wykrywa prądu stałego z modułów PV\n3. ROZPOZNANIE: Zbierz informacje od zarządcy, właściciela, personelu, świadków; szukaj znaku bezpieczeństwa PV (złącze, miejsce pomiaru, rozdzielnica). Ustal położenie modułów, elementów instalacji, skrzynki przyłączeniowej i magazynów energii; poszukaj planu instalacji dla ekip ratowniczych. Moduły na dachu — zakładaj, że mogą być ze wszystkich stron, także od północy i na ścianach; sprawdź instalację gruntową w sąsiedztwie. Ustal trasy kabli DC (moduły → falownik) i od falownika do rozdzielni. Odróżnij PV od kolektorów cieczowych: kolektory są grubsze, po 3–4 w łańcuchu, z przewodami hydraulicznymi 2–3 cm. Okopcenie, pęknięcia, przebarwienia, nadtopione złącza i przewody — możliwe napięcie na metalowych elementach instalacji i budynku.\n4. DZIAŁANIA ZABEZPIECZAJĄCE: Instalacja ze stacją transformatorową — poproś dyspozytora operatora sieci o zdalne odłączenie stacji (podaj numer lub lokalizację). Co do zasady nie ingeruj w stronę DC. Demontaż modułów tylko w razie konieczności: rękawice dielektryczne, dedykowane klucze do złączy, zabezpiecz luźne złącza i przewody. Elementy przewodzące budynku (pokrycie, belki, rynny) zawsze traktuj jako mogące być pod napięciem.\n5. NIE RÓB: Nie dotykaj elementów instalacji PV, jeśli nie jest to konieczne. Zakrycie modułów plandeką lub pianą sprężoną nie gwarantuje ochrony przed porażeniem."},{"id":"KARTA-KPP-AMPUTACJA-URAZOWA","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 6.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"amputacja urazowa kpp","keywords":["kikut kpp","amputowana czesc ciala kpp","procedura 6 kpp","amputacja czesciowa kpp"],"aliasy":["kikut kpp","amputowana czesc ciala kpp","procedura 6 kpp","amputacja czesciowa kpp"],"prefix":"KPP procedura 6 — amputacja urazowa całkowita i częściowa: kikut, amputowana część, przekazanie ZRM.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i procedura 2.","zr":"KPP proc. 6","str":1},{"t":"Kikut po amputacji całkowitej → postępowanie jak przy ranie krwawiącej (procedura 5).","zr":"KPP proc. 6","str":1}],"parametry":[],"sekcje":[{"etykieta":"Amputacja całkowita — amputowana część","punkty":[{"t":"Owiń w suchą gazę jałową.","zr":"KPP proc. 6","str":1},{"t":"Umieść w szczelnym worku plastikowym, wyciśnij powietrze.","zr":"KPP proc. 6","str":1},{"t":"Worek włóż do pojemnika z zimną wodą, w miarę możliwości z lodem.","zr":"KPP proc. 6","str":1},{"t":"Przekaż Zespołowi Ratownictwa Medycznego.","zr":"KPP proc. 6","str":1}]},{"etykieta":"Amputacja częściowa","punkty":[{"t":"Opatrunek jałowy zwilżony solą fizjologiczną.","zr":"KPP proc. 6","str":1},{"t":"Rana krwawiąca → procedura 5.","zr":"KPP proc. 6","str":1},{"t":"Unieruchom kończynę.","zr":"KPP proc. 6","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","amputacja","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-06","strona":1,"sekcja":"Procedura nr 6"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i procedura 2. Kikut po amputacji całkowitej → postępowanie jak przy ranie krwawiącej (procedura 5).\n2. AMPUTACJA CAŁKOWITA — AMPUTOWANA CZĘŚĆ: Owiń w suchą gazę jałową. Umieść w szczelnym worku plastikowym, wyciśnij powietrze. Worek włóż do pojemnika z zimną wodą, w miarę możliwości z lodem. Przekaż Zespołowi Ratownictwa Medycznego.\n3. AMPUTACJA CZĘŚCIOWA: Opatrunek jałowy zwilżony solą fizjologiczną. Rana krwawiąca → procedura 5. Unieruchom kończynę."},{"id":"KARTA-KPP-KOBIETA-W-CIAZY-ZAGROZENIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 19","data_aktualizacji":"","slowo_kluczowe":"kobieta w ciazy kpp","keywords":["ciaza zagrozenie zycia kpp","procedura 19 kpp","resuscytacja ciaza kpp"],"prefix":"KPP - kobieta w widocznej ciazy w stanie zagrozenia zycia lub zdrowia.","content":"1. KOD / NAZWA: Procedura 19 - kobieta w widocznej ciazy w stanie zagrozenia zycia lub zdrowia.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. PRZYTOMNA: uloz poszkodowana w pozycji wygodnej dla niej.\n4. CIALO OBCE W DROGACH ODDECHOWYCH: zachecaj do kaszlu. Jezeli kaszel jest nieefektywny, wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli dalej sa nieefektywne - do 5 ucisniec klatki piersiowej.\n5. URAZOWY MECHANIZM ZDARZENIA LUB WSKAZANIA DO RESUSCYTACJI: uloz poszkodowana na wznak z uniesieniem biodra prawego albo z przesunieciem brzucha w lewa strone. Resuscytacje prowadz w tej pozycji.\n6. NIEPRZYTOMNA BEZ WSKAZAN DO RESUSCYTACJI I BEZ URAZOWEGO MECHANIZMU: uloz poszkodowana na lewym boku.\n7. UWAGI OPERACYJNE: procedura laczy postepowanie urazowe i nieurazowe oraz uwzglednia odrebne ulozenie w czasie resuscytacji.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","kobieta w ciazy"],"aliasy":["ciaza zagrozenie zycia kpp","procedura 19 kpp","resuscytacja ciaza kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-19","strona":1,"sekcja":"Procedura nr 19 - Kobieta w widocznej ciąży w stanie zagrożenia życia lub zdrowia"}]},{"id":"KARTA-KPP-OBRAZENIA-BRZUCHA","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 10.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia brzucha kpp","keywords":["rana brzucha kpp","wytrzewienie kpp","procedura 10 kpp"],"aliasy":["rana brzucha kpp","wytrzewienie kpp","procedura 10 kpp"],"prefix":"KPP procedura 10 — obrażenia brzucha: wytrzewienie, opatrunek osłaniający, pozycja z ugiętymi kolanami.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 10","str":1},{"t":"Rana z wytrzewieniem → wilgotny opatrunek osłaniający przykryty folią.","zr":"KPP proc. 10","str":1},{"t":"Rana bez wytrzewienia → opatrunek osłaniający.","zr":"KPP proc. 10","str":1}],"parametry":[],"sekcje":[{"etykieta":"Pozycja","punkty":[{"t":"Leżąca z nogami ugiętymi w kolanach.","zr":"KPP proc. 10","str":1},{"t":"Współistniejące obrażenia miednicy lub kończyn dolnych → leżąca na płasko.","zr":"KPP proc. 10","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-10","strona":1,"sekcja":"Procedura nr 10"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Rana z wytrzewieniem → wilgotny opatrunek osłaniający przykryty folią. Rana bez wytrzewienia → opatrunek osłaniający.\n2. POZYCJA: Leżąca z nogami ugiętymi w kolanach. Współistniejące obrażenia miednicy lub kończyn dolnych → leżąca na płasko."},{"id":"KARTA-KPP-OBRAZENIA-GLOWY","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 7.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia glowy kpp","keywords":["podejrzenie obrazen glowy kpp","procedura 7 kpp","stabilizacja szyjnego kpp"],"aliasy":["podejrzenie obrazen glowy kpp","procedura 7 kpp","stabilizacja szyjnego kpp"],"prefix":"KPP procedura 7 — obrażenia i podejrzenie obrażeń głowy: stabilizacja szyi, opatrunek, ewakuacja na noszach.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia.","zr":"KPP proc. 7","str":1},{"t":"Stabilizacja odcinka szyjnego kręgosłupa.","zr":"KPP proc. 7","str":1},{"t":"Sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 7","str":1}],"parametry":[],"sekcje":[{"etykieta":"Postępowanie","punkty":[{"t":"Rana głowy → opatrunek osłaniający.","zr":"KPP proc. 7","str":1},{"t":"Konieczna ewakuacja → unieruchomienie na noszach; nosze unosić od strony głowy.","zr":"KPP proc. 7","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-07","strona":1,"sekcja":"Procedura nr 7"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia. Stabilizacja odcinka szyjnego kręgosłupa. Sekwencja medycznych działań ratowniczych (procedura 2).\n2. POSTĘPOWANIE: Rana głowy → opatrunek osłaniający. Konieczna ewakuacja → unieruchomienie na noszach; nosze unosić od strony głowy."},{"id":"KARTA-KPP-OBRAZENIA-KLATKI-PIERSIOWEJ","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 9.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia klatki piersiowej kpp","keywords":["rana drazaca klatki piersiowej","wiotka klatka piersiowa","procedura 9 kpp"],"aliasy":["rana drazaca klatki piersiowej","wiotka klatka piersiowa","procedura 9 kpp"],"prefix":"KPP procedura 9 — obrażenia klatki piersiowej: rana drążąca (opatrunek zastawkowy), wiotka klatka (stabilizacja), pozycja półsiedząca.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 9","str":1},{"t":"Rana drążąca klatki piersiowej → opatrunek zastawkowy.","zr":"KPP proc. 9","str":1},{"t":"Wiotka klatka piersiowa → stabilizacja ręczna lub plastrowa.","zr":"KPP proc. 9","str":1}],"parametry":[],"sekcje":[{"etykieta":"Pozycja","punkty":[{"t":"Pozycja półsiedząca.","zr":"KPP proc. 9","str":1},{"t":"Podejrzenie obrażeń głowy lub szyi, poszkodowany na noszach, bez objawów wstrząsu → unieś nosze od strony głowy.","zr":"KPP proc. 9","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-09","strona":1,"sekcja":"Procedura nr 9"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Rana drążąca klatki piersiowej → opatrunek zastawkowy. Wiotka klatka piersiowa → stabilizacja ręczna lub plastrowa.\n2. POZYCJA: Pozycja półsiedząca. Podejrzenie obrażeń głowy lub szyi, poszkodowany na noszach, bez objawów wstrząsu → unieś nosze od strony głowy."},{"id":"KARTA-KPP-OBRAZENIA-KREGOSLUPA","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 8.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia kregoslupa kpp","keywords":["podejrzenie obrazen kregoslupa","procedura 8 kpp","stabilizacja kregoslupa kpp"],"aliasy":["podejrzenie obrazen kregoslupa","procedura 8 kpp","stabilizacja kregoslupa kpp"],"prefix":"KPP procedura 8 — obrażenia i podejrzenie obrażeń kręgosłupa: stabilizacja szyi, pozycja zastana lub nosze.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia.","zr":"KPP proc. 8","str":1},{"t":"Stabilizacja odcinka szyjnego kręgosłupa — przed sekwencją medycznych działań ratowniczych.","zr":"KPP proc. 8","str":1},{"t":"Sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 8","str":1}],"parametry":[],"sekcje":[{"etykieta":"Dalej","punkty":[{"t":"Bez konieczności ewakuacji → stabilizacja w pozycji zastanej.","zr":"KPP proc. 8","str":1},{"t":"Konieczność ewakuacji → w miarę możliwości unieruchomienie na noszach, potem ponowna sekwencja medycznych działań.","zr":"KPP proc. 8","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-08","strona":1,"sekcja":"Procedura nr 8"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia. Stabilizacja odcinka szyjnego kręgosłupa — przed sekwencją medycznych działań ratowniczych. Sekwencja medycznych działań ratowniczych (procedura 2).\n2. DALEJ: Bez konieczności ewakuacji → stabilizacja w pozycji zastanej. Konieczność ewakuacji → w miarę możliwości unieruchomienie na noszach, potem ponowna sekwencja medycznych działań."},{"id":"KARTA-KPP-OBRAZENIA-MIEDNICY","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 11.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia miednicy kpp","keywords":["miednica kpp","procedura 11 kpp","nosze podbierakowe miednica"],"aliasy":["miednica kpp","procedura 11 kpp","nosze podbierakowe miednica"],"prefix":"KPP procedura 11 — obrażenia miednicy: stabilizacja, nosze podbierakowe lub technika „wielu rąk”.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 11","str":1},{"t":"Rozważ stabilizację miednicy.","zr":"KPP proc. 11","str":1}],"parametry":[],"sekcje":[{"etykieta":"Przeniesienie","punkty":[{"t":"Użyj noszy podbierakowych.","zr":"KPP proc. 11","str":1},{"t":"Brak noszy podbierakowych → technika „wielu rąk”.","zr":"KPP proc. 11","str":1},{"t":"Unieruchomienie na noszach.","zr":"KPP proc. 11","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-11","strona":1,"sekcja":"Procedura nr 11"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Rozważ stabilizację miednicy.\n2. PRZENIESIENIE: Użyj noszy podbierakowych. Brak noszy podbierakowych → technika „wielu rąk”. Unieruchomienie na noszach."},{"id":"KARTA-KPP-OBRAZENIA-NARZADU-RUCHU","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 12.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"obrazenia narzadu ruchu kpp","keywords":["konczyna kpp","zlamanie kpp","procedura 12 kpp","wyciag delikatny kpp"],"aliasy":["konczyna kpp","zlamanie kpp","procedura 12 kpp","wyciag delikatny kpp"],"prefix":"KPP procedura 12 — obrażenia narządu ruchu: stabilizacja, krążenie i czucie, delikatny wyciąg, unieruchomienie.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 12","str":1},{"t":"Ręczna stabilizacja kończyny; ocena obrażeń.","zr":"KPP proc. 12","str":1},{"t":"Ocena krążenia i czucia poniżej miejsca uszkodzenia.","zr":"KPP proc. 12","str":1}],"parametry":[],"sekcje":[{"etykieta":"Zniekształcenie obrysu kończyny","punkty":[{"t":"Zastosuj delikatny wyciąg.","zr":"KPP proc. 12","str":1},{"t":"Opór podczas wyciągu → rana lub przerwanie ciągłości skóry: opatrunek jałowy osłonowy; unieruchomienie w pozycji zastanej.","zr":"KPP proc. 12","str":1},{"t":"Brak oporu → jak bez zniekształcenia.","zr":"KPP proc. 12","str":1}]},{"etykieta":"Bez zniekształcenia lub bez oporu","punkty":[{"t":"Rana → opatrunek jałowy osłonowy.","zr":"KPP proc. 12","str":1},{"t":"Unieruchomienie w pozycji zbliżonej do fizjologicznej.","zr":"KPP proc. 12","str":1}]},{"etykieta":"Na koniec","punkty":[{"t":"Ponowna ocena krążenia i czucia poniżej miejsca uszkodzenia.","zr":"KPP proc. 12","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","obrazenia","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-12","strona":1,"sekcja":"Procedura nr 12"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Ręczna stabilizacja kończyny; ocena obrażeń. Ocena krążenia i czucia poniżej miejsca uszkodzenia.\n2. ZNIEKSZTAŁCENIE OBRYSU KOŃCZYNY: Zastosuj delikatny wyciąg. Opór podczas wyciągu → rana lub przerwanie ciągłości skóry: opatrunek jałowy osłonowy; unieruchomienie w pozycji zastanej. Brak oporu → jak bez zniekształcenia.\n3. BEZ ZNIEKSZTAŁCENIA LUB BEZ OPORU: Rana → opatrunek jałowy osłonowy. Unieruchomienie w pozycji zbliżonej do fizjologicznej.\n4. NA KONIEC: Ponowna ocena krążenia i czucia poniżej miejsca uszkodzenia."},{"id":"KARTA-KPP-OPARZENIE-CHEMICZNE","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 14.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"oparzenie chemiczne kpp","keywords":["procedura 14 kpp","plynna substancja oparzenie kpp","stala substancja oparzenie kpp"],"aliasy":["procedura 14 kpp","plynna substancja oparzenie kpp","stala substancja oparzenie kpp"],"prefix":"KPP procedura 14 — oparzenie chemiczne: usunięcie odzieży i substancji, płukanie bieżącą wodą, opatrunek.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 14","str":1},{"t":"Usuń skażoną odzież i biżuterię z oparzonej powierzchni.","zr":"KPP proc. 14","str":1},{"t":"Substancja stała → w miarę możliwości usuń ją mechanicznie ze skóry.","zr":"KPP proc. 14","str":1}],"parametry":[],"sekcje":[{"etykieta":"Dalej","punkty":[{"t":"Bezpieczne płukanie bieżącą wodą do zmniejszenia bólu lub oczyszczenia skóry.","zr":"KPP proc. 14","str":1},{"t":"Opatrunek hydrożelowy; brak hydrożelu → suchy jałowy opatrunek.","zr":"KPP proc. 14","str":1},{"t":"Zwracaj uwagę na objawy wychłodzenia.","zr":"KPP proc. 14","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","oparzenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-14","strona":1,"sekcja":"Procedura nr 14"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Usuń skażoną odzież i biżuterię z oparzonej powierzchni. Substancja stała → w miarę możliwości usuń ją mechanicznie ze skóry.\n2. DALEJ: Bezpieczne płukanie bieżącą wodą do zmniejszenia bólu lub oczyszczenia skóry. Opatrunek hydrożelowy; brak hydrożelu → suchy jałowy opatrunek. Zwracaj uwagę na objawy wychłodzenia."},{"id":"KARTA-KPP-OPARZENIE-TERMICZNE","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 13.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"oparzenie termiczne kpp","keywords":["procedura 13 kpp","hydrozel oparzenie kpp","schladzanie oparzenia kpp"],"aliasy":["procedura 13 kpp","hydrozel oparzenie kpp","schladzanie oparzenia kpp"],"prefix":"KPP procedura 13 — oparzenie termiczne: hydrożel albo schładzanie 5–10 / 1–2 min, jałowy opatrunek.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 13","str":1},{"t":"Usuń odzież i biżuterię z oparzonej powierzchni.","zr":"KPP proc. 13","str":1},{"t":"Opatrunek hydrożelowy.","zr":"KPP proc. 13","str":1}],"parametry":[{"nazwa":"Brak hydrożelu — schładzanie","wartosc":"sól fizjologiczna lub czysta woda","zr":"KPP proc. 13","str":1},{"nazwa":"Czas schładzania","wartosc":"5–10 min przy oparzeniu < 10% powierzchni ciała · 1–2 min przy > 10%","zr":"KPP proc. 13","str":1}],"sekcje":[{"etykieta":"Dalej","punkty":[{"t":"Jałowy suchy opatrunek.","zr":"KPP proc. 13","str":1},{"t":"Zwracaj uwagę na objawy wychłodzenia.","zr":"KPP proc. 13","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","oparzenie"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-13","strona":1,"sekcja":"Procedura nr 13"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Usuń odzież i biżuterię z oparzonej powierzchni. Opatrunek hydrożelowy.\n2. PARAMETRY: Brak hydrożelu — schładzanie — sól fizjologiczna lub czysta woda; Czas schładzania — 5–10 min przy oparzeniu < 10% powierzchni ciała · 1–2 min przy > 10%\n3. DALEJ: Jałowy suchy opatrunek. Zwracaj uwagę na objawy wychłodzenia."},{"id":"KARTA-KPP-RANY","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 5.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"rany kpp","keywords":["rana krwawiaca kpp","opaska zaciskowa kpp","procedura 5 kpp","opatrunek uciskowy kpp"],"aliasy":["rana krwawiaca kpp","opaska zaciskowa kpp","procedura 5 kpp","opatrunek uciskowy kpp"],"prefix":"KPP procedura 5 — rany: opatrunek osłaniający, uciskowy, opaska zaciskowa, ucisk tętnicy lub miejscowy ucisk rany.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i procedura 2; uwidocznij ranę.","zr":"KPP proc. 5","str":1},{"t":"Rana niekrwawiąca → opatrunek osłaniający.","zr":"KPP proc. 5","str":1},{"t":"Rana krwawiąca → opatrunek uciskowy.","zr":"KPP proc. 5","str":1}],"parametry":[],"sekcje":[{"etykieta":"Rana krwawiąca — kończyna","punkty":[{"t":"Opatrunek uciskowy.","zr":"KPP proc. 5","str":1},{"t":"Krwotok nie ustaje → opaska zaciskowa.","zr":"KPP proc. 5","str":1},{"t":"Brak opaski zaciskowej → ucisk na dużą tętnicę.","zr":"KPP proc. 5","str":1}]},{"etykieta":"Rana krwawiąca — inna okolica ciała","punkty":[{"t":"Opatrunek uciskowy.","zr":"KPP proc. 5","str":1},{"t":"Nie można go założyć → miejscowe uciśnięcie rany.","zr":"KPP proc. 5","str":1}]},{"etykieta":"Dalej","punkty":[{"t":"W miarę możliwości unieruchom uszkodzoną okolicę.","zr":"KPP proc. 5","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","rany","uraz"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-05","strona":1,"sekcja":"Procedura nr 5"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i procedura 2; uwidocznij ranę. Rana niekrwawiąca → opatrunek osłaniający. Rana krwawiąca → opatrunek uciskowy.\n2. RANA KRWAWIĄCA — KOŃCZYNA: Opatrunek uciskowy. Krwotok nie ustaje → opaska zaciskowa. Brak opaski zaciskowej → ucisk na dużą tętnicę.\n3. RANA KRWAWIĄCA — INNA OKOLICA CIAŁA: Opatrunek uciskowy. Nie można go założyć → miejscowe uciśnięcie rany.\n4. DALEJ: W miarę możliwości unieruchom uszkodzoną okolicę."},{"id":"KARTA-KPP-RKO-DOROSLI","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 3.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"kpp rko dorosli","keywords":["rko dorosly kpp","zatrzymanie krazenia dorosly","procedura 3 kpp","aed dorosly"],"aliasy":["rko dorosly kpp","zatrzymanie krazenia dorosly","procedura 3 kpp","aed dorosly"],"prefix":"KPP procedura 3 — zatrzymanie krążenia u dorosłych: RKO 30:2 lub asynchroniczna, AED.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 3","str":1},{"t":"Brak prawidłowego oddechu → RKO 30:2.","zr":"KPP proc. 3","str":1},{"t":"Defibrylator AED — po włączeniu stosuj się do jego poleceń.","zr":"KPP proc. 3","str":1}],"parametry":[{"nazwa":"Uciśnięcia : oddechy","wartosc":"30:2","zr":"KPP proc. 3","str":1},{"nazwa":"RKO asynchroniczna","wartosc":"wymaga użycia dostępnego sprzętu nadgłośniowego do udrożnienia dróg oddechowych","zr":"KPP proc. 3","str":1}],"sekcje":[],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","rko","resuscytacja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-03","strona":1,"sekcja":"Procedura nr 3"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Brak prawidłowego oddechu → RKO 30:2. Defibrylator AED — po włączeniu stosuj się do jego poleceń.\n2. PARAMETRY: Uciśnięcia : oddechy — 30:2; RKO asynchroniczna — wymaga użycia dostępnego sprzętu nadgłośniowego do udrożnienia dróg oddechowych"},{"id":"KARTA-KPP-RKO-DZIECI-NIEMOWLETA-NOWORODKI","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 4.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"kpp rko dzieci","keywords":["rko niemowle kpp","rko noworodek kpp","procedura 4 kpp","aed dziecko"],"aliasy":["rko niemowle kpp","rko noworodek kpp","procedura 4 kpp","aed dziecko"],"prefix":"KPP procedura 4 — zatrzymanie krążenia u dzieci i noworodków zaraz po urodzeniu: 5 oddechów, RKO 15:2 lub 3:1, AED.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2).","zr":"KPP proc. 4","str":1},{"t":"Brak prawidłowego oddechu → 5 oddechów ratowniczych.","zr":"KPP proc. 4","str":1},{"t":"Brak oznak życia → RKO wg wieku; AED zgodnie z zaleceniami producenta.","zr":"KPP proc. 4","str":1}],"parametry":[{"nazwa":"Dzieci","wartosc":"RKO 15:2 lub asynchroniczna (z dostępnym sprzętem nadgłośniowym)","zr":"KPP proc. 4","str":1},{"nazwa":"Noworodki bezpośrednio po urodzeniu","wartosc":"RKO 3:1","zr":"KPP proc. 4","str":1}],"sekcje":[],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","rko","resuscytacja"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-04","strona":1,"sekcja":"Procedura nr 4"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia i sekwencja medycznych działań ratowniczych (procedura 2). Brak prawidłowego oddechu → 5 oddechów ratowniczych. Brak oznak życia → RKO wg wieku; AED zgodnie z zaleceniami producenta.\n2. PARAMETRY: Dzieci — RKO 15:2 lub asynchroniczna (z dostępnym sprzętem nadgłośniowym); Noworodki bezpośrednio po urodzeniu — RKO 3:1"},{"id":"KARTA-KPP-SCHEMAT-BADANIA-ABCDE","kategoria":"dzialania","zrodlo":"ALS Provider Course, Schemat badania ABCDE, strony 1-2","data_aktualizacji":"2026-07-17","slowo_kluczowe":"schemat badania abcde","keywords":["badanie abcde","abcde poszkodowany","ocena abcde","algorytm abcde","abcde kpp","badanie pierwotne abcde"],"prefix":"KPP - schemat badania ABCDE.","content":"1. KOD / NAZWA: Schemat badania ABCDE - szybka i uporządkowana ocena poszkodowanego.\n2. ZASADA NADRZĘDNA: Na każdym etapie rozpoznaj i usuń bezpośrednie zagrożenie życia przed przejściem do następnej litery. Po wykonanej interwencji oceń jej efekt, wróć do początku schematu i wcześnie wezwij dodatkową pomoc.\n3. A - AIRWAY / DROŻNOŚĆ DRÓG ODDECHOWYCH: Oceń, czy poszkodowany mówi i czy drogi oddechowe są drożne. Zwróć uwagę na ciała obce, wydzielinę i nieprawidłowe dźwięki oddechowe. Udrożnij i oczyść drogi oddechowe metodą odpowiednią do sytuacji i posiadanego wyposażenia. Przy urazie zabezpieczaj odcinek szyjny kręgosłupa.\n4. B - BREATHING / ODDYCHANIE: Oceń częstość, głębokość i jakość oddechu, wysiłek oddechowy, symetrię ruchów klatki piersiowej, tor oddechowy, zabarwienie skóry oraz widoczne obrażenia klatki piersiowej. Jeżeli jest dostępny sprzęt, wykonaj pulsoksymetrię i kapnometrię. Wdróż tlenoterapię, wentylację lub zabezpieczenie obrażeń zgodnie ze wskazaniami i zakresem uprawnień.\n5. C - CIRCULATION / KRĄŻENIE: Oceń tętno - jego obecność, częstość i jakość. Oceń kolor, wilgotność i temperaturę skóry, nawrót kapilarny, ciśnienie tętnicze, krwawienia i objawy wstrząsu. Natychmiast tamuj masywne krwotoki. W przypadku zatrzymania krążenia rozpocznij RKO i użyj AED zgodnie z właściwą procedurą.\n6. D - DISABILITY / STAN ŚWIADOMOŚCI I OCENA NEUROLOGICZNA: Oceń świadomość w skali AVPU lub GCS, źrenice, orientację, mowę oraz symetrię siły i ruchów. Zmierz glikemię, jeżeli jest to możliwe i zgodne z zakresem działań. Zwróć uwagę na drgawki, niedowłady i nagłą zmianę zachowania.\n7. E - EXPOSURE / EKSPOZYCJA I OGLĄDANIE: Odsłoń tylko tyle ciała, ile jest konieczne do pełnej oceny. Obejrzyj poszkodowanego z przodu i z tyłu, oceń urazy, wysypki, obrzęki i inne nieprawidłowości. Oceń brzuch oraz temperaturę ciała. Chroń prywatność i natychmiast zapobiegaj wychłodzeniu.\n8. SAMPLE - WYWIAD: S - symptomy, A - alergie, M - medykamenty, P - przebyte choroby, L - ostatni posiłek, E - okoliczności zdarzenia lub początku dolegliwości. Wywiad zbieraj możliwie wcześnie, bez opóźniania działań ratujących życie.\n9. OCENA PONOWNA: Powtarzaj ABCDE po każdej zmianie stanu, wykonanej interwencji, przed przekazaniem poszkodowanego i podczas oczekiwania na ZRM.\n10. UWAGA KOMPETENCYJNA: Dokument źródłowy ALS zawiera także czynności zaawansowane i lekarskie. W ramach KPP wykonuj wyłącznie działania zgodne z posiadanymi kwalifikacjami, obowiązującymi procedurami oraz dostępnym sprzętem.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","ocena poszkodowanego","abcde"],"aliasy":["badanie abcde","abcde poszkodowany","ocena abcde","algorytm abcde","abcde kpp","badanie pierwotne abcde"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-abcde-als","strona":1,"sekcja":"Schemat badania ABCDE - strony 1-2"}]},{"id":"KARTA-KPP-SEKWENCJA-MEDYCZNYCH-DZIALAN-RATOWNICZYCH","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 2.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"kpp sekwencja","keywords":["procedura 2 kpp","kpp abc","kpp ocena poszkodowanego","kwalifikowana pierwsza pomoc sekwencja"],"aliasy":["procedura 2 kpp","kpp abc","kpp ocena poszkodowanego","kwalifikowana pierwsza pomoc sekwencja"],"prefix":"KPP procedura 2 — sekwencja medycznych działań ratowniczych: ogólne wrażenie, ABC, wywiad, badanie, wstrząs, termoizolacja.","najpierw":[{"t":"Ocena ogólnego wrażenia: rana krwawiąca → procedura 5; drgawki → zabezpiecz przed obrażeniami wtórnymi, szczególnie głowy.","zr":"KPP proc. 2","str":1},{"t":"Brak prawidłowego oddechu → RKO, procedura 3 lub 4.","zr":"KPP proc. 2","str":1},{"t":"Wsparcie psychiczne przez cały czas działań.","zr":"KPP proc. 2","str":1}],"parametry":[],"sekcje":[{"etykieta":"Sekwencja","punkty":[{"t":"Ocena stanu świadomości.","zr":"KPP proc. 2","str":1},{"t":"(A) Drożność dróg oddechowych — udrożnij w razie potrzeby, sposobem dobranym do mechanizmu zdarzenia.","zr":"KPP proc. 2","str":1},{"t":"(B) Ocena oddechu; oddech obecny — tlenoterapia według wskazań.","zr":"KPP proc. 2","str":1},{"t":"(C) Ocena krążenia.","zr":"KPP proc. 2","str":1},{"t":"Wywiad ratowniczy; ocena pod kątem obrażeń i dolegliwości; postępowanie adekwatne do stwierdzonych.","zr":"KPP proc. 2","str":1}]},{"etykieta":"Dalej","punkty":[{"t":"Objawy wstrząsu hipowolemicznego → pozycja leżąca na płasko.","zr":"KPP proc. 2","str":1},{"t":"Termoizolacja.","zr":"KPP proc. 2","str":1},{"t":"Regularna ocena funkcji życiowych i postępowanie adekwatne do stanu.","zr":"KPP proc. 2","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","sekwencja medyczna"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-02","strona":1,"sekcja":"Procedura nr 2"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Ocena ogólnego wrażenia: rana krwawiąca → procedura 5; drgawki → zabezpiecz przed obrażeniami wtórnymi, szczególnie głowy. Brak prawidłowego oddechu → RKO, procedura 3 lub 4. Wsparcie psychiczne przez cały czas działań.\n2. SEKWENCJA: Ocena stanu świadomości. (A) Drożność dróg oddechowych — udrożnij w razie potrzeby, sposobem dobranym do mechanizmu zdarzenia. (B) Ocena oddechu; oddech obecny — tlenoterapia według wskazań. (C) Ocena krążenia. Wywiad ratowniczy; ocena pod kątem obrażeń i dolegliwości; postępowanie adekwatne do stwierdzonych.\n3. DALEJ: Objawy wstrząsu hipowolemicznego → pozycja leżąca na płasko. Termoizolacja. Regularna ocena funkcji życiowych i postępowanie adekwatne do stanu."},{"id":"KARTA-KPP-SEKWENCJA-ZALOZEN-TAKTYCZNYCH","wzorzec":2,"kategoria":"dzialania","grupa":"kpp","zrodlo":"KG PSP: Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy — Załącznik nr 1 do Zasad organizacji ratownictwa medycznego w KSRG (2021), Procedura 1.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"kpp taktyczne","keywords":["sekwencja zalozen taktycznych","procedura 1 kpp","rozpoznanie miejsca zdarzenia kpp","kpp dotarcie do poszkodowanego"],"aliasy":["sekwencja zalozen taktycznych","procedura 1 kpp","rozpoznanie miejsca zdarzenia kpp","kpp dotarcie do poszkodowanego"],"prefix":"KPP procedura 1 — sekwencja założeń taktycznych w ratownictwie medycznym: rozpoznanie, dotarcie, wariant działań, meldunek do KDR.","najpierw":[{"t":"Rozpoznanie miejsca zdarzenia: zabezpieczenie ratowników, identyfikacja zagrożeń, liczba poszkodowanych, potrzebne dodatkowe siły i środki, mechanizm zdarzenia.","zr":"KPP proc. 1","str":1},{"t":"Dotarcie do poszkodowanego.","zr":"KPP proc. 1","str":1},{"t":"Po wybranym wariancie — meldunek do Kierującego Działaniem Ratowniczym.","zr":"KPP proc. 1","str":1}],"parametry":[],"sekcje":[{"etykieta":"Warianty po dotarciu","punkty":[{"t":"Ewakuacja i podjęcie medycznych działań ratowniczych.","zr":"KPP proc. 1","str":1},{"t":"Wykonanie dostępu do poszkodowanego i podjęcie medycznych działań ratowniczych.","zr":"KPP proc. 1","str":1},{"t":"Podjęcie medycznych działań ratowniczych i przygotowanie do ewakuacji.","zr":"KPP proc. 1","str":1},{"t":"Niepodjęcie medycznych działań ratowniczych — wg Zasad organizacji ratownictwa medycznego w KSRG, załącznik nr 10.","zr":"KPP proc. 1","str":1}]}],"tagi_wspolne":["kpp","medyczne dzialania ratownicze","zalozenia taktyczne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-01","strona":1,"sekcja":"Procedura nr 1"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Rozpoznanie miejsca zdarzenia: zabezpieczenie ratowników, identyfikacja zagrożeń, liczba poszkodowanych, potrzebne dodatkowe siły i środki, mechanizm zdarzenia. Dotarcie do poszkodowanego. Po wybranym wariancie — meldunek do Kierującego Działaniem Ratowniczym.\n2. WARIANTY PO DOTARCIU: Ewakuacja i podjęcie medycznych działań ratowniczych. Wykonanie dostępu do poszkodowanego i podjęcie medycznych działań ratowniczych. Podjęcie medycznych działań ratowniczych i przygotowanie do ewakuacji. Niepodjęcie medycznych działań ratowniczych — wg Zasad organizacji ratownictwa medycznego w KSRG, załącznik nr 10."},{"id":"KARTA-KPP-TONIECIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 16","data_aktualizacji":"","slowo_kluczowe":"toniecie kpp","keywords":["procedura 16 kpp","5 oddechow toniecie","wentylacja toniecie kpp"],"prefix":"KPP - toniecie.","content":"1. KOD / NAZWA: Procedura 16 - toniecie.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2. Oceniaj takze obecne objawy wychlodzenia.\n3. TLENOTERAPIA LUB WENTYLACJA: niezwlocznie rozpocznij tlenoterapie albo wentylacje.\n4. ZATRZYMANIE KRAZENIA: jezeli dojdzie do zatrzymania krazenia, RKO rozpoczyna sie od 5 oddechow ratowniczych, a nastepnie przechodzi do ucisniec klatki piersiowej zgodnie z procedura 3 lub 4.\n5. UWAGI OPERACYJNE: w tej procedurze od poczatku nalezy pamietac o wspolistniejacym ryzyku wychlodzenia.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","toniecie"],"aliasy":["procedura 16 kpp","5 oddechow toniecie","wentylacja toniecie kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-16","strona":1,"sekcja":"Procedura nr 16 - Tonięcie"}]},{"id":"KARTA-KPP-WSPARCIE-PSYCHICZNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 20","data_aktualizacji":"","slowo_kluczowe":"wsparcie psychiczne kpp","keywords":["procedura 20 kpp","psychologiczne wsparcie kpp","kontakt z poszkodowanym kpp"],"prefix":"KPP - zasady udzielania wsparcia psychicznego i psychologicznego.","content":"1. KOD / NAZWA: Procedura 20 - zasady udzielania wsparcia psychicznego i psychologicznego osobom uczestniczacym w dzialaniach ratowniczych.\n2. ORGANIZACJA DZIALANIA: rozpoznaj sytuacje i zaplanuj kolejnosc podejmowanych dzialan. Dbaj o bezpieczenstwo wlasne, kolegow i pozostalych uczestnikow. Chron siebie, kolegow i innych przed zbednymi obciazeniami.\n3. KONTAKT Z POSZKODOWANYM: nawiaz i utrzymuj kontakt z osoba poszkodowana. Przedstaw sie z imienia i funkcji, mow spokojnym tonem, utrzymuj kontakt wzrokowy, przed podjeciem dzialania powiedz co zamierzasz zrobic i pomagaj poszkodowanemu zorientowac sie w sytuacji. Poszukaj ostroznego kontaktu dotykowego.\n4. PRYWATNOSC I INFORMACJA: chron prywatnosc osoby poszkodowanej, zaslon ja przed gapiami, udzielaj informacji waznych dla poszkodowanego i nie przekazuj informacji, ktore moga jej zaszkodzic. Unikaj zbednych komentarzy, pochopnych diagnoz i ocen.\n5. WSPARCIE OTOCZENIA: organizuj wsparcie, wykorzystuj obecnosc innych osob, w tym rodziny, przyjaciol, sasiadow i osob bedacych na miejscu zdarzenia. Nie zostawiaj poszkodowanego samego.\n6. POSTAWA RATOWNIKA: obserwuj zachowania ludzi, badz czujny i wrazliwy, zachowaj spokoj i badz zdecydowany w dzialaniu.\n7. UWAGI OPERACYJNE: karta ma charakter wspierajacy i powinna byc stosowana rownolegle z medycznymi dzialaniami ratowniczymi.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","wsparcie psychiczne"],"aliasy":["procedura 20 kpp","psychologiczne wsparcie kpp","kontakt z poszkodowanym kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-20","strona":1,"sekcja":"Procedura nr 20 - Zasady udzielania wsparcia psychicznego i psychologicznego"}]},{"id":"KARTA-KPP-WYCHLODZENIE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 17","data_aktualizacji":"","slowo_kluczowe":"wychlodzenie kpp","keywords":["procedura 17 kpp","termoizolacja kpp","ocena oddechu 60 sekund"],"prefix":"KPP - wychlodzenie.","content":"1. KOD / NAZWA: Procedura 17 - wychlodzenie.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych, uwzgledniajac ocene oddechu i tetna przez 60 sekund.\n3. EWAKUACJA: ewakuuj poszkodowanego.\n4. MOKRA ODZIEZ: usun mokre elementy odziezy przez rozciecie oraz osusz skore, nie narazajac dodatkowo poszkodowanego na wychlodzenie i ruch.\n5. TERMOIZOLACJA: zastosuj termoizolacje.\n6. POZYCJA: uloz poszkodowanego w pozycji poziomej.\n7. UWAGI OPERACYJNE: w procedurze podkreslono ostrozne obchodzenie sie z poszkodowanym i wydluzona ocene funkcji zyciowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","wychlodzenie"],"aliasy":["procedura 17 kpp","termoizolacja kpp","ocena oddechu 60 sekund"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-17","strona":1,"sekcja":"Procedura nr 17 - Wychłodzenie"}]},{"id":"KARTA-KPP-STANY-NIEURAZOWE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 18","data_aktualizacji":"","slowo_kluczowe":"stany nieurazowe kpp","keywords":["zaburzenia krazeniowo oddechowe kpp","cialo obce kpp","procedura 18 kpp","pozycja polsiedzaca kpp"],"prefix":"KPP - zaburzenia krazeniowo-oddechowe w stanach nieurazowych.","content":"1. KOD / NAZWA: Procedura 18 - zaburzenia krazeniowo-oddechowe w stanach nieurazowych.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. BOL BRZUCHA: uloz poszkodowanego w pozycji lezacej z nogami ugietymi w kolanach.\n4. BOL W KLATCE PIERSIOWEJ LUB DUSZNOSC: uloz poszkodowanego w pozycji polsiedzacej.\n5. UTRATA SWIADOMOSCI: uloz poszkodowanego w pozycji bocznej ustalonej, czyli bezpiecznej.\n6. CIALO OBCE W DROGACH ODDECHOWYCH: najpierw zachecaj do kaszlu.\n7. KASZEL NIEEFEKTYWNY U DOROSLYCH I DZIECI: wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli sa nieefektywne - do 5 ucisniec nadbrzusza.\n8. KASZEL NIEEFEKTYWNY U NIEMOWLAT: wykonaj do 5 uderzen w okolice miedzy lopatkowa, a jesli sa nieefektywne - do 5 ucisniec klatki piersiowej.\n9. UWAGI OPERACYJNE: karta laczy postepowanie w kilku typowych stanach nieurazowych i zawiera uproszczony schemat przy ciele obcym w drogach oddechowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","stany nieurazowe"],"aliasy":["zaburzenia krazeniowo oddechowe kpp","cialo obce kpp","procedura 18 kpp","pozycja polsiedzaca kpp"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-18","strona":1,"sekcja":"Procedura nr 18 - Zaburzenia krążeniowo-oddechowe w stanach nieurazowych"}]},{"id":"KARTA-KPP-ZATRUCIE-WZIEWNE","kategoria":"dzialania","zrodlo":"Procedury ratownicze z zakresu kwalifikowanej pierwszej pomocy, Zalacznik nr 1, Procedura 15","data_aktualizacji":"","slowo_kluczowe":"zatrucie wziewne kpp","keywords":["procedura 15 kpp","ewakuacja ze strefy zagrozenia kpp","5 oddechow zatrucie wziewne"],"prefix":"KPP - zatrucie wziewne.","content":"1. KOD / NAZWA: Procedura 15 - zatrucie wziewne.\n2. START: wykonaj rozpoznanie miejsca zdarzenia i sekwencje medycznych dzialan ratowniczych z procedury 2.\n3. EWAKUACJA: ewakuuj poszkodowanego ze strefy zagrozenia, w miare mozliwosci z izolacja drog oddechowych.\n4. ODDECH: prowadz stala kontrole oddechu.\n5. TLENOTERAPIA LUB WENTYLACJA: niezwlocznie rozpocznij tlenoterapie albo wentylacje.\n6. ZATRZYMANIE KRAZENIA: jezeli dojdzie do zatrzymania krazenia, RKO rozpoczyna sie od 5 oddechow ratowniczych, a nastepnie przechodzi do ucisniec klatki piersiowej zgodnie z procedura 3 lub 4.\n7. UWAGI OPERACYJNE: dokument wskazuje rowniez rozwazenie mozliwosci uzycia dostepnego sprzetu nadglosniowego do udroznienia drog oddechowych.","tagi_wspolne":["kpp","medyczne dzialania ratownicze","zatrucie","zatrucie wziewne"],"aliasy":["procedura 15 kpp","ewakuacja ze strefy zagrozenia kpp","5 oddechow zatrucie wziewne"],"dokumenty_zrodlowe":[{"dokument_id":"doc-kpp-procedura-15","strona":1,"sekcja":"Procedura nr 15 - Zatrucie wziewne"}]},{"id":"KARTA-LOT-BSP-POCHODZENIA-MILITARNEGO","wzorzec":2,"kategoria":"dzialania","grupa":"cbrn","zrodlo":"PSP: Załącznik nr 1 — Wytyczne podczas zdarzeń z bezzałogowymi statkami powietrznymi pochodzenia militarnego, wersja 2 (aktualizacja na 7.09.2026) oraz prezentacja „BSP – zagrożenia” (7.09.2026); opublikowane na gov.pl przez KP PSP w Kościerzynie.","data_aktualizacji":"2026-10-27","slowo_kluczowe":"dron militarny","keywords":["bsp pochodzenia militarnego","bezzałogowy statek powietrzny militarny","dron wojskowy","znaleziony dron wojskowy","rozbity dron wojskowy","obiekt pochodzenia militarnego","dron z materiałami wybuchowymi","strefa 150 metrów dron","nie dotykaj drona militarnego","mz lotnicze dron"],"aliasy":["bsp pochodzenia militarnego","bezzałogowy statek powietrzny militarny","dron wojskowy","znaleziony dron wojskowy","rozbity dron wojskowy","obiekt pochodzenia militarnego","dron z materiałami wybuchowymi","strefa 150 metrów dron","nie dotykaj drona militarnego","mz lotnicze dron"],"prefix":"BSP (dron) o możliwym pochodzeniu militarnym — dojazd, strefa min. 150 m, rozpoznanie z dystansu, przekazanie Policji/SZ RP (wytyczne PSP, wersja 2 z 7.09.2026).","najpierw":[{"t":"Każde zgłoszenie niezwłocznie przekaż do nadrzędnego SK PSP; w SWD PSP flaga „Do wiadomości KG”, podrodzaj „MZ – Lotnicze”.","zr":"BSP v2 2026","str":1},{"t":"Nie dotykaj, nie ruszaj, nie przenoś — nawet poruszenie, odkręcenie śruby lub telefon komórkowy w pobliżu może spowodować detonację.","zr":"BSP v2 2026","str":1},{"t":"Wyznacz strefę niebezpieczną o promieniu co najmniej 150 m i ewakuuj z niej ludzi; 150 m to minimum — zwiększ wg obiektu, terenu i rozpoznania.","zr":"BSP v2 2026","str":2},{"t":"Bez bezpośredniego zagrożenia życia osób postronnych ratownicy nie zbliżają się do obiektu: „Jeżeli Ty widzisz bombę – bomba widzi Ciebie”.","zr":"BSP v2 2026","str":2}],"parametry":[{"nazwa":"Założenie wstępne","wartosc":"obiekt militarny z materiałem wybuchowym, możliwe systemy autodestrukcji (zapalniki czasowe)","zr":"BSP v2 2026","str":1},{"nazwa":"Strefa niebezpieczna","wartosc":"min. 150 m od obiektu — wartość minimalna","zr":"BSP v2 2026","str":2},{"nazwa":"Rozpoznanie","wartosc":"tylko z dystansu: lornetka, luneta, kamera lub telefon z zoomem, BSP jednostki","zr":"BSP v2 2026","str":2},{"nazwa":"Służba wiodąca","wartosc":"po przybyciu Policji lub SZ RP — formalnie przekaż im miejsce zdarzenia","zr":"BSP v2 2026","str":2}],"sekcje":[{"etykieta":"Dojazd i ustawienie sił","punkty":[{"t":"Dojazd planuj z uwzględnieniem kierunku i siły wiatru, ukształtowania terenu i możliwości rozprzestrzeniania aerozolu.","zr":"BSP v2 2026","str":1},{"t":"Pojazdy zatrzymaj poza strefą niebezpieczną, z możliwością natychmiastowego wycofania.","zr":"BSP v2 2026","str":1},{"t":"Punkt dowodzenia i punkt przyjęcia sił — po stronie nawietrznej, poza obszarem rażenia i skażenia.","zr":"BSP v2 2026","str":1},{"t":"Rozpraszaj siły: nie gromadź pojazdów w jednym punkcie ani na jednej osi dojazdu; wykorzystaj osłony terenowe i zabudowę.","zr":"BSP v2 2026","str":1},{"t":"Wyznacz obserwatora przestrzeni powietrznej; ustal sygnał alarmowy i miejsca ukrycia dla wszystkich działających.","zr":"BSP v2 2026","str":1}]},{"etykieta":"Zagrożenia","punkty":[{"t":"Obiekt może zawierać bojowe środki trujące lub inne substancje niebezpieczne.","zr":"BSP v2 2026","str":2},{"t":"Zakładaj skażenie CBRN każdego BSP do wykluczenia pomiarami; uprzedź inne służby — części BSP tylko w rękawiczkach.","zr":"BSP prez. 2026","str":3},{"t":"Możliwe środki: chloropikryna, malononitryl, nowiczoki; materiały promieniotwórcze (np. zubożony uran).","zr":"BSP prez. 2026","str":2},{"t":"Wybuch przy pożarze (ogrzanie zapalnika); w pobliżu upadku miny i urządzenia wybuchowe, także reagujące na drgania od kroków.","zr":"BSP prez. 2026","str":4},{"t":"Głowice 40–90 kg materiału wybuchowego; przy 90 kg zasięg odłamkowania ok. 1000 m.","zr":"BSP prez. 2026","str":7},{"t":"Możliwa aktywacja falami radiowymi i wtórne uderzenie w miejsce, gdzie zebrały się służby.","zr":"BSP prez. 2026","str":7},{"t":"Najgroźniejsze są BSP, które nie wybuchły lub nie spłonęły — ryzyko opóźnionej detonacji.","zr":"BSP prez. 2026","str":8}]},{"etykieta":"Ratowanie życia i organizacja","punkty":[{"t":"Przy bezpośrednim zagrożeniu poszkodowanych dopuszczalne działania poza wytycznymi, z zachowaniem ostrożności; zbliżaj się za osłonami lub z tarczą balistyczną.","zr":"BSP v2 2026","str":2},{"t":"Zdjęcia i filmy tylko służbowo; przekazuj wyłącznie służbową pocztą elektroniczną.","zr":"BSP v2 2026","str":2},{"t":"Wytyczne mogą być doprecyzowane na poziomie wojewódzkim lub powiatowym.","zr":"BSP v2 2026","str":3}]}],"nie_rob":[{"t":"Nie odłączaj baterii, nie obracaj, nie tnij przewodów, nie wchodź w pole widzenia kamery.","zr":"BSP prez. 2026","str":1},{"t":"Nie zbliżaj się z urządzeniami emitującymi fale radiowe.","zr":"BSP prez. 2026","str":7},{"t":"Nie publikuj materiałów w mediach społecznościowych ani prywatnych komunikatorach.","zr":"BSP v2 2026","str":2}],"tagi_wspolne":["bsp militarny","dron wojskowy","zagrożenie wybuchowe","mz lotnicze","strefa niebezpieczna 150 m"],"dokumenty_zrodlowe":[{"dokument_id":"doc-bsp-militarny-v2-2026","strona":1,"sekcja":"Wytyczne, wersja 2 (7.09.2026), pkt 1–8 (s. 1–3)"},{"dokument_id":"doc-bsp-prezentacja-2026","strona":1,"sekcja":"Prezentacja „BSP – zagrożenia” (s. 1–10)"}],"data_przegladu":"2026-10-27","content":"1. NAJPIERW: Każde zgłoszenie niezwłocznie przekaż do nadrzędnego SK PSP; w SWD PSP flaga „Do wiadomości KG”, podrodzaj „MZ – Lotnicze”. Nie dotykaj, nie ruszaj, nie przenoś — nawet poruszenie, odkręcenie śruby lub telefon komórkowy w pobliżu może spowodować detonację. Wyznacz strefę niebezpieczną o promieniu co najmniej 150 m i ewakuuj z niej ludzi; 150 m to minimum — zwiększ wg obiektu, terenu i rozpoznania. Bez bezpośredniego zagrożenia życia osób postronnych ratownicy nie zbliżają się do obiektu: „Jeżeli Ty widzisz bombę – bomba widzi Ciebie”.\n2. PARAMETRY: Założenie wstępne — obiekt militarny z materiałem wybuchowym, możliwe systemy autodestrukcji (zapalniki czasowe); Strefa niebezpieczna — min. 150 m od obiektu — wartość minimalna; Rozpoznanie — tylko z dystansu: lornetka, luneta, kamera lub telefon z zoomem, BSP jednostki; Służba wiodąca — po przybyciu Policji lub SZ RP — formalnie przekaż im miejsce zdarzenia\n3. DOJAZD I USTAWIENIE SIŁ: Dojazd planuj z uwzględnieniem kierunku i siły wiatru, ukształtowania terenu i możliwości rozprzestrzeniania aerozolu. Pojazdy zatrzymaj poza strefą niebezpieczną, z możliwością natychmiastowego wycofania. Punkt dowodzenia i punkt przyjęcia sił — po stronie nawietrznej, poza obszarem rażenia i skażenia. Rozpraszaj siły: nie gromadź pojazdów w jednym punkcie ani na jednej osi dojazdu; wykorzystaj osłony terenowe i zabudowę. Wyznacz obserwatora przestrzeni powietrznej; ustal sygnał alarmowy i miejsca ukrycia dla wszystkich działających.\n4. ZAGROŻENIA: Obiekt może zawierać bojowe środki trujące lub inne substancje niebezpieczne. Zakładaj skażenie CBRN każdego BSP do wykluczenia pomiarami; uprzedź inne służby — części BSP tylko w rękawiczkach. Możliwe środki: chloropikryna, malononitryl, nowiczoki; materiały promieniotwórcze (np. zubożony uran). Wybuch przy pożarze (ogrzanie zapalnika); w pobliżu upadku miny i urządzenia wybuchowe, także reagujące na drgania od kroków. Głowice 40–90 kg materiału wybuchowego; przy 90 kg zasięg odłamkowania ok. 1000 m. Możliwa aktywacja falami radiowymi i wtórne uderzenie w miejsce, gdzie zebrały się służby. Najgroźniejsze są BSP, które nie wybuchły lub nie spłonęły — ryzyko opóźnionej detonacji.\n5. RATOWANIE ŻYCIA I ORGANIZACJA: Przy bezpośrednim zagrożeniu poszkodowanych dopuszczalne działania poza wytycznymi, z zachowaniem ostrożności; zbliżaj się za osłonami lub z tarczą balistyczną. Zdjęcia i filmy tylko służbowo; przekazuj wyłącznie służbową pocztą elektroniczną. Wytyczne mogą być doprecyzowane na poziomie wojewódzkim lub powiatowym.\n6. NIE RÓB: Nie odłączaj baterii, nie obracaj, nie tnij przewodów, nie wchodź w pole widzenia kamery. Nie zbliżaj się z urządzeniami emitującymi fale radiowe. Nie publikuj materiałów w mediach społecznościowych ani prywatnych komunikatorach."},{"id":"KARTA-OLIOC-GRUDZIEŃ-04-LEKI_HIGIENA","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Przygotuj siebie i najbliższych; Poradnik bezpieczeństwa - Higiena w kryzysie; Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc leki i higiena na kryzys","keywords":["apteczka i leki na 72 godziny","środki higieny podczas kryzysu","dokumentacja medyczna i alergie kryzys"],"prefix":"OLiOC - grudzień: leki, zdrowie i higiena w domowych zapasach.","content":"1. Zgromadź stale przyjmowane leki, podstawową apteczkę oraz listę dawkowania, chorób i alergii.\n2. Dokumentację medyczną i recepty przechowuj w jednym miejscu, dostępnym dla zaufanej osoby.\n3. Przygotuj środki higieny osobistej, dezynfekcji, rękawiczki, papier, worki i artykuły menstruacyjne.\n4. Uwzględnij okulary, baterie do aparatów słuchowych, sensory, sprzęt stomijny i inne urządzenia wspomagające.\n5. Kontroluj temperaturę oraz warunki przechowywania leków; nie używaj produktów po terminie.\n6. Nie gromadź leków na receptę bez uzgodnienia z lekarzem lub farmaceutą.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","leki","higiena","zdrowie"],"aliasy":["apteczka i leki na 72 godziny","środki higieny podczas kryzysu","dokumentacja medyczna i alergie kryzys"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-przygotuj-siebie","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-higiena","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-06-ROTACJA_ZAPASOW","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Plan na kryzys; Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout)","slowo_kluczowe":"olioc kontrola i rotacja zapasów","keywords":["jak sprawdzać domowe zapasy kryzysowe","terminy ważności zapasów 72 godziny","lista kontrolna zestawu awaryjnego"],"prefix":"OLiOC - grudzień: przechowywanie, kontrola i rotacja zapasów.","content":"1. Sporządź listę zapasów z ilością, miejscem przechowywania i terminem ważności.\n2. Kontroluj zestaw co najmniej dwa razy w roku oraz po każdym użyciu.\n3. Produkty z najkrótszym terminem zużywaj na co dzień i od razu zastępuj nowymi.\n4. Sprawdzaj baterie, powerbanki, latarki, radio, gaśnicę, czujki i stan pojemników.\n5. Przechowuj zapasy w suchym, chłodnym miejscu, zabezpieczonym przed dziećmi, wilgocią i szkodnikami.\n6. Raz w roku przeprowadź rodzinny trening 24 godzin z ograniczonym dostępem do prądu, wody i internetu.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","rotacja zapasów","lista kontrolna"],"aliasy":["jak sprawdzać domowe zapasy kryzysowe","terminy ważności zapasów 72 godziny","lista kontrolna zestawu awaryjnego"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-05-SZCZEGOLNE_POTRZEBY_ZAPASY","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Osoby potrzebujące szczególnej pomocy; Poradnik bezpieczeństwa - Zadbaj o zwierzęta","slowo_kluczowe":"olioc zapasy dla dzieci seniorów zwierząt","keywords":["specjalne potrzeby zapasy kryzysowe","żywność niemowlęca i pieluchy kryzys","karma leki zwierzęta 72 godziny"],"prefix":"OLiOC - grudzień: zapasy dla dzieci, seniorów, osób zależnych i zwierząt.","content":"1. Dla niemowląt przygotuj żywność, wodę do jej przygotowania, pieluchy, środki pielęgnacji i ubrania.\n2. Dla seniorów i osób chorych uwzględnij leki, dietę, baterie, sprzęt pomocniczy i plan transportu.\n3. Przygotuj kartę z kontaktem do opiekuna i najważniejszymi informacjami medycznymi.\n4. Dla zwierząt przygotuj karmę, wodę, leki, transporter, smycz, dokumentację i dane właściciela.\n5. Zapasy i plecak osoby zależnej omów z nią oraz z opiekunem - nie zakładaj potrzeb bez konsultacji.\n6. Powiadom zaufane osoby, gdzie znajdują się zapasy i jak udzielić wsparcia.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","dzieci","seniorzy","zwierzęta","szczególne potrzeby"],"aliasy":["specjalne potrzeby zapasy kryzysowe","żywność niemowlęca i pieluchy kryzys","karma leki zwierzęta 72 godziny"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-szczegolna-pomoc","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-zwierzeta","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-02-ZAPAS_WODY","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout); Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc zapas wody 3 litry","keywords":["ile wody na osobę na dobę kryzys","woda na 72 godziny","przechowywanie wody awaryjnej"],"prefix":"OLiOC - grudzień: zapas wody dla rodziny.","content":"1. Przygotuj co najmniej 3 litry wody na osobę na każdą dobę, czyli minimum 9 litrów na 72 godziny.\n2. Dodaj wodę dla zwierząt oraz większy zapas przy upałach, chorobach i szczególnych potrzebach.\n3. Przechowuj wodę w szczelnych, czystych pojemnikach przeznaczonych do żywności, z dala od słońca i chemikaliów.\n4. Oznacz datę zakupu lub napełnienia i stosuj rotację zgodnie z terminem producenta.\n5. Oddziel wodę pitną od wody technicznej do mycia i spłukiwania.\n6. Po komunikacie o skażeniu lub zakazie spożycia korzystaj wyłącznie ze źródeł wskazanych przez władze i sanepid.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","zapas wody","woda na kryzys"],"aliasy":["ile wody na osobę na dobę kryzys","woda na 72 godziny","przechowywanie wody awaryjnej"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-03-ZAPAS_ZYWNOSCI","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout); Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc żywność na 72 godziny","keywords":["jedzenie na trzy dni bez gotowania","produkty do zapasu kryzysowego","żywność gotowa do spożycia blackout"],"prefix":"OLiOC - grudzień: zapas żywności na 72 godziny.","content":"1. Wybieraj produkty trwałe, gotowe do spożycia lub wymagające niewielkiej ilości wody i energii.\n2. Przygotuj żywność zgodną z dietą domowników, alergiami i możliwościami gryzienia lub połykania.\n3. Miej ręczny otwieracz do puszek oraz bezpieczne naczynia i sztućce.\n4. Nie opieraj całego zapasu na produktach bardzo słonych, które zwiększają zapotrzebowanie na wodę.\n5. Zapisz prosty jadłospis na 3 dni, aby znać rzeczywistą ilość potrzebnych produktów.\n6. Stosuj zasadę: kup, używaj, uzupełniaj - nie dopuszczaj do przeterminowania zapasów.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","zapas żywności","żywność bez gotowania"],"aliasy":["jedzenie na trzy dni bez gotowania","produkty do zapasu kryzysowego","żywność gotowa do spożycia blackout"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-GRUDZIEŃ-01-ZAPASY_72H","kategoria":"olioc","miesiac_akademii":"grudzień","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Akademia OLiOC - program „jeden miesiąc - jeden temat”; Poradnik bezpieczeństwa - Plan na kryzys; Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout)","slowo_kluczowe":"olioc zapasy na 72 godziny","keywords":["domowy zestaw kryzysowy trzy dni","co przygotować na 72 godziny","zapasy rodziny na sytuację kryzysową"],"prefix":"OLiOC - grudzień: domowe zapasy na pierwsze 72 godziny.","content":"1. Policz liczbę domowników i przygotuj zapasy na minimum 3 pełne doby.\n2. Uwzględnij wodę, żywność, leki, higienę, oświetlenie, łączność, ogrzewanie i gotówkę.\n3. Dostosuj zapasy do wieku, zdrowia, alergii, diety, urządzeń medycznych i zwierząt.\n4. Przechowuj rzeczy w kilku bezpiecznych miejscach, dostępnych także po uszkodzeniu części domu.\n5. Nie kupuj jednorazowo przypadkowych produktów - wybieraj rzeczy, których rodzina używa na co dzień.\n6. Raz na pół roku przeprowadź kontrolę, uzupełnij zużyte elementy i przećwicz funkcjonowanie bez mediów.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC grudzień","72 godziny","zapasy domowe"],"aliasy":["domowy zestaw kryzysowy trzy dni","co przygotować na 72 godziny","zapasy rodziny na sytuację kryzysową"],"dokumenty_zrodlowe":[{"dokument_id":"src-olioc-akademia","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LIPIEC-02-KOMUNIKATY_OSTRZEGAWCZE","kategoria":"olioc","miesiac_akademii":"lipiec","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Sygnały alarmowe i komunikaty ostrzegawcze","slowo_kluczowe":"olioc alert rcb i rso","keywords":["komunikat ostrzegawczy na telefon","regionalny system ostrzegania olioc","jak reagować na alert rcb"],"prefix":"OLiOC - lipiec: Alert RCB, RSO i komunikaty ostrzegawcze.","content":"1. Przeczytaj cały komunikat: rodzaj zagrożenia, obszar, czas i wymagane działanie.\n2. Sprawdź, czy komunikat dotyczy miejsca, w którym jesteś lub do którego zmierzasz.\n3. Wykonaj polecenia bez zwłoki, zwłaszcza dotyczące ewakuacji, pozostania w budynku lub zabezpieczenia mienia.\n4. Przekaż informację domownikom i osobom, które mogą nie mieć telefonu lub dostępu do mediów.\n5. Nie odpowiadaj na Alert RCB i nie klikaj linków z nieznanych wiadomości podszywających się pod służby.\n6. Aktualizacje sytuacji sprawdzaj w oficjalnych kanałach rządowych, samorządowych i służb.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC lipiec","Alert RCB","RSO","komunikaty ostrzegawcze"],"aliasy":["komunikat ostrzegawczy na telefon","regionalny system ostrzegania olioc","jak reagować na alert rcb"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-alarmy","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LIPIEC-04-OFICJALNE_ZRODLA","kategoria":"olioc","miesiac_akademii":"lipiec","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Sygnały alarmowe i komunikaty ostrzegawcze; Poradnik bezpieczeństwa - Zagrożenia cyfrowe","slowo_kluczowe":"olioc oficjalne źródła informacji","keywords":["gdzie sprawdzać informacje o zagrożeniu","wiarygodne komunikaty podczas kryzysu","radio rso alert rcb informacje"],"prefix":"OLiOC - lipiec: oficjalne źródła informacji podczas kryzysu.","content":"1. Korzystaj z Alertów RCB, RSO, stron gov.pl, urzędu wojewódzkiego, gminy i oficjalnych profili służb.\n2. Słuchaj radia i telewizji publicznej, zwłaszcza gdy internet działa niestabilnie.\n3. Sprawdź tę samą informację w co najmniej dwóch oficjalnych kanałach.\n4. Zwracaj uwagę na datę, godzinę, obszar obowiązywania i autora komunikatu.\n5. Nie przekazuj dalej zrzutów ekranu bez linku do źródła i informacji o czasie publikacji.\n6. W razie braku internetu używaj radia bateryjnego i lokalnych komunikatów głosowych.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC lipiec","wiarygodne informacje","komunikacja kryzysowa"],"aliasy":["gdzie sprawdzać informacje o zagrożeniu","wiarygodne komunikaty podczas kryzysu","radio rso alert rcb informacje"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-alarmy","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-cyfrowe","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LIPIEC-03-REAKCJA_PO_ALARMIE","kategoria":"olioc","miesiac_akademii":"lipiec","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Sygnały alarmowe i komunikaty ostrzegawcze; Poradnik bezpieczeństwa - Plan na kryzys","slowo_kluczowe":"olioc co robić po alarmie","keywords":["pierwsze działania po syrenie alarmowej","reakcja obywatela na alarm","postępowanie po komunikacie ostrzegawczym"],"prefix":"OLiOC - lipiec: co zrobić natychmiast po ogłoszeniu alarmu.","content":"1. Zachowaj spokój i ustal, czego dotyczy alarm.\n2. Zbierz domowników, uruchom rodzinny plan i przygotuj telefon, radio, dokumenty oraz plecak.\n3. Zależnie od komunikatu: pozostań w budynku, uszczelnij pomieszczenie, przejdź do schronienia albo rozpocznij ewakuację.\n4. Pomóż dzieciom, seniorom i osobom wymagającym wsparcia.\n5. Ogranicz połączenia telefoniczne i korzystanie z sieci, aby nie przeciążać łączności.\n6. Nie opuszczaj bezpiecznego miejsca, dopóki nie usłyszysz odwołania alarmu albo polecenia służb.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC lipiec","reakcja na alarm","bezpieczeństwo rodziny"],"aliasy":["pierwsze działania po syrenie alarmowej","reakcja obywatela na alarm","postępowanie po komunikacie ostrzegawczym"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-alarmy","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-plan","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LIPIEC-01-SYGNALY_ALARMOWE","kategoria":"olioc","miesiac_akademii":"lipiec","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Akademia OLiOC - program „jeden miesiąc - jeden temat”; Poradnik bezpieczeństwa - Sygnały alarmowe i komunikaty ostrzegawcze","slowo_kluczowe":"olioc sygnały alarmowe","keywords":["modulowany dźwięk syreny trzy minuty","jednostajny dźwięk syreny odwołanie alarmu","jak rozpoznać alarm syreną"],"prefix":"OLiOC - lipiec: sygnały alarmowe i ich znaczenie.","content":"1. Ogłoszenie alarmu: modulowany dźwięk syreny trwający 3 minuty.\n2. Odwołanie alarmu: ciągły, jednostajny dźwięk syreny trwający 3 minuty.\n3. Po usłyszeniu syreny przerwij wykonywane czynności i sprawdź oficjalny komunikat.\n4. Włącz radio, telewizję lub oficjalny serwis internetowy; sprawdź Alert RCB i RSO.\n5. Nie dzwoń na 112 tylko po to, aby zapytać o znaczenie syreny - numer musi pozostać dostępny dla osób zagrożonych.\n6. Ćwiczenia syren są wcześniej zapowiadane; podczas rzeczywistego alarmu wykonuj polecenia władz i służb.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC lipiec","alarmowanie","syreny alarmowe"],"aliasy":["modulowany dźwięk syreny trzy minuty","jednostajny dźwięk syreny odwołanie alarmu","jak rozpoznać alarm syreną"],"dokumenty_zrodlowe":[{"dokument_id":"src-olioc-akademia","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-poradnik-alarmy","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LISTOPAD-07-AGREGAT","kategoria":"olioc","miesiac_akademii":"listopad","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout); PSP - bezpieczeństwo podczas korzystania z agregatu prądotwórczego","slowo_kluczowe":"olioc agregat prądotwórczy bezpieczeństwo","keywords":["agregat musi pracować na zewnątrz","spaliny z agregatu czad","awaryjne zasilanie domu agregat"],"prefix":"OLiOC - listopad: bezpieczne korzystanie z agregatu prądotwórczego.","content":"1. Agregat spalinowy uruchamiaj wyłącznie na zewnątrz pomieszczeń, z dala od okien, drzwi i nawiewów.\n2. Ustaw go stabilnie i tak, aby spaliny nie mogły przedostać się do budynku ani zagrozić innym osobom.\n3. Stosuj instrukcję producenta, właściwe paliwo i sprawne przewody o odpowiedniej obciążalności.\n4. Nie podłączaj agregatu samodzielnie do instalacji budynku przez zwykłe gniazdko; stałe podłączenie powinien wykonać uprawniony specjalista.\n5. Tankuj dopiero po wyłączeniu i ostygnięciu urządzenia; paliwo przechowuj w przeznaczonych pojemnikach.\n6. W budynku używaj czujki tlenku węgla i natychmiast reaguj na jej alarm.","tagi_wspolne":["OLiOC","ochrona ludności","edukacja obywatelska","Akademia OLiOC listopad","agregat prądotwórczy","awaryjne zasilanie"],"aliasy":["agregat musi pracować na zewnątrz","spaliny z agregatu czad","awaryjne zasilanie domu agregat"],"dokumenty_zrodlowe":[{"dokument_id":"src-poradnik-blackout","strona":1,"sekcja":"Oficjalne źródło internetowe"},{"dokument_id":"src-psp-agregat-na-zewnatrz","strona":1,"sekcja":"Oficjalne źródło internetowe"}]},{"id":"KARTA-OLIOC-LISTOPAD-01-BLACKOUT_PIERWSZE_DZIALANIA","kategoria":"olioc","miesiac_akademii":"listopad","grupa_docelowa":"obywatel","status_zrodla":"oficjalne","data_aktualizacji":"2026-07-17","data_weryfikacji_zrodel":"2026-07-17","zrodlo":"Akademia OLiOC - program „jeden miesiąc - jeden temat”; Poradnik bezpieczeństwa - Długotrwały brak prądu (blackout)","slowo_kl
