        function simplifyCategoryQuery(value) {
            const ignored = new Set([
                "procedura",
                "procedury",
                "pokaz",
                "pokaz mi",
                "znajdz",
                "wyszukaj",
                "szukaj",
                "dotyczace",
                "dotyczaca",
                "dotyczacy",
                "zagadnienie",
                "zagadnienia",
                "temat",
                "tematy"
            ]);

            const tokens = normalizeText(value)
                .split(" ")
                .filter(Boolean);

            const filtered = tokens.filter(token => !ignored.has(token));
            return filtered.join(" ");
        }

        function findLocalCategoryMatches(query) {
            const normalizedQuery = normalizeText(query);
            const simplifiedQuery = simplifyCategoryQuery(query);

            let rule = LOCAL_CATEGORY_RULES.find(item =>
                item.queries.some(candidate => {
                    const normalizedCandidate = normalizeText(candidate);
                    return (
                        normalizedQuery === normalizedCandidate ||
                        simplifiedQuery === normalizedCandidate
                    );
                })
            );

            if (!rule) {
                const stems = new Set(
                    normalizedQuery
                        .split(" ")
                        .filter(Boolean)
                        .map(normalizeSearchStem)
                );

                let anchor = "";

                if (stems.has("skazen") && stems.has("chem")) {
                    anchor = "chemia";
                } else if (
                    stems.has("skazen") &&
                    stems.has("biolog")
                ) {
                    anchor = "biologia";
                } else if (
                    stems.has("skazen") &&
                    (
                        stems.has("radiac") ||
                        stems.has("radiolog") ||
                        stems.has("promieniow") ||
                        stems.has("promieniotw")
                    )
                ) {
                    anchor = "radiacja";
                }

                if (anchor) {
                    rule = LOCAL_CATEGORY_RULES.find(item =>
                        item.queries.some(candidate =>
                            normalizeText(candidate) === anchor
                        )
                    );
                }
            }

            if (!rule) return [];

            return rule.ids
                .map(id => state.procedury.find(item => item.id === id))
                .filter(Boolean);
        }

        function normalizeSearchStem(token) {
            const value = normalizeText(token);
            if (!value) return "";

            const families = [
                [/^chemi/, "chem"],
                [/^biolog/, "biolog"],
                [/^radiac/, "radiac"],
                [/^radiolog/, "radiolog"],
                [/^promieniow/, "promieniow"],
                [/^promieniotw/, "promieniotw"],
                [/^ewakuac/, "ewakuac"],
                [/^pozar/, "pozar"],
                [/^medycz/, "medycz"],
                [/^oparzen/, "oparzen"],
                [/^zatruc/, "zatruc"],
                [/^wybuch/, "wybuch"],
                [/^skazen/, "skazen"],
                [/^dekontamin/, "dekontamin"],
                [/^alarm/, "alarm"],
                [/^schron/, "schron"]
            ];

            for (const [pattern, stem] of families) {
                if (pattern.test(value)) return stem;
            }

            return value;
        }

        function getComparableTokens(value, stopWords) {
            return new Set(
                normalizeText(value)
                    .split(" ")
                    .filter(token =>
                        token.length > 2 &&
                        !stopWords.has(token)
                    )
                    .map(normalizeSearchStem)
                    .filter(Boolean)
            );
        }

        function scoreLocalProcedure(query, procedure) {
            const normalizedQuery = normalizeText(query);
            const primary = normalizeText(procedure.slowo_kluczowe || "");
            const aliases = (procedure.aliasy || procedure.keywords || [])
                .map(normalizeText)
                .filter(Boolean);
            const tags = getSharedTags(procedure);
            const prefix = normalizeText(procedure.prefix || "");

            const stopWords = new Set([
                "oraz", "lub", "przy", "dla", "bez", "pod", "nad",
                "jak", "czy", "sie", "jest", "jaka", "jakie", "prosze",
                "pokaz", "znajdz", "wyszukaj", "szukaj", "procedura",
                "procedury", "temat", "zagadnienie"
            ]);

            let score = 0;

            if (primary && containsNormalizedPhrase(normalizedQuery, primary)) {
                score += 280;
            }

            aliases.forEach(alias => {
                if (containsNormalizedPhrase(normalizedQuery, alias)) {
                    score += 220;
                }
            });

            tags.forEach(tag => {
                if (containsNormalizedPhrase(normalizedQuery, tag)) {
                    score += 95;
                }
            });

            if (
                normalizedQuery.length >= 5 &&
                containsNormalizedPhrase(prefix, normalizedQuery)
            ) {
                score += 100;
            }

            const queryTokens = getComparableTokens(
                normalizedQuery,
                stopWords
            );

            const procedureTokens = getComparableTokens(
                [primary, prefix, ...aliases, ...tags].join(" "),
                stopWords
            );

            let matchedTokens = 0;

            queryTokens.forEach(token => {
                if (!procedureTokens.has(token)) return;
                matchedTokens += 1;
                score += token.length >= 6 ? 24 : 16;
            });

            if (
                queryTokens.size > 0 &&
                matchedTokens === queryTokens.size
            ) {
                score += 45;
            }

            return score;
        }

        function findLocalMatches(query) {
            const normalizedQuery = normalizeText(query);

            if (!normalizedQuery) {
                return {
                    kind: "none",
                    procedures: [],
                    source: "Brak"
                };
            }

            const categoryMatches = findLocalCategoryMatches(query);

            if (categoryMatches.length) {
                return {
                    kind: "category",
                    procedures: categoryMatches,
                    source: "Kategoria lokalna"
                };
            }

            const exactTagMatches = state.procedury.filter(procedure =>
                getSharedTags(procedure).includes(normalizedQuery)
            );

            if (exactTagMatches.length) {
                return {
                    kind: "tag",
                    procedures: exactTagMatches,
                    source: "Hasło wspólne"
                };
            }

            const exactDirectMatches = state.procedury.filter(procedure =>
                getDirectTerms(procedure).includes(normalizedQuery)
            );

            if (exactDirectMatches.length) {
                return {
                    kind: "direct",
                    procedures: exactDirectMatches,
                    source: "Hasło bezpośrednie"
                };
            }

            const ranked = state.procedury
                .map(procedure => ({
                    procedure,
                    score: scoreLocalProcedure(query, procedure)
                }))
                .filter(result => result.score >= 40)
                .sort((a, b) => b.score - a.score);

            if (!ranked.length) {
                return {
                    kind: "none",
                    procedures: [],
                    source: "Brak"
                };
            }

            const topScore = ranked[0].score;
            const secondScore = ranked[1]?.score || 0;

            // Wyrazny zwyciezca lokalny: wynik wysoki i co najmniej 2x lepszy
            // od drugiego. Wtedy AI nie jest potrzebne (oszczednosc tokenow).
            if (
                topScore >= LOCAL_CONFIDENT_MIN_SCORE &&
                topScore >= secondScore * LOCAL_CONFIDENT_MIN_RATIO
            ) {
                return {
                    kind: "confident",
                    procedures: [ranked[0].procedure],
                    source: "Lokalna baza"
                };
            }

            const selected = ranked
                .filter(result =>
                    result.score >= Math.max(40, topScore * 0.55)
                )
                .slice(0, 8)
                .map(result => result.procedure);

            return {
                kind: selected.length === 1 ? "single" : "multiple",
                procedures: selected,
                source: "Lokalna baza"
            };
        }

        const AI_QUERY_HINTS = [
            {
                pattern: /\b(tesla|nissan leaf|renault zoe|bmw i[0-9]|pojazd elektrycz|samochod elektrycz|auto elektrycz|bateria trakcyj|akumulator trakcyj|ev)\b/i,
                terms: [
                    "pojazd elektryczny",
                    "bateria trakcyjna",
                    "pozar pojazdu elektrycznego",
                    "wypadek pojazdu elektrycznego",
                    "dezaktywacja pojazdu elektrycznego"
                ]
            },
            {
                pattern: /\b(dron wojsk|dron militar|bsp militar|bezzalogowy statek powietrzny|rozbity dron|znaleziony dron|obiekt latajacy wojsk)\b/i,
                terms: [
                    "bsp pochodzenia militarnego",
                    "dron wojskowy",
                    "mz lotnicze",
                    "material wybuchowy",
                    "strefa 150 metrow"
                ]
            },
            {
                pattern: /\b(nie oddycha|brak oddechu|bez oddechu|zatrzymanie krazenia|nieprzytomn|rko|resuscytac)\b/i,
                terms: [
                    "kwalifikowana pierwsza pomoc",
                    "rko",
                    "resuscytacja",
                    "drogi oddechowe",
                    "poszkodowany nieprzytomny"
                ]
            },
            {
                pattern: /\b(beczka|kanister|mauzer|opary|ostry zapach|dziwny zapach|nieznana substancja|rozlewisko|wyciek chem|skazenie chem)\b/i,
                terms: [
                    "zdarzenie chemiczne",
                    "substancja niebezpieczna",
                    "rozpoznanie chemiczne",
                    "strefa zagrozenia",
                    "dekontaminacja"
                ]
            },
            {
                pattern: /\b(proszek w kopercie|podejrzana przesylka|nieznany proszek|pakunek cbr|przesylka cbr)\b/i,
                terms: [
                    "podejrzana przesylka cbr",
                    "zagrozenie biologiczne",
                    "zagrozenie chemiczne"
                ]
            },
            {
                pattern: /\b(promieniowanie|radiac|radiolog|promieniotw|zrodlo izotopowe)\b/i,
                terms: [
                    "zdarzenie radiacyjne",
                    "zagrozenie radiologiczne",
                    "promieniowanie jonizujace"
                ]
            },
            {
                pattern: /\b(biolog|zakazenie|epidem|ptasia grypa|material biologiczny)\b/i,
                terms: [
                    "zdarzenie biologiczne",
                    "zagrozenie biologiczne",
                    "dekontaminacja biologiczna"
                ]
            },
            {
                pattern: /\b(zawalen|gruzowisko|katastrofa budowlan|runal budynek|zawalil sie budynek)\b/i,
                terms: [
                    "katastrofa budowlana",
                    "zawalenie",
                    "gruzowisko",
                    "ewakuacja"
                ]
            },
            { pattern: /\b(amoniak|nh3)\b/i, terms: ["amoniak", "nh3", "toksyczny gaz"] },
            { pattern: /\b(siarkowodor|h2s)\b/i, terms: ["siarkowodor", "h2s", "toksyczny gaz"] },
            { pattern: /\b(acetylen|butla acetylenowa)\b/i, terms: ["acetylen", "butla acetylenowa", "zagrozenie wybuchowe"] },
            { pattern: /\b(lng|gaz ziemny skroplony)\b/i, terms: ["lng", "gaz ziemny skroplony"] },
            { pattern: /\b(lpg|propan butan|gaz plynny)\b/i, terms: ["lpg", "propan butan", "gaz plynny"] }
        ];

        function expandAiQuery(query) {
            const additions = [];
            AI_QUERY_HINTS.forEach(hint => {
                if (hint.pattern.test(query)) additions.push(...hint.terms);
            });
            return [query, ...additions].join(" ");
        }

        function scoreAiCandidate(query, procedure) {
            const expandedQuery = expandAiQuery(query);
            const normalizedExpanded = normalizeText(expandedQuery);
            const aliases = procedure.aliasy || procedure.keywords || [];
            const tags = getSharedTags(procedure);
            const searchable = normalizeText([
                procedure.id || "",
                procedure.slowo_kluczowe || "",
                procedure.prefix || "",
                procedure.kategoria || "",
                ...aliases,
                ...tags,
                String(procedure.content || "").slice(0, 1600)
            ].join(" "));

            const stopWords = new Set([
                "oraz", "lub", "przy", "dla", "bez", "pod", "nad",
                "jak", "czy", "sie", "jest", "jaka", "jakie", "prosze",
                "pokaz", "znajdz", "wyszukaj", "szukaj", "procedura",
                "procedury", "temat", "zagadnienie", "mamy", "miejsce"
            ]);

            let score = scoreLocalProcedure(query, procedure);
            const tokens = getComparableTokens(normalizedExpanded, stopWords);

            tokens.forEach(token => {
                if (token && searchable.includes(token)) {
                    score += token.length >= 7 ? 20 : 12;
                }
            });

            AI_QUERY_HINTS.forEach(hint => {
                if (!hint.pattern.test(query)) return;
                const matches = hint.terms.filter(term =>
                    searchable.includes(normalizeText(term))
                ).length;
                score += matches * 45;
            });

            const normalizedId = normalizeText(procedure.id || "");
            if (
                normalizedExpanded.split(" ").some(token =>
                    token.length >= 4 && normalizedId.includes(token)
                )
            ) {
                score += 20;
            }

            return score;
        }

        function buildAiCandidatePool(query, limit = MAX_AI_CANDIDATES) {
            const categoryIds = new Set(
                findLocalCategoryMatches(query).map(item => item.id)
            );

            return state.procedury
                .map((procedure, index) => ({
                    procedure,
                    index,
                    score:
                        scoreAiCandidate(query, procedure) +
                        (categoryIds.has(procedure.id) ? 500 : 0)
                }))
                .sort((a, b) => b.score - a.score || a.index - b.index)
                .slice(0, limit)
                .map(({ procedure }) => {
                    const title =
                        procedure.prefix ||
                        procedure.slowo_kluczowe ||
                        procedure.id;

                    return {
                        id: procedure.id,
                        title,
                        category: procedure.kategoria || "",
                        summary: procedure.prefix || "",
                        keywords: buildAiKeywords(procedure, title)
                    };
                });
        }

        // Slowa kluczowe bez powtorzen: pomija duplikaty (bez wzgledu na
        // wielkosc liter i polskie znaki) oraz frazy zawarte juz w tytule,
        // ktory model i tak dostaje. Model nie traci zadnej informacji.
        function buildAiKeywords(procedure, title) {
            const seen = new Set();
            const result = [];

            [
                procedure.slowo_kluczowe || "",
                ...(procedure.aliasy || procedure.keywords || []),
                ...getSharedTags(procedure)
            ].forEach(value => {
                const text = String(value || "").trim();
                const normalized = normalizeText(text);
                if (!normalized || seen.has(normalized)) return;
                seen.add(normalized);
                if (containsNormalizedPhrase(title, normalized)) return;
                result.push(text);
            });

            return result.slice(0, AI_MAX_KEYWORDS);
        }

        function getFriendlyAiError(error) {
            const raw = String(error?.message || error || "").toLowerCase();
            const status = Number(error?.status || 0);

            if (
                error?.name === "AbortError" ||
                raw.includes("przekroczono czas") ||
                raw.includes("timeout")
            ) {
                return "Wsparcie AI przekroczyło czas oczekiwania. Wyszukiwanie lokalne nadal działa.";
            }
            if (status === 401 || status === 403) {
                return "Worker nie ma dostępu do OpenAI. Sprawdź sekret OPENAI_API_KEY.";
            }
            if (status === 429 || raw.includes("limit")) {
                return "Limit zapytań AI został chwilowo osiągnięty. Wyszukiwanie lokalne nadal działa.";
            }
            if (
                status === 502 ||
                status === 503 ||
                status === 504 ||
                raw.includes("przeciąż") ||
                raw.includes("unavailable")
            ) {
                return "Model AI jest chwilowo niedostępny. Wyszukiwanie lokalne nadal działa.";
            }
            if (
                raw.includes("failed to fetch") ||
                raw.includes("networkerror") ||
                raw.includes("network request failed")
            ) {
                return "Brak połączenia z Cloudflare Workerem. Wyszukiwanie lokalne nadal działa.";
            }
            return "Wsparcie AI jest chwilowo niedostępne. Wyszukiwanie lokalne nadal działa.";
        }

        async function fetchJsonWithTimeout(url, options, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                const rawText = await response.text();
                let data = {};
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (error) {
                    data = { raw: rawText.slice(0, 500) };
                }
                return { response, data };
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function testAiConnection() {
            if (apiStatusText) {
                apiStatusText.textContent =
                    "Sprawdzam połączenie z Cloudflare Worker...";
            }

            try {
                const { response, data } = await fetchJsonWithTimeout(
                    AI_PROXY_HEALTH_URL,
                    { method: "GET", cache: "no-store" },
                    8000
                );

                if (!response.ok || !data?.ok) {
                    const error = new Error(
                        data?.error || `Worker HTTP ${response.status}`
                    );
                    error.status = response.status;
                    throw error;
                }

                state.aiAvailable = true;
                if (apiStatusText) {
                    apiStatusText.textContent = data?.secretConfigured
                        ? "Połączenie działa. Sekret OpenAI jest skonfigurowany."
                        : "Worker działa, ale nie widzi sekretu OpenAI.";
                }
                if (apiDiagnosticsText) {
                    apiDiagnosticsText.textContent =
                        `Model Workera: ${data?.model || AI_MODEL_LABEL} • test GET bez kosztu API`;
                }
                log("Test Workera zakończony powodzeniem.");
            } catch (error) {
                state.aiAvailable = false;
                const message = getFriendlyAiError(error);
                if (apiStatusText) apiStatusText.textContent = message;
                log(message, true);
            }
        }

        async function callAI(query) {
            const candidates = buildAiCandidatePool(
                query,
                MAX_AI_CANDIDATES
            );

            const { response, data } = await fetchJsonWithTimeout(
                AI_PROXY_SEARCH_URL,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    cache: "no-store",
                    body: JSON.stringify({ query, candidates })
                },
                AI_REQUEST_TIMEOUT_MS
            );

            if (!response.ok || !data?.ok) {
                const error = new Error(
                    data?.error ||
                    data?.diagnostics?.upstreamCode ||
                    `Worker HTTP ${response.status}`
                );
                error.status =
                    data?.diagnostics?.upstreamStatus ||
                    response.status;
                error.diagnostics = data?.diagnostics || null;
                throw error;
            }

            const diagnostics = {
                ...(data?.diagnostics || {}),
                confidence: Number.isFinite(data?.confidence)
                    ? data.confidence
                    : 0
            };

            state.lastAiDiagnostics = diagnostics;
            renderAiDiagnostics();

            log(
                `AI: ${diagnostics.model || AI_MODEL_LABEL}, ` +
                `${diagnostics.durationMs || 0} ms, ` +
                `${diagnostics.candidateCount || candidates.length} kandydatów.`
            );

            return {
                ids: Array.isArray(data?.ids)
                    ? data.ids.filter(id => typeof id === "string")
                    : [],
                interpretation:
                    typeof data?.reason === "string"
                        ? data.reason.trim()
                        : "",
                confidence: diagnostics.confidence,
                diagnostics
            };
        }

        // Pamiec odpowiedzi AI: to samo (znormalizowane) zapytanie nie jest
        // wysylane ponownie przez 30 dni. Wpis jest ignorowany, gdy zmienila
        // sie baza procedur albo wskazana karta juz nie istnieje.
        function readAiAnswerCacheStore() {
            try {
                const parsed = JSON.parse(
                    localStorage.getItem(AI_ANSWER_CACHE_KEY) || "{}"
                );
                return parsed && typeof parsed === "object" ? parsed : {};
            } catch (error) {
                return {};
            }
        }

        function readAiAnswerCache(query) {
            const key = normalizeText(query);
            if (!key) return null;

            const entry = readAiAnswerCacheStore()[key];
            if (!entry || !Array.isArray(entry.ids)) return null;
            if (entry.fp !== state.procedureFingerprint) return null;
            if (Date.now() - Number(entry.t || 0) > AI_ANSWER_CACHE_TTL_MS) {
                return null;
            }

            const procedures = entry.ids
                .map(id => state.procedury.find(item => item.id === id))
                .filter(Boolean);

            if (procedures.length !== entry.ids.length) return null;

            return {
                procedures,
                interpretation: String(entry.r || "")
            };
        }

        function saveAiAnswerCache(query, ids, interpretation) {
            const key = normalizeText(query);
            if (!key || !ids.length) return;

            const store = readAiAnswerCacheStore();
            store[key] = {
                ids,
                r: interpretation || "",
                fp: state.procedureFingerprint,
                t: Date.now()
            };

            const keys = Object.keys(store);
            if (keys.length > AI_ANSWER_CACHE_MAX) {
                keys
                    .sort((a, b) => Number(store[a].t || 0) - Number(store[b].t || 0))
                    .slice(0, keys.length - AI_ANSWER_CACHE_MAX)
                    .forEach(oldKey => delete store[oldKey]);
            }

            safeStorageSet(AI_ANSWER_CACHE_KEY, JSON.stringify(store));
        }

        function computeProcedureFingerprint(items) {
            // Szybki skrot (djb2) z ID i dlugosci tresci kart.
            const source = items
                .map(item => `${item.id}:${String(item.content || "").length}`)
                .sort()
                .join("|");
            let hash = 5381;
            for (let i = 0; i < source.length; i += 1) {
                hash = ((hash << 5) + hash + source.charCodeAt(i)) >>> 0;
            }
            return hash.toString(36);
        }

        async function resolveProcedures(query) {
            const local = findLocalMatches(query);

            if (
                ["category", "tag", "direct", "confident"].includes(local.kind) &&
                local.procedures.length
            ) {
                return {
                    procedures: local.procedures,
                    source: local.source,
                    interpretation: "",
                    aiError: ""
                };
            }

            if (state.aiEnabled) {
                const cached = readAiAnswerCache(query);
                if (cached) {
                    log("AI: odpowiedź z pamięci urządzenia (bez kosztu).");
                    return {
                        procedures: cached.procedures,
                        source: "Wsparcie AI — zapamiętana odpowiedź",
                        interpretation: cached.interpretation,
                        aiError: ""
                    };
                }

                try {
                    const aiResult = await callAI(query);
                    const allowedIds = new Set(
                        state.procedury.map(item => item.id)
                    );
                    const uniqueIds = [...new Set(
                        aiResult.ids.filter(id => allowedIds.has(id))
                    )];
                    const aiProcedures = uniqueIds
                        .map(id => state.procedury.find(item => item.id === id))
                        .filter(Boolean);

                    if (aiProcedures.length) {
                        saveAiAnswerCache(
                            query,
                            uniqueIds,
                            aiResult.interpretation
                        );
                        return {
                            procedures: aiProcedures,
                            source: "Wsparcie AI — OpenAI",
                            interpretation: aiResult.interpretation,
                            aiError: ""
                        };
                    }

                    if (local.procedures.length) {
                        return {
                            procedures: local.procedures,
                            source: `${local.source} — AI nie wskazało lepszego wyniku`,
                            interpretation: "",
                            aiError: ""
                        };
                    }

                    return {
                        procedures: [],
                        source: "Wsparcie AI — OpenAI",
                        interpretation: aiResult.interpretation,
                        aiError: ""
                    };
                } catch (error) {
                    const friendlyMessage = getFriendlyAiError(error);
                    state.lastAiDiagnostics = error?.diagnostics || null;
                    renderAiDiagnostics();
                    log(friendlyMessage, true);

                    if (local.procedures.length) {
                        return {
                            procedures: local.procedures,
                            source: `${local.source} — tryb awaryjny`,
                            interpretation: "",
                            aiError: friendlyMessage
                        };
                    }

                    return {
                        procedures: [],
                        source: "Brak",
                        interpretation: "",
                        aiError: friendlyMessage
                    };
                }
            }

            return {
                procedures: local.procedures,
                source: local.source,
                interpretation: "",
                aiError: ""
            };
        }

        async function handleCommand(rawQuery) {
            const query = (rawQuery || "").trim();

            if (!query) {
                log("Brak komendy do analizy.", true);
                return;
            }

            hideSuggestions();
            clearNotice();
            state.openedFromList = false;
            state.listViewShown = false;
            userInputDisplay.textContent = query;
            manualQuery.value = "";
            log(`Analiza: ${query}`);

            // Zapytanie do AI moze trwac do 30 s. Gdy wynik nie jest gotowy
            // po 300 ms, pokazujemy, ze aplikacja pracuje.
            const busyTimer = setTimeout(() => {
                stopReading();
                setResultMode(false);
                procedureOutput.innerHTML =
                    `<div class="empty-state searching">Szukam: ${escapeHtml(query)}…</div>`;
            }, 300);

            let result;
            try {
                result = await resolveProcedures(query);
            } finally {
                clearTimeout(busyTimer);
            }
            const procedures = result.procedures || [];

            if (!procedures.length) {
                if (result.aiError) {
                    renderEmptyState(result.aiError);
                } else {
                    renderEmptyState(
                        "Brak wyników w lokalnej bazie. Spróbuj użyć bardziej szczegółowego opisu."
                    );
                }
                return;
            }

            if (procedures.length === 1) {
                renderProcedure(
                    procedures[0],
                    result.source,
                    { fromList: false }
                );
                return;
            }

            renderProcedureChoices(
                procedures,
                query,
                result.source,
                result.interpretation
            );
        }

        function openKeyboardVoiceFallback(reason = "") {
            resetListeningUi();
            manualQuery.focus();
            manualQuery.click();
            if (reason) log(reason, true);
            log("Użyj mikrofonu z klawiatury telefonu w polu wpisywania.");
        }

        function openIosSearchFromButton() {
            resetListeningUi();
            clearIosInputSubmitTimer();
            manualQuery.value = "";
            userInputDisplay.textContent = "";
            manualQuery.focus();
            manualQuery.click();
            try { manualQuery.setSelectionRange(0, 0); } catch (error) {}
            manualQuery.scrollIntoView({ block: "center", behavior: "smooth" });
            log("iOS: pole Szukaj aktywne. Użyj mikrofonu z klawiatury.");
        }

        function buildRecognition() {
            if (state.recognition) return state.recognition;

            const Recognition = getRecognitionCtor();
            if (!Recognition) return null;

            const recognition = new Recognition();
            recognition.lang = "pl-PL";
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                state.recognitionActive = true;
                state.isListening = true;
                state.isBusy = true;
                state.hasSpeechResult = false;

                micBtn.classList.add("listening");
                updateMicPresentation("Nasłuch…");
                log("Mów teraz…");

                clearListeningWatchdog();
                state.listenWatchdogId = setTimeout(() => {
                    if (!state.hasSpeechResult && state.recognitionActive) {
                        try {
                            recognition.abort();
                        } catch (error) {}
                    }
                }, 8000);
            };

            recognition.onaudiostart = () => {
                log("Mikrofon aktywny.");
            };

            recognition.onspeechstart = () => {
                log("Wykryto mowę.");
            };

            recognition.onspeechend = () => {
                try {
                    recognition.stop();
                } catch (error) {}
            };

            recognition.onresult = event => {
                state.hasSpeechResult = true;
                clearListeningWatchdog();

                const transcript = (
                    event.results?.[0]?.[0]?.transcript || ""
                ).trim().toLowerCase();

                userInputDisplay.textContent = transcript;

                // Silnik może jeszcze pozostawać aktywny do zdarzenia onend.
                // Zostawiamy recognitionActive=true, aby kolejne kliknięcie
                // nie uruchomiło go drugi raz.
                resetListeningUi();
                handleCommand(transcript);
            };

            recognition.onerror = event => {
                clearListeningWatchdog();

                const code = event.error || "unknown";
                state.isListening = false;
                state.isBusy = false;
                micBtn.classList.remove("listening");
                updateMicPresentation("Rozkaz");

                if (
                    code === "not-allowed" ||
                    code === "service-not-allowed"
                ) {
                    state.microphonePermissionDenied = true;
                    setMicEnabled(true);
                    manualQuery.focus();
                    log(
                        "Brak zgody na mikrofon. Zezwól na mikrofon w ustawieniach strony albo użyj pola Szukaj.",
                        true
                    );
                    return;
                }

                if (code === "audio-capture") {
                    setMicEnabled(true);
                    manualQuery.focus();
                    log(
                        "Mikrofon jest niedostępny lub używa go inna aplikacja.",
                        true
                    );
                    return;
                }

                if (code === "no-speech") {
                    setMicEnabled(true);
                    log(
                        "Nie wykryto mowy. Kliknij Rozkaz i spróbuj ponownie.",
                        true
                    );
                    return;
                }

                setMicEnabled(true);
                log(`Błąd mikrofonu: ${code}`, true);
            };

            recognition.onend = () => {
                clearListeningWatchdog();
                finishRecognitionCycle();
            };

            state.recognition = recognition;
            return recognition;
        }

        async function startListening() {
            if (
                state.recognitionActive ||
                state.isListening ||
                state.isBusy
            ) {
                return;
            }

            if (IS_IOS) {
                openIosSearchFromButton();
                return;
            }

            if (state.microphonePermissionDenied) {
                manualQuery.focus();
                log(
                    "Mikrofon jest zablokowany. Zmień uprawnienie strony na „Zezwalaj” i odśwież aplikację.",
                    true
                );
                return;
            }

            const recognition = buildRecognition();

            if (!recognition) {
                openKeyboardVoiceFallback(
                    "To urządzenie nie obsługuje rozpoznawania mowy w przeglądarce."
                );
                return;
            }

            if (!window.isSecureContext) {
                log(
                    "Mikrofon wymaga strony HTTPS.",
                    true
                );
                return;
            }

            state.recognitionActive = true;
            state.isBusy = true;
            setMicEnabled(false);

            try {
                recognition.start();
            } catch (error) {
                const isAlreadyStarted =
                    error?.name === "InvalidStateError" ||
                    /already started/i.test(error?.message || "");

                if (isAlreadyStarted) {
                    try {
                        recognition.abort();
                    } catch (abortError) {}

                    state.recognition = null;

                    setTimeout(() => {
                        finishRecognitionCycle();
                    }, 250);

                    log(
                        "Mikrofon był jeszcze aktywny. Został zresetowany — kliknij Rozkaz ponownie.",
                        true
                    );
                    return;
                }

                state.recognitionActive = false;
                resetListeningUi();
                manualQuery.focus();

                log(
                    `Nie udało się uruchomić mikrofonu: ${error.message || "nieznany błąd"}`,
                    true
                );
            }
        }

        // Ustawienia uzytkownika zapisywane na urzadzeniu.
        const PREFS_KEY = "kdr_ai_prefs_v1";

        function readPrefs() {
            try {
                const parsed = JSON.parse(safeStorageGet(PREFS_KEY) || "{}");
                return parsed && typeof parsed === "object" ? parsed : {};
            } catch (error) {
                return {};
            }
        }

        function savePref(name, value) {
            const prefs = readPrefs();
            prefs[name] = value;
            safeStorageSet(PREFS_KEY, JSON.stringify(prefs));
        }

        function applyPreferences() {
            const prefs = readPrefs();
            state.aiEnabled = prefs.ai !== false;
            document.body.classList.toggle("large-text", prefs.largeText === true);
            document.body.classList.toggle("high-contrast", prefs.contrast === true);
            if (aiToggle) aiToggle.checked = state.aiEnabled;
            if (largeTextToggle) largeTextToggle.checked = prefs.largeText === true;
            if (contrastToggle) contrastToggle.checked = prefs.contrast === true;
        }

        function toggleSettingsPanel() {
            const willOpen = settingsPanel.classList.contains("hidden");
            settingsPanel.classList.toggle("hidden", !willOpen);
            settingsBtn.setAttribute("aria-expanded", String(willOpen));
            settingsBtn.classList.toggle("active", willOpen);
            if (willOpen) renderAiDiagnostics();
        }

        function updateInstallButton() {
            if (!installBtn) return;
            const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
            if (standalone) {
                installBtn.classList.add("hidden");
                installBtn.classList.remove("install-ready");
                return;
            }

            installBtn.classList.remove("hidden");
            const canPrompt = Boolean(state.deferredInstallPrompt);
            installBtn.classList.toggle("install-ready", canPrompt);
            installBtn.textContent = canPrompt ? "Zainstaluj aplikację" : "Instalacja";
        }

        function showInstallHelp() {
            const lines = [
                "1. Aby inni mieli aplikację jak na pulpicie, udostępnij im link HTTPS do tej strony.",
                "2. Android (Chrome): menu → Zainstaluj aplikację / Dodaj do ekranu głównego.",
                "3. iPhone (Safari): Udostępnij → Do ekranu początkowego.",
                "4. Komputer (Chrome/Edge): ikona instalacji w pasku adresu albo przycisk „Zainstaluj aplikację”."
            ].map(line => `<span class=\"procedure-line\">${escapeHtml(line)}</span>`).join("");

            procedureOutput.innerHTML = `
                <div class="source-badge">Instalacja PWA</div>
                <div class="procedure-prefix">Instrukcja udostępniania i instalacji</div>
                <div class="procedure-card">${lines}</div>
            `;
            state.listViewShown = false;
            state.openedFromList = false;
            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        async function handleInstallClick() {
            if (state.deferredInstallPrompt) {
                try {
                    state.deferredInstallPrompt.prompt();
                    await state.deferredInstallPrompt.userChoice;
                } catch (error) {}
                state.deferredInstallPrompt = null;
                updateInstallButton();
                return;
            }
            showInstallHelp();
        }

        function openFeedbackForm() {
            try {
                window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
            } catch (error) {
                location.href = FEEDBACK_FORM_URL;
            }
        }

        // Lista wszystkich procedur pogrupowana wg kategorii.
        // Usunieto automatyczne "hasla" (np. butla2) i przycisk Kopiuj:
        // byly mylace, a karte otwiera sie jednym kliknieciem nazwy.
        function showAllProcedures() {
            if (!state.procedury.length) {
                renderEmptyState("Brak załadowanych procedur");
                return;
            }

            stopReading();
            state.view = "list";

            const sections = [...PROCEDURE_GROUPS, OTHER_GROUP]
                .map(group => ({ group, items: getGroupProcedures(group.key) }))
                .filter(section => section.items.length)
                .map(({ group, items }) => {
                    const rows = items.map(procedure => `
                        <div class="proc-row">
                            <button class="proc-open" type="button" data-open-id="${escapeHtml(procedure.id)}" data-return="procedure-list">${escapeHtml(procedure.prefix || procedure.id)}</button>
                        </div>
                    `).join("");
                    return `
                        <h2 class="list-group-title${group.key === "olioc" ? " group-edu" : ""}">${escapeHtml(group.label)} <span>${items.length}</span></h2>
                        ${rows}
                    `;
                }).join("");

            procedureOutput.innerHTML = `
                <div class="source-badge">Wszystkie procedury — ${state.procedury.length}</div>
                <div class="procedure-prefix">Kliknij nazwę, aby otworzyć kartę.</div>
                <div class="procedure-card procedure-list">${sections}</div>
            `;
            state.listViewShown = true;
            state.openedFromList = false;
            state.returnTarget = "";
            resetBtn.textContent = "Powrót";
            setResultMode(true);
            procedureScrollArea.scrollTop = 0;
        }

        // ===== Podpowiedzi podczas pisania (lokalnie, bez AI) =====
        const SUGGEST_LIMIT = 5;

        function buildSuggestIndex() {
            state.suggestIndex = state.procedury.map(procedure => ({
                procedure,
                isEdu: getProcedureGroup(procedure).key === "olioc",
                words: [...new Set(normalizeText([
                    procedure.prefix || "",
                    procedure.slowo_kluczowe || "",
                    ...(procedure.aliasy || procedure.keywords || []),
                    ...(procedure.tagi_wspolne || [])
                ].join(" ")).split(" ").filter(Boolean))]
            }));
        }

        function suggestProcedures(query) {
            const normalized = normalizeText(query);
            if (normalized.length < 2) return [];
            if (!state.suggestIndex) buildSuggestIndex();

            const tokens = normalized.split(" ").filter(Boolean);

            return state.suggestIndex
                .map(entry => {
                    let score = 0;
                    for (const token of tokens) {
                        if (entry.words.includes(token)) score += 30;
                        else if (entry.words.some(word => word.startsWith(token))) score += 20;
                        else return { entry, score: 0 };
                    }
                    // Karty operacyjne przed edukacyjnymi przy rownym dopasowaniu.
                    if (entry.isEdu) score -= 5;
                    return { entry, score };
                })
                .filter(result => result.score > 0)
                .sort((a, b) =>
                    b.score - a.score ||
                    String(a.entry.procedure.prefix).length - String(b.entry.procedure.prefix).length
                )
                .slice(0, SUGGEST_LIMIT)
                .map(result => result.entry.procedure);
        }

        function hideSuggestions() {
            state.suggestions = [];
            state.suggestActive = -1;
            suggestList.innerHTML = "";
            suggestList.classList.add("hidden");
            manualQuery.setAttribute("aria-expanded", "false");
        }

        function renderSuggestions() {
            const items = suggestProcedures(manualQuery.value);
            state.suggestions = items;
            state.suggestActive = -1;

            if (!items.length) {
                hideSuggestions();
                return;
            }

            suggestList.innerHTML = items.map((procedure, index) => {
                const group = getProcedureGroup(procedure);
                return `
                    <button class="suggest-item" type="button" role="option" data-suggest-index="${index}">
                        <span class="suggest-title">${escapeHtml(shortTitle(procedure))}</span>
                        <span class="suggest-meta">${escapeHtml(group.label)}</span>
                    </button>
                `;
            }).join("");
            suggestList.classList.remove("hidden");
            manualQuery.setAttribute("aria-expanded", "true");
        }

        function highlightSuggestion(index) {
            const buttons = suggestList.querySelectorAll(".suggest-item");
            buttons.forEach((button, i) => button.classList.toggle("active", i === index));
            state.suggestActive = index;
        }

        function openSuggestion(index) {
            const procedure = state.suggestions?.[index];
            if (!procedure) return;
            clearIosInputSubmitTimer();
            hideSuggestions();
            manualQuery.value = "";
            clearNotice();
            userInputDisplay.textContent = "";
            renderProcedure(procedure, "Podpowiedź", { returnTarget: "home" });
        }

        function goHome() {
            stopReading();
            hideSuggestions();
            clearNotice();
            userInputDisplay.textContent = "";
            state.lastSearchResults = [];
            state.lastSearchQuery = "";
            state.lastSearchSource = "";
            state.lastSearchInterpretation = "";
            state.lastSearchOptions = {};
            resetBtn.textContent = "Powrót";
            resetListeningUi();
            clearIosInputSubmitTimer();
            manualQuery.value = "";
            renderHome();
        }

        manualForm.addEventListener("submit", event => {
            event.preventDefault();
            clearIosInputSubmitTimer();
            if (state.suggestActive >= 0) {
                openSuggestion(state.suggestActive);
                return;
            }
            hideSuggestions();
            clearNotice();
            handleCommand(manualQuery.value);
        });

        manualQuery.addEventListener("input", () => {
            clearTimeout(state.suggestTimer);
            state.suggestTimer = setTimeout(renderSuggestions, 120);

            if (!IS_IOS) return;
            // iOS: dyktowanie z klawiatury nie konczy sie Enterem, wiec
            // wysylamy po pauzie. 2,5 s zamiast 1,2 s, aby nie ucinac
            // zapytania w polowie zdania.
            clearIosInputSubmitTimer();
            const value = manualQuery.value.trim();
            if (!value) return;
            state.iosInputSubmitTimer = setTimeout(() => {
                if (!manualQuery.value.trim()) return;
                hideSuggestions();
                handleCommand(manualQuery.value);
            }, IOS_AUTO_SUBMIT_MS);
        });

        manualQuery.addEventListener("keydown", event => {
            const count = state.suggestions?.length || 0;
            if (event.key === "Escape") {
                hideSuggestions();
                return;
            }
            if (!count) return;
            if (event.key === "ArrowDown") {
                event.preventDefault();
                highlightSuggestion((state.suggestActive + 1) % count);
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                highlightSuggestion(state.suggestActive <= 0 ? count - 1 : state.suggestActive - 1);
            }
        });

        manualQuery.addEventListener("blur", () => {
            setTimeout(hideSuggestions, 150);
        });

        // mousedown zapobiega utracie fokusu pola przed kliknieciem podpowiedzi
        suggestList.addEventListener("mousedown", event => event.preventDefault());
        suggestList.addEventListener("click", event => {
            const item = event.target.closest("[data-suggest-index]");
            if (!item) return;
            openSuggestion(Number(item.getAttribute("data-suggest-index")));
        });

        procedureOutput.addEventListener("click", event => {
            const groupBtn = event.target.closest("[data-group]");
            if (groupBtn) {
                clearNotice();
                userInputDisplay.textContent = "";
                showGroup(groupBtn.getAttribute("data-group") || "");
                return;
            }

            const actionBtn = event.target.closest("[data-action]");
            if (actionBtn) {
                const procedure = state.procedury.find(
                    item => item.id === state.currentProcedureId
                );
                if (!procedure) return;
                const action = actionBtn.getAttribute("data-action");

                if (action === "favorite") {
                    const on = toggleFavorite(procedure.id);
                    actionBtn.classList.toggle("is-on", on);
                    actionBtn.setAttribute("aria-pressed", String(on));
                    actionBtn.textContent = on ? "★ W ulubionych" : "☆ Dodaj do ulubionych";
                } else if (action === "read") {
                    readProcedureAloud(procedure, actionBtn);
                }
                return;
            }

            const searchResultBtn = event.target.closest("[data-search-id]");
            if (searchResultBtn) {
                const procedureId =
                    searchResultBtn.getAttribute("data-search-id") || "";

                const procedure = state.procedury.find(
                    item => item.id === procedureId
                );

                if (!procedure) {
                    renderEmptyState("Brak danych");
                    return;
                }

                renderProcedure(
                    procedure,
                    "Wybrano z wyników",
                    {
                        fromList: true,
                        returnTarget: "search-results"
                    }
                );
                return;
            }

            const openBtn = event.target.closest("[data-open-id]");
            if (!openBtn) return;
            const procedureId = openBtn.getAttribute("data-open-id") || "";
            if (!procedureId) return;
            clearNotice();
            userInputDisplay.textContent = "";

            const returnTarget = openBtn.getAttribute("data-return") || "home";
            if (returnTarget === "procedure-list") {
                openProcedureFromList(procedureId);
                return;
            }

            const procedure = state.procedury.find(item => item.id === procedureId);
            if (procedure) {
                renderProcedure(procedure, "Ekran startowy", { returnTarget: "home" });
            }
        });

        micBtn.addEventListener("click", startListening);
        settingsBtn.addEventListener("click", toggleSettingsPanel);
        aiToggle.addEventListener("change", () => {
            state.aiEnabled = aiToggle.checked;
            savePref("ai", state.aiEnabled);
            updateApiButton();
        });
        largeTextToggle.addEventListener("change", () => {
            savePref("largeText", largeTextToggle.checked);
            applyPreferences();
        });
        contrastToggle.addEventListener("change", () => {
            savePref("contrast", contrastToggle.checked);
            applyPreferences();
        });
        apiSaveBtn.addEventListener("click", testAiConnection);
        voiceHelpBtn.addEventListener("click", () => {
            clearNotice();
            userInputDisplay.textContent = "";
            showAllProcedures();
        });
        installBtn.addEventListener("click", handleInstallClick);
        feedbackBtn.addEventListener("click", openFeedbackForm);
        
        resetBtn.addEventListener("click", () => {
            stopReading();

            if (
                state.view === "procedure" &&
                state.returnTarget === "search-results" &&
                state.lastSearchResults.length
            ) {
                const procedures = idsToProcedures(state.lastSearchResults);

                if (procedures.length) {
                    const query = state.lastSearchQuery;
                    renderProcedureChoices(
                        procedures,
                        query,
                        state.lastSearchSource,
                        state.lastSearchInterpretation,
                        state.lastSearchOptions || {}
                    );

                    if (!state.lastSearchOptions?.heading) {
                        manualQuery.value = query;
                    }
                    return;
                }
            }

            if (
                state.view === "procedure" &&
                state.returnTarget === "procedure-list"
            ) {
                showAllProcedures();
                return;
            }

            goHome();
        });

        window.addEventListener("pagehide", () => {
            clearListeningWatchdog();
            clearIosInputSubmitTimer();

            if (state.recognition && state.recognitionActive) {
                try {
                    state.recognition.abort();
                } catch (error) {}
            }

            state.recognitionActive = false;
        });

        if ("serviceWorker" in navigator && /^https?:$/i.test(location.protocol)) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }

        window.addEventListener("beforeinstallprompt", event => {
            event.preventDefault();
            state.deferredInstallPrompt = event;
            updateInstallButton();
        });

        window.addEventListener("appinstalled", () => {
            state.deferredInstallPrompt = null;
            updateInstallButton();
            log("Aplikacja zainstalowana.");
        });

        bootstrapApp();
    </script>
</body>
</html>
