name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol >/dev/null
          rm -rf tmp-adr; mkdir -p tmp-adr/wyc && cd tmp-adr
          cut(){ act=$1; n=$2; f=$3; l=$4; src=D20250${act}-$n.pdf
            [ -f $src ] || curl -sSL --retry 2 -A "Mozilla/5.0" -o $src "https://eli.gov.pl/api/acts/DU/2025/${act}/text/I/$src"
            pdfseparate -f $f -l $l $src p-%03d.pdf && pdfunite $(ls p-*.pdf | sort) wyc/${act}-${n}-s${f}-${l}.pdf; rm -f p-*.pdf; }
          cut 642 19 25 50
          cut 642 20 1 50
          cut 593 05 60 130
          rm -f D2025*.pdf; ls -la wyc
      - name: Zapisz
        if: always()
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add -A tmp-adr && git commit -m "Tymczasowe: adr-wyc" && git push
