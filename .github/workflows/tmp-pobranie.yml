name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-rozp && cd tmp-rozp && rm -f log.txt
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get ksrg-2026.pdf "https://api.sejm.gov.pl/eli/acts/DU/2026/872/text.pdf"
          get ksrg-2021.pdf "https://api.sejm.gov.pl/eli/acts/DU/2021/1737/text.pdf"
          get wlaczanie-2026.pdf "https://api.sejm.gov.pl/eli/acts/DU/2026/847/text.pdf"
          get ksrg-2026-dz.pdf "https://dziennikustaw.gov.pl/D2026000087201.pdf"
          get ksrg-2026-info.json "https://api.sejm.gov.pl/eli/acts/DU/2026/872"
          get ksrg-2021-info.json "https://api.sejm.gov.pl/eli/acts/DU/2021/1737"
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-rozp && git commit -m "Tymczasowe: rozp2" && git push
