name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-wys && cd tmp-wys
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "https://www.gov.pl/attachment/$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get wys-2024.pdf 4ab892ae-f760-4bfc-af6c-b118fa9843fd
          curl -sSL -A "Mozilla/5.0" -o wod.html https://www.gov.pl/web/kgpsp/zasady-organizacji-rat-wodne
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-wys && git commit -m "Tymczasowe: wys" && git push
