name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-strony && cd tmp-strony
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "https://www.gov.pl/attachment/$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          for pg in ratownictwo-wodne ratownictwo-wysokosciowe zasady-organizacji-rat-wod zasady-organizacji-rat-wys; do curl -sSL -A "Mozilla/5.0" -o $pg.html https://www.gov.pl/web/kgpsp/$pg; echo "$pg.html $(stat -c%s $pg.html)" >> log.txt; done
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-strony && git commit -m "Tymczasowe: strony" && git push
