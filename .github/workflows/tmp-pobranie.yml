name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-aux && cd tmp-aux && rm -f log.txt
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get bsp-v2.pdf "https://www.gov.pl/attachment/367e9dfb-d5de-4e15-a386-995dfbdcad2e"
          get bsp-prezentacja.pdf "https://www.gov.pl/attachment/7620f67f-45bb-42b1-959a-211e3bcec659"
          get chem-eko-2025.pdf "https://www.gov.pl/attachment/89034c06-f751-4b01-9f8c-683b80e34eb5"
          get chem-eko-zal11.pdf "https://www.gov.pl/attachment/01a80975-659b-4bcf-88d4-42c11189d7a1"
          get chem-strona.html "https://www.gov.pl/web/kgpsp/zasady-organizacji-rat-chem-eko"
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-aux && git commit -m "Tymczasowe: aux" && git push
