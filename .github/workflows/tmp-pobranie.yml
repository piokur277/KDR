name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-dpr && cd tmp-dpr
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "https://www.gov.pl/attachment/$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get dpr-2023.pdf 7f89f4f6-187a-42cf-bb01-77653c99a335
          get dpr-zal12-metodyka-bezpieczenstwa.pdf 59ec5a52-70b4-448b-932c-d0a90555d921
          curl -sSL -A "Mozilla/5.0" -o dpr.html https://www.gov.pl/web/kgpsp/zasady-organizacji-dpr
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-dpr && git commit -m "Tymczasowe: dpr" && git push
