name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-olioc3 && cd tmp-olioc3 && rm -f log.txt
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get efsa-blackout.pdf "https://www.gov.pl/attachment/39db4a4b-e8fd-4875-939c-d5a6b6bf0afe"
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-olioc3 && git commit -m "Tymczasowe: olioc3" && git push
