name: tmp-pobranie
on:
  push:
    branches: [tmp-pobranie-sztab]
permissions:
  contents: write
jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz
        run: |
          mkdir -p tmp-olioc2 && cd tmp-olioc2 && rm -f log.txt
          get(){ curl -sSL --retry 3 -A "Mozilla/5.0" -o "$1" "$2" && echo "$1 $(stat -c%s "$1") $(file -b "$1" | cut -c1-40)" >> log.txt; }
          get poradnik.pdf "https://www.gov.pl/attachment/fa491036-8872-457c-95e4-d1292e4a8203"
          get karta-planu-rodzinnego.pdf "https://www.gov.pl/attachment/819526f0-4cc4-49bc-be14-37799d75fdae"
          get pakiet-uczniowski.pdf "https://www.gov.pl/attachment/525423fd-0e11-4756-8263-20806e7c6a34"
          get sygnal-alarmowy.pdf "https://www.gov.pl/attachment/9bb63c3d-bc74-4fa0-b90b-2aeff45a2b6f"
          get instrukcja-reagowania.pdf "https://www.gov.pl/attachment/cc2d0058-e5f9-4ed6-b583-a08ea4bac5af"
          get alert-rcb.pdf "https://www.gov.pl/attachment/112b807a-416d-437d-b391-66dbd5e4a844"
          cat log.txt
      - name: Zapisz
        run: |
          git config user.name tmp && git config user.email tmp@users.noreply.github.com
          git add tmp-olioc2 && git commit -m "Tymczasowe: olioc2" && git push
